name: Onion Code Review (Claude)

# Revisor de PR NATIVO do Sistema Onion — Claude + doutrina do @metaspec-gate-keeper.
# Complementa o linter determinístico (onion-validate.yml) com a checagem SEMÂNTICA
# de conformidade. Substitui o antigo revisor de terceiros baseado em GPT-4o
# (removido), alinhando o CI ao lineup Claude-only do framework.
#
# Pré-requisitos (configurar uma vez):
#   1. Secret ANTHROPIC_API_KEY em Settings -> Secrets and variables -> Actions.
#   2. GitHub App do Claude instalado (`/install-github-app` no Claude Code, ou
#      https://github.com/apps/claude).
# Sem o secret, o step de review é pulado (degrada graciosamente); o linter
# determinístico segue cobrindo estrutura/YAML/naming.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  id-token: write   # exigido pela claude-code-action@v1 (token OIDC)

jobs:
  onion-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Forks não têm acesso a secrets — pular para evitar check falho.
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # RESILIÊNCIA (2026-07-14): continue-on-error faz um CRASH do agente (is_error)
      # NÃO reprovar o PR. Motivo (achado por dogfood): este job só fica VERMELHO quando
      # o revisor não consegue rodar — nunca quando acha violações (essas viram comentários
      # inline e o job sai verde). Logo, reprovar por is_error bloqueia o PR pelo crash do
      # bot, carregando ZERO informação sobre o código. O gate de qualidade duro é o
      # determinístico (onion-validate.yml); a revisão semântica é advisory-quando-roda.
      - name: Revisor Onion (gate-keeper + code review)
        id: review
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        continue-on-error: true
        # PINADO em v1.0.183 (2026-07-25). HISTÓRICO — o pin anterior era v1.0.171, posto em
        # 2026-07-18 sob a hipótese "a regressão veio da v1.0.172+, lançada em 07-14, mesmo dia
        # em que o revisor passou a crashar". Essa hipótese NÃO SOBREVIVEU: medido em 2026-08-03,
        # com o v1.0.171 no lugar, 4 runs seguidas deram `is_error: true`, `num_turns: 1`,
        # `cost: 0` — o pin não curava nada. Verificado no mesmo dia que API e modelo estão sãos
        # (claude-sonnet-5 responde HTTP 200 fora do CI) e que a assinatura da falha é HANG de
        # ~186s, não recusa de credencial (401 volta instantâneo). Sobra o eixo action-no-runner.
        # Subir o pin é o experimento controlado seguinte — e agora ele SE MEDE SOZINHO: o
        # review-verdict.sh carimba o resumo do job nos dois desfechos, então o resultado não
        # some no verde como sumiu por semanas.
        # Contrato verificado antes de trocar: `execution_file` segue existindo como output e
        # segue sendo array JSON (`JSON.stringify(messages, null, 2)`), e prompt/anthropic_api_key/
        # claude_args seguem válidos — o review-verdict.sh depende dos três.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Você é o revisor nativo do Sistema Onion. Revise o diff deste Pull Request
            aplicando a doutrina do @metaspec-gate-keeper contra a constituição em
            docs/meta-specs/ (descubra as meta-specs dinamicamente; não assuma nomes fixos):

            - Conformidade com agents.md, commands.md, architecture.md, code-standards.md,
              integrations.md — cite a regra como `meta-spec:linha` ao apontar violação.
            - Regras de ORQUESTRAÇÃO (commands.md §10): orquestração reside em skill/comando, NUNCA
              em agente (architecture.md §4.2); invariante de workflows faseados preservada;
              resiliência exigida quando há fan-out (falha parcial, timeout, fan-in, fallback).
            - Código/idioma (code-standards.md): pt-BR em docs/conteúdo, inglês em código/commits;
              use famílias Claude por tier (opus/sonnet/haiku/fable) — sinalize modelos RETIRADOS
              (Claude 3.x) ou de outro provider (gpt/gemini/llama) citados como modelo de agente.
            - Ausência de vaporware (ex.: `mcp_onion-orchestrator`).

            Poste comentários inline nos pontos problemáticos, citando a regra e a evidência.
            Seja conciso e factual; se o diff estiver conforme, aprove explicitamente.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 8

      # ═══ O SINAL VERDADEIRO (2026-08-03) ═══
      # `steps.review.outcome` MENTE: a action sai com exit 0 mesmo quando o agente morre —
      # o log de uma run que custou 0 e deu 1 turno registra `outcome=success;conclusion=success`
      # com `is_error: true` DENTRO do JSON. Enquanto o retry e o aviso abaixo liam o outcome,
      # NENHUM DOS DOIS disparou uma única vez: medido em 4 runs de 2026-08-03 (03:34, 12:10,
      # 17:11, 19:17), todas com is_error=true e ZERO comentários em qualquer PR. Onze PRs
      # mergearam naquele dia sob um revisor que não leu nada, e o CI dizia verde.
      # A leitura vive em script TESTÁVEL (o YAML não tem selftest — foi assim que a máquina
      # quebrada sobreviveu meses parecendo sã).
      - name: Veredito da 1ª tentativa (is_error, não o outcome)
        id: v1
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: bash .claude/validation/review-verdict.sh "${EXEC_FILE}" >> "${GITHUB_OUTPUT}"

      # RETRY (2026-07-14): o crash do revisor é TRANSITÓRIO (rate-limit/overload sob carga —
      # diagnosticado: o mesmo diff que "sempre crashava" passa quando o CI está quieto, e
      # revisa liso localmente). Logo, uma 2ª tentativa quase sempre vira revisão REAL, em vez
      # de soft-passar sem revisar. Só roda se a 1ª NÃO revisou. Mesma config do step acima.
      - name: Revisor Onion (retry — só se a 1ª tentativa não revisou)
        id: review2
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' && steps.v1.outputs.revisou != 'true' }}
        continue-on-error: true
        # PINADO em v1.0.183 (2026-07-25). HISTÓRICO — o pin anterior era v1.0.171, posto em
        # 2026-07-18 sob a hipótese "a regressão veio da v1.0.172+, lançada em 07-14, mesmo dia
        # em que o revisor passou a crashar". Essa hipótese NÃO SOBREVIVEU: medido em 2026-08-03,
        # com o v1.0.171 no lugar, 4 runs seguidas deram `is_error: true`, `num_turns: 1`,
        # `cost: 0` — o pin não curava nada. Verificado no mesmo dia que API e modelo estão sãos
        # (claude-sonnet-5 responde HTTP 200 fora do CI) e que a assinatura da falha é HANG de
        # ~186s, não recusa de credencial (401 volta instantâneo). Sobra o eixo action-no-runner.
        # Subir o pin é o experimento controlado seguinte — e agora ele SE MEDE SOZINHO: o
        # review-verdict.sh carimba o resumo do job nos dois desfechos, então o resultado não
        # some no verde como sumiu por semanas.
        # Contrato verificado antes de trocar: `execution_file` segue existindo como output e
        # segue sendo array JSON (`JSON.stringify(messages, null, 2)`), e prompt/anthropic_api_key/
        # claude_args seguem válidos — o review-verdict.sh depende dos três.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Você é o revisor nativo do Sistema Onion. Revise o diff deste Pull Request
            aplicando a doutrina do @metaspec-gate-keeper contra a constituição em
            docs/meta-specs/ (descubra as meta-specs dinamicamente; não assuma nomes fixos):

            - Conformidade com agents.md, commands.md, architecture.md, code-standards.md,
              integrations.md — cite a regra como `meta-spec:linha` ao apontar violação.
            - Regras de ORQUESTRAÇÃO (commands.md §10): orquestração reside em skill/comando, NUNCA
              em agente (architecture.md §4.2); invariante de workflows faseados preservada;
              resiliência exigida quando há fan-out (falha parcial, timeout, fan-in, fallback).
            - Código/idioma (code-standards.md): pt-BR em docs/conteúdo, inglês em código/commits;
              use famílias Claude por tier (opus/sonnet/haiku/fable) — sinalize modelos RETIRADOS
              (Claude 3.x) ou de outro provider (gpt/gemini/llama) citados como modelo de agente.
            - Ausência de vaporware (ex.: `mcp_onion-orchestrator`).

            Poste comentários inline nos pontos problemáticos, citando a regra e a evidência.
            Seja conciso e factual; se o diff estiver conforme, aprove explicitamente.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 8

      - name: Veredito da 2ª tentativa (is_error, não o outcome)
        id: v2
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' && steps.review2.outcome != 'skipped' }}
        env:
          EXEC_FILE: ${{ steps.review2.outputs.execution_file }}
        run: bash .claude/validation/review-verdict.sh "${EXEC_FILE}" >> "${GITHUB_OUTPUT}"

      # RASTRO SEMPRE (2026-08-03) — o pedido que originou esta correção: "verde revisado" e
      # "verde sem revisar" eram INDISTINGUÍVEIS de fora. Este step roda nos dois desfechos e
      # carimba o resumo do job, então o estado da revisão é legível sem abrir log nenhum.
      - name: Rastro do veredito (o verde diz QUAL verde é)
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          R1: ${{ steps.v1.outputs.revisou }}
          M1: ${{ steps.v1.outputs.motivo }}
          T1: ${{ steps.v1.outputs.turnos }}
          R2: ${{ steps.v2.outputs.revisou }}
          M2: ${{ steps.v2.outputs.motivo }}
          T2: ${{ steps.v2.outputs.turnos }}
        run: |
          if [ "${R1}" = "true" ] || [ "${R2}" = "true" ]; then
            turnos="${T1}"; [ "${R2}" = "true" ] && turnos="${T2}"
            echo "::notice::onion-review REVISOU este PR (${turnos} turnos). Ausência de comentários = nada a apontar."
            echo "✅ **onion-review revisou** — ${turnos} turnos. Sem comentários significa **nada a apontar**." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "⚠️ **onion-review NÃO revisou** — 1ª: \`${M1:-nao-rodou}\` · 2ª: \`${M2:-nao-rodou}\`. Este verde é soft-pass." >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Só soft-passa se NENHUMA das tentativas revisou. Avisa de forma VISÍVEL (annotation +
      # comentário no PR) e passa verde: um crash produz ZERO veredito sobre o código, então
      # bloquear o PR puniria o autor pela falha do bot. Mas o humano VÊ que não houve revisão.
      # A condição lê o veredito (`revisou`), nunca o outcome do step — ver o bloco do v1.
      - name: Aviso se nenhuma tentativa revisou (soft-pass, não bloqueia)
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' && steps.v1.outputs.revisou != 'true' && steps.v2.outputs.revisou != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M1: ${{ steps.v1.outputs.motivo }}
          M2: ${{ steps.v2.outputs.motivo }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # CAUSA CONHECIDA E BENIGNA (medida no PR #529, o primeiro a exercitar este aviso):
          # a claude-code-action SE RECUSA a rodar quando o workflow do PR difere do que está
          # na branch default ("Skipping action due to workflow validation") — proteção dela
          # contra um PR que reescreve o próprio revisor. Sem nomear isso, TODO PR que edite
          # este arquivo dispararia alarme sem haver defeito, e alarme impreciso é como um
          # alarme morre — o mesmo motivo pelo qual o critério do review-verdict.sh é estreito.
          nota=""
          if git diff --name-only "${BASE_SHA}" HEAD | grep -q '^\.github/workflows/onion-review\.yml$'; then
            nota=" _Causa provável: este PR altera o próprio \`onion-review.yml\`, e a action se auto-pula quando o workflow difere da branch default. **Esperado aqui** — o caminho real volta a ser exercido no PR seguinte ao merge._"
            echo "::notice::o alarme acima tem causa conhecida: este PR edita o próprio workflow, e a action se auto-pula nesse caso."
          fi
          echo "::warning::onion-review não revisou após 2 tentativas (1ª: ${M1:-nao-rodou} · 2ª: ${M2:-nao-rodou}) — nenhum veredito produzido. Revise manualmente. O gate determinístico (onion-validate) segue valendo."
          gh pr comment "${PR}" \
            --body "⚠️ **onion-review não revisou após 2 tentativas** (1ª: \`${M1:-nao-rodou}\` · 2ª: \`${M2:-nao-rodou}\`) — este PR **não foi revisado semanticamente**; revise manualmente. O gate determinístico (\`onion-validate\`) passou. _Soft-pass: falha persistente do revisor não bloqueia o PR (resiliência 2026-07-14 + leitura do sinal correto 2026-08-03)._${nota}" \
            || echo "::warning::não consegui postar o comentário de aviso (segue soft-pass)"

      - name: Aviso — revisor Onion pulado (sem ANTHROPIC_API_KEY)
        if: ${{ env.HAS_ANTHROPIC_KEY != 'true' }}
        run: |
          echo "Revisor Onion pulado: configure o secret ANTHROPIC_API_KEY e instale o GitHub App do Claude."
          echo "A validação determinística (onion-validate.yml) continua cobrindo estrutura/YAML/naming."
