name: Onion Code Review (Claude)

# Revisor de PR NATIVO do Sistema Onion — Claude + doutrina do @metaspec-gate-keeper.
# Complementa o linter determinístico (onion-validate.yml) com a checagem SEMÂNTICA
# de conformidade. Substitui o antigo revisor de terceiros baseado em GPT-4o
# (removido), alinhando o CI ao lineup Claude-only do framework.
#
# Pré-requisitos (configurar uma vez):
#   1. Secret ANTHROPIC_API_KEY em Settings -> Secrets and variables -> Actions.
#   2. GitHub App do Claude instalado (`/install-github-app` no Claude Code, ou
#      https://github.com/apps/claude).
# Sem o secret, o step de review é pulado (degrada graciosamente); o linter
# determinístico segue cobrindo estrutura/YAML/naming.

on:
  pull_request:
    types: [opened, synchronize]

# ── CANCELA O RUN SUPERADO ────────────────────────────────────────────────────────────────
# MEDIDO em 2026-09-17: 397 min de CI num dia, 281 deles (71%) na bancada, e pelo menos 53
# min em runs cujo head foi substituído por um push novo ANTES de terminarem. Ninguém leu
# aqueles vereditos — o `pr-merge-verified.sh` ancora os checks no HEAD ATUAL e recusa
# qualquer outro, então resultado de head velho não decide nada, por desenho.
# o revisor gasta TOKENS — run superado queima crédito por um diff que já mudou.
# NÃO custa eficácia: cancela só o que já era irrelevante. O que NUNCA se cancela é o run
# do head que vai mergear — esse termina, porque é ele que o gate lê.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  id-token: write   # exigido pela claude-code-action@v1 (token OIDC)

jobs:
  onion-review:
    runs-on: ubuntu-latest
    # ⚠️ 15 → 26, e a razão e MEDIDA (PR #871, 2026-09-24): o teto era do JOB e cobria AS DUAS
    # tentativas. A 1a consumiu ~14 min, o retry recebeu 55 SEGUNDOS e foi cancelado — retry sem
    # orcamento e decorativo. Pior: o passo "aviso se nenhuma tentativa revisou (soft-pass, nao
    # bloqueia)" ficava INALCANCAVEL, porque o cancelamento do job mata os passos seguintes. O
    # caminho gracioso que o workflow DECLARA so existia enquanto o timeout nao disparasse.
    # Agora cada tentativa tem teto PROPRIO (11 min, abaixo) e o job tem folga para os passos de
    # veredito e para o soft-pass rodarem de fato. Classe: guarda que declara caminho que nao existe.
    timeout-minutes: 26
    # Forks não têm acesso a secrets — pular para evitar check falho.
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # SSOT do modelo do revisor. Estava escrito TRÊS vezes depois desta cura (as duas chamadas
      # e o pré-voo), e um pré-voo que exercita um modelo diferente do que o revisor usa é pior
      # que pré-voo nenhum: aprova o caminho errado. Uma cópia só, e o drift acaba por construção.
      REVIEW_MODEL: claude-sonnet-5
    outputs:
      revisou: ${{ steps.v1.outputs.revisou == 'true' && 'true' || steps.v2.outputs.revisou }}
      # ACHADOS — segue a MESMA tentativa que revisou, nunca a outra. Se a 1a revisou, a contagem
      # e dela; senao e a da 2a. Ler a contagem de uma tentativa que NAO revisou seria julgar o PR
      # por um run que nao aconteceu — e `-1` (nao pude contar) e o default de `emit`, entao o
      # descuido falharia para o lado silencioso.
      achados: ${{ steps.ach.outputs.achados }}
      motivo1: ${{ steps.v1.outputs.motivo }}
      motivo2: ${{ steps.v2.outputs.motivo }}
      benigno: ${{ steps.aviso.outputs.benigno }}
      sem_chave: ${{ steps.sem_chave.outputs.sem_chave }}
      # ── A CAUSA VIAJA ATÉ QUEM DÁ O VEREDITO (defeito medido 2026-09-25) ────────────────
      # O pré-voo já capturava a causa e a imprimia num `::warning::` — que morre no log deste
      # job. Quem lê `gh pr checks` na hora de mergear vê o veredito, e o veredito dizia só
      # `1ª tentativa: sem-arquivo`: verdadeiro e inútil. A causa real do run que descobriu isto
      # era `HTTP 400 — Your credit balance is too low to access the Anthropic API`, ou seja um
      # problema com AÇÃO ÓBVIA (repor saldo) que ficou três dias parecendo credencial quebrada.
      # Sinal de máquina que não nomeia a própria causa obriga quem lê a adivinhar.
      preflight_http: ${{ steps.preflight.outputs.http }}
      preflight_causa: ${{ steps.preflight.outputs.causa }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Marco da árvore ANTES da revisão (baseline da guarda dirty-tree). HEAD e stash porque
      # `git status --porcelain` NÃO vê `git checkout <sha>` nem `git stash` (medido no Elenxo
      # de 2026-08-13: ambos deixam o porcelain VAZIO) — e são duas das três formas que o
      # prompt proíbe ao revisor.
      - name: Marco da árvore antes da revisão (baseline do dirty-tree)
        id: arvore
        run: |
          echo "head=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "stashes=$(git stash list | wc -l | tr -d ' ')" >> "${GITHUB_OUTPUT}"

      # ═══ PRÉ-VOO (2026-08-03) — a action MASCARA 401 como hang ═══
      # CAUSA-RAIZ do crash que durou de 07-14 a 08-03: o secret ANTHROPIC_API_KEY está
      # INVÁLIDO. Medido de dentro do runner: `GET /v1/models` responde **401
      # authentication_error "API key is invalid" em 0,07s**, com a rede impecável (DNS 17ms,
      # TCP 23ms, TLS 51ms) e a chave bem formada (108 chars, prefixo `sk-ant-`, sem espaço nas
      # bordas — testada normalizada e não normalizada).
      #
      # POR QUE NINGUÉM VIU POR SEMANAS: a action **não repassa o 401**. Ela pendura ~180s e
      # devolve `is_error: true`, `num_turns: 1`, `cost: 0`, SEM MENSAGEM. Um erro de
      # credencial chegava com cara de timeout — o que fez TRÊS rodadas de diagnóstico
      # (07-18 e duas em 08-03) procurarem no lugar errado, inclusive descartando "credencial"
      # exatamente por raciocinar que "401 é instantâneo e isto pendura".
      #
      # Este pré-voo converte 6 minutos de mistério em 1 segundo de causa dita. `/v1/models`
      # é o alvo por não consumir tokens. Nunca imprime o secret — só o código HTTP.
      # ⚠️ O PRÉ-VOO MEDIA A COISA ADJACENTE (medido 2026-09-16, PR #836). `/v1/models` foi
      # escolhido por não consumir tokens — e é exatamente por isso que ele NÃO PROVA NADA sobre
      # a capacidade de rodar o revisor: listar modelos é uma leitura que uma chave sem saldo, ou
      # sem permissão para o modelo do revisor naquele workspace, responde 200 do mesmo jeito.
      #
      # O que se mediu quando ele disse "HTTP 200" e o revisor morreu assim mesmo: a sessão
      # INICIALIZA (`Claude Code initialized`, modelo certo) e morre em 413 ms com
      # `num_turns: 1`, `total_cost_usd: 0`, `permission_denials_count: 0` e NENHUMA mensagem.
      # Custo zero com morte instantânea é a assinatura de uma chamada REJEITADA ANTES DE FATURAR.
      # E as outras hipóteses foram REFUTADAS por medição, não descartadas por raciocínio: os 4
      # hooks de SessionStart saem rc=0 em ambiente nu; e a invocação idêntica (mesmos flags,
      # mesma CLI, clone raso da própria branch, settings e 14 hooks presentes) sai `is_error:
      # false`. O repositório não é a causa; a credencial do runner é.
      #
      # Por isso o pré-voo agora EXERCITA O CAMINHO REAL: `POST /v1/messages` com o MESMO modelo
      # do revisor e `max_tokens: 1`. Custa uma fração de centavo e responde a única pergunta que
      # importa — "esta chave consegue rodar ESTE modelo agora?". É a doutrina
      # `behavior-over-declaration` aplicada à guarda que existia para não confiar em declaração:
      # confie no que o artefato FAZ, não no que um endpoint adjacente declara.
      #
      # E ele IMPRIME O CORPO da resposta no erro (nunca o segredo — o corpo de erro da API traz
      # `type`/`message`, não credencial). Sem isso a falha chega muda, que foi o que custou a
      # investigação inteira: `is_error` sem mensagem não diz se é saldo, permissão de modelo ou
      # workspace, e essas três têm consertos diferentes.
      - name: Pré-voo — a credencial consegue RODAR o modelo do revisor?
        id: preflight
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ env.REVIEW_MODEL }}
        run: |
          set +e
          corpo="$(mktemp)"
          code="$(curl -sS -o "${corpo}" --max-time 30 -w '%{http_code}' \
            https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${KEY}" -H "anthropic-version: 2023-06-01" \
            -H 'content-type: application/json' \
            -d "{\"model\":\"${MODELO}\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ok\"}]}" 2>/dev/null)"
          [ -z "${code}" ] && code=000
          echo "pré-voo (POST /v1/messages, modelo ${MODELO}, max_tokens=1): HTTP ${code}"
          if [ "${code}" = "200" ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"; echo "http=200" >> "${GITHUB_OUTPUT}"
            echo "causa=" >> "${GITHUB_OUTPUT}"
          else
            # O corpo de erro da API é `{"type":"error","error":{"type":...,"message":...}}` — nunca
            # traz credencial. Imprimi-lo é o que transforma `is_error` mudo em causa acionável.
            # `tr -d '\n'` + `cut` porque o corpo é JSON de uma linha só na prática, e um
            # ::warning:: com quebra de linha some do sumário do Actions. Sem python aqui: script
            # embutido em bloco `run: |` é onde a indentação do YAML quebra em silêncio.
            causa="$(tr -d '\n' < "${corpo}" | cut -c1-300)"
            [ -z "${causa}" ] && causa="(corpo vazio)"
            echo "ok=false" >> "${GITHUB_OUTPUT}"; echo "http=${code}" >> "${GITHUB_OUTPUT}"
            echo "causa=${causa}" >> "${GITHUB_OUTPUT}"
            echo "causa da API: ${causa}"
            echo "::warning::pré-voo falhou (HTTP ${code}) — ${causa}. O revisor NÃO será chamado: ele morreria em ~400ms com 'is_error' e custo ZERO, sem mensagem nenhuma, porque a action não repassa o erro da API."
          fi
          rm -f "${corpo}"

      # RESILIÊNCIA (2026-07-14): continue-on-error faz um CRASH do agente (is_error)
      # NÃO reprovar o PR. Motivo (achado por dogfood): este job só fica VERMELHO quando
      # o revisor não consegue rodar — nunca quando acha violações (essas viram comentários
      # inline e o job sai verde). Logo, reprovar por is_error bloqueia o PR pelo crash do
      # bot, carregando ZERO informação sobre o código. O gate de qualidade duro é o
      # determinístico (onion-validate.yml). A revisão semântica DEIXOU de ser advisory em
      # 2026-09-20: quando ela roda e aponta violação, o `onion-review-verdict` reprova. O que
      # segue soft é a DISPONIBILIDADE do revisor (dependência externa), não o veredito dele.
      # ORÇAMENTO (2026-08-03): era `--max-turns 8` e o revisor batia no teto. Medido no PR #533,
      # a PRIMEIRA run após a credencial ser consertada: `subtype: error_max_turns`, 9 turnos,
      # US$ 0,34, 35s — trabalho REAL interrompido por orçamento, não crash. O prompt manda
      # descobrir as meta-specs dinamicamente, ler os arquivos e postar comentários inline; 8
      # turnos não pagam isso. 30 dá folga sem virar cheque em branco (o teto existe para conter
      # loop, não para racionar leitura), e o custo medido por turno torna o pior caso barato.
      - name: Revisor Onion (gate-keeper + code review)
        id: review
        # teto PROPRIO da tentativa: sem ele, a 1a consome o job inteiro e o retry nao roda (medido
        # no PR #871). 11 min x2 + folga cabem nos 26 do job.
        timeout-minutes: 11
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' && steps.preflight.outputs.ok == 'true' }}
        continue-on-error: true
        # PINADO em v1.0.183 (2026-07-25). A VERSÃO NUNCA FOI A CAUSA — o pin anterior
        # (v1.0.171) nasceu em 07-18 da hipótese "a regressão veio da v1.0.172+, lançada em
        # 07-14, mesmo dia em que o revisor passou a crashar". Era COINCIDÊNCIA DE DATA: o que
        # aconteceu por volta de 07-14 foi a credencial deixar de valer. Testado nas duas
        # pontas em 2026-08-03 — v1.0.171 e v1.0.183 falham idêntico —, e o pré-voo acima
        # depois mostrou 401 na origem. Fica na v1.0.183 por ser a mais recente verificada
        # compatível, não por curar nada.
        # ⚠️ Nota epistêmica, porque este comentário já mentiu duas vezes: "o pin curou" (07-18)
        # e "sobra o eixo action-no-runner" (08-03) foram as duas conclusões erradas escritas
        # AQUI com confiança. Ambas caíram por medição. Não reescreva causa neste bloco sem
        # rodar o diagnóstico (`.github/workflows/onion-review-diagnose.yml`).
        # Contrato verificado antes de trocar: `execution_file` segue existindo como output e
        # segue sendo array JSON (`JSON.stringify(messages, null, 2)`), e prompt/anthropic_api_key/
        # claude_args seguem válidos — o review-verdict.sh depende dos três.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Você é o revisor nativo do Sistema Onion. Revise o diff deste Pull Request
            aplicando a doutrina do @metaspec-gate-keeper contra a constituição em
            docs/meta-specs/ (descubra as meta-specs dinamicamente; não assuma nomes fixos):

            - Conformidade com agents.md, commands.md, architecture.md, code-standards.md,
              integrations.md — cite a regra como `meta-spec:linha` ao apontar violação.
            - Regras de ORQUESTRAÇÃO (commands.md §10): orquestração reside em skill/comando, NUNCA
              em agente (architecture.md §4.2); invariante de workflows faseados preservada;
              resiliência exigida quando há fan-out (falha parcial, timeout, fan-in, fallback).
            - Código/idioma (code-standards.md): pt-BR em docs/conteúdo, inglês em código/commits;
              use famílias Claude por tier (opus/sonnet/haiku/fable) — sinalize modelos RETIRADOS
              (Claude 3.x) ou de outro provider (gpt/gemini/llama) citados como modelo de agente.
            - Ausência de vaporware (ex.: `mcp_onion-orchestrator`).

            O DIFF CANÔNICO deste PR é `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
            (o checkout é o merge-ref; rode `git fetch origin ${{ github.event.pull_request.base.ref }}`
            antes se o ref faltar — a base vem do PR, não é main fixo: este arquivo é distribuído
            a adotantes com default branch diverso). NUNCA modifique a árvore de
            trabalho — revise só com comandos de LEITURA (`git show`, `git diff`, `git log`);
            nada de `git checkout -- <arquivo>`, `git restore` ou `git stash` para "comparar
            versões". Já medimos o dano (PR #590, 2 runs no mesmo dia): a árvore suja fez o
            parecer acusar como "removido" exatamente o que o PR adicionava — parecer plausível,
            assertivo e 100% ao contrário.

            NÃO tente postar comentário nem aprovar o PR — você não tem ferramenta para isso, e
            medimos: em 2026-08-07 o log mostrou `permission_denials_count: 14` e `No buffered
            inline comments`. Quem posta é o Onion, com o que você DEVOLVER.

            TERMINE a resposta com o parecer no formato abaixo — é ele que vira o comentário do
            PR, e é a única forma de o seu trabalho chegar a um humano:

              VEREDITO: conforme
            ou
              VEREDITO: N violações
              - arquivo:linha — regra — evidência
              - arquivo:linha — regra — evidência

            `regra` cita a meta-spec como `arquivo:linha`. `evidência` é o que está no diff, não
            interpretação. Diff conforme ⇒ só a linha VEREDITO, sem lista.
          # ⚠️ `--json-schema` FOI TENTADO E REVERTIDO (2026-08-07), e o registro fica para ninguem
          # repetir: o parser da action passa `claude_args` por `shell-quote`, que COME as aspas do
          # JSON. Medido — 371 bytes entram, 253 saem, `JSON.parse` falha; o CLI real responde
          # `Error: --json-schema is not valid JSON` e sai 1; o SDK morre em t=0 com ZERO mensagens
          # e o execution_file sai `[]`. Efeito: `revisou=false / json-ilegivel` nas DUAS
          # tentativas. Seria REGRESSAO ESTRITA — hoje o revisor roda 41 turnos com sucesso.
          # Para reabilitar seria preciso passar o schema por ARQUIVO, e o input nao aceita isso
          # neste pin. Fio registrado; nao adivinhe de novo.
          # ⚠️ `--allowedTools` EXPLÍCITO, e ele é a CURA da morte por negação de permissão.
          # MEDIDO em 2026-09-14 (PR #827, 5 ciclos, revisor NUNCA revisou): `permission_denials_count: 9`,
          # parada em 18 de 60 turnos, credencial sã (pré-voo HTTP 200). A assinatura já estava
          # registrada algumas linhas acima, de 2026-08-07: `permission_denials_count: 14` E
          # `No buffered inline comments` — e é essa segunda frase que NOMEIA o subsistema. Ele não
          # tenta comentar solto: tenta postar COMENTÁRIO INLINE DE REVIEW, e morre acumulando negação.
          # A defesa que existia era uma INSTRUÇÃO EM PROSA no prompt ("NÃO tente postar comentário");
          # ele a ignorou nas DUAS ocorrências. Conselho onde precisava de mecanismo.
          # Com a allowlist explícita a ferramenta não está na lista dele — não há o que tentar.
          # O conjunto é o que o mandato de fato exige: LER. O prompt já proíbe tocar a árvore
          # ("NUNCA modifique a árvore de trabalho — revise só com comandos de LEITURA").
          # ⚠️ TETO DECLARADO, e ele é grande: ISTO NÃO PÔDE SER VALIDADO NO PR QUE O ESCREVEU.
          # PR que edita este arquivo faz a action SE AUTO-PULAR (o caso BENIGNO do verdict, algumas
          # centenas de linhas abaixo), então o fix sai verde SEM ter sido exercido. Quem confere é o
          # PR SEGUINTE ao merge: se o revisor voltar a revisar, a cura pegou; se morrer em t=0 com
          # zero turnos, a allowlist está estreita demais e o caminho é alargá-la — nunca removê-la,
          # porque sem ela a morte por negação volta.
          claude_args: |
            --model ${{ env.REVIEW_MODEL }}
            --max-turns 60
            --allowedTools Read Grep Glob Bash

      # ═══ O SINAL VERDADEIRO (2026-08-03) ═══
      # `steps.review.outcome` MENTE: a action sai com exit 0 mesmo quando o agente morre —
      # o log de uma run que custou 0 e deu 1 turno registra `outcome=success;conclusion=success`
      # com `is_error: true` DENTRO do JSON. Enquanto o retry e o aviso abaixo liam o outcome,
      # NENHUM DOS DOIS disparou uma única vez: medido em 4 runs de 2026-08-03 (03:34, 12:10,
      # 17:11, 19:17), todas com is_error=true e ZERO comentários em qualquer PR. Onze PRs
      # mergearam naquele dia sob um revisor que não leu nada, e o CI dizia verde.
      # A leitura vive em script TESTÁVEL (o YAML não tem selftest — foi assim que a máquina
      # quebrada sobreviveu meses parecendo sã).
      - name: Veredito da 1ª tentativa (is_error, não o outcome)
        id: v1
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: bash .claude/validation/review-verdict.sh "${EXEC_FILE}" >> "${GITHUB_OUTPUT}"

      # RETRY (2026-07-14): o crash do revisor é TRANSITÓRIO (rate-limit/overload sob carga —
      # diagnosticado: o mesmo diff que "sempre crashava" passa quando o CI está quieto, e
      # revisa liso localmente). Logo, uma 2ª tentativa quase sempre vira revisão REAL, em vez
      # de soft-passar sem revisar. Só roda se a 1ª NÃO revisou. Mesma config do step acima.
      - name: Revisor Onion (retry — só se a 1ª tentativa não revisou)
        id: review2
        # teto PROPRIO da tentativa: sem ele, a 1a consome o job inteiro e o retry nao roda (medido
        # no PR #871). 11 min x2 + folga cabem nos 26 do job.
        timeout-minutes: 11
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' && steps.preflight.outputs.ok == 'true' && steps.v1.outputs.revisou != 'true' }}
        continue-on-error: true
        # PINADO em v1.0.183 (2026-07-25). A VERSÃO NUNCA FOI A CAUSA — o pin anterior
        # (v1.0.171) nasceu em 07-18 da hipótese "a regressão veio da v1.0.172+, lançada em
        # 07-14, mesmo dia em que o revisor passou a crashar". Era COINCIDÊNCIA DE DATA: o que
        # aconteceu por volta de 07-14 foi a credencial deixar de valer. Testado nas duas
        # pontas em 2026-08-03 — v1.0.171 e v1.0.183 falham idêntico —, e o pré-voo acima
        # depois mostrou 401 na origem. Fica na v1.0.183 por ser a mais recente verificada
        # compatível, não por curar nada.
        # ⚠️ Nota epistêmica, porque este comentário já mentiu duas vezes: "o pin curou" (07-18)
        # e "sobra o eixo action-no-runner" (08-03) foram as duas conclusões erradas escritas
        # AQUI com confiança. Ambas caíram por medição. Não reescreva causa neste bloco sem
        # rodar o diagnóstico (`.github/workflows/onion-review-diagnose.yml`).
        # Contrato verificado antes de trocar: `execution_file` segue existindo como output e
        # segue sendo array JSON (`JSON.stringify(messages, null, 2)`), e prompt/anthropic_api_key/
        # claude_args seguem válidos — o review-verdict.sh depende dos três.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Você é o revisor nativo do Sistema Onion. Revise o diff deste Pull Request
            aplicando a doutrina do @metaspec-gate-keeper contra a constituição em
            docs/meta-specs/ (descubra as meta-specs dinamicamente; não assuma nomes fixos):

            - Conformidade com agents.md, commands.md, architecture.md, code-standards.md,
              integrations.md — cite a regra como `meta-spec:linha` ao apontar violação.
            - Regras de ORQUESTRAÇÃO (commands.md §10): orquestração reside em skill/comando, NUNCA
              em agente (architecture.md §4.2); invariante de workflows faseados preservada;
              resiliência exigida quando há fan-out (falha parcial, timeout, fan-in, fallback).
            - Código/idioma (code-standards.md): pt-BR em docs/conteúdo, inglês em código/commits;
              use famílias Claude por tier (opus/sonnet/haiku/fable) — sinalize modelos RETIRADOS
              (Claude 3.x) ou de outro provider (gpt/gemini/llama) citados como modelo de agente.
            - Ausência de vaporware (ex.: `mcp_onion-orchestrator`).

            O DIFF CANÔNICO deste PR é `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
            (o checkout é o merge-ref; rode `git fetch origin ${{ github.event.pull_request.base.ref }}`
            antes se o ref faltar — a base vem do PR, não é main fixo: este arquivo é distribuído
            a adotantes com default branch diverso). NUNCA modifique a árvore de
            trabalho — revise só com comandos de LEITURA (`git show`, `git diff`, `git log`);
            nada de `git checkout -- <arquivo>`, `git restore` ou `git stash` para "comparar
            versões". Já medimos o dano (PR #590, 2 runs no mesmo dia): a árvore suja fez o
            parecer acusar como "removido" exatamente o que o PR adicionava — parecer plausível,
            assertivo e 100% ao contrário.

            NÃO tente postar comentário nem aprovar o PR — você não tem ferramenta para isso, e
            medimos: em 2026-08-07 o log mostrou `permission_denials_count: 14` e `No buffered
            inline comments`. Quem posta é o Onion, com o que você DEVOLVER.

            TERMINE a resposta com o parecer no formato abaixo — é ele que vira o comentário do
            PR, e é a única forma de o seu trabalho chegar a um humano:

              VEREDITO: conforme
            ou
              VEREDITO: N violações
              - arquivo:linha — regra — evidência
              - arquivo:linha — regra — evidência

            `regra` cita a meta-spec como `arquivo:linha`. `evidência` é o que está no diff, não
            interpretação. Diff conforme ⇒ só a linha VEREDITO, sem lista.
          # ⚠️ `--json-schema` FOI TENTADO E REVERTIDO (2026-08-07), e o registro fica para ninguem
          # repetir: o parser da action passa `claude_args` por `shell-quote`, que COME as aspas do
          # JSON. Medido — 371 bytes entram, 253 saem, `JSON.parse` falha; o CLI real responde
          # `Error: --json-schema is not valid JSON` e sai 1; o SDK morre em t=0 com ZERO mensagens
          # e o execution_file sai `[]`. Efeito: `revisou=false / json-ilegivel` nas DUAS
          # tentativas. Seria REGRESSAO ESTRITA — hoje o revisor roda 41 turnos com sucesso.
          # Para reabilitar seria preciso passar o schema por ARQUIVO, e o input nao aceita isso
          # neste pin. Fio registrado; nao adivinhe de novo.
          # ⚠️ `--allowedTools` EXPLÍCITO, e ele é a CURA da morte por negação de permissão.
          # MEDIDO em 2026-09-14 (PR #827, 5 ciclos, revisor NUNCA revisou): `permission_denials_count: 9`,
          # parada em 18 de 60 turnos, credencial sã (pré-voo HTTP 200). A assinatura já estava
          # registrada algumas linhas acima, de 2026-08-07: `permission_denials_count: 14` E
          # `No buffered inline comments` — e é essa segunda frase que NOMEIA o subsistema. Ele não
          # tenta comentar solto: tenta postar COMENTÁRIO INLINE DE REVIEW, e morre acumulando negação.
          # A defesa que existia era uma INSTRUÇÃO EM PROSA no prompt ("NÃO tente postar comentário");
          # ele a ignorou nas DUAS ocorrências. Conselho onde precisava de mecanismo.
          # Com a allowlist explícita a ferramenta não está na lista dele — não há o que tentar.
          # O conjunto é o que o mandato de fato exige: LER. O prompt já proíbe tocar a árvore
          # ("NUNCA modifique a árvore de trabalho — revise só com comandos de LEITURA").
          # ⚠️ TETO DECLARADO, e ele é grande: ISTO NÃO PÔDE SER VALIDADO NO PR QUE O ESCREVEU.
          # PR que edita este arquivo faz a action SE AUTO-PULAR (o caso BENIGNO do verdict, algumas
          # centenas de linhas abaixo), então o fix sai verde SEM ter sido exercido. Quem confere é o
          # PR SEGUINTE ao merge: se o revisor voltar a revisar, a cura pegou; se morrer em t=0 com
          # zero turnos, a allowlist está estreita demais e o caminho é alargá-la — nunca removê-la,
          # porque sem ela a morte por negação volta.
          claude_args: |
            --model ${{ env.REVIEW_MODEL }}
            --max-turns 60
            --allowedTools Read Grep Glob Bash

      - name: Veredito da 2ª tentativa (is_error, não o outcome)
        id: v2
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' && steps.review2.outcome != 'skipped' }}
        env:
          EXEC_FILE: ${{ steps.review2.outputs.execution_file }}
        run: bash .claude/validation/review-verdict.sh "${EXEC_FILE}" >> "${GITHUB_OUTPUT}"

      # ESCOLHA DA CONTAGEM EM BASH, e NAO na expressao `${{ … && … || … }}` do Actions. A forma
      # ternaria seria `v1.revisou == 'true' && v1.achados || v2.achados` — e ela depende de a
      # string "0" ser TRUTHY na coerção do Actions. A passada adversarial nao conseguiu cravar
      # isso na documentacao (a lista de falsy mistura-se com a tabela String->Number, que e a
      # conversao de `==`, nao a de `&&`/`||`), e o dano seria o caso MAIS COMUM — `conforme`
      # com 0 achados — cair para a 2a tentativa vazia e virar "nao contabilizavel".
      # Em vez de apostar em semantica que ninguem confirmou, a escolha vira shell, que eu testo.
      # ⚠️ SEGUE A TENTATIVA QUE REVISOU, nunca a outra: ler a contagem de um run que nao
      # aconteceu e julgar o PR por nada.
      # ═══ PRESERVAR A EVIDÊNCIA DO RUN — a cura que nasceu de um diagnóstico impossível ═══
      # POR QUE EXISTE (investigado no PR #873, 2026-09-25, por ordem do maestro):
      # o revisor falhou UMA vez com `subtype: success` + `is_error: true` — 10 turnos de 60, US$ 0,55,
      # 51s — e o retry morreu em 1 turno com custo ZERO. A investigação MEDIU os runs vizinhos e
      # DERRUBOU as duas leituras que eu havia oferecido:
      #   · NÃO é teto/rate-limit: 22:49 → 27 turnos US$ 1,30 · 23:01 → 9 turnos US$ 0,53 · 00:43 →
      #     10 turnos US$ 0,55. Custo por turno estável em ~US$ 0,055 nos três; nenhuma assinatura de
      #     throttling, e um SUCESSO entre duas falhas (teto não desliga e religa).
      #   · NÃO são dois modos de falha: o run de 22:49 tem `onion-review → success` e só o VEREDITO
      #     falhou, porque o revisor ACHOU violações — comportamento desenhado. Eu havia lido a
      #     conclusão do WORKFLOW, que agrega os dois jobs, em vez do job do revisor.
      # Ou seja: é anomalia ÚNICA e intermitente, não regime novo. E é exatamente por isso que a
      # evidência tem de sobreviver: a próxima ocorrência pode levar meses, e sem o arquivo ela chega
      # tão muda quanto esta. A MENSAGEM vive em `claude-execution-output.json`, que era DESCARTADO no
      # fim do run — o log imprime o sumário do `result` (turnos, custo, flags) e nunca o texto.
      # Lição literal da bancada desta casa: saída não capturada é flaky para sempre.
      # `if: always()` porque é justamente quando o revisor FALHA que o arquivo importa; `|| true`
      # porque perder a evidência não pode derrubar o job que ela existe para explicar.
      - name: Evidência do run do revisor (é o que torna is_error diagnosticável)
        if: ${{ always() && env.HAS_ANTHROPIC_KEY == 'true' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          dest="${RUNNER_TEMP}/review-evidence"; mkdir -p "${dest}"
          # a action grava em ${RUNNER_TEMP}; o nome é fixo e as duas tentativas o SOBRESCREVEM,
          # então copiar o que existir já é mais do que se tinha — e o sumário abaixo diz qual é.
          for f in "${RUNNER_TEMP}"/claude-execution-output*.json; do
            [ -e "${f}" ] || continue
            cp "${f}" "${dest}/" || true
          done
          n="$(find "${dest}" -type f | grep -c . || true)"
          if [ "${n}" -eq 0 ]; then
            echo "⊘ nenhum claude-execution-output.json encontrado em ${RUNNER_TEMP} — a action pode ter mudado o caminho; isto NÃO é 'o revisor foi bem'." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "✓ ${n} arquivo(s) de evidência preservado(s) — baixe o artefato \`review-evidence\` para ler a causa do is_error." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Sobe a evidência como artefato
        if: ${{ always() && env.HAS_ANTHROPIC_KEY == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/review-evidence
          if-no-files-found: ignore
          retention-days: 14

      # ── ÁRVORE SUJA DECIDE ANTES DA CONTAGEM (2026-09-29) ──────────────────────────────────
      # A detecção existia, mas rodava DEPOIS do step que decide `achados` — e só CARIMBAVA o
      # comentário. Efeito medido no PR #886: o parecer saiu "VEREDITO: conforme", o check saiu
      # `pass`, e a guarda avisou na MESMA hora que trechos do parecer podiam ser de conteúdo que
      # não é do PR. Quem olha o check verde não vê a ressalva, que vive no corpo do comentário.
      # A cura usa o TERCEIRO desfecho que o contrato já tem: `achados = -1` = NÃO PUDE CONTAR, que
      # nunca bloqueia. Árvore suja É isso — a contagem não é confiável, e chamar isso de "0
      # achados" é transformar incerteza em absolvição. O simétrico (transformar em bloqueio) seria
      # o erro oposto e igualmente proibido aqui.
      # POR QUE O REVISOR CONSEGUE SUJAR: `--allowedTools ... Bash` está na allowlist, e a proibição
      # de escrever é PROSA no prompt. Instrução em prosa não é fronteira — a casa já mediu isto em
      # 2026-09-20, quando um refutador com "não modifique nada" escreveu em seis arquivos. Fechar
      # o `Bash` por lista de comandos foi considerado e REJEITADO: `sed -i`, `python3` e `tee`
      # escapam de qualquer lista, e apertar demais ressuscita a morte por negação de permissão que
      # o `--allowedTools` explícito curou. Detectar e desqualificar é a fronteira que funciona.
      - name: A árvore foi suja durante a revisão? (decide ANTES da contagem)
        id: sujo
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          HEAD_ANTES: ${{ steps.arvore.outputs.head }}
          STASH_ANTES: ${{ steps.arvore.outputs.stashes }}
        run: |
          sujas_total="$(git status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
          suja="$(git status --porcelain 2>/dev/null | head -10)"
          head_agora="$(git rev-parse HEAD 2>/dev/null || echo desconhecido)"
          stash_agora="$(git stash list 2>/dev/null | wc -l | tr -d ' ')"
          motivos=""
          [ -n "${suja}" ]                         && motivos="árvore modificada (${sujas_total} arquivo(s))"
          [ "${head_agora}" != "${HEAD_ANTES}" ]   && motivos="${motivos:+${motivos}; }HEAD movido (${HEAD_ANTES:0:8} → ${head_agora:0:8})"
          [ "${stash_agora}" != "${STASH_ANTES}" ] && motivos="${motivos:+${motivos}; }stash criado (${STASH_ANTES} → ${stash_agora})"
          { echo "sujo=$([ -n "${motivos}" ] && echo true || echo false)"
            echo "motivos=${motivos}"
            echo "total=${sujas_total}"; } >> "${GITHUB_OUTPUT}"
          { echo "porcelain<<PORCELAIN_EOF"; printf '%s\n' "${suja}"; echo "PORCELAIN_EOF"; } >> "${GITHUB_OUTPUT}"

      - name: Qual contagem de achados vale (a da tentativa que revisou)
        id: ach
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          R1: ${{ steps.v1.outputs.revisou }}
          A1: ${{ steps.v1.outputs.achados }}
          A2: ${{ steps.v2.outputs.achados }}
          SUJO: ${{ steps.sujo.outputs.sujo }}
          MOTIVOS: ${{ steps.sujo.outputs.motivos }}
        run: |
          if [ "${R1}" = "true" ]; then val="${A1}"; else val="${A2}"; fi
          case "${val}" in ''|*[!0-9-]*) val=-1 ;; esac
          # ÁRVORE SUJA ⇒ -1 (NÃO PUDE CONTAR). Não é bloqueio nem absolvição: é a recusa a
          # afirmar sobre um parecer que pode descrever conteúdo alheio ao PR.
          if [ "${SUJO}" = "true" ] && [ "${val}" != "-1" ]; then
            echo "::warning::contagem de achados DESQUALIFICADA (${MOTIVOS}) — era ${val}, vira -1 (não pude contar)"
            val=-1
          fi
          echo "achados=${val:--1}" >> "${GITHUB_OUTPUT}"

      # RASTRO SEMPRE (2026-08-03) — o pedido que originou esta correção: "verde revisado" e
      # "verde sem revisar" eram INDISTINGUÍVEIS de fora. Este step roda nos dois desfechos e
      # carimba o resumo do job, então o estado da revisão é legível sem abrir log nenhum.
      - name: Rastro do veredito (o verde diz QUAL verde é)
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' }}
        env:
          SUJO_TOTAL: ${{ steps.sujo.outputs.total }}
          SUJO_MOTIVOS: ${{ steps.sujo.outputs.motivos }}
          SUJO_PORCELAIN: ${{ steps.sujo.outputs.porcelain }}
          R1: ${{ steps.v1.outputs.revisou }}
          M1: ${{ steps.v1.outputs.motivo }}
          T1: ${{ steps.v1.outputs.turnos }}
          R2: ${{ steps.v2.outputs.revisou }}
          M2: ${{ steps.v2.outputs.motivo }}
          T2: ${{ steps.v2.outputs.turnos }}
          SO1: ${{ steps.review.outputs.structured_output }}
          SO2: ${{ steps.review2.outputs.structured_output }}
          EXEC1: ${{ steps.review.outputs.execution_file }}
          EXEC2: ${{ steps.review2.outputs.execution_file }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARCA='<!-- onion-review-parecer -->'
          if [ "${R1}" = "true" ] || [ "${R2}" = "true" ]; then
            turnos="${T1}"; so="${SO1}"; exec_f="${EXEC1}"
            [ "${R2}" = "true" ] && { turnos="${T2}"; so="${SO2}"; exec_f="${EXEC2}"; }
            echo "::notice::onion-review REVISOU este PR (${turnos} turnos) — parecer postado no PR."

            # O revisor DEVOLVEU; quem posta e o Onion. O render mora no script (um 2o parser no
            # YAML seria a divida "DOIS PARSERS, DUAS VERDADES" que kg-view.sh ja escreveu), e o
            # posting passa pelo transporte do forge, nunca por `gh api` cru neste bloco.
            corpo="$(mktemp)"
            bash .claude/validation/review-verdict.sh --corpo "${MARCA}" "${so}" "${exec_f}" > "${corpo}"

            # ═══ GUARDA DIRTY-TREE (2026-08-13, PR #590 — v2 pós-Elenxo) ═══
            # O revisor tem Bash e já sujou a árvore do checkout em 2 runs — e o parecer final
            # acusou como "removido" o que o PR adicionava. Advisory (como o parecer): não
            # bloqueia, CARIMBA a condição no comentário — o leitor decide sabendo.
            # v2 porque o porcelain sozinho é cego a `git checkout <sha>` e `git stash` (medido:
            # ambos o deixam VAZIO) — por isso o marco HEAD/stash capturado ANTES da revisão.
            # TETO declarado: sujar-e-limpar (checkout+restore) passa invisível; e a guarda só
            # roda no ramo "revisou" — crash do revisor cai no else sem carimbo.
            # ⚠️ REUSA a medição do step `sujo`, que roda ANTES da contagem — não remede. Duas
            #    medições do mesmo fato em pontos diferentes do job divergem em silêncio, e a que
            #    o leitor vê no comentário não seria a que desqualificou a contagem.
            sujas_total="${SUJO_TOTAL}"
            suja="${SUJO_PORCELAIN}"
            motivos="${SUJO_MOTIVOS}"
            if [ -n "${motivos}" ]; then
              echo "::warning::árvore do runner alterada durante a revisão (${motivos}) — o parecer pode refletir conteúdo que não é do PR"
              aviso="$(mktemp)"
              {
                printf '\n> ⚠️ **Guarda dirty-tree**: a árvore do checkout foi ALTERADA durante a revisão — **%s**. Trechos do parecer podem refletir conteúdo que NÃO é do PR (precedente: PR #590, parecer acusou como "removido" o que o PR adicionava).\n' "${motivos}"
                if [ -n "${suja}" ]; then
                  printf '> ```\n'
                  printf '%s\n' "${suja}" | sed 's/^/> /'
                  [ "${sujas_total}" -gt 10 ] && printf '> (mostrando 10 de %s)\n' "${sujas_total}"
                  printf '> ```\n'
                fi
                printf '\n'
              } > "${aviso}"
              # aviso ENTRA POR CIMA (achado: cair depois do rodapé desqualifica tarde demais),
              # preservando a MARCA sticky na 1ª linha do corpo
              corpo_novo="$(mktemp)"
              { head -1 "${corpo}"; cat "${aviso}"; tail -n +2 "${corpo}"; } > "${corpo_novo}"
              mv "${corpo_novo}" "${corpo}"
              rm -f "${aviso}"
            fi

            bash .claude/utils/forge/post-review-comment.sh \
              --pr "${PR}" --body-file "${corpo}" --sticky "${MARCA}"

            {
              echo "✅ **onion-review revisou** — ${turnos} turnos. O parecer foi postado no PR."
              echo ""
              cat "${corpo}"
            } >> "${GITHUB_STEP_SUMMARY}"
            rm -f "${corpo}"
          else
            echo "⚠️ **onion-review NÃO revisou** — 1ª: \`${M1:-nao-rodou}\` · 2ª: \`${M2:-nao-rodou}\`. Este verde é soft-pass." >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Só soft-passa se NENHUMA das tentativas revisou. Avisa de forma VISÍVEL (annotation +
      # comentário no PR) e passa verde: um crash produz ZERO veredito sobre o código, então
      # bloquear o PR puniria o autor pela falha do bot. Mas o humano VÊ que não houve revisão.
      # A condição lê o veredito (`revisou`), nunca o outcome do step — ver o bloco do v1.
      - name: Aviso se nenhuma tentativa revisou (soft-pass, não bloqueia)
        id: aviso
        if: ${{ env.HAS_ANTHROPIC_KEY == 'true' && steps.v1.outputs.revisou != 'true' && steps.v2.outputs.revisou != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          M1: ${{ steps.v1.outputs.motivo }}
          M2: ${{ steps.v2.outputs.motivo }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PREFLIGHT_OK: ${{ steps.preflight.outputs.ok }}
          PREFLIGHT_HTTP: ${{ steps.preflight.outputs.http }}
          PREFLIGHT_CAUSA: ${{ steps.preflight.outputs.causa }}
        run: |
          # ═══ ALARME SÓ QUANDO EXIGE DECISÃO (2026-08-04) ═══
          # Sinal de campo do maestro: "não entendo porque estamos sempre com esta mensagem".
          # Medido: dos 6 PRs de 08-03/04, QUATRO editavam este workflow — e a
          # claude-code-action SE RECUSA a rodar quando o workflow do PR difere da branch
          # default ("Skipping action due to workflow validation"), protegendo-se de um PR que
          # reescreve o próprio revisor. Ou seja: condição ESPERADA, AUTO-INFLIGIDA e BENIGNA.
          #
          # A versão anterior detectava isso e mesmo assim disparava ⚠️ + comentário + e-mail,
          # com "Esperado aqui" escrito no próprio corpo. Alarme que anuncia a própria
          # irrelevância não é alarme — é ruído com justificativa anexa, e ensina a ignorar os
          # que importam. Agora o caso benigno vira NOTA no resumo do job e o PR fica em
          # silêncio; ⚠️ e e-mail ficam para o que pede decisão humana.
          nota=""
          benigno=false
          if [ "${M1}" = "orcamento-de-turnos" ] || [ "${M2}" = "orcamento-de-turnos" ]; then
            # Orçamento estourado NÃO é "o revisor morreu": ele leu, analisou e foi interrompido.
            # Muda o conserto de quem lê — subir o teto, não caçar fantasma.
            nota=" _O revisor **trabalhou** e bateu no teto de turnos (\`--max-turns\`) antes de concluir — não é crash. Conserto: subir o teto em \`onion-review.yml\`._"
          elif [ "${PREFLIGHT_OK}" != "true" ]; then
            # Credencial: a causa que a action esconde atrás de um hang, e a única do lote cujo
            # conserto não é código.
            # A CAUSA AGORA VEM DA API, não de uma suposição nossa: o pré-voo exercita
            # POST /v1/messages e captura o corpo do erro. "Credencial inválida", "saldo
            # insuficiente" e "modelo não permitido neste workspace" têm consertos
            # DIFERENTES, e antes desta cura as três chegavam como o mesmo silêncio.
            nota=" **Causa medida, dita pela própria API** (pré-voo \`POST /v1/messages\` com o modelo do revisor, HTTP \`${PREFLIGHT_HTTP}\`): \`${PREFLIGHT_CAUSA}\`. O revisor sequer foi chamado — chamá-lo devolveria \`is_error\` em ~400ms, custo ZERO e sem mensagem, porque a action não repassa o erro da API. Conserto: o que a linha acima disser (chave, saldo, ou acesso ao modelo no workspace)."
          elif git diff --name-only "${BASE_SHA}" HEAD | grep -q '^\.github/workflows/onion-review\.yml$'; then
            # DUAS CONDIÇÕES, não uma — e a segunda entrou na revisão adversarial de 2026-08-06.
            # O diff sozinho é PROXY da causa, não a causa. Enquanto `benigno` só suprimia
            # comentário, o proxy bastava; agora ele ANISTIA O CHECK, e aí a diferença importa:
            # sem a 2ª condição, QUALQUER PR que edite o revisor ficaria dispensado do veredito
            # do revisor — inclusive se ele tivesse morrido por `is-error`, `json-ilegivel` ou
            # `sem-jq`. Anistia auto-referencial na classe de PR que reescreve o próprio gate.
            # `sem-arquivo` é a assinatura do auto-pulo da action (medido: M1=M2=sem-arquivo no
            # run 31111058204). Exigi-la transforma o proxy em MEDIÇÃO.
            # `orcamento-de-turnos` e pré-voo ruim já estavam protegidos pela ordem do elif acima.
            if [ "${M1:-}" = "sem-arquivo" ] && { [ "${M2:-}" = "sem-arquivo" ] || [ -z "${M2:-}" ]; }; then
              benigno=true
            else
              nota=" _O PR edita o próprio \`onion-review.yml\` (a action se auto-pula nesse caso), MAS o motivo medido foi \`${M1:-nao-rodou}\`/\`${M2:-nao-rodou}\` — não a assinatura do auto-pulo. Tratado como falha real, não como benigno._"
            fi
          fi

          if [ "${benigno}" = "true" ]; then
            # EXPORTA para o job de veredito. A detecção continua acontecendo AQUI, uma vez só:
            # duplicar o predicado no job novo repetiria o defeito que a revisão adversarial
            # nomeou noutro lugar (`role: adopted` escrito de duas formas, e um stamp sem espaço
            # partindo o repo ao meio). Um predicado, um lugar.
            echo "benigno=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::onion-review pulado por desenho: este PR edita o próprio workflow, e a action se auto-pula quando ele difere da branch default. Nada a fazer — o caminho real volta no PR seguinte ao merge."
            {
              echo "ℹ️ **onion-review pulado por desenho** — este PR edita o próprio \`onion-review.yml\`,"
              echo "e a action se auto-pula quando o workflow difere da branch default."
              echo "**Nada a fazer**: o caminho real volta a ser exercido no PR seguinte ao merge."
              echo ""
              echo "<sub>Sem comentário no PR de propósito: condição esperada não gera alarme.</sub>"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "::warning::onion-review não revisou após 2 tentativas (1ª: ${M1:-nao-rodou} · 2ª: ${M2:-nao-rodou}) — nenhum veredito produzido. Revise manualmente. O gate determinístico (onion-validate) segue valendo."

          # UM comentário por PR, ATUALIZADO — nunca um por push (medido no PR #529: o workflow
          # roda em `synchronize`, então 2 pushes viraram 2 comentários e 2 e-mails). Editar um
          # comentário existente NÃO dispara notificação nova, então o autor recebe no máximo um
          # e-mail por PR. Alarme que chega repetido é alarme que se aprende a ignorar.
          #
          # O POSTING PASSA PELO TRANSPORTE DO FORGE (2026-08-07). Antes eram três `gh api` crus
          # aqui — sem isenção declarada, e literalmente a operação que `setup-code-review.md:71`
          # manda fazer pelo adapter, dentro do workflow que esse mesmo comando distribui. Ninguém
          # viu porque as REGRAS 10/11 do lint varrem só `.claude/commands` e `.claude/agents`.
          #
          # O casamento agora é SÓ pela marca. O `OR texto-antigo` que existia era rede para a
          # janela de migração, e ela FECHOU: medido em 2026-08-07, do PR #530 em diante todos os
          # comentários do bot carregam a marca; só o #529 (mergeado) tem dois sem ela.
          MARCA='<!-- onion-review-softpass -->'
          corpo="$(mktemp)"
          {
            printf '%s\n\n' "${MARCA}"
            printf '⚠️ **onion-review não revisou após 2 tentativas** (1ª: `%s` · 2ª: `%s`) — este PR **não foi revisado semanticamente**; revise manualmente. O gate determinístico (`onion-validate`) passou. _Soft-pass: falha persistente do revisor não bloqueia o PR._%s\n\n' \
              "${M1:-nao-rodou}" "${M2:-nao-rodou}" "${nota}"
            printf '<sub>atualizado pela run [`%s`](%s/%s/actions/runs/%s)</sub>\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          } > "${corpo}"

          bash .claude/utils/forge/post-review-comment.sh \
            --pr "${PR}" --body-file "${corpo}" --sticky "${MARCA}"
          rm -f "${corpo}"

      - name: Aviso — revisor Onion pulado (sem ANTHROPIC_API_KEY)
        id: sem_chave
        if: ${{ env.HAS_ANTHROPIC_KEY != 'true' }}
        run: |
          # EXPORTA para o job de veredito, no MESMO step que já detecta — mesmo padrão do
          # `benigno`. Sem isto o veredito ficava VERMELHO PARA SEMPRE em todo repo sem a chave,
          # e o motivo é sutil: o `if` do job `onion-review` filtra só FORK, então num repo sem
          # secret o job RODA, todos os steps pulam por conta própria, e o job conclui `success`
          # — NÃO `skipped`. O ramo `RESULT = skipped` do veredito, que parecia cobrir isso, é
          # CÓDIGO MORTO: só fork produz `skipped`, e ali o veredito nem roda (ele também exige
          # fork == false). Achado em revisão adversarial 2026-08-06.
          # DANO POTENCIAL, não hipotético: o /meta:setup-code-review distribui este workflow e
          # o próprio output dele prevê a janela "workflow instalado, secret ainda não" —
          # todo PR do adotante nasceria com "❌ NÃO foi revisado semanticamente".
          echo "sem_chave=true" >> "${GITHUB_OUTPUT}"
          echo "Revisor Onion pulado: configure o secret ANTHROPIC_API_KEY e instale o GitHub App do Claude."
          echo "A validação determinística (onion-validate.yml) continua cobrindo estrutura/YAML/naming."

  # ═══════════════════════════════════════════════════════════════════════════════════
  # VEREDITO VISÍVEL — o check que diz se houve revisão, e não se o job rodou
  #
  # POR QUE EXISTE (medido 2026-08-06, e o dano é meu): mergeei DOIS PRs (#546 e #548)
  # sob `gh pr checks` verde, sem revisão nenhuma. O job `onion-review` sai com exit 0
  # POR DESENHO — soft-pass, decisão deliberada de 2026-07-14: revisor é dependência
  # externa e travar todo merge quando ele falha é pior que o contrário. Isso NÃO muda
  # aqui, e não deve mudar.
  #
  # O BURACO NÃO ERA "não bloqueia" — era que o aviso não CHEGA em quem mergeia. Ele já
  # existia como comentário no PR e como nota no resumo do job; nenhuma das duas
  # superfícies é lida por `gh pr checks`, que é a que o fluxo de merge consulta. O
  # resultado prático: "revisou" e "não revisou" ficavam INDISTINGUÍVEIS no ponto exato
  # da decisão. Cura de disciplina ("prestar atenção ao comentário") é cura nula nesta
  # casa — a cura é mecânica: um check PRÓPRIO, que fica VERMELHO quando não houve
  # revisão semântica.
  #
  # ⚠️ ESTE BLOCO MUDOU EM 2026-09-20 (ordem do maestro), e a versão anterior dizia o
  # OPOSTO: "não bloqueia por construção… vermelho aqui INFORMA; merge segue possível".
  # Isso deixou de ser verdade em duas frentes, e deixar o cabeçalho velho seria a classe
  # que este arquivo mais persegue — doutrina que descreve uma máquina que não existe mais.
  #
  # (1) O CHECK AGORA REPROVA quando o revisor aponta violação (`exit 1` no ramo de
  #     achados >= 1). Antes ele só reprovava quando NÃO HOUVE revisão.
  # (2) O MERGE JÁ MORRIA AQUI ANTES DESTA MUDANÇA, e eu não tinha notado:
  #     `ops/pr-merge-verified.sh` exige `onion-review-verdict = SUCCESS` e é o único
  #     caminho de merge permitido neste repo. Ou seja, "merge segue possível" descrevia
  #     o GitHub (sem branch protection — 403 em `.../branches/main/protection`), não a
  #     máquina real desta casa. Achado por refutador adversarial, não por leitura minha.
  #
  # O ESCAPE, que é o que torna o bloqueio aceitável: `ops/pr-merge-verified.sh <pr>
  # --dispensa onion-review-verdict --motivo "<por quê>"`, que REGISTRA o que foi
  # dispensado. Revisor é LLM e erra; a saída para o falso-positivo é dispensa NOMEADA,
  # nunca gate mudo. E `achados = -1` (não pude contar) jamais bloqueia.
  #
  # A MEDIÇÃO QUE ACOMPANHA: das 40 runs de 2026-08-03 a 08-06, 15 não revisaram — 12
  # são o próprio incidente de credencial de 08-03/04 (branches `diagnose-*`,
  # `causa-raiz-do-revisor-mudo`), já curado, e 3 são a classe NOVA
  # `orcamento-de-turnos` (08-05 e 08-06). As revisões que FECHARAM usaram 27 e 28
  # turnos contra teto de 30: marginal por construção. Daí o teto ir a 60 neste mesmo
  # commit — subir o número sem tornar a falha visível só adiaria o próximo silêncio.
  # ═══════════════════════════════════════════════════════════════════════════════════
  onion-review-verdict:
    runs-on: ubuntu-latest
    needs: onion-review
    # `!cancelled()` e NÃO `always()`: com always(), cancelar a run NÃO cancela este job — o
    # GitHub re-avalia o `if` e always() dá true. Um `gh run cancel` humano virava
    # "❌ NÃO foi revisado semanticamente" no PR: cancelamento deliberado transformado em
    # acusação. `!cancelled()` preserva o comportamento em failure/skipped do needs (que é onde
    # o vermelho é CERTO — timeout do job dá `failure`, e ali não houve revisão mesmo).
    if: ${{ !cancelled() && github.event.pull_request.head.repo.fork == false }}
    steps:
      # ⚠️ CHECKOUT — e ele NASCEU de um defeito FATAL achado pela passada adversarial, nao por
      # leitura minha. Este job viveu ate 2026-09-20 sem arvore, e com razao: so lia
      # `needs.*.outputs`, que nao precisam de arquivo. O gate de achados introduziu a PRIMEIRA
      # dependencia de arquivo do repo (`review-verdict.sh --gate`) — e sem checkout o bash sai
      # `127: No such file or directory`, o `rc != 0` vira `exit 1`, e TODO PR revisado ficaria
      # vermelho, inclusive os `conforme`, com a mensagem FALSA "apontou 0 violação(ões)".
      # Medido no parecer: dos ultimos 56 PRs, 44 sairam CONFORME — os 44 teriam sido barrados.
      # E o agravante que quase deixou isso passar: este PR edita o proprio `onion-review.yml`,
      # entao a action se auto-pula e o caminho `REVISOU=true` NAO e exercido aqui. O defeito so
      # apareceria no PR SEGUINTE ao merge, ja em main. [[onion-review-ci-semantics]]
      # CHECKOUT SIMPLES, nao `sparse-checkout`: o sparse em modo nao-cone com um caminho de
      # ARQUIVO e mecanismo que eu NAO consigo exercitar localmente — e este achado nasceu
      # exatamente de introduzir dependencia nova sem medir. Trocar um modo-de-falha conhecido
      # por um que so o CI revelaria seria repetir o defeito enquanto o curo. O job dura
      # segundos; `fetch-depth: 1` basta porque o gate so le UM arquivo da arvore.
      - name: Checkout (o gate lê um script do repo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: O PR foi revisado semanticamente?
        env:
          REVISOU: ${{ needs.onion-review.outputs.revisou }}
          ACHADOS: ${{ needs.onion-review.outputs.achados }}
          PR_NUM: ${{ github.event.pull_request.number }}
          M1: ${{ needs.onion-review.outputs.motivo1 }}
          M2: ${{ needs.onion-review.outputs.motivo2 }}
          RESULT: ${{ needs.onion-review.result }}
          BENIGNO: ${{ needs.onion-review.outputs.benigno }}
          SEM_CHAVE: ${{ needs.onion-review.outputs.sem_chave }}
          PF_HTTP: ${{ needs.onion-review.outputs.preflight_http }}
          PF_CAUSA: ${{ needs.onion-review.outputs.preflight_causa }}
        run: |
          if [ "${RESULT}" = "skipped" ]; then
            # Só FORK chega aqui (o job de veredito exige fork == false, então na prática este
            # ramo é inalcançável — mantido por defesa, não por cobertura). O texto anterior
            # dizia "fork ou sem chave" e MENTIA: sem chave o job sai `success`, não `skipped`.
            echo "::notice::onion-review pulado — nada a verificar."
            exit 0
          fi
          if [ "${SEM_CHAVE}" = "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY ausente — o revisor sequer foi chamado. Não é falha de revisão; é ambiente sem credencial."
            {
              echo "ℹ️ **Revisor não configurado neste repo**"
              echo ""
              echo "Sem \`ANTHROPIC_API_KEY\`, o revisor não é chamado. O gate determinístico"
              echo "(\`onion-validate\`) segue cobrindo estrutura/YAML/naming."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ "${REVISOU}" = "true" ]; then
            # ═══ O ACHADO PASSA A BLOQUEAR (ordem do maestro, 2026-09-20) ═══
            # MEDIDO antes de ligar: em 33 pareceres, 10 apontaram violação e o parecer era
            # advisory — o defeito era apontado, mergeado, e FICAVA. Conferi três no vivo
            # (`_viaja`, `_PAPEL_DESTE_REPO`, `_base_nome`): seguiam em main depois de acusados.
            #
            # ⚠️ A DECISÃO VIVE EM SCRIPT, não aqui. Este mesmo arquivo adverte que "o YAML não
            # tem selftest — foi assim que a máquina quebrada sobreviveu meses parecendo sã".
            # Ligar um gate novo embutido repetiria o defeito que aquele comentário registra.
            # `review-verdict.sh --gate` tem bancada (família `review_verdict`); aqui só se encadeia.
            #
            # `-1`/vazio (NÃO PUDE CONTAR) não bloqueia: "não revisou" já é o campo `revisou`, e
            # transformar ignorância em bloqueio é a classe que esta casa mais persegue.
            rc=0
            bash .claude/validation/review-verdict.sh --gate "${ACHADOS:--1}" "${PR_NUM:-<pr>}" \
              >> "${GITHUB_STEP_SUMMARY}" || rc=$?
            if [ "${rc}" -ne 0 ]; then
              echo "::error::onion-review apontou ${ACHADOS} violação(ões) — corrija, ou dispense com motivo registrado (ops/pr-merge-verified.sh --dispensa onion-review-verdict --motivo …)."
              exit 1
            fi
            exit 0
          fi
          # CASO BENIGNO — e ele existe porque este check ERROU no seu primeiro run real.
          # No PR #549 (o que criou este job) ele ficou VERMELHO em 4s. Causa: a claude-code-action
          # SE AUTO-PULA quando o PR edita o próprio onion-review.yml, e o job principal já
          # classifica isso como benigno, com nota e sem alarme. Ou seja: o check gritava
          # exatamente no caso que a máquina sabe ser inofensivo.
          # Isso é o defeito contra o qual o próprio workflow adverte algumas linhas acima —
          # "alarme que anuncia a própria irrelevância não é alarme; é ruído com justificativa
          # anexa, e ensina a ignorar os que importam". Um check que grita no caso inócuo perde
          # a credibilidade justo para quando o caso for grave, que é a razão de ele existir.
          if [ "${BENIGNO}" = "true" ]; then
            echo "::notice::onion-review pulado por desenho (este PR edita o próprio workflow) — não é falha de revisão. O caminho real volta a ser exercido no PR seguinte ao merge."
            {
              echo "ℹ️ **Revisão pulada por desenho, não por falha**"
              echo ""
              echo "Este PR edita o próprio \`onion-review.yml\`, e a action se auto-pula quando o"
              echo "workflow difere da branch default. **Nada a fazer** — o caminho real volta a ser"
              echo "exercido no PR seguinte ao merge."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # ── A CAUSA, quando o pré-voo a capturou, vem ANTES do sintoma ─────────────────────
          # `sem-arquivo` é o SINTOMA (a action não expôs o execution_file). A causa vive no
          # pré-voo, e sem ela o leitor deste check não tem o que fazer com a informação.
          # ⚠️ O RÓTULO NÃO PODE DIZER "CREDENCIAL" PARA QUALQUER NÃO-200 — achado de passada
          # adversarial, e o mais irônico deste diff: a tese dele é que "saldo e credencial revogada
          # são problemas DIFERENTES com ações diferentes", e a 1ª redação chamava de "falha da
          # credencial" um `HTTP 000` (timeout/DNS, o default do próprio pré-voo quando o curl não
          # responde) e um `529` (capacidade da Anthropic). Cometia o mesmo pecado um degrau acima.
          # Cada faixa tem AÇÃO diferente, e é a ação que quem lê precisa: repor saldo · trocar chave ·
          # esperar · investigar rede. Fora dessas, o rótulo diz que NÃO classifica.
          _causa_txt=""
          if [ -n "${PF_CAUSA}" ] || { [ -n "${PF_HTTP}" ] && [ "${PF_HTTP}" != "200" ]; }; then
            case "${PF_HTTP}" in
              000) _causa_txt="O pré-voo NÃO OBTEVE RESPOSTA (rede/DNS/timeout, não credencial): \`${PF_CAUSA:-sem corpo}\`" ;;
              401|403) _causa_txt="A CREDENCIAL foi recusada (HTTP \`${PF_HTTP}\`) — chave inválida ou revogada: \`${PF_CAUSA:-sem corpo}\`" ;;
              429) _causa_txt="LIMITE DE TAXA (HTTP 429) — não é credencial nem saldo, é cadência: \`${PF_CAUSA:-sem corpo}\`" ;;
              5*)  _causa_txt="CAPACIDADE/ERRO DO LADO DA API (HTTP \`${PF_HTTP}\`) — nada a consertar aqui: \`${PF_CAUSA:-sem corpo}\`" ;;
              400) if printf '%s' "${PF_CAUSA}" | grep -qiF 'credit balance'; then
                     _causa_txt="SALDO da conta de API insuficiente (HTTP 400) — reponha crédito; a chave está VÁLIDA: \`${PF_CAUSA}\`"
                   else
                     _causa_txt="Requisição RECUSADA com HTTP 400 (modelo inexistente? corpo malformado?): \`${PF_CAUSA:-sem corpo}\`"
                   fi ;;
              *)   _causa_txt="O pré-voo falhou com HTTP \`${PF_HTTP:-?}\` e eu NÃO classifico esta faixa: \`${PF_CAUSA:-sem corpo}\`" ;;
            esac
          fi
          {
            echo "## ❌ Este PR NÃO foi revisado semanticamente"
            echo ""
            if [ -n "${_causa_txt}" ]; then
              echo "**Causa medida:** ${_causa_txt}"
              echo ""
              echo "Isto é diagnóstico, não adivinhação: o corpo acima é a resposta da própria API."
              echo "Saldo/cota e credencial revogada são problemas DIFERENTES com ações diferentes —"
              echo "e a mensagem só ajuda quem mergeia se disser qual dos dois é."
              echo ""
            fi
            echo "1ª tentativa: \`${M1:-nao-rodou}\` · 2ª tentativa: \`${M2:-nao-rodou}\`"
            echo ""
            echo "O job \`onion-review\` saiu **verde por desenho** (soft-pass: revisor é dependência"
            echo "externa e não bloqueia merge). Este check existe para que o verde de lá **não seja"
            echo "confundido com revisão** por quem lê \`gh pr checks\` na hora de mergear."
            echo ""
            # ⚠️ ESTE TEXTO DIZIA "Não bloqueia o merge — informa", e era FALSO desde 2026-09-20: o
            # step faz `exit 1` e o `ops/pr-merge-verified.sh` RECUSA o merge com este check em falha,
            # salvo dispensa nomeada. Medido por passada adversarial. Um bloco escrito para ser honesto
            # com quem mergeia não pode errar justamente sobre o que ele próprio faz.
            echo "**Isto BLOQUEIA o merge** pelo caminho verificado (\`ops/pr-merge-verified.sh\`)."
            echo "Mergear sem revisão semântica exige dispensa NOMEADA E REGISTRADA:"
            echo ""
            echo "    bash ops/pr-merge-verified.sh <pr> --dispensa onion-review-verdict --motivo \"<por quê>\""
            echo ""
            echo "O motivo vai para um comentário no PR **antes** do merge — a decisão segue humana, e"
            echo "agora fica auditável em vez de morrer no terminal de quem mergeou."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::onion-review NÃO revisou (1ª: ${M1:-nao-rodou} · 2ª: ${M2:-nao-rodou})${_causa_txt:+ — ${_causa_txt}} — mergear sem revisão semântica é decisão humana, tome-a de olhos abertos."
          exit 1
