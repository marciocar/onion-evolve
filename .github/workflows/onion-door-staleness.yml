# ═══════════════════════════════════════════════════════════════════════════════
# Onion Door Staleness — RELATÓRIO da defasagem das portas (nunca falha a main)
#
# POR QUE ESTE WORKFLOW MUDOU (F3 das portas, 2026-10-10, SAC-92 — nó D_MATRIZ_DE_PORTAS_2026_10:
# "publicar é sob demanda, por comando, e nenhuma porta defasada trava o desenvolvimento"):
#
# De 2026-09-24 até a F3 ele FALHAVA a main a cada push que tocasse a superfície que viaja, com teto 0
# na onion-core: a main ficava vermelha depois de todo merge até alguém re-materializar a porta e
# avançar o pin no members.yaml por um PR de registro. Era a cobrança no único instante em que a cura
# existia (D_ONDE_COBRAR_A_DEFASAGEM_DA_PORTA) — e era também o desenvolvimento travado pela publicação.
# A matriz das portas decidiu o oposto: publicar é ato sob demanda (/meta:publish), o selo é o CARIMBO
# da própria porta, e o pin do registro virou cache.
#
# O QUE ELE FAZ AGORA: lê o carimbo PUBLICADO de cada porta no remoto (`ops/publish-door.sh --status`,
# git puro, sem credencial — as portas são públicas) e escreve a defasagem no sumário do job. O sinal
# FICA, visível; o que sai é o portão. Se a medida não puder ser feita, o sumário diz NÃO-MEDIDO — e
# isso também não pinta a main de vermelho, porque um relatório que falha não deixa de ser relatório.
# ═══════════════════════════════════════════════════════════════════════════════
name: Onion Door Staleness

on:
  push:
    branches: [main]
    # Só quando a superfície que VIAJA muda. Commit de biografia não defasa porta nenhuma.
    paths:
      - '.claude/**'
      - 'docs/meta-specs/**'
      - 'docs/knowledge-base/**'
      - 'docs/sdaal/**'
      - 'docs/evolution/federation/members.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  door-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth 0 é OBRIGATÓRIO: a contagem resolve `pin..origin/main` na história real.
          # Com clone raso o pin publicado não existe aqui e sairia PIN-FORA-DA-HISTÓRIA.
          fetch-depth: 0

      - name: Defasagem das portas (carimbo publicado × origin/main)
        run: |
          set -uo pipefail
          out=""; rc=0
          out="$(bash ops/publish-door.sh --status 2>&1)" || rc=$?
          printf '%s\n' "${out}"
          {
            echo "## 🚪 Defasagem das portas públicas"
            echo ""
            echo '```'
            printf '%s\n' "${out}"
            echo '```'
            echo ""
            if [ "${rc}" -ne 0 ]; then
              echo "⚠️ A medida NÃO pôde ser feita por inteiro (rc=${rc}) — isto não é 'portas em dia'."
            fi
            echo "Publicar é sob demanda: \`/meta:publish <porta>\` (ou \`--all\`). Este relatório não bloqueia nada."
          } >> "${GITHUB_STEP_SUMMARY}"
