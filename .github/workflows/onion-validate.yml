name: Onion Artifact Linter

on:
  pull_request:
    paths:
      - '.claude/**'
      - 'docs/meta-specs/**'
      - 'docs/design-context/**'
      # plugins/ são artefatos GERADOS guardados pela REGRA 19 (drift vs fonte).
      # Sem este path, um PR que só toca plugins/ contorna o drift-guard
      # (incidente 2026-07-04: fix de drift do #241 mergeou sem o lint rodar).
      - 'plugins/**'
      # .github/workflows/ = o proprio CI. Sem este path, um PR que mexe no
      # workflow NAO dispara o lint — foi medido no #509: adicionar 'ops/**' aos
      # paths nao fez o lint rodar, porque o filtro e avaliado contra a definicao
      # da BASE e a mudanca do workflow nao casava path nenhum. CI que nao se
      # valida quando muda e a mesma classe de ponto cego, um nivel acima.
      - '.github/workflows/**'
      # ops/ = codigo de SERVICO (fora do payload do /meta:adopt, PR #508). Sem
      # este path, um PR que so toca ops/ nao dispara lint NENHUM — foi o que
      # aconteceu no #509, que rodou so o onion-review. Terceira ocorrencia da
      # mesma classe (#241 plugins, #254 docs, agora ops/): path novo nasce
      # invisivel ao CI ate alguem notar. O lint nao valida .ts, mas valida as
      # REFERENCIAS (REGRA 48) e a SSOT que um PR de ops/ pode mexer.
      #
      # ⚠️ 2026-08-02: este comentario existia desde o #509 e O PATH NAO ESTAVA AQUI.
      # A cura foi DOCUMENTADA e nao APLICADA — `declarado != verificado` dentro da
      # configuracao do proprio CI, e invisivel porque ninguem le lista de path.
      - 'ops/**'
      # .env.example = QUARTA ocorrencia da mesma classe, medida agora no #513: o PR que
      # corrigiu o anti-padrao 4 do SDAAL tocava SO este arquivo e rodou apenas o
      # onion-review — o lint nunca disparou. E ele NAO e irrelevante: a REGRA 20
      # (Capability Contract, HARD) le o .env.example em lint-artifacts.sh:519 para provar
      # que a variavel declarada por um adapter existe de fato. Dava para quebrar uma
      # regra HARD sem o CI ver.
      - '.env.example'
      # vendor/kg-ssot/ + .kg-ssot/ = o contrato do .kg.yaml vendorizado por pin e a linha de base do gate
      # dele (2026-10-08). Sem estes paths, um PR que só troca a tag ou a base não roda o gate que eles
      # alimentam — a mesma classe de path novo invisível ao CI que este bloco já pagou quatro vezes.
      - 'vendor/kg-ssot/**'
      - '.kg-ssot/**'
      # docs/ + CLAUDE.md são guardados pelas regras de SSOT (R9/R15/R16/R22:
      # contagens vivas, carimbo de frescor, links da co-evolução). Sem estes
      # paths, um PR docs-only deriva contagens sem o CI ver (observado no #254:
      # lint não rodou num PR que tocava CLAUDE.md + docs/onion — o local salvou).
      - 'docs/**'
      - 'CLAUDE.md'

# ── CANCELA O RUN SUPERADO ────────────────────────────────────────────────────────────────
# MEDIDO em 2026-09-17: 397 min de CI num dia, 281 deles (71%) na bancada, e pelo menos 53
# min em runs cujo head foi substituído por um push novo ANTES de terminarem. Ninguém leu
# aqueles vereditos — o `pr-merge-verified.sh` ancora os checks no HEAD ATUAL e recusa
# qualquer outro, então resultado de head velho não decide nada, por desenho.
# o lint é barato, mas o princípio é o mesmo: veredito de head velho não decide nada.
# NÃO custa eficácia: cancela só o que já era irrelevante. O que NUNCA se cancela é o run
# do head que vai mergear — esse termina, porque é ele que o gate lê.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-onion-artifacts:
    runs-on: ubuntu-latest
    # ── DIVISÃO DE 2026-08-16: este job é o GATE SOBRE A MUDANÇA (lê o diff e reprova o
    #    artefato). A BANCADA (lint-selftest.sh, 689 asserções À ÉPOCA — o número de hoje vive
    #    em `docs/onion/testing-inventory.md`) saiu para `onion-selftest.yml`
    #    porque é TESTE DE REGRESSÃO DA MAQUINARIA, e os dois têm gatilhos diferentes.
    #    Medido: a bancada era 686s de 729s — 94% do CI — e rodava em todo PR; dos 8 PRs
    #    daquele dia, 6 tocaram ZERO arquivo de maquinaria e esperaram 12 min por uma suíte
    #    que não podia lhes dizer nada. O filtro de path do workflow novo NÃO repete os três
    #    pontos cegos históricos (#241 plugins, #254 docs, #509 ops) porque tem rede debaixo:
    #    um `schedule` noturno roda a bancada inteira na main, independente de path.
    # Orçamento: sem a bancada, este job é lint-artifacts (~44s medido) + gate de design tokens.
    # O teto de 10 min dá folga de ordem de grandeza. O HISTÓRICO de teto colado — job CANCELADO
    # aos 15m02s em 2026-08-06, com a hipótese óbvia (guardas novas) REFUTADA na medição (908s com
    # 646 guardas contra 921s com 612: 13s mais RÁPIDO com 34 guardas A MAIS) — migrou para
    # `onion-selftest.yml`, junto com o trabalho que o causava. Comentário fica onde o trabalho está.
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Executar linter determinístico de artefatos Onion
        # `tee` porque o log do job EXPIRA e leva junto a única evidência de por que uma regra
        # reprovou. `pipefail` porque sem ele o rc seria o do `tee` — sempre 0 — e o gate
        # passaria a aprovar tudo em silêncio. É a classe `exit 0 é declaração, não verificação`
        # aplicada ao próprio encanamento do CI.
        run: |
          set -o pipefail
          bash .claude/validation/lint-artifacts.sh 2>&1 | tee lint-artifacts.log

      # `if: always()`: a evidência que importa é a do job que FALHOU.
      # ⚠️ SCRIPT, não shell embutido — e a razão é medida: a 1ª versão deste passo vivia aqui
      # dentro, e por isso nenhuma guarda a exercitava. A passada adversarial achou que ela
      # imprimia ✅ sobre log TRUNCADO (lint abortado: zero VIOLATION, zero bloco de sumário,
      # contagem zero, ícone verde). Como script, ganhou família na bancada e o ícone passou a
      # exigir PROVA POSITIVA de término.
      - name: Sumário do lint no job
        if: always()
        run: |
          bash ops/testing/lint-summary.sh \
            --log lint-artifacts.log \
            --titulo "Lint determinístico de artefatos" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Evidência de terminal como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-evidence-${{ github.run_id }}
          path: lint-artifacts.log
          if-no-files-found: warn
          retention-days: 30

      - name: Gate determinístico de design tokens (DTCG + refs + WCAG)
        run: |
          if ! command -v jq >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq jq; fi
          # Fail-loud no CI: o gate é gracioso (skip) sem jq — aceitável local, mas
          # no CI um runner sem jq passaria em verde sem validar nada. Exige jq aqui.
          command -v jq >/dev/null 2>&1 || { echo "ERRO: jq indisponível no runner — gate de design não pode rodar."; exit 1; }
          bash .claude/validation/lint-design-tokens.sh

      - name: Contrato KG-SSOT (vendor íntegro + gate por grafo)
        # O radar (kg-radar.sh) é o leitor de semântica e integridade; a FORMA do .kg.yaml é julgada pelo
        # contrato v4.1 vendorizado por pin (tag contract-v4.1.0 do adotante dedicado ao KG-SSOT; o v4.1 só
        # acrescenta 4 avisos SHOULD ao v4.0, adotado em 2026-10-09 com a dívida nova na base). Medido em
        # 2026-10-08: o radar sozinho aceitava 55 casos da suíte que o contrato reprova. O vendor não se
        # edita aqui (o check reprova qualquer byte alterado); mudança no contrato volta como sinal.
        # Catraca POR GRAFO contra .kg-ssot/gate.json: grafo novo ou que passou a falhar no MUST reprova,
        # e a dívida SHOULD só pode descer. rc 2 = entrada quebrada, nunca verde.
        run: |
          python3 -m pip install --quiet -r vendor/kg-ssot/tools/requirements.txt
          python3 -I vendor/kg-ssot/tools/kg_vendor.py check --dest vendor/kg-ssot
          # FORA DO CORPUS, explícito e visível no diff (política selada pelo maestro, 2026-10-08, sobre a
          # posição do dono do contrato): propostas arquivadas do kg-inbox são história, e os grafos proto
          # do Onion pessoal não são grafo do produto. O demo fictício foi para fixtures/ (default).
          # ⚠️ A base (.kg-ssot/gate.json) tem de ser gravada com os MESMOS --exclude:
          #    python3 -I -B vendor/kg-ssot/tools/kg_gate.py --update <os --exclude abaixo>
          python3 -I vendor/kg-ssot/tools/kg_gate.py \
            --exclude 'docs/evolution/kg-inbox/_rejected/*' \
            --exclude 'docs/evolution/kg-inbox/_sealed/*' \
            --exclude 'docs/discussions/onion-pessoal-marcio/proto/*'

      - name: Lembrete — checagens semânticas são locais
        run: |
          echo "---"
          echo "AVISO: Este job cobre apenas validações DETERMINÍSTICAS (estrutura, YAML, frontmatter, nomenclatura)."
          echo "Checagens SEMÂNTICAS de conformidade arquitetural (metaspec, invariantes de framework)"
          echo "devem ser executadas localmente via o comando /meta:metaspec-validate,"
          echo "orquestrado pelo agente @metaspec-gate-keeper — fora do escopo do CI."
          echo "---"
