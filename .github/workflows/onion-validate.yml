name: Onion Artifact Linter

on:
  pull_request:
    paths:
      - '.claude/**'
      - 'docs/meta-specs/**'
      - 'docs/design-context/**'
      # plugins/ são artefatos GERADOS guardados pela REGRA 19 (drift vs fonte).
      # Sem este path, um PR que só toca plugins/ contorna o drift-guard
      # (incidente 2026-07-04: fix de drift do #241 mergeou sem o lint rodar).
      - 'plugins/**'
      # docs/ + CLAUDE.md são guardados pelas regras de SSOT (R9/R15/R16/R22:
      # contagens vivas, carimbo de frescor, links da co-evolução). Sem estes
      # paths, um PR docs-only deriva contagens sem o CI ver (observado no #254:
      # lint não rodou num PR que tocava CLAUDE.md + docs/onion — o local salvou).
      - 'docs/**'
      - 'CLAUDE.md'

permissions:
  contents: read

jobs:
  lint-onion-artifacts:
    runs-on: ubuntu-latest
    # Orçamento medido em 2026-07-20 (KVM 8): lint-selftest 6m59s (374 guardas) + lint-artifacts 21s
    # + gate de design tokens ≈ 7,5min. Com teto de 10 o job rodava a ~75% do orçamento — margem que
    # some no primeiro runner lento e vira CI vermelho por TEMPO, não por defeito. A suíte cresce a
    # cada guarda nova (é o objetivo); o teto acompanha, com a medição registrada para o próximo ajuste.
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Executar linter determinístico de artefatos Onion
        run: bash .claude/validation/lint-artifacts.sh

      # Asserção de CAPACIDADE antes do auto-teste. A suíte degrada gracioso sem tooling
      # (⊘ NÃO VERIFICADO) — correto na máquina do autor, inaceitável aqui: um runner sem
      # jq/pyyaml pularia dezenas de guardas e o job ficaria VERDE sem tê-las exercido.
      # Generaliza para a suíte inteira o fail-loud que o gate de design tokens já aplicava
      # a si mesmo. Sinal de campo 2026-07-25 (arandek): um waiter que aceita 0 == 0 carimbou
      # verde com o serviço desligado, e o custo apareceu só no deploy seguinte.
      - name: Asserção de capacidade do runner (o auto-teste não pode pular nada)
        run: |
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          python3 -c "import yaml" >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          missing=""
          for t in jq git openssl awk python3; do command -v "$t" >/dev/null 2>&1 || missing="${missing} $t"; done
          python3 -c "import yaml" >/dev/null 2>&1 || missing="${missing} python3-yaml"
          if [ -n "${missing}" ]; then
            echo "ERRO: capacidade incompleta no runner —${missing}"
            echo "Sem isto o auto-teste PULA guardas e o verde não significa nada."
            exit 1
          fi
          echo "OK — capacidade completa: jq git openssl awk python3 + pyyaml"

      - name: Auto-teste das guardas (fixtures determinísticas)
        # STRICT=1: qualquer ⊘ (guarda não exercida) REPROVA o job. É o que separa
        # "verifiquei e está bom" de "não verifiquei" — no CI só o primeiro vale verde.
        env:
          ONION_SELFTEST_STRICT: '1'
        run: bash .claude/validation/lint-selftest.sh

      - name: Gate determinístico de design tokens (DTCG + refs + WCAG)
        run: |
          if ! command -v jq >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq jq; fi
          # Fail-loud no CI: o gate é gracioso (skip) sem jq — aceitável local, mas
          # no CI um runner sem jq passaria em verde sem validar nada. Exige jq aqui.
          command -v jq >/dev/null 2>&1 || { echo "ERRO: jq indisponível no runner — gate de design não pode rodar."; exit 1; }
          bash .claude/validation/lint-design-tokens.sh

      - name: Lembrete — checagens semânticas são locais
        run: |
          echo "---"
          echo "AVISO: Este job cobre apenas validações DETERMINÍSTICAS (estrutura, YAML, frontmatter, nomenclatura)."
          echo "Checagens SEMÂNTICAS de conformidade arquitetural (metaspec, invariantes de framework)"
          echo "devem ser executadas localmente via o comando /meta:metaspec-validate,"
          echo "orquestrado pelo agente @metaspec-gate-keeper — fora do escopo do CI."
          echo "---"
