name: Onion Guard Selftest

# ── POR QUE ESTE WORKFLOW EXISTE SEPARADO (medido em 2026-08-16) ─────────────────────────
# A bancada (`lint-selftest.sh`, 689 asserções · 28 fixtures EM 2026-08-16) levava 686s de 729s —
# **94% do CI**. E ela roda em TODO PR. Medição dos 8 PRs daquele dia: **6 tocaram ZERO
# arquivo de maquinaria**; cada um esperou ~12 min por uma suíte que não podia lhes dizer
# nada, porque a bancada prova as GUARDAS, e as guardas não mudaram naquele diff.
#
# A distinção que separa os dois workflows: `onion-validate` é **gate sobre a MUDANÇA** (o
# lint lê o diff e reprova o artefato); esta bancada é **teste de regressão da MAQUINARIA**
# (prova que as guardas reagem certo). Gate e teste de regressão têm gatilhos diferentes.
#
# ⚠️ E POR QUE O FILTRO DE PATH AQUI NÃO REPETE O ERRO DE TRÊS VEZES: o histórico desta casa
# tem três pontos cegos nascidos de filtro de path (`plugins/` #241, `docs/` #254, `ops/`
# #509) — e o defeito comum não foi filtrar: foi filtrar e **não ter mais nada**. Um path
# fora da lista nunca era coberto por ninguém. Aqui o filtro tem uma REDE DEBAIXO: o
# `schedule` noturno roda a bancada INTEIRA na main, independente de path. Logo a cobertura
# deixa de depender de alguém ter tocado o arquivo certo — que era exatamente a aposta que
# falhou nas três vezes.
# (2026-10-13: o filtro de path SAIU — a seleção agora é por família, dentro do run, e o check
#  obrigatório precisa existir em todo PR. O parágrafo fica como a história do porquê da rede.)

# ── BANCADA EM DOIS NÍVEIS, SEM FILA (passo D de D_MERGE_PROCESS_ONION_2026_10, 2026-10-13) ──────────
# O repo é de dono User: a fila nativa (merge_group) não existe aqui, então o padrão "fatia no PR,
# completa na fila" não se transfere. O substituto selado pelo maestro:
#   • PR (`pull_request`): SÓ as famílias que o diff do PR toca — a seleção do pre-commit pelo range
#     `base...head` (ops/testing/selftest-pr-selection.sh). Arquivo que o mapa não sabe classificar,
#     ou diff que toca a bancada/infra (lint-selftest.sh, .github/workflows/*, ops/testing/*), cai na
#     COMPLETA com o porquê no log. A label `ci:full` força a completa.
#   • push ao main: a bancada COMPLETA. Reprovou ⇒ alarme (issue de título fixo, commit culpado
#     nomeado) e branch `revert/<sha12>` com PR de revert, SEM merge automático (o merge do revert é
#     pelo caminho verificado, ops/pr-merge-verified.sh).
#   • JANELA DECLARADA: entre o merge de um PR e o merge do revert, o main PODE estar quebrado (a
#     completa leva da ordem de 25 min por faixa, mais o tempo humano do merge verificado). É o preço
#     aceito de o PR não pagar a bancada inteira a cada auto-rebase.
#   • O check que o ruleset exige é `selftest-gate` (nome fixo, job agregado abaixo) — os nomes das
#     faixas da matriz mudam com o plano e não servem de check obrigatório.
#
# ⚠️ POR QUE O `paths:` DO PR SAIU: com required status check, um PR que não dispara este workflow
# nunca produz o `selftest-gate`, e o ruleset o deixaria pendurado para sempre. O PR que não toca
# maquinaria agora roda só o núcleo da seleção (1 família, segundos) em vez de rodar nada.

on:
  pull_request:
    # labeled/unlabeled: pôr ou tirar a `ci:full` tem de refazer a decisão do nível
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    # 04:17 UTC — a rede debaixo do filtro. Roda a bancada inteira na main todo dia, independente
    # de qualquer seleção. Com a completa no push ao main ela é redundante NO DIA EM QUE HÁ MERGE, e
    # fica: no dia sem merge é ela que pega a quebra que vem de fora (runner, dependência, data).
    - cron: '17 4 * * *'
  workflow_dispatch: {}

# ── CANCELA O RUN SUPERADO ────────────────────────────────────────────────────────────────
# MEDIDO em 2026-09-17: 397 min de CI num dia, 281 deles (71%) na bancada, e pelo menos 53
# min em runs cujo head foi substituído por um push novo ANTES de terminarem. Ninguém leu
# aqueles vereditos — o `pr-merge-verified.sh` ancora os checks no HEAD ATUAL e recusa
# qualquer outro, então resultado de head velho não decide nada, por desenho.
# a bancada custa 23 min; run superado é 23 min de resposta que ninguém vai ler.
# NÃO custa eficácia: cancela só o que já era irrelevante. O que NUNCA se cancela é o run
# do head que vai mergear — esse termina, porque é ele que o gate lê.
concurrency:
  # ⚠️ O `schedule` TEM GRUPO PRÓPRIO, e isto não é detalhe: a rede noturna roda a bancada
  # INTEIRA na main e é ela que justifica qualquer filtro nos PRs (o comentário do topo diz
  # isso com todas as letras — três pontos cegos nasceram de filtro SEM rede embaixo). Com
  # grupo compartilhado, um push na main cancelaria a rede — eu teria cortado justamente a
  # cobertura que torna o corte seguro, que é o modo de falha mais idiota possível.
  # ⚠️ E O PUSH AO MAIN TEM GRUPO POR SHA, SEM CANCELAMENTO (passo D, 2026-10-13): é a bancada
  # COMPLETA do nível main. Com o grupo `refs/heads/main` e cancel-in-progress, o merge seguinte
  # cancelaria a bancada do anterior — e o commit que quebrou o main nunca seria alarmado. E grupo
  # compartilhado sem cancelamento também não serve: o GitHub guarda UM pendente por grupo e descarta
  # o mais velho. Por sha, cada merge tem a sua completa.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'push' && format('push-{0}', github.sha) || (github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── PLANO DE FAIXAS: a resposta que este arquivo JA TINHA ESCRITO ────────────────────────────
  # A nota de 2026-09-13 (abaixo, no job `selftest`) dizia, literalmente: "se encostar de novo, o
  # sinal e a suite ter crescido, e a resposta e PARALELIZAR NO RUNNER, nao subir o teto outra
  # vez". Encostou DUAS VEZES em 2026-09-22/23 — 41m29s e 40m18s, ambas CANCELADAS pelo teto de
  # 40 min, com uma passagem de 32m20s no meio. Subir o teto seria a terceira vez tratando o
  # sintoma. A divisao vive em `ops/testing/selftest-shard-plan.sh` (script versionado, com
  # bancada) e nao inline aqui: YAML inline nao tem teste, e a primeira tentativa inline quebrou
  # o bloco escalar.
  plano:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      faixas: ${{ steps.p.outputs.faixas }}
      nivel: ${{ steps.n.outputs.nivel }}
    steps:
      - uses: actions/checkout@v5
        with:
          # o diff base...head do PR precisa da história dos dois lados
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # NÍVEL (passo D): no PR, a seleção pelo diff; fora do PR, sempre a completa. Labels e shas
      # entram por env, nunca interpolados no script (nome de label é texto de quem abriu o PR).
      - id: n
        name: Decidir o nível da bancada (PR = famílias tocadas · main/cron = completa)
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [ "${EVENTO}" = "pull_request" ]; then
            bash ops/testing/selftest-pr-selection.sh --range "${BASE_SHA}...${HEAD_SHA}" --labels "${LABELS}" > nivel.out
          else
            printf 'nivel=completo\nfamilias=ALL\nmotivo=evento %s roda a bancada completa\n' "${EVENTO}" > nivel.out
          fi
          cat nivel.out
          grep -E '^(nivel|familias|motivo)=' nivel.out >> "${GITHUB_OUTPUT}"
          { echo "### Nível da bancada"; echo; sed 's/^/- /' nivel.out; } >> "${GITHUB_STEP_SUMMARY}"
      - id: p
        name: Distribuir as familias em faixas (por tempo medido)
        env:
          ONION_SHARD_FAMILIES: ${{ steps.n.outputs.familias }}
        run: |
          set -euo pipefail
          plano="$(bash ops/testing/selftest-shard-plan.sh 4)"
          echo "plano: ${plano}"
          echo "faixas=${plano}" >> "${GITHUB_OUTPUT}"

  selftest:
    needs: plano
    strategy:
      fail-fast: false               # uma faixa vermelha nao esconde o resultado das outras
      matrix:
        faixa: ${{ fromJson(needs.plano.outputs.faixas) }}
    runs-on: ubuntu-latest
    # 25 min: medido 908s (15,1 min) local na KVM 8 com 646 guardas; o runner é mais rápido
    # (686s com 689). Os dois números são de 2026-08 e NÃO se reescrevem — snapshot histórico
    # explica a folga que se escolheu naquele dia. O tamanho de HOJE está em
    # `docs/onion/testing-inventory.md` (SSOT gerada, catracada pela REGRA 80), e a suíte
    # CRESCE por desenho: foi teto colado no trabalho existente que cancelou o job em 15m02s
    # em 2026-08-06.
    # 2026-09-13: A MESMA CLASSE, DE NOVO — 1202 guardas, a soma saiu 1202/0 aos 24m59s e o job foi
    # CANCELADO aos 25m03s (PR #822, run 34772891707): verde inteiro, marcado cancelado por 3 s. As rodadas
    # de 09-12/13 já iam de 18 a 23 min. 40 min dá ~60% de folga sobre o medido; se encostar de novo, o
    # sinal é a suíte ter crescido, e a resposta é paralelizar no runner, não subir o teto outra vez.
    # 2026-09-23: ENCOSTOU DUAS VEZES e a resposta acima FOI APLICADA — a suíte roda em 4 faixas de
    # matriz. O teto passa a valer POR FAIXA, e ele NÃO subiu: caiu de 40 para 25.
    # 2026-10-05: a faixa 4 ENCOSTOU DE NOVO — 25m20s em duas tentativas do PR #927 (run 37375759149),
    # canceladas, depois de 20m25s na main pela manhã. A 1ª hipótese (5 faixas) foi REFUTADA no 3º
    # cancelamento: a evidência da main mostrou a família `fixtures` com 997 s + 936 s nos 2 workers de UMA
    # faixa — ela inteira cai numa faixa só, qualquer que seja N. Cura: o plano reparte o manifest da
    # `fixtures` entre TODAS as faixas (fixtures_lane i/n). Volta a 4 faixas, teto em 25.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Capacidade ANTES da suíte: ela degrada gracioso sem tooling (⊘ NÃO VERIFICADO) —
      # correto na máquina do autor, inaceitável aqui: um runner sem jq/pyyaml pularia
      # dezenas de guardas e o job ficaria VERDE sem tê-las exercido.
      - name: Asserção de capacidade do runner (a bancada não pode pular nada)
        run: |
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
          python3 -c "import yaml" >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          missing=""
          for t in jq git openssl awk python3; do command -v "$t" >/dev/null 2>&1 || missing="${missing} $t"; done
          python3 -c "import yaml" >/dev/null 2>&1 || missing="${missing} python3-yaml"
          if [ -n "${missing}" ]; then
            echo "ERRO: capacidade incompleta no runner —${missing}"
            echo "Sem isto a bancada PULA guardas e o verde não significa nada."
            exit 1
          fi
          echo "OK — capacidade completa: jq git openssl awk python3 + pyyaml"

      - name: Auto-teste das guardas (fixtures determinísticas)
        # STRICT=1: qualquer ⊘ (guarda não exercida) REPROVA. É o que separa "verifiquei e
        # está bom" de "não verifiquei" — no CI só o primeiro vale verde.
        env:
          ONION_SELFTEST_STRICT: '1'
          # ⏱ por família no log: é a medida que o collect-family-times.sh lê para o plano dividir as faixas
          # por TEMPO, e não por round-robin (faixas de 5 a 19 min no mesmo PR, 2026-10-07)
          ONION_SELFTEST_TIMING: '1'
          # a fatia desta faixa no manifest da família `fixtures` (o plano a reparte entre TODAS as faixas)
          ONION_SELFTEST_FIXTURES_LANE: ${{ matrix.faixa.fixtures_lane }}
        # --jobs auto: faixa paralela (D_BANCADA_FAIXAS_E_MAPA, 2026-09-03) — cada worker é um
        # processo --child com o mesmo cabeçalho; worker sem trailer de soma = FALHA no pai.
        # --report: o resultado passa a existir FORA do log (ONDA 0.2). `tee` guarda a saída
        # bruta como artefato — o log do job expira e leva junto a única evidência de por que
        # uma guarda reprovou.
        run: |
          set -o pipefail
          bash .claude/validation/lint-selftest.sh --jobs auto \
            --families "${{ matrix.faixa.familias }}" \
            --report "${GITHUB_WORKSPACE}/selftest-report.tsv" 2>&1 | tee selftest.log

      # `if: always()` NOS DOIS PASSOS ABAIXO É O PONTO INTEIRO: a evidência que importa é a do
      # job que FALHOU. Sem isso, o CI só guarda prova de sucesso — e prova de sucesso não
      # ajuda ninguém a consertar nada.
      - name: Sumário legível no job (a bancada conta o que fez)
        if: always()
        run: |
          bash ops/testing/selftest-summary.sh \
            --report "${GITHUB_WORKSPACE}/selftest-report.tsv" \
            --titulo "Auto-teste das guardas — faixa ${{ matrix.faixa.n }}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Evidência de terminal como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-evidence-${{ github.run_id }}-faixa${{ matrix.faixa.n }}
          path: |
            selftest.log
            selftest-report.tsv
          if-no-files-found: warn
          retention-days: 30

  # ── CHECK ESTÁVEL (passo D, 2026-10-13): é ESTE nome que o ruleset do main exige ─────────────────
  # As faixas da matriz se chamam `selftest (N, <famílias>…)` — o nome muda com o plano, e no PR a
  # matriz tem de 1 a 4 faixas conforme a seleção. Check obrigatório com nome móvel ou nunca casa ou
  # casa com a faixa errada. `selftest-gate` roda SEMPRE (`if: always()`) e reprova se o plano ou
  # QUALQUER faixa não terminou em `success` — falha, cancelamento, timeout ou matriz que não nasceu.
  # Faixa que o nível PR legitimamente não criou não é faixa pulada: ela não existe na matriz, e o
  # resultado agregado da matriz é `success` quando todas as que existem passaram.
  selftest-gate:
    name: selftest-gate
    needs: [plano, selftest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Agregar o veredito das faixas
        env:
          PLANO: ${{ needs.plano.result }}
          FAIXAS: ${{ needs.selftest.result }}
          NIVEL: ${{ needs.plano.outputs.nivel }}
        run: |
          echo "plano=${PLANO} · faixas=${FAIXAS} · nível=${NIVEL:-?}"
          if [ "${PLANO}" != "success" ]; then echo "::error::o plano das faixas não terminou em success (${PLANO}) — a bancada não rodou"; exit 1; fi
          if [ "${FAIXAS}" != "success" ]; then echo "::error::faixa(s) da bancada em '${FAIXAS}' — reprovado"; exit 1; fi
          echo "OK — todas as faixas do nível ${NIVEL} passaram"

  # ── ALARME DO MAIN (passo D): só no push ao main, e só quando a completa não passou ──────────────
  # Abre/atualiza a issue de título fixo, prepara `revert/<sha12>` e tenta o PR de revert, SEM
  # MERGEAR. Quando o main volta a passar, fecha a issue. Lógica em script versionado com bancada
  # (ops/testing/main-bench-alarm.sh), não inline: YAML inline não tem teste.
  alarme-main:
    needs: [plano, selftest, selftest-gate]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # empurrar a branch revert/<sha12>
      issues: write          # a issue de alarme
      pull-requests: write   # o PR de revert (ver o limite medido no cabeçalho do script)
      actions: write         # workflow_dispatch do CI na branch do revert
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Alarme e revert (nunca merge)
        env:
          GH_TOKEN: ${{ github.token }}
          PLANO: ${{ needs.plano.result }}
          FAIXAS: ${{ needs.selftest.result }}
        run: |
          set -uo pipefail
          if [ "${PLANO}" = "success" ]; then r="${FAIXAS}"; else r="plano-${PLANO}"; fi
          bash ops/testing/main-bench-alarm.sh --result "${r}" --sha "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
