# Mapa role → bundle de verticais (plugins) — O-QUE-SE-INSTALA por papel.
#
# NÃO confundir com .claude/utils/trust/ (QUEM-FALA-COM-QUEM: relay/advise/correct). Aqui é o ESCOPO
# DE CAPACIDADE: qual conjunto de plugins cada papel recebe. Federação 2026 (marketplace de org):
#   (a) acesso-por-grupo (Team/Enterprise) — role → group → auto-install destes plugins;
#   (b) fallback /meta:adopt — quais verticais vendorizar por papel quando não há marketplace de org.
#
# SSOT dos verticais = .claude/utils/marketplace/verticals/*.manifest.sh + .claude-plugin/marketplace.json.
# Drift-guard: lint check_role_bundle_sync (todo vertical nomeado aqui deve ter manifesto E estar no marketplace).
# Resolver: .claude/utils/marketplace/resolve-role-bundle.sh <role> [--with-optional].
version: 1

roles:
  source:        # TIER 0 — o core (onion-evolve). Instala TUDO: é o autor + a autoridade emissora.
    base: [onion-engineering, onion-product, onion-testing, onion-docs, onion-design, onion-compliance]
    optional: []
    note: "Alem dos verticais, a meta-factory (create-*/adopt/federation-*/evolve/graph/inventory) e core-only e NAO e vertical (ainda) — nunca sai do core."

  hub:           # TIER 1 — trabalho completo; pode expor sub-adotados (concern de trust, nao de install).
    base: [onion-engineering, onion-product, onion-testing, onion-docs]
    optional: [onion-design, onion-compliance]

  standalone:    # TIER 3 — trabalho; dominio (design/compliance) opt-in por projeto (ex.: granaai = +compliance).
    base: [onion-engineering, onion-product, onion-testing, onion-docs]
    optional: [onion-design, onion-compliance]

  consumer:      # TIER 2 — minimo (adota um hub, nao o core).
    base: [onion-engineering, onion-docs]
    optional: [onion-product, onion-testing]

  distilled:     # NAO vendoriza nem instala — destilacao curada (onion-mini, prompt-as-bytecode).
    base: []
    optional: []
