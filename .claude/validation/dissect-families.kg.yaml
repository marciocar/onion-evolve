meta:
  id: dissect-families
  schema_version: "1"
  baseline: "2026-10-24"
  review_after: "2027-01-21"
  purpose: "Registro das famílias de objeto do /meta:dissect, no perfil x_term: cada família declara o que prova cada nível (N0 a N4), os vereditos válidos e o destino padrão. Todo estudo cita a sua família por external_edges, e o .claude/validation/dissect-object-check.sh confere contra este registro."
  note: "Sinônimos ancorados na §6 da doutrina do dissect; os legados A, B e C são labels hidden, lidos pelo checador como apelidos. O destino padrão é do enum da §6, exceto ideia, que declara na Etapa 0. Família nova entra por PR no core antes do N0 do estudo que a pede, nunca durante. Origem: protótipo de um adotante de curadoria, absorvido por decisão do maestro de 2026-10-24."
  # kg-backlog-guard: on
  # ═══ TETO: 16 NÓS ═══

nodes:

  - id: T_FAMILY_FERRAMENTA
    node_type: entity
    plane: DEV
    status: open
    impact: 3
    confidence: 0.7
    label: "Família ferramenta da dissecação."
    trace: ".claude/commands/common/prompts/dissect-doctrine.md"
    verified_at: "2026-10-24"
    verified_against: "decisão do maestro de 2026-10-24 (absorver as peças determinísticas), sobre o desenho do adotante revisado duas vezes pelo Elenxo; a família se prova no 1º estudo que a usa"
    x_term:
      pref: "ferramenta"
      lang: pt-BR
      definition: "Software de terceiro com superfície executável aberta (código, CLI, API, schema)."
      labels:
        - literal: "ferramenta de terceiro"
          kind: alt
          source: ".claude/commands/common/prompts/dissect-doctrine.md"
          locator: "§6, coluna Sinônimos"
          verified_at: "2026-10-24"
        - literal: "tool"
          kind: alt
          source: ".claude/commands/common/prompts/dissect-doctrine.md"
          locator: "§6, coluna Sinônimos"
          verified_at: "2026-10-24"
        - literal: "A"
          kind: hidden
          source: ".claude/commands/common/prompts/dissect-doctrine.md"
          locator: "§6, regras de família: legado x_dissect_family A|B|C"
          verified_at: "2026-10-24"
    x_dissect_family_spec:
      levels:
        N0: "trajetória datada (commits, releases, licença)"
        N1: "verbos da superfície executável"
        N2: "rodar isolado ou ler o código-fonte"
        N3: "régua de transferência com evidência"
        N4: "plano x_absorb_*"
      verdicts: ["absorver", "costurar", "parquear", "rejeitar"]
      default_destination: "core"

