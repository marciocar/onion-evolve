# Fixture kg-drive (SAC-483): ciclo X<->Y entre abertos COM outro nó pronto (C) e um nó a jusante (Z).
# Antes da cura o censo dizia READY e o ciclo passava calado; agora: CICLO (--check exit 1).
meta:
  schema_version: 1
  baseline: "2026-08-01"
nodes:
  - id: C_SOLTO
    node_type: decision
    plane: DEV
    status: open
    impact: 3
    confidence: 1.0
    verified_against: plano
    trace: c.sh
    label: "C pronto, sem dependencia"
  - id: X_ESPERA_Y
    node_type: decision
    plane: DEV
    status: open
    impact: 4
    confidence: 1.0
    verified_against: plano
    trace: x.sh
    label: "X depende de Y"
  - id: Y_ESPERA_X
    node_type: decision
    plane: DEV
    status: open
    impact: 4
    confidence: 1.0
    verified_against: plano
    trace: y.sh
    label: "Y depende de X (ciclo)"
  - id: Z_ESPERA_X
    node_type: decision
    plane: DEV
    status: open
    impact: 2
    confidence: 1.0
    verified_against: plano
    trace: z.sh
    label: "Z depende de X (a jusante do ciclo)"
  - id: X_DONE
    node_type: decision
    plane: DEV
    status: done
    impact: 2
    confidence: 1.0
    verified_against: plano
    trace: d.sh
    label: "predecessor fechado"
edges:
  - from: X_ESPERA_Y
    edge_type: DEPENDS_ON
    to: Y_ESPERA_X
  - from: Y_ESPERA_X
    edge_type: DEPENDS_ON
    to: X_ESPERA_Y
  - from: Z_ESPERA_X
    edge_type: DEPENDS_ON
    to: X_ESPERA_Y
  - from: C_SOLTO
    edge_type: DEPENDS_ON
    to: X_DONE
