    trace: docs/exemplo.md:10
    layer: audit
    plane: PROD
    impact: 3
    confidence: 1.0
    status: confirmed
    verified_at: 2026-07-20
    label: "evidence É a âncora — pedir âncora da âncora é recursivo"

