# Fixture do veredito UNANCHORED com filtro por node_type (REGRA de frescor do kg-radar).
# Existe porque UNANCHORED nasceu em 2026-07-26 SEM teste — o único dos três vereditos de
# frescor sem cobertura. Um veredito sem teste é opinião, não mecanismo.
#
# Todos os nós: plane PROD + verified_at, e SEM verified_against. Só o `claim` deve ser cobrado.
# Os demais ancoram por trace:/TRACES_TO (ou não afirmam) e entram na linha de supressão contada.
# Cada nó tem ≥1 aresta — órfão reprova na INTEGRIDADE e o teste ficaria sobre grafo quebrado.
meta:
  schema_version: "1"
  baseline: 2026-07-01

nodes:
  - id: C_AFIRMA
    node_type: claim
    layer: audit
    plane: PROD
    impact: 4
    confidence: 0.9
    status: confirmed
    verified_at: 2026-07-20
    label: "claim PROD carimbada sem dizer contra O QUE — o caso positivo"

  - id: C_ANCORADA
