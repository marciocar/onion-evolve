# Fixture: modo --state (a fila de abertos) — grafo GRANDE o bastante para haver aberto ABAIXO do top-10.
#
# POR QUE ESTA FIXTURE EXISTE, e não bastou a supersedes-mixed: naquela (9 nós) o top-10 do RADAR é o
# grafo INTEIRO, então o --state legitimamente mostra zero — e um teste de "zero sobreposição" passaria
# VACUAMENTE, sem nunca exercitar a exclusão. Aqui há 15 nós: 10 pesados `confirmed` (impact 5, bem
# conectados) e 4 abertos leves (impact 1, grau 1) que o radar AFUNDA.
#
# E o 15º nó existe por causa de um teste que REPROVOU (2026-08-06): com só os 4 leves, remover a
# exclusão do top-10 era um NO-OP — nenhum aberto estava no radar para ela suprimir, então o mutation
# test (d) não podia falhar de verdade. `Q_PESADA_OPEN` é o aberto que o radar MOSTRA (grau alto,
# impact 5): é o único caso em que a exclusão faz trabalho, e portanto o único que a prova.
#
# Espera: --radar mostra Q_PESADA_OPEN + os pesados · --state mostra só os 4 leves · sobreposição ZERO.
# Sem a exclusão: Q_PESADA_OPEN vaza para o --state e a sobreposição vira 1.
