  - id: C_ALVO_DE_DRIFTED
    node_type: claim
    layer: audit
    plane: DEV
    impact: 3
    confidence: 1.0
    status: confirmed
    label: "alvo cujo superseder esta DRIFTED — superseder vivo, DEVE ser avisado"
  - id: C_DRIFTED_QUE_SUPERSEDE
    node_type: claim
    layer: audit
    plane: DEV
    impact: 3
    confidence: 1.0
    status: drifted
    label: "superseder DRIFTED — mediu e divergiu, segue vivo (fator 1.3)"
  - id: D_ALVO_DRIFTED
    node_type: decision
    layer: audit
    plane: DEV
    impact: 3
    confidence: 1.0
    status: drifted
    label: "alvo DRIFTED que recebe SUPERSEDES de no confirmed — DEVE ser avisado"
  - id: C_SUPERSEDER_VIVO_2
    node_type: claim
    layer: audit
    plane: DEV
    impact: 2
    confidence: 1.0
    status: confirmed
    label: "superseder confirmed do caso de alvo drifted"
  - id: C_SO_REFUTES
    node_type: claim
    layer: audit
    plane: DEV
    impact: 2
    confidence: 1.0
    status: confirmed
    label: "alvo de REFUTES — cobrado pela INTEGRIDADE, nao por esta guarda"
  - id: C_REFUTADOR
    node_type: claim
    layer: audit
    plane: DEV
    impact: 2
    confidence: 1.0
    status: confirmed
    label: "quem refuta"
edges:
  - from: D_SUPERSEDER_VIVO
    to: D_ALVO_VIVO
    edge_type: SUPERSEDES
  - from: D_SUPERSEDER_VIVO
    to: Q_RESPONDIDA
