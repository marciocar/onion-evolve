# Régua de carga da máquina compartilhada, lida por ops/load-lease.sh (chave=valor; o arquivo NÃO é
# executado, só lido). A variável de ambiente de mesmo nome vence o arquivo.
#
# ⚠️ OS NÚMEROS SÃO OS DE HOJE, e mudar a régua é decisão do maestro, não de quem edita este arquivo.
# Origem: DIARIO.md da orquestração de sessões, item 23 (2026-11-03/04): com o load average de 1 min em
# 15 ou mais ninguém abre trabalho pesado novo; quem parou retoma só abaixo de 12. A proposta de limites
# derivados de nproc e memória (`bash ops/load-lease.sh status` imprime a sugestão) foi a mesa da decisão: o
# maestro selou 15/12 com psi 30 em 2026-11-06, no nó D_SO_LIMITES_DERIVADOS_DO_LEASE_1106 do grafo
# docs/evolution/research/session-orchestration-2026-11/session-orchestration-2026-11.kg.yaml.

# Load de 1 min a partir do qual a máquina está OCUPADA: ninguém abre trabalho pesado novo.
ONION_LOAD_HIGH=15
# Quem esperou só retoma abaixo deste load (histerese: liberar em 15 faria a fila oscilar na borda).
ONION_LOAD_RESUME=12
# 2º sinal: pressão de CPU do kernel (/proc/pressure/cpu, some avg10, em %). Vazio = desligado (como foi até
# 2026-11-06). Ligado, ocupa também com psi ≥ este valor e só retoma abaixo dele. Ligado em 30 pelo maestro
# em 2026-11-06 (D_SO_LIMITES_DERIVADOS_DO_LEASE_1106): load 15 pegou 6 de 15 intervalos congestionados, load
# 12 ou psi 30 pegou 13 (E_SO_PSI_CONTRA_LOAD_1106).
ONION_LOAD_PSI_HIGH=30
# Teto da espera, em segundos (30 min). Estourado, a espera sai rc 4 dizendo o load: nunca segue calada.
ONION_LOAD_WAIT_MAX=1800
# Intervalo de sondagem, em segundos.
ONION_LOAD_POLL=20
