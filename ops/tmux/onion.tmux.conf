# onion.tmux.conf — a config do tmux da casa, para operar sessões do Claude Code numa VPS (core-only, versionada).
# Instalação: onion-attach --install-tmux (copia esta config para ~/.config/onion/tmux.conf, fora do repo, e acrescenta
# ao ~/.tmux.conf a linha que a lê; recarrega em cada servidor vivo). Guia: docs/knowledge-base/concepts/tmux-operation-guide.md.
# Origem: a config que o maestro aplicou em 2026-11-25, com dois ajustes da revisão isolada: set-clipboard external e
# allow-passthrough desligado.

set -g mouse on                   # roda do mouse rola, clique escolhe o painel, arrastar seleciona
set -g history-limit 50000        # rolagem grande: sessão de agente escreve muito
set -g default-terminal "tmux-256color"   # itálico e cores corretas; sem terminfo: sudo apt install ncurses-term
set -s terminal-features[10] '*:RGB'        # índice fixo (recarregar não empilha); true color (Windows Terminal e mosh 1.4 repassam)
set -g status-interval 5
setw -g automatic-rename off      # nome de JANELA: o tmux não troca o nome que a janela recebeu (sessão nunca é renomeada sozinha)

# Claude Code dentro do tmux (2026-11-27, pedido do maestro; caminho medido: Windows Terminal → WSL → mosh 1.4 → tmux 3.4)
set -sg escape-time 10            # o Esc responde na hora (interromper o Claude); o padrão do tmux 3.4 atrasa 500 ms
set -g focus-events on
set -s extended-keys on           # Shift+Enter chega ao Claude Code por ssh; pelo mosh NÃO passa (use \ + Enter ou Ctrl+J)
set -s terminal-features[11] 'xterm*:extkeys'   # índice fixo: recarregar não empilha

# Nome em cada painel: com vários agentes abertos, a borda diz de quem é o painel
set -g pane-border-status top
set -g pane-border-format " #{session_name} · #{pane_current_command} "
set -g status-left-length 40
set -g status-left "#[bold] #{session_name} "

# Copiar e colar (2026-11-25, pedido do maestro: «precisamos copiar e colar, inclusive imagens»)
# - arrastar com o mouse copia para a área de transferência do computador local por OSC 52 (o Windows Terminal e o
#   mosh 1.4 repassam a sequência); o terminal local precisa permitir
# - o caminho que sempre funciona: segurar Shift ao arrastar (seleção do próprio terminal local)
set -s terminal-features[9] '*:clipboard'   # índice fixo: recarregar não empilha cópias
# external, não on: a cópia do tmux (o arrastar do mouse) vai ao computador local, mas o app que roda no painel NÃO
# escreve sozinho na área de transferência local (revisão isolada de 25/11)
set -g set-clipboard external
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
# allow-passthrough fica DESLIGADO (o padrão do tmux): imagem não passa pelo terminal (decisão de 25/11), e ligá-lo
# deixaria sequências DCS de conteúdo não confiável chegarem ao terminal local (revisão isolada de 25/11)
