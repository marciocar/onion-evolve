# Publicação da release do KG-SSOT, no espelho público (marciocar/kg-ssot). Dispara na tag kg-ssot-v* que o
# kg_mirror.py publish cria. Este arquivo vem de packaging/mirror/release.yml, na release, e o kg_mirror.py o põe
# em .github/workflows/; o espelho nunca é editado à mão.
#
# O desenho segue o modelo de segurança do Trusted Publishing:
# - um job de build sem credencial nenhuma, que constrói os três artefatos e confere a tag contra o spec/release.json;
# - um job por registro, cada um com o id-token: write só para si e um environment com o maestro como reviewer
#   obrigatório: nada sai sem a aprovação dele;
# - no npm, o trusted publisher só faz stage: a versão só fica pública depois do npm stage approve do maestro, com 2FA;
# - o npm, o MCPB e a release do GitHub só saem depois do PyPI, porque o bundle instala o kg-ssot de lá e um canal
#   rejeitado não deixa o outro adiante; o MCPB final leva um uv.lock gerado contra o PyPI real;
# - os artefatos ganham a atestação de proveniência do GitHub, e o servidor entra no MCP Registry pelo OIDC;
# - a imagem OCI do kg-mcp vai para o ghcr.io depois do PyPI, do mesmo wheel, atrás do environment ghcr;
# - as actions ficam fixadas por SHA de commit.
name: release

on:
  push:
    tags:
      - 'kg-ssot-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false  # nenhum cache entre execuções num workflow que publica
      - name: A tag é a do spec/release.json
        run: |
          want=$(python3 -c "import json; print(json.load(open('spec/release.json'))['tag'])")
          if [ "$want" != "$GITHUB_REF_NAME" ]; then echo "a tag $GITHUB_REF_NAME não é a do spec/release.json ($want)"; exit 1; fi
      - name: Pacote PyPI (ferramentas de build fixadas por hash)
        run: |
          python -m venv "$RUNNER_TEMP/build" && "$RUNNER_TEMP/build/bin/pip" install --quiet --require-hashes -r packaging/python/requirements-build.txt
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) "$RUNNER_TEMP/build/bin/python" -I packaging/python/build.py --outdir dist/pypi
      - name: Pacote npm (dependências pelo lockfile)
        run: |
          (cd tools/runners/ajv && npm ci --ignore-scripts --no-audit --no-fund)
          python -I packaging/npm/build.py --outdir dist/npm
      - name: MCP Bundle (CLI fixada pelo lockfile)
        run: |
          (cd packaging/mcpb && npm ci --ignore-scripts --no-audit --no-fund)
          python -I packaging/mcpb/build.py --outdir dist/mcpb
      - name: A suíte pelo wheel e pelo tarball, antes de qualquer publicação
        run: |
          python -m venv "$RUNNER_TEMP/use" && "$RUNNER_TEMP/use/bin/pip" install --quiet --require-hashes -r tools/requirements.txt
          "$RUNNER_TEMP/use/bin/pip" install --quiet --no-deps dist/pypi/*.whl
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/use/bin/kg-conformance")
          mkdir "$RUNNER_TEMP/npm" && cp packaging/npm/suite.mjs "$RUNNER_TEMP/npm/"
          (cd "$RUNNER_TEMP/npm" && npm init -y > /dev/null && npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE"/dist/npm/*.tgz && node suite.mjs "$GITHUB_WORKSPACE/spec/conformance/fixtures/latest")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/kg-ssot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/pypi/

  npm:
    needs: [build, pypi]  # o npm depois do PyPI: um canal rejeitado não deixa o outro em estágio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/kg-ssot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: npm 12, que tem trusted publishing e stage
        run: npm install -g npm@12.2.0 && npm --version
      - name: Stage no npm (a versão só fica pública com o npm stage approve do maestro, com 2FA)
        # o npm stage publish empacota o diretório atual: roda dentro do tarball já testado no build, extraído. Uma
        # versão que já está no registro (a primeira, publicada à mão pelo maestro) não se publica de novo.
        run: |
          mkdir "$RUNNER_TEMP/pkg" && tar -xzf dist/npm/*.tgz -C "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg/package"
          v=$(node -p "require('./package.json').version")
          if npm view "kg-ssot@$v" version > /dev/null 2>&1; then echo "kg-ssot@$v já está no npm: nada a fazer"; exit 0; fi
          npm stage publish --access public --provenance

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write       # a atestação de proveniência (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: MCPB final, com o uv.lock gerado contra o PyPI real (o kg-ssot da versão acabou de sair lá)
        run: |
          python -m pip install --quiet --require-hashes -r packaging/mcpb/requirements-uv.txt
          (cd packaging/mcpb && npm ci --ignore-scripts --no-audit --no-fund)
          rm -rf dist/mcpb && python -I packaging/mcpb/build.py --outdir dist/mcpb --lock
      - name: Atestação de proveniência dos artefatos (gh attestation verify <arquivo> --repo marciocar/kg-ssot)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/mcpb/*.mcpb
            dist/pypi/*
            dist/npm/*.tgz
      - name: Release no GitHub com o MCPB, o wheel, o sdist e o tarball npm
        env:
          GH_TOKEN: ${{ github.token }}
        # as notas são a mensagem da tag anotada, lida pela API: o gh não aceita --notes-from-tag com --repo
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" -q .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q .message > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME" dist/mcpb/*.mcpb dist/pypi/* dist/npm/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mcpb-final
          path: dist/mcpb/
          if-no-files-found: error

  # a imagem OCI do kg-mcp (packaging/oci), construída do wheel que acabou de ir para o PyPI e testada antes do push:
  # ghcr.io/marciocar/kg-ssot:<versão>, com o label de posse do registro e a atestação de proveniência no próprio
  # registro de imagens. A entrada OCI no server.json do MCP Registry fica fora deste job.
  ghcr:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ghcr
      url: https://github.com/marciocar/kg-ssot/pkgs/container/kg-ssot
    permissions:
      contents: read
      packages: write
      id-token: write       # a atestação de proveniência (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: A imagem, do wheel da release, e os testes dela antes do push
        shell: bash  # liga o pipefail: sem ele, o rc do tee esconderia um teste que falhou
        run: |
          v=$(python3 -c "import json; print(json.load(open('spec/release.json'))['version'])")
          python3 -I packaging/oci/build.py --wheel "dist/pypi/kg_ssot-$v-py3-none-any.whl" --tag "ghcr.io/marciocar/kg-ssot:$v"
          KG_OCI_IMAGE="ghcr.io/marciocar/kg-ssot:$v" python3 -I packaging/oci/smoke.py -v 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if grep -q "skipped" "$RUNNER_TEMP/smoke.log"; then echo "um teste da imagem foi pulado: nada vai ao registro sem eles"; exit 1; fi
          echo "IMAGE=ghcr.io/marciocar/kg-ssot:$v" >> "$GITHUB_ENV"
      - name: Push no ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "DIGEST=${digest#*@}" >> "$GITHUB_ENV"
      - name: Atestação de proveniência da imagem (gh attestation verify oci://<imagem> --repo marciocar/kg-ssot)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/marciocar/kg-ssot
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true  # usa o login do docker do passo anterior: o logout só vem depois
      - name: Logout do ghcr.io
        if: ${{ always() }}
        run: docker logout ghcr.io

  # o servidor no MCP Registry oficial, pelo login OIDC do GitHub (o servidor io.github.marciocar/kg-ssot): o pacote PyPI,
  # cuja posse o registro confere pelo mcp-name do README, e o MCPB da release, com o sha256
  mcp-registry:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: mcp-registry  # o token OIDC do registro vale para todo o namespace do dono: também atrás de reviewer
      url: https://registry.modelcontextprotocol.io/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mcpb-final
          path: mcpb/
      - name: mcp-publisher 1.8.1 (checksum fixado), server.json da versão e publicação
        run: |
          curl -sfL -o "$RUNNER_TEMP/mp.tgz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mp.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mp.tgz" -C "$RUNNER_TEMP" mcp-publisher
          python3 -I packaging/mcp-registry/render.py mcpb/*.mcpb server.json
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
