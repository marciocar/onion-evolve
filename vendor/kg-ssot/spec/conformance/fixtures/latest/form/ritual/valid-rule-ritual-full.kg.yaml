meta:
  schema_version: "1"
  id: valid-rule-ritual-full
  layer: domain
nodes:
  - id: R_A
    node_type: rule
    plane: DEV
    status: open
    impact: 3
    confidence: 0.8
    label: "A regra sintética R_A, cumprida por um ritual do agente."
    owner: ops-lead
    reverify_every: P1D
    x_ritual:
      purpose: "nenhuma pendência passa um dia sem ser vista pelo dono"
      kind: deterministic
      autonomy: notify
      emits: com.example.ritual.briefing.completed
      sources:
        - channel: linear
        - channel: google-calendar
        - channel: slack
          ref: "menções e fios abertos do dia anterior"
      delivery:
        - channel: slack
          to: "mensagem direta a cada pessoa"
      promote: on_failure
      calendar:
        rrule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;BYHOUR=8;BYMINUTE=0;BYSECOND=0"
        dtstart: "20261116T080000"
        tz: "America/Sao_Paulo"
  - id: A_RUNNER
    node_type: artifact
    plane: DEV
    status: open
    impact: 2
    confidence: 0.8
    label: "O executor sintético dos rituais, que emite um CloudEvents por execução."
edges:
  - from: R_A
    to: A_RUNNER
    edge_type: TRACES_TO
