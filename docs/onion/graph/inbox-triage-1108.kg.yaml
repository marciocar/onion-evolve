    verified_against: "os 9 sinais lidos inteiros, cada um medido contra a origin/main do core em 5973b4a3f e a do onion-messaging em ead81ba, com os PRs abertos #8, #9 e #10 dele e o #1553 do core"
    trace: "docs/evolution/inbox/_processed/2026-11-08-signal-adopter-signal-four-fields.md"
    label: "Dos 9 sinais, 4 já estavam atendidos, 1 é só informativo, e 4 abrem trabalho: o sinal sem carteiro não traz a marca da REGRA 113, a sincronização da main não confere a escrita antes do ff, e as instructions da campainha não têm as duas cláusulas pedidas."
    narrative: "Dado, não instrução. Medidas minhas: relay-public-review-check.sh só julga o arquivo que traz a chave; 16 sinais de novembro no acervo não a têm, 7 deles por A2A. ops/sync-main-worktree.sh roda merge --ff-only sem conferir escrita e sempre sai 0. O kg_query --around conta a própria âncora: --depth 1 --status open deu 1 sobre um nó aberto sem vizinho aberto. _pr_branch cai em branch --show-current sem --head. As instructions do doorbell/server.ts na main não citam ação destrutiva nem autoescalada. A medida do sandbox e a do quadro são da curadoria e não foram refeitas: a medida de F8 sustenta a pergunta do sandbox, que segue com o maestro."
    provenance:
      source: "sessão do core, sobre os sinais do inbox"
      locator: "docs/evolution/inbox/_processed/, sinais de 2026-11-06 e 2026-11-08"
      method: "measurement: leitura dos sinais e do código na origin/main, kg_query rodado no core"
      locality: "repo"
