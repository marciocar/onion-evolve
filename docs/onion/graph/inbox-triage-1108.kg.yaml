    narrative: "Cura da nota do sinal da curadoria. Corte pelo nome do arquivo, porque o acervo nasceu sem a marca, e sem lista de legado. O adotante fica fora: o inbox dele é a caixa de saída. Limites: nome com data antiga escapa, e a guarda segue vendo a marca, não o conteúdo; quem julga o conteúdo é a releitura, e o aviso de padrão de segredo é Q_IT_SIGNAL_RECEIVER_WARN. O gatilho do C_TETO_FORA_DO_CARTEIRO pedia caso medido de dano, que não houve: a extensão é decisão de custo baixo, com prazo do hub."
