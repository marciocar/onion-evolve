    verified_at: "2026-11-08"
    verified_against: "SIGNAL-DRAFT.md e D_ADOPTER_SIGNALS_PROPOSAL na origin/main da onion-curation, conferidos pelo peer-ref-check; D_MD_HISTORY_PAGE_KEEPS_NAME_1108 no grafo maestro-decisions-1108; D_SEM_DEPENDENCIA_DE_SERVICO_EXTERNO_1027"
    trace: "docs/evolution/inbox/_processed/2026-11-08-signal-adopter-signal-four-fields.md"
    label: "O core sela em parte a proposta dos quatro campos: L1 e L3 como rampa sem catraca, L2 como rampa no emissor e aviso no receptor; L4 fica parqueada; o GitHub fica fora do caminho do núcleo; nenhuma vertical de monitoramento."
    narrative: "Selado pelo core em nome do maestro, na autonomia em vigor, revogável. Os refutadores do SIGNAL-DRAFT viram critério de reabertura. L4 parqueia porque o próprio estudo diz que o recall é provavelmente baixo e que o mutante não prova dependência do token; gatilho: 20 sinais no formato do comando, ou 2 recorrências que a triagem humana notou e a assinatura teria achado. O GitHub como transporte cai pela regra de não depender de serviço externo. Os nomes de adotante nos caminhos ficam, pelo selo do maestro de 2026-11-08 sobre a retirada do nome valer só para /federacao/. A vertical de monitoramento fica para uma régua de operação, depois do comando existir, porque a régua pré-registrada não podia dar não."
    provenance:
      source: "core, em nome do maestro (autonomia de 2026-11-06, revogável)"
      locator: "pedido do sinal da curadoria de 2026-11-08, item 'selar a proposta, ou devolver com o motivo'"
      method: "testimony: decisão do core sobre proposta da curadoria"
      locality: "repo"
