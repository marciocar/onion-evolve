    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-10: «Coletor de dados do produto do adotante (agregados datados no Company Brain, com proveniência; a persona e as sessões respondem do KG, nunca consultam o banco ao vivo). A réplica e a mudança no banco são do dono do produto. Como seguir?»"
