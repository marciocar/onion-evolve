    narrative: "Segue a ordem do maestro de 2026-10-26: a cada pin novo do core, oferecer o update às sessões adotantes, agrupando. Entram a kg-ssot 4.38.0 com o contrato v4.18 (só SHOULD), com o --with no --revisit e no --decision do kg_query e o provenance.node_sha256, e a REGRA 55 (traces resolvem), que traduz no tsv do kg-trace o mismatch do node_sha256 nomeando o nó e avisa o not_canonical. Andamento em 2026-10-28, com o pin 1d04d4e24cec e o mesmo método da rodada da 4.37.0: os quatro PRs estão abertos, todos com merge da onion/vendor limpo, HARD 0 antes e depois, commits pelo gate do alvo e o bloqueio do gate provado pela REGRA 8 (Inventário canônico sincronizado com o filesystem). O PR 161 da curadoria leva a kg-ssot 4.38.0 pelo vendor do Onion, com 41 grafos passando no MUST, e a onion/vendor dela foi empurrada em fast-forward, como ela aceita. O PR 167 do sge traz só o Onion: a kg-ssot 4.38.0 já tinha entrado pelo PR 166 da sessão dona, com a mesma árvore do vendor do core no pin, e o kg_gate.py dele sai rc 0 sem identidade nova; o inbound diz que a sessão dona roda o kg_gate.py --update e faz o deploy do servidor do chat depois do merge. O PR 293 do kg-ssot traz só o framework; a catraca é da sessão dona, e o comando ficou num comentário do PR, medido numa worktree descartável: o kg_ratchet.py --update muda só o core.pin e o test_kg_ratchet.py passa depois. O PR 1663 do brain foi feito numa worktree separada, já removida, sem tocar o checkout em uso; o carimbo da kg-ssot já chega no commit do espelho público, e o kg_gate.py pede a identidade nova do contrato, que é da sessão dona. O calendário do brain manda no calendário do merge dele: fechamento interno em 30/10 e entrega à registradora em 02/11 (corrigido em 2026-10-29 pelo ack do brain; o registro dizia 31/10). Os resíduos de revisão nos adotantes saem com elenxo: nao, sem til. O merge é de cada sessão dona; o registro recarimba cada um num 2º selo, depois do merge; este nó fecha quando os quatro entrarem. Fechado em 2026-10-29: os quatro PRs entraram (curadoria 161, depois o 163, na main f7fc136; sge 167, na main 8daa811; kg-ssot 293; brain 1663, na onion/develop em bb0d98881bf7, mais o 1669, que selou o gate no contrato v4.18), e o 2º selo do registro carimbou os quatro em 1d04d4e24cec, lido do remoto de cada um."
