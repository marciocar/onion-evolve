  - id: Q_COORD_DECIDIR_VIGIA_DE_EVENTOS
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: maestro
    impact: 4
    confidence: 0.5
    verified_at: "2026-10-29"
    evidence_class: testimony
    verified_against: "os sinais docs/evolution/inbox/_processed/2026-10-28-proposal-event-watcher.md (o pedido do hub) e docs/evolution/inbox/_processed/2026-10-28-proposal-event-watcher-market.md (o estudo da curadoria, PR 162 dela), lidos em 2026-10-29; os casos W1 a W3d são medida da curadoria numa cópia do core fixada em 1d04d4e24, não re-executada pelo core"
    label: "Decidir o vigia de eventos fora da sessão: a coleta, o aceite dos eventos, o caminho do Gmail e o conflito do aviso automático com o «só o humano envia»."
    narrative: "O hub pediu um vigia que leve e-mail, Slack, wiki, GitHub e AWS ao Onion sem um Claude aberto; a curadoria estudou o padrão de mercado por camada. As quatro decisões do maestro: (1) a coleta, pelo Argo Events num k3s com EventBus ou por coletores finos próprios, declarados; (2) o aceite dos eventos, em lote ou automático por regra para coletor confiável e assinado (a triagem antes do aceite contorna o gate e não é recomendada); (3) o Gmail, por push pelo Google Cloud, por IMAP com OAuth ou por IMAP com senha de app; (4) o conflito entre o aviso automático pedido pelo hub e a regra «só o humano envia», mais um membro por coletor no members.yaml. A hipótese do maestro: o vigia roda sobre o A2A do Onion, cada coletor é um remetente A2A que assina o envelope CloudEvents, a fila do receptor no bridge é a caixa durável, o aceite reverifica e a triagem usa a peça de rascunho. Medido pela curadoria numa cópia do core: o CloudEvent assinado passa no a2a-verify, a repetição e o corpo trocado são vetados, e o mutante sem o body_sha256 deixa passar o adulterado. NÃO exercitados: o aceite, a fila do bridge e um coletor real. O A2A 1.0 oficial não assina mensagem; a assinatura é do perfil Onion, e a ligação A2A-CloudEvents é solução própria, porque o mercado não a tem. O pedido de perfil event foi aceito pelo kg-ssot; a hipótese é não precisar de perfil novo, com os atributos do CloudEvents (id, source, type, time, subject e o link) mapeados num nó evidence. Gatilho: a rodada do /meta:decide com o maestro."
  - id: Q_COORD_MAESTRO_DOCCTRL_PIN_NO_SELO
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: maestro
    impact: 3
    confidence: 0.5
    verified_at: "2026-10-29"
    evidence_class: testimony
    verified_against: "sinal da curadoria document-control-2026-10, versionado no inbox do core em docs/evolution/inbox/2026-10-29-curation-document-control-2026-10-c.md (revisado para público), lido inteiro na triagem de 2026-10-29; a medição é do laboratório da curadoria com dados sintéticos, não re-executada no core"
    label: "Decidir o --pin <caminho#ID> no kg-decide-seal.sh, que grava o nó E_ irmão com o node_sha256 da versão aprovada; antes do código, o desenho passa pelo kg-ssot."
    narrative: "A curadoria propõe fechar o ciclo do documento controlado com a corrente de hashes que o contrato já tem: o D_ selado com o testemunho e um E_ irmão (aresta E_ SUPPORTS D_) que fixa o node_sha256 do documento aprovado. A peça que falta é o selo gravar esse E_ sem mexer na proveniência do testemunho. Achado medido pela curadoria na 4.39.0, para o kg-ssot: o --revisit do kg_query NÃO acende quando o documento aprovado muda, nem com o hash regravado; ele julga só a cadência vencida e o REFUTES, e o upstream_changed compara o status, não o hash. Só o kg_trace check acusa a mudança, como node-sha256-mismatch. A curadoria propôs ao kg-ssot um motivo de revisita «o hash fixado mudou», para a aprovação entrar na fila de revisão e não só no check. Gatilho: decisão do maestro. Depois do selo, o desenho vai ao kg-ssot e o código é do core."
