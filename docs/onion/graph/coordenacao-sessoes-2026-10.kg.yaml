    label: "Decidir que x_raci, x_doc_version, x_copy_* e o par E_ SUPPORTS D_ ficam como convenção do adotante até dois adotantes usarem a mesma forma."
    narrative: "O kg-ssot já propôs a forma: x_raci aninhado (responsible, accountable, consulted, informed), lido pelo --where da 4.39.0, com o owner do contrato como o A. Nenhuma norma exige RACI (a SOC 2 pede responsabilidade definida, não a matriz). A proposta é não promover nada a perfil canônico com um uso só: a convenção vira perfil quando um 2º adotante usar a mesma forma. Gatilho: decisão do maestro; depois dela, o gatilho da promoção é o 2º uso."
