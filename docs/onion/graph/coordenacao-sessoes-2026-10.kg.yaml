    label: "Decidir levar ao hub a receita do piloto do documento controlado: o procedimento com dono e RACI, a cadência, PDF e DOCX gerados da fonte, um COPY_ por camada e a aprovação com o par de nós."
    narrative: "O piloto é do hub, pela sessão dele (um escritor por repo); o core leva só a forma, sem conteúdo do hub. A ordem proposta é: (1) o procedimento de controle de acesso como nó com dono e RACI; (2) a cadência com reverify_every, que dá aviso pelo --due e pelo radar, não reprovação; (3) a fonte gerando PDF e DOCX (Pandoc e WeasyPrint, medidos pela curadoria); (4) um COPY_ por camada (wiki, Drive, Slack), com o adaptador do hub; (5) a aprovação com o par de nós, que depende do --pin. Gatilho: decisão do maestro."
