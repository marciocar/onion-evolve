    label: "A rodada de update da 4.37.0 aos quatro adotantes, com o pin 5b27d09c088f do core."
    narrative: "Segue a ordem do maestro de 2026-10-26: a cada pin novo do core, oferecer o update às sessões adotantes, agrupando. Entram a kg-ssot 4.37.0 com o contrato v4.17, o --with na REGRA 112 (Página com projection_of cita ids que existem nos grafos dela) com a cura da bancada (g), a cura da REGRA 36 (Superfície VENDORIZADA sem nome comercial de cliente) para o & entre chave=valor, o tsv do kg-trace com scheme e sha256, o resultado do teste A2A e o grafo do Company Brain. Andamento em 2026-10-28, com o pin 5b27d09c088f: os quatro PRs estão abertos, todos com merge da onion/vendor limpo, HARD 0 antes e depois, e o bloqueio do gate provado pela REGRA 8 (Inventário canônico sincronizado com o filesystem). O PR 157 da curadoria está verde, e a onion/vendor dela foi empurrada em fast-forward, como ela aceita. O PR 165 do sge está verde e traz a kg-ssot 4.37.0 num commit à parte, porque o vendor da kg-ssot do sge é dele e o update do Onion não o toca; a sessão dona roda o kg_gate.py --update e faz o deploy do servidor do chat depois do merge. O PR 290 do kg-ssot tem o check conformance vermelho até a sessão dona gravar a catraca no pin novo (kg_ratchet.py --update com o core, medido numa worktree descartável: o teste da catraca passa depois). O PR 1656 do brain foi feito numa worktree separada, sem tocar o checkout em uso, e torna o PR 1652 desnecessário: os dois mexem na mesma linha do carimbo da kg-ssot, e este já leva o commit do espelho público da 4.37.0. O calendário do brain manda no calendário do merge dele: fechamento interno em 30/10 e entrega à registradora em 02/11 (corrigido em 2026-10-29 pelo ack do brain; o registro dizia 31/10). O merge é de cada sessão dona; o registro recarimba cada um num 2º selo, depois do merge; este nó fecha quando os quatro entrarem. Fechado em 2026-10-28: os quatro PRs entraram (curadoria 157, depois do 158, na main 9d441fa; sge 165, na main a301237, com o deploy feito pela sessão dona; kg-ssot 290; brain 1656, com o 1652 fechado), e o 2º selo do registro carimbou os quatro em 5b27d09c088f, lido do remoto de cada um."
