    narrative: "O hub pediu um vigia que leve e-mail, Slack, wiki, GitHub e AWS ao Onion sem um Claude aberto; a curadoria estudou o padrão de mercado por camada. As quatro decisões do maestro: (1) a coleta, pelo Argo Events num k3s com EventBus ou por coletores finos próprios, declarados; (2) o aceite dos eventos, em lote ou automático por regra para coletor confiável e assinado (a triagem antes do aceite contorna o gate e não é recomendada); (3) o Gmail, por push pelo Google Cloud, por IMAP com OAuth ou por IMAP com senha de app; (4) o conflito entre o aviso automático pedido pelo hub e a regra «só o humano envia», mais um membro por coletor no members.yaml. A hipótese do maestro: o vigia roda sobre o A2A do Onion, cada coletor é um remetente A2A que assina o envelope CloudEvents, a fila do receptor no bridge é a caixa durável, o aceite reverifica e a triagem usa a peça de rascunho. Medido pela curadoria numa cópia do core: o CloudEvent assinado passa no a2a-verify, a repetição e o corpo trocado são vetados, e o mutante sem o body_sha256 deixa passar o adulterado. NÃO exercitados: o aceite, a fila do bridge e um coletor real. O A2A 1.0 oficial não assina mensagem; a assinatura é do perfil Onion, e a ligação A2A-CloudEvents é solução própria, porque o mercado não a tem. O pedido de perfil event foi aceito pelo kg-ssot; a hipótese é não precisar de perfil novo, com os atributos do CloudEvents (id, source, type, time, subject e o link) mapeados num nó evidence. Gatilho: a rodada do /meta:decide com o maestro."
