    narrative: "Segue a ordem do maestro de 2026-10-26: a cada pin novo do core, oferecer o update às sessões adotantes, agrupando. Entram a kg-ssot 4.39.0 com o contrato v4.18 sem mudança, com o kg_query --where (a minha fila por dono, citada no passo 4 do /meta:backlog); a guarda do carteiro para destino público, que muda o co-relay.sh no adotante: relay a destino público, e o core é público, passa a exigir --confirm-public e entrega o sinal com reviewed_for_public: false; e a REGRA 113 (Sinal relayado a destino público só se commita revisado). Andamento em 2026-10-29, com o pin c091dc66cf5c e o mesmo método das rodadas da 4.37.0 e da 4.38.0: os quatro PRs estão abertos, com HARD 0 antes e depois, commits pelo gate do alvo e o bloqueio do gate provado pela REGRA 8 (Inventário canônico sincronizado com o filesystem); o inbound de cada um diz com destaque a mudança do carteiro. O PR 166 da curadoria leva a kg-ssot 4.39.0 pelo vendor do Onion, com 44 grafos passando no MUST; o merge teve 1 conflito só em projeção gerada, regenerado pelo helper; a onion/vendor dela foi empurrada em fast-forward, como ela aceita. O PR 169 do sge traz só o Onion: a 4.39.0 já tinha entrado pelo commit 9d6a44d da sessão dona, com a mesma árvore do vendor do core no pin, e o kg_gate.py sai rc 0 sem pedir identidade nova, porque o contrato não mudou. O PR 298 do kg-ssot traz só o framework; a catraca é da sessão dona, e o comando ficou num comentário do PR, medido numa worktree descartável: o kg_ratchet.py --update muda o bloco core (pin, 206 para 208 grafos, 202 para 204 no MUST) e o test_kg_ratchet.py passa depois. O PR 1691 do brain foi feito numa worktree separada, já removida, sem tocar o checkout em uso; o carimbo da kg-ssot chega no commit do espelho público, e o kg_gate.py não pede identidade nova. O calendário do brain manda no merge dele: fechamento interno em 30/10 e entrega em 02/11. Os resíduos nos adotantes saem com elenxo: nao, sem til. O merge é de cada sessão dona; o registro recarimba cada um num 2º selo, depois do merge; este nó fecha quando os quatro entrarem. A 2ª onda (2026-10-30, pin 67e9d003689f, o mesmo método) foi só à curadoria e ao kg-ssot: o sge e o brain ficam para depois, por decisão do maestro de 2026-10-30, porque ainda têm aberto o PR da 4.39.0 (169 e 1691). Viajam a kg-ssot 4.39.1 e 4.40.0 (o digest marca o grafo ilegível como unreadable e aceita lote; o --revisit ganha o motivo pin-changed, a receita do documento controlado da curadoria; os JSON passam a revisit/2 e digest/2; o contrato segue v4.18), e o PR 1437 (nomes de business-context alinhados ao /docs:build-business-docs, carimbo e /meta:inventory no build, a doutrina client-material e o kg-trace.sh lendo .kg-ssot/trace-external-roots.txt). O PR 1438 (plano do spike do Copilot Studio) é core-only, e os PRs 1439 e 1440 não tocam o manifesto. O PR 172 da curadoria leva a kg-ssot 4.40.0 pelo vendor do Onion, com 45 grafos passando no MUST; o merge de onion/vendor foi limpo, e a onion/vendor dela foi empurrada em fast-forward (816c023 para 0d5a83e), como ela aceita. O PR 306 do kg-ssot traz só o framework, sem empurrar a onion/vendor; o comando da catraca ficou num comentário do PR, medido numa worktree descartável: o kg_ratchet.py --update muda só o bloco core (pin, 208 para 210 grafos, 204 para 206 no MUST), e o test_kg_ratchet.py passa de 18 para 19 de 19. Nos dois: HARD 0 antes e depois, commits pelo gate do alvo sem --no-verify, e o bloqueio provado pela REGRA 8 (Inventário canônico sincronizado com o filesystem). No kg-ssot, a 1ª prova saiu rc 4 (INTEGRIDADE) em falso: o prove-gate-blocks.sh fotografa o git config --local, que numa worktree é o .git/config compartilhado, e a sessão dona abriu uma branch com rastreio no remoto dentro da janela da prova. A 2ª prova provou o bloqueio. Este nó fecha quando os quatro adotantes estiverem na 4.40.0 ou além."
