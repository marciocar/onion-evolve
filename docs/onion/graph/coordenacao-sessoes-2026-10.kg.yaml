  title: "Coordenação entre as sessões: a lista única de pendências, com dono"
  date: "2026-10-27"
  baseline: "2026-10-27"
  purpose: "A lista única de pendências que o maestro pediu em 2026-10-27 («pergunte de tudo que está pendente e organize com o core para as outras sessões»), mantida pelo core. Um nó question aberto por pendência, com o dono no campo owner do contrato (v4.8 da kg-ssot): core, curadoria, kg-ssot, brain, sge ou maestro. DEPENDS_ON diz o que espera o quê. Cada sessão consulta a sua parte por kg_query, e o /meta:backlog projeta tudo em docs/backlog.md agrupado por dono."
  note: "TETO, declarado: este grafo guarda o COMPROMISSO e a ORDEM, não o fato. A pendência que já tem nó em outro grafo do core NÃO ganha nó aqui; entra por external_edges (Q_DESIGN_CONTEXT_PRIMEIRA_CLASSE_1027 é a onda 1 do design, por exemplo). Nó de outro repositório entra pela proveniência com a URL fixada no sha, conferida por peer-ref-check, porque o gate só confere external_edges contra os grafos deste repo. O estado dos PRs é o da medição de 2026-10-27, e o grafo não se atualiza sozinho: quem fecha uma pendência fecha o nó aqui, com carimbo, e o backlog a tira na regeneração seguinte. O core não escreve nome de cliente nem conteúdo de repo privado: o brain e os adotantes aparecem pelo nome."
