    trace: .claude/commands/meta/adopt.md
    layer: audit
    plane: DEV
    impact: 4
    confidence: 0.9
    status: confirmed
    label: "ATUALIZAR um repo adotado (/meta:adopt --update) — traz o delta do framework via merge de vendor-branch + re-config + re-stamp; idempotente"
    provenance:
      source: ".claude/commands/meta/adopt.md"
      locator: ".claude/commands/meta/adopt.md"
      method: "derivado: trace do nó, sem registro de medição"
  - id: TX_invite
    node_type: decision
