edges:
  # source e a origem: cria, adota, atualiza; o distilled deriva dele
  - from: TX_create
    to: ROLE_source
    edge_type: DEPENDS_ON
  - from: ROLE_standalone
    to: TX_create
    edge_type: DEPENDS_ON
  - from: TX_adopt
    to: ROLE_source
    edge_type: DEPENDS_ON
  - from: ROLE_consumer
    to: TX_adopt
    edge_type: DEPENDS_ON
  - from: TX_update
    to: ROLE_consumer
    edge_type: DEPENDS_ON
  - from: ROLE_distilled
    to: ROLE_source
    edge_type: DEPENDS_ON
  # promocao: standalone/adopted → hub
  - from: TX_promote_hub
    to: ROLE_standalone
    edge_type: DEPENDS_ON
  - from: ROLE_hub
    to: TX_promote_hub
    edge_type: DEPENDS_ON
  # o hub e o ator das transicoes de rede (convite/transferencia/desacople)
  - from: TX_invite
    to: ROLE_hub
    edge_type: DEPENDS_ON
  - from: TX_transfer
    to: ROLE_hub
    edge_type: DEPENDS_ON
  - from: TX_decouple
    to: ROLE_hub
    edge_type: DEPENDS_ON
  - from: ROLE_decoupled_source
    to: TX_decouple
    edge_type: DEPENDS_ON
  # o visitante nasce do convite: a autoridade-de-pessoa depende da transição que a cria
  - from: AUTH_visitor
    to: TX_invite
    edge_type: DEPENDS_ON
