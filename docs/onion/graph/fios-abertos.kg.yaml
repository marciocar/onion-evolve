  - id: C_BACKLOG_DE_DOCUMENTO_ORDENA_ITEM_MORTO
    node_type: claim
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-08
    verified_against: 15-itens-do-inventario-revalidados-um-a-um-contra-o-vivo-5-mortos
    label: "Tese fundadora deste arquivo, e ela nasceu MEDIDA: revalidando 15 itens do inventario contra o vivo, CINCO ja estavam mortos (33%) — 4 entregues (R45 tem 43 entradas de baseline e nao 0; double-firing amputado; o `2>/dev/null` do gerador curado por `_gen_into`; R3 virou allowlist) e 1 refutado (producao alcancou o repo). O inventario vinha da §7 de onion-guardas-mapa-2026-08, snapshot de 03/08. Backlog montado de DOCUMENTO, e nao de ARTEFATO, ordena itens mortos — e a mesma sessao ja tinha cometido isso com o GIT_DIR, diagnosticando num checkout de julho um bug curado em 04/08."
    trace: "docs/analysis/onion-guardas-mapa-2026-08.md"

