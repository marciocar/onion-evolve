    label: "PAGO. E o caminho ate aqui vale mais que o resultado. ⚠️ ESTE ROTULO JA MENTIU: por horas ele afirmou \"FECHADO SEM MERGE, 3 de 4 disseram CAI, a conclusao que vale e que grep sobre LINHA e o instrumento errado\". O juiz dissera FICA-COM-RESSALVA e medira 324 scripts de terceiros com 810 extracoes e ZERO falsos — \"o motor esta certo, nao mexa nisso\". Eu reproduzi UM modo de falha (heredoc lido como declaracao), generalizei dele para o instrumento inteiro, FECHEI o PR, e nao corrigi o no quando fui refutado. Foi a revisao de alinhamento que pegou: o diagnostico que prometi ao \"proximo ciclo\" vivia nos COMENTARIOS DO PR — zero mencoes no grafo — que e literalmente C_BACKLOG_DE_DOCUMENTO_ORDENA_ITEM_MORTO, a tese fundadora deste arquivo, violada por mim. AS 4 CURAS, todas medidas: (a) elidir corpo das aspas ANTES de cortar comentario, e cortar `#` so quando INICIA token — mata DOIS achados de uma vez (o falso-positivo de string e o `sed` que decapitava a linha em `$#`/`${v#pfx}`, invisibilizando 3 declaracoes pt-BR REAIS em 27 arquivos de arg-parsing); (b) baseline regenerado DEPOIS: 7 -> 4, saindo os 2 FANTASMAS (prosa em string carimbada como divida) mais o `alvoPendente` ja curado no #570, e ZERO entradas novas; (c) universo = rastreado UNIAO nao-rastreado, com exit 2 no vazio — o pior caso era o adotante recem-adotado, com 51 scripts no disco e 0 rastreados, recebendo \"✅ nenhum identificador NOVO\" no dia 1; (d) a fixture do caso (e) passou a conter declaracao DENTRO de comentario, porque sem isso o caso NAO PODIA FALHAR — apagar o strip inteiro mantinha 7/7 verdes. A LICAO QUE FICA, e ela e sobre mim: eu quase descartei um instrumento que funciona por ter medido UM caso e concluido sobre TODOS. A medicao do juiz (324 scripts, 0 falsos) e o tipo de evidencia que eu nao produzi antes de decidir descartar."
