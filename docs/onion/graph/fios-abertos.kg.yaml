    label: "O script que protegeu a chave GPG raiz (2026-08-11) FUNCIONOU e foi apagado na mesma sessão, marcado 'temporário'. Quatro dias depois o maestro repetiu a receita de memória (`printf senha > /tmp/np.txt && bash ~/protege-chave.sh`) — o script não existia mais, e o `shred` que ele fazia no fim TAMBÉM NÃO. MEDIDO: a senha ficou em modo 0644 (`-rw-rw-r--`) por ~1h15 numa máquina com CINCO contas com shell, incluindo a conta COMPARTILHADA de uma equipe de membro da federação (id `granaai`). Mesma classe de [[I_SENHA_DO_DASHBOARD_VAZOU_NA_MINHA_MEDICAO]], por caminho novo: não foi a medição que vazou, foi o PROCEDIMENTO que evaporou. Cura como mecanismo (não conselho): `ops/gpg-protect-key.sh` versionado — RECUSA arquivo de senha legível por outros (o defeito exato), é CIENTE DO ESTADO (a v1 assumia senha antiga vazia e falharia obscuro hoje), tem `--check` que não muda nada, e destrói o arquivo no `trap EXIT` mesmo quando RECUSA. Provado no próprio incidente: rodado sobre `/tmp/np.txt`, recusou com a instrução certa e o arquivo saiu por `shred`. Corolário: procedimento sensível não é 'temporário' — o que evapora volta como exposição."
