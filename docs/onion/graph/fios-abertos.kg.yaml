    label: "O radar ordena por `impact × confidence × statusFactor × (1 + grau)`, e o grau e NAO-DIRECIONADO: `DEPENDS_ON` nao afunda o bloqueado, SOBE OS DOIS. Logo a topologia NAO expressa precedencia, e nenhuma escrita de aresta faz o radar emitir ordem de execucao. Isso nao e defeito a consertar — e limite a DECLARAR, porque a tentacao de reconcilia-lo mexendo em `impact`/`confidence` e o defeito fundador da REGRA 49 cometido na autoria."
