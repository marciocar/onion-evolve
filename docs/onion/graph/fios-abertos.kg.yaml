    verified_at: 2026-08-09
    verified_against: duas-ancoras-quebradas-por-rename-na-mesma-sessao-uma-pega-pela-guarda-outra-nao
    label: "Renomear identificador MATA ancora de `sed`/`grep` que o cita, e o silencio e o padrao. Duas vezes nesta sessao: `SUMARIO_IMPRESSO`→`SUMMARY_PRINTED` matou a injecao do trap no runner extraido (ninguem viu — o runner so parou de gritar), e `achou`→`found` matou a mutacao do caso (p) (a guarda-da-guarda ACUSOU: 'a mutacao NAO foi aplicada'). A diferenca entre os dois desfechos e ter ou nao ter `_prove_mutation` no caminho. Corolario pratico: rename exige RE-RODAR o que depende de texto, e ancora que cita identificador merece a nota dizendo isso."
    trace: ".claude/validation/lint-selftest.sh"

