    label: "EXECUTADO 2026-08-10, pelo maestro e por mim, com o que resta DECLARADO como limite de PRODUTO. (A) BRIDGE: o drop-in de memoria protegia `onion-bridge.service`, unit inexistente desde o rename para o prefixo `onion-vps-`; o bridge vivo rodava com MemoryMin=0. Movido + `NoNewPrivileges=yes`; verificado no cgroup (memory.min=268435456, ancestral de 384M concedendo o piso INTEIRO) e por `/health` 200. ⚠️ EU DERRUBEI O SERVICO no caminho sugerindo `ProtectHome=yes` junto — `/home` inacessivel quebra um servico cujo ExecStart vive em `/home/onion/onion-bridge` (203/EXEC, 8 restarts). E eu JA TINHA LIDO o WorkingDirectory nesta mesma sessao: nao faltou dado, faltou usar o que se mediu. (B) WAHA: chave da API ROTACIONADA e o container passou a receber so o HASH — `.envrc`/`up.sh` exportam `sha512:$(printf %s "$(pass show ...)" | sha512sum)`. Verificado nas quatro pontas: `docker inspect` mostra hash, chave nova autentica 200, chave ANTIGA da 401, e a sessao do WhatsApp sobreviveu (bind mount no host, medido antes de agir). A rotacao antes do hash foi o que tornou INERTE a chave que vazara em transcript de sessao anterior. ⚠️ MINHA MEDICAO ERROU DUAS VEZES no caminho e as duas por metodo: procurei o VALOR em arquivos e conclui \"a credencial so existe no container, recriar perde\" — falso, o `pass` (GPG) e a fonte e guarda CIFRADO, meu metodo nao podia achar; e afirmei ter matado um shell preso conferindo um padrao DIFERENTE do que matei. LIMITE DE PRODUTO, sem cura por configuracao: `WAHA_DASHBOARD_PASSWORD` e comparado em TEXTO PURO (`apps/app_sdk/auth.js` usa `password.value` num mapa de basic-auth; `sha512` so existe no `ApiKeyAuthFactory`). Mitigacao possivel, nao cura: rotacionar tambem a senha, para que o valor exposto ao `docker inspect` ao menos nao seja o que ja circulou — o que deixou de ser opcional em [[I_SENHA_DO_DASHBOARD_VAZOU_NA_MINHA_MEDICAO]]. ⚠️ CARIMBO CORRIGIDO PELO REVISOR (#574): eu havia deixado `status: confirmed` com carimbo PROD completo, enquanto os outros seis `decision`/PROD verificados do arquivo estao `done` — e `statusFactor(confirmed)=1.0` contra `done=0.1` fazia um item JA EXECUTADO pesar 10x no radar. Colher e mudar o STATUS, nao so escrever o carimbo; carimbo sem status e meia-colheita, e a metade que falta e justamente a que o instrumento le."
