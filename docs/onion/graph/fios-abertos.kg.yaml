  # A FILA DE TRABALHO ABERTO DO CORE — colhida no lugar, por isso sem data no nome.
  #
  # ═══ CONTRATO DE LEITURA (não conserte a discordância; ela é informação) ═══
  # O `--radar` responde O QUE CUSTA CARO ESTAR ERRADO. As arestas DEPENDS_ON entre ondas respondem
  # O QUE VEM ANTES. Eles NÃO coincidem e não devem ser feitos coincidir: a atenção do radar é
  # `impact × confidence × statusFactor × (1 + grau)`, e o grau é NÃO-DIRECIONADO — `DEPENDS_ON` não
  # afunda o bloqueado, SOBE OS DOIS. (A W0 foi COLHIDA em 2026-08-08, com a onda e o item saindo no
  # mesmo commit — a história ficou no git e no artefato de revisão, que é o desenho.)
  # ⚠️ Commit que muda `impact:`/`confidence:` sem mudar `label:` e sem trazer medição É o sinal de
  # que este arquivo apodreceu. É o defeito fundador da REGRA 49 cometido na AUTORIA.
  #
  # ═══ FRONTEIRA (mecânica, não disciplinar) ═══
  # NENHUM FATO NASCE AQUI. O radar só enxerga arestas DENTRO de um arquivo — logo a única coisa que
  # não cabe nos grafos existentes é a RELAÇÃO ENTRE ELES. Nó só entra para ser ponta de aresta
  # cross-grafo, e o próprio radar cobra isso (órfão grau 0 → exit 1).
  # Teste antes de criar: "se eu apagar este nó, perco um FATO ou perco só a ORDEM?" Perdeu fato →
  # você duplicou SSOT. Achado mora onde nasceu; aqui mora o COMPROMISSO, citando o id alheio.
  #
  # ═══ POR QUE TUDO É plane: DEV ═══
  # O backlog afirma sobre TRABALHO, não sobre produção. `impact` é o real, NUNCA rebaixado —
  # rebaixar seria a FUGA-DE-ESCOPO da própria catraca, cometida na criação. Consequência medida:
  # zero nós no escopo da REGRA 49, zero HARD, zero linha nova no baseline, zero carimbo mentiroso.
  # E a R49 volta a morder onde deve: ITEM só vira `done` em `plane: PROD` COM `verified_at` +
  # `verified_against`. QUEM NÃO CONSEGUE CARIMBAR NÃO PODE DECLARAR FEITO.
  # As `question` levam `verified_against` SEM `verified_at` de propósito: entram no `--freshness-tsv`
  # e envelhecem sozinhas. Se algum gate futuro estender a R49 a `plane: DEV`, saiba que esta
  # população é deliberada.
  #
  # kg-backlog-guard: on
  # ↑ opt-in da REGRA 58, DELIBERADAMENTE separado da linha do TETO: se o escopo fosse o
  #   proprio TETO, apagar aquela linha DESLIGARIA a guarda em vez de disparar o SEM-TETO.
  # ═══ TETO: 20 NÓS. Onda nova exige onda COLHIDA. ═══
  # Colher = onda e itens saem no MESMO commit; a história fica no git e no artefato de revisão.
  # O radar impede meia-colheita: item sem onda → aresta órfã (HARD); onda sem item → grau 0 (HARD).
  # Rotina (branches, higiene) NÃO entra aqui — vai para checklist. O grafo é para RISCO.

