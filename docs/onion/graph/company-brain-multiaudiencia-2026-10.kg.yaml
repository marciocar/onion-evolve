    label: "Proposta condicional da curadoria para Q_MA_MARKET: no plano atual nenhum caminho de prevenção rodou; o padrão de mercado é um repo por audiência numa organização gratuita, condicionado ao card do maestro (Q_MA_FREE_ORG_READ_ENFORCED)."
    narrative: "Origem: o PR 153 da curadoria (três pré-registros, dois braços em fonte primária, um laboratório local e um Gitea 28.2.0 rodados, e uma revisão adversarial que reprovou a 1ª versão). PLANO ATUAL (conta pessoal, GitHub gratuito): nenhum caminho de prevenção rodou. O colaborador de repo privado de conta pessoal sempre escreve, porque não há papel só de leitura; não há proteção de branch, CODEOWNERS nem rulesets; a CI só detecta. RECOMENDAÇÃO, condicional, pelo padrão de mercado (lei de Conway, Team Topologies, Data Mesh, InnerSource): um repo por audiência numa organização gratuita, cada equipe com Write no seu repo e Read no outro; uma conta por audiência, porque o dono da organização tem admin em tudo e é bypass declarado; o consumidor liga ao dono por git submodule fixado; a proposta cruzada por PR de fork (InnerSource); o MCP oficial do GitHub herdando a permissão da conta. ALTERNATIVAS: o Pro, que previne no merge (CODEOWNERS com revisão exigida); o Team, que previne no push por caminho (push rulesets); o Gitea auto-hospedado, que previne no push mas é de sentido único (quem está na whitelist escreve tudo); ou só detecção no plano atual. CUSTOS: a migração (referências ao dono atual espalhadas pelos repos da família); o Pages, que não redireciona na transferência; o fork privado, desligado por padrão numa organização nova; e o KG-SSOT partido entre repos (a ponta externa não qualifica o repo, o submodule escapa do ls-files, não há pin no sentido inverso, os grafos que cruzam contextos ficam sem dono), pergunta que a curadoria leva ao kg-ssot. Refutador da curadoria: se o push do card passar, ou se a migração custar mais que o plano pago, a recomendação passa ao plano pago."
