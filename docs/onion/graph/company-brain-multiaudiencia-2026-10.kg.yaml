    narrative: "Estudo de campo da curadoria, no método dela (/onion-research ou /meta:dissect, em .kg.yaml com radar exit 0), com o mercado e o capital como eixo invariante. Pergunta-guia: quem separa a escrita por audiência e mantém a leitura cruzada, como faz a barreira (permissão por espaço, papel, aprovação) e como trata sensibilidade. Alimenta Q_MA_WRITE_SURFACE, Q_MA_ENFORCEMENT e a rodada de padrão de mercado da classificação. Pauta inicial do maestro (2026-10-28) para a curadoria verificar; são CANDIDATOS, não fatos verificados: domain ownership e governança federada do Data Mesh; Team Topologies e a lei de Conway; InnerSource; docs-as-code com dono por repo (por exemplo, o TechDocs do Backstage); git subtree e submodule contra vendorização com pin; policy-as-code para a permissão de escrita."
