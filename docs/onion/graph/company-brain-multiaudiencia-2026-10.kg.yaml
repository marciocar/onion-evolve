  slug: company-brain-multiaudiencia-2026-10
  title: "Company Brain multiaudiência: negócio e tecnologia na mesma fonte, cada um escrevendo só no que é seu"
  date: "2026-10-28"
  baseline: "2026-10-28"
  review_after: "2026-11-27"
  purpose: "O grafo de pendências que o adotante brain (o hub da empresa) pediu ao core em 2026-10-27: como o Company Brain serve o negócio e a tecnologia ao mesmo tempo, com leitura cruzada, sem que um sobrescreva o lado do outro e sem que nada errado passe despercebido. O core orquestra; a curadoria e o kg-ssot respondem às perguntas deles pelos próprios canais; o maestro decide o custo e a arquitetura. Um nó por pendência, com o dono no campo owner (core, curadoria, kg-ssot, brain ou maestro). DEPENDS_ON diz o que espera o quê."
  note: "TETO, declarado: este grafo guarda as PERGUNTAS, o COMPROMISSO e a ORDEM, não o desenho. Nada se implementa antes de D_MA_ARCH: o hub segue com o que já está decidido (wiki antes do Drive; nenhuma pessoa de negócio com escrita no repo). A pendência que já tem nó em outro grafo do core entra por external_edges (a medida da ida e volta A2A, a decisão do MCP remoto). Nó de outro repositório entra em texto até existir aresta entre repos. O core não escreve nome de cliente, de pessoa nem conteúdo de repo privado: o hub aparece como «o hub» ou «o adotante brain». Grafo de camada de coordenação, na forma de coordenacao-sessoes-2026-10."
