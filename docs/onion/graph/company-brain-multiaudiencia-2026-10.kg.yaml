    impact: 5
    confidence: 0.5
    label: "Que campo de classificação/visibilidade entra no contrato do grafo, e como sai a projeção redigida por audiência?"
    narrative: "É o bloqueador escondido apontado pelo hub: grafos e páginas carregam conteúdo sensível (de segurança e dados de pessoas), e locality: privado não é sensibilidade. Abrir leitura ao negócio pede o campo e a projeção redigida. Posição prévia do kg-ssot em E_MA_KGSSOT_POSICAO_CLASSIFICATION_1028 (não é selo). A decisão vai ao maestro porque mexe no contrato; antes do selo, uma rodada de padrão de mercado."
  - id: Q_MA_MARKET
