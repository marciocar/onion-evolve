    narrative: "O core usa o kg-ssot, mas o responsável é o repo do kg-ssot: a cópia vendorizada não se edita, só se atualiza pelo pin, e a escrita acontece só no repo dono. Aplicado ao caso: um repo por vertical de responsabilidade (por exemplo, o conhecimento de negócio num repo dono e o código com o technical-context em outro), cada um vendorizando ou lendo o do outro com pin. A barreira vem da permissão por repo, que funciona no plano gratuito, sem CODEOWNERS. O custo a avaliar é a regra «doc no mesmo PR do código», que passa a cruzar repos. Confirmado é o testemunho do maestro, não a opção: ela é candidata em Q_MA_WRITE_SURFACE."
