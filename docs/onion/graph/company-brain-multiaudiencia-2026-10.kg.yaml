    verified_at: "2026-10-28"
    verified_against: "testemunho do maestro em 2026-10-28, repassado pela sessão principal do core na encomenda deste grafo"
    label: "A matriz de partida do maestro: a tecnologia escreve o código e o technical-context; o negócio escreve o business-context, o compliance-context e o design-context; todos leem tudo; ninguém escreve no que é do outro."
    narrative: "Em palavras do maestro (resumo fiel, 2026-10-28): o time tech (desenvolvedores) é responsável pelo technical-context e pelo código, mas lê todos os outros contextos; o time de negócios (marketing, operações, atendimento) é responsável pelo business-context, pelo compliance-context e pelo design-context, e lê o resto. Os dois leem tudo; a tecnologia não escreve direto no business-context, e o negócio não mexe em código nem no technical-context. É hipótese de partida de Q_MA_AUDIENCES, não o desenho: o «lê tudo» fica sujeito à ressalva de sensibilidade de Q_MA_CLASSIFICATION (conteúdo de segurança e dados de pessoas não abrem a toda audiência sem classificação)."
    provenance:
