    label: "Quais são as audiências e papéis do Company Brain (direção, operações, marketing, atendimento, comercial, desenvolvimento) e a MATRIZ de quem lê e quem escreve cada contexto?"
    narrative: "Dono: o core, com o hub. Parte da matriz do maestro (C_MA_MATRIZ_DO_MAESTRO_1028): tecnologia escreve código e technical-context; negócio escreve business, compliance e design-context; todos leem tudo, com a ressalva de sensibilidade. Falta o hub levantar a lista de colaboradores e papéis (quem é de qual audiência) e o core fechar a matriz por contexto e por superfície. Fecha quando a matriz estiver no grafo com o testemunho do hub sobre os papéis e o aceite do maestro. É a primeira da ordem: as outras perguntas de desenho esperam esta."
  - id: Q_MA_WRITE_SURFACE
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: core
    impact: 5
    confidence: 0.5
    label: "Onde cada audiência escreve: no repo por PR, na wiki, pelo MCP de escrita por identidade, no task manager ou num repo próprio por responsabilidade (hipóteses A a D do hub e E do maestro)?"
    narrative: "A: um repo com pastas por vertical (barato, mas o não técnico vai ao git e a barreira só existe com plano pago). B: repo de conhecimento separado do código (barreira por permissão de repo, que funciona no plano gratuito; pede aresta entre repos). C: superfícies por audiência com o grafo como núcleo (o negócio na wiki e no MCP de escrita por identidade, a tecnologia no repo; a escrita já nasce separada; pede ponte wiki↔grafo e classificação). D: C mais detecção no repo, a que o hub recomenda estudar primeiro. E (do maestro, C_MA_REPOS_POR_RESPONSABILIDADE_VENDORIZADOS_1028): repos separados por responsabilidade, ligados por vendorização com pin, no molde do kg-ssot vendorizado no core; a barreira é a permissão por repo, sem CODEOWNERS; o custo a medir é a regra «doc no mesmo PR do código», que passa a cruzar repos. Em todas as opções, o MCP é superfície explícita de escrita e de leitura (visão do maestro, 2026-10-28): o escritor por identidade que já existe escreve numa área própria, só aceita grafo válido, assina com o e-mail do autor e trava a escrita sobre cópia velha pelo sha; o MCP de leitura serve a todos. Fecha com a recomendação do core, medida contra a matriz de Q_MA_AUDIENCES e o estudo de mercado, levada a D_MA_ARCH."
