  - id: E_MA_SINAL_DO_HUB_1027
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.7
    verified_at: "2026-10-27"
    verified_against: "a proposta do adotante brain de 2026-10-27 (feature-request, severidade alta), lida inteira pelo core em 2026-10-28; as medidas são do hub, não re-medidas aqui, salvo a do MCP de leitura (E_MA_MCP_LEITURA_MEDIDO_1028)"
    label: "O sinal do hub: o negócio precisa ler o que a tecnologia sabe (desenvolvimento, nuvem, plataforma, dados) e a tecnologia precisa ler o negócio, sem escrita cruzada e com detecção do que sair errado."
    narrative: "Medido pelo hub em 2026-10-27: a barreira do servidor (ruleset, check obrigatório, CODEOWNERS aplicado) não está disponível no plano atual do forge, e toda guarda dentro do repo é detecção, não bloqueio; o conhecimento convive com o código no mesmo repo; hoje só pessoas técnicas escrevem em docs/, e o negócio escreve na wiki (permissão por coleção, histórico por revisão), no task manager e no Drive; commits tocam docs/ e código juntos, de propósito, pela regra de doc no mesmo PR. O hub propõe quatro hipóteses de arquitetura, nenhuma decidida: A (um repo, pastas por vertical), B (repo de conhecimento separado do código), C (superfícies por audiência com o grafo como núcleo) e D (C mais detecção no repo). O hub não implementa nada antes do desenho."
    provenance:
      source: "proposta do adotante brain, 2026-10-27, pelo inbox do core"
      locator: "o sinal 2026-10-27-proposal-company-brain-multiaudiencia, mantido fora do repo público por carregar dado operacional do hub"
      method: "testimony: medidas do hub, só leitura, nos quatro repos da família"
      locality: "repo"
  - id: C_MA_MATRIZ_DO_MAESTRO_1028
