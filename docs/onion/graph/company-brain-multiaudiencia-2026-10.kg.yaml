    narrative: "Decisão de custo do maestro. Fato medido pelo hub: a barreira do servidor não está disponível no plano atual, então hoje a pasta por vertical é só convenção. Com o plano pago, CODEOWNERS e check obrigatório viram bloqueio do servidor; sem ele, a barreira vem de onde cada audiência escreve (Q_MA_WRITE_SURFACE) e o repo fica com detecção (C_MA_CROSS_WRITE_DETECTOR). Espera a superfície, a classificação e o mercado."
