  schema_version: "1"
  date: 2026-07-25
  title: "Comportamento acima de declaracao — nao confie no que o artefato DIZ sobre si, confie no que ele FAZ"
  layer: audit
  note: >
    Sintese de 3 casos de campo REAIS da mesma jornada (adotante Arandek + stack Logto do core):
    catraca de fronteira verde num escopo estreito (1/8 travessias), branch develop-fantasma
    (existencia+prosa declaram GitFlow, triggers executam trunk-based), e pin de versao herdado
    nao-auditado (1.36.0 vs 1.41.0, componente de seguranca). Irmao um nivel acima de
    declarado != verificado: o artefato mente sobre si, o comportamento nao.

