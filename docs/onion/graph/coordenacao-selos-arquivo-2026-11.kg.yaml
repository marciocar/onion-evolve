    label: "Decidir o --pin <caminho#ID> no kg-decide-seal.sh, que grava o nó E_ irmão com o node_sha256 da versão aprovada; antes do código, o desenho passa pelo kg-ssot."
    status: done
    plane: DEV
    verified_at: "2026-11-02"
    verified_against: "decisão do maestro em 2026-11-02, por pergunta com opções (/meta:decide): escolhida «Os três: --pin no kg-decide-seal.sh pelo core; RACI e versão como convenção do adotante até haver uso; receita do piloto ao hub»"
    narrative: |-
      A curadoria propõe fechar o ciclo do documento controlado com a corrente de hashes que o contrato já tem: o D_ selado com o testemunho e um E_ irmão (aresta E_ SUPPORTS D_) que fixa o node_sha256 do documento aprovado. A peça que falta é o selo gravar esse E_ sem mexer na proveniência do testemunho. Achado medido pela curadoria na 4.39.0, para o kg-ssot: o --revisit do kg_query NÃO acende quando o documento aprovado muda, nem com o hash regravado; ele julga só a cadência vencida e o REFUTES, e o upstream_changed compara o status, não o hash. Só o kg_trace check acusa a mudança, como node-sha256-mismatch. A curadoria propôs ao kg-ssot um motivo de revisita «o hash fixado mudou», para a aprovação entrar na fila de revisão e não só no check. Gatilho: decisão do maestro. Depois do selo, o desenho vai ao kg-ssot e o código é do core.

      verified_against anterior: «sinal da curadoria document-control-2026-10, versionado no inbox do core em docs/evolution/inbox/2026-10-29-curation-document-control-2026-10-c.md (revisado para público), lido inteiro na triagem de 2026-10-29; a medição é do laboratório da curadoria com dados sintéticos, não re-executada no core»
      Selado por /meta:decide em 2026-11-02: escolhida «Os três: --pin no kg-decide-seal.sh pelo core; RACI e versão como convenção do adotante até haver uso; receita do piloto ao hub»; descartadas: «Só o --pin» · «Adiar».
    provenance:
