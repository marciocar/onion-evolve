  title: "Comunicação estável entre sessões, o Company Brain e o Slack até segunda, 09/11"
  date: "2026-11-06"
  baseline: "2026-11-06"
  review_after: "2026-11-10"
  purpose: "O plano do maestro de 2026-11-06: até segunda, 2026-11-09, uma versão estável e confiável da comunicação entre as sessões do Onion, com o Company Brain do hub, com o Slack e com o time de desenvolvimento, em padrões de mercado. As decisões vieram por /meta:decide no mesmo dia. Cada degrau tem dono, data (x_due) e critério de pronto. O core conduz depois do start do maestro, até ele dizer que assumiu o controle; o grafo é o estado da orquestração e se revisa a cada rodada."
  note: "TETO, declarado: este grafo guarda as decisões, os compromissos e a ordem. O desenho da mensageria nasce no repo próprio onion-messaging (privado), depois da pesquisa de padrões. O hub aparece como «o hub». Atos do maestro (criar repo, app Slack e tokens, channelsEnabled, o `!` do deploy) são nós com owner maestro."
  # ═══ TETO: 16 NÓS ═══
