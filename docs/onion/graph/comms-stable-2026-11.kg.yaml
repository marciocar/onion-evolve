  - id: E_CS_F7_SPOOL_DO_CARTEIRO_1107
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-11-07"
    verified_against: "claude -p 2.1.319 com --settings de sandbox mínimo em dois repos de fixture temporários, lendo a tabela de montagens do processo e escrevendo em cada alvo de dentro do sandbox (bwrap 0.9.0, Ubuntu 24.04)"
    label: "A falha de entrega do carteiro com o sandbox ligado tem causa medida: o deny Edit do destino vira denyWrite e cobre a exceção do inbox/ no allowWrite. A cura é o spool do carteiro, fora dos repos, importado pelo hook do destino."
    narrative: "Medido em 2026-11-07, em fixture: só com o allowWrite do inbox/, a escrita passa (a hipótese de que o repo pai sempre cobre o filho cai); com o deny Edit do destino, o mountinfo mostra o inbox/ rw (id 2176) e, depois dele, o destino inteiro ro (id 2182), e a escrita dá Read-only file system; um permissions.allow Edit do inbox/ não desfaz. A hipótese da ordem de montagem se confirma, com o gatilho no deny v4 da curadoria. O co-relay da main, no mesmo sandbox, dizia AVISO e saía 0 com 0 entregues. Cura no PR fix/co-relay-sandbox-spool: com o inbox/ do destino sem escrita (ou --spool), o carteiro grava no spool por destinatário, fora dos repos (o padrão fica no estado do usuário, sob XDG_STATE_HOME), depois das mesmas guardas, o SessionStart do destino importa (spool-import.sh), e a falha de escrita passa a sair rc 1. Dogfood com o sandbox real: o sinal chegou ao spool, rc 0, e o hook do destino o importou untracked. A fila do onion-messaging (degrau 3) fica para o teste ao vivo, que ainda espera atos do maestro. A rede (allowedDomains furado) é outro achado: só fura em bypassPermissions, medido no mesmo dia; o relato à Anthropic é do maestro."
    provenance:
      source: "fixture temporária de 2026-11-07 (quatro settings de sandbox: só allowWrite, com deny Edit do destino, com deny e allow do inbox, com deny e o spool) e a curadoria E_SANDBOX_F2_F7_1106"
      locator: "probe.out por variante; relay.out (cura) e relay-old.out (main)"
      method: "medição: claude -p --settings <sandbox mínimo> --allowedTools=Bash; escrita em cada alvo + a tabela de montagens do processo sandboxado"
