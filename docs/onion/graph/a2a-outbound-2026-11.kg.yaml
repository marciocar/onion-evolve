  - id: C_A2A_AUTO_ACCEPT_AS_DATA_FOUR_CONDITIONS_1110
    node_type: claim
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.7
    verified_at: "2026-11-10"
    verified_against: "pesquisa de UX de 2026-11-10 relatada no brief, fonte https://code.claude.com/docs/en/cross-session-messaging; a página não foi relida por esta sessão"
    label: "Aceite automático de mensagem entre sessões como DADO só é padrão com quatro condições: remetente autenticado, mensagem marcada como não-usuário, sem autoridade de instrução, e os portões de permissão mantidos."
    narrative: "Leitura para o A2A do Onion: a fila pode deixar de exigir o aceite manual só se as quatro condições valerem juntas. Falta uma e o aceite segue humano. Fonte primária: a documentação de mensagens entre sessões do Claude Code."
    provenance:
      source: "https://code.claude.com/docs/en/cross-session-messaging"
      locator: "documentação de mensagens entre sessões (cross-session messaging)"
      method: "testimony: pesquisa de primárias relatada no brief da sessão do core, 2026-11-10"
      locality: "pessoa"
  - id: C_A2A_SDK_V2_CHANNEL_BREAK_1110
    node_type: claim
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.7
    verified_at: "2026-11-10"
    verified_against: "alerta da documentação https://code.claude.com/docs/en/mcp relatado no brief; o pino 1.32.2 do @modelcontextprotocol/sdk no package.json do doorbell medido por leitura em 2026-11-10"
    label: "Num cliente v2, canal que negocia o protocolo MCP 2026-07-28 não entrega mensagem; o doorbell usa o SDK 1.32.2 (protocolo até 2025-11-25), então subir o SDK para 2.x quebra a campainha."
    narrative: "Consequência: o doorbell fica no SDK 1.x até o canal ter caminho de entrega no protocolo novo. Subir o SDK pede antes a re-medição do canal num cliente v2. O pino foi lido no package.json do doorbell; o alerta não foi relido por esta sessão."
    provenance:
      source: "https://code.claude.com/docs/en/mcp"
      locator: "documentação de MCP do Claude Code, alerta sobre canais e a versão de protocolo 2026-07-28"
      method: "testimony: pesquisa de primárias relatada no brief da sessão do core, 2026-11-10; pino do SDK medido por leitura"
      locality: "pessoa"
  - id: D_A2A_OUTBOUND_IROH_PHASE2_1110
    node_type: decision
    layer: audit
    plane: DEV
    status: open
    owner: maestro
    impact: 3
    confidence: 0.5
    label: "Caminho do transporte VPS↔notebook: Fase 2 com iroh, caminho próprio ou parquear; aguarda validação das estimativas (próprio 19 ou 31 pts)."
    narrative: "Opções: «Fase 2 só com iroh» (passou nos eliminatórios), «Caminho próprio», «Parquear tudo». Reaberto em 2026-11-10: um selo com «Fase 2 só com iroh» saiu no commit anterior desta branch, e o maestro pediu antes a revisão das estimativas (o caminho próprio aparece com 19 ou 31 pontos). Pronto quando: as estimativas forem revistas e o maestro escolher; o selo sai pelo kg-decide-seal.sh, citando a pergunta."
  - id: D_QUEUE_HARVEST_OPENCLAW_NOW_1110
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 3
    confidence: 0.9
    verified_at: "2026-11-10"
    verified_against: "decisão do maestro em 2026-11-10, por pergunta com opções (/meta:decide): escolhida «Sim, já»"
    label: "As três regras colhidas do OpenClaw (reconexão que só estreita o escopo, allowlist que falha fechada, aprovação que exige o escopo de quem aprova) entram já no onion-queue, com teste de mutante, sem esperar a Fase 2."
    narrative: "Selado por /meta:decide em 2026-11-10: escolhida «Sim, já»; descartadas: «Junto da Fase 2»."
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-10: «A colheita do OpenClaw serve para qualquer caminho: reconexão que só estreita o escopo, allowlist que falha fechada e aprovação que exige o escopo de quem aprova. Entram já como regra do onion-queue, com teste de mutante?»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-10"
      locality: "pessoa"
