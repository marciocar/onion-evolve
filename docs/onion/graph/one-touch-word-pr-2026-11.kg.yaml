    label: "Frase com número de PR, sozinha na mensagem e digitada pelo maestro, registra a palavra daquele PR sem pedido prévio; o executor confere todos os gates na hora e recusa se o head andou."
    narrative: "Pedido verbatim: «quando eu digo \"pode rodar 1763\" ou \"merge 1763\" ou similar que voce tenha certeza do que eu estou falando, execute se ok, não fique me travando pedindo para fazer somente se eu escrever a mão \"pode rodar\" no momento certo». Desenho: lista fechada de verbos (pode rodar, pode mergear, pode fazer o merge, merge, mergeia, mergear), conectivo opcional (do, o, pr), 1 a 5 números, «?» final recusa; o hook lê o PR no forge pelo repo do cwd e grava uma aprovação por número com o head daquele instante; o executor acha a aprovação daquele PR. Ajuste declarado: a palavra com número substitui o --maestro no gate de guarda como o «pode rodar» com pedido já substituía, com duas exceções que a revisão isolada de 2026-11-25 (merge-word-reviewer) pediu: no PR que muda a própria catraca ela não basta (o hook não registra e o executor recusa, porque ela amarra um head que o maestro não viu), e com o revisor do CI em fallback, ou em PR que muda a maquinaria do revisor, o resíduo isolado (elenxo_isolado: true) segue exigido pelo gate de fallback de guarda. O hook também recusa head com menos de 120 s e vírgula sem espaço (1,763)."
    provenance:
      source: "maestro, pela sessão do core"
      locator: "brief do agente de execução feat/merge-word-with-pr-number, 2026-11-25, «Pedido do maestro, 26/11 (verbatim)»"
      method: "testimony: pedido do maestro repassado"
      locality: "pessoa"
  - id: E_OT_WORD_PR_BENCH_1125
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.9
    verified_at: "2026-11-25"
    verified_against: "família pr_merge_verified da bancada, casos otn1 a otn17 (otn9 a otn17 da revisão isolada de 2026-11-25), cada recusa com mutante plantado que a desfaz"
    label: "A bancada prova: frase com número registra e mergeia; dois números registram dois usos; texto a mais, pergunta, PR inexistente ou fechado não registram; head mudado, sugestão aceita, repo errado e frase de outro número recusam no executor."
    narrative: "O hook roda como o runner o invoca, com o gh falso no PATH (o endpoint repos/<r>/pulls/<n> devolve estado, merged, head e ref) e o cwd num clone cujo origin é o core de sandbox; o executor é a cópia cujo sha256 o hook amarrou. Cada recusa tem um mutante que a remove e faz o caso mergear ou registrar."
    provenance:
      source: "bancada do core"
      locator: ".claude/validation/lint-selftest.sh, run_pr_merge_verified_selftests, bloco «PODE RODAR 1763»"
      method: "measurement: bancada com mutantes"
      locality: "repo"
  - id: E_OT_WORD_PR_LIMITS_1125
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 2
    confidence: 0.8
    verified_at: "2026-11-25"
    verified_against: "leitura do motor .claude/utils/approval/one_touch.py e do registro do hook no settings (timeout 10 s)"
    label: "Limites declarados: camada de conformidade e não fronteira (como o «pode rodar» de sempre); o hook gasta uma leitura no forge por número dentro de 8 s; só o checkout que tem o executor do merge verificado registra; o repo é o do origin do cwd."
    narrative: "Sem pedido prévio, a palavra nasce no hook: a folga entre o horário do prompt no transcript e a criação do pedido sobe de 1 s para 60 s só nesse caso. O id da palavra no livro leva o número (prompt_id#n), para que «pode rodar 1763 e 1765» sejam dois usos. O consume sem transcript legível grava prompt_id/*, que gasta as palavras de todos os números do turno: gastar mais, nunca menos."
    provenance:
      source: "motor e settings do core"
      locator: ".claude/utils/approval/one_touch.py (parse_word, hook_numbered, transcript_word); .claude/settings.json (UserPromptSubmit, timeout 10)"
      method: "measurement: leitura do código"
      locality: "repo"
