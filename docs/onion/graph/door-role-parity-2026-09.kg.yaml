epo inteiro da granaai: o marcador DRIFT-ONION NÃO # EXISTE lá (únicas ocorrências são dois docs de inbound criados hoje, # 2026-07-19, sem relação com o lint). A suspeita era diagnóstico do CORE # sobre a linhagem local-kvm8 (2026-07-10), não algo reportado pelo adotante. # A linhagem local-kvm8 (branch onion/adopt-update-74c470e, pin 4332ac8d1884) # ficou OBSOLETA — superada pelo update de 2026-07-19 acima (via a linhagem # da própria sessão do adotante) e foi removida deste mapa. [gustavo-pulga] onion_version: c9eb2c40bc3b   # VERIFICADO por pin-integrity-check.sh (pin-ok, 2026-07-19) — # regularização de registro: o stamp existia (adopted_from: onion-evolve) # mas o membro faltava em members.yaml (drift de registro; ADR claude-door-topology D4). [brain-granaai] # ⚠️ REGISTRADO EM 2026-10-02, e o ATRASO custou: este adotante foi adotado em 2026-10-01 e, antes #    de entrar aqui, já havia mandado TRÊS sinais de severidade `high` — um deles com medição AO #    VIVO (24 chamadas REST num workspace real) que achou o maior bug ativo do adapter ClickUp. #    Enquanto esteve fora do registro: (a) a REGRA 36 (Superfície VENDORIZADA sem nome comercial #    de cliente) NÃO o protegia, porque ela deriva termos deste arquivo; (b) o /meta:co-announce #    não conseguia resolvê-lo como alvo, logo NÃO HAVIA COMO responder ao sinal dele por doutrina #    — o fechamento de laço estava mecanicamente impedido. Registrar é ato de SEGURANÇA e de #    COMUNICAÇÃO, não burocracia; o maestro apontou a ausência da resposta e ela estava aqui. # ⚠️ PROMOVIDO A HUB pelo maestro em 2026-10-02, do lado do adotante (`--promote-hub`), e o #    registro ficou atrás — ele chegou por SINAL dele, não por guarda. Aqui carimbo e tier #    AGORA CONCORDAM (`hub` nos dois), ao contrário da redação anterior, que explicava uma #    divergência legítima entre `adopted` (relação com o framework) e `standalone` (tier na rede). #    O que ele ganha: adotar e atualizar os projetos da GranaAI (Camada 2). O qu