    label: "a biografia das portas que morava em comentário no members.yaml: pins da 17a à 19a materialização da onion-core, a história reescrita, o incidente dos 85 arquivos, o papel decidido do standalone e a destilação do mini"
    narrative: "Linhas REMOVIDAS do registro, verbatim, por membro. [onion-core] # MATRIZ DAS PORTAS (2026-10-09, D_MATRIZ_DE_PORTAS_2026_10): o papel vira `source` na F2, junto #   com o carimbo novo. Trocar só aqui antes disso faria a REGRA 92 (Papel da porta no registro #   concorda com o CARIMBO dela) reprovar. role: hub                   # CORRIGIDO 2026-09-30: dizia `standalone` e o CARIMBO da porta diz `hub` #   — 11 materializações seguidas (22/09→27/09) carimbaram hub, e o CLAUDE.md #   declara esta porta como 'mesma plataforma, mesma MAQUINARIA, sem biografia'. #   A anotação errada CUSTOU: em 2026-09-30 eu li o registro em vez do carimbo, #   materializei com --role standalone e a porta PÚBLICA perdeu 85 arquivos de #   meta-fábrica (adopt/create-*/federation-*/marketplace/wizard/onion-publish). #   Restaurado em 4eb55ac. O carimbo é o que a porta É; o registro é anotação. kind: door          # DISTRIBUI a maquinaria; o proposito e ser a face publica do core remote: github.com/marciocar/onion-core   # PÚBLICO desde 2026-09-17 # ⚠️ HISTORIA REESCRITA em 2026-09-17, e a razao e um VAZAMENTO MEDIDO: o baseline #    `kb-vendored-link-baseline.txt` viajou POPULADO nas materializacoes anteriores, nomeando 22 #    caminhos CORE-PRIVADOS (dois ADRs, um RFC, o template de discussoes, uma mensagem de inbox) #    num repo PUBLICO — exatamente a topologia que o `--stub-baselines` existe para reter. #    A porta e PROJECAO GERADA: a historia dela nao tem valor autoral, entao a cura foi um commit #    orfao unico + force-push, e nao ha nada a preservar nisso. LIMITE DECLARADO: o objeto antigo #    segue acessivel por SHA ate o GC do GitHub, e quem clonou tem copia — o force-push torna #    INALCANCAVEL, nunca inexistente. onion_version: 947e69ce069d   # carimbado por ops/door-seal-pin.sh (remoto conferido) # via `gh api repos/marciocar/onion-core/commits/main` -> 5063e81b2d8d. # ⚠️ SEGUNDA vez EM UM DIA que este numero e avancado A MAO, e a 1a vez # eu escrevi aqui que 'numero mantido a mao apodrece'. Apodreceu em duas # horas: a porta foi publicada, este campo ficou atras, e a REGRA 85 # (Porta publica espelha o core, com catraca) seguiu acusando 3 commits # de defasagem porque ela le o REGISTRO, nao a porta. O gatilho para # mecanizar disparou DUAS vezes; a proposta esta no no # Q_QUEM_CARIMBA_O_PIN_DA_PORTA do grafo de fios abertos. # `gh api repos/marciocar/onion-core/commits/main` → 07c81b974880. # ⚠️ ESTA foi a 1a materializacao cuja FONTE e comprovadamente # `origin/main`: ate hoje o `materialize-door.sh` usava `git archive # HEAD`, e rodado de uma branch de trabalho montaria a porta PUBLICA # com codigo NAO MERGEADO (observado ao vivo: 1a tentativa carimbou o # topo de um PR aberto). Curado no mesmo dia; os 8 pins anteriores # foram medidos e estao todos em main, logo o defeito era latente. # ⚠️ E O QUE NENHUMA GUARDA PEGA, declarado: o `pin-integrity-check.sh` # devolve `pin-untrusted unknown` — ele NAO confere este campo contra o # que a porta de fato publicou. Logo este numero e mantido A MAO, e # numero mantido a mao apodrece. Candidato a mecanismo. onion_version_19a: d55ddc10c6af   # pin da 19a materializacao (2026-09-24) — a leva do #869: a cura do lint que MORRIA calado com baseline vazio. Push VERIFICADO NO REMOTO via `gh api repos/marciocar/onion-core/commits/main`: f03726abc45d. DOGFOOD MEDIDO NA PORTA, nao declarado: o lint dela agora sai `rc=0`, 0 HARD, ZERO `MORREU`, sumario alcancado — e o baseline da REGRA 89 chegou com 14 linhas SO DE COMENTARIO, que o `grep -v` reprova igual ao vazio, confirmando que sem a cura a morte seria a mesma. onion_version_18a: 77e5f0ab6cc6   # pin da 18a materializacao (2026-09-23) — leva do #868. Push VERIFICADO NO REMOTO via `gh api repos/marciocar/onion-core/commits/main`: 4e55eb4e3920, nao a nota do script nem o disco. ⚠️ Esta versao da porta AINDA carrega o lint que morre com baseline vazio (o `--stub-baselines` o esvazia por desenho): a cura esta no #869 e entra na 19a materializacao. Publicar esta ANTES foi o que destravou o deadlock — a REGRA 85 (Porta publica espelha o core, com catraca) so se satisfaz com a porta espelhando main, e o #869 nao mergeia com ela defasada. O custo (duas materializacoes) e o nucleo de `D_ONDE_COBRAR_A_DEFASAGEM_DA_PORTA`. onion_version_anterior: 0e5d6a7ddf58   # pin da 17a materializacao (2026-09-23) — leva do #866 (sinal 09-07, guarda de idioma que enxerga .js, e a bancada do CI em 4 faixas de matriz). De worktree DESTACADA em origin/main. Push verificado no remoto: 5d83730797ab, 2026-09-23 (git ls-remote, nao a nota do script). # ⚠️ A PORTA NASCE COM 22 HARD DA REGRA 45, E ISSO E O ESTADO VERDADEIRO, NAO REGRESSAO. A #    superficie vendorizada linka para caminhos core-privados, e o ledger que os tolerava so #    funcionava NOMEANDO esses caminhos — era ele o vazamento. Acoplamento que ninguem tinha #    declarado: a porta so fica verde quando a divida da REGRA 45 no core chegar a ZERO. [onion-standalone] # PORTA DE FRAMEWORK (não projeto-adotante, não destilação) — a porta pública Claude que desfaz o # colapso porta≡core (ADR onion-adr-family-repo-topology-2026-07 F2; doutrina public-door-vs-private-core). # Nasceu 2026-07-19 via /meta:adopt role-scoped (composição: resolve-role-bundle standalone → verticais → # vendor .claude/), SEM meta-factory nem memória privada. Doutrina que circula anonimizada na raiz (PR #438). # PÚBLICA desde 2026-07-19 — o flip FOI FEITO e está verificado ao vivo (ver `remote:` abaixo). # Corrigido 2026-08-05: este comentário ainda dizia 'Nasce PRIVADA; o flip é gate do maestro', # contradizendo a própria linha `remote:` do mesmo bloco — declarado≠verificado dentro do registro. # Segue gated APENAS o re-apontar do redirect onion-claude (MOAT-lock-4). # ⚠️ ESTE PAPEL ESTÁ DECIDIDO, e a decisão é da DOUTRINA — não é questão aberta. Em 2026-09-30 eu #    escrevi que ele 'ficava aberto, com evidência nos dois sentidos'; era falso, e o custo de #    afirmar isso é conhecido: foi lendo o registro em vez de medir que a `onion-core` foi #    re-materializada com o papel errado e a face pública perdeu 85 arquivos de meta-fábrica. #    `public-door-vs-private-core.md` classifica `onion-standalone` como **Porta de framework** e #    diz, textualmente, '**Nunca**: meta-factory' — o que É o corte do papel `standalone`. Registro #    e carimbo concordam (medido). A REGRA 92 agora cobra essa concordância a cada lint. # MATRIZ DAS PORTAS (2026-10-09, D_MATRIZ_DE_PORTAS_2026_10): o 'Nunca: meta-factory' acima é #   SUPERADO como destino. O standalone passa a levar a meta-fábrica e perde só adoção e federação; #   o corte novo é a F2. Até lá o corte vigente segue o descrito acima. role: standalone            # TIER 3 — mas é PORTA DE FRAMEWORK (distribui o bundle standalone), não projeto-adotante kind: door          # vendoriza, mas o proposito e DISTRIBUIR o bundle, nao usar num projeto remote: github.com/marciocar/onion-standalone   # PÚBLICO desde 2026-07-19 (flip feito, verificado ao vivo). Resta gated: reapontar o redirect onion-claude→onion-standalone (onion-claude segue privado) [onion-mini] # MATRIZ DAS PORTAS (2026-10-09, D_MATRIZ_DE_PORTAS_2026_10): vira porta didática, role: mini e #   kind: door, gerada do core por allowlist na F5 (SAC-94). O schema ainda recusa os dois valores #   (members-validate.sh, medido): a ampliação é da F2, e até lá a entrada segue como está. role: standalone            # DESTILAÇÃO CURADA, não adoção (não vendoriza .claude/) — role kind: distillation  # reescrita curada da doutrina; onion_version: n/a — NAO vendoriza # 'distilled' formal é costura gated (2ª destilação; ADR mini-distillation D2) onion_version: n/a          # sem stamp: destilação (reescrita curada da doutrina), não vendor do framework [hub-operacoes-enterprise] # PORTA PÚBLICA DO CORE (nasceu 2026-09-17, no mesmo movimento em que o core FECHOU). É a face # que distribui a maquinaria COMPLETA — papel `hub`, meta-fábrica inclusa — sem a biografia. # Materializada por `ops/materialize-door.sh`, que é AUTORITATIVO: o que sai do manifesto sai da # porta. O `onion_version` abaixo é o pin de onde ela foi materializada, e é o que a guarda de # ciclo compara contra a superfície que viaja — porta sem re-materialização envelhece, e o # `onion-standalone` (372 commits atrás, medido 2026-09-17) é a prova de que isso acontece. # ⚠️ REGISTRADO EM 2026-09-30, E O ATRASO CUSTOU: este hub estava FORA do members.yaml desde a #    adoção (2026-09-16). A REGRA 36 (Superfície VENDORIZADA sem nome comercial de cliente) deriva #    os termos que varre DESTE arquivo — logo um membro não registrado é INVISÍVEL à guarda, e o #    nome dele podia vazar para superfície vendorizada sem nada acusar. É a segunda vez que a casa #    paga por isso (a primeira foi um repo de prefixo `onion-`, que a guarda também não enxergava). #    Registrar é ato de segurança, não burocracia. # ⚠️ SLUG NEUTRO POR DECISÃO DO MAESTRO (2026-09-30): ele confirmou que o nome é COMERCIAL, e o `id` #    é justamente o que vai para as superfícies PROJETADAS — medido no mesmo dia: o nome comercial já #    havia entrado em `federation-map.md`, `federation-console.html` E `graph.md` nas horas em que #    ficou registrado nominalmente. Trocado por slug de função, no padrão de `hub-formacao-enterprise`. #    Quem é a empresa vive no CLAUDE.md dela, nunca aqui. O `local_path` NÃO viaja para projeção #    (medido: zero ocorrências de local_path nas três), então o caminho local pode manter o nome real. onion_version: cff9214c3b9a          # do carimbo do clone; commit VERIFICADO na história do core"
    provenance:
