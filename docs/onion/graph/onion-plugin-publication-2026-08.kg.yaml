    label: "A excecao de selo aprovada pelo maestro em 2026-09-06 nao ficou em prosa: virou o predicado deterministico .claude/validation/kg-seal-exception.sh. A 1a VERSAO FOI REPROVADA por tres revisores adversariais com SETE caminhos de AUTO indevido MEDIDOS, todos por fora dos 8 casos que a bancada olhava: id entre aspas, aresta FORJADA dentro de um `label: |`, campos de medicao citados em bloco literal, grafo RENOMEADO, no MOVIDO entre grafos, clone RASO e `origin/main` local DESATUALIZADO. A LICAO E DE CLASSE: bancada que remove uma precondicao por vez prova que o codigo LE as precondicoes; nao prova que o SUBSTRATO delas aguenta — texto vs YAML, path vs repo, ref local vs remoto. A cura foi estrutural, nao lista: o grafo passou a ser lido por PyYAML (estrutura, nao texto), a busca de (1) varre TODOS os *.kg.yaml da base (arvore e historia), repo raso e base defasada param, e `--base` sem valor deixou de ser laco infinito. A bancada foi de 8 para 19 casos, 18 deles NEGATIVOS, e dois mutantes que ANTES sobreviviam (apagar a varredura da arvore; aceitar qualquer edge_type) agora morrem. ACHADO QUE SOBREVIVE AO PR: rodado sobre o lote de 09-05, o predicado SEPARA os dois flips daquele dia — Q_VENDOR_ENTRELACADO_COM_PRODUTO (nascido e caido no PR #810) sai AUTO, e Q_UPDATE_EXIGE_ADOCAO_INTEGRADA (criado no PR #809, ja em main) sai PARA. Eu flipei dois e declarei um; o segundo segue PENDENTE de selo do maestro."
    verified_at: '2026-09-06'
    verified_against: 'executado: `kg-seal-exception.sh <grafo> Q_VENDOR_ENTRELACADO_COM_PRODUTO --base b77f90f5^` → AUTO rc=0; o mesmo com Q_UPDATE_EXIGE_ADOCAO_INTEGRADA → PARA rc=1 por (1). Bancada: `lint-selftest.sh --families seal_exception` = 19 passaram / 0 falharam; mutacao da varredura da arvore → caso (k3) reprova; mutacao do edge_type → caso (n) reprova'
    trace: '.claude/validation/kg-seal-exception.sh'

