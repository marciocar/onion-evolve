    confidence: 0.95
    status: confirmed
    verified_at: 2026-08-24
    verified_against: "docs oficiais Claude Code (plugin-marketplaces.md) + diario 2026-07-08: install = /plugin marketplace add + /plugin install → capacidade read-only namespaced, atualiza por /plugin marketplace update (tag/SHA). SEM vendor-branch, SEM --update, SEM merge 3-way. Adopt (vendoriza+co-evolui) e canal SEPARADO. Coexistem por camada."
    trace: docs/analysis/onion-plugin-marketplace-runbook-2026-07.md
    label: "O canal de INSTALACAO (plugin) nao tem linkage de adopt: instala capacidade read-only, atualiza pelo plugin manager, nunca por merge. A cura da catraca-baseline (REGRA 49) nem se aplica (sem vendorizacao). Adopt segue como canal separado p/ quem customiza."

