    label: "O POSTMARK JA ESTA LIGADO — e so no lugar que da menos trabalho. Medido: conector `simple-mail-transfer-protocol` em `smtp.postmarkapp.com:587`, remetente `noreply@mail.onionevolve.com`, 5 templates preenchidos (Generic, SignIn, Register, ForgotPassword, OrganizationInvitation), porta alcancavel do host E de dentro do container, SPF e Return-Path (`pm.mtasv.net`) publicados. MAS: (1) so no tenant `default`; o tenant `admin` — o console PUBLICO — nao tem conector nenhum E o usuario nao tem e-mail: PERDEU A SENHA DO CONSOLE, NAO HA RECUPERACAO. (2) O Vaultwarden tem ZERO `SMTP_*`: `INVITATIONS_ALLOWED=true` e letra morta e `password-hint` responde 'This server is not configured'. (3) E o limite que SMTP NAO cura: a senha mestra do cofre nao e recuperavel por desenho — zero-knowledge. SMTP resolve CONVITE, nunca RECUPERACAO DE COFRE. Separar as duas coisas e o ponto: quem espera que ligar SMTP 'resolva o acesso ao cofre' vai descobrir tarde."

  - id: Q_MFA_EM_ZERO_MAS_QUANTIFICAR_ANTES
    node_type: question
    plane: PROD
