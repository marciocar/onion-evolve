    status: open
    impact: 3
    confidence: 1.0
    label: "O PRECO DE PROTEGER A CHAVE, e ele e real — decisao do maestro, nao minha. Por A chave GPG ganhou passphrase (era o segredo de maior alcance da maquina e estava NU), e isso quebrou o acesso NAO-INTERATIVO ao `pass`: `pass show` sai rc=2 com `public key decryption failed`. CONSEQUENCIA MEDIDA: os tres `up.sh` (waha, logto, vaultwarden) leem do `pass`, entao REINICIAR QUALQUER SERVICO agora exige interacao. O que NAO quebrou, porque cifrar usa a chave PUBLICA: os backups — mas so depois de curar TRES defeitos empilhados que so apareceram um apos o outro (`${HOME}` virando /root no cron; `gpg` como root usando chaveiro vazio; e `marcio` sem conseguir LER o claro `root:root 600`). ⚠️ E o terceiro expos uma assimetria que ninguem tinha visto: o dump do Logto nascia **644** e por isso 'funcionava' — havia uma janela em que o banco de IDENTIDADES ficava legivel por qualquer uma das 5 contas com shell. AS OPCOES, com o custo de cada uma: (a) deixar como esta — reinicio manual pede senha, seguranca maxima; (b) presetar a passphrase no gpg-agent no boot a partir de arquivo 600 — devolve a automacao e ENFRAQUECE de volta, porque o arquivo vira o novo segredo nu; (c) chave separada, sem senha, so para automacao — isola o dano mas multiplica segredo. NAO ESCOLHI: (b) e (c) desfazem parte do que acabou de ser ganho, e essa troca e do dono. LICAO QUE FICA: eu testava so como `marcio`, e o cron e `root` — TESTAR NO CAMINHO ERRADO E NAO TESTAR."
