    status: done
    impact: 3
    confidence: 0.8
    label: "✅ O BLOQUEIO CAIU 2026-08-11 e a ORDEM foi respeitada: e-mail nas duas identidades -> conector SMTP no tenant `admin` -> `forgot_password_methods` ligado -> SO ENTAO os fatores. Hoje `default` = `{policy: UserControlled, factors: [Totp, BackupCode]}`, confirmado na API viva. O QUE FALTA NAO E MEU: a INSCRICAO de um TOTP e ato do dono no console, e ligar politica obrigatoria antes disso seria exatamente a troca invasao->lockout que este no existia para evitar. ESTADO ORIGINAL: tenant `default` = `{policy: UserControlled, factors: []}` — nenhum fator habilitado, logo nada a ativar mesmo querendo. Tenant `admin` (console PUBLICO) = fatores disponiveis (Totp, WebAuthn, BackupCode) mas politica `NoPrompt` = nunca oferecidos. No cofre, TOTP e WebAuthn/passkey estao disponiveis SEM configuracao de servidor (rotas respondem 401, nao 404) — dependem so de o usuario ativar; Duo e YubiKey exigiriam chaves que nao existem, e o 2FA por e-mail e inutil sem SMTP. O bridge nao inspeciona `amr`/`acr`, entao NAO TERIA COMO exigir MFA nem se o Logto a fizesse. ⚠️ IMPACT 3 E DELIBERADO, contra a tentacao de marcar 5: existe UMA conta em cada tenant, o console exige senha, e o `sentinel_activities` do Logto (anti-forca-bruta) esta registrando. Ligar MFA sem desenhar recuperacao junto TROCA risco de invasao por risco de LOCKOUT — e com admin unico e sem e-mail no tenant `admin`, o lockout e o risco mais provavel. A ordem correta e: e-mail no tenant admin -> codigos de recuperacao -> so entao MFA."

