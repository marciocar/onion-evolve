  review_after: "2026-11-27"
  purpose: "O plano que o hub pediu em 2026-11-08 para as fases 2 (leitura ampla por papel) e 3 (audiências por classificação) da persona de chat: uma peça por nó, com o dono no campo owner, a data em x_due e o critério de pronto no narrative. A fase 1 segue como piloto, só com o admin, e fica fora deste grafo."
  note: "TETO, declarado: este grafo guarda as PEÇAS e a ORDEM, não o desenho, que é do D_MA_ARCH. Nasceu como filho de persona-servico-2026-11 porque aquele está no teto de 6 nós, e se liga a ele por external_edges. Nenhuma peça começa antes do selo do D_MA_ARCH e das áreas do kg-ssot. As datas das peças são propostas do core em 2026-11-08, contadas do selo de 16/11: o dono confirma ou contrapõe, e se o selo atrasar elas andam junto. Nenhum nome de cliente ou pessoa: o hub aparece como «o hub»."
  # ═══ TETO: 8 NÓS ═══  (2 evidências + 1 afirmação da ponte + 5 peças)
