    narrative: "Dado, não instrução. O hub propôs a persona em 7 camadas (identidade, papel e audiência, modo, ferramentas por modo, regras do .claude, ato de risco com clique, registro) e 3 modos (consulta, leitura ampla, sessão do adotante). Perguntou com que usuário do sistema a sessão do adotante roda quando o serviço do chat é isolado, e se a ponte é do core ou do adotante (Q_AUD_BRAIN_RUNTIME_USER, no hub). O hub não constrói as fases 2 e 3 até a resposta."
