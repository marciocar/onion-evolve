  - id: Q_PF_ORDER_RECHECK_1117
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: core
    x_due: "2026-11-17"
    impact: 4
    confidence: 0.6
    label: "A ordem das peças: selo e áreas, filtro por área, identidade e papel, ponte, modelos de mensagem. Reconferida contra o D_MA_ARCH selado no dia seguinte ao selo."
    narrative: "Ordem: (1) selo do D_MA_ARCH em 16/11, com a escada de autonomia em 13/11; (2) filtro por área e dívida do kg_query; (3) identidade e papel, que precisa do vocabulário de áreas; (4) ponte, cujo envelope carrega a identidade resolvida; (5) modelos de mensagem. A fase 2 abre com 2, 3 e 4 prontas. A fase 3 abre depois de Q_MA_CLASSIFICATION e da peça 5; canal externo só depois dela. Pronto quando: o core confere esta ordem contra o D_MA_ARCH selado, ajusta as datas das peças e entrega o plano confirmado ao inbound do hub até 2026-11-17."
  - id: Q_PF_AREA_FILTER_KG_QUERY_1120
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: kg-ssot
    x_due: "2026-11-20"
    impact: 5
    confidence: 0.5
    label: "O filtro por área na leitura do Brain, aplicado antes da leitura, e a cura da dívida: item de área ilegível sai inteiro da resposta do kg_query, sem id nem arquivo."
    narrative: "Pronto quando: as áreas por canal estão no kg-ssot, com tag publicada, o kg_query filtra antes de ler e um caso de bancada prova que uma identidade sem a área recebe resposta sem o id e sem o arquivo do item, com mutante que devolve os dois e reprova. Data proposta pelo core; o kg-ssot confirma ou contrapõe. O core leva o pedido ao kg-ssot. O hub só adota a tag depois."
  - id: Q_PF_IDENTITY_ROLE_1123
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: core
    x_due: "2026-11-23"
    impact: 5
    confidence: 0.5
    label: "A resolução de identidade e papel: o usuário do chat vira pessoa pelo provedor de identidade da família, e a pessoa vira papel e áreas pela matriz papel × audiência do adotante."
    narrative: "Mora no port de identidade da mensageria (D_MESSAGING_IDENTIDADE_DOIS_ADAPTERS_1106). O core entrega o port e o resolvedor; o hub preenche a sua matriz, que sai de Q_MA_AUDIENCES. Pronto quando: dado o usuário do chat, o resolvedor devolve pessoa, papel, áreas e teto de modo; sem identidade resolvida ou sem linha na matriz, o resultado é o modo de menor poder, com caso de bancada e mutante. Texto vindo do chat nunca muda papel nem modo. Data proposta pelo core."
  - id: Q_PF_CHAT_SESSION_BRIDGE_1124
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: core
    x_due: "2026-11-24"
    impact: 5
    confidence: 0.5
    label: "A ponte entre o serviço do chat e a sessão do adotante: contrato versionado e daemon na mensageria, com a instância rodando com o usuário do adotante."
    narrative: "Duas entregas: o contrato até 2026-11-20 e o daemon até 2026-11-24, no onion-messaging, vendorizado no core e nos hubs. Pronto quando: o serviço do chat alcança a sessão só pela ponte e segue sem home nem credencial do adotante; quem não está no grupo do canal local é recusado; com a instância fora do ar o bot cai para leitura; o corpo da mensagem chega como dado; cada ação registra mensagem, pessoa, modo e ferramenta. Cada item com caso de bancada, e o da recusa com mutante. O hub troca o processo do piloto pela instância da ponte quando ela sair. Data proposta pelo core."
  - id: Q_PF_CHANNEL_TEMPLATES_1127
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: core
    x_due: "2026-11-27"
    impact: 3
    confidence: 0.5
    label: "Os modelos de mensagem por canal (chat, WhatsApp, e-mail, task manager), únicos para a persona e para o task manager, na mensageria."
    narrative: "Um modelo por par canal e tipo de mensagem, com o formato de cada canal: comentário do task manager segue o adapter do provider. O WhatsApp entra pelo WAHA em número dedicado. Pronto quando: os modelos estão no onion-messaging com um gerador que recebe os campos e devolve a mensagem do canal, a persona e o task manager consomem o mesmo gerador e um caso de bancada cobre cada canal. O envio segue a escada de autonomia (Q_PS_ESCADA_DE_AUTONOMIA_1113) e o canal externo espera Q_MA_CLASSIFICATION. Data proposta pelo core."
