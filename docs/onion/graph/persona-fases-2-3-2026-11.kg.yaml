    label: "A ponte entre o serviço do chat e a sessão do adotante é contrato e daemon da mensageria do core, com uma instância por adotante rodando com o usuário dele; o WhatsApp entra pelo WAHA em número dedicado."
    narrative: "Responde a Q_AUD_BRAIN_RUNTIME_USER, no hub: o serviço do chat segue isolado, sem home, e quem toca repo e credenciais é a instância da ponte, com o usuário do adotante. O socket local restrito a um grupo, usado no piloto do hub, entra como insumo do contrato. Fica open porque a fonte é só o relato da sessão do core: um grep na origin/main por «número dedicado» e pela ponte não achou nó com o selo. O nó fecha quando um nó decision selado o superar."
    provenance:
