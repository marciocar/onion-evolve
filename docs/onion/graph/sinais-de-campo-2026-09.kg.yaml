    trace: .claude/commands/meta/drive.md
    label: "DEFEITO DE METODO NO PROPRIO /meta:drive, cometido por mim e apanhado pela sessao que conduz o plano. O P1 manda 'completar o censo com os fios em-voo: git worktree list, gh pr list, inbox' — e `git worktree list` devolve NOME DE BRANCH, que e DECLARACAO, nao estado. Eu li 'a worktree esta em fix/merge-verified-false-negative' e conclui 'o plano nao comecou', quando o plano tinha 12 nos fechados e o PR 1 dele em main. A branch estava naquele nome porque o maestro mandou curar um falso-negativo do ops/pr-merge-verified.sh que aparecera no merge do #814 — item pedido, nao desvio. ⚠️ A IRONIA E O ACHADO: o mesmo comando diz, tres linhas acima, que 'o status do no E o progresso'; e a classe do erro e exatamente a que esta sessao passou o dia cacando — confiar no que o artefato DECLARA em vez do que ele FAZ. CURA DE MECANISMO, nao de disciplina: o censo em-voo tem de ler o STATUS DOS NOS dos grafos em jogo (inclusive os de outras worktrees e o de origin/main), e usar `git worktree list` so para saber ONDE olhar — nunca para inferir O QUE foi feito. Nome de branch responde 'onde a sessao esta', jamais 'quanto do plano andou'."
