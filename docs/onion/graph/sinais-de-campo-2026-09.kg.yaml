      locator: "medido 2026-09-07: o censo do grafo do plano em origin/main devolve pronto=12 bloqueado=13 sobre 39 nos, com 12 fechados — entre eles D_PR01_STRICT_LIMPO (PR #815 mergeado). A afirmacao contraria ('o plano ainda nao comecou') foi produzida lendo `git worktree list` e vendo a branch `fix/merge-verified-false-negative`, que nao e no do plano"
