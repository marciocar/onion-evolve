    verified_against: "medido 2026-09-07: `kg-radar.sh <g> --integrity --schema` imprimia SO o cabecalho INTEGRIDADE; `--schema` sozinho imprime o dele. Causa: MODE=${2:---all} le so o $2. Sitios com a forma de dois modos, medidos por tipo: 22 ocorrencias em 6 arquivos .sh (executavel, incluindo os dois gates de passo zero e o predicado de selo) + 67 em 52 .md (prosa) + 6 outros. Rodando --schema sozinho: 0 reprovam entre os 92 grafos versionados nao-fixture (o corpus tem 125 no total; as 2 fixtures que reprovam existem para isso)"
    trace: .claude/validation/kg-radar.sh
    label: "SINAL DE CAMPO DO ADOTANTE poc-venda-direta-pdi (2026-08-31), CONFIRMADO no core em 2026-09-07: o kg-radar aceitava dois modos e rodava so o primeiro, EM SILENCIO, devolvendo exit 0 como se tivesse rodado os dois. O adotante contou 9 sitios; medido aqui sao 22 ocorrencias executaveis em 6 arquivos .sh — e dois deles sao gates de PASSO ZERO (kg-drive-project.sh e kg-realign-project.sh, que PARAM se o radar reprovar), mais o predicado de selo kg-seal-exception.sh criado no mesmo dia. DANO REAL: nao houve. Rodado sozinho, o --schema passa em 91 de 91 grafos versionados — nenhum defeito foi publicado. O dano foi de OUTRA natureza: durante toda a sessao de 2026-09-06/07 eu declarei 'radar --integrity --schema exit 0' como prova, e o schema nunca rodou. Afirmacao mais forte que a medicao, na guarda que existe para impedir exatamente isso. ⚠️ E O NO ERRADO ERA ESTE: a 1a versao dele afirmava '97 sitios' num verified_against, com confidence 0.95. O numero saiu de um grep preguicoso (linha que cita o radar e tem algum '--'), nao de contagem de invocacao. Um revisor adversarial mediu 5x menos. Num no cuja tese e 'afirmacao mais forte que a medicao', a medicao da propria tese estava inflada e carimbada como verificada — o defeito que o no denuncia, cometido pelo no. CURA: modos COMPOEM — o radar re-invoca a si mesmo um por modo e o rc reprova se qualquer um reprovar; preserva os 97 sitios sem tocar nas 700 linhas do parser. LICAO DA BANCADA, que e o que sobrevive: o caso que prova a cura NAO pode assertar rc=0, porque o defeito antigo TAMBEM dava rc=0 — so a presenca dos dois cabecalhos separa 'rodou os dois' de 'rodou um e calou'. Guarda que testa o rc de um fail-open nao testa nada."
