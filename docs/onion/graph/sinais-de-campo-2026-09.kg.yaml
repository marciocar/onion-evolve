    trace: docs/knowledge-base/agentic-patterns/ai-strategies/behavior-over-declaration.md
    label: "SINAL DE CAMPO DO portal-gamificacao (2026-09-07) que NUNCA VIROU ARQUIVO — viveu so na mensagem do commit 5f9e02d, e chegou aqui pelo maestro. A licao nao e sobre Base UI: `npm view <pkg> versions` MENTE SOBRE MATURIDADE quando o pacote foi renomeado. A lista e verdadeira e mesmo assim engana, porque descreve fielmente o historico DAQUELE NOME, e o nome foi abandonado; maturidade vive no pacote para onde o identificador aponta. A checagem barata que precede qualquer conclusao sobre estabilidade e `npm view <pkg> deprecated`. Vale para todo registry com renomeacao/transferencia (npm, PyPI, crates, Docker Hub, repo com `moved`): a listagem e sobre o NOME, o veredito de maturidade e sobre o DESTINO. Registrado como Caso 5 da KB behavior-over-declaration, que VIAJA no plugin onion — entao a licao alcanca os adotantes, nao so o core. ACHADO COLATERAL sobre o proprio canal: um aprendizado que fica na mensagem de commit nao chega a lugar nenhum; o inbox existe para isso e nao foi usado."
