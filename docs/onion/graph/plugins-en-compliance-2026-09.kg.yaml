    label: "O GERADOR E INSUMO — e nao estava em conjunto nenhum. `tree_sha` e a versao derivada eram calculados so sobre as FONTES do manifesto; o assembler, o plugin-readme.sh e a public-face.sh ficavam de fora. Consequencia MEDIDA, nao hipotetica: uma cura no gerador muda a SAIDA publicada e os dois sinais dizem 'nada mudou', entao `claude plugin update` responde 'already at the latest version' e o instalador fica com o artefato que reprova. E o MESMO modo de falha que a versao derivada nasceu para curar (sinal de campo 2026-09-03), reaparecendo por um flanco que ela nao cobria — behavior-over-declaration aplicado ao proprio sinal de drift. A cura poe os 5 geradores nas DUAS listas. DIRECAO ESCOLHIDA, declarada: bump A MAIS numa mudanca de comentario do gerador e um update no-op; bump A MENOS deixa o usuario travado — entao erra-se para o lado do excesso. O salto de versao e retroativo (conta o historico dos geradores), monotonico e semver-valido, uma vez so."

  - id: Q_TREE_SHA_ENDERECA_ENTRADA_NAO_SAIDA
    node_type: question
    drive_kind: decision
    plane: PROD
    status: open
    impact: 3
    confidence: 0.85
    verified_at: '2026-09-07'
    verified_against: "levantado pelo Elenxo do PR 1 em 2026-09-07 e nao resolvido nele: o campo se chama content-addressed e a nota do provenance.json diz 'hash do ls-tree das fontes canonicas em .claude/' — ou seja, ele enderecca a ENTRADA. A cura de E_GERADOR_E_INSUMO_DO_SINAL_DE_MUDANCA amplia o conjunto de entradas (poe os geradores dentro), mas nao muda a natureza do endereco"
    trace: .claude/utils/marketplace/assemble-plugin.sh
    label: "DECISAO DO MAESTRO — `tree_sha` deve endereccar a SAIDA (o conteudo do plugin montado, excluindo o proprio provenance.json) em vez das ENTRADAS? A favor: e o que 'content-addressed' promete, e fecha por construcao toda classe de 'a saida mudou e o hash nao' — a cura de hoje fecha o flanco conhecido (geradores) e deixa os desconhecidos abertos. Contra: muda a SEMANTICA da REGRA 19 (SSOT anti-drift), que hoje le o campo como 'a fonte mudou sem regenerar' e passaria a ler 'a saida no disco difere da registrada' — outra pergunta, talvez melhor, mas outra; e exige cuidado de bootstrap (o hash mora dentro do dir que ele endereca). NAO foi puxado para o PR 1 de proposito: e redesenho de contrato, nao correcao de bug."

  - id: Q_MERGE_VERIFICADO_DA_FALSO_NEGATIVO
    node_type: claim
    plane: PROD
    status: open
    impact: 3
    confidence: 0.95
    verified_at: '2026-09-07'
    verified_against: "medido 2026-09-07 no merge do PR #814: `ops/pr-merge-verified.sh 814` saiu rc 1 com a mensagem 'gh pr merge saiu com rc=1 — NAO declaro merge', e a causa foi `could not determine current branch: failed to run git: not on any branch` (HEAD destacado, para liberar a branch presa na worktree). O merge TINHA acontecido: `gh pr view 814` devolveu state MERGED e mergedAt 2026-09-07T15:52:31Z, os 3 commits entraram em main (9857681a, d2c9000c, 437dd680) e a branch remota foi apagada (`git ls-remote origin refs/heads/feat/plugins-en-compliance` = 0 linhas)"
    trace: ops/pr-merge-verified.sh
    label: "O caminho verificado de merge tem a falha INVERSA da que ele cura: da FALSO NEGATIVO. Ele existe para nunca declarar sucesso falso, e o desenho e bom — mas morre no passo 3 (rc do `gh pr merge`) e por isso NUNCA CHEGA ao passo 4, que e justamente a prova independente pelo ESTADO (`state=MERGED` + `mergedAt`). Assim ele nao distingue 'nao mergeou' de 'mergeou, a limpeza pos-merge e que falhou'. Mais seguro que o inverso, mas ainda engana: uma sessao futura pode tentar re-mergear ou entrar em panico, e a memoria do repo ja carrega uma explicacao PARCIAL deste sintoma (worktree segurando a branch) que hoje se mostrou nao ser a unica causa. CURA PROPOSTA, na propria filosofia dele: em rc != 0, CONSULTAR O ESTADO antes de morrer, e reportar em tres vias — nao mergeou (die) · mergeou e limpou (sucesso) · mergeou mas a limpeza falhou (sucesso com aviso acionavel). Sao poucas linhas; nao entrou no PR 1 por ser outro artefato e outro escopo."

