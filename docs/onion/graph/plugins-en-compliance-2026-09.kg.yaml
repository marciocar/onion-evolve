    trace: docs/analysis/plugins-en-compliance-2026-09-plano.md
    label: "PROVENIENCIA DESTE PLANO. Ele nao saiu de opiniao: as tres frentes derrubaram duas premissas que eu tinha antes de medir. (a) O clau.de/plugin-directory-submission NAO leva ao diretorio oficial — o submissivel e o COMUNITARIO, o oficial nao tem processo de aplicacao e o selo Verified nao e solicitavel. (b) NAO existe requisito publicado de idioma em lugar nenhum da politica; o que existe e taxa-base: o marketplace oficial tem 291 plugins e ZERO descricoes nao-inglesas, e o comunitario 11 em 2.282. (c) O idioma segue o ESCOPO do produto, nao a nacionalidade do time — 25 de 25 repos examinados obedecem, e projeto de dominio brasileiro chega a 11 mil estrelas em pt-BR. (d) O que de fato bloqueia nao e idioma: dos 5 requisitos duros cumprimos um e meio, tres plugins reprovam o validate --strict, o canal de suporte declarado e um 404, e o README afirma coisas FALSAS sobre privacidade e sobre o que os hooks fazem. O plano completo, com a ordem de PRs e os riscos declarados, vive no trace."

