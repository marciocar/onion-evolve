    confidence: 0.9
    label: "CLAIM QUE NASCEU DE UMA ARESTA-ALIBI DESFEITA, e o nascimento e o ponto. A 1a versao ligava [E_ACUSADOR_ERROU_O_REFERENTE] a [E_REGRA16_NAO_ALCANCA_POR_VOCABULARIO] com `SUPPORTS` — mas um juiz derrubando uma acusacao sobre D6 NAO eleva em nada a credencia de que um regex e cego a tres formas de '99'. Sao proposicoes independentes; o elo real era ANALOGIA DE MODO DE FALHA, e analogia nao e suporte evidencial. A aresta existia para o no nao ficar orfao (grau 0 reprova) — alibi por proximidade, SEGUNDA vez que o autor comete isso em um dia (a 1a foi em identidade-onion-vps, tambem pega pelo Elenxo). A cura nao e apagar a aresta: e NOMEAR a tese que a analogia de fato sustenta. ⚠️ A TESE: casar a PALAVRA sem ancorar no SUJEITO da frase falha igual em `grep`, em juiz-LLM e em humano. QUATRO instancias medidas no mesmo dia: (1) a REGRA 16 nao via '99' em tres formas porque o feeder exigia uma ordem de palavras; (2) um worker acusou `competitive-landscape.md` casando 'hipotese a validar' com a decisao D6 quando qualificava o whitespace de mercado; (3) o AUTOR deste grafo acusou `business-logic.md` de dizer '11 membros' casando o numeral com `11 skills`/`11 arquivos` — o doc diz 8, o valor certo; (4) ao ESCREVER este no, o autor tentou ancora-lo em `A_SINTESE_DO_RUN_DE_REVERIFICACAO`, id que pertence a OUTRO grafo, por lembrar a forma e nao o referente. A quarta aconteceu dentro da cura da terceira. O substrato muda (regex, LLM, humano); o defeito nao."

