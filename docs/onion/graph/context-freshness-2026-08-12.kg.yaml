  - id: Q_CONTAGEM_DE_ADOTANTES_STALE_EM_DOIS_DOCS_DE_BUSINESS
    node_type: question
    plane: PROD
    verified_at: 2026-08-12
    verified_against: grep-c-circunflexo-espaco-kind-adopter-em-members-yaml-devolve-8-contra-4-declarado-nos-dois-docs
    status: open
    impact: 3
    confidence: 1.0
    label: "DOIS docs de business afirmam '4 adotantes' e o vivo diz 8: `business/metrics.md` ('1 core + 4 adotantes', e o proprio texto admite 'contagem manual') e `business/voice-of-customer.md` ('4 adotantes de campo'). MEDIDO com a receita que REPRODUZ: `grep -c '^ *kind: adopter' members.yaml` = **8**. ⚠️ DUAS CORRECOES A MIM MESMO, ambas do Elenxo, e a 1a e grave: (1) a redacao anterior deste no se chamava CONTRADICAO CROSS-DOMINIO e acusava `technical/business-logic.md` de dizer '11 membros'. FALSO — a linha da tabela **'| Estado | ativo, em uso real — ... |'** dizia **'8 membros hoje'**: o VALOR 8 estava certo, o SUBSTANTIVO nao. ⚠️ E A CORRECAO ANTERIOR DESTE MESMO TRECHO INVENTOU UM DEFEITO: eu me auto-acusei de 'ter errado a linha 157', mas 157 estava CERTO na `main` — o 162 so valeu num commit intermediario e ja estava stale de novo no HEAD seguinte. Numero de linha e ancora VOLATIL; num no cuja tese e casar a palavra com o referente errado, citar o CONTEUDO da linha e a ancora honesta. Auto-acusacao tambem precisa ser medida. ⚠️ E D8 falsificou a frase depois: 8 e a contagem de ADOTANTES; MEMBROS sao 12. A propria regua que esta branch ratificou tornou errada a frase que este no defendia como certa — corrigido no mesmo movimento. Eu listei como divergente justamente o arquivo que estava certo, casando a palavra '11' com o referente errado (ha `11 skills` e `11 arquivos` no doc). E o eixo e EXATAMENTE o que o no [E_ACUSADOR_ERROU_O_REFERENTE_E_O_JUIZ_DERRUBOU] deste mesmo grafo celebra ter pego num worker: eu apliquei o Elenxo aos outros e nao a mim. Nao ha contradicao cross-dominio nenhuma — ha stale em DOIS docs, e o dominio technical esta correto. (2) o `verified_against` anterior publicava `grep -c 'kind: adopter'`, que devolve **9**: a 9a ocorrencia e uma LEGENDA COMENTADA do schema (`members.yaml:394`). O numero 8 estava certo e a receita nao reproduzia — carimbo que nao reproduz e a forma de `exit-code-nao-e-a-verificacao` aplicada a citacao de comando. GATILHO DE FECHAMENTO: decidir a regua canonica ('adotante' = `kind: adopter`) e fazer a prosa APONTAR para `members.yaml` em vez de copiar o numero."
    trace: "docs/evolution/federation/members.yaml"

