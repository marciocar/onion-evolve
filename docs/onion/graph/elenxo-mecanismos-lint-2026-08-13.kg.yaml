  - id: Q_GATILHO_DO_WIREIN_NAO_CASA_COM_O_SUT
    node_type: question
    plane: PROD
    verified_at: 2026-08-13
    verified_against: schema-sabotado-staged-bloqueia-o-commit-com-required-duplicado-e-o-integro-passa-em-0-2s
    status: done
    impact: 2
    confidence: 0.9
    label: "GAP DECLARADO DO WIRE-IN (3o Elenxo/M6): a guarda `kg-reverify-schema-check` vigia `.claude/commands/meta/kg-freshness.md`, mas mora na BANCADA — que no pre-commit so dispara quando o commit toca `.claude/validation/`. Editar o kg-freshness.md sozinho passa LOCAL sem a guarda rodar (o CI cobre, `.claude/**` esta nos paths do workflow) e o vermelho apareceria num commit FUTURO que toque validation/, culpando a mudanca errada. O sitio natural seria uma REGRA no lint-artifacts (roda em todo commit) — NAO feita de proposito: criar REGRA nova as pressas foi o padrao de defeito de 24h inteiras (required duplicado na guarda contra duplicacao, morte-silenciosa na guarda contra cegueira). GATILHO PARA PROMOVER: a 1a vez que um edit de kg-freshness.md quebrar o schema e passar local. ✅ FECHADO 2026-08-13 POR UMA TERCEIRA VIA que o no nao previa: nem REGRA as pressas, nem esperar o incidente — o pre-commit chama o check DIRETAMENTE quando kg-freshness.md esta no diff staged (3 linhas, ~0,2s, sem numero de REGRA, sem bancada). PROVADO nas duas direcoes: schema integro passa; schema SABOTADO (required duplicado, o defeito fundador) BLOQUEIA o commit com a violation nomeada. A promocao a REGRA formal continua disponivel se o padrao crescer — mas o furo local que este no documentava nao existe mais."

