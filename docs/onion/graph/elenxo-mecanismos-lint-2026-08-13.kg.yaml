    label: "RECONCILIA COM O GRAFO DA REFINARIA (onion-refinaria-2026-08, no E_lint_only_ja_existe_e_e_parcial), que concluira em 2026-08-06: 'os ~12s do --only sao PISO IRREDUTIVEL — o veredito das guardas globais seria FALSO se escopado'. A medicao daquele no era verdadeira; a CONCLUSAO foi SUPERADA: o gate por relevancia nao FATIA o que a guarda compara (isso sim falsearia) — decide SE ela roda, por area + pertencimento ao manifesto. Piso medido hoje: ~5s. O no da refinaria foi marcado `superseded` no proprio arquivo — aresta cross-grafo nao existe na gramatica, entao a reconciliacao e textual dos DOIS lados. ⚠️ E UM QUASE-ERRO MEU NA PROPRIA RECONCILIACAO: 'vi' um label duplicado naquele no lendo a saida CONCATENADA de dois comandos como se fosse o arquivo — o assert do meu script derrubou a suposicao (1 label, medido por awk no arquivo), e o cat -A revelou que ate a indentacao que eu 'lia' estava errada (o prefixo NR do awk somava colunas). Ler output formatado como estrutura e casar-a-palavra-com-o-referente-errado; TRES asserts baratos impediram tres afirmacoes falsas de serem publicadas."

  - id: I_P4_HIGIENE_DE_VERDADE_DECLARADA_FECHADA
