    confidence: 0.8
    label: "DEFEITO DO INSTRUMENTO DE REVISAO (PR #590, runs 31732737397 e 31735494448 — DUAS ocorrencias, nao uma): o parecer final acusou a 'remocao' exata do que o PR adiciona (a catraca de 58 linhas e o guard HARD do assemble). MINHA 1a TESE ('diff invertido, head->base') FOI DERRUBADA PELO 5o ELENXO — a lei da linha, desta vez contra o autor do no: a edicao de 18:54 do MESMO pin (soterrada pelo upsert; so acessivel via userContentEdits no GraphQL) dizia em texto claro 'Ignorei a modificacao NAO-COMMITADA de lint-artifacts.sh presente no WORKING TREE do checkout... ela reverte exatamente a cura'. FATO VERIFICADO: nos 2 runs a arvore do runner continha modificacao nao-commitada REVERTENDO a cura ao conteudo da base; diff-invertido e arvore-revertida produzem saida byte-identica (indistinguiveis pelo texto do parecer), e as 2 evidencias discriminantes apontam arvore suja. Eu citei o parecer anterior como calibracao SEM ler a versao soterrada — worst-truth-is-uncertain: inferi 'invertido' com confidence 0.9 quando o instrumento tinha RELATADO a causa alternativa 30min antes. HIPOTESE-LIDER (nao provada): o proprio revisor suja a arvore — o prompt do workflow NAO entrega o diff ('Revise o diff deste Pull Request', checkout no merge-ref refs/pull/N/merge), o revisor tem Bash e improvisa (ex.: git checkout base -- arquivo para comparar, sem restaurar); mesma assinatura nos 2 runs independentes = comportamento sistematico sob este prompt, nao acaso. GUARDA-POR-GREP (minha 1a proposta) REFUTADA pelo 5o Elenxo em 3 golpes: elipses nas citacoes quebram grep -F; trecho com ${} em BRE falha SILENCIOSO (rc=1 = 'ausente') — a classe guarda-por-lista-falha-pelo-vocabulario; e refactor-que-move passa nas duas checagens. ACHADO-BONUS DE MECANISMO: o pin upsertado APAGA os pareceres anteriores da vista — analise futura de 'o revisor errou?' parte de registro mutilado. GATILHO JA SATISFEITO (2 runs) — a acao devida: (a) o prompt do workflow passa a ENTREGAR o comando canonico do diff (git diff origin/main...HEAD) e proibir modificar a arvore; (b) o verdict ganha guarda dirty-tree (git status --porcelain nao-vazio apos a revisao -> anotar no parecer que a arvore estava suja). Lembrete de medicao: PR que edita o workflow nao mede o revisor — a prova vem do 1o PR SEGUINTE ao merge. ✅ PROVA VIVA 2026-08-13 (PR #593, DOIS runs: 31749652342/323bdbd e 31749555842/80cfdf15 — o parecer visivel e o do SEGUNDO, que sobrescreveu o primeiro 6s depois via upsert, o proprio defeito que este no registra): a guarda dirty-tree EXECUTOU no caminho real do verdict nos dois runs (post-review-comment depois do bloco no mesmo step -e; HEAD_ANTES/STASH_ANTES no env; sensor de HEAD fail-closed) e ficou MUDA — ##[warning]=0 nos dois, VEREDITO: conforme. O QUE A MUDEZ AUTORIZA (8o Elenxo rebaixou a inferencia): estado FINAL limpo — porcelain vazio, HEAD igual, stash igual. NAO autoriza 'a arvore que o revisor viu era a do PR': sujar-e-limpar segue invisivel (e foi EXERCIDO neste mesmo ciclo, pelo revisor LOCAL do residuo do #593, stash+pop byte-identico). O teto ganhou dono proprio: Q_MUDEZ_DA_GUARDA_NAO_SE_IDENTIFICA. ✅ ACAO EXECUTADA 2026-08-13 (branch fix/review-dirty-tree-guard) — e o 6o ELENXO DERRUBOU A V1 DA GUARDA no mesmo dia: (1) o SessionEnd do PROPRIO Onion apenda no ledger TRACKED em toda run headless (falso-positivo 100%; curado na ORIGEM: ledger_append pula sob GITHUB_ACTIONS); (2) git checkout <sha> e git stash deixam o porcelain VAZIO (v2: marco HEAD/stash antes da revisao + condicao composta); (4) origin/main fixo quebra em adotante (v2: base.ref do PR). TETO: sujar-e-limpar passa invisivel; guarda so roda no ramo revisou. OBSERVACAO fora de escopo registrada: o predicado benigno mede git diff BASE_SHA HEAD — com HEAD deslocado pelo revisor, mede OUTRO commit. Residuo: docs/evolution/review/fix-review-dirty-tree-guard.md."

