    confidence: 1.0
    label: "O RESULTADO VIVO DO P3, em no proprio (3o Elenxo/B5: a 1a redacao escreveu a cura mais substantiva do PR DENTRO de um no superseded — que o radar pesa a 0.2 e trata como historia; a projecao afundava o proprio resultado). O `--assert-parity` do kg-view.sh spawnava o MESMO parse `self --json` TRES vezes por grafo; a cura captura uma vez e reusa (v_vec + node_count + edge_count da mesma string). MEDIDO: guarda inteira 12,99->8,81s aqui, 12,2->8,2s no A/B intercalado do revisor (-32/-33%), veredito BYTE-IDENTICO nos 62 grafos, lint full 86->78s (71,3s em maquina ociosa — a condicao da medida importa). BONUS que o revisor achou e o commit nao declarava: os 3 parses independentes tinham TOCTOU real se o .kg.yaml mudasse entre eles — a captura unica o elimina."

  - id: Q_R19_AUTOFIX_COM_RASTRO_CANDIDATO
    node_type: question
    plane: PROD
    verified_at: 2026-08-13
    verified_against: v2-provada-nos-4-repros-do-4o-elenxo-inclusive-entrada-diretorio-que-a-v1-nao-cobria
    status: done
    impact: 3
    confidence: 0.9
    label: "CANDIDATO NOMEADO PELO MAESTRO (aparte 2026-08-13): 'regenerar o plugin pode ser acao deliberada em vez de rodar automatico... evitar este processamento em construcao?'. O GATILHO JA DISPAROU 3x EM 24H: a guarda de cobertura do site (111->112->113 a cada doc novo) e a R19 do plugin (2 bloqueios NA MESMA HORA, ambos meus, ao editar kg-view.sh — fonte bundlada — sem regenerar; custo ~19min de hook por bloqueio). A DISTINCAO QUE DECIDE O DESENHO: a regeneracao ja E deliberada; o automatico e a COBRANCA. E a R19 nunca acusa nada DECIDIVEL — a divergencia tem UMA cura deterministica ('regenere'). Guarda cujo veredito tem cura unica mecanica e candidata natural a AUTO-FIX COM RASTRO (o hook regenera, stagea e DIZ o que fez); guarda que exige julgamento humano, nunca. Alternativa (a): SOFT na branch/HARD no CI — precedente na REGRA 56 (isencao declarada em trabalho-em-curso), mas migra o vermelho para o pior lugar (descobre-se 16min depois do push). REJEITADO: aviso opcional silenciavel — fail-open classico de construcao. DECISAO DO MAESTRO: (a) vs (b) e troca de friccao por revisao do artefato gerado. Mitigante do (b): o plugin e 100% derivado da fonte, nao ha conteudo autoral no gerado. ✅ EXECUTADO 2026-08-13 — o maestro escolheu (b): o pre-commit detecta fonte bundlada no diff staged (paths LITERAIS extraidos dos manifests, match exato com grep -qxF), regenera o vertical afetado, STAGEA e IMPRIME o rastro. PROVADO com probe real: editar kg.md disparou a regeneracao. ⚠️ E O 4o ELENXO DERRUBOU A V1 NO MESMO DIA — a lei da linha pela 4a vez: o probe que EU escolhi (kg.md, entrada-ARQUIVO) era o happy-path da metade coberta. A v1 (grep textual do manifesto) era CEGA a entradas-DIRETORIO: 72 de 167 fontes (43%) nunca disparariam — medido com o repro engineer/plan.md, que nao imprimiu nada e deixou o tree_sha divergente. E mais dois HIGH: `git commit <pathspec>` usa INDICE TEMPORARIO (o add ia para o indice real como um REVERT fantasma para o commit seguinte — verde local, vermelho no CI, culpando o commit errado) e o assemble le a ARVORE (staging parcial publicaria WIP que o autor deixou fora, dentro de artefato que ninguem le em review). V2: fontes por SOURCE do manifesto (a mesma leitura do assemble — arrays enxergam dirs e arquivos como declarados), padroes ^f$|^f/ materializados em ARQUIVO (o pipe printf|grep -q morre de SIGPIPE acima de ~78KB e ENGOLE o match — fail-open medido, classe do PR #502), gate por GIT_INDEX_FILE, e aborto com instrucao quando fonte casada tem diff nao-staged. RE-PROVADA nos 4 repros do revisor: entrada-diretorio dispara, indice temporario pula com aviso, staging parcial aborta, e editar o MANIFESTO (o ato mais plugin-afetante, invisivel a v1) dispara. TETO: rename de fonte nao dispara o auto-fix — o assemble-falho da R19 bloqueia fail-loud de qualquer forma. A R19 segue INTACTA e HARD no CI."

