  - id: C_CAPABILITY_NAO_PODE_LEVAR_BLANKET_SKIP
    node_type: claim
    plane: DEV
    verified_at: 2026-08-13
    verified_against: fixture-bad-overclaim-injetada-com-blanket-skip-fica-cega-e-com-scope-filter-sem-normalizar-vdir-tambem
    status: confirmed
    impact: 5
    confidence: 1.0
    label: "O CUIDADO QUE IMPEDE A CURA INGÊNUA — e foi provado por SABOTAGEM, não por leitura. `check_capability_conformance` (REGRA 20) É exercitada via `--only` pelo selftest r20: blanket-skip a deixaria CEGA e o caso passaria de PASS a FAIL silenciosamente... não: a guarda ficaria cega e o selftest FALHARIA — o revisor provou injetando a fixture `bad-overclaim` no repo real: com blanket-skip, saída VAZIA (o overclaim 'gold mas cumpre silver' some). ⚠️ E A CORREÇÃO CERTA TAMBÉM FALHAVA: o scope-filter (`[ \"${manifest}\" != \"${ONLY_PATH}\" ] && continue`) não casava NUNCA, porque `vdir` carrega `..` literal não-normalizado enquanto ONLY_PATH vem normalizado — string comparison entre um path com `validation/../utils/` e um path canônico. Bug PRÉ-EXISTENTE, invisível até alguém tentar filtrar. Cura em duas partes: `vdir=\"$(cd \"${vdir}\" && pwd)\"` + o filtro no loop. Com as duas, o overclaim volta a ser detectado e o honesto segue limpo. A lição que transfere: gate por comparação de path exige NORMALIZAR os dois lados — é a família do 'correlação por chave estável, nunca por path' da doutrina de orquestração."
