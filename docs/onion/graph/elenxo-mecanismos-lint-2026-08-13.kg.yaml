  note: >
    Elenxo dos mecanismos de validação, pedido pelo maestro: "muitas automações .sh para lint com
    tempo e custo elevados, 700+ conferências num arquivo". Quatro lentes adversariais
    independentes (custo do --only, anatomia da bancada, parque de 47 scripts, regressão
    histórica), 19 achados, 241 tool-calls de medição. TESE: as 4 lentes convergiram SEM se verem
    no mesmo vilão — guardas de ESTADO GLOBAL sem gate de ONLY_PATH, com check_plugins_sync à
    frente. O custo não é das 700 conferências: é de ~6 guardas que ignoram o escopo.
    Projeção em prosa: docs/analysis/elenxo-mecanismos-lint-2026-08-13.md

nodes:
  - id: C_CUSTO_NAO_E_DAS_700_CONFERENCIAS_E_DO_ESCOPO_IGNORADO
    node_type: claim
