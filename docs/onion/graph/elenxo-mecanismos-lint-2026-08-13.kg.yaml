    label: "A TESE, e ela INVERTE o diagnóstico do pedido. O maestro apontou '700+ conferências num arquivo' como o custo — MEDIDO, o problema não é o número de conferências: é que ~6 guardas de ESTADO GLOBAL ignoram o ONLY_PATH e varrem o repo INTEIRO mesmo quando o escopo é 1 arquivo. Prova A/B da lente 1: `--only` de um arquivo custa 16,2-19,6s no baseline; com 5 guardas ganhando `[ -n \"${ONLY_PATH}\" ] && return 0` + 1 ganhando scope-filter, cai para **5,1-5,5s** — e o `diff` da saida nos DOIS CENARIOS TESTADOS foi vazio — ⚠️ e o 2o Elenxo provou que isso NAO generalizava: a 1a versao do gate (por prefixo de path) perdia violacao em TRES cenarios novos (drift de fonte bundlada, rename de work_tool, --only nao-canonico). A versao final gateia por PERTENCIMENTO AO MANIFESTO + inode-compare (-ef), re-provada contra os tres repros. O custo composto é o que dói: a bancada faz ~90-99 invocações `--only`, então cada segundo ali multiplica. As guardas sem gate: check_plugins_sync (8,9s — reassembla os 7 plugins A CADA invocação), check_bundled_command_script_deps (3,0s), check_capability_conformance (2,5s — ⚠️ esta NÃO pode levar blanket-skip, ver nó próprio), check_outbox_channel_exists (1,5s), check_role_bundle_sync (0,7s), check_agent_tool_names. O padrão do early-return JÁ EXISTE em ~30 guardas do mesmo arquivo — as caras nasceram sem ele."
