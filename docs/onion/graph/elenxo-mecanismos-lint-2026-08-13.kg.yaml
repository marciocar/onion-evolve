    status: superseded
    impact: 4
    confidence: 0.9
    label: "O SEGUNDO VILÃO É UM BUG DE EFICIÊNCIA, não de escopo: `check_kg_verification_coverage` (14,1s, a guarda mais cara do lint) gasta **8,5s dos 14,1s (60%) em 2.486 spawns de `sha1sum`** — um subprocesso POR NÓ do corpus de .kg.yaml, quando um lote único resolveria (o `load_universe` sozinho mede 0,44s). Guarda nascida DEPOIS da baseline de 16s, já nasceu cara, e o custo é por-commit no pre-commit local. Cura proposta pela lente: hash em lote no `load_hash_index()`. Ganho medido da eliminação: a guarda cai para ~5-6s. Junto: `check_kg_view_sync` (12,3s) gasta 5 subprocessos por arquivo quando 3 deles re-parseiam o MESMO --json. ⚠️ SUPERSEDED NA EXECUCAO DO P3 (2026-08-13): re-medido NO CAMINHO REAL do lint (`--format tsv`), o coverage custa **0,95s com 47 spawns** — os 2.486/8,5s da lente so ocorrem quando ha ORFAS no corpus (o caminho caro e condicional, linha 403 do proprio script), e o corpus esta limpo. testar-no-caminho-errado-e-nao-testar, cometido pela lente. O ALVO REAL do P3 era o item secundario: o kg_view_sync com triplo self --json — CURADO (uma captura, reuso 3x): guarda inteira 12,99s -> 8,81s (-32%) com paridade preservada nos 61 grafos."
