    verified_at: 2026-08-13
    verified_against: patch-a-b-medido-only-cai-de-16-2s-para-5-3s-com-diff-de-veredito-vazio-em-dois-cenarios
    status: confirmed
    impact: 5
    confidence: 0.9
    label: "A TESE, e ela INVERTE o diagnóstico do pedido. O maestro apontou '700+ conferências num arquivo' como o custo — MEDIDO, o problema não é o número de conferências: é que ~6 guardas de ESTADO GLOBAL ignoram o ONLY_PATH e varrem o repo INTEIRO mesmo quando o escopo é 1 arquivo. Prova A/B da lente 1: `--only` de um arquivo custa 16,2-19,6s no baseline; com 5 guardas ganhando `[ -n \"${ONLY_PATH}\" ] && return 0` + 1 ganhando scope-filter, cai para **5,1-5,5s** — e o `diff` da saida nos DOIS CENARIOS TESTADOS foi vazio — ⚠️ e o 2o Elenxo provou que isso NAO generalizava: a 1a versao do gate (por prefixo de path) perdia violacao em TRES cenarios novos (drift de fonte bundlada, rename de work_tool, --only nao-canonico). A versao final gateia por PERTENCIMENTO AO MANIFESTO + inode-compare (-ef), re-provada contra os tres repros. O custo composto é o que dói: a bancada faz ~90-99 invocações `--only`, então cada segundo ali multiplica. As guardas sem gate: check_plugins_sync (8,9s — reassembla os 7 plugins A CADA invocação), check_bundled_command_script_deps (3,0s), check_capability_conformance (2,5s — ⚠️ esta NÃO pode levar blanket-skip, ver nó próprio), check_outbox_channel_exists (1,5s), check_role_bundle_sync (0,7s), check_agent_tool_names. O padrão do early-return JÁ EXISTE em ~30 guardas do mesmo arquivo — as caras nasceram sem ele."
    trace: ".claude/validation/lint-artifacts.sh"

  - id: E_QUATRO_LENTES_CONVERGIRAM_SEM_SE_VER
    node_type: evidence
    plane: DEV
    verified_at: 2026-08-13
    verified_against: as-4-lentes-independentes-nomearam-check-plugins-sync-como-vilao-dominante
    status: confirmed
    impact: 4
    confidence: 1.0
    label: "O sinal de robustez do achado: as QUATRO lentes — que rodaram em paralelo, sem ver umas às outras, com perguntas DIFERENTES (por que --only custa 16,8s / anatomia dos 15min da bancada / sobreposição do parque / história da regressão) — nomearam `check_plugins_sync` como custo dominante, cada uma pelo próprio caminho de medição. Lente 1: 8,9s no trace por função. Lente 2: domina o loop do manifest, ~90 chamadas ≈ 10,5-11,7 MINUTOS da bancada. Lente 3: 'metade do custo de qualquer --only não-relacionado' (16,0→8,1s só ele). Lente 4: '~14,8s por invocação junto com agent_tool_names'. Convergência independente vale mais que qualquer confidence individual — é a versão multi-agente do perspective-diverse verify."
    trace: ".claude/validation/lint-artifacts.sh"

  - id: C_CAPABILITY_NAO_PODE_LEVAR_BLANKET_SKIP
    node_type: claim
    plane: DEV
    verified_at: 2026-08-13
    verified_against: fixture-bad-overclaim-injetada-com-blanket-skip-fica-cega-e-com-scope-filter-sem-normalizar-vdir-tambem
    status: confirmed
    impact: 5
    confidence: 1.0
    label: "O CUIDADO QUE IMPEDE A CURA INGÊNUA — e foi provado por SABOTAGEM, não por leitura. `check_capability_conformance` (REGRA 20) É exercitada via `--only` pelo selftest r20: blanket-skip a deixaria CEGA e o caso passaria de PASS a FAIL silenciosamente... não: a guarda ficaria cega e o selftest FALHARIA — o revisor provou injetando a fixture `bad-overclaim` no repo real: com blanket-skip, saída VAZIA (o overclaim 'gold mas cumpre silver' some). ⚠️ E A CORREÇÃO CERTA TAMBÉM FALHAVA: o scope-filter (`[ \"${manifest}\" != \"${ONLY_PATH}\" ] && continue`) não casava NUNCA, porque `vdir` carrega `..` literal não-normalizado enquanto ONLY_PATH vem normalizado — string comparison entre um path com `validation/../utils/` e um path canônico. Bug PRÉ-EXISTENTE, invisível até alguém tentar filtrar. Cura em duas partes: `vdir=\"$(cd \"${vdir}\" && pwd)\"` + o filtro no loop. Com as duas, o overclaim volta a ser detectado e o honesto segue limpo. A lição que transfere: gate por comparação de path exige NORMALIZAR os dois lados — é a família do 'correlação por chave estável, nunca por path' da doutrina de orquestração."
    trace: ".claude/validation/lint-artifacts.sh"

  - id: E_SHA1SUM_POR_NO_2486_SPAWNS
    node_type: evidence
    plane: PROD
    verified_at: 2026-08-13
    verified_against: re-medido-no-caminho-do-lint-format-tsv-0-95s-e-47-spawns-o-caminho-caro-so-dispara-com-orfas
    status: superseded
    impact: 4
    confidence: 0.9
    label: "O SEGUNDO VILÃO É UM BUG DE EFICIÊNCIA, não de escopo: `check_kg_verification_coverage` (14,1s, a guarda mais cara do lint) gasta **8,5s dos 14,1s (60%) em 2.486 spawns de `sha1sum`** — um subprocesso POR NÓ do corpus de .kg.yaml, quando um lote único resolveria (o `load_universe` sozinho mede 0,44s). Guarda nascida DEPOIS da baseline de 16s, já nasceu cara, e o custo é por-commit no pre-commit local. Cura proposta pela lente: hash em lote no `load_hash_index()`. Ganho medido da eliminação: a guarda cai para ~5-6s. Junto: `check_kg_view_sync` (12,3s) gasta 5 subprocessos por arquivo quando 3 deles re-parseiam o MESMO --json. ⚠️ SUPERSEDED NA EXECUCAO DO P3 (2026-08-13): re-medido NO CAMINHO REAL do lint (`--format tsv`), o coverage custa **0,95s com 47 spawns** — os 2.486/8,5s da lente so ocorrem quando ha ORFAS no corpus (o caminho caro e condicional, linha 403 do proprio script), e o corpus esta limpo. testar-no-caminho-errado-e-nao-testar, cometido pela lente. O ALVO REAL do P3 era o item secundario: o kg_view_sync com triplo self --json — CURADO (uma captura, reuso 3x): guarda inteira 12,99s -> 8,81s (-32%) com paridade preservada nos 61 grafos."
    trace: ".claude/validation/kg-verification-coverage.sh"

  - id: E_REGRESSAO_16S_86S_E_CONCENTRADA_NAO_LINEAR
    node_type: evidence
    plane: DEV
    verified_at: 2026-08-13
    verified_against: guardas-27-para-59-2-19x-linhas-2-51x-tempo-5-37x-concentrado-em-3-guardas-novas
    status: confirmed
    impact: 4
    confidence: 0.9
    label: "A REGRESSÃO NÃO FOI O PREÇO DO CRESCIMENTO — foi concentrada. De PR #357 (16s) a hoje (86s): guardas 27→59 (2,19×), linhas 1.307→3.279 (2,51×), tempo 16s→86s (**5,37×**). Se o custo fosse linear com o escopo, 86s seriam ~35s. O desproporcional mora em 3 guardas novas que já nasceram caras (kg_verification_coverage 14,1s, kg_view_sync 12,3s, plugins_sync 8,5s) — e nenhuma delas nasceu com o gate de ONLY_PATH que ~30 guardas irmãs já tinham. ⚠️ ACHADO DE DOUTRINA da mesma lente: o comentário do pre-commit hook declara '44s' de custo — o vivo é 86s, stale há 7 dias. Declarado≠verificado no próprio instrumento que existe para pegar isso. E a régua do maestro se aplica: efficiency-over-economy — a pergunta não é gastar menos, é se cada conferência roda no MOMENTO certo; as lentes recomendaram NÃO mover kg_view_sync para CI-only (o custo só aparece em runs sem --only) e NÃO deletar nenhuma guarda do top-6 (todas têm incidente real documentado no cabeçalho)."
    trace: ".claude/validation/lint-artifacts.sh"

  - id: Q_SEIS_SCRIPTS_SEM_CONSUMIDOR_DECISAO_DO_MAESTRO
    node_type: question
    plane: PROD
    verified_at: 2026-08-13
    verified_against: tripla-regua-2026-08-13-consumed-mode-oficial-33-pares-0-sem-teste-e-o-unico-orfao-real-foi-ligado
    status: done
    impact: 3
    confidence: 0.8
    label: "SEIS dos 47 scripts têm ZERO consumidor de produção — só aparecem no próprio bloco `--selftest`: candidatos nomeados pela lente 3 incluem `context-freshness-metric.sh` e `federation-engagement.sh` (lista completa na síntese). São ~690 linhas mantidas sem invocação viva. ⚠️ TRÊS CUIDADOS ANTES DE QUALQUER BAIXA, todos da doutrina: (1) [[never-shutdown-vps-tools]] — 'sem consumidor hoje' = falta LIGAR, não licença para apagar; a decisão é do maestro; (2) o próprio `consumed-mode-check.sh` — o instrumento que mede isso — tem cabeçalho MENTINDO sobre o próprio status de wire-in (diz que não está ligado ao lint quando está); um medidor de consumo com autodescrição errada é ironia a corrigir ANTES de confiar na medição; (3) `vps-exposure-check.sh` aparece como zero-consumidor no grep mas roda por SYSTEMD TIMER — consumo fora do repo, invisível ao grep. A régua: consumo se mede pelo RUNTIME (timer, hook, CI), não só pelo grep no repo. GATILHO: o maestro decidir o destino dos 6, um a um. ✅ FECHADO 2026-08-13 — e a contagem de reguas foi CORRIGIDA pelo 3o Elenxo: eram DUAS, nao tres. (1) grep de invocacao real em hooks/CI/comandos/scripts achou UM orfao — `kg-reverify-schema-check.sh`, criado pelo proprio autor em 2026-08-12 e nunca ligado; (2) a regua da lente ('so aparece no proprio --selftest') nao resiste a medicao direta. ⚠️ A REGUA QUE EU CITAVA COMO (2) CAIU: o `consumed-mode-check.sh` compara EXCLUSIVAMENTE producao(lint) x bancada(selftest) — um script com ZERO invocacao de producao contribui ZERO pares e e INVISIVEL por construcao ao instrumento; '33 pares/0 sem teste' e IDENTICO em main e na branch, provando que ele nao ve o proprio wire-in deste PR. Responde 'todo modo consumido e exercitado?', nunca 'existe consumidor?'. Citar um numero verdadeiro como evidencia de uma pergunta que ele nao responde e a forma estatistica de casar-a-palavra-com-o-referente-errado. CURA APLICADA: o orfao real foi LIGADO a bancada (2 casos novos — selftest embutido 6/6 + schema real conforme), honrando 'sem consumidor = falta ligar, nao licenca para apagar'. NADA foi deletado."
    trace: ".claude/validation/consumed-mode-check.sh"

  - id: E_PISO_IRREDUTIVEL_DA_REFINARIA_SUPERADO
    node_type: evidence
    plane: DEV
    verified_at: 2026-08-13
    verified_against: only-de-12-16s-para-5s-com-diff-vazio-e-bancada-798-de-798-no-mesmo-ambiente
    status: confirmed
    impact: 4
    confidence: 0.9
    label: "RECONCILIA COM O GRAFO DA REFINARIA (onion-refinaria-2026-08, no E_lint_only_ja_existe_e_e_parcial), que concluira em 2026-08-06: 'os ~12s do --only sao PISO IRREDUTIVEL — o veredito das guardas globais seria FALSO se escopado'. A medicao daquele no era verdadeira; a CONCLUSAO foi SUPERADA: o gate por relevancia nao FATIA o que a guarda compara (isso sim falsearia) — decide SE ela roda, por area + pertencimento ao manifesto. Piso medido hoje: ~5s. O no da refinaria foi marcado `superseded` no proprio arquivo — aresta cross-grafo nao existe na gramatica, entao a reconciliacao e textual dos DOIS lados. ⚠️ E UM QUASE-ERRO MEU NA PROPRIA RECONCILIACAO: 'vi' um label duplicado naquele no lendo a saida CONCATENADA de dois comandos como se fosse o arquivo — o assert do meu script derrubou a suposicao (1 label, medido por awk no arquivo), e o cat -A revelou que ate a indentacao que eu 'lia' estava errada (o prefixo NR do awk somava colunas). Ler output formatado como estrutura e casar-a-palavra-com-o-referente-errado; TRES asserts baratos impediram tres afirmacoes falsas de serem publicadas."

  - id: I_P4_HIGIENE_DE_VERDADE_DECLARADA_FECHADA
    node_type: decision
    plane: PROD
    verified_at: 2026-08-13
    verified_against: pre-commit-carimbado-78s-medido-e-cabecalho-do-consumed-mode-atualizado-para-o-wire-in-da-regra-59
    status: done
    impact: 3
    confidence: 1.0
    label: "P4 FECHADO nas duas pontas, e a segunda invalidou o proprio achado da lente: (a) o comentario do pre-commit dizia 'hoje em 44s' — re-medido pos-cura do kg-view: **78s**, carimbado com a instrucao de re-medir a cada mexida (o numero ja esteve 2x stale: 16s->44s->86s->78s); (b) o cabecalho do `consumed-mode-check.sh` dizia 'NAO esta ligado ao lint como REGRA HARD' — MEDIDO: a REGRA 59 [HARD] o consome via check_consumed_modes. ⚠️ A lente 3 relatou a direcao INVERTIDA ('o cabecalho mente sobre estar ligado' sugerindo que dizia estar quando nao estava) — o stale era o oposto: dizia NAO estar e ESTA. O instrumento que mede declarado≠consumido carregava a propria autodescricao divergente; o paragrafo original ficou como registro historico datado, nao apagado."

  - id: Q_GATILHO_DO_WIREIN_NAO_CASA_COM_O_SUT
    node_type: question
    plane: PROD
    verified_at: 2026-08-13
    verified_against: schema-sabotado-staged-bloqueia-o-commit-com-required-duplicado-e-o-integro-passa-em-0-2s
    status: done
    impact: 2
    confidence: 0.9
    label: "GAP DECLARADO DO WIRE-IN (3o Elenxo/M6): a guarda `kg-reverify-schema-check` vigia `.claude/commands/meta/kg-freshness.md`, mas mora na BANCADA — que no pre-commit so dispara quando o commit toca `.claude/validation/`. Editar o kg-freshness.md sozinho passa LOCAL sem a guarda rodar (o CI cobre, `.claude/**` esta nos paths do workflow) e o vermelho apareceria num commit FUTURO que toque validation/, culpando a mudanca errada. O sitio natural seria uma REGRA no lint-artifacts (roda em todo commit) — NAO feita de proposito: criar REGRA nova as pressas foi o padrao de defeito de 24h inteiras (required duplicado na guarda contra duplicacao, morte-silenciosa na guarda contra cegueira). GATILHO PARA PROMOVER: a 1a vez que um edit de kg-freshness.md quebrar o schema e passar local. ✅ FECHADO 2026-08-13 POR UMA TERCEIRA VIA que o no nao previa: nem REGRA as pressas, nem esperar o incidente — o pre-commit chama o check DIRETAMENTE quando kg-freshness.md esta no diff staged (3 linhas, ~0,2s, sem numero de REGRA, sem bancada). PROVADO nas duas direcoes: schema integro passa; schema SABOTADO (required duplicado, o defeito fundador) BLOQUEIA o commit com a violation nomeada. A promocao a REGRA formal continua disponivel se o padrao crescer — mas o furo local que este no documentava nao existe mais."

  - id: I_P3_KG_VIEW_TRIPLO_PARSE_CURADO
    node_type: decision
    plane: PROD
    verified_at: 2026-08-13
    verified_against: a-b-intercalado-12-2-para-8-2s-com-veredito-byte-identico-nos-62-grafos-e-lint-full-78s
    status: done
    impact: 4
    confidence: 1.0
    label: "O RESULTADO VIVO DO P3, em no proprio (3o Elenxo/B5: a 1a redacao escreveu a cura mais substantiva do PR DENTRO de um no superseded — que o radar pesa a 0.2 e trata como historia; a projecao afundava o proprio resultado). O `--assert-parity` do kg-view.sh spawnava o MESMO parse `self --json` TRES vezes por grafo; a cura captura uma vez e reusa (v_vec + node_count + edge_count da mesma string). MEDIDO: guarda inteira 12,99->8,81s aqui, 12,2->8,2s no A/B intercalado do revisor (-32/-33%), veredito BYTE-IDENTICO nos 62 grafos, lint full 86->78s (71,3s em maquina ociosa — a condicao da medida importa). BONUS que o revisor achou e o commit nao declarava: os 3 parses independentes tinham TOCTOU real se o .kg.yaml mudasse entre eles — a captura unica o elimina."

  - id: Q_R19_AUTOFIX_COM_RASTRO_CANDIDATO
    node_type: question
    plane: PROD
    verified_at: 2026-08-13
    verified_against: probe-em-fonte-bundlada-staged-disparou-regeneracao-e-stage-com-rastro-e-a-r19-segue-hard-no-ci
    status: done
    impact: 3
    confidence: 0.9
    label: "CANDIDATO NOMEADO PELO MAESTRO (aparte 2026-08-13): 'regenerar o plugin pode ser acao deliberada em vez de rodar automatico... evitar este processamento em construcao?'. O GATILHO JA DISPAROU 3x EM 24H: a guarda de cobertura do site (111->112->113 a cada doc novo) e a R19 do plugin (2 bloqueios NA MESMA HORA, ambos meus, ao editar kg-view.sh — fonte bundlada — sem regenerar; custo ~19min de hook por bloqueio). A DISTINCAO QUE DECIDE O DESENHO: a regeneracao ja E deliberada; o automatico e a COBRANCA. E a R19 nunca acusa nada DECIDIVEL — a divergencia tem UMA cura deterministica ('regenere'). Guarda cujo veredito tem cura unica mecanica e candidata natural a AUTO-FIX COM RASTRO (o hook regenera, stagea e DIZ o que fez); guarda que exige julgamento humano, nunca. Alternativa (a): SOFT na branch/HARD no CI — precedente na REGRA 56 (isencao declarada em trabalho-em-curso), mas migra o vermelho para o pior lugar (descobre-se 16min depois do push). REJEITADO: aviso opcional silenciavel — fail-open classico de construcao. DECISAO DO MAESTRO: (a) vs (b) e troca de friccao por revisao do artefato gerado. Mitigante do (b): o plugin e 100% derivado da fonte, nao ha conteudo autoral no gerado. ✅ EXECUTADO 2026-08-13 — o maestro escolheu (b): o pre-commit detecta fonte bundlada no diff staged (paths LITERAIS extraidos dos manifests, match exato com grep -qxF), regenera o vertical afetado, STAGEA e IMPRIME o rastro. PROVADO com probe real: editar kg.md disparou a regeneracao do onion-work-tools + stage do provenance. Assemble falho no hook = fail-loud com o comando de diagnostico. A R19 segue INTACTA como guarda e HARD no CI — quem commitar por fora do hook e pego la."

  - id: I_ASSEMBLE_FALHO_VIRA_VIOLATION
    node_type: decision
    plane: PROD
    verified_at: 2026-08-13
    verified_against: skill-bundlada-removida-e-o-lint-acusa-assemble-FALHOU-e-imprime-sumario-em-vez-de-morrer-rc2
    status: done
    impact: 3
    confidence: 1.0
    label: "FECHA O GAP ORFAO DA LINHA — o achado ADJACENTE do 2o Elenxo que ficou nomeado no residuo do PR #588 e NUNCA virou no (a auditoria de fechamento pegou: item sem estado no grafo e exatamente o que o controle do maestro proibe). O defeito pre-existente: `bash asm ...` como comando simples sob `set -e` — se o assemble falhasse (fonte bundlada apagada/quebrada), o lint MORRIA em rc=2 SEM sumario, e os chamadores por ausencia-de-mensagem liam a morte como PASS. Apagar uma fonte bundlada nao produzia 'fora de sincronia': produzia silencio. CURADO: `if ! bash asm...; then violation HARD 'assemble FALHOU' + continue`. PROVADO removendo uma skill bundlada de verdade: o lint acusou `assemble FALHOU (fonte bundlada ausente/quebrada?)` com o comando de diagnostico E imprimiu o sumario — acusa e soma, nao morre."

