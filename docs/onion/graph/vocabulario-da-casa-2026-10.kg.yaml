meta:
  schema_version: "1"
  id: vocabulario-da-casa-2026-10
  slug: vocabulario-da-casa-2026-10
  title: "Vocabulário da casa: os códigos curtos do core com nome legível"
  date: "2026-10-23"
  purpose: "Os termos x_term (contrato v4.14 da kg-ssot 4.23.0) dos códigos curtos que colidem no corpus do core. O id curto fica estável e vira a notation; o pref é o nome legível; o scheme é a família do código (D_NOMES_FORMA_ID_CURTO_MAIS_X_TERM_1023). O kg_vocab lint confere a prosa contra estes termos, e o glossário do hook house-code-gloss projeta daqui as linhas de termo."
  note: "Notation repetida entre esquemas é a colisão medida, e é de propósito: a menção sem qualificador fica ambígua (escreva esquema:código, como radar-cc:r7). TETO, medido na passada adversarial: cada esquema traz só os códigos que o corpus de HOJE usa, e um código que existe em um esquema só resolve para aquele sentido mesmo num texto de outro (o caso r14 da bancada resolve como rodada do radar, porque a bancada não tem termo r14). O lint pega o código sem nome e o ambíguo, não o sentido errado com nome único; a segunda rede é o hook da glosa, onde o domínio do bloco decide."
# Arestas para nó de OUTRO grafo do core (contrato v4.3): o termo do eixo E7 aponta a decisão que o abriu.
