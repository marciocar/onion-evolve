nodes:
  - id: E_CHAT_ORIGIN_MAESTRO_ASK_1121
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.7
    verified_at: "2026-11-21"
    verified_against: "pedido do maestro à sessão do core em 2026-11-21, que a sessão registrou na memória dela e repassou à curadoria como encomenda da dissecação «canal de conversa» (campo request do sinal de 2026-11-21 da curadoria ao core)"
    label: "Origem do contrato: o maestro pediu em 2026-11-21 um contrato SDAAL de canal de conversa em que o agente responde e age na hora, quando chamado (@brain) ou quando entende pelo contexto que é com ele"
    narrative: "Fala do maestro registrada pela sessão do core: «a conversa com você tem que ser imediata, a pessoa escreve te chamando (ex: @brain) ou você entendendo que é com você, deve tomar as decisões e ações». Dela saíram a encomenda à curadoria (dissecar a categoria, com a conversa imediata no contrato), o Delphi de 4 sessões e o selo D_CHAT_CHANNEL_CONTRACT_SDAAL_1121. O brief da sessão do core diz que o pedido veio do canal do maestro com os sócios; o lugar não foi medido por este registro, só o conteúdo. As duas fontes vivem fora do git deste repo (a memória da sessão e o sinal da curadoria ainda não processado): o localizador não se reproduz a partir do repo, e por isso a confiança é 0.7."
    provenance:
      source: "maestro, na sessão do core de 2026-11-21"
      locator: "memória da sessão do core (chat-agent-immediate-action, 2026-11-21) e o campo request do sinal da curadoria «Dissecação da categoria canal de conversa» de 2026-11-21"
      method: "testimony: fala do maestro registrada pela sessão"
      locality: "pessoa"
  - id: E_CHAT_CONTRACT_BUILT_1122
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.9
    verified_at: "2026-11-22"
    verified_against: "python3 -I -B .claude/utils/chat/conformance.py sobre os exemplos (rc 0) e sobre os casos com falta (rc 1); família run_chat_conformance_selftests da bancada, um caso por código de falta, e mutantes plantados no próprio juiz por mutate-and-restore"
    label: "O contrato onion.chat/v1 existe no core: schema da mensagem normalizada com os 5 campos, vocabulário fechado de 22 capacidades (7 verbos obrigatórios, 5 opcionais, 10 regras do núcleo) e o juiz conformance.py (rc 0 conforme, 1 viola, 2 não mediu)"
    narrative: "Construído em .claude/utils/chat/ no molde do task-manager, sem adapter com segredo nem chamada ao provedor. O juiz reprova evento sem id do provedor, quem pede fora do id do provedor, sem audiência e duplicado; na resposta, vazamento, audiência reprovada ou listada depois, horas fora de ordem e «serviu?» pulado sem motivo. Limite declarado: não sabe se a identidade resolvida é a pessoa certa nem se a guarda da peça funciona."
    provenance:
      source: "sessão do core, PR do contrato de canal de conversa"
      locator: ".claude/utils/chat/ (README.md, interface.md, message.schema.json, vocabulary.tsv, conformance.py)"
      method: "measurement: execução do juiz e da bancada"
      locality: "repo"
  - id: E_CHAT_WAHA_CAPABILITIES_MEASURED_1122
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.75
    verified_at: "2026-11-22"
    verified_against: "leitura do código da peça de mensageria na origin/main de 2026-11-22 (conferida por git ls-remote; o commit fica fora deste repo público, REGRA 121): tools/notify/remind.py, watcher/onion_watcher/channels.py e events.py, queue/onion_queue/daemon.py; conformance.py capabilities --strict sobre a declaração"
    label: "O adapter WAHA na peça onion-messaging cumpre 3 de 17 capacidades obrigatórias: envio, ack e teto de mídia; a recepção entrega o corpo bruto, sem os 5 campos"
    narrative: "A 1ª declaração contava 6; a revisão isolada mostrou que guarda de vazamento (não reconhece dado de quem não está na audiência), teto (sem ritmo por conversa) e segredo fora da saída (medido só no envio) são parciais pelas notas das próprias linhas. Parciais: recepção (CloudEvent com o corpo bruto do WAHA), audiência (só --groups), dedupe (pelo sha256 do corpo, não pelo id da mensagem), retenção (prune do dono, sem prazo de corpos de terceiros), auditoria (só do envio), além das três acima. Faltam: responder no fio, mapa de identidade, «serviu?», latência e marca de quem leu; a perda do número não foi medida. Medida por leitura, nada rodado contra o WAHA."
    provenance:
      source: "sessão do core, leitura do repositório onion-messaging"
      locator: ".claude/utils/chat/adapters/waha.capabilities.tsv"
      method: "measurement: leitura do código da peça e conformance.py --strict"
      locality: "repo"
  - id: D_CHAT_PSEUDONYM_IDS_AND_ROLE_VOCAB_1122
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 3
    confidence: 0.85
    verified_at: "2026-11-22"
    owner: "core"
    verified_against: "lacuna apontada pela sessão da mensageria no PR #1732 antes do merge, repassada pela sessão coordenadora do core; conformance.py e a família run_chat_conformance_selftests com os casos ID-COM-NUMERO e PAPEL e os mutantes M30 a M35"
    label: "Decisão do core, reversível: identificador que sai do adapter de chat é pseudônimo (<provider>:<hmac 16 hex> ou apelido), nunca id cru com telefone ou e-mail; papel é internal, partner, external ou customer (só no canal oficial)"
    narrative: "No WAHA o id cru é <número>@c.us, e o id de mensagem também leva o número: carregá-los no evento contradizia rule.secret_never_out e a guarda de vazamento. A resolução do id cru para pessoa, e de volta para o fio, fica dentro do adapter. O juiz recusa identificador com 8 ou mais dígitos seguidos ou com forma de e-mail, salvo a forma <provider>:<16 hex>. A extensão da guarda além do provider_id (lugar, fio e ids de mensagem) é escolha desta implementação, pela mesma causa. Quem não está no mapa sai external com person null (antes era unknown). Revisão do maestro pendente: se ele discordar, o contrato muda."
    provenance:
      source: "sessão do core, na emenda do PR #1732"
      locator: ".claude/utils/chat/interface.md (seções Identificadores e Papel) e README.md (A decisão)"
      method: "testimony: decisão do core, reversível, sobre sinal da sessão da mensageria"
      locality: "repo"
  - id: Q_CHAT_WAHA_ADAPTER_CONFORMANT_1122
    node_type: question
    layer: audit
    plane: DEV
    status: open
    owner: onion-messaging
    impact: 4
    confidence: 0.5
    label: "O adapter WAHA da onion-messaging entrega o evento com os 5 campos e passa no conformance.py --strict?"
    narrative: "Pronto quando: a bancada da peça roda conformance.py check sobre a saída do adapter com o WAHA simulado e mutantes, com rc 0, e a declaração waha.capabilities.tsv é atualizada no core com a fonte de cada capacidade nova. O 1º entregável que o Delphi pediu (os 5 campos, o mapa de identidade e a recepção durável) é o primeiro passo. Prazo a calibrar com a peça dona: sai de pontos e histórico."
