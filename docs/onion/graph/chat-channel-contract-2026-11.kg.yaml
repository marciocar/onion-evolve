  slug: chat-channel-contract-2026-11
  title: "Contrato SDAAL de canal de conversa: origem, construção e a medida do 1º adapter"
  date: "2026-11-22"
  baseline: "2026-11-22"
  review_after: "2026-12-22"
  purpose: "Grafo do assunto do contrato de canal de conversa (onion.chat/v1, em .claude/utils/chat/). A decisão selada mora no arquivo de selos (D_CHAT_CHANNEL_CONTRACT_SDAAL_1121); aqui ficam a origem do pedido, a construção do contrato no core e a medida do adapter WAHA na peça que opera o canal."
  note: "Nasceu em 2026-11-22 com o PR do contrato, que cura os dois achados do resíduo do PR #1726: a síntese do Delphi passa a viver no repo (.claude/utils/chat/README.md) e o nó da decisão ganha aresta para a origem certa (E_CHAT_ORIGIN_MAESTRO_ASK_1121) no lugar da aresta de proximidade para a sombra da AWS."
  # ═══ TETO: 20 NÓS ═══
