meta:
  slug: testes-evidencia-2026-09
  title: "Testes, evidência e métrica de IA — a onda que cura o medível antes de pesquisar"
  purpose: |
    Plano-grafo da onda pedida pelo maestro em 2026-09-08: "mais controle e visibilidade dos
    testes, evidências (incluindo visuais) e, ao mesmo tempo, lidar e metrificar com a IA".

    Existe porque o censo do `fios-abertos` não via este trabalho: ele vivia num arquivo de plano,
    e trabalho sem nó é trabalho sem controle — a própria tese do /meta:drive.

    A ordem não é acidental: cura-se o que já é medível SEM pesquisa (onda 0), e só então se gasta
    pesquisa no que exige estado da arte. O inverso produziria uma pesquisa citando como estado
    atual um painel que já se sabia falso.
  review_after: '2026-10-08'

nodes:
  - id: E_PAINEL_INVENTADO_E_DOC_STALE
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.95
    verified_at: '2026-09-08'
    verified_against: 'commit 346673a7; grep dos números; bash consumed-mode-check.sh → 40 pares · 0 sem teste'
    label: "DUAS FALSIDADES no material de testes, nenhuma pega por guarda — as duas pegas por alguém rodando o comando. (1) `docs/onion/testing-validation-system.md` publicava painel ASCII com Coverage 85% · Unit Tests 247 · Mutation 74%, e NENHUM tinha produtor: eram as metas da seção anterior redesenhadas como medição, num documento de TESTES. (2) `docs/onion/maintenance-checklist.md` dizia que a guarda de modo consumido estava DESLIGADA; está ligada, é HARD, e mede 40 pares com 0 sem teste — o texto ficou stale no wire-in de 2026-08-13 e enganou uma exploração desta casa antes de qualquer humano."
    trace: 'docs/onion/testing-validation-system.md; docs/onion/maintenance-checklist.md'

  - id: E_BANCADA_NAO_CONTAVA_PARA_NINGUEM
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.95
    verified_at: '2026-09-08'
    verified_against: 'commit 7d104066; bancada 1127/1127 STRICT --jobs auto em 685s, TSV de 164 linhas'
    label: "A bancada sabia tudo e não contava para ninguém: o resultado morria no log do job. Sem resultado legível por máquina não há série histórica, nem painel, nem detector de flaky. Curado com `--report`, e a restrição que importa é de PROCESSO, não de formato: escreve o PAI (worker concorrente se sobrescreveria), depois da CONTAGEM e antes do VEREDITO (há quatro saídas — relatório que só sai no verde é inútil), e a escrita NÃO pode mudar o rc. Três casos na bancada provam, incluindo a condição de aceite: a flag não altera a contagem."
    trace: '.claude/validation/lint-selftest.sh'

  - id: E_NUMEROS_DO_HARNESS_DIVERGEM_ENTRE_SI
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 4
    confidence: 0.95
    verified_at: '2026-09-08'
    verified_against: 'medido: 1127 casos · 155 famílias · 78 regras; comentários dizem 689, 980, ~850 e 18'
    label: "Os números do próprio harness vivem em COMENTÁRIO e divergem entre si: 689 no workflow, 980 no pre-commit, ~850 numa análise — e a medição de hoje dá 1127. O documento de testes citava 18 regras contra as 78 do registro. Sem gerador e sem catraca, todo número escrito à mão envelhece em semanas. É a mesma classe do painel inventado, um grau abaixo: não é ficção, é defasagem — e as duas enganam igual."
    trace: '.github/workflows/onion-selftest.yml; .githooks/pre-commit'

