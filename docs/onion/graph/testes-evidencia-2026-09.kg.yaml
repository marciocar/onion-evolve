    status: confirmed
    impact: 4
    confidence: 0.95
    verified_at: '2026-09-08'
    verified_against: 'medido: 1127 casos · 155 famílias · 78 regras; comentários dizem 689, 980, ~850 e 18'
    label: "Os números do próprio harness vivem em COMENTÁRIO e divergem entre si: 689 no workflow, 980 no pre-commit, ~850 numa análise — e a medição de hoje dá 1127. O documento de testes citava 18 regras contra as 78 do registro. Sem gerador e sem catraca, todo número escrito à mão envelhece em semanas. É a mesma classe do painel inventado, um grau abaixo: não é ficção, é defasagem — e as duas enganam igual."
    trace: '.github/workflows/onion-selftest.yml; .githooks/pre-commit'

