    label: "A GUARDA GRITAVA CINCO VEZES E NAO PARAVA NADA — e o mecanismo e mais estreito e mais nitido do que o no I_AUSENCIA_LIDA_COMO_RESULTADO registrava. O `_die` vivia no ramo `else` do `_tracked`, e `_tracked` e chamado SEMPRE dentro de `$( )`: `_die` num subshell mata o SUBSHELL, nao o script. Entao a recusa era IMPRESSA e nao PROPAGADA — `grep -c .` devolvia 0, `|| true` engolia o rc, e a SSOT publicava cinco contadores zerados com rc=0, declarando na PROPRIA TABELA o comando `git ls-files` que produziu o zero (visivel para quem le, invisivel para qualquer gate). DUAS CORRECOES AO NO: (a) sao CINCO contadores, nao quatro — exatamente os cinco que delegam ao `git ls-files` (fixtures rastreadas, scripts de validacao, hooks, workflows, baselines); os outros quatro usam `grep` no arquivo e saem CERTOS, o que torna a tabela parcialmente verdadeira e por isso mais convincente; (b) a causa nao e `o fallback para find nunca dispara` — e que a RECUSA NAO ALCANCA o programa de onde e chamada. CURA: pre-condicao verificada UMA VEZ fora de subshell (sem git => rc=2 antes de contar qualquer coisa) MAIS assertiva de contradicao (arquivo em disco + contagem rastreada zero => rc=2, porque zero ali NAO e resultado). Dois casos de bancada, mutante morto. A classe generaliza: `_die`/`exit` dentro de `$( )` e guarda decorativa, e a forma de descobrir foi CONTAR as ocorrencias da mensagem no stderr em vez de ler o codigo."
    trace: '.claude/validation/harness-inventory.sh'
