meta:
  id: inference-contract-audit-2026-07
  schema_version: "1"
  title: "Audit das 8 passadas adversariais do contrato de conformidade de inferência (L1/L2)"
  layer: audit
  baseline: 2026-07-23
  note: >
    Elenxo materializado. Cada passada pôs uma correção (claim "está fechado") e o verify
    a REFUTOU um nível mais fundo — até a Regra de Admissão fechar o regresso. Fecha a perna
    write(KG) que a própria sessão provou faltar (conhecimento nascia em prosa, fora do grafo).
    Doutrina: knowledge-graph-sdaal.md §SSOT-as-runtime · onion-guardrails.md §7 (catraca) / §8.

nodes:
  # ── A raiz e a decisão fundadora ──────────────────────────────────────────
  - id: Q_INFERENCE_GATE
    node_type: question
    plane: DEV
    status: done
    impact: 5
    confidence: 1.0
    label: "como um KG de vida se defende do motor legitimo que o le, sem capar a feature de inferir para o dono?"
    trace: "docs/knowledge-base/concepts/inference-mitigation.md"

  - id: D_CONTRACT_IS_AUTHORITY
    node_type: decision
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    label: "sem impl de referencia no core (INVARIANTE 0), o CONTRATO e a autoridade — logo forma executavel, nunca prosa"
    trace: "docs/knowledge-base/concepts/inference-mitigation.md"
    provenance:
      source: "docs/knowledge-base/concepts/inference-mitigation.md"
      locator: "docs/knowledge-base/concepts/inference-mitigation.md"
      method: "derivado: trace do nó, sem registro de medição"

  # ── A escada de refutacoes (cada nivel REFUTES o anterior 'esta fechado') ──
  - id: C_PAIR_SUFFICIENT
    node_type: claim
    plane: DEV
    status: refuted
    impact: 4
    confidence: 0.2
    label: "P1: o par categoria x proposito basta para o gate de L2"

  - id: C_GRANT_SUFFICIENT
    node_type: claim
    plane: DEV
    status: refuted
    impact: 4
    confidence: 0.2
    label: "P2-3: acrescentar destinatario + concessao duravel fecha a emissao"

  - id: C_SIGNATURE_SUFFICIENT
    node_type: claim
    plane: DEV
    status: refuted
    impact: 4
    confidence: 0.2
    label: "P4-5: exigir assinatura verificada na concessao fecha a forja"

  - id: C_ANCHOR_SUFFICIENT
    node_type: claim
    plane: DEV
    status: refuted
    impact: 4
    confidence: 0.2
    label: "P6-7: proteger a ancora (pubkey) + enumerar pressupostos fecha o regresso"

  - id: C_POLICY_GAP
    node_type: claim
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    label: "P8: a POLITICA (matriz + rotulagem) e a superficie de ESCRITA do motor escaparam 7 passadas — o motor edita a regra e as fixtures ficam verdes por construcao"
    provenance:
      source: ".claude/diary/2026-07-20-admission-rule-blindspot.md · docs/knowledge-base/concepts/inference-mitigation.md@ac259e25"
      locator: ".claude/diary/2026-07-20-admission-rule-blindspot.md:19-20 e :30-33 · docs/knowledge-base/concepts/inference-mitigation.md@ac259e25:111-114 (item (0) superfície de escrita) e :137-142 (POLÍTICA escapou, fixtures verdes por construção)"
      method: "leitura: migalha e KB do contrato no commit ac259e25"

  # ── A evidencia adversarial (as 8 passadas) ───────────────────────────────
  - id: E_VERIFY_RECIPIENT
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    label: "verify P1-P4: o dano e o CRUZAMENTO a terceiro (3,75 dono vs 2,34 terceiros); o par sem destinatario, e o destinatario auto-declarado, deixam o vazamento passar pelo rotulo"

  - id: E_VERIFY_UNPROVEN_MECHANISM
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.95
    label: "verify: MESMA falha de forma a cada rodada — o mecanismo criado para fechar o furo anterior entra ELE PROPRIO sem provar seus pressupostos (destinatario->concessao->assinatura->ancora->revogacao/relogio/via-viva->politica->superficie de escrita); politica so vista na 8a passada"
    narrative: "label anterior: verify P2-P7: MESMA falha de forma cada rodada — o mecanismo criado para fechar o furo anterior entra ELE PROPRIO sem provar seus pressupostos (destinatario->concessao->assinatura->ancora->revogacao/relogio->politica)"
    provenance:
      source: ".claude/diary/2026-07-20-admission-rule-blindspot.md · commit 474b194f (corpo)"
      locator: ".claude/diary/2026-07-20-admission-rule-blindspot.md:17-19 (falha de forma), :23-26 (escada destinatário→…→política→superfície de escrita), :30-33 (política só vista na 8ª) · 474b194f corpo ('always the same failure of FORM, one level deeper each time')"
      method: "leitura: migalha versionada e corpo do commit 474b194f"

  - id: E_VERIFY_BACKGROUND_BLINDSPOT
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.95
    label: "verify P8: a politica escapou 7 passadas porque TODA fixture a usa como DADO — o que e pano de fundo nao e observado"
    trace: "docs/knowledge-base/concepts/inference-mitigation.md:139"
    provenance:
      source: "docs/knowledge-base/concepts/inference-mitigation.md:139"
      locator: "docs/knowledge-base/concepts/inference-mitigation.md:139"
      method: "derivado: trace do nó, sem registro de medição"

  - id: E_VERIFY_APPROVED
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    label: "verify P8: APPROVED — enumeracao de pressupostos fechada (superficie de escrita, politica, chave, revogacao, relogio, lista, canal, origem); mutation test provou severidade load-bearing"

  # ── A tese-nucleo que fecha o regresso ────────────────────────────────────
  - id: D_ADMISSION_RULE
    node_type: decision
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.95
    label: "REGRA DE ADMISSAO: todo mecanismo que fecha um furo entra provando os PROPRIOS pressupostos (chave, lista, canal, relogio, baseline); pressuposto nao enumerado e rodada adversarial futura"
    trace: "docs/knowledge-base/concepts/inference-mitigation.md:104"
    provenance:
      source: "docs/knowledge-base/concepts/inference-mitigation.md:104"
      locator: "docs/knowledge-base/concepts/inference-mitigation.md:104"
      method: "derivado: trace do nó, sem registro de medição"

  - id: D_HONEST_LIMITS
    node_type: decision
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    label: "limites declarados simetricos: L1 fecha so topologia ROTULADA; L2 nao fecha inferencia DENTRO do proposito; ambos por-TURNO (composicao = L3/L6 gated); nao quantifica reducao"
    provenance:
      source: "commit 474b194f (corpo) · docs/knowledge-base/concepts/inference-mitigation.md@474b194f"
      locator: "474b194f corpo §'Honest limits kept explicit and symmetric' · inference-mitigation.md@474b194f:144-148 (escopo por-TURNO; composição = L3/L6 GATED), :165-169 (limite honesto de L1: só o rotulado), :183-186 (limite de L2: não fecha inferência dentro do propósito; não quantifica redução)"
      method: "leitura: corpo do commit 474b194f e a KB do contrato no mesmo commit"

  # ── O artefato e a migalha ────────────────────────────────────────────────
  - id: A_CONTRACT_KB
    node_type: artifact
    plane: PROD
    status: done
    impact: 5
    confidence: 1.0
    verified_at: 2026-07-23
    label: "docs/knowledge-base/concepts/inference-mitigation.md — contrato L1/L2 no origin/main (commit ba6a85b); L3-L6 gated por dogfood do adotante"
    trace: "docs/knowledge-base/concepts/inference-mitigation.md"
    provenance:
      source: "docs/knowledge-base/concepts/inference-mitigation.md"
      locator: "docs/knowledge-base/concepts/inference-mitigation.md"
      method: "derivado: trace do nó, sem registro de medição"

  - id: A_ADMISSION_CRUMB
    node_type: artifact
    plane: PROD
    status: done
    impact: 3
    confidence: 1.0
    verified_at: 2026-07-20
    label: "migalha 2026-07-20-admission-rule-blindspot — a licao de metodo saiu do contrato para o diario, reusavel no proximo contrato"
    trace: ".claude/diary/2026-07-20-admission-rule-blindspot.md"
    provenance:
      source: ".claude/diary/2026-07-20-admission-rule-blindspot.md"
      locator: ".claude/diary/2026-07-20-admission-rule-blindspot.md:34-38 (§Evidence, regra de admissão vive só no contrato) e :10 (next_recommended)"
      method: "leitura: a migalha versionada apontada no trace"

