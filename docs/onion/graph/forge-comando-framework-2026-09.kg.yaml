  - id: C_CONVENCAO_NO_DESTINO_MORRE
    node_type: claim
    plane: DEV
    impact: 5
    confidence: 0.9
    status: confirmed
    verified_at: 2026-09-28
    verified_against: 'sinal de campo primário docs/evolution/inbox/_processed/2026-07-18-deep-research-no-auto-kg-persist.md (nomeia os 3 run ids wwujc53hz, wte2k70qw, wzxz11dvf) + git log -S "write(KG)" em .claude/skills/onion-orchestration/SKILL.md, que datou a convenção em 6456e06a (2026-07-18) + memória datada de 2026-07-23 sobre as 8 passadas de Elenxo'
    label: 'CONVENÇÃO no destino não basta — e a prova é de DEPOIS da convenção existir, não de antes. PROVA PRINCIPAL: as 8 passadas de Elenxo de um audit evaporaram em prosa e só viraram grafo depois, À MÃO, com o passo 7 da skill onion-orchestration JÁ EM VIGOR (memória de 2026-07-23, posterior ao commit 6456e06a que criou o passo em 2026-07-18). Convenção instalada, conhecimento perdido do mesmo jeito. RE-ENQUADRAMENTO EXIGIDO PELA PASSADA ADVERSARIAL de 2026-09-28: as três pesquisas que perderam o write(KG) (run ids wwujc53hz, wte2k70qw, wzxz11dvf) são PRÉ-CONVENÇÃO — o passo 7 nasceu no MESMO DIA do sinal, 2026-07-18, COMO RESPOSTA a elas. Citá-las como prova de que convenção falha era citar a DOENÇA contra a CURA; elas provam que AUSÊNCIA DE MECANISMO falhou, que é claim diferente e mais fraca para este fim. A própria skill é mais precisa do que este nó era (SKILL.md l.106): "advice-que-depende-de-lembrar falhou empiricamente". CONSEQUÊNCIA PARA A FORJA: a peça 5 tem de ser EMITIDA como fase executável, não descrita como convenção — um gerador que só emite scaffolding é create-command com mais passos.'
    trace: 'docs/evolution/inbox/_processed/2026-07-18-deep-research-no-auto-kg-persist.md'
    provenance:
