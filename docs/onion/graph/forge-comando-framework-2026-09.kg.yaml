meta:
  id: forge-comando-framework-2026-09
  schema_version: "1"
  baseline: 2026-09-28
  # A DECISÃO de construir a FORJA de comando-com-framework (`/meta:forge`), pedida pelo maestro em
  # 2026-09-28 a partir da rodada de pesquisa `agent-command-composition-2026-09`.
  #
  # POR QUE GRAFO PRÓPRIO, e não nos dois candidatos óbvios — os dois estão EXATAMENTE no teto que
  # eles mesmos declaram, e "construir a forja" não é cláusula de crescimento de nenhum dos dois:
  #   · `agent-command-composition-2026-09` (27/27, subido nesta mesma leva): só cresce por (a) capital, (b) fracasso
  #     primário, (c) binário medido, (d) micro-ancoragem do Conductor. Decisão de produto derivada
  #     da pesquisa não é nenhuma delas — e grafo de pesquisa registra o que o MUNDO diz, não o que
  #     esta casa resolve construir.
  #   · `fios-abertos` (19/19): "onda nova exige onda COLHIDA" — aquele teto só ENCOLHE.
  # Precedente idêntico, e deliberado: `sinais-de-campo-2026-09` nasceu grafo próprio pela MESMA
  # razão, escrita no meta: dele ("despejar triagem lá seria inflar o backlog para não pensar").
  #
  # O NOME é cunhagem do maestro, 2026-09-28: **`/meta:forge`** — a forja. Registrado como original
  # (autor + data) porque a composição inteira NÃO tem nome de mercado confirmado, que é o achado
  # ancorado da rodada de pesquisa. Não é termo de terceiro adotado; é palavra desta casa.
  #
  # kg-backlog-guard: on
  # ═══ TETO: 7 NÓS = 1 decisão + 3 claims + 1 evidência + 1 objeção sobrevivente + 1 pergunta
  #     HERDADA da rodada de pesquisa (ver Q_DESTINO_DIFERENCIAL_OU_LACUNA: ela veio de
  #     Q_CONTEXT_KUBERNETES_IS_NOT_THE_DESTINATION_ART, cujo grafo está em 27/27 e cujas cláusulas
  #     de crescimento não a cobrem — e ela decide o VALOR da peça 5, então esta é a casa certa).
  #     SÓ CRESCE com: (a) a SEGUNDA instância de comando-com-framework existindo de fato — é ela
  #     que transforma N=1 em padrão, e é a única coisa que autoriza modelar as 7 peças como nós
  #     separados; (b) dogfood da forja contra um adotante real (a face que viaja no plugin);
  #     (c) medição que derrube alguma das 3 claims. NÃO cresce por: desdobrar as 7 peças em 7 nós
  #     antes de existir a 2ª instância (seria petrificar a forma do `/onion-research` como se fosse
  #     a forma do padrão — exatamente o que O_N1_NAO_E_PADRAO proíbe), nem por variante de nome. ═══

nodes:
  - id: D_FORGE_META_COMANDO
    node_type: decision
    drive_kind: decision
    plane: DEV
    impact: 5
    confidence: 0.85
    verified_at: 2026-09-28
    verified_against: 'decisão do maestro por formulário em 2026-09-28, RE-DERIVADA em 2026-09-29 do medidor `forge-census.sh` (57 candidatos rastreados) depois que a passada adversarial mostrou que o censo-à-mão original errava três linhas e que a premissa da lente desguardada era falsa. A decisão de escopo sobrevive e sai mais forte; os números e a justificativa da lente foram corrigidos na EMENDA do label.'
    status: confirmed
    label: "`/meta:forge` — gerador do CONJUNTO COMPLETO de um comando-com-framework (7 peças), com duas faces: wizard no core (entrevista → sugere → monta → roda o gate) e face que viaja no plugin para o adotante. AS 7 PEÇAS, medidas na instância de referência `/onion-research`: (1) superfície invocável fina `.claude/skills/<n>/SKILL.md`; (2) doutrina reutilizável `.claude/commands/common/prompts/<n>-doctrine.md`, referenciada nunca copiada; (3) contexto medido injetado (corpus + hoje + versão do binário) no bloco da SKILL; (4) orquestração faseada `.claude/workflows/<n>.js` (fases, schemas, budget, tiering, `.filter(Boolean)`); (5) DESTINO EM GRAFO — `write(KG)` + `kg-radar` exit 0 + contrato de custo no frontmatter; (6) lente/guarda `.claude/rules/<n>-lens.md` + a REGRA que a cobra no lint; (7) bancada — e no caso de referência são DUAS famílias, não uma: `run_research_workflow_selftests` e `run_research_lens_selftests`. O QUE FICA PARA O MAESTRO SELAR: escopo e ordem (as 7 de uma vez, ou a peça 5 primeiro como invariante e as outras 6 em segunda leva), e se a face do adotante entra nesta onda ou espera a cura de REGRA 74. O NOME não está em aberto — foi dado em 2026-09-28. DECIDIDO 2026-09-28 pelo maestro, com a MEDIÇÃO na mesa — e ela MUDOU a recomendação. ESCOPO: peças 2+3+7 primeiro (doutrina reutilizável, contexto medido injetado, família de bancada), porque são as que NENHUM candidato replica. Censo executado em 6 comandos-com-framework: onion-research 7/7 (referência), kg 4/7, census 4/7, drive 3/7, radar 3/7, realign 3/7 — e as peças 2 e 3 estão ausentes em TODOS os cinco não-referência. A minha recomendação anterior (peça 5 primeiro, como invariante) foi DERRUBADA pela própria medição: 5 de 6 já têm destino em grafo, logo ela replica por doutrina; o que de fato falha nela é o CONTRATO DE CUSTO (4,8% dos runs o registram), alvo de outra leva. FACE: core-only nesta onda (Camada 1, autoria do framework). A face que viaja fica GATED, com gatilho nomeado: a cura da REGRA 74 nos três arquivos acusados MAIS uma medição consumer-side que hoje não existe neste repo. LENTE: ~~junto da forja nasce uma REGRA que valida `.claude/rules/*.md`, hoje DESGUARDADO~~ **[RISCADO 2026-09-29 — ERA FALSO: a REGRA 53 (Regra path-scoped declara `paths:` que casa algo real) já cobria, HARD, desde 2026-08-03. Ver a EMENDA no fim deste label.]** O que vale é o princípio: quem emite artefato guardado emite também a guarda — e MEDE se ela já existe antes de criar outra. EMENDA 2026-09-29, e ela corrige DUAS coisas que este nó afirmava mal. (i) OS NÚMEROS: o censo citado acima foi levantado À MÃO e o medidor `forge-census.sh`, entregue na mesma leva, o contradiz — medido por máquina em 57 candidatos rastreados, a peça 2 existe em UM e a peça 3 em UM, contra 23 (40%) na peça 5; apenas 3 candidatos alcançam 4+ peças e só 1 alcança 6+. A decisão de escopo (2+3+7 primeiro) fica MAIS FORTE, não mais fraca: as peças ausentes não faltam em cinco candidatos, faltam em 56. (ii) A GUARDA DA LENTE: este nó dizia que a lente estava DESGUARDADA e que uma REGRA nova nasceria junto da forja. Era premissa FALSA e não medida — a REGRA 53 (Regra path-scoped declara `paths:` que casa algo real) cobria os três predicados de `paths:` desde 2026-08-03, é HARD, e a regra nova era duplicata SOFT que DISCORDAVA dela. A passada adversarial achou; a cura foi fundir na 53 os dois predicados genuinamente novos (lente RASTREADA e CORPO não-vazio) e matar a duplicata. O maestro decidiu sobre a premissa errada e foi informado."
    trace: "docs/evolution/research/agent-command-composition-2026-09/SYNTHESIS.md · .claude/skills/onion-research/SKILL.md · .claude/workflows/onion-research.js · .claude/commands/common/prompts/research-doctrine.md · .claude/rules/research-lens.md"

