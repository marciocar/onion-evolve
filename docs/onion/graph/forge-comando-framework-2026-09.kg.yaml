  - id: C_FACE_QUE_VIAJA_TEM_MOTOR_CORTADO
    node_type: claim
    plane: PROD
    impact: 4
    confidence: 0.8
    status: confirmed
    verified_at: 2026-09-28
    verified_against: 'lint-artifacts.sh de 2026-09-28 (3 SOFT de plugin-bare-path/ALLOWED-TOOLS + 1 PASSIVO, todos SOFT) + leitura de .claude/utils/adopt/vendor-manifest.sh (_base inclui .claude/utils; _role_cut corta utils/wizard/ SÓ em standalone) + ausência de plugins/onion/utils/wizard/'
    label: 'A face que VIAJA não pode ser cópia da face do core — mas o alvo é a superfície de PLUGIN/INSTALL e o papel `standalone`, NÃO o adotante. CORREÇÃO DA PASSADA ADVERSARIAL de 2026-09-28, que reprovou a versão anterior deste nó: no papel `adopted` o manifesto transporta `.claude/utils` INTEIRO (está em `_base`), e o corte de `.claude/utils/wizard/` existe SÓ no papel `standalone` — logo no adotante o caminho RESOLVE, e usar um achado de plugin para afirmar sobre o adotante confunde INSTALL com ADOPT, distinção que é doutrina desta casa. O QUE DE FATO ESTÁ MEDIDO: a REGRA 74 (Caminho .claude/ NU dentro de plugin só resolve no core, com catraca) acusa TRÊS arquivos empacotados — plugins/onion/skills/onion-wizard/SKILL.md l.8, plugins/onion/skills/onion-onboarding/SKILL.md l.8 e plugins/onion/commands/co-relay.md l.8 — e `plugins/onion/utils/` não contém `wizard/`, então o que falta é o MOTOR ter viajado, não a linha de permissão (que no limite só deixa de pré-aprovar). A CONSEQUÊNCIA "o comando nasce morto no consumidor" é INFERIDA, não medida: a frase é a mensagem do próprio plugin-bare-path-check.sh, e não existe medição consumer-side neste repo. GATILHO para medir: rodar a skill num repo que apenas INSTALOU o plugin, sem adotar.'
