  - id: O_N1_NAO_E_PADRAO
    node_type: claim
    plane: DEV
    impact: 5
    confidence: 0.85
    status: open
    label: "OBJEÇÃO SOBREVIVENTE (a ser absorvida no desenho, não removida): N=1 — uma instância não é padrão. Uma forja derivada só do `/onion-research` petrifica a forma DELE (varredura → verify → síntese) como se fosse a forma de todo comando-com-framework. A cura não é esperar: é a forja ENTREVISTAR a topologia em vez de assumi-la, mantendo a peça 5 como INVARIANTE e as outras 6 como VARIÁVEIS — aí a segunda instância TESTA a forja em vez de ser copiada dela. GATILHO de fechamento: a 2ª instância existir e a forja ter gerado peça que ela NÃO usou (prova de que a forma foi assumida) ou ter faltado peça que ela precisou (prova de que a entrevista é incompleta)"
    trace: "docs/evolution/research/agent-command-composition-2026-09/SYNTHESIS.md (seção NÃO-VERIFICADOS)"

  - id: Q_DESTINO_DIFERENCIAL_OU_LACUNA
    node_type: question
    drive_kind: research
    plane: DEV
    impact: 5
    confidence: 0.5
    status: open
    label: 'HERDADA de Q_CONTEXT_KUBERNETES_IS_NOT_THE_DESTINATION_ART (grafo agent-command-composition-2026-09), cujo VEREDITO foi selado em 2026-09-28 e esta derivada NÃO: se a arte externa cobre ENTREGA GOVERNADA e não cobre DESTINO obrigatório do que se PRODUZ, então o destino-em-grafo com gate determinístico é DIFERENCIAL real do Onion ou LACUNA do campo inteiro (ninguém faz porque não vale a pena)? É a pergunta que decide o VALOR DA PEÇA 5 da forja — e portanto se a forja compra fosso ou só ergue scaffolding. NÃO É RESPONDÍVEL com a base atual: exige as duas lacunas que a rodada declarou e não mediu — evidência de CAPITAL (nenhum worker foi a base de rodada/M&A/valuation, contrariando o invariante de mercado desta casa) e evidência PRIMÁRIA DE FRACASSO (a única fonte tier 7 de fracasso foi refutada na votação). GATILHOS NOMEADOS para fechar, preservados da origem: (a) aparecer paper ou produto com write path governado E critério de aceitação NO DESTINO; (b) o R7 do Context Kubernetes sair de Design para implementado numa v4 do preprint; (c) rodada de investimento ou M&A que mostre dinheiro em orquestração-com-destino em vez de contexto-para-entrega. MÉTODO quando abrir: varredura por TRAJETÓRIA (created:> com sort=stars, HN Algolia, bases de capital), nunca modo primaries — não há documento nomeado a ler.'
    trace: docs/evolution/research/agent-command-composition-2026-09/agent-command-composition-2026-09.kg.yaml

