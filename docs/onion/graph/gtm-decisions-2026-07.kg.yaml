    layer: audit
    plane: DEV
    impact: 5
    confidence: 0.7
    status: confirmed
    label: "REC D6: cindir a pergunta. MENSAGEM/posicionamento = P4 (único whitespace confirmado), MAS sem prometer L1-L6 gated (só workflows faseados + auditabilidade estrutural, que já existem). PIPELINE/1ª receita = P3 (mais líquido, ciclo curto). P5 descartado como primário (D7 já decidiu = MOAT). P6 fora (pré-req branding)"
  - id: C_D1_rec
    node_type: claim
    layer: audit
    plane: DEV
    impact: 4
    confidence: 0.7
    status: confirmed
    label: "REC D1: RATIFICAR A (camadas) — deixa de ser hipótese; o que falta fechar é o GATILHO de abrir, não o modelo. C (SaaS control-plane) = HORIZONTE pós-D2, não escolha imediata (colide com identidade sem-infra). B (licença) contraria guardrail anti-relicenciamento. D (consultoria-only) = não-decidir disfarçado"
  - id: C_D5_rec
