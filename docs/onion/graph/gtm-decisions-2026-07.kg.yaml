    plane: DEV
    impact: 5
    confidence: 0.7
    status: done
    label: "D1 — postura comercial: A (camadas/mini-funil+captura adjacente) vs B (licença restritiva) vs C (SaaS control-plane) vs D (consultoria-only). Decisão-mãe do eixo receita; trava D4/D5, pré-req de D6"
