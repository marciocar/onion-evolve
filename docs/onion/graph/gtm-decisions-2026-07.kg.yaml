# KG SDAAL — DECISÕES GTM do Onion (D6→D1/D5/D3): o mapa do ACOPLAMENTO comercial decision-ready.
# D6 (comprador-alvo) é a decisão-RAIZ: calibra vocabulário/risco de D1 (postura), D5 (preço), D3 (consumer/mentoria).
# Convenção: D_<id> = decision (status:open, a pergunta em aberto); C_<id>_rec = claim (a recomendação do analista,
# SUPPORTS a decisão); E_<slug> = evidence (mercado/interno, SUPPORTS/REFUTES, url/trace no label); Q_<slug> = question
# (o que falta instrumentar). Acoplamento = arestas DEPENDS_ON. Quem decide é o maestro — todo D_ fica open.
# Brief-irmão: docs/business-context/gtm-decision-brief-2026-07.md. Camada audit (meta/estratégico).
meta:
  id: gtm-decisions-2026-07
  schema_version: "1"
  date: 2026-07-25
nodes:
  # ---- DECISÕES (decision, status:open) ----
  - id: D_D6
    node_type: decision
    trace: docs/business-context/decisions.md
    layer: audit
    plane: DEV
    impact: 5
    confidence: 0.75
    status: done
    label: "D6 — comprador-alvo primário: P3 (empresa/sistemas internos) vs P4 (regulado/enterprise) vs P5 (dev solo) vs P6 (leigo). RAIZ: calibra D1/D5/D3. Recomenda-se cindir em MENSAGEM (P4, whitespace) vs PIPELINE (P3, mais líquido)"
