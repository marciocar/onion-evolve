    trace: docs/business-context/decisions.md
    layer: audit
    plane: DEV
    impact: 4
    confidence: 0.65
    status: done
    verified_at: 2026-08-30
    verified_against: "censo lote 1 (run wf_87c4a44e-0ff, 2026-08-30): O nó trata D5 como decisão ABERTA entre 4 opções (A escada/B adiar/C bundle/D segmentado) com apenas uma diretriz de piso de preço. O vivo (mesmo trace file, PR #480 de 2026-07-29,"
    label: "D5 — preço por camada (treino→certificação→compliance-pack→curadoria SOTA): A (escada por comparáveis) vs B (adiar/sob-consulta) vs C (bundle único) vs D (segmentado por comprador). Diretriz: ticket premium ($129+) > pipoca ($5-10)"
  - id: D_D3
    node_type: decision
    trace: docs/business-context/decisions.md
    layer: audit
    plane: DEV
    impact: 4
    confidence: 0.6
    status: done
    label: "D3 — perseguir linha consumer (Company Brain N=1 / Onion Pessoal) + mentoria como pilar GTM? A (comprometer já) vs B (gated) vs C (desacoplar mentoria do app) vs D (spin-off de marca)"
  - id: D_D2_activation
    node_type: decision
    trace: docs/business-context/decisions.md
    layer: audit
    plane: DEV
    impact: 5
    confidence: 0.5
    status: open
    verified_at: 2026-08-30
    verified_against: "censo lote 3: worker CONFIRMED e juiz opus/high APROVOU (run wf_5f6d1c0f-ecd)"
    label: "D2-ATIVAÇÃO — ligar o flywheel de moeda-dado (SSOT 6 camadas L1-L6 de mitigação de inferência, dogfoodado). Direção RATIFICADA (local-first+destilado); ativação `gated`. Gate: declarado≠verificado — não vender garantia não-construída"

