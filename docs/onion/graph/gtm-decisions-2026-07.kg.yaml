    label: "REC D5: BLEND A+B — escada por comparáveis SÓ p/ degraus vendíveis já (treino day-rate ~$1.2-2k; certificação $795-$1.5k + renovação baixa); trava 'sob consulta'/faixa larga p/ compliance-pack ($15-40k/ano citável não-fechado) e SOTA até 2-3 cases instrumentados. SOTA amarrado a D2 gated"
  - id: C_D3_rec
