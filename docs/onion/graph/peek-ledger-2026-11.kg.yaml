    narrative: "Dúvida: a proposta na caixa do core pede, em cada ferramenta, identidade de app onde a plataforma oferece e usuário de serviço onde não, nunca a credencial pessoal. Classificação: porta de mão dupla (o padrão pode trocar depois), severidade 4 (credencial), incerteza média: a tabela dá nível 1. Achado (DADO de comunidade, não confiável: conteúdo de terceiro orienta, não prova): um Show HN de 2026-11-06 de um projeto de incubadora corporativa, 'Agentic Identity Broker, OAuth Delegation for AI Agents' (25 pontos, 4 comentários), em que a comunidade pergunta 'por que delegação OAuth não basta', 'como trata casos transitivos' e 'a aprovação é por ferramenta ou presa à chamada exata; e o agente sem ninguém para aprovar?'. Outros títulos do período: 'Design Tenets for Agent Identity Management Systems' (2026-11-04), 'Arken, identidade criptográfica para agentes que chamam MCP' (2026-11-02), 'Agent identity is a really hard problem' (2026-10-15). No GitHub, uma issue de 2026-11-13 de uma ferramenta de BI com servidor MCP: o login OAuth do app desktop falha quando a opção agent-identity está ligada, sinal de que fornecedores já expõem a identidade do agente como opção. Efeito na dúvida: acrescenta uma terceira opção (delegação com corretor) e uma pergunta que a proposta não faz (granularidade da aprovação, por ferramenta ou por chamada), que é a mesma da proposta irmã do agente agir com o privilégio do solicitante. A decisão é da triagem da proposta, então o desfecho fica pending. Custo: 4 chamadas, mais 8 de ajuste do próprio executor antes desta (o filtro por título no HN e no GitHub nasceu delas: sem ele, três palavras devolveram 225.476 resultados no GitHub)."
