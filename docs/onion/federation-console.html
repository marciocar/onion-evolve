<!doctype html><html lang=pt-BR><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>Console da Federação Onion</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--card:#f6f8fa;--src:#1f6feb;--hub:#238636;--sa:#8957e5}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--card:#161b22}}
:root[data-theme=dark]{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--card:#161b22}
:root[data-theme=light]{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--card:#f6f8fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);
border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer}.chip.on{background:var(--src);color:#fff;border-color:var(--src)}
h2{font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px;margin:28px 0 12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;background:var(--card)}
.card h3{margin:0 0 4px;font-size:15px}.badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;color:#fff;margin-right:5px}
.t-source{background:var(--src)}.t-hub{background:var(--hub)}.t-standalone{background:var(--sa)}.t-member{background:var(--mut)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px;color:var(--mut);margin:2px 4px 2px 0}
.meta{color:var(--mut);font-size:12px}.tl{border-left:2px solid var(--line);padding-left:14px}
.ev{margin:0 0 12px}.ev .d{color:var(--mut);font-size:12px}.ev .s{font-size:14px}.hidden{display:none}
.bk{background:#cf222e}.co{background:var(--hub)}a{color:var(--src)}
</style></head><body><div class=wrap>
<h1>🧅 Console da Federação Onion</h1>
<p class=sub>Projeção read-only do SSOT (<code>members.yaml</code> + <code>CHANGELOG</code>) — GERADO, não editar à mão.
Mapa visual: <a href="federation-map.md">federation-map.md</a>.</p>
<div class=filters id=filters></div>
<h2>Membros <span class=meta id=mcount></span></h2><div id=members></div>
<h2>Comunicações (histórico) <span class=meta id=tcount></span></h2><div class=tl id=timeline></div>
</div><script>
const D={"members": [{"corrects": [], "id": "onion-evolve", "mode": "", "name": "onion-evolve", "parent": "", "pin": "", "specializations": ["framework-template", "sdaal", "co-evolution", "dogfooding", "breadcrumbs"], "tier": "source"}, {"corrects": [], "id": "metagamify", "mode": "legacy", "name": "MetaGamify", "parent": "onion-evolve", "pin": "8e22352da32f", "specializations": ["gamification", "nx-monorepo", "asana-integration", "metagamification"], "tier": "hub"}, {"corrects": [], "id": "pulse-mais", "mode": "greenfield", "name": "pulse-mais", "parent": "onion-evolve", "pin": "c711baa17617", "specializations": ["education", "srl-plea", "learning-materials"], "tier": "standalone"}, {"corrects": ["onion-evolve"], "id": "granaai", "mode": "regulated", "name": "granaai", "parent": "onion-evolve", "pin": "4332ac8d1884", "specializations": ["regulated-fintech", "canonicalization", "ssot-governance"], "tier": "standalone"}, {"corrects": [], "id": "onion-mini", "mode": "distilled", "name": "onion-mini", "parent": "onion-evolve", "pin": "n/a", "specializations": ["distilled-methodology", "entry-level", "multi-platform", "task-management-lite", "plea-cycles"], "tier": "standalone"}], "timeline": [{"alvo": "todos", "compat": "COMPATÍVEL", "date": "2026-07-10", "subject": "Convenção de worktrees codificada: `~/worktrees/<repo>/<branch-slug>` (crédito: metagamify)"}, {"alvo": "todos", "compat": "COMPATÍVEL", "date": "2026-07-10", "subject": "Fix importante pós-update: lint de marketplace não bloqueia mais o consumidor + stamp determinístico"}, {"alvo": "todos", "compat": "COMPATÍVEL", "date": "2026-07-10", "subject": "KG-SDAAL ganha camada de DOMÍNIO + modo `map` + console visual"}, {"alvo": "todos", "compat": "COMPATÍVEL", "date": "2026-07-10", "subject": "a2a-live: F2.2 COMPLETO — canal vivo aberto a remetentes (incl. regulados) + guarda clock-trust"}, {"alvo": "todos", "compat": "COMPATÍVEL", "date": "2026-07-10", "subject": "2 KBs novas + RFC-0005 §4.1 (\"forma de adoção\" nomeada)"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-07-04", "subject": "Fix de contrato: conversão SVG é do orquestrador, não do mermaid-specialist"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-07-04", "subject": "Shed-ceremony: presentation-orchestrator e gamma-api-specialist enxutos; conhecimento em 2 KBs novas"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-07-04", "subject": "REGRA 23 no lint: model: em comandos e category: em agentes obrigatórios (HARD)"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-07-04", "subject": "REGRA 22 no lint: links relativos de docs/evolution/ guardados (drift de git mv → _processed)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-04", "subject": "`/meta:kg` NASCEU (F2 executado): core dogfoodou o KG na rodada /meta:evolve — comando + radar soberano disponíveis"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-04", "subject": "D3 recebido e CONFIRMADO: 1º dogfood do KG na federação — gate F1 da vertical de investigação disparou"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-03", "subject": "Sinal ACEITO com parecer: duas linhagens — reunificar a IDENTIDADE primeiro; conteúdo reconcilia via KG (seu convite ao 1º dogfood)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-03", "subject": "Sinal ACEITO: secret-handling vira KB do core — agente nunca pede/aceita segredo em texto claro"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-02", "subject": "Sinal ACEITO: verify-the-read-path-first promovido a padrão do core (ai-strategy + disciplina de frota)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-02", "subject": "CORREÇÃO: o anúncio \"você JÁ tem o fix --only\" estava ERRADO — seu pin era forjado; guard pin-integrity criado"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-02", "subject": "Sinal ACEITO PARA AVALIAÇÃO: Knowledge Graph SDAAL vira KB CANDIDATA no core; /meta:kg gated até 1º dogfood"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-02", "subject": "Eixo E (topologias de sessão W1-W7) + responder-gated + gatilho de reflexão ⏰"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-02", "subject": "RFC-0003 ACEITA — identidade federada, tiers e trust agora são doutrina (você é T1 hub)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-01", "subject": "Sinal RESOLVIDO: lint-selftest O(fixtures × repo) — escopo-de-arquivo `--only` (você JÁ tem o fix)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-07-01", "subject": "Veredito: \"object-led discovery & fitting\" vira playbook do catálogo (não skill/comando novo)"}, {"alvo": "metagamify", "compat": "BREAKING", "date": "2026-06-28", "subject": "BREAKING: skill `onion-fleet`→`onion-orchestration` + `/meta:fleet`→`/meta:orchestrate` (migração de vocabulário)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-28", "subject": "Sinal RESOLVIDO: lint-selftest.sh robusto a adotante (não aborta mais sem plugins/)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-27", "subject": "S1 RESOLVIDO: padrão \"toolbox\" = régua P0-P3 + coesão dos create-* (ciclo ASSESS→TRIAL→ADOPT fechado)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-27", "subject": "S2 resolvido: /meta:co-relay (transporte upstream entrega-sem-commit) + S1 toolbox triado"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-24", "subject": "Digest de sessão: re-sync recomendado (catálogo #9) + roadmap dos 2 follow-ups gated"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-24", "subject": "#9 MATERIALIZADO: catálogo de playbooks em `onion-patterns` (5 recognition-primed)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-24", "subject": "Veredito: \"laço-sem-guarda\" = playbook candidato (core) + guardas específicas (local) — reforça #9"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-24", "subject": "Veredito: branching = base resolvida (agnóstica), NÃO trunk-default — instância do \"adota não impõe\""}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-23", "subject": "Veredito: evidência de campo p/ materialização do catálogo (RFC-0002) — de-deferir #9, forma confirmada"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-22", "subject": "`/meta:adopt` provisiona proteção de formatador nativamente (`.prettierignore` never-clobber) — backlog #7 ENTREGUE"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-22", "subject": "Delta `06f7232` (anúncio retroativo) + proteção de vendor contra formatador no `/meta:adopt`"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-22", "subject": "RFC-0002 — veredito da camada de meta-estratégia (catálogo-first + reposicionamento)"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-06-22", "subject": "`/meta:co-announce` — anúncio flow A vira passo de ritual (não mais memória humana)"}, {"alvo": "metagamify (informativo p/ demais)", "compat": "COMPATÍVEL", "date": "2026-06-22", "subject": "Veredito: diretriz de retenção do *decision-snapshot* é candidata de framework (impl é local)"}, {"alvo": "metagamify", "compat": "COMPATÍVEL", "date": "2026-06-22", "subject": "Confirmação de protocolo: o core trata o adotante como **cego** (anúncio explícito obrigatório)"}, {"alvo": "nenhum (informativo, sem ação)", "compat": "COMPATÍVEL", "date": "2026-06-21", "subject": "Decisão: **não adotar** roteamento dinâmico de tier em runtime (sinal HeyClicky)"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-06-20", "subject": "Fluxo A com canal próprio (`inbound/`) + \"you have mail\" bidirecional + relatório de update auto-emitido"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-06-19", "subject": "`/meta:adopt --integration-branch` + base do PR resolvida do `.onion-version` (#104)"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-06-18", "subject": "warm-up aponta para o inbox de co-evolução + `/meta:co-evolve` (#102)"}, {"alvo": "adotantes", "compat": "COMPATÍVEL", "date": "2026-06-18", "subject": "`/meta:adopt --update` idempotente + Procedimento de Configuração pós-cópia (#99)"}, {"alvo": "todos", "compat": "COMPATÍVEL", "date": "2026-06-18", "subject": "Bootstrap do canal de co-evolução"}, {"alvo": "futuros adotantes", "compat": "COMPATÍVEL", "date": "2026-06-17", "subject": "fix `/meta:adopt` never-clobber `.env.example` (#89)"}]};
const tierClass=t=>'t-'+(['source','hub','standalone'].includes(t)?t:'member');
let filter=null;
const facets=()=>{const s=new Set();D.members.forEach(m=>{s.add('tier:'+m.tier);if(m.mode)s.add('mode:'+m.mode);(m.specializations||[]).forEach(x=>s.add('spec:'+x))});return[...s].sort()};
function match(m){if(!filter)return true;const[k,v]=filter.split(/:(.*)/);
 if(k==='tier')return m.tier===v;if(k==='mode')return m.mode===v;if(k==='spec')return (m.specializations||[]).includes(v);return true}
function render(){
 const fl=document.getElementById('filters');fl.innerHTML='';
 const all=document.createElement('span');all.className='chip'+(filter?'':' on');all.textContent='todos';all.onclick=()=>{filter=null;render()};fl.appendChild(all);
 facets().forEach(f=>{const c=document.createElement('span');c.className='chip'+(filter===f?' on':'');c.textContent=f;c.onclick=()=>{filter=(filter===f?null:f);render()};fl.appendChild(c)});
 const mv=D.members.filter(match);document.getElementById('mcount').textContent='('+mv.length+'/'+D.members.length+')';
 document.getElementById('members').innerHTML=mv.map(m=>`<div class=card><h3><span class="badge ${tierClass(m.tier)}">${m.tier}</span>${m.id}</h3>
  <div class=meta>${m.name||''}${m.mode?' · '+m.mode:''}${m.parent?' · ↑ '+m.parent:''}${m.pin?' · <code>'+m.pin+'</code>':''}${m.corrects.length?' · pode-corrigir → '+m.corrects.join(', '):''}</div>
  <div>${(m.specializations||[]).map(s=>'<span class=tag>'+s+'</span>').join('')}</div></div>`).join('')||'<p class=meta>(nenhum membro casa o filtro)</p>';
 // timeline: se filtro tier/mode/spec, destaca eventos cujo alvo casa algum membro visível (ou 'todos'/'adotantes')
 const vis=new Set(mv.map(m=>m.id));
 const evVisible=e=>{if(!filter)return true;const a=(e.alvo||'').toLowerCase();if(a.startsWith('todos')||a.startsWith('adotante'))return true;return[...vis].some(id=>a.includes(id))};
 const tv=D.timeline.filter(evVisible);document.getElementById('tcount').textContent='('+tv.length+'/'+D.timeline.length+')';
 document.getElementById('timeline').innerHTML=tv.map(e=>`<div class=ev><div class=d>${e.date}${e.compat?' · <span class="badge '+(e.compat==='BREAKING'?'bk':'co')+'">'+e.compat+'</span>':''}${e.alvo?' · alvo: '+e.alvo:''}</div><div class=s>${e.subject}</div></div>`).join('')||'<p class=meta>(sem comunicações p/ este filtro)</p>';
}
render();
</script></body></html>
