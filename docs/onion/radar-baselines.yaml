    cc_version: "2.1.288"   # versão do Claude Code na rodada (processo E disco) — instalada ≠ esta ⇒ SOFT "estratégia pode ter drift"
    descartes: "5/6 no juiz + a isenção de escopo reprovada"   # rodada 6 (2.1.278->2.1.288, NOVE versoes, 990 itens):
                            # 1 aprovado, 5 REPROVADOS, 1 lacuna genuina (a 2.1.279 nao existe na fonte).
                            # A 1a passada mediu DUAS versoes e declarou as outras SEIS cobertas pelo corpus; o juiz
                            # reprovou a isencao ESTRUTURALMENTE, colhendo um item da 2.1.286 de dentro da janela
                            # que eu dizia selada. A TERCEIRA MORADA DA FABRICACAO e a ATRIBUICAO DE VERSAO:
                            # 4 dos 5 reprovados tinham o texto CERTO na versao ERRADA (r4=fonte externa,
                            # r5=medicao do repo, r6=atribuicao). E o CORPUS virou instrumento de ISENCAO —
                            # li `id`+`tier=9` de tres nos sem ler `impact: 2` / `confidence: 0.4`; CURADO na
                            # leva: `kg-corpus-grep` agora imprime imp= e conf=. Instrumento REPROVADO para
