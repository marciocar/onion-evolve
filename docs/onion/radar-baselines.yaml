                            # "October 1"). Metodo certo: ancora id="2-1-NNN" no HTML cru, blocos guardados em data/.
                            # ACHADO DE MAIOR CONSEQUENCIA: a 2.1.280 traz `claude-opus-5-5` como Opus DEFAULT e
