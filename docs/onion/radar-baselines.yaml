                            # o default da plataforma. Flip PROPOSTO ao maestro (o numero vem do eixo E6, nao daqui).
    kg: docs/evolution/research/radar-E3-2026-10-03-r6/radar-E3-2026-10-03-r6.kg.yaml
  - id: E4-capital
