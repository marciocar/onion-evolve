# Roster de FONTES por eixo e cadência — a doutrina de escolha de fontes como DADO (F2 do plano
# meta-research-lens-2026-09; a pesquisa mediu que o core não tinha nenhuma). Lido pelo workflow
# onion-research (eixos fixos) e, em F4, pela REGRA 65 (fonte do roster sem `last_checked` dentro
# da cadência = SOFT). Cada fonte carrega o tier DEFAULT (escala DREAM 1-10) — o nó de evidência
# pode rebaixar/subir por artigo; `vendor-on-competitor` é sempre suspeito por desenho.
# Cadências (justificadas com datas em data/ext-sota…): semanal · mensal · trimestral · anual.
# Presença do arquivo = opt-in (superfície do CORE); o adotante sem ele usa só os eixos fixos genéricos.
axes:
  - id: claude-code-atual
    cadence: weekly
    sources:
      - { url: "https://code.claude.com/docs/en/changelog", kind: primary, tier: 10, note: "changelog oficial — gatilho de re-medição de estratégia (REGRA 65)" }
      - { url: "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md", kind: primary, tier: 10 }
      - { url: "https://www.anthropic.com/engineering", kind: engineer, tier: 9, note: "posts de engenharia (harness design, auto mode, multi-agent)" }
      - { url: "https://code.claude.com/docs/llms.txt", kind: primary, tier: 10, note: "índice da doc — descobrir páginas antes de explorar" }
  - id: mercado-capital
    cadence: weekly
    sources:
      - { url: "https://techcrunch.com/tag/artificial-intelligence/", kind: aggregator, tier: 6, note: "filtrar por M&A/rodadas de 'AI coding'" }
      - { url: "https://www.cnbc.com/technology/", kind: aggregator, tier: 6 }
      - { url: "https://cursor.com/blog", kind: primary, tier: 8, note: "fonte primária do maior deal do ano (SpaceX, 2026-08)" }
      - { url: "https://www.ycombinator.com/rfs", kind: analyst, tier: 8, cadence: monthly }
      - { url: "https://nathanbenaich.substack.com/archive", kind: analyst, tier: 7, cadence: monthly, note: "State of AI newsletter" }
      - { url: "https://a16z.com/", kind: analyst, tier: 7, cadence: monthly, note: "Big Ideas / Notes on AI apps — interesse próprio: investidor" }
  - id: analistas
    cadence: quarterly
    sources:
      - { url: "https://www.thoughtworks.com/radar", kind: analyst, tier: 9, note: "2 volumes/ano (abril, novembro) — maior densidade por palavra medida em 2026-09" }
      - { url: "https://www.gartner.com/en/research/methodologies/gartner-hype-cycle", kind: analyst, tier: 8, note: "gartner.com devolve 403 — números chegam via terceiro; marcar aggregator quando for o caso" }
      - { url: "https://menlovc.com/perspective/", kind: analyst, tier: 7, note: "State of GenAI in the Enterprise" }
      - { url: "https://www.forrester.com/blogs/", kind: analyst, tier: 8, cadence: yearly, note: "Predictions saem em outubro" }
      - { url: "https://survey.stackoverflow.co/", kind: primary, tier: 9, cadence: yearly }
      - { url: "https://www.stateof.ai/", kind: analyst, tier: 8, cadence: yearly }
  - id: repos-trajetoria
    cadence: weekly
    sources:
      - { url: "https://api.github.com/search/repositories?q=<tema>+created:>AAAA-MM-DD&sort=stars&order=desc", kind: primary, tier: 8, note: "search-by-trajectory — nunca por nome; estrelas sem controle de inflação (tier 8, não 10)" }
      - { url: "https://hn.algolia.com/api/v1/search_by_date?query=<tema>&tags=story", kind: forum, tier: 5, note: "sinal de trajetória; corrobora, não decide" }
  - id: comunidade
    cadence: weekly
    sources:
      - { url: "https://news.ycombinator.com/", kind: forum, tier: 4 }
      - { url: "https://www.reddit.com/r/ClaudeAI/", kind: forum, tier: 3, note: "frequentemente inalcançável (medido 2026-09): lacuna declarada, não finding" }
      - { url: "https://github.com/anthropics/claude-code/issues", kind: forum, tier: 6, note: "dor real de uso; tier acima de fórum genérico porque é o tracker oficial" }
  - id: literatura
    cadence: quarterly
    sources:
      - { url: "https://arxiv.org/list/cs.AI/recent", kind: paper, tier: 8, note: "buscar por termo: temporal knowledge graph, memory conflict, deep research agent, source credibility" }
      - { url: "https://research.perplexity.ai/", kind: engineer, tier: 8, note: "WANDR, Search-as-Code — fornecedor sobre si mesmo (não sobre concorrente)" }
      - { url: "https://www.microsoft.com/en-us/research/blog/", kind: engineer, tier: 8, note: "GraphRAG / LazyGraphRAG" }
  - id: busca-agentica
    cadence: monthly
    sources:
      - { url: "https://exa.ai/", kind: vendor-on-competitor, tier: 3, note: "todo comparativo de busca lido em 2026-09 era de concorrente direto — sempre suspeito" }
      - { url: "https://firecrawl.dev/blog", kind: vendor-on-competitor, tier: 3 }
      - { url: "https://parallel.ai/articles", kind: vendor-on-competitor, tier: 3 }
  # Grupo do eixo E7-treino-inferencia do radar (aberto em 2026-10-26, sem rodada). É GRUPO NOVO, e não
  # anotação num grupo existente, pela medida: nenhum dos sete grupos acima tem fonte de treino,
  # fine-tuning, pesos abertos ou custo de inferência (os mais próximos, mercado-capital e analistas,
  # cobrem dinheiro e adoção). Fontes vindas do estudo da curadoria (ai-front-2026-10): só a página da
  # OpenAI foi aberta de novo aqui; as outras chegaram por resumo de busca lá e ficam sem last_checked.
  - id: treino-inferencia
    cadence: monthly
    sources:
      - { url: "https://developers.openai.com/api/docs/deprecations", kind: primary, tier: 10, last_checked: "2026-10-27", note: "descontinuações e o fim do fine-tuning self-serve (2026-05-07, 2026-07-02, 2027-01-06); relida na 1ª rodada do E7 (2026-10-27), os três degraus verbatim" }
      - { url: "https://hai.stanford.edu/ai-index/2026-ai-index-report", kind: analyst, tier: 9, cadence: yearly, note: "AI Index de Stanford: anual; a página não traz custo de treino nem de fine-tuning" }
      - { url: "https://epoch.ai/topics/finances", kind: analyst, tier: 8, note: "custo de treino e de compute; lido só por resumo de busca" }
      - { url: "https://www.interconnects.ai/", kind: engineer, tier: 8, cadence: weekly, note: "pós-treino e modelos de pesos abertos (o autor lidera pós-treino no Ai2); de 1 a 3 posts por semana" }
      - { url: "https://www.latent.space/", kind: engineer, tier: 7, cadence: weekly, note: "parte paga; The End of Finetuning (2026-05-13) só pelo trecho aberto" }
      # Ancoradas pela 1ª rodada do E7 (2026-10-27, modo primárias; insumo da curadoria em
      # docs/evolution/inbox/_processed/2026-10-27-signal-e7-sources.md). O tier é o que o juiz deu ao nó,
      # não o proposto pela curadoria. As fontes que a curadoria recusou não entram.
      - { url: "https://ai.google.dev/gemini-api/docs/model-tuning", kind: primary, tier: 9, last_checked: "2026-10-27", note: "Gemini API e AI Studio sem modelo ajustável desde 2025-05; o ajuste segue na Gemini Enterprise Agent Platform (fechou uma superfície, não o ajuste)" }
      - { url: "https://ai.google.dev/gemini-api/docs/pricing", kind: primary, tier: 9, last_checked: "2026-10-27", note: "preço do nível pago; o Gemini 4 Argon dobra entrada e saída em 2026-12-01" }
      - { url: "https://docs.mistral.ai/capabilities/finetuning/", kind: primary, tier: 9, last_checked: "2026-10-27", note: "API de ajuste marcada deprecated, sem data na página; o preço de US$4 por job e US$2/mês é resíduo, não custo vigente" }
      - { url: "https://mistral.ai/news/mistral-large-4/", kind: primary, tier: 9, last_checked: "2026-10-27", note: "anúncio de 2026-10-06; pesos prometidos para o fim de 2026-10, sem licença nomeada; reler depois do prazo" }
      - { url: "https://aws.amazon.com/about-aws/whats-new/2026/02/amazon-bedrock-reinforcement-fine-tuning-openai/", kind: primary, tier: 9, last_checked: "2026-10-27", note: "RFT (ajuste por reforço) do Bedrock aberto a pesos abertos em 2026-02-17; estado do lançamento, o catálogo atual não foi re-medido" }
      - { url: "https://www.together.ai/pricing", kind: primary, tier: 6, last_checked: "2026-10-27", note: "ajuste e inferência de pesos abertos; página sem data e sem o método (LoRA ou completo) por tabela de ajuste" }
      - { url: "https://fireworks.ai/pricing", kind: primary, tier: 9, last_checked: "2026-10-27", note: "ajuste por faixa de tamanho e método (LoRA/Full, SFT/DPO); página sem data" }
      - { url: "https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-BF16", kind: primary, tier: 9, last_checked: "2026-10-27", note: "pesos abertos da NVIDIA, 74B com 9B ativos, no HF em 2026-10-15; benchmarks são declaração do fornecedor" }
      - { url: "https://arxiv.org/abs/2602.20164", kind: paper, tier: 7, last_checked: "2026-10-27", note: "destilação de 8B a 622 horas de H100; o 2.000x é custo marginal (sem o professor nem o pré-treino); pré-publicação de autores da indústria" }
  # Grupo de PADRÕES E ECOSSISTEMA ABERTO DE AGENTES (aberto em 2026-10-27). É GRUPO NOVO pela medida: nenhum
  # dos oito acima cobre padrão de protocolo de agentes nem a fundação que os hospeda (claude-code-atual é só
  # o produto da Anthropic; mercado-capital e analistas cobrem dinheiro e parecer; literatura é paper).
  # Diretriz do maestro (2026-10-27, selo de Q_AAIF_G4_SUPERSEDE_PROPOSAL_1027 no grafo
  # a2a-empresa-adotante-2026-10): aaif.io é fonte constante de consulta, validação e avaliação dos
  # projetos, documentos e recomendações do Onion; não reinventar a roda, o novo parte do conhecido.
  - id: padroes-agentes
    cadence: monthly
    sources:
      - { url: "https://aaif.io", kind: primary, tier: 9, last_checked: "2026-10-27", note: "Agentic AI Foundation (Linux Foundation), casa neutra do MCP e do A2A; diretriz do maestro de 2026-10-27: consultar antes de propor padrão próprio" }
      - { url: "https://aaif.io/blog", kind: primary, tier: 9, last_checked: "2026-10-27", note: "anúncios de projeto hospedado (o A2A entrou em 2026-08-17); diretriz do maestro de 2026-10-27" }
