  # vendor .claude/), SEM meta-factory nem memória privada. Doutrina que circula anonimizada na raiz (PR #438).
  # PÚBLICA desde 2026-07-19 — o flip FOI FEITO e está verificado ao vivo (ver `remote:` abaixo).
  # Corrigido 2026-08-05: este comentário ainda dizia "Nasce PRIVADA; o flip é gate do maestro",
  # contradizendo a própria linha `remote:` do mesmo bloco — declarado≠verificado dentro do registro.
