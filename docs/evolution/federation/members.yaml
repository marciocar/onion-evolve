    name: granaai (Grana.Ai — CONFIDENCIAL, ver onion-adr-granaai-consolidation-2026-07.md)
    role: standalone            # TIER 3 — adota o core direto; NÃO confundir com "origem" (ver ADR — é consolidação, não origem)
    parent: onion-evolve
    remote: github.com/GranaAi/granaai   # PRIVADO — não citar em superfície pública
    local_path: null            # sem clone local nesta máquina; registro via investigação read-only (gh api)
    onion_version: 4332ac8d1884   # source_commit no branch onion/adopt — DECLARADO pelo stamp deles, NÃO verificado byte-a-byte (sem clone local)
    adopted_at: 2026-07-01
    mode: regulated              # detectado corretamente pelo /meta:adopt deles — domínio fintech
    integration_branch: develop  # confirmado — ambiente regulado exige controle deliberado de QUANDO puxar updates (nunca live-pull automático)
    reconciliation_status: confirmed_pending_execution   # Fase 0 CONFIRMADA 2026-07-06: maestro decidiu levar onion/adopt+onion/granaai-ssot adiante ("vamos refinar juntos"). Mauricio Matos é o responsável por revisar/mergear no develop real do time. Fase 3 (cherry-pick dos 13 commits, zero conflito verificado) aguarda só o sinal de execução — não mais alinhamento humano.
    reviewer: "Mauricio Matos <mauricio.matos@grana.ai> — responsável por revisar/mergear no develop"
    personality_summary: "Onde o Onion se consolidou como potência real (não a origem) — 3 dimensões peer provadas juntas em produção regulada (fintech). Convite de Marcio Carvalho (CTO Grana.Ai, criador do Onion) a Mauricio Matos, 2026-07-01: adoção completa + canonicalização SSOT (9 ADRs, 8 RFTs, grafo do ecossistema, 24/25 CURRENT). Achado notável: bug real de lint (graceful-skip sem jq) descoberto e corrigido lá E no core, mesmo dia, 7h41 de diferença, zero comunicação — descoberta convergente independente. NÃO tem role:source próprio (doutrina fonte≠derivação: uma só fonte) — o .claude/ vendorizado já É 'o core deles' no dia a dia; trust elevado (não role elevado) reconhece o rigor comprovado."
    specializations: [regulated-fintech, canonicalization, ssot-governance]
    personality_last_sync: 2026-07-06   # seed manual — investigação read-only, não sessão adotante
    trust:
      can_receive_from: [onion-evolve]
      can_advise_to: [onion-evolve]
      can_correct_to: [onion-evolve]   # elevado 2026-07-06: rigor comprovado (achou + corrigiu bug real de lint, convergente com nosso próprio PR #215, 7h41 de diferença)
      diary_readable_by: []      # confidencial — sem compartilhamento até canal de co-evolução real existir
      diary_classifications_shared: []
      exposes_downstream: []

