    org_url: "https://pulsemais.org.br"   # ORGANIZAÇÃO REAL E EXTERNA — não é produto/propriedade do Onion; correção do maestro 2026-07-06 (não confundir "adotante" com "nosso")
    role: standalone            # TIER 3 — adota o core direto, sem sub-adotados
    parent: onion-evolve
    remote: github.com/marciocar/pulse-mais
    local_path: "/home/marciocar/pulse-mais"
