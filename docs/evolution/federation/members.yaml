# Registro de membros da co-evolução Onion.
# Quem adota o Onion, em que tier, versão e configuração de confiança.
# Fonte canônica: o core (onion-evolve). Adicionar projeto = 1 entrada aqui + /meta:adopt.
# RFC-0003: hierarquia de tiers (source | hub | standalone | consumer) substitui producer/consumer.
# (Compatível com /meta:federation-* quando a Federação formal graduar — ver ../../rfc/rfc-0001 §gatilho.)
version: 2
trust_policy_version: 1

members:
  - id: onion-evolve
    name: onion-evolve
    role: source              # TIER 0 — core; autoridade emissora; lê tudo; escreve só em si
    remote: github.com/marciocar/onion-evolve
    path: "."                 # este repo
    local_path: "/home/marciocar/onion-evolve"
    personality_summary: "Framework template que se instala em .claude/; orquestra produto/engenharia/compliance; dogfood como padrão master"
    specializations: [framework-template, sdaal, co-evolution, dogfooding, breadcrumbs]
    personality_last_sync: 2026-07-01
    exposes:
      - public-kbs
      - changelog
      - commands-via-adopt
      - personality-public
    # TIER 0 — sem trust_topology; o core lê tudo por papel, não por concessão

  - id: rhilo-metagamify
    name: rhilo-metagamify (MetaGamify)
    role: hub                 # TIER 1 — central; pode ter sub-adotados
    parent: onion-evolve
    remote: github.com/marciocar/metagamify
    local_path: "/home/marciocar/rhilo-metagamify"
    onion_version: 025225e286d8   # espelha .claude/.onion-version; sync 2026-06-24
    adopted_at: 2026-06-17
    mode: legacy              # greenfield | legacy | regulated
    personality_summary: "Engine de metagamificação modular; especialista Nx + Asana; co-evolução ativa"
    specializations: [gamification, nx-monorepo, asana-integration, metagamification]
    personality_last_sync: 2026-07-01
    trust:
      can_receive_from: [onion-evolve]    # quem pode me mandar conselho/sinal
      can_advise_to: [onion-evolve]       # quem posso aconselhar (via co-relay)
      can_correct_to: []                  # quem posso propor correção ([] = nenhum por padrão)
      diary_readable_by: [onion-evolve]   # quem pode ler meu diário PROTECTED
      diary_classifications_shared: [public, collective]  # o que envio proativamente
      exposes_downstream: []              # IDs de meus sub-adotados (T2) — vazio agora

