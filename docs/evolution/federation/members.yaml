# Registro de membros da co-evolução Onion.
# Quem adota o Onion, em que tier, versão e configuração de confiança.
# Fonte canônica: o core (onion-evolve). Adicionar projeto = 1 entrada aqui + /meta:adopt.
# RFC-0003: hierarquia de tiers (source | hub | standalone | consumer) substitui producer/consumer.
# (Compatível com /meta:federation-* quando a Federação formal graduar — ver ../rfc/rfc-0001 §gatilho.)
version: 2
trust_policy_version: 1

members:
  - id: onion-evolve
    name: onion-evolve
    role: source              # TIER 0 — core; autoridade emissora; lê tudo; escreve só em si
    remote: github.com/marciocar/onion-evolve
    path: "."                 # este repo
    local_path: "/home/marciocar/onion-evolve"
    lineages:                 # o core também é multi-linhagem: o MESMO repo (role: source) vive em >1 checkout
      workstation:            # cópia de trabalho do maestro — a AUTORIDADE; onde a evolução acontece
        branch: main          # sem pin: a fonte não se carimba — sua versão É a HEAD
      vps-bridge:             # clone de RUNTIME no VPS Hostinger (descoberto/verificado ao vivo 2026-07-03)
        branch: main          # presumido (clone default do deploy ~2026-06-29 — onion-bridge/deploy/DEPLOY.md etapa C)
        pin: unknown          # HONESTO: sem acesso SSH nesta sessão; NUNCA carimbar por palpite
                              # (doutrina do pin forjado 2026-06-30 / /meta:recover v1.1.0). Verificar:
                              # ssh → git -C /home/onion/onion-evolve rev-parse --short HEAD, ou expor
                              # /version no bridge (follow-up). Provavelmente ATRÁS da main (deploy
                              # ~06-29; a main andou #222-#234 desde então → drift de runtime real:
                              # o bridge serve agentes/comandos da versão clonada, não da HEAD).
        # Papel: cwd do @anthropic-ai/claude-agent-sdk no onion-bridge — serve app.onionevolve.com
        # (health: {"ok":true,"onionCwd":"/home/onion/onion-evolve"}); site: onionevolve.com.
        # Atualizar: ssh → cd /home/onion/onion-evolve && git pull (DEPLOY.md §Atualizar depois).
    personality_summary: "Framework template que se instala em .claude/; orquestra produto/engenharia/compliance; dogfood como padrão master"  # seed manual pré-F2 — substituir no 1º /meta:personality-sync real
    specializations: [framework-template, sdaal, co-evolution, dogfooding, breadcrumbs]
    personality_last_sync: 2026-07-01   # seed manual (o comando de sync ainda não existe — RFC-0003 F2)
    exposes:
      - public-kbs
      - changelog
      - commands-via-adopt
      - personality-public
    # TIER 0 — sem bloco trust:; o core lê tudo por papel, não por concessão

  - id: rhilo-metagamify
    name: rhilo-metagamify (MetaGamify)
    role: hub                 # TIER 1 — central; pode ter sub-adotados
    parent: onion-evolve
    remote: github.com/marciocar/metagamify
    local_path: "/home/marciocar/rhilo-metagamify"
    onion_version: 8e22352da32f   # pin mais recente VERIFICADO entre as linhagens (pin-ok 2026-07-03).
                                  # Membro MULTI-LINHAGEM: pins por linhagem no mapa lineages: abaixo
                                  # (parecer onion-parecer-rhilo-lineages-2026-07, decisão D2). Regra: um
                                  # pin só entra aqui VERIFICADO por pin-integrity-check.sh — nunca do
                                  # stamp declarado (histórico: a458a0fc6b71 era FORJADO por restore
                                  # manual de 06-30; sinal 2026-07-02-sinal-lint-only-ausente-no-vendor).
    lineages:                     # estado declarado E verificado por linhagem (D2; linhagem = 4º membro da família "declarado ≠ verificado")
      framework:                  # onde a co-evolução vive (inbox/inbound commitados, sinais, diário)
        branch: develop
        pin: 083403c606b7         # verificado 2026-07-02; commits 7813ee34 (update) + abbbf802 (processa inbound)
      production:                 # o motor (rhilo/main e filhas audit/*) — stamp com lineage: production
        branch: rhilo/main
        pin: 8e22352da32f         # verificado 2026-07-03 (Movimento 1, framework-only; pin-ok pós-cópia;
                                  # commit pendente na sessão do rhilo — entrega-sem-commit I3)
    adopted_at: 2026-06-17        # 1ª adoção (semântica única desde o fix do audit #5: --update preserva adopted_at + escreve updated_at; o stamp do rhilo carrega 2026-06-30 por re-carimbo pré-fix — o próximo --update restaura daqui)
    mode: legacy              # greenfield | legacy | regulated
    personality_summary: "Engine de metagamificação modular; especialista Nx + Asana; co-evolução ativa"  # seed manual pré-F2 — substituir no 1º /meta:personality-sync real
    specializations: [gamification, nx-monorepo, asana-integration, metagamification]
    personality_last_sync: 2026-07-01   # seed manual (o comando de sync ainda não existe — RFC-0003 F2)
    trust:
      can_receive_from: [onion-evolve]    # quem pode me mandar conselho/sinal
      can_advise_to: [onion-evolve]       # quem posso aconselhar (via co-relay)
      can_correct_to: []                  # quem posso propor correção ([] = nenhum por padrão)
      diary_readable_by: [onion-evolve]   # quem pode ler meu diário PROTECTED
      diary_classifications_shared: [public, collective]  # o que envio proativamente
      exposes_downstream: []              # IDs de meus sub-adotados (T2) — vazio agora

