# Registro de membros da co-evolução Onion.
# Quem adota o Onion, em que tier, versão e configuração de confiança.
# Fonte canônica: o core (onion-evolve). Adicionar projeto = 1 entrada aqui + /meta:adopt.
# RFC-0003: hierarquia de tiers (source | hub | standalone | consumer) substitui producer/consumer.
# `kind:` (2026-07-28, ADR onion-adr-logto-as-projection D4) separa NATUREZA de TIER. Ate entao a
# natureza vivia so em COMENTARIO — invisivel a qualquer projetor, e projetar sobre um campo
# sobrecarregado produz estrutura errada SEM ERRO. Valores:
#   source        — a propria fonte (nao se projeta)
#   adopter       — projeto que vendoriza o framework p/ o proprio trabalho  (recebe Organization)
#   distillation  — reescrita curada da doutrina, sem vendor  (onion_version: n/a)
#   door          — vendoriza, mas o proposito e DISTRIBUIR o bundle
#   method        — adota o METODO (KG SDAAL) sem vendorizar  (onion_version: n/a)
# Discriminador medivel por tras: `onion_version: n/a` marca quem NAO vendoriza.
# (Compatível com /meta:federation-* quando a Federação formal graduar — ver ../rfc/rfc-0001 §gatilho.)
version: 2
trust_policy_version: 1

members:
