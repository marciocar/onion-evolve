    specializations: [education, srl-plea, learning-materials]
    personality_last_sync: 2026-07-05   # seed manual (comando de sync ainda não existe — RFC-0003 F2)
    trust:
      can_receive_from: [onion-evolve]
      can_advise_to: [onion-evolve]
      can_correct_to: []
      diary_readable_by: [onion-evolve]
      diary_classifications_shared: [public, collective]
      exposes_downstream: []

