# Registro de membros da co-evolução Onion (fluxo A — downstream/distribuição).
# Quem adota o Onion e em que versão. Fonte canônica: o core (onion-evolve).
# Adicionar um projeto = 1 entrada aqui + rodar /meta:adopt no projeto.
# (Compatível com /meta:federation-* quando a Federação formal graduar — ver ../../rfc/rfc-0001 §gatilho.)
version: 1

members:
  - id: onion-evolve
    name: onion-evolve
    role: producer            # o core / framework — fonte das releases e do protocolo
    remote: github.com/marciocar/onion-evolve
    path: "."                 # este repo

  - id: rhilo-metagamify
    name: rhilo-metagamify (MetaGamify)
    role: consumer            # projeto que adota o Onion (modo standalone, vendorizado)
    remote: github.com/marciocar/metagamify
    onion_version: a0fdf35fef03   # pin atual (espelha .claude/.onion-version do projeto, sync 2026-06-19)
    adopted_at: 2026-06-17
    mode: legacy              # greenfield | legacy | regulated

