  - id: onion-standalone
    name: onion-standalone (porta pública Claude — instância adotada role-scoped, bundle standalone)
    # ⚠️ ESTE PAPEL ESTÁ DECIDIDO, e a decisão é da DOUTRINA — não é questão aberta. Em 2026-09-30 eu
    #    escrevi que ele "ficava aberto, com evidência nos dois sentidos"; era falso, e o custo de
    #    afirmar isso é conhecido: foi lendo o registro em vez de medir que a `onion-core` foi
    #    re-materializada com o papel errado e a face pública perdeu 85 arquivos de meta-fábrica.
    #    `public-door-vs-private-core.md` classifica `onion-standalone` como **Porta de framework** e
