/* ══════════ ATO 0 — O GANCHO ══════════ */

{act:"Ato 0 · O gancho", short:1, html:`

{act:"Ato 0 · O gancho", short:1, html:`
  <h2>O gargalo mudou de lugar</h2>
  <div class="grid g3">
    <div class="card rv"><h3>2023–2024</h3><p class="small mut">O gargalo era a <strong>qualidade do modelo</strong>.

/* ══════════ ATO 1 — A EVOLUÇÃO ══════════ */
{act:"Ato 1 · A evolução do ecossistema", short:0, html:`
  <h2>Quatro gerações em quatro anos</h2>
  <table>

    <tr class="rv"><td><strong>3 · Orquestração</strong></td><td>grafos de execução, papéis, estado<br>

{act:"Ato 1 · A evolução do ecossistema", short:1, html:`
  <h2>Os frameworks evoluíram em <em>orquestrar</em>.<br>Pararam em <em>lembrar</em>.</h2>
  <div class="grid g2" style="margin-top:1.8em">

{act:"Ato 1 · A evolução do ecossistema", short:0, html:`
  <blockquote style="font-size:1.5em;border-left-color:var(--orange)">
    A IA se acomoda, <em>não absorve</em> — a menos que você force.

    <div class="card"><h3 style="color:var(--green)">Absorção</h3>

{act:"Ato 1 · A evolução do ecossistema", short:1, html:`
  <h2>Dados são o novo petróleo.<br>Mas ninguém abastece com petróleo cru.</h2>
  <pre class="rv"><span class="c">BRUTO ──────────→ REFINO ──────────→ MOTOR</span>
sobra em todo     existe em várias   <span class="r">é onde quase</span>
lugar             empresas           <span class="r">todo mundo para</span></pre>

  <p class="rv small mut" style="margin-top:1.2em">

{act:"Ato 1 · A evolução do ecossistema", short:0, html:`

  <div class="q" style="max-width:34ch">Seu agente <em>orquestra</em> bem.<br>Mas o que ele <em>sabe</em> na segunda-feira que não sabia na sexta?</div>

    <strong>automação de execução</strong>, não acúmulo de conhecimento.</p>
  <p class="rv">As duas coisas são boas. Só não são a mesma, e o mercado está vendendo uma pela outra.</p>`},

/* ══════════ ATO 2 — DE ONDE VEIO ══════════ */
{act:"Ato 2 · De onde o Onion veio", short:0, html:`

{act:"Ato 2 · De onde o Onion veio", short:0, html:`
  <h2>Nasceu agnóstico. E foi provado agnóstico.</h2>
  <ul>
    <li class="rv">Começou nos experimentos com o <strong>Cursor</strong>, buscando não depender de IDE.</li>
    <li class="rv">Foi <strong>portado de fato</strong> para quatro ambientes diferentes — não como promessa

{act:"Ato 2 · De onde o Onion veio", short:0, html:`

  <p class="rv small mut" style="margin-top:1.4em">

    <strong>nunca foi medido</strong>. Isso está registrado como lacuna aberta no grafo, com data.

{act:"Ato 2 · De onde o Onion veio", short:1, html:`
  <h2>A postura, escrita como critério de decisão</h2>
  <blockquote style="font-size:1.22em">
    Acoplado à plataforma para tirar vantagem da sua estrutura e maquinaria,
    <em>mas mantendo independência sempre que isso for mais vantajoso e o acoplamento não for necessidade</em>.
    <br><br>Acople só quando a capacidade ganha <strong>não existe fora</strong> —

    <cite>É o teste que decide toda adoção de substrato. Não é documentação: é critério.</cite></blockquote>
  <p class="rv small mut">Para um líder de tecnologia, isso é o que separa "escolhemos uma stack" de

/* ══════════ ATO 3 — DECLARADO ≠ VERIFICADO ══════════ */
{act:"Ato 3 · Declarado ≠ verificado", short:1, html:`

{act:"Ato 3 · Declarado ≠ verificado", short:0, html:`

{act:"Ato 3 · Declarado ≠ verificado", short:0, html:`

a plataforma manda  <span class="g">.trigger</span>

{act:"Ato 3 · Declarado ≠ verificado", short:1, html:`
  <span class="tag">caso 2 · pior ainda</span>

<span class="c">// itens lidos:</span> <span class="r">0</span></pre>
  <p class="rv" style="margin-top:1.4em">Uma verificação <strong>completamente quebrada</strong> reportando sucesso.

/* ══════════ ATO 4 — A MAQUINARIA ══════════ */

{act:"Ato 4 · A maquinaria", short:1, html:`
  <h2>Camada 1 · Markdown não é documentação. É execução.</h2>
  <blockquote style="font-size:1.3em">
    O LLM é a <em>VM</em>.<br>O Markdown é o <em>bytecode</em>.<br>Os padrões de projeto são a <em>arquitetura</em>.

  <p class="rv">Não há transpilação. Não há geração de código intermediário.
    O agente <strong>lê o Markdown e age</strong> — e por isso a especificação pode ser versionada,
    revisada em pull request e <em>testada</em>.</p>
  <p class="rv small mut">Consequência prática: a "constituição" do sistema — princípios que nenhum componente
    pode violar — é um conjunto de arquivos que um comando <strong>aplica</strong> e produz veredito com evidência.</p>`},

{act:"Ato 4 · A maquinaria", short:1, html:`

  <pre class="rv">SUPPORTS · REFUTES · <span class="o">SUPERSEDES</span> · CONSTRAINS · CAUSES · TRACES_TO</pre>
  <div class="grid g4 rv" style="margin-top:1.5em">

{act:"Ato 4 · A maquinaria", short:0, html:`
  <h2>E a diferença que ninguém vê até precisar</h2>

  <p class="rv">Quando duas linhas de trabalho chegam a conclusões incompatíveis, o conflito não é de

  <p class="rv small mut">É por isso que a aresta mais importante do vocabulário é <em>SUPERSEDES</em>:

{act:"Ato 5 · Federação e A2A", short:0, html:`

  <ul>

  <p class="rv" style="margin-top:1.6em">A resposta usual é uma planilha e boa vontade.
    A nossa é um <strong>registro versionado em YAML</strong>, com papéis, permissões e

{act:"Ato 5 · Federação e A2A", short:0, html:`
  <h2>Os papéis — e o botão de divórcio</h2>
  <table>
    <tr class="rv"><td><strong>source</strong></td><td class="small">o núcleo; autoridade emissora, não se carimba</td></tr>

    <tr class="rv"><td><strong>standalone</strong></td><td class="small">adota o núcleo direto</td></tr>
    <tr class="rv"><td><strong>consumer</strong></td><td class="small">adotado por um hub; folha da cadeia</td></tr>
    <tr class="rv"><td style="color:var(--orange)"><strong>decoupled</strong></td>
      <td class="small">vira <strong>fonte soberana própria</strong> — autora o próprio framework e

  </table>
  <p class="rv" style="margin-top:1.5em"><strong>A fonte é soberana de quem a usa.</strong>

{act:"Ato 5 · Federação e A2A", short:0, html:`
  <h2>A2A — agente falando com agente, <em>com adulto na sala</em></h2>
  <p>Um sinal assinado sai do agente de um repositório e chega ao agente de outro.
    O receptor roda <strong>seis a sete camadas</strong> de verificação, da mais barata à mais cara:</p>
  <pre class="rv">parse → <span class="o">confiança</span> → anti-replay → <span class="o">relógio</span> → SSRF → assinatura → modo</pre>

  <p class="rv small mut" style="margin-top:1.2em">Falta uma ferramenta para avaliar uma camada?

/* ── runtime ── */
const stage=document.getElementById('stage'), bar=document.getElementById('bar'),
      cur=document.getElementById('cur'), tot=document.getElementById('tot'),
      actname=document.getElementById('actname'), toc=document.getElementById('toc'),
      toclist=document.getElementById('toclist');
let i=0, step=0;

S.forEach((s,n)=>{
  const d=document.createElement('section');
  d.className='slide'; d.dataset.n=n; d.innerHTML=s.html; stage.appendChild(d);
  const b=document.createElement('button');
  b.className='tocl'+(s.short?' s':'');
  b.innerHTML='<span class="n">'+String(n+1).padStart(2,'0')+'</span>'+
    (s.act||'Capa')+(s.short?' ·':'');
  b.onclick=()=>{go(n);toc.classList.remove('on')};
  toclist.appendChild(b);
});
tot.textContent=S.length;
const slides=[...document.querySelectorAll('.slide')];

function render(){
  slides.forEach(s=>s.classList.remove('on'));
  const s=slides[i]; s.classList.add('on');
  const rvs=[...s.querySelectorAll('.rv')];
  rvs.forEach((r,k)=>r.classList.toggle('on',k<step));
  bar.style.width=((i+1)/S.length*100)+'%';
  cur.textContent=i+1; actname.textContent=S[i].act||'';
  s.scrollTop=0;
}
function steps(){return slides[i].querySelectorAll('.rv').length}
function next(){ if(step<steps()){step++;render()} else if(i<S.length-1){i++;step=0;render()} }
function prev(){ if(step>0){step--;render()} else if(i>0){i--;step=steps();render()} }
function go(n){i=n;step=steps();render()}

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  if(e.key==='Home')go(0); if(e.key==='End')go(S.length-1);
  if(e.key==='m'||e.key==='M')toc.classList.toggle('on');
  if(e.key==='Escape')toc.classList.remove('on');
});
addEventListener('click',e=>{ if(e.target.closest('#toc')||e.target.closest('#hud'))return;
  (e.clientX < innerWidth*0.28) ? prev() : next(); });
render();
</script>
