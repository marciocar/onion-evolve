    narrative: "A rodada sustenta o mapa, não a tabela final. SUSTENTA: os 10 projetos existem na página da fundação, lida em 2026-11-04, sem nível nem data. Também sustenta spec e licença de MCP e Agent Skills, o delta do MCP e a aderência medida das skills, 4 de 14. NÃO SUSTENTA: nenhuma classificação ADOTAR ou COSTURAR, porque nada rodou, nenhum consumidor foi nomeado e o teto pré-registrado é PARQUE com gatilho; as colunas de adoção, de quem paga e do que muda ao fechar sem o projeto, em todos os dez; o descarte de OpenEnv como inalcançável. CORREÇÕES ANTES DE GRAVAR: (1) Claim 21 está refutada: o Goose veta por exit 2 de processo externo. Isso também contraria CLAUDE.md linha 16, a frase que justifica o acoplamento. O maestro precisa ver esse ponto; a rodada não mede equivalência, então é preciso rodar antes de reescrever a doutrina. (2) O core não tem AGENTS.md. Só o onion-codex tem, e no Claude Code o CLAUDE.md prevalece quando os dois existem. (3) O delta do A2A está na tag v1.1.0-rc, não na página de releases: AI Catalog preferido e SendLiveMessage. Nosso card segue em 0.3.0 e só em well-known. É candidata, logo gatilho, não obrigação. (4) As claims 32 e 41 erram ao dizer que não há releases: Agent Router v1.2.0 e OpenSandbox release-1.2.0. A claim 27 deixou de ler a v1.7.0 do agentgateway. A claim 35 contradiz a 1. (5) Há um segundo servidor MCP fora da lista, a2a-rt-mcp.py, só da era antiga. TETO PROVISÓRIO, A CONFIRMAR: MCP: já implementado no kg_mcp, falta conferir com cliente real. Agent Skills: PERFIL POR CIMA, sem migração decidida. O molde onion-patterns é a causa da divergência. AGENTS.md: PERFIL POR CIMA. A2A: PERFIL POR CIMA, como já está. Goose e agentgateway: PARQUE, com gatilho no consumidor nomeado. Open Responses e OpenSandbox: PARQUE. Agent Router e OpenEnv: candidatos a SEM RELAÇÃO, mas zero menção não prova ausência de relação funcional. PRÓXIMA MEDIDA, NÃO RODADA: MCP: cliente 2026-07-28 e conformidade contra os dois servidores. A2A: envio pelo perfil contra um SDK v1.0 e leitura da 1.1 quando sair. AGENTS.md: sessão real com os dois arquivos. Agent Skills: skills-ref validate nas 14. Goose: hook exit 2 em modo autônomo e conexão ao kg_mcp por stdio. agentgateway: envelope JWS atravessando o proxy. Agent Router: subir só se surgir consumidor. Open Responses: compliance-test contra um harness de porta. OpenEnv: ambiente echo, para decidir se há relação com os spikes. OpenSandbox: subida local, com a porta presa em 127.0.0.1. LIMITES DESTA REFUTAÇÃO: aaif.io/projects/, a página de OpenEnv, o comunicado da LF e a doc do Claude Code vieram por WebFetch, com texto mediado por modelo. O restante veio de gh api cru e de grep local. Minha primeira busca com 2>/dev/null foi refeita com stderr visível, e os zeros citados vêm da segunda. Tudo o que mediu por leitura está declarado como leitura, e nenhum artefato foi baixado nem executado. Nota do escritor do grafo: o critério pré-registrado diz que, sem medida em rodagem, o teto é PARQUE; os PERFIL POR CIMA acima são proposta do Elenxo por serem formato sem dependência, e a tensão fica aberta nos nós C_TETO_*, sem selo."
