; snapshot 0613 e de fora do doc); [kallm] 4 de fronteira + Mistral e 7B nao sustenta SLM (sao 3+1; extrapolacao de um 7B zero-shot); [nvidia] tarefa-alvo de conjunto fechado e estruturado (o texto nao diz; exemplos incluem sumarizacao e codigo); [kg-corruption] gabarito por construcao (TransE §4.2 admite negativos validos); no real a pista nao existe (mais forte que o texto; secao 4.3.3); Liu 2023/24 ruido semantico (ruido similar tambem e sintetico); [fine-tune-when] consenso Ask HN (opiniao de UM comentarista); custo no dataset (e de outro comentarista); [market-capital] plataformas = Tinker (o corpo nao nomeia Tinker). LACUNAS QUE CONTINUAM ABERTAS: (1) NENHUM especialista (OPF, GLiNER2-PII, GLiNER2.5, NuExtract3) foi medido em pt-BR nem com CPF/CNPJ — o OPF avalia portugues nas Tables 7-8, que esta rodada NAO ancorou; (2) custo de inferencia em CPU na VPS compartilhada NAO medido (GLiNER2.5 CPU-first e declaracao); (3) scripts de fine-tune do NuExtract3 nao rodados; 21 tipos e fase RL sem quote; (4) licenca do Qwen3.8-27B e do Qwen3.5 small sem citacao ancorada; Qwen3.8 <=9B ausente so por agregador; Qwen3.7 proprietario sem primaria; (5) nenhuma primaria mede SLM em EXTRACAO DE KG do dominio do Onion — KaLLM so mede um 7B zero-shot; (6) nenhuma medicao de destilacao fora de raciocinio matematico; (7) o eval de dominio (X_REF_NANOCHAT_Q_EVAL) continua inexistente — e ele, nao esta rodada, que decide C; (8) o Elenxo chegou TRUNCADO na objecao 23: as objecoes 24-58 e o gapsOpen NAO foram lidos por este escritor — re-ler o journal do run antes de citar este no como completo; (9) o diretorio docs/discussions/onion-slm/fontes nao existe nesta arvore — a lista das 45 afirmacoes nao foi conferida uma a uma contra os C_CHAT_* daqui.'
