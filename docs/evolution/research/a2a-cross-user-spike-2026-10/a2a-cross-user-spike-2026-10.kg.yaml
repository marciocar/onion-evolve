    confidence: 0.85
    verified_at: "2026-10-14"
    verified_against: "hooks/record-tool-attempts.selftest.sh 78/78 (mutante do juiz REPROVADO; os furos da passada adversarial como negativos); vps/accept-to-channel.selftest.sh 12/12 (exp octal recusado; mutante sem teto de vida deixa passar); channel/a2a-channel.smoke.ts sob bun 12/12 com o CH emendado e 4/12 com o CH de origin/main e2222a79; Claude Code 2.1.299 real (-p, haiku, --settings, sem channel e sem bridge): PreToolUse gravou Bash e Read NEGADOS no diálogo, e uma regra deny escondeu a tentativa do PreToolUse"
    label: "As 9 emendas entram datadas no §12 do protocolo, sem reescrever o pré-registro: A8 julgado por TENTATIVAS contra allowlist (hook que só registra), A8g com canários, hashes medidos no CH, linha de base nativa B0, ordem A8→A7 e P5b vivo contra o gate curado."
    narrative: |
      O que muda de veredito: o A8 deixa de valer pelo hash (que media o maestro) e passa a valer pelo juiz
      (vps/judge-attempts.sh) sobre o tool-attempts.jsonl; o teto do A7 deixa de ser 26 s e passa a ser
      máx(B0) para IGUAL e 2 × mediana(B0) para RESSALVA; A3/A4/A5 viram o passo P5b, vivo, contra o gate
      com a cura do corpo e do exp. O que fica bloqueado: produção e qualquer conclusão "o transporte está
      certo" até a cura do corpo (F1) entrar no a2a-verify. Achado colateral do smoke: o CH de origin/main,
      depois de um restart, re-entregava o mesmo jti como evento novo e recusava o reply ao jti antigo.
      Achado colateral da medição real: uma regra permissions.deny barra a tool ANTES do PreToolUse, e a
      tentativa some do registro; por isso a receptora não tem deny e a foto --strict reprova qualquer deny.
      A passada adversarial da emenda achou 12 defeitos reais (2 bloqueantes: quebra de linha e glob furavam
      a allowlist do A7), todos curados no mesmo PR (§12.13).
      Precisa da presença do maestro: P2 (token), aceitação, A7 (com o B0) e A8 (com o A8g).
