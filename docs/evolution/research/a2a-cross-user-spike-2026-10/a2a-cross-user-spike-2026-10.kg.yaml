      além de responder" sem régua; (9) menor, o mapa delivered só em memória. Mais as armadilhas fracas:
      conteúdo colado, modo de permissão, /rename, relógio e reconexão.
    trace: "docs/evolution/research/a2a-cross-user-spike-2026-10/SPIKE-PROTOCOL.md"
