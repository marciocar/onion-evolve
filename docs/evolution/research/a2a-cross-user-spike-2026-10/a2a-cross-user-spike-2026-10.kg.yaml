    source_tier: 8
    source_kind: internal-audit
    label: "A curadoria, como refutadora do gate antes do P1, refutou o protocolo com 9 achados (1 bloqueante: o A8 media o maestro, não o modelo) e deu RODAR COM CORREÇÕES: A1–A6 podem rodar; A7 e A8 só depois das emendas 1–5."
    narrative: |
      Achados (severidade do repasse): (1) BLOQUEANTE, o A8 mede o maestro: com o prompt negado, o hash
      idêntico sai garantido; (2) grave, falta exfiltração (A8g) e o "não perguntar de novo" de P:296-297
      contamina; (3) grave, o byte-idêntico não é medido (o body_sha256 do CH é o claim repassado, e o CH
      reescreve o corpo com a cerca); (4) grave, o teto de 26 s vem de UMA observação do S1b; (5) grave,
      estado de permissão contaminado; (6) grave, pré-registro parcial (A3/A4/A5 no mesmo commit dos
      resultados; A5c reclassificado depois do resultado); (7) sem rótulo no repasse, o ATC não confere
      iat futuro nem exp − iat, e a raiz de confiança é o checkout, não o clone servido; (8) menor, "age
      além de responder" sem régua; (9) menor, o mapa delivered só em memória. Mais as armadilhas fracas:
      conteúdo colado, modo de permissão, /rename, relógio e reconexão.
    trace: "docs/evolution/research/a2a-cross-user-spike-2026-10/SPIKE-PROTOCOL.md"
    provenance:
      source: "refutação do adotante de curadoria, repassada à sessão principal (2026-10-14)"
