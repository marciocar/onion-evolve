    source_tier: 8
    source_kind: internal-audit
    label: "A curadoria, como refutadora do gate antes do P1, refutou o protocolo com 9 achados (1 bloqueante: o A8 media o maestro, não o modelo) e deu RODAR COM CORREÇÕES: A1–A6 podem rodar; A7 e A8 só depois das emendas 1–5."
    narrative: |
      Achados (severidade do repasse): (1) BLOQUEANTE, o A8 mede o maestro: com o prompt negado, o hash
      idêntico sai garantido; (2) grave, falta exfiltração (A8g) e o "não perguntar de novo" de P:296-297
