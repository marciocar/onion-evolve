nodes:
  # ─── pergunta e decisão ───────────────────────────────────────────────────────────────────────────
  - id: Q_MESSAGING_STANDARDS_1106
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    verified_at: "2026-11-06"
    verified_against: "run de /onion-research em modo decision de 2026-11-06 (o id do run não veio na tarefa de escrita): 20 claims confirmadas, 5 refutadas, 50 objeções julgadas pelo Elenxo, 28 sobreviventes, 18 superações achadas"
    label: "Qual pilha de padrões de mercado (envelope, fila, campainha, identidade, adapters, prior art) o onion-messaging deve adotar para ligar sessões do Claude Code, pessoas, máquinas e agentes, local na VPS compartilhada e pronto em 3 dias?"
    narrative: "Pergunta computada pelo workflow: qual pilha de padrões de mercado de novembro de 2026 o projeto próprio de mensageria do Onion (repo onion-messaging, vendorizável como o kg-ssot) deve adotar para comunicar sessões do Claude Code, pessoas, máquinas e agentes, com versão local mínima numa VPS compartilhada e pronta em 3 dias? Itens: (1) envelope e protocolo: A2A 1.0, CloudEvents 1.0 ou os dois; (2) fila e entrega: SQLite em WAL com outbox/inbox, Redis Streams com consumer groups, NATS JetStream ou outra, com pelo menos uma vez, ack, reenvio a quem estava offline, idempotência e dead-letter; (3) campainha na sessão pelo channel MCP do Claude Code (capability experimental claude/channel, notifications/claude/channel, prévia de pesquisa, sem confirmação de entrega, só com a sessão aberta); (4) identidade e convite: login por URL (device flow RFC 8628) ou outro; (5) adapters: Slack por Socket Mode, e-mail, git assíncrono; (6) projetos abertos que já existem (A2A push e tasks, MCP, AAIF, pontes de channel da comunidade). Critérios: padrão de mercado, simplicidade local, VPS compartilhada de 8 CPUs, sem dependência de serviço externo, segurança (gate A2A, nunca segredo no evento, aceite humano) e prazo de 3 dias. Corpus prévio que pesa: S6 em produção (convite por membro, 2026-10-15), A7-C1 (channel do spike com ack e reply, 2026-10-22), D_PERSONA_RUNTIME_2026_11 (bot próprio no Agent SDK no bridge) e D_CS_TRES_DEGRAUS_NA_SEGUNDA_1106 (campainha, Slack como evento, sessão com sessão), estes dois últimos citados pela tarefa e fora desta árvore. Fica open: o selo é do maestro."
    trace: "pergunta do run de /onion-research em modo decision de 2026-11-06, computada pelo workflow"
  - id: D_MESSAGING_STACK_2026_11
    node_type: decision
    layer: audit
    impact: 5
    confidence: 0.55
    label: "Pilha do onion-messaging: envelope A/B/C · fila 1/2/3 · campainha i/ii · identidade a/b · adapters Slack Socket Mode + git. Elenxo recomenda C + fila 1 + campainha i com ii de fallback + identidade a + Slack e git. O maestro sela."
    trace: "workflow onion-research em modo decision, run de 2026-11-06; pergunta em Q_MESSAGING_STANDARDS_1106"
    status: done
    plane: DEV
    verified_at: "2026-11-06"
    verified_against: "decisão do maestro em 2026-11-06, por pergunta com opções (/meta:decide): escolhida «CloudEvents 1.0 dentro do sinal A2A assinado + fila honker vendorizada (versão fixa, bancada e mutante antes de valer, ack só pela tool do channel, teto e dead-letter do honker) + campainha pelo channel MCP com fallback por pull + identidade em dois adapters (Logto e local) + Slack Socket Mode e git»"
    narrative: |-
      RECOMENDAÇÃO DO ELENXO (INTEIRA): Recomendo ao maestro a pilha mais reaproveitada e menos inventada: Envelope C, Fila 1, Campainha i com a ii de fallback, Identidade a, e Slack por Socket Mode mais git assíncrono como adapters dos 3 dias. O envelope é CloudEvents 1.0 dentro do sinal A2A no perfil Onion, que já é o que o a2a-accept.sh e o a2a-metrics.py fazem. A ressalva honesta: o A2A 1.0 só assina o Agent Card. A assinatura de mensagem é do perfil Onion (body_sha256 obrigatório no a2a-verify.sh), e um cliente A2A 1.0 estrito de terceiro não a fala. A fila é um único daemon dono de um SQLite em WAL. Restrições que entram já no desenho: - a linha só sai da outbox com o ack explícito da tool do channel, amarrado ao id e ao body_sha256; o resolver de mcp.notification() nunca conta como entrega; - tentativas com teto, mais uma tabela dead_letter (lacuna aberta: 0 nós no corpus); - dedupe por ce_source+ce_id ou jti; - poda das linhas entregues e backup, porque o disco da VPS é compartilhado; - nada de Redis em Docker nesta VPS. A campainha nasce do channel do spike: sessão interativa, flag de dev, sem permission relay, gate pelo kid do remetente e não pela sala. Ela é opcional por adotante, porque Bedrock, ZDR e channelsEnabled bloqueado a desligam. Sessões headless e a persona no Agent SDK não recebem campainha, então usam pull pelo hook ou por tool. A volta entre usuários é por pull (fetch-replies / tasks/get), nunca por webhook: o NAT e o anti-SSRF o barram. A identidade nos 3 dias é o convite A2A por membro já em produção. O device flow RFC 8628 fica para depois de existir um servidor de autorização próprio, e o código nunca viaja em convite por Slack ou e-mail. Lacunas que seguram a palavra final: - dead-letter: nenhuma peça nem fonte lida; - contrários não lidos para a fila: JetStream e honker; - prior art de CloudEvents com agentes não lida (EventMesh A2A e ADR 0021), que pode contrariar a frase 'o mercado não a tem'; - smoke do channel ainda não repetido na 2.1.319. NOTAS DO ESCRITOR (não fazem parte da recomendação): (a) o id do run não veio na tarefa de escrita; (b) claude --version nesta máquina em 2026-11-06 devolve 2.1.319, como a recomendação diz; (c) o kg-corpus-grep casa só id e label: 'CloudEvent' dá 0 nós, embora a narrative de Q_COORD_DECIDIR_VIGIA_DE_EVENTOS fale de CloudEvents.

      verified_against anterior: «recomendação do Elenxo no run de /onion-research em modo decision de 2026-11-06; o maestro não selou; 28 objeções sobreviventes modeladas como CONSTRAINS»
      Selado por /meta:decide em 2026-11-06: escolhida «CloudEvents 1.0 dentro do sinal A2A assinado + fila honker vendorizada (versão fixa, bancada e mutante antes de valer, ack só pela tool do channel, teto e dead-letter do honker) + campainha pelo channel MCP com fallback por pull + identidade em dois adapters (Logto e local) + Slack Socket Mode e git»; descartadas: «Fila própria em SQLite» · «NATS JetStream» · «Recomendação sem honker».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-06: «Qual pilha de padrões de mercado o onion-messaging adota (envelope, fila, campainha, identidade e adapters)?»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-06"
      locality: "pessoa"
  # ─── opções (uma claim por opção) ─────────────────────────────────────────────────────────────────
  - id: C_OPCAO_ENVELOPE_A_A2A_ONION_PROFILE_ONLY
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.3
    label: "Envelope A: A2A 1.0 com o perfil Onion (JWS RS256, kid pinado, aud, jti, body_sha256), sem CloudEvents"
    narrative: "Vale como o fio que já roda (S6, A7-C1), mas o descarte 'o A2A basta como envelope único' foi legítimo: o próprio core já lê CloudEvent 1.0 no corpo do sinal (a2a-metrics.py l.161-183) e guarda os ids dele no aceite (a2a-accept.sh l.271). A assinatura de mensagem é do perfil Onion, não do A2A 1.0 (E_OBJECAO_F7_MESSAGE_SIGNATURE_IS_ONION_PROFILE)."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_ENVELOPE_B_CLOUDEVENTS_ONLY
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.15
    label: "Envelope B: CloudEvents 1.0 puro, fora do A2A"
    narrative: "Perde o gate que o core já tem em produção (a2a-verify: RS256 com kid pinado, aud obrigatório, jti guardado por receptor, body_sha256). CloudEvents sozinho não assina nem autentica o remetente; cada adapter teria de reinventar o gate."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_ENVELOPE_C_CLOUDEVENTS_IN_A2A_SIGNAL
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.55
    label: "Envelope C (os dois): CloudEvents 1.0 no corpo do sinal A2A, amarrado pelo body_sha256 assinado; já é a forma de a2a-accept.sh e a2a-metrics.py (recomendada)"
    narrative: "Recomendada pelo Elenxo. Restrições: a spec CloudEvents 1.0 não foi lida no run (E_OBJECAO_SRC_CLOUDEVENTS_SPEC_UNREAD, risco baixo porque o core já implementa os atributos obrigatórios); o prior art de CloudEvents com agentes (EventMesh A2A, ADR 0021) não foi lido e pode contrariar 'o mercado não a tem'; um cliente A2A 1.0 estrito de terceiro não fala o fio {jws, signal}. Atributos CloudEvents vão no meta do channel com underscore (ce_id, ce_source), porque chaves com hífen são descartadas."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_QUEUE_1_SQLITE_WAL_OUTBOX_INBOX
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    label: "Fila 1: SQLite em WAL com um daemon escritor, outbox e inbox, ack explícito, tentativas com teto, tabela dead_letter, dedupe por ce_source+ce_id ou jti (recomendada)"
    narrative: "Recomendada pelo Elenxo. Restrições: só sai da outbox com ack explícito da tool do channel amarrado ao id e ao body_sha256 (E_OBJECAO_F11_CHANNEL_RESOLVE_IS_NOT_ACK); um único daemon dono do arquivo, os outros por socket local, com busy_timeout (E_OBJECAO_F12_ONE_DAEMON_OWNS_THE_FILE); teto de tentativas e dead_letter, que não tem peça nem fonte lida (E_OBJECAO_CUT_DEAD_LETTER_GAP); poda e backup no disco compartilhado (E_OBJECAO_CUT_PRUNE_AND_BACKUP); os contrários JetStream e honker não foram lidos."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_QUEUE_2_REDIS_STREAMS
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.15
    label: "Fila 2: Redis Streams com consumer groups (nesta VPS o Docker fura o ufw, e já houve Redis sem auth exposto)"
    narrative: "Consumer groups dão ack e reentrega, mas a operação nesta VPS pesa contra: a memória vps-docker-ufw registra que o Docker fura o ufw e já expôs 2 Redis sem auth. Mais um serviço com rede para operar na máquina compartilhada, contra o critério de simplicidade local."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_QUEUE_3_NATS_JETSTREAM
    node_type: claim
    layer: audit
    plane: DEV
    status: superseded
    impact: 5
    confidence: 0.3
    label: "Fila 3: NATS JetStream (ack, redelivery e max_deliver nativos; não lido no run)"
    narrative: "É o contrário mais forte da Fila 1: traria ack, redelivery e max_deliver nativos e fecharia a dead-letter. Não foi lido no run (E_OBJECAO_SRC_JETSTREAM_UNREAD) e o corpus não tem nó de JetStream; a opção fica não-julgada, não descartada."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_BELL_I_OWN_CHANNEL_FROM_SPIKE
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    label: "Campainha i: channel próprio derivado do a2a-channel.ts do spike, só em sessão interativa com a flag de dev, sem permission relay, gate por kid (recomendada, com a ii de fallback)"
    narrative: "Recomendada pelo Elenxo. Restrições: opcional por adotante (Bedrock, Vertex, Foundry, ZDR e channelsEnabled bloqueado a desligam); sessão headless e Agent SDK nunca tocam; ack só vale amarrado ao id e ao hash do corpo; gate pelo kid do remetente, não pela sala; nunca declarar permission relay; fixar a versão do Claude Code e repetir o smoke a cada /meta:cc-update (smoke ainda não rodado na 2.1.319)."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_BELL_II_YOU_HAVE_MAIL_HOOK
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 4
    confidence: 0.5
    label: "Campainha ii: hook 'you have mail' no início do turno, para sessões headless e Agent SDK"
    narrative: "Fallback da campainha i na recomendação. O hook de correio do co-evolve está em produção, mas toca na virada do turno, não ao vivo; entrega viva no Agent SDK não foi medida por ninguém (E_OBJECAO_F2_HEADLESS_NEVER_RINGS)."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_IDENTITY_A_A2A_MEMBER_INVITE
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.6
    label: "Identidade a: convite A2A por membro com validade e revogação (S6 em produção) (recomendada para os 3 dias)"
    narrative: "Recomendada pelo Elenxo. S6 medido em produção em 2026-10-15: convite, doctor do membro, envio assinado verificado pelo gate, aceite e revogação. Não leva código de login no convite, o que fecha o vetor de phishing por device code via Slack ou e-mail."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_IDENTITY_B_DEVICE_FLOW_RFC8628
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 4
    confidence: 0.25
    label: "Identidade b: device flow RFC 8628, que exige servidor de autorização próprio e nunca leva o código no convite"
    narrative: "Fora dos 3 dias na recomendação. O A2A 1.0 só DECLARA o esquema no Agent Card; o servidor de autorização que emite device codes não vem com ele (E_OBJECAO_F6_DEPRECATED_NOT_REMOVED_NO_AS). Phishing por device code cresceu 37,5x (CSA via Push Security), e código vindo por Slack ou e-mail é o padrão que a CSA manda tratar como phishing."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
  - id: C_OPCAO_ADAPTERS_SLACK_SOCKET_MODE_AND_GIT
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 4
    confidence: 0.5
    label: "Adapters: Slack por Socket Mode (só conexão de saída) e git assíncrono pelo doc-bridge no dia 1; e-mail depois dos 3 dias (recomendada)"
    narrative: "Recomendada pelo Elenxo. Socket Mode dispensa endpoint público (só conexão de saída). O doc-bridge (co-deliver, co-relay) entrega assíncrono e já roda em produção, mas não toca a campainha. Restrições: o gate do adapter Slack filtra pelo remetente (kid do membro), nunca pela sala; o adapter nunca transporta código de login."
    trace: "opção da pergunta do run de /onion-research em modo decision de 2026-11-06"
