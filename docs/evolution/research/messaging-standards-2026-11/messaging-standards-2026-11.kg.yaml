    label: "Segundo o juiz, a RFC 10027/BCP 247 diz que o RFC 8628 é suscetível a phishing de consentimento entre dispositivos; só se usa sem outro fluxo viável e com mitigação (proximidade ou dispositivo pré-registrado); o código nunca viaja no convite."
    narrative: "Formulação corrigida pelo juiz, pela primária RFC 10027/BCP 247 (§6.1, §6.1.2, §6.1.13, §6.2.1.5, §6.2.4): o RFC 8628 é suscetível a phishing de consentimento entre dispositivos (CDCP) pelo canal não autenticado; só se usa quando outro fluxo não é viável e sempre com mitigação adicional (proximidade ou dispositivo pré-registrado), com códigos de vida curta e educação do usuário só como complemento; o código nunca viaja no convite e o convite não pode iniciar o fluxo. Medida: duas chamadas WebFetch à página do datatracker (offset 0 e 100000) devolveram as frases normativas verbatim, com a data de 2026-08-11 e a numeração RFC 10027; uma chamada WebFetch à nota da CSA confirmou que ela recomenda bloquear ou restringir o device code flow. A numeração RFC é declaração do juiz, não conferida pelo escritor. Critério: V2_CONTRADITA. Alvo reprovado na votação: o device code flow não tem vulnerabilidade a corrigir (tier 7). Registro da reprovação: E_LACUNAS_MESSAGING_1106. Afirmação de UM juiz (motor de superação)."
    trace: "WebFetch https://datatracker.ietf.org/doc/draft-ietf-oauth-cross-device-security/ (offset 100000), citando §6.2.1.2 e §6.2.1.5 verbatim"
