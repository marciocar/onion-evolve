09524 (runbooks com agentes, ago/2026); fonte não lida: sachin-11/incident-runbook-agent (marginal); fonte não lida: OASIS ?p=10546 (estado de execução durável no CACAO). Objeções que NÃO sobreviveram (7): escopo só-ciber do CACAO, estado em atributos do Workflow, grafo de ações tipadas, runbook como serviço chamável, página MEDDICC negativa, série A da Resolve (redundante), TechCrunch negativo."
