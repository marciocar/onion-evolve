ara o decidivel do ambiguo (limite do Cedar: decidibilidade e da LINGUAGEM, nao da ferramenta); (5) M3 como experimento com teto, nunca como plano, porque as duas claims que o sustentavam foram cortadas por orcamento; (6) M5 como experimento delimitado em UMA tarefa estreita, fora do caminho critico, enquanto o eixo de sobrevivencia de fornecedor estiver vazio; (7) M6 REPROVADA para uso interativo por medicao (19 GB de modelo contra 22 livres, 3,54 tok/s em maquina melhor, disputa dos 8 nucleos com a bancada), sobrando so a janela de MoE pequeno em lote exclusivo, que vale ~30 min de medicao e nada mais; (8) M7 nao se sela, mas sua tese se ACEITA PARCIALMENTE — o token nao e a emergencia que o dossie supos. O QUE DEVE FICAR COMO ESTA, explicitamente: o gate deterministico (93 regras, radar sem LLM, bancada) nao vira LLM em ponto nenhum, e o offload para codigo deterministico ja esta COLHIDO aqui, logo nao e economia disponivel; e a doutrina de que a regua e eficiencia e eficacia, nunca custo, veta rebaixar veredito para economizar — tiering por FASE sim, rebaixamento em bloco nao. ═══ PERGUNTAS DE SELAGEM ═══ P1. Em que REGIME a casa opera (plano pago ou chave de API)? Sem isto nenhuma opcao e avaliavel. P2. Qual o teto aceitavel de minuto de Actions por mes, agora que ~16.500 e a ordem de grandeza estimada? P3. O revisor semantico volta rebaixado com teto, ou fica desligado por decisao? P4. M1 pode ser dogfoodado por FASE em quais agentes, e qual e o criterio de reprovacao que faria voltar atras? P5. Os ~30 min de medicao de MoE em lote na VPS valem ser gastos, ou M6 fica selada como reprovada?'
