    label: 'DECISAO ABERTA (o maestro sela): qual ARCO organiza o deck premium do Onion de setembro de 2026, para o publico duplo (aluno-adotante + equipe de engenharia de cliente)? Opcoes nomeadas — (A) Arco em ATOS problem-first, derivado do deck de campo: usar docs/evolution/decks/iftl-frameworks-agentes-2026-08.html (branch docs/deck-iftl-rebased, 52 slides, 9 atos, 18 marcados short:1) como espinha MEDIDA e re-instrumenta-lo para o publico duplo. (B) Arco Diataxis: reorganizar nas 4 categorias (tutorials -> how-to -> reference -> explanation) mantendo-as estruturalmente separadas. (C) Arco da doc do Claude Code: instalar/rodar -> o que da para fazer -> escada de customizacao (memoria -> skills -> hooks -> agentes/SDK) -> aprofundamento. (D) Arco SRL/PLEA da casa: Orient -> Activate -> Reinforce com planificar->executar->avaliar por ato, sobre o chassi self-contained do /design:deck (diretrizes vinculantes 1-3, 8 e 9). (E) Aplicar literalmente os 4 achados sobreviventes: Diataxis + teto de 2 camadas de progressive disclosure sobre o deck de 65 slides descrito. (F) PARAR antes de reorganizar: medir qual deck e o alvo real (o de 65 slides NAO existe neste repo) e rodar uma 2a rodada curta com os 6 comparadores que o proprio plano nomeou e nao leu. (G) Fusao A+D+C. RECOMENDACAO DO ELENXO: **(G) — fusao A+D+C — com (F) como gate de 30 minutos ANTES de qualquer slide ser movido.** O raciocinio, e ele e negativo antes de ser positivo: (E) esta REPROVADA em duas frentes independentes e suficientes — aplica a um artefato que ninguem verificou existir (E_OBJECAO_6) e importa como "ordem" uma doutrina que so fala de SEPARACAO (E_OBJECAO_1). (B) esta reprovada por MEIO: um deck e artefato linear de fluxo unico e por construcao mistura tutorial+explanation no mesmo stream, que e precisamente o que o Diataxis proibe; e a doutrina ja estava assinada na casa desde 2026-07-05 como fronteira de ARQUIVO (theories/ vs applications/), nao de slide. (C) nao esta reprovada, mas perdeu a autoridade que a sustentava: as 3 claims tier 9 que a fundamentavam foram refutadas nesta rodada — ela entra na fusao como HIPOTESE a re-verificar na fonte primaria, nao como padrao confirmado. O que sobra com sustentacao real e (A) — porque e o unico arco MEDIDO e ja rodado em campo, com 2 camadas de disclosure e navegacao explicita ja implementadas — casado com (D), que e a unica coisa nesta rodada que responde a pergunta do maestro sobre ORDEM com autoridade citavel: a casa TEM lei de ordem escrita (skill onion-onboarding: "comece pelo papel DELE, depois a cadeia source->hub->consumer... nao despeje os 6 papeis de uma vez"), TEM as 3 fases (Orient -> Activate -> Reinforce, onion-guided-lifecycle.md) e TEM 9 diretrizes vinculantes de desenho educacional com RCT peer-reviewed por tras (Fan et al. 2025, "metacognitive laziness"). E (F) e gate e nao opcao porque reorganizar 65 slides que nao existem e trabalho sobre ficcao. CONDICAO DE SELO NOMEADA: o maestro sela depois que (i) o deck-alvo real estiver identificado por caminho+branch+contagem, e (ii) ao menos 3 dos 6 comparadores de onboarding tiverem sido lidos — antes disso qualquer selo e selo sobre 2 fontes.'
