nodes:
  - id: Q_LIBERAR_A_META_FABRICA_PARA_O_PLUGIN
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    owner: maestro
    label: 'PERGUNTA DO MAESTRO (2026-09-15): e se a meta-fabrica for liberada para o plugin PUBLICO? Hoje a REGRA 61 (Fronteira de MOAT: manifesto de plugin publicavel nao vaza meta-fabrica nem grafo privado) a barra. Tres camadas, e so a segunda e bloqueante. (1) O QUE DESTRAVA, e e real: o plugin passa a se AUTO-PROPAGAR — quem instala roda `/meta:adopt` e cria novos adotantes, e `create-*` para autorar comandos/agentes. O framework vira ferramenta de FABRICA publica, nao so de trabalho. (2) O QUE VAZA, e e o motivo da regra: a meta-fabrica nao e so codigo, ela carrega os ENDERECOS DA CASA. `federation-*` opera o `members.yaml`, que tem nome de cliente sob NDA e `local_path` de maquina; `marketplace/*` aponta para o repo de publicacao do maestro; `adopt.md` referencia `docs/analysis/`, `docs/applying/` e ADRs que vivem no core PRIVADO. Publicar a fabrica publica a TOPOLOGIA DE QUEM SE ATENDE. (3) O QUE QUEBRA MECANICAMENTE: medido em 2026-09-15, `inventory`, `census` e `kg-inbox` tinham dependencias de layout-core que nao sobrevivem ao empacotamento (o plugin realoca tudo sob ${CLAUDE_PLUGIN_ROOT}); a fabrica tem muito mais disso — `adopt` resolve `$SOURCE_ROOT` por `git rev-parse` SUPONDO que a fonte E o core. O CAMINHO QUE EXISTIRIA: separar a FABRICA (mecanica — copiar, carimbar, semear) da BIOGRAFIA DA FEDERACAO (quem, onde, sob que contrato). Hoje as duas moram juntas, e e essa fusao, nao a fabrica em si, que a REGRA 61 esta de fato barrando. Gatilho: o maestro querer que o Onion se propague sem passar por ele.'
    trace: '.claude/utils/marketplace/verticals/onion.manifest.sh'

