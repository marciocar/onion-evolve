    verified_at: 2026-09-13
    verified_against: 'docs.github.com — Creating a repository from a template, secao comparativa fork vs. template, bloco Commit History; QUOTE verbatim: "A new fork includes the entire commit history of the parent repository, while a repository created from a template starts with a single commit." — ancorada por verificador independente'
    source_tier: 9
    source_kind: primary
    label: 'O GitHub distingue explicitamente fork de template pela HISTORIA: o fork carrega TODA a historia de commits do repositorio pai; o repositorio criado a partir de template nasce com UM unico commit, sem historia. Isto resolve o canal HISTORIA da fronteira — e so ele.'
