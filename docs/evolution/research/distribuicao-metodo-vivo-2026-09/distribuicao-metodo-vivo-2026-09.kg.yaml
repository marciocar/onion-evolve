    source_tier: 9
    source_kind: primary
    label: 'Repositorio criado a partir de template NAO fica ligado ao template de origem: as branches nascem com historias nao-relacionadas, o que torna impossivel abrir PR ou fazer merge entre eles. Consequencia direta para esta rodada: escolher TEMPLATE e escolher, no mesmo ato, ficar SEM canal de atualizacao por git — template e update-por-merge sao mutuamente exclusivos.'
