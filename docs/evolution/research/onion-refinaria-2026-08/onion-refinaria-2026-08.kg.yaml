    verified_at: 2026-08-06
    verified_against: contagem-derivados-vs-bruto-53-grafos
    label: "A METAFORA TEM TRES TERMOS, e o buraco esta no terceiro: BRUTO (2.049 nos, de sobra) -> REFINO (existe e e BARATO: kg-radar em 1 grafo = 16ms) -> MOTOR (NAO EXISTE). Medido: 3 de 53 grafos tem qualquer derivado publicado (5,7%); ~76 de 2.049 nos aparecem individualmente num derivado (3,7%); commits de refino vs de bruto = 3:130. Os ~5 casos de decisao-por-derivado sao TODOS de sessoes que estavam CONSTRUINDO o instrumento — dogfood do refinador, nao consumo do refinado. VEREDITO: 'o que falta nao e uma refinaria melhor — e um MOTOR QUE PECA GASOLINA'. Consequencia de desenho: derivado sem consumidor nomeado nao entra no menu; vira pergunta"
    trace: "docs/evolution/research/onion-refinaria-2026-08/SYNTHESIS.md"

