  note: >
    W3 + execucao da leva 1. O maestro reenquadrou o metodo ("uma negativa deve vir com SUGESTAO DE
    SUPERACAO — por isso criamos o Elenxo") e a metafora ("os dados sao petroleo; os DERIVADOS valem
    mais; carro a gasolina nao anda com petroleo puro"), que tem TRES termos: bruto -> refino -> MOTOR.
    O W3 (12 workers) devolveu MENU de 9 itens com superacao para cada refutado — 24 vereditos, ZERO
    sem superacao. O maestro escolheu a ordem e cortou a leva em M1-M4+M7. Esta pesquisa registra o
    menu, o que foi EXECUTADO e o que foi MEDIDO. Projecao: SYNTHESIS.md.

