  - id: Q_lint_granularidade_por_secao
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.8
    verified_at: 2026-08-06
    verified_against: "cronometragem-3-rodadas-lint-artifacts-e-10-sub-scripts"
    label: "GUARDA DO MAESTRO (2026-08-06): 'em algum momento vamos precisar rever nossos lint-*.sh, se realmente e necessario rodar TODO ou se e possivel rodar somente as SECOES afetadas. A estrategia do mecanismo pode ser revisada e TEM QUE SER PROVADO, NAO PODE SER ACHISMO'. PULL DATADO, com numeros medidos: (a) rodei 606 guardas (lint-selftest.sh, >600s) para validar 5 casos novos; (b) lint-artifacts.sh = 44,1s / 43,4s / 44,7s em 3 rodadas limpas — contra ~16s registrados apos o PR #357, ou seja REGRESSAO de ~2,75x que ninguem mediu porque o numero historico so existe em memoria de sessao, NAO no repo; (c) a leva tocou 14 arquivos. ONDE ESTA O TEMPO (medido): a soma dos 10 sub-scripts invocados e ~9,2s (21%) — kb-vendored-link-check 3,0s · graph 1,2s · doctrine-freshness 1,2s · kg-radar-integrity 0,9s · projection-safety 0,9s — logo ~35s (79%) estao nas guardas INLINE do proprio lint-artifacts.sh (2.800 linhas, 53 regras). CONSEQUENCIA DE DESENHO: 'rodar so a secao afetada' NAO e pular sub-script; e fatiar o script principal, onde a granularidade NAO e limpa como as 84 funcoes run_*_selftests do selftest. O que FALTA e a PROVA, e ela e o gate: (1) medir que fracao das guardas uma mudanca tipica afeta; (2) provar que a execucao parcial NAO PERDE NADA — rodar o completo em paralelo e comparar vereditos por N rodadas antes de confiar; (3) so entao trocar. Sem (2), 'rodar so a secao' e achismo com cara de otimizacao — o modo de falha exato que esta casa ja mediu: verde que nao verificou"

