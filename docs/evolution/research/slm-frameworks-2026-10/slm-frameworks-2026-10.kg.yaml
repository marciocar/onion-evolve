    node_type: claim
    plane: DEV
    status: open
    impact: 3
    confidence: 0.55
    label: 'LEITURA — PRODUTO (resultado final POSSÍVEL, proposta do Onion — nenhuma fonte o fecha). ENTRA: o especialista que passou no MVP (ou o pronto, se o ajuste nunca abriu). FAZ: instrumentar as chamadas em uso (NVIDIA S1) e devolver os erros novos ao eval selado — laço que re-abre o spike quando surgem modos de falha novos. O molde NVIDIA S1-S5 entra INVERTIDO: lá a tarefa emerge dos logs; aqui foi escolhida antes; e o S2 (remover PII antes de especializar) é circular quando a tarefa É o detector de PII. RESULTADO FINAL POSSÍVEL: uma ferramenta de conjunto fechado plugada por SDAAL e julgada pelo gate determinístico — o modelo é substituível, o mecanismo (eval selado + corretor + radar) é o que fica.'

