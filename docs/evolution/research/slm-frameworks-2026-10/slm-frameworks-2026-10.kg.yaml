  # ── LEITURAS DE SÍNTESE: o roteiro gradual por etapa (cunhagem do Onion sobre a ordem das fontes) ──
  - id: C_ROADMAP_VOCAB_IS_ONION_COINAGE
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    label: 'LEITURA (declaração de autoria): o vocabulário spike → PoC → MVP → produto e o mapeamento das fontes nele são CUNHAGEM DO ONION (maestro, 2026-10-05), não framework do Hugging Face nem de outra fonte — nenhuma das 9 usa esses termos. O que as fontes dão é ORDEM (decidir se treina → instrumentar e medir → medir pronto → ajustar só se falhar → instrumentar o uso) e camadas de avaliação; a costura em etapas com entradas/saídas é nossa e deve ser citada assim (memória declare-onion-coinages).'

  - id: C_STAGE0_GATE_BEFORE_ANY_MODEL
    node_type: claim
    plane: DEV
    status: open
    impact: 5
    confidence: 0.75
    label: 'LEITURA — PORTA 0 (antes de qualquer modelo). ENTRA: a pergunta "precisa de ML?" e os erros REAIS que o corpus já rotula (refuted/superseded/drifted com aresta nomeada). FAZ: análise de erros decide o que avaliar (Hamel); critérios de sucesso mensuráveis antes do eval (Anthropic); métricas e instrumentação antes de formalizar ML (Google R2); heurística/determinístico como ponto de partida (Google R1); harness testável à parte do modelo (Google R5). SAI: eval selado (gabarito de nós selados) + corretor determinístico + critérios escritos. PASSA quando: o eval existe, roda no harness e foi inspecionado à mão (≥50 amostras, guidebook). EXEMPLO ESPERADO (proposta do Onion, não das fontes): um arquivo de casos com o veredito selado e um script que devolve P/R por tipo — o L1 do Hamel no papel do gate determinístico.'

  - id: C_SPIKE_MEASURE_READY_SPECIALISTS
    node_type: claim
    plane: DEV
    status: open
    impact: 5
    confidence: 0.7
    label: 'LEITURA — SPIKE (dias, não semanas; Smol "a few days"). ENTRA: o eval selado da porta 0 + os 4 especialistas prontos (OpenAI Privacy Filter, GLiNER2-PII, NuExtract 3, GLiNER2.5) + o baseline do caminho atual. FAZ: medição ZERO-SHOT, uma variável por vez (Smol), resultado amostra a amostra. EXIGE: cada especialista expor SCORE contínuo (para PR-AUC, Yan). SAI: tabela recall/precision por tipo de entidade + PR-AUC + custo de inferência MEDIDO na VPS + a lista dos erros que cada um comete. PASSA quando: o maestro decide, sobre a tabela, se algum especialista atende ao critério da porta 0 — sem limiar das fontes. NÃO PASSA: se nenhum atende → só então o caminho de ajuste abre (HF Course: SFT depois que o pronto não basta). Operacionaliza Q_SLM_OPTION_C_EVAL_STARTS_WITH_OFF_THE_SHELF.'

