    plane: DEV
    status: open
    impact: 4
    confidence: 0.65
    label: 'LEITURA — MVP / AJUSTE (só se o eval FALHAR no spike ou na PoC). ENTRA: pares entrada/saída DE TREINO separados do eval selado (HF Course; o selado nunca vira treino); base ou especialista escolhido. FAZ: LoRA com rank pequeno (4-8), loss monitorada, validação e comparação com baseline (HF Course 11/4), uma variável por vez (Smol); quase todo o trabalho é montar dados (Hamel). SAI: especialista ajustado medido NO MESMO eval selado contra o pronto. PASSA quando: supera o pronto no critério que o maestro fixou — nenhuma fonte dá o número. Esqueleto S5 da NVIDIA aproveitável; gate de aceitação ausente nela.'

