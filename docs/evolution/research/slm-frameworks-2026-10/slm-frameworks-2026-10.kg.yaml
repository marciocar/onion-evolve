    label: 'LEITURA (temporalidade do "não treinar agora"): o Hamel mostra que, COM eval, o ajuste fica barato (99% do trabalho é montar dados). Logo "não treinar agora" vale ENQUANTO o eval não existe, e deve ser re-aberto quando o eval rodar — não selado para sempre. É coerente com a forma vigente de D_NANOCHAT_ONION_DOMAIN_TRAINING_2026_10 (fine-tune só após eval que falhe); não a revisa, explicita o gatilho.'

