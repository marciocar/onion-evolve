  - id: C_LLM_JUDGE_VETOED_SINGLE_ANNOTATOR
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.75
    label: 'LEITURA (veto): LLM-as-judge NÃO serve de gate em etapa nenhuma enquanto o Onion tiver um rotulador só. A calibração exige correlação LLM-humano ≈ humano-humano (Yan), e medir humano-humano exige pelo menos dois anotadores. O gabarito do Onion fica no corretor determinístico sobre nós selados; juiz LLM, se entrar, é sinal auxiliar, não gate.'

  - id: C_LIGHTEVAL_IS_CANDIDATE_NOT_CHOICE
    node_type: claim
    plane: DEV
    status: open
    impact: 3
    confidence: 0.7
    label: 'LEITURA (instrumento): o lighteval é CANDIDATO a validar no spike, não o harness escolhido. A favor: tarefa e métrica customizáveis (SampleLevelMetric) e resultado amostra a amostra. Contra, não medido: rodar especialistas de span/token (os backends são de LMs generativos), aceitar dataset LOCAL sem hf_repo, e o custo do adaptador Doc ↔ spans. A alternativa é harness próprio em Python/shell — a metade agnóstica que já é o fosso do Onion. O spike decide pelo custo medido dos dois.'

  - id: C_COST_ARGUMENTS_NOT_THE_RULER
    node_type: claim
    plane: DEV
    status: open
    impact: 3
    confidence: 0.75
    label: 'LEITURA (o que NÃO sustenta o roteiro): os argumentos de CUSTO desta rodada não servem de critério. Os 161k GPU-h do Smol são de PRÉ-TREINO (erro de categoria aplicá-los a um LoRA); o gate econômico do HF Course conflita com a régua eficiência e eficácia (efficiency-over-economy) e o custo do caminho atual nunca foi medido. O argumento válido para "não treinar agora" é de ORDEM (eval antes), não de custo.'

  - id: C_NO_TRAIN_HOLDS_ONLY_WHILE_NO_EVAL
