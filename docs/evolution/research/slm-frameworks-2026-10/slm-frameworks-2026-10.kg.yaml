o gabarito" (desloca o contraste; omite "when possible"); [nvidia] laço S6 que "veta F1 genérico" (F1 não aparece; o paper não veta nada sobre gates). TIER: hamel, anthropic e nvidia sem tier declarado pelo leitor — campo AUSENTE; valid_from não declarado por nenhum leitor. FECHA PARCIALMENTE uma omissão do corpus: o Smol Training Playbook, OMITIDO na rodada onion-slm-2026-10, foi lido (eixo "quando treinar"; ablações sem transferência). LACUNAS QUE CONTINUAM ABERTAS (gapsOpen do Elenxo): (1) Smol: re-ancorar as passagens que sustentam eval-antes-de-treinar; (2) guidebook: LLM-as-judge (avaliar o avaliador, 50 de baseline, limiar), dados sintéticos e o "~100 amostras mínimo" sem âncora; (3) Anthropic: "develop test cases" com as 4 claims rejeitadas; (4) lighteval: serventia para modelos NÃO generativos (span/token) não provada; dataset local/privado sem âncora (hf_repo) em tensão com contaminação; (5) HF Course: gate pós-treino rejeitado, nenhum critério numérico; (6) NVIDIA: zero gates de aceitação e molde invertido (tarefa escolhida antes dos logs; S2 depende do próprio detector de PII); (7) TRANSVERSAL: nenhuma fonte usa spike → PoC → MVP → produto — cunhagem do Onion a declarar com autoria e data; (8) TRANSVERSAL: "resultado final possível" e "exemplos esperados" por etapa NÃO fechados por fonte nenhuma; (9) TRANSVERSAL: nenhum critério NUMÉRICO de passagem em nenhuma das 9 fontes; o único gate explícito é qualitativo (Google, Fase II); (10) TRANSVERSAL: o eixo invariante de MERCADO/CAPITAL e de trajetória de ferramentas (lighteval × alternativas) está AUSENTE desta rodada — cláusula 4 da doutrina de pesquisa não cumprida; (11) Q_SLM_OPTION_C_EVAL_STARTS_WITH_OFF_THE_SHELF segue open — nenhum especialista foi MEDIDO, a rodada só reuniu método; (12) Q_EVAL_DE_DOMINIO_DO_ONION segue open — sem tamanho mínimo ancorado, sem segundo rotulador, sem política de exclusão da porta onion-core para o eval selado.'
