  - id: D_ISOLATE_CHAT_AGENT_FROM_TRUST_ROOT
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    verified_at: "2026-10-15"
    verified_against: "NÃO SELADA: aguarda o maestro selar os degraus 1–3. Recomendação do Elenxo é afirmação de um agente sem votação. A lacuna (f) (agent-sdk/hosting e CVE-2026-39861 não lidos) foi FECHADA pela rodada de primárias wf_8847e3af-370 (E_LACUNAS_PRIMARIES_CHAT_AGENT_ISOLATION_1015); a recomendação vigente é C_RECOMENDACAO_ELENXO_PRIMARIES_1015, e o selo parcial de 2026-10-16 é D_MAESTRO_DEGRAU0_E_TRES_PROVAS_1016."
    label: "DECISÃO ABERTA: isolar o agente do /chat por (0) convidado sem Bash, (1) systemd reescrito, (2) UID separado, (3) sandbox estrito, (4) microVM, (5) broker estreito? Elenxo: 2 como estado final em degraus 0→1→2, 5 sobre a 2, 3 com 3 condições, 4 fora."
    narrative: "RECOMENDAÇÃO DO ELENXO (íntegra; afirmação de UM agente, sem votação): a opção 2 como estado final, implantada em degraus, com a opção 5 estreita em cima dela. A opção 1 só vale reescrita: sem o EnvironmentFile e com o escopo ampliado. A opção 3 só entra com três condições. A opção 4 sai desta VPS. DEGRAU 0 (hoje, sem root): tirar o Bash dos convidados (o tools do convidado sem Bash). Esse é o fechamento que o próprio src/chat.ts:304 já nomeia. Junto, acrescentar deny Edit/Write no home do onion fora do workspace, para que um convidado não consiga reescrever o código do bridge nem o .claude do home. DEGRAU 1 (root uma vez, a opção 1 reescrita): NÃO usar EnvironmentFile=. Ele leva o segredo M2M para o environ do processo no procfs, que o mesmo UID lê (medido); o loadEnvFile atual é melhor. Usar ReadOnlyPaths=, voltado à integridade, em src/, node_modules/ e web/ do bridge, nos .claude/settings*.json do home, .bashrc, .profile, .gitconfig, jwks/ e members.yaml. Usar InaccessiblePaths= no .ssh e no .git-credentials do home depois de medir que o serviço não usa os dois (o core é público, então o PAT provavelmente não é necessário: apagar é melhor que esconder). Antes do restart, medir as escritas de um chat real, porque o 203/EXEC de 08-10 já aconteceu. DEGRAU 2 (o estado final, opção 2): um unit separado para o runner do agente, de preferência um template por sessão com DynamicUser= ou User=onion-chat, plugado pela costura spawnClaudeCodeProcess (sdk.d.ts:2132 da 0.3.232, sem trocar de SDK). O home do onion é 0750, então o UID separado perde .env, PAT, .ssh, jwks e a fila por construção, sem lista. A ANTHROPIC_API_KEY vai por ANTHROPIC_BASE_URL para um proxy na frente (a opção 5 estreita, que fecha o resíduo P0-7), e o git do agente passa por uma ferramenta na frente. DEGRAU 3 (opção 3, defense-in-depth): só com o perfil AppArmor do bwrap (root; hoje o bwrap FALHA na VPS por apparmor_restrict_unprivileged_userns=1), failIfUnavailable=true e allowUnsandboxedCommands=false. Sem as três, ela vira fail-open em silêncio, e no bypass do admin o retry sem sandbox roda sem prompt. OPÇÃO 4 fora desta VPS: não há dispositivo kvm e há 0 flags vmx/svm, então Firecracker e Vagrant estão fora. gVisor/Docker exigem root, docker é equivalente a root e esta VPS tem Docker furando o ufw. Fica como degrau opcional atrás da mesma costura, para o adotante cujo host tenha KVM. CONSTRAINTS (as objeções que sobreviveram): (a) mesmo UID não guarda segredo, nem com processo separado; (b) mitigação por lista falha pelo vocabulário: a chave de deploy do .ssh, data/ e o .claude.json ficaram fora da pergunta; (c) o sandbox nativo tem default fail-open e hoje não sobe nesta VPS; (d) a contenção por aprovação do chip não é fronteira, porque o convidado aprova a si mesmo; (e) para o ecossistema, o que se replica é o unit systemd com UID dinâmico mais o proxy, não a microVM; (f) lacuna aberta: a página agent-sdk/hosting da Anthropic e o CVE-2026-39861 não foram lidos, então ler antes de selar. NOTA DO ESCRITOR: o enunciado entregou esta recomendação cortada no DEGRAU 1 ('NÃO usar En'); o texto acima foi recuperado inteiro do journal do run (resposta do Elenxo), não completado de memória. Caminhos de máquina trocados por descrição (REGRA 99, Nó de .kg.yaml sem caminho de máquina, julgado pela classe)."
