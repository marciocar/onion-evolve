  - id: E_SPIKE2_SOCKET_LAUNCHER_DYNAMICUSER_1016
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.8
    verified_at: "2026-10-16"
    verified_against: "socket Accept=yes + template de RUNTIME (tmpfs, removido ao fim) com DynamicUser, User=onion-chat-%i, ProtectHome=yes, ProtectProc=invisible, RuntimeMaxSec=20; harness do SDK 0.3.232 como a conta do serviço, spawnClaudeCodeProcess sobre a conexão; ANTHROPIC_BASE_URL numa porta fechada (zero chamada à API)"
    label: "SPIKE 2: o lançador por socket sobe o CLI 2.1.232 sob um UID dinâmico POR CONEXÃO e o SDK completa o init por spawnClaudeCodeProcess, sem a home do serviço. CONFIRMA o mecanismo do degrau 2 e CORRIGE três peças: User por instância, CollectMode e o teardown."
    narrative: "Medido em 2026-10-16. (1) systemd-run NÃO faz Accept=yes ('Failed to set socket on service: Invalid argument': a unit transitória não é template); o spike usou socket + template de runtime no diretório volátil de units, removidos ao fim (0 unit e 0 arquivo restantes). (2) CICLO: o init chegou pelo socket (cli 2.1.232); o lançador (python3 -I, lê UMA linha de cabeçalho JSON byte a byte, allowlist de flags e de cwd, ambiente montado por ELE) registrou home do serviço invisível, segredo do bridge negado e o environ do PID 1 invisível. Os argumentos que o SDK entrega ao gancho foram medidos (--output-format, --verbose, --input-format, --max-turns, --tools, --setting-sources, --permission-mode). (3) CORREÇÃO: sem User=, as instâncias SIMULTÂNEAS dividiram o mesmo UID dinâmico (65396 nas duas); com User=onion-chat-%i, duas conexões simultâneas ganharam 62948 e 62991. (4) A allowlist recusou --dangerously-skip-permissions e um cwd fora da raiz (exit 64, conexão fechada em 119 ms). (5) CORREÇÃO: instância que FALHA ficava carregada; CollectMode=inactive-or-failed (seção [Unit]) a recolhe. (6) TEARDOWN: com o CLI ocioso, o EOF do stdin o encerra em 644 ms; com uma requisição em voo, o SDK fechou o stdin, esperou cerca de 2 s e destruiu o stream (o signal não foi abortado), e o CLI SEGUIU vivo até o RuntimeMaxSec matá-lo (status 143 aos 20 s). Logo o corte duro é o RuntimeMaxSec, e o lançador deve SUPERVISIONAR o CLI (não fazer exec) para matá-lo no fim da conexão — mesmo UID, sem o problema de E_OBJECAO_29. ABERTO: o workspace (o estado do bridge em var-lib é 0750 da conta do serviço, inalcançável pelo UID dinâmico; o spike usou o tmp privado), o exit code real (o canal só leva o stream) e o stderr (só no journal); o lançador e as units seguem a instalar pelo root, sem dogfood no bridge real."
    trace: "sondas do scratchpad da sessão: s2/launcher.py, s2/onion-chat-spike.socket, s2/onion-chat-spike@.service, s2/harness.mjs, s2/up.sh e s2/down.sh"
