  - id: E_DEGRAU1_INTEGRITY_DROPIN_ENSAIO_1016
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.8
    verified_at: "2026-10-16"
    verified_against: "namespace do MainPID do bridge (antes); units transitórias com as propriedades da unit de hoje + o 30-integrity.conf renderizado (systemd 255.4); ops/bridge-hardening.sh (core-only) install em ENSAIO no host, rc 0, 0 FALHA (4 placeholders AUSENTES por desenho)"
    label: "DEGRAU 1 ENSAIADO: o drop-in torna só-leitura as duas ÁRVORES (bridge e clone servido) com as escritas do serviço aninhadas graváveis, os dotfiles e placeholders, e esconde .ssh e .git-credentials; 0 EROFS sob strace. CONFIRMA o degrau 1 e CORRIGE o escopo."
    narrative: "Medido em 2026-10-16. ANTES (namespace vivo, como a conta do serviço): src/ do bridge, o jwks/ do clone servido e o .bashrc rw, e o .git-credentials legível. A 1ª forma protegia SUBDIRETÓRIOS (src/, node_modules/, jwks/…) e o refutador a derrubou com prova: com o pai gravável, `mv onion-bridge onion-bridge.old && mkdir -p onion-bridge/src` dava uma árvore nova gravável. CURA medida em sandbox: a raiz de cada árvore como ponto de montagem só-leitura (rename = EBUSY) com ReadWritePaths= ANINHADO nas escritas do serviço (gravou em data/; renomear data/ = EROFS). A árvore inteira também fecha o .git dos dois repositórios (core.fsmonitor e hooks rodam no git do update-bridge, que roda FORA da unit com a chave de deploy e o PAT à vista), o package-lock e o .npmrc de projeto (o npm ci) e os arquivos de confiança que o bridge lê do clone (agent-card, federation-orgs, a2a-verify, jwks, members.yaml). Placeholders criados no --apply para o que não existe e seria lido por algo como a conta do serviço: .claude/settings*.json `{}` (a classe do CVE-2026-25725), o .config da home vazio (o git leria o config XDG) e o .npmrc da home vazio. ESCRITAS DO SERVIÇO (código e mtime): data/, o estado em var-lib, a home (o CLI grava o .claude.json por temp+rename e o .claude/projects), o tmp privado e, no clone, só .claude/sessions e docs/evolution/trust-log.md. ENSAIO (unit transitória, as propriedades da unit de hoje + o drop-in): as 2 árvores e 3 dotfiles só-leitura E pontos de montagem próprios, .ssh e .git-credentials ilegíveis, as 8 escritas graváveis, o tsx transpila src/health.ts; sob strace, um turno do SDK (chave inválida, HOME descartável) fez 0 EROFS. ReadOnlyPaths= de caminho ausente sem '-' derruba o start com 226/NAMESPACE (medido), daí o '-' com o verify acusando a ausência; o bind de ARQUIVO some dentro da unit quando o arquivo é trocado por rename POR FORA (medido; o de diretório resiste), e o update-bridge para a unit antes do reset e chama o verify depois. Sem EnvironmentFile= (E_OBJECAO_01) e SEM guardar segredo: o .env e o environ seguem legíveis no mesmo UID. 2ª PASSADA DO REFUTADOR (curada): um symlink num componente do MEIO de uma exceção gravável a desviava para dentro da raiz de confiança (provado; só plantável antes do install) — o pré-voo passou a exigir que o caminho resolvido seja o literal e o verify confere um a um os arquivos de confiança concretos (src/server.ts, package-lock, a2a-verify.sh, jwks/, trust-topology-check.sh, members.yaml, .git/config); o .local/bin da home (entra no PATH do .profile) e o .bash_profile (vence o .profile no login; o placeholder só o encadeia) viraram placeholders. TETO DECLARADO (não coberto pelo degrau 1): data/ segue gravável inteiro, e lá mora o arquivo de convites A2A que o serviço só LÊ (quem grava é o wrapper de convites, fora da unit) — o agente no mesmo UID ainda cunharia convites; a cura é mover o que o serviço só lê para um subdiretório só-leitura aninhado (mudança no bridge) ou o degrau 2. Renomear o .claude da home (gravável) tira o bind dos settings*.json, de impacto baixo porque o SDK carrega só settingSources project. O ensaio não monta os placeholders (ausentes até o --apply). NÃO MEDIDO: o --apply no serviço real, um chat real e um POST /a2a com o drop-in ativo, e o que o CLI escreveria numa versão futura (o verify depois de cada update é a rede); o .cache e o resto do .local da home seguem graváveis (sem consumidor medido fora da unit)."
    trace: "ops/bridge-hardening.sh (core-only) install e verify; sondas do scratchpad da sessão: run-d1.sh, run-d1b.sh, run-d1c.sh, run-d1-sdk.sh, run-d1-tsx.sh"
    provenance:
