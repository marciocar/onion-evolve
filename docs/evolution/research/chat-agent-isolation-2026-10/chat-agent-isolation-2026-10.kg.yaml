    narrative: "Medido em 2026-10-16. (1) kernel.apparmor_restrict_unprivileged_userns = 1; apparmor 4.0.1; bubblewrap 0.9.0 sem setuid. O bwrap falha mesmo SEM --unshare-user (o não-setuid sempre cria userns), e o audit do kernel mostra o mecanismo: userns_create transita o processo para o perfil unprivileged_userns, que NEGA capability setpcap e a escrita no uid_map. (2) socat ausente (candidato 1.8.0.0-4ubuntu0.1): dependência do sandbox além do bwrap (E_PROVA3). (3) Nenhum perfil de bwrap carregado; 117 perfis carregados, 90 em modo unconfined; no diretório de perfis, 90 arquivos flags=(unconfined) e 92 com userns. SUPERFÍCIE JÁ ABERTA: o perfil runc é unconfined com userns e o binário dele EXISTE no host (vem com o Docker), então a restrição de userns já tem um contorno instalado — não exercitado. (4) resolveSettings() com managedSettings {sandbox: enabled, failIfUnavailable, allowUnsandboxedCommands:false, bwrapPath, socatPath} devolveu o sandbox efetivo SEM bwrapPath e SEM socatPath (filtro restrictive-only do tier do pai). Logo a cópia privada por bwrapPath exige o managed-settings.json do sistema (root; ele não existe hoje), que se aplica a TODO Claude Code do host — inclusive as sessões do maestro —, e com ele o managedSettings do bridge só entra com parentSettingsBehavior 'merge'. ALTERNATIVA (hipótese, NÃO medida): no degrau 2 cada instância tem namespace próprio; um bwrap privado ligado por BindReadOnlyPaths num caminho que só existe ali, achado pelo PATH que o lançador monta, e um perfil preso a esse caminho, sem managed-settings do sistema. PASSO DE INSTALAÇÃO PARA O MAESTRO (root, NÃO executado): instalar o socat; copiar o bwrap para um diretório de libexec privado do runner; um perfil com abi 4.0, include de tunables/global, flags=(unconfined) e a regra 'userns,' preso a esse caminho; apparmor_parser -r; provar com o bwrap rodando como o UID do runner; só então ligar o sandbox por Options.sandbox com failIfUnavailable:true e allowUnsandboxedCommands:false explícitos."
    trace: "sonda do scratchpad da sessão: s3-resolve.mjs; sysctl kernel.apparmor_restrict_unprivileged_userns; aa-status; journalctl -k (audit do apparmor)"
    provenance:
