      locator: "systemd-run --pipe --wait --collect com ReadOnlyPaths=/ReadWritePaths=/InaccessiblePaths=; nsenter no MainPID; strace -f de query() e do tsx"
      method: "medição: units transitórias, test -w/test -r (access), findmnt OPTIONS e TARGET, sem escrever em caminho servido; strace contando EROFS"
