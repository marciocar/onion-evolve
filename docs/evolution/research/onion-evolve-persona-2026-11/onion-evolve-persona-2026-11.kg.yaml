    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    label: "Sessão dedicada à Persona do Onion Evolve: qual o termo de mercado/academia em nov/2026, que padrões e casos reais existem, que riscos foram medidos e qual MVP cabe no Onion (KG-SSOT first, SDAAL, dogfood, Elenxo, batuta)?"
    narrative: "Pergunta do run em modo primárias (2026-11-26). A sessão trabalha exclusivamente para evoluir o Onion e fechar pontas soltas; é ativa, propositiva, organizada e executiva; prioriza por dor real com evidência; confere cronogramas; ajuda quem orquestra com a batuta; faz autodescoberta (até ~30 ciclos) antes de começar; decide com Personas (humanas inclusive) por decisão adversarial independente, sem deixar de cumprir o que o maestro diz. Perguntas: (1) termo de mercado e academia (agentic? AI chief of staff? agentic product owner? autonomous steward?); (2) padrões e casos reais (governança, wake triggers, charter, autodescoberta, limites de autonomia, independência do refutador); (3) riscos e falhas medidos (agente que gerencia negócio, autoaperfeiçoamento, captura pelo proponente); (4) desenho mínimo (MVP). Corpus prévio: nada sobre chief of staff, agentic product owner ou persona autônoma em 284 grafos; adjacências C_COLLAPSE_ROOT, C_COLLAPSE_CREATES e D_NEED_REFUTADOR (interface-state-of-art), baton-doctrine e /meta:decide Delphi."
    trace: "run /onion-research em modo primárias de 2026-11-26; pergunta computada pelo workflow a partir do pedido do maestro de 2026-11-26 (sala de criação, Persona com Eficiência e Eficácia); vista em docs/evolution/research/onion-evolve-persona-2026-11/SYNTHESIS.md"
