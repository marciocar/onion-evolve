gth nem limiar. Hennink dá o TOTAL (9-17), e os números de Guest (6+2 a ≤5%, 11+2 a 16+3 a 0%) foram rejeitados. 'Nada novo' é o limiar de 0%, o mais caro, e ciclos do mesmo modelo não são informantes independentes. O 3 entra como parâmetro DECLARADO do maestro, não como valor com base, e o 1º ciclo deve medir a curva de novidade antes de fixá-lo. (3) Avaliador de novidade externo: nenhuma fonte ancorada mostra um funcionando. A referência canônica, o AI Scientist, é autoavaliada. A decisão do maestro (refutador de outro modelo e outro contexto) não foi medida como medidor de novidade, e E_OBJECAO_18 se estende a ela. O descarte da claim inteira do arXiv por causa do sub-número 43 volta como objeção E3 sobrevivente."
