    verified_against: 'SELADO PELO MAESTRO em 2026-09-25, por escolha explicita num formulario de decisao que apresentou as opcoes NOMEADAS e a recomendacao de cada uma; o texto da escolha esta no `label` deste no. A verificacao aqui e o ATO DE DECIDIR, nao uma medicao contra o vivo: decisao nao se mede, se toma — e o que se registra e QUEM decidiu, QUANDO, e com quais opcoes na mesa.'
    impact: 5
    confidence: 0.5
    label: 'DECISAO ABERTA (o maestro sela): qual motor de OCR local adotar para as 26 paginas do SEI sob NDA, sendo 3 vinculantes? Opcoes nomeadas — (1) Tesseract 5 via apt com por.traineddata do tessdata_best (TSV com conf+bbox por palavra, ~10MB, zero dependencia Python); (2) PaddleOCR / PaddleOCR-VL 0.9B em CPU, venv isolado; (3) docTR (python-doctr + torch) em venv isolado; (4) Surya (datalab-to), pendente de reconciliar evidencia contraditoria e a licenca GPL-3.0; (5) dots.ocr / dots.mocr 3B em CPU, sem flash-attn/vLLM (que nao instalam sem GPU); (6) MinerU 2.5 / olmOCR; (7) Docling (IBM, Apache-2.0), ausente do escopo original e vencedor em tabela no unico benchmark tocado; (8) baseline SEM OCR — pdftotext -layout / pdfimages para checar camada de texto pagina a pagina; (9) PROCEDIMENTO: consenso de 2 motores arquiteturalmente independentes + revisao humana de 100% das paginas vinculantes. RECOMENDACAO DO ELENXO: **NAO escolher motor a partir deste dossie — a evidencia nao sustenta a escolha.** Escolher o PROCEDIMENTO (9) e deixar o motor ser decidido por MEDICAO LOCAL, nesta ordem. **PASSO 0, antes de qualquer instalacao: olhar o artefato.** Ninguem nesta rodada abriu as 26 paginas. PDF do SEI mistura paginas com camada de texto e paginas escaneadas; rodar `pdftotext -layout` e `pdfimages -list` pagina a pagina (poppler 24.02 JA instalado, custo zero, dependency-light intacto) e descobrir se as 3 paginas VINCULANTES precisam de OCR — se tiverem camada de texto, a decisao inteira EVAPORA (opcao 8). **PASSO 1, se precisarem:** o requisito dominante e "erro em silencio produz superacao errada", e o unico eixo que separa os candidatos nesse requisito e ARQUITETURA, nao benchmark: pipeline multi-estagio (deteccao -> recorte -> reconhecimento) degrada com caixa sem texto e confianca baixa por palavra; decoder autorregressivo fim-a-fim COMPLETA o texto plausivel sob oclusao, em prosa fluente e sem sinal (E_OBJECAO_1). Isso empurra o peso para (1) Tesseract com TSV conf+bbox por palavra — nao por ser melhor em acuracia media, mas por ser o unico candidato cuja falha e VISIVEL na saida — e REPROVA (5) como motor unico sobre as paginas vinculantes. **PASSO 2:** o consenso de (9) so vale entre motores de LINHAGEM DIFERENTE; PaddleOCR-VL, dots.ocr e MinerU 2.5 sao VLMs de backbone e dados sinteticos proximos (familia Qwen-VL) e erram JUNTOS com confianca no mesmo trecho ocluido (E_OBJECAO_2), o que anula o sinal exatamente onde ele e necessario. Consenso util = 1 pipeline classico (Tesseract) x 1 VLM, com divergencia roteada para o humano. **PASSO 3:** as 3 paginas vinculantes recebem revisao humana de 100% INDEPENDENTE do motor — em corpus de 26 paginas o throughput nao existe como criterio, e nenhuma metrica automatica substitui o olho num artefato que SUPERA clausula de edital. CONDICAO PARA FECHAR ESTA DECISAO (nao data): (i) saida do Passo 0 sobre o corpus real; (ii) contagem de erros de pelo menos 2 motores nas 3 paginas vinculantes; (iii) `pip install --dry-run` de cada candidato NESTE venv, para o requisito (c) sair da impressao. Ate la, nenhuma das 7 opcoes de motor esta madura para selo, e (4) Surya nao pode sustentar recomendacao nenhuma porque seu corpo de evidencia e mutuamente contraditorio e nao foi reconciliado. ══ SELADO pelo maestro 2026-09-25 — OPÇÃO (1): Tesseract 5 via apt com por.traineddata do tessdata_best. O critério foi o PERFIL DO PROBLEMA, não a qualidade máxima em abstrato: 26 páginas não justificam stack de ML, e o que as 3 páginas VINCULANTES exigem é confiança por palavra para conferência humana — que é exatamente o que o TSV com conf+bbox entrega, com ~10MB e zero dependência Python. Docling (IBM, Apache-2.0) ficou nomeado como o próximo degrau, não descartado: ele venceu em TABELA no único benchmark que a rodada tocou, e edital costuma ter tabela. GATILHO DE REVISITA, objetivo: se alguma das 3 vinculantes sair com confiança baixa no TSV, subir para Docling e registrar o motivo MEDIDO — a decisão é reversível de propósito, e o barato-primeiro só é defensável porque o corpus é pequeno o bastante para reprocessar.'
