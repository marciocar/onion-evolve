meta:
  id: email-logto-2026-08
  schema_version: "1"
  layer: audit
  baseline: 2026-08-01
  date: 2026-08-01
  note: >
    F1-email da investigação de ferramentas VPS: conectores do Logto 1.41, providers de email
    transacional (preço/free-tier/webhook verificados 2026) e deliverability em VPS. Achados
    centrais: (1) a premissa "falta de conector TRAVOU o convite" é PARCIALMENTE FALSA — o Logto
    cria convite sem conector (messagePayload:false); (2) email é SCRIPT, não SDAAL — falha o
    Teste do Eixo nos dois níveis; (3) o DISSENT contradiz a recomendação e invoca a régua do
    maestro (efficiency-over-economy). Projeção: SYNTHESIS.md.

nodes:
  - id: E_logto_connectors
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-08-01
    verified_against: docs.logto.io-e-openapi.logto.io-webfetch
    label: "CONECTORES LOGTO (web-verificado): oficiais = SMTP generico, AWS SES, Mailgun, SendGrid, Aliyun, Postmark + HTTP custom. O 'built-in email service' e EXCLUSIVO do Logto CLOUD — self-hosted precisa configurar provider (confirma o gap). Conector SMTP exige host/port(string)/fromEmail/user/pass + templates[] por usageType. SO 1 conector de email ATIVO por tenant. Releases oficiais (docker) ja trazem conectores pre-embutidos. Email usado em 9 usageTypes (SignIn/Register/ForgotPassword/OrganizationInvitation/BindNewIdentifier/MfaVerification/BindMfa/UserPermissionValidation/Generic)"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: C_premise_partially_false
    node_type: claim
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: 2026-08-01
    verified_against: openapi.logto.io-operation-createorganizationinvitation
    label: "CORRECAO DE PREMISSA: a premissa registrada ('a falta de conector de email TRAVOU o convite de organizacao') e PARCIALMENTE FALSA. O Logto CRIA o convite SEM conector — POST /api/organizations/{id}/invitations com messagePayload:false retorna o id p/ entrega manual. Sem conector so o ENVIO AUTOMATICO falha (501 'No email connector is configured'). EMAIL E ACELERADOR DE ENTREGA, NAO PRE-REQUISITO DO CONVITE — e o --enroll que o gap forcou e o modo degradado LEGITIMO (o Null Object nativo do canal), a MANTER, nao a descartar"
    trace: "docs/onion/graph/m2-bridge-logto-2026-07.kg.yaml"

  - id: D_email_is_script_not_sdaal
    node_type: decision
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: 2026-08-01
    verified_against: teste-do-eixo-aplicado-as-duas-bocas
    label: "VEREDITO: email e SCRIPT, nao SDAAL — falha nos DOIS niveis. BOCA (a) conector do Logto: condicao (a) PASSA (providers intercambiaveis POR CONSTRUCAO — o contrato ja existe e se chama SMTP/RFC5321), mas (b) FALHA (a escolha vive no DB do Logto, nao no .env; 1 conector ativo por tenant = sem selecao em runtime) e (c) FALHA POR VACUIDADE (o consumidor e o LOGTO, que nao e nosso codigo e JA e cego). Envolver isso em interface+factory = RE-EMBRULHAR abstracao existente. BOCA (b) ferramenta de membro: (a) falha duro — ZERO solucao real hoje; ligar a 1a leva 0->1. NIVEL-1 tambem nao gradua: o ntfy e curl HARDCODED em mail-receiver.sh:59-66, nao adapter; somar script de email da DOIS SCRIPTS, nao dois adapters"
    trace: "docs/knowledge-base/concepts/onion-abstraction-doctrine.md"

  - id: D_no_self_host_mta
    node_type: decision
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-08-01
    verified_against: hostinger-rate-limit-mais-consenso-de-deliverability
    label: "NAO self-hospedar MTA de saida na VPS. Tres razoes MEDIDAS: (1) Hostinger limita 5 EMAILS/MIN (hostinger.com/support/7854530) — baixo p/ rajada de convites; (2) IP de datacenter frio e estruturalmente desconfiado por Gmail/Outlook/Yahoo (consenso qualitativo forte, sem taxa numerica publicada — declarado); (3) SEM webhook de bounce/complaint — bounces voltam como NDR a parsear a mao. 'Um convite de auth que cai no spam e um convite SILENCIOSAMENTE QUEBRADO' — o modo de falha exato da licao do whatsapp"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: D_ack_from_provider_not_logto
    node_type: decision
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.85
    verified_at: 2026-08-01
    verified_against: licao-do-whatsapp-aplicada-ao-email
    label: "A LICAO DO WHATSAPP REENCENADA: o Logto e FIRE-AND-FORGET (Nodemailer, sem ACK nativo — hipotese nao refutada). Logo A PROVA DE ENTREGA VEM DO WEBHOOK DO PROVIDER, fora do Logto (email.delivered/bounced/complained), COM IDEMPOTENCIA (o Resend pode duplicar evento). Sem isso 'o convite foi enviado' e DECLARACAO, nao medicao. E o 'Send test email' do console prova SO o aceite SMTP 250 — o teste real e o convite caindo na INBOX de duas caixas distintas (Gmail + Outlook)"
    trace: "docs/evolution/research/waha-adapter-2026-07/waha-adapter-2026-07.kg.yaml"

  - id: D_dns_is_critical_path
    node_type: decision
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-08-01
    verified_against: requisitos-gmail-yahoo-2024-mais-propagacao-dns
    label: "O CAMINHO CRITICO E DNS, NAO O LOGTO: SPF+DKIM obrigatorios na pratica, DMARC comecando em p=none, PROPAGACAO 24-48h, so entao subir enforcement. A config do conector leva 10 MINUTOS. Enviar de SUBDOMINIO DEDICADO (mail.onionevolve.com), nao do apex — isola reputacao transacional e deixa o apex livre p/ MX humano. ATUALIZADO 2026-08-01: o GAP do 'DNS nunca verificado' FOI FECHADO (zona lida: 26 registros, ZERO TXT/MX — campo limpo, sem SPF conflitante). E a estimativa de 24-48h se provou CONSERVADORA DEMAIS p/ zona limpa com TTL 300: propagou IMEDIATAMENTE e o Postmark verificou DKIM+ReturnPath na 1a tentativa. A ordem 'DNS primeiro' continua correta; so o PRAZO estava superestimado"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: Q_provider_resend_vs_postmark
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 1.0
    label: "DECISAO DO MAESTRO (a sintese e o dissent DIVERGEM): RESEND (3.000/mes gratis, sem branding, logs 30d, webhooks ricos) vs POSTMARK (US$15/mes; free permanente 100/mes; reputacao construida 100% em transacional, RECUSA mala-direta, o que mantem IPs compartilhados limpos). O DISSENT se auto-acusa: 'escolhi otimizando o FREE TIER, e free tier e ECONOMIA — nao eficacia', contra a regra declarada efficiency-over-economy. Para email de AUTENTICACAO, entregabilidade E o produto inteiro — e a pesquisa NAO MEDIU que a Resend entrega tao bem quanto a Postmark. O argumento de volume e CIRCULAR (depende de habilitar sign-in por codigo, decisao nao tomada; sem isso o volume fica <100/mes, coberto pelo free permanente da Postmark)"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: C_gaps_require_deploy_verification
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 1.0
    label: "GAPS QUE SO O DEPLOY RESOLVE (doc != comportamento, a licao ja paga uma vez): (1) conectores realmente pre-embutidos na imagem 1.41.0? (2) usageType OrganizationInvitation existe em 1.41.0? (a doc consultada e 'latest', nao versionada); (3) QUAL O PLACEHOLDER do link de convite? — a doc so documenta {{code}}, mas convite e LINK: template errado PASSA no 'send test email' e entrega convite quebrado; (4) o rate-limit de 5 msg/min da Hostinger vale so p/ porta 25 ou p/ saida SMTP em geral? (testar openssl s_client ANTES; plano B = custom connector HTTP por 443); (5) DNS atual nunca verificado; (6) o Logto tem RETRY se o SMTP falhar ou o convite se perde em silencio?"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  # ── EXECUCAO 2026-08-01: DNS + dominio verificado (comportamento, nao doc) ──
  - id: E_ports_measured
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 4
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: teste-tcp-da-vps-para-smtp.postmarkapp.com
    label: "GAP #4 FECHADO POR MEDICAO: da VPS, porta 587 ABERTA (STARTTLS) e 2525 ABERTA; porta 465 (TLS implicito) BLOQUEADA; 443 aberta (plano B da API HTTP). CONSEQUENCIA DIRETA: o conector SMTP do Logto TEM de usar 587 — o padrao comum 465 teria falhado em silencio. O rate-limit de 5 msg/min da Hostinger e questao SEPARADA (volume, nao conectividade) e segue nao medido"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: E_dns_written_nondestructive
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: hostinger-api-put-overwrite-false-mais-releitura-da-zona
    label: "DNS ESCRITO NA HOSTINGER VIA API, NAO-DESTRUTIVO: zona onionevolve.com foi de 26 -> 30 registros, com os 25 A-records PRESERVADOS (verificado relendo a zona depois). Metodo: backup da zona ANTES + PUT /api/dns/v1/zones com overwrite:FALSE (contrato confirmado por pesquisa: false=append/update, true=deleta os que casam name+type). Criados: DKIM TXT (20260801114651pm._domainkey.mail), Return-Path CNAME (pm-bounces.mail -> pm.mtasv.net), SPF TXT (mail -> v=spf1 include:spf.mtasv.net ~all), DMARC TXT (_dmarc -> v=DMARC1; p=none;). DMARC publicado SEM rua= (nao publicar email pessoal no DNS sem decisao do maestro)"
    trace: "/home/marcio/onion-waha/dns-backup/"

  - id: E_domain_verified
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: postmark-verifyDkim-e-verifyReturnPath-retornaram-True
    label: "DOMINIO mail.onionevolve.com VERIFICADO NO POSTMARK (domain id 8005037): DKIMVerified=True e ReturnPathDomainVerified=True. Propagacao foi IMEDIATA (TTL 300 + zona sem TXT previo) — a estimativa de 24-48h da pesquisa era conservadora demais para uma zona limpa; o caminho critico previsto NAO se materializou. Provider default = POSTMARK (decisao do maestro aplicando efficiency-over-economy: o dissent venceu a sintese)"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: Q_postmark_pending_approval
    node_type: question
    plane: PROD
    status: done
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: erro-412-da-api-em-2-tentativas
    label: "BLOQUEIO ATIVO (medido 2x): a conta Postmark esta PENDING APPROVAL — erro 412 'While your account is pending approval, all recipient addresses must share the same domain as the From address'. Nesse estado so da p/ enviar para @mail.onionevolve.com (que nao tem MX, logo ninguem recebe). IMPEDE o teste que mais importa: convite caindo na INBOX de Gmail/Outlook (a licao do whatsapp: aceite != entrega). ACAO DO MAESTRO: solicitar aprovacao no painel do Postmark. ATRITO DE ONBOARDING QUE A PESQUISA NAO PREVIU — nao muda a decisao (aprovacao e uma vez so), mas e diferenca real vs Resend"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: E_email_delivered_proven
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: postmark-messages-outbound-details-evento-Delivered
    label: "CANAL DE EMAIL PROVADO PONTA A PONTA (nao so aceito): apos a aprovacao da conta, envio p/ marciocar@gmail.com retornou MessageID 0b6d6ffb + Status 'Sent', e o detalhe da mensagem mostra evento **Delivered** com a resposta LITERAL do Google: 'smtp;250 2.0.0 OK ... - gsmtp'. ESTE E O ACK DO EMAIL — o analogo exato do ack=3 READ do whatsapp. A licao foi APLICADA: eu poderia ter parado no MessageID (aceite) e declarado sucesso, que foi exatamente o erro cometido 3x no canal whatsapp. RESSALVA HONESTA: o 250 OK prova ENTREGA AO SERVIDOR, nao INBOX-vs-SPAM — so o humano confirma essa parte"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: C_isolate_variable_method
    node_type: claim
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.9
    verified_at: 2026-08-01
    verified_against: envio-mesmo-dominio-200-vs-externo-412
    label: "METODO QUE RESOLVEU O IMPASSE (o maestro dizia 'nao esta pendente', a API dizia 412): em vez de discutir, ISOLAR A VARIAVEL — enviei p/ o PROPRIO dominio (permitido no estado pendente) e deu ErrorCode 0 + MessageID; p/ gmail deu 412. Isso PROVOU que todo o pipeline (DKIM/RP/SPF/porta 587/token/dominio) estava OK e que a unica trava era a flag de aprovacao DA CONTA — separada da verificacao de DOMINIO (que ja estava True). A confusao era real e nomeavel: o Postmark tem DUAS coisas que parecem 'aprovado'"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: E_inbox_confirmed_by_human
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: confirmacao-humana-do-destinatario
    label: "PROVA FINAL — CAIXA DE ENTRADA, NAO SPAM: os DOIS envios (0b6d6ffb e 5220c9d3) chegaram na caixa NORMAL do Gmail, confirmado pelo destinatario humano. Isto fecha a unica lacuna que NENHUMA API mostra: o evento Delivered + '250 OK' provava entrega AO SERVIDOR; inbox-vs-spam so o humano ve. Dominio NOVO caindo direto na caixa normal = DKIM+SPF+Return-Path alinhados fizeram o trabalho, sem periodo de aquecimento. A cadeia de prova esta COMPLETA: aceite (MessageID) -> entrega ao servidor (evento Delivered) -> INBOX (humano). Os tres degraus sao distintos e so o terceiro decide se o canal serve p/ convite de auth"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: E_connector_live_invite_sent
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: convite-real-201-mais-mensagem-Sent-no-postmark
    label: "GAP ORIGINAL FECHADO: conector SMTP criado no Logto (id 9ajv2zogz065, type Email) via MANAGEMENT API + CONVITE REAL de organizacao criado com messagePayload -> HTTP 201 (antes: 501 'No email connector is configured'), e o email SAIU (visto na fila do Postmark: 'Convite para a federacao Onion', status Sent). Cadeia completa provada: Logto -> conector SMTP (587) -> Postmark -> Gmail. Templates criados p/ 5 usageTypes incluindo OrganizationInvitation"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

  - id: E_five_doc_vs_behavior
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 4
    confidence: 1.0
    verified_at: 2026-08-01
    verified_against: erros-de-validacao-e-404-da-instancia-viva
    label: "CINCO doc!=comportamento numa sessao so (a instancia viva e a SSOT, confirmado na pratica): (1) a Management API TEM CRUD de conector (POST /api/connectors) — a pesquisa marcou como 'nao documentado'; (2) o token M2M da Management API NAO sai do endpoint publico nem do 127.0.0.1:3012 — so de console.onionevolve.com (tenant admin); (3) 'port' e NUMBER, nao string como a doc dizia; (4) a rota de convite e /api/organization-invitations, NAO /api/organizations/{id}/invitations como a doc publica; (5) o conector NATIVO postmark-mail exige templateAlias (templates criados NO Postmark) — mais lock-in e mais setup que o SMTP generico, o que CONFIRMA a decisao D3 por outro motivo. GAP #5 fechado: 9 factories de Email vem pre-embutidos na 1.41.0"
    trace: "docs/evolution/research/email-logto-2026-08/SYNTHESIS.md"

