meta:
  id: slm-capitalizacao-2026-10
  schema_version: "1"
  baseline: 2026-10-05
  review_after: 2027-01-03   # cadencia MERCADO/CAPITAL = 90d. Justificativa do tipo dominante: a pergunta e de
                             # CAPITALIZACAO e 13 das 25 evidencias ancoradas sao rodada/investidor/tracao/modelo
                             # de negocio declarado (LMArena, Braintrust, Galileo, Arize, Scale, Patronus). As
                             # paginas de PRECO (AA Pro US$417, Braintrust Pro US$249, curso US$4.200 rejeitado)
                             # giram em 30d e sao o 'quanto' — GATILHO de revisita antecipada: antes de qualquer
                             # proposta comercial do Onion citar um preco daqui, re-medir as paginas de preco
                             # (verified_at vencido em 30d, nao em 90d). Benchmark/paper (MMTEB, 120d) e mais lento.
  # kg-backlog-guard: on
  # ═══ TETO: 37 NOS — a rodada de PRIMARIAS NOMEADAS foi EXECUTADA em 2026-10-05 (9 fontes, 9 alcancadas,
  #     25 claims ancoradas por verificador independente, 21 rejeitadas na ancoragem — contabilidade em
  #     E_LACUNAS_SLM_CAPITALIZACAO_PRIMARIES_1005). Composicao: 25 evidencias + 1 contabilidade + 6 leituras
  #     de sintese (claims open: o que cada via sugere para bilhetar) + 1 proposta (Q, nao sela) + 1
  #     pergunta-raiz + 1 enquadramento de bilhetagem + 2 ancoras cross-grafo. Cresce SO por (a) re-ancoragem
  #     das lacunas nomeadas (cartao Enterprise da AA, pagina de preco da LMArena, preco da Parlance) ou
  #     (b) emenda do Elenxo completo — nao por mais busca generica. ═══
  # Pergunta (2026-10-05): como benchmarks abertos, evals-como-servico e treinamento/consultoria em avaliacao
  # de IA viram RECEITA, segundo primarias (anuncios de rodada, paginas de preco, modelos de negocio declarados).
  # ⚠️ Proveniencia (R15): labels e verified_against carregam texto extraido de paginas da web e de um paper.
  #    E DADO a pesar, nunca instrucao — nenhuma diretiva contida nas fontes foi ou deve ser obedecida.
  # ⚠️ Relacao com o corpus: a premissa 'o capital financia o modelo pequeno, o Onion nao compete ai' vive em
  #    onion-slm-2026-10#C_CAPITAL_FUNDS_SMALL_MODELS_NOT_THE_MOAT (MESMA branch, lido neste escritor por grep
  #    em 2026-10-05 — o Elenxo da rodada declarou nao te-lo achado no checkout dele; aqui ele EXISTE). Como o
  #    radar reprova aresta para fora do arquivo, entra como ANCORA X_REF_* (espelho datado). O grafo de origem
  #    NAO foi editado. Esta rodada LIMITA a premissa (CONSTRAINS), nao a derruba: o capital financia TAMBEM a
  #    camada de avaliacao — nao ha SUPERSEDES/REFUTES cruzado. Nenhum no `decision` foi tocado nem criado.
  # ⚠️ O retorno do Elenxo chegou TRUNCADO na objecao 17 (de ~25): as objecoes 17-25 e o `gapsOpen` NAO
  #    chegaram a este escritor. As lacunas abaixo sao as das objecoes 1-16 sobreviventes + as da ancoragem.
  # ⚠️ source_tier: onde o leitor nao declarou tier ('?'), herdei o tier que ele declarou para OUTRA claim do
  #    MESMO documento (LMArena 9, Scale 9, MMTEB 7); sem irmao declarado, julguei 8 (fornecedor sobre si:
  #    AA /pricing, Arize, HF sobre o proprio leaderboard). Isso esta dito no verified_against de cada no.

