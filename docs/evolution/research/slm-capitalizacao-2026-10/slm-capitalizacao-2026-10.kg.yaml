  - id: Q_SLM_CAPITALIZATION_2026_10
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.55
    label: 'Como benchmark aberto, eval-como-servico e treinamento/consultoria em avaliacao de IA viram RECEITA segundo as primarias — quem paga, por que, quanto — e o que isso sugere como via de bilhetagem para (i) um bench aberto do mecanismo do Onion (eval de dominio com erros reais + radar como corretor) e (ii) consultoria de avaliacao? Segue open: a rodada ancorou 25 claims, mas so DUAS dizem quanto se cobra (AA Pro US$417/assento; Braintrust Pro US$249 + excedente medido); nenhuma primaria fala de eval de DOMINIO como nicho, e a unica claim sobre quem PAGA a LMArena foi rejeitada na ancoragem.'
    trace: 'docs/evolution/research/slm-capitalizacao-2026-10/SYNTHESIS.md'

