    status: open
    impact: 4
    confidence: 0.65
    label: 'LEITURA (eval-como-servico): o que tem preco e tracao declarados e eval EMBUTIDO numa plataforma de producao (Braintrust observabilidade com cobranca por score/GB; Galileo Evaluation Intelligence no fluxo; Arize com OSS ao lado do pago). Para o Onion isso VETA bilhetar por volume/score (exige SaaS hospedado, contra a identidade canonica) e HABILITA o equivalente que ele ja tem: eval como GATE dentro do repo do adotante — o valor e instalado, nao hospedado.'

  - id: C_SELF_EVAL_IS_NOT_INDEPENDENT_BENCH
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.7
    label: 'LEITURA (bench do mecanismo): o que AA vende e medicao INDEPENDENTE ("Providers cannot pay for results"); um bench do Onion sobre o PROPRIO mecanismo e autoavaliacao de fornecedor e nao vira assinatura de dados. Para valer como bench, precisa medir OUTROS (ex.: LLMs/SLMs no eval de dominio com erros reais, com o radar como corretor deterministico) e declarar a independencia como politica — ou ser publicado como metodo reproduzivel, nao como placar vendavel.'

  - id: C_OPEN_SHOWCASE_PRIVATE_HOLDOUT
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.6
    label: 'LEITURA (forma do bench): a tensao aberto x prova (Scale: privado preserva valor probatorio) sugere o desenho HIBRIDO — fatia aberta de erros reais como vitrine/metodo reproduzivel + held-out privado de erros reais do corpus (nos refuted/superseded/drifted com aresta nomeada) como prova. E o bench sem dono morre por obsolescencia (HF aposentou o Open LLM Leaderboard): a revisita tem de ser mecanismo (review_after, kg-freshness), nao intencao.'

  - id: C_TRAINING_CONSULTING_SELLS_INSTALLED_SYSTEM
    node_type: claim
    plane: DEV
    status: open
    impact: 5
    confidence: 0.6
    label: 'LEITURA (via treinamento/consultoria): as primarias que vendem sem plataforma vendem (i) curso com ativos que continuam rendendo (gravacoes, coortes futuras, reader, comunidade — Parlance/Maven) e (ii) consultoria que CONSTROI o sistema de avaliacao no cliente rumo a autonomia (Parlance); a AA empacota educacao/advisory no Enterprise do bench, mas essa metade NAO esta ancorada (re-ancorar). E a via mais compativel com a identidade do Onion (framework instalado no repo do adotante) e com NS1 (curso = VEICULO do KG, nao fim). O quanto segue aberto: nenhum preco desta via foi ancorado.'

  - id: C_OPEN_BENCH_RUNS_ON_CREDIT_NOT_REVENUE
    node_type: claim
    plane: DEV
    status: open
    impact: 3
    confidence: 0.6
    label: 'LEITURA (bench aberto comunitario): os benches abertos desta rodada (HF Open LLM Leaderboard, MMTEB) nao declaram monetizacao — o MMTEB se sustenta por credito de autoria com tabela de pontos (imperfeita, admitida) e coordenacao via GitHub. Para a via "membro externo de rede", isso e modelo de CONTRIBUICAO, nao de bilhetagem: o bench aberto e custo de reputacao/funil, e a receita vem de outra camada (dado/API, plataforma, curso, consultoria).'

  # ── PROPOSTA (nao sela) ─────────────────────────────────────────────────────────────────
  - id: Q_BILLING_VIAS_ORDER_PROPOSAL
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.5
    label: 'PROPOSTA AO MAESTRO (eu nunca selo; nenhum no decision foi criado ou tocado): ordem de vias sugerida por esta rodada — (1) consultoria de avaliacao que INSTALA o eval de dominio + gate no repo do cliente (forma Parlance; compativel com fork/adocao) e (2) treinamento com ativos que continuam rendendo, ambos sem plataforma hospedada; (3) bench aberto do mecanismo SO no desenho hibrido (fatia aberta como metodo/vitrine + held-out privado de erros reais) e medindo OUTROS modelos, como funil, nao como produto; (4) NAO bilhetar por score/volume (exige SaaS). Pre-requisitos antes de selar: re-ancorar o cartao Enterprise da AA e um preco de curso/consultoria; e o eval de dominio existir (hoje nao existe). As vias federacao/advisor/membro externo seguem sem primaria. Quem decide e o maestro.'

