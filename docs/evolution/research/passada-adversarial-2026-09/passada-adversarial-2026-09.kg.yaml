  - id: A_CURAR_O_REVISOR_DO_CI_COM_MECANISMO
    node_type: decision
    plane: PROD
    status: done
    impact: 4
    confidence: 0.95
    verified_at: '2026-09-14'
    verified_against: 'medido no PR #828, o PRIMEIRO depois do merge da cura e pelo CAMINHO REAL (nao edita onion-review.yml, logo sem auto-pulo): permission_denials_count 0 (era 9, e 14 em 2026-08-07) · is_error false (era true) · num_turns 8 COMPLETOS (antes 18 morrendo, ou 1 sem partir) · total_cost_usd 0.37 (trabalho real, nao morte em t=0). onion-review-verdict SUCCESS de verdade, nao soft-pass.'
    label: 'FECHADO — A CURA PEGOU, e o alvo veio de evidencia que dormia ha CINCO SEMANAS. O revisor semantico do CI nao revisava desde 2026-08-07: tentava postar COMENTARIO INLINE DE REVIEW, acumulava negacao de permissao e morria. A frase que nomeava o subsistema — `No buffered inline comments` — estava registrada NO PROPRIO WORKFLOW desde a 1a ocorrencia, ao lado do `permission_denials_count: 14`, e ninguem a leu como o alvo que era: liam o numero, nao a frase. A defesa existente era INSTRUCAO EM PROSA no prompt (`NAO tente postar comentario`), ignorada nas duas ocorrencias — conselho onde precisava de mecanismo. Cura: `--allowedTools Read Grep Glob Bash` nos dois sitios (tentativa e retry); a ferramenta deixa de existir na lista dele, entao nao ha o que tentar. TETO QUE VALEU: a cura nao pode ser validada no PR que a escreveu (PR que edita onion-review.yml faz a action se auto-pular), e por isso este no nasceu `open` com o gatilho escrito — fechou no PR SEGUINTE, como previsto. LICAO DE METODO: cinco ciclos de CI do PR #827 sairam com o verdict vermelho e eu li aquilo como `o de sempre`; alarme que a gente aprende a ignorar ja morreu antes de quebrar.'
    trace: '.github/workflows/onion-review.yml'

  - id: A_LICENCA_VIAJA_COM_NEVER_CLOBBER_E_QUINTA_COPIA
    node_type: decision
    plane: PROD
    status: done
    impact: 5
    confidence: 0.9
    verified_at: '2026-09-15'
    verified_against: 'dogfood dos DOIS cenarios por execucao: alvo virgem recebe LICENSE e LICENSE-DOCS; alvo com LICENSE proprietario PRESERVA o dele (Apache/Cliente Ficticio intacto) e recebe o nosso como LICENSE.onion. Familia license_travels 5/5 com mutante provado — a copia cega CLOBRA, logo o caso (b) prova algo.'
    label: 'FECHADO com as duas pernas, e a SEGUNDA PREMISSA DO PROPRIO NO CAIU NA MEDICAO. (1) NEVER-CLOBBER no adopt, passo (f), pelo molde exato do .env.example: a licenca fica FORA do manifesto de transporte de proposito — se entrasse, cairia no $TMP e o `cp -R` incondicional do passo (d) sobrescreveria o LICENSE do alvo, que e o relicenciamento silencioso na direcao MAIS GRAVE (aviso proprietario de cliente virando MIT em nome do autor do core). Alvo que ja tem o seu recebe `LICENSE.onion`; o merge e decisao do maestro DO ALVO. (2) STAGING no durable-commit, as 4 grafias: sem ele o arquivo chega UNTRACKED — some num git clean, e no --update o worktree e removido --force. Curar so uma metade nao entrega nada. CORRECAO DA PREMISSA: eu havia chamado o ONION_PATHS do durable-commit de `QUINTA COPIA da mesma lista`, e a leitura estava ERRADA — medido, ele usa `.claude` INTEIRO (superset das 8 raizes .claude/* da SSOT) e acrescenta os ARTEFATOS GERADOS na adocao (CLAUDE.md, docs/onion, os tres contextos, .githooks), que nao viajam do core. Propositos diferentes: a SSOT diz o que COPIA, o ONION_PATHS diz o que se COMMITA no alvo. Unifica-los quebraria a durabilidade dos gerados — a cura certa era ACRESCENTAR, nao unificar. Licao: `copia da mesma lista` foi diagnostico por SEMELHANCA DE FORMA; so a comparacao lado a lado mostrou que sao coisas distintas.'
    trace: '.claude/commands/meta/adopt.md'

