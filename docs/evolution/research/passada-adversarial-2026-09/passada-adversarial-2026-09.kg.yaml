  - id: Q_COMO_A_PERNA_DE_LEITURA_ALCANCA_QUEM_ESCREVE
    node_type: question
    plane: DEV
    status: open
    impact: 5
    confidence: 0.9
    trace: '.claude/hooks/kg-read-leg.sh'
    label: 'COMO FAZER A PERNA DE LEITURA ALCANCAR A SESSAO QUE ESCREVE NO GRAFO, sem virar ruido? Tres desenhos candidatos, nenhum medido: (a) acrescentar `Bash` ao matcher e o hook inspecionar `tool_input.command` procurando `.kg.yaml` — alcanca o caso real, mas roda em toda chamada de shell e precisa ser barato; (b) mover a guarda para `PreToolUse(Edit|Write)` sobre `.kg.yaml` — pega a ESCRITA, que e o momento mais tardio possivel, e nao pega quem le por bash para decidir; (c) trocar a natureza: em vez de hook por ferramenta, um gate no `lint` que exija, de todo PR que TOCA um `.kg.yaml`, que o residuo declare quais nos `confirmed` do mesmo arquivo foram consultados — mais lento para avisar, mas imune a qual ferramenta se usou. O QUE DECIDE ENTRE ELAS e uma medicao que ninguem fez: quantas das edicoes de grafo desta casa passam por `Read` e quantas por `bash`? GATILHO: o maestro escolher, ou a proxima proposta cair pelo mesmo motivo.'

  - id: E_MEDICAO_READ_VS_BASH_NO_CORPUS_DE_TRANSCRICOES
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.95
    verified_at: '2026-09-19'
    verified_against: "extracao por jq sobre 29 transcricoes do diretório de projetos do Claude Code do usuário para este repo (841 MB): 19.084 chamadas de ferramenta com nome e alvo; recorte por ocorrencia de `.kg.yaml` em file_path/command/pattern/path"
    trace: '.claude/hooks/kg-read-leg.sh'
    label: 'A MEDICAO QUE DECIDIA ENTRE OS TRES DESENHOS, e ela e mais extrema do que a hipotese. Das 2.457 chamadas que TOCAM um `.kg.yaml`: Bash 2.341 (95,3%) · Edit 83 (3,4%) · Read 17 (0,7%) · Write 16 (0,7%). O hook vigiava `Read` — ZERO-VIRGULA-SETE POR CENTO da superficie que existe para vigiar. Isso REPROVA o desenho (b) (mover para Edit|Write cobriria 4,1%) e escolhe o (a). CUSTO DO (a), tambem medido: `Bash` e 16.338 das 19.084 chamadas da base (86%), entao o hook passa a rodar em quase tudo — por isso a saida muda vem ANTES de qualquer parse, num `case` de shell sobre a string crua. TETO DA MEDICAO, declarado: ela conta CHAMADAS, nao sessoes-que-deviam-ter-lido. Um `bash` que roda o radar conta igual a um que edita o grafo. O numero diz ONDE o hook precisa estar; nao diz quantas vezes ele teria mudado um resultado. E POR ISSO O (c) ENTROU JUNTO, nao no lugar: um aviso perdido entre 16 mil chamadas de shell tem chance real de passar despercebido, e o (c) fala no PR, onde a proposta ja esta escrita e ainda da tempo de voltar.'
