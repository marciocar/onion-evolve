  - id: E_FAILSAFE_AFROUXADO_REPROVOU_POR_MEDICAO
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: '2026-09-20'
    verified_against: 'seletor REAL (_selftest_affected_families) rodado arquivo a arquivo sobre os 253 do dominio; e lint-selftest.sh:3924 mostrando `bash "${SCRIPT_DIR}/members-validate.sh"` dentro de helper despachado pela familia fixtures'
    trace: '.claude/validation/lint-selftest.sh'
    label: 'UMA TENTATIVA DE AFROUXAR O FAILSAFE, REPROVADA POR DOIS MOTIVOS INDEPENDENTES — e a doutrina dela continua boa. A IDEIA: arquivo que a bancada nao alcanca nao ganha cobertura por rodar tudo, entao o failsafe deveria DECLARAR a lacuna em vez de comprar ~30 min. (a) FALSO-NEGATIVO PERIGOSO: o mapa so enxerga referencias dentro do corpo de `run_*_selftests()`; chamadas em FUNCOES-HELPER sao invisiveis. `members-validate.sh` e EXECUTADO na l.3924 por helper da familia `fixtures`, com 5 fixtures asseverando seu exit code — e o predicado dizia "nao coberto", tirando dele o failsafe que o protege. Mesma classe em `federation-contract-validate.sh`, `lib/pt-br-words.txt` (o DADO que dirige a guarda de idioma) e `scaffold-diagnose-store.sh`. (b) A POPULACAO ESTAVA ERRADA POR 6,6x: publiquei "13 nao-cobertos, todos em ops/" no codigo, em 4 casos de bancada, no commit e no PR. Rodando o seletor REAL: 86 seriam declarados nao-cobertos, 33 rodariam tudo, 134 selecionariam familias. Eu havia medido O MEU MODELO do codigo (um script python que aproximava o predicado), nao o codigo — e pior, "corrigi" para baixo um numero que estava aproximadamente certo (116 ~ 114 reais) restringindo a populacao a `ops/` SEM DIZER. (c) E as guardas que deveriam ter pego isso eram TAUTOLOGIAS: dois casos faziam `grep -qF` no proprio script por uma string que a LINHA DO TESTE continha, entao apagar o predicado inteiro deixava a bancada verde — reincidencia direta do defeito curado no commit ANTERIOR da mesma branch. REVERTIDO; o failsafe volta a fail-closed com a razao escrita no lugar onde a proxima tentativa vai ler.'
