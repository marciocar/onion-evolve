  - id: Q_PREDICADO_QUE_ENXERGUE_INVOCACAO_POR_HELPER
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    trace: '.claude/validation/lint-selftest.sh'
    label: 'COMO FAZER O MAPA ENXERGAR O QUE A BANCADA EXERCITA POR FUNCAO-HELPER? Hoje ele le so o corpo de `run_*_selftests()`, e helpers definidos fora (que varias familias despacham) ficam invisiveis — foi o que derrubou a tentativa de 2026-09-20. Candidatos, nenhum medido: (a) varrer o arquivo inteiro por LINHAS DE EXECUCAO (`bash X`, `source X`, `"${SCRIPT_DIR}/X"`) e atribuir ao conjunto de familias que chamam o helper; (b) mapear helper→familias por quem o invoca, e propagar as referencias; (c) instrumentar de verdade: rodar cada familia com `strace -f -e trace=execve` (ou um `PATH` de wrappers) e COLHER o que ela de fato executa — caro uma vez, exato para sempre, e imune a citacao em comentario. O (c) e o unico que mede COMPORTAMENTO em vez de texto, e esta casa ja pagou tres vezes hoje por medir texto. GATILHO: quando alguem quiser reabrir o afrouxamento do failsafe — sem este predicado, nao ha como distinguir "nao coberto" de "nao visto".'

  - id: E_LISTA_4_A_REGRA60_ERA_CEGA_PELO_PROPRIO_VOCABULARIO
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: '2026-09-20'
    verified_against: 'Medido em 2026-09-20 no core, e o numero final e do GATE, nao da minha leitura: rodando o checker NOVO (lista de 153 termos) contra o `origin/main` do dia, ele acusa 46 identificadores pt-BR em 16 arquivos — os mesmos que o checker VELHO (102 termos) reportava como `0 HARD - 0 tolerados pelo baseline`. Distribuicao: lint-selftest.sh 15, lint-artifacts.sh 8, review-verdict.sh 5, vendor-manifest.sh 3, e 10 em `ops/`, que nem sequer estava no universo. Em paralelo, 33 pareceres do `onion-review` mostraram 10 com violacao, SEIS delas desta mesma classe, a ~US$ 0,80 por PR.'
    trace: '.claude/validation/lib/pt-br-words.txt'
    label: 'OCORRENCIA 4, E A PIOR DA SERIE: a guarda cega era a da REGRA 60 — justamente a regra sobre IDIOMA DE IDENTIFICADOR — e ela tinha o mecanismo COMPLETO que as outras tres nao tinham: baseline com catraca no chao (zero entradas toleradas), fail-loud se a lista sumir, 7 casos de bancada, guarda-da-guarda contra homografo, e estava LIGADA no lint desde 2026-08-09. Nada disso importou: a lista tinha 102 termos e NENHUM era palavra que aparece nos identificadores deste repo. Mecanismo completo mais vocabulario vazio = `0 HARD` por 42 dias, sobre 46 violacoes reais. DUAS LICOES ALEM DA CLASSE. (1) A EXCLUSAO tambem e vocabulario: o caso (g) proibia `nome` na lista SEM RAZAO DECLARADA — nao e palavra inglesa, entrou por arrasto junto de `base`/`total`/`local`/`final` que sao —, e a prova do arrasto e que `nomes` nunca foi excluido. Guarda de lista falha pelo vocabulario nos DOIS sentidos, e o lado da exclusao e mais silencioso porque parece prudencia. (2) O CUSTO TEM NOME: enquanto a guarda gratuita dizia 0, o revisor semantico do CI achava esta classe a ~US$ 0,80 o PR — e os achados dele sao ADVISORY, entao o defeito era apontado, mergeado e ficava. Pagava-se pela descoberta e nao se recolhia a entrega. A CURA que fecha a classe: o LLM caro descobre o termo novo UMA VEZ e ele vira check deterministico permanente (caso (h) da bancada ancora os 22 segmentos reais, com mutante provando que encolher a lista quebra antes do CI; caso (i) prova as DUAS metades do universo consciente de papel — `ops/` e varrido na FONTE e fica FORA no adotante, porque a guarda viaja). O criterio de reentrada na exclusao deixou de ser opiniao: so volta a excluir quem ACUSAR ingles legitimo no corpus, medido.'
