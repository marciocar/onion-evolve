  - id: C_ELENXO_RECOMMENDATION_1113
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.6
    label: "Recomendação do Elenxo: escada de esforço no prompt é mercado; ligá-la à reversibilidade é cunhagem Onion; escuta de HN/GitHub é viável com operador codificado; Reddit é lacuna; recalibração por histórico não tem fonte."
    narrative: "Recomendação íntegra do Elenxo (afirmação de 1 agente): O QUE A RODADA SUSTENTA: (1) uma escada de esforço embutida no prompt é padrão de mercado. A Anthropic a usa porque o agente julga mal o esforço (claim 19), e o degrau-base de 1 agente com 3-10 chamadas (claim 20) pode virar o teto inicial da 'espiada barata'. (2) A taxonomia porta de mão única/dupla (claims 1 a 3) serve de eixo de severidade, com o aviso explícito contra processo pesado em decisão reversível. (3) A escuta local de HN e GitHub é viável e barata: HN Algolia search_by_date com delta por created_at_i e GitHub REST/GraphQL com teto de 1.000 resultados e incomplete_results registrado. O core já chama o HN Algolia (onion-research.js:556, radar-sources.yaml:38), e o Lobsters /newest.json respondeu 200 hoje. (4) O OpenMagpie e o TrendRadar servem de molde de arquitetura (conector por fonte, cursor, alerta). O QUE A RODADA NÃO SUSTENTA: (a) VOI como regra prática de parada. Só a definição de teto está ancorada, e as duas regras operacionais foram rejeitadas. Sem payoffs, o limiar fica ao arbítrio de quem conduz. Use uma escada fixa por reversibilidade x severidade, declarada como desenho do Onion e não como padrão de mercado, e recalibre pelo histórico. (b) A ligação reversibilidade -> degrau de esforço: a Anthropic escala por complexidade, e a ponte é cunhagem do Onion, a declarar. (c) Reddit: inalcançável (403 medido hoje e E_REDDIT_INACESSIVEL_DESTE_HARNESS de 2026-08). Não prometa cobertura de Reddit. Declare a fonte como lacuna até alguém medir o caminho .rss ou OAuth, que a sonda desta passada não pôde rodar. (d) 'Mercado não expõe degraus de esforço em deep research': a OpenAI ficou fora, a imprensa de 2025 mostra um tier lightweight, e as fontes de Gemini e Claude não são de 2026. (e) 'Local e sem dependência externa': HN Algolia e GitHub são serviços de terceiro. Pela D_SEM_DEPENDENCIA_DE_SERVICO_EXTERNO_1027, cada um precisa de alternativa nomeada ou da declaração de que a fonte É a comunidade (dependência intrínseca, não substituível). Nenhuma claim trata disso. (f) O núcleo de recalibração (registrar custo e se a espiada mudou a decisão, recalibrar limiares pelo histórico) não tem NENHUMA evidência de mercado nesta rodada. Não há fonte sobre decision journal ou calibração por histórico, então é desenho próprio a medir por dogfood. (g) Fóruns de fornecedor (Discourse etc.) e Lobsters, citados na pergunta, ficaram sem claim. (h) Armadilha concreta para quem implementar: os exemplos de URL do HN Algolia com '>' cru devolvem 400 por curl. Codifique (%3E) e confira o http_code, ou a espiada registra 'nada novo' em silêncio."
