    narrative: "FONTES: chaves lidas (7 de 8): two-way-doors (carta de 2015 no SEC EDGAR), value-of-information (MIT ESD.72 DA 2 em espelho ocw.iti.hr e slides de Eidsvik, NTNU, como substitutas de Howard 1966, cujo texto o leitor não alcançou: IEEE e DTIC bloqueados), hn-algolia, github-search, deep-research-agents (Gemini e Claude; a página da OpenAI devolveu 403 ao leitor, inclusive nos espelhos de idioma), anthropic-multiagent-research, social-listening-oss (OpenMagpie, TrendRadar, F5Bot). Inalcançáveis (1): reddit-api; medido em 2026-11-13, www.reddit.com e old.reddit.com /r/ClaudeAI/new.json devolveram 403 desta VPS, e os termos da Data API, OAuth, limites e uso não comercial seguem sem evidência. CLAIMS: 30 propostas; 25 ANCORADAS, cada uma virou nó evidence; 5 REJEITADAS na ancoragem (5 EXAGERADA, 0 NAO-ENCONTRADA), que nunca viram nó. ELENXO: 25 objeções (uma por claim ancorada); 18 sobreviventes modeladas como E_OBJECAO (4 bloqueiam: alvos 4, 7, 17 e 23; 14 limitam: alvos 1, 2, 5, 6, 8, 13, 14, 15, 16, 18, 19, 21, 22 e 24); 7 não sobreviveram (alvos 3, 9, 10, 11, 12, 20 e 25) e o motivo está na narrativa do alvo. Objeções RECUSADAS pelo motor (sobreviveram sem critério pré-registrado ou sem superação): 0; nenhum alvo fica não-julgado por recusa. SUPERAÇÕES: 7 nós C_SUPERACAO_20261113 (5 das rejeitadas na ancoragem, com TRACES_TO para este nó; 2 do Elenxo, alvos 7 e 8, com TRACES_TO para o E_OBJECAO respectivo). LACUNAS FECHADAS (5): two-way-doors (taxonomia Type 1/Type 2 e o risco de processo pesado em decisão reversível, sem classificador operacional) · hn-algolia (endpoints, filtro created_at_i e limite de taxa; funciona com o operador codificado %3E e devolve 400 com '>' cru) · github-search (teto de 1.000, 30 req/min, incomplete_results, type DISCUSSION no GraphQL; o GraphQL exige token e os 5.000 pontos/h não são verbatim) · anthropic-multiagent-research (regras de escala embutidas no prompt e degrau-base de 1 agente com 3-10 chamadas) · social-listening-oss (OpenMagpie local, open-core Apache 2.0 com cláusula ee/, e TrendRadar como molde; Reddit não verificado, projeto de 6 meses). LACUNAS QUE CONTINUAM ABERTAS (3, do Elenxo gapsOpen): value-of-information — só a DEFINIÇÃO fechou (EVPI e VOI como teto); o uso prático como regra de parar caiu nas duas claims rejeitadas e exige payoffs que a dúvida de agente não tem (objeção 4, bloqueia) · reddit-api — inalcançável; 403 medido hoje; termos da Data API, OAuth, limites e uso não comercial sem evidência · deep-research-agents — a OpenAI Deep Research não tem claim ancorada (a imprensa de 2025 mostra tier lightweight com o4-mini) e as fontes de Gemini e Claude são de 2024-2025, não de nov/2026 (objeção 17, bloqueia). Lacunas da pergunta sem fonte nesta rodada (da recomendação do Elenxo): o núcleo de recalibração (registrar custo e se a espiada mudou a decisão) não tem evidência de mercado; fóruns de fornecedor (Discourse etc.) e Lobsters ficaram sem claim; nenhuma fonte trata a dependência intrínseca de HN Algolia e GitHub frente à D_SEM_DEPENDENCIA_DE_SERVICO_EXTERNO_1027. REJEITADAS NA ANCORAGEM, com o motivo do verificador: (1) [value-of-information] Qualquer fonte real vale entre zero e o EVPI, então o EVPI serve de triagem antes de desenhar a busca. VEREDITO EXAGERADA: a quote existe literal (slide 11, não 10); 'vale entre zero e o EVPI' é o que o texto diz, mas 'serve de triagem antes de desenhar a busca' é inferência do leitor; o slide só ilustra com 'In DA 1, the cost of the survey was $20K < EVPI'; e o texto fala do valor esperado bruto, não líquido do custo. (2) [value-of-information] Regra de decisão: comprar informação só se o VOI superar o preço. VEREDITO EXAGERADA: a quote é literal (linhas 320 e 506 do texto extraído; propriedade c, 'Data should be purchased if VOI > Price of experiment P'), mas é condicional suficiente ('if'), e o claim a reescreve como necessária ('só se'); o item está sob 'Assuming risk neutral decision maker!'. (3) [deep-research-agents] No Gemini Deep Research o agente propõe um plano multi-etapas e o usuário o revisa ou aprova antes de pesquisar; o esforço é negociado por plano, não por seletor de profundidade. VEREDITO EXAGERADA: a primeira frase é sustentada; 'o esforço é negociado por plano' é interpretação (o texto nunca fala de esforço, profundidade ou orçamento); o locator também está errado (não existe seção 'Planning and editing'; o trecho fica sob 'Deep Research: Your personal AI research assistant is here to help'). (4) [anthropic-multiagent-research] Multiagente só se paga quando o valor da tarefa é alto o bastante para cobrir o custo extra, o critério de valor da informação para decidir quando gastar mais. VEREDITO EXAGERADA: a citação existe ('For economic viability, multi-agent systems require tasks where the value of the task is high enough to pay for the increased performance.'), mas não formula 'valor da informação', não trata de quanto gastar em descoberta e não dá limiar. (5) [social-listening-oss] F5Bot, referência de serviço, cobre Reddit, HN e Lobsters, e é hospedado (não local); plano grátis, pagos de US$12,99 e US$49,99/mês. VEREDITO EXAGERADA: fontes e preços batem (Free US$0, Silver US$12,99/mês, Gold US$49,99/mês), mas a página não declara onde o F5Bot roda; só mostra um serviço de cadastro 'Running since 2017'; 'hospedado (não local)' é inferência razoável, não o que o trecho sustenta."
