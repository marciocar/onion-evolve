    status: open
    impact: 4
    confidence: 0.85
    label: "TETO: no Bash só se julga o comando que CITA o caminho de memória (literal, ~, $HOME, ${CLAUDE_CONFIG_DIR}) como DESTINO de uma forma de escrita listada (>, >>, tee, cp, mv, install, ln, rsync, sed -i, dd of=, write_text, open(…,'w')). Caminho montado em runtime, variável vinda de fora (caso TETO (xx)), cd para a pasta e escrita relativa, script versionado que escreve por dentro: passam. Em guarda de lista o defeito dominante é o vocabulário."

  - id: C_TETO_ESCRITA_FORA_DA_SESSAO
