    confidence: 0.8
    trace: ".claude/validation/memory-write-scan-check.sh"
    label: "A metade que não depende do vocabulário do veto: a varredura das notas da memória do projeto (árvore principal e worktree, mais o autoMemoryDirectory) pelo mesmo juiz, no SessionStart (aviso antes do turno) e no lint como REGRA 116 (Memória do Claude Code sem envelope de canal não confiável), SOFT sempre. A pasta é da máquina, não do repo: deixar o gate vermelho por ela seria o terceiro disparando a guarda à distância (cláusula 5). Sem pasta (o CI), cala, declarado."

