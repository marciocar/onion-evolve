  - id: D_SOFT_PROVENIENCIA_HARD_ENVELOPE
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.8
    trace: ".claude/hooks/pretooluse-memory-write-guard.sh"
    label: "Substrato escolhido pelo censo: hook PreToolUse em Write, Edit, MultiEdit e Bash, molde pretooluse-direct-provider-api.sh (o PreToolUse mais exercitado), com o juiz em lib/memory-write-judge.py e onFailure block. Grau SOFT (additionalContext, rc 0) para nota sem proveniência checável; grau HARD (exit 2) só para a forma objetiva medida: o envelope de canal ABERTO E FECHADO no texto que vai para a memória."
    narrative: "A abertura sozinha não barra: o prompt de sistema e as notas que documentam o formato citam a tag (105 citações de <cross-session-message from=…> nos transcripts). O par inteiro é a forma de quem copiou o corpo junto. O desenho de partida do maestro previa 'marca de conteúdo não confiável vindo de WebFetch'; medido que o harness NÃO envolve resultado de WebFetch, MCP nem Read, a forma HARD ficou nos canais que o harness envolve (teammate, outra sessão, colado) e na cerca R15.1 do próprio core. Declarado aqui, não escondido."

  - id: D_VARREDURA_DO_DISCO_REGRA_116
    node_type: decision
