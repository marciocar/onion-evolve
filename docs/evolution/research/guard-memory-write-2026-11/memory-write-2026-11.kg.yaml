    label: "TETO (peça 7): é lembrete e contenção de cópia verbatim, NÃO fronteira. Conteúdo de fora parafraseado, ou copiado sem envelope (WebFetch, MCP, Read de arquivo de terceiro, que o harness não envolve), passa. A proveniência é TEXTO e o atacante a forja com uma data: o SOFT educa, não protege (caso TETO (xix))."

  - id: C_TETO_BASH_PELO_VOCABULARIO
    node_type: claim
