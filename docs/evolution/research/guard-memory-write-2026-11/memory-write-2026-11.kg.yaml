    narrative: "(2) $HOME e ~ entre aspas, ${HOME:?} e ${HOME:-…} não eram reconhecidos; (3) open(…,'w') com parênteses aninhados escapava. Os três foram curados, cada um com caso que falha antes e passa depois e com mutante; o autoMemoryDirectory com $HOME no valor também (uma linha). Cura 1: o caminho quente resolve em bash, num só realpath, os caminhos citados no JSON, e só sai rc 0 se nenhum cai em <config>/projects/*/memory; custo medido sob load 14: +3 ms no Write e +9 ms no Bash. Cura 2: aspas saem do texto antes de tokenizar, e toda grafia de expansão de HOME e do CLAUDE_CONFIG_DIR vira o valor. Cura 3: o open( aceita dois níveis de parênteses, e o caminho tem de estar DENTRO do open que leva o modo de escrita, na mesma instrução: um open de leitura da nota ao lado de um open de escrita noutro arquivo cala (caso (xvi-k)). Declarado no cabeçalho sem curar: conteúdo fora do texto do comando (cp, cat arq >>, rsync, mv), envelope dividido em duas escritas, grafias que o harness não produz, link criado no mesmo comando e o falso positivo HARD em nota que documenta o formato (0 em 364 notas). Rodado o laboratório do refutador sobre a cura: os únicos FURO e FP restantes são os declarados."
