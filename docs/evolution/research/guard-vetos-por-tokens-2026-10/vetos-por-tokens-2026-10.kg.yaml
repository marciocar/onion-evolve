    verified_against: 'DEPOIS DA 3a PASSADA: familia pretooluse_veto 186/186 (JSON pelo stdin; casos com cwd de worktree; um caso isolante para cada cura); 74 de 75 mutantes mordem — o que nao morde (git-common-dir) e redundante POR MEDICAO (ver C_TETO_MUTANTES_QUE_AS_CAMADAS_ESCONDEM); baterias das tres passadas do Elenxo: zero escape real aberto, os vetos restantes contra a origin/main sao fechamentos declarados no TETO 1; reexecucao dos 22.662 comandos reais: 35 divergencias = 31 artefatos de estado + 4 falsos positivos antigos curados, 0 falso positivo novo, hashes conferidos antes e depois; latencia ~125 ms por hook (mediana), p90 <= 162 ms'
    trace: '.claude/hooks/lib/invocation-lines.sh'
    label: 'A CURA: a lib partilhada dos dois vetos passa a reduzir a string com shlex (aspas respeitadas e removidas; ; & && | || ( ) e quebra de linha como separadores), extrair $(…) e crase com um scanner que entende aspas e aninhamento, tratar heredoc COM aspas como inerte e SEM aspas como expansivel, lembrar atribuicoes literais da propria string, tirar palavras-chave, atribuicoes e invólucros (com as opcoes de cada um), re-analisar sh -c, e canonizar gh (sem -R/--repo) e git push (+ref → --force; --mirror/--all → destino main). E `cd <literal>` passou a mudar o diretorio julgado, COM ESCOPO de subshell, substituicao e sh -c — isentando push em OUTRO repo como o -C ja isentava. O que nao se prova vira __ONION_UNANALYZABLE__, e cada hook decide FECHADO quando o texto tem a FORMA do que ele guarda. O merge-gate ganhou tambem o mergePullRequest pela GraphQL. Contrato de saida mantido: os hooks seguem lendo linhas gh/git canonicas.'

  - id: E_REEXECUCAO_DOS_COMANDOS_REAIS
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 0.95
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'replay.py: 12.268 comandos Bash unicos de 17 transcripts deste repo, contra os hooks antigos e os novos num repo-sandbox armado, com sha256 dos hooks conferido ANTES e DEPOIS de cada rodada. v1: 5 FP novos; v2: CONTAMINADA (mutantes trocavam a lib no disco durante a rodada) e descartada; v3: 0 FP novo; v4: 1 FP novo (IndexError); v5 FINAL: 5 divergencias, todas FP ANTIGOS curados, 0 FP novo, 1 veto restante (cd $SBP dinamico, fechado por desenho)'
    label: 'O TESTE DE FALSO POSITIVO MAIS FORTE DISPONIVEL: reexecutar contra o hook antigo e o novo todos os 12.268 comandos Bash reais que as sessoes deste repo ja rodaram. A 1a versao da lib divergiu em 6: curou 1 falso positivo antigo (o proprio comando que escrevia esta lib) e CRIOU 5 — tres por um scanner de $(…) que contava parenteses ignorando aspas (quebrava em "$(printf ''%s'' "$x" | grep ''y'')", que o bash aceita), dois por marcar como inanalisavel todo xargs diante de gh (inclusive leituras como xargs gh run view), e todos amplificados por um criterio de relevancia que aceitava a palavra merge/push solta. Os tres foram curados na raiz. A v3 mostrou que os 5 vetos restantes, que o hook ANTIGO tambem dava, eram falso positivo PRE-existente — todos cd /outro/repo && git push origin main — e a isencao por cd literal (com escopo) os curou. A v4 achou um IndexError: os ) de padroes de case em bash -c esvaziavam a pilha de escopo, e o fallback vetava a string inteira; curado com restauracao por tamanho e com toda excecao passando pelo mesmo criterio de relevancia. LICAO DE PROCEDIMENTO medida aqui: a v2 rodou ao mesmo tempo que os scripts de mutante e julgou parte dos comandos com a lib MUTADA — medicao concorrente com mutacao no mesmo arquivo nao vale; desde a v3 o hash dos hooks e conferido antes e depois.'

  - id: C_TETO_FRONTEIRA_DO_QUE_O_HOOK_VE
    node_type: claim
    plane: DEV
    impact: 4
    confidence: 0.9
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'cabecalho da lib (FRONTEIRA DECLARADA)'
    trace: '.claude/hooks/lib/invocation-lines.sh'
    label: 'TETO 1, o que o hook NAO ve, por desenho: script em ARQUIVO (bash x.sh, source x, source <(sed … arquivo)), alias ou funcao definidos FORA da string (os definidos dentro dela sao vistos), variavel vinda de fora, git/gh chamado por outro programa, stdin vindo de ARQUIVO (cat lista | xargs git push origin {} sem force e fora da main passa). Refspec com variavel nao-literal SEM force e confiado (git push origin "$BR" — barra-lo vetaria o uso comum), MESMO sentado na main: a 1a reescrita fechava ai e reabria o 2o falso positivo de producao (2026-09-01), apontado pelo Elenxo na 2a passada; com force, ou calculando a branch PADRAO, ou com valor-padrao literal main (${B:-main}), fecha. Config de push que mora FORA da string e e lida: remote.<r>.push/mirror e push.default do repo vivo; NAO lida: url.<x>.pushInsteadOf (reescrita de URL) e config global/de sistema alem do que o git -C <dir> config devolve. gh repo sync SEM repo posicional sincroniza o clone LOCAL e passa (nao toca o host); ssh/tmux/screen como executores sao recusa por forma, nao analise. ALIAS DE REPO RENOMEADO: o GitHub redireciona o nome antigo, e o hook nao o conhece — por isso, do NOSSO diretorio, slug "estrangeiro" nunca isenta (gh repo sync <fork>, contents de outro repo vetam: fechado por desenho); de OUTRO projeto, um slug antigo do nosso repo passaria. Sem o campo cwd no JSON o hook julga pelo diretorio do processo. Heredoc sem terminador cujo corpo cita a forma guardada fecha. E o FECHADO POR DESENHO, que da veto em texto que talvez fosse honesto: outro repo SEM remoto comparavel (nao se prova que e outro projeto), cd $(mktemp -d), (cd /tmp && …), e codigo de merge embutido como texto num executor (python3 -c com os.system).'

