  - id: C_TETO_MUTANTES_QUE_AS_CAMADAS_ESCONDEM
    node_type: claim
    plane: DEV
    impact: 3
    confidence: 0.9
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'mut11/mut12: cada metade da cura da pilha sozinha NAO corrompe nada; excecao-so-Unanalyzable sem efeito observavel com a pilha certa. CORRIGIDO pela 2a passada do Elenxo (e2/mutA|B|C, 2026-10-05): dos tres mutantes declarados redundantes, DOIS eram a unica protecao do seu caso — a isencao do caminho verificado chamado por $(…)/ops/ (falso positivo com --motivo citando gh pr merge) e o parentese que so fecha escopo que ele abriu (escape: bash -c com case e cd para outro repo). Os dois casos entraram na bancada e os mutantes agora mordem. O terceiro (git-common-dir) foi PROCURADO antes de declarado: o unico caso em que ele decidiria sozinho e uma worktree com config propria (extensions.worktreeConfig) e outro origin — e ai o push vai MESMO para o outro remoto, logo a isencao pelo destino ja esta certa sem ele. Redundante por medicao.'
    label: 'TETO 4, sobre a propria bancada: as defesas sao em CAMADAS (excecao capturada com o mesmo criterio de relevancia; fallback em bash com o mesmo criterio) e isso torna bug interno do analisador INVISIVEL de ponta a ponta — o comando honesto passa mesmo com o Python quebrado. Por isso existe o modo de diagnostico ONION_INVOCATION_STRICT=1, que so a bancada liga. A 1a redacao deste no afirmava que tres mutantes nao mordiam POR REDUNDANCIA, e a afirmacao era falsa para dois deles: "nao morde" significava "falta caso", nao "camada repetida" — o Elenxo achou para cada um o comando em que ele era a UNICA defesa. A licao generaliza: mutante que nao morde so se declara redundante depois de se procurar o caso que ele protegeria sozinho. O cd que o analisador nao segue (cd $X, condicional, pushd) torna o diretorio DESCONHECIDO e nunca isenta — a 2a redacao dizia "cd $X segue vetando" e a 3a passada mostrou que era falso quando o cwd do JSON era outro projeto.'

  - id: E_ELENXO_REPROVOU_A_1A_REESCRITA
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'Elenxo opus em worktree isolada, bateria propria de 442 casos (old x new) em sandbox com worktree e clones reais; reexecucao dele nos transcripts de subagentes; latencia medida'
    label: 'O ELENXO REPROVOU A 1a VERSAO DESTA REESCRITA, e com escapes NOVOS — exatamente o que a forja de guarda manda procurar. Quatro que o hook antigo barrava: (B1) o shlex com commenters="#" lia x#; git push -f origin main como comentario e o push sumia; (B2) a isencao por cd/-C comparava so o toplevel, e uma worktree agent-* desta casa (mesmo projeto, mesma main) contava como outro repo; (B3) time -p fazia do -p o nome do comando; (B4) X="gh pr merge"; $X sem word-splitting. Mais escapes antigos reais (continuacao de linha, heads/main, glob e brace no refspec, branch padrao por symbolic-ref, $((1<<x)) lido como heredoc, shell lendo stdin, executores como watch/flock/su -c/find -exec, env -S, gh pr MERGE, alias definido na string, API com %6D e //, merges e git/refs pela REST, GraphQL alem do mergePullRequest, IFS) e falsos positivos novos (o caminho verificado chamado por $(…)/ops/, $PYTHON tools/merge.py, comando acima de 128 KiB que estourava argv). Todos curados na raiz; os que ficam sao fronteira declarada (C_TETO_FRONTEIRA_DO_QUE_O_HOOK_VE).'

  - id: E_A_REEXECUCAO_MENTIA_POR_ESTADO
    node_type: evidence
    plane: DEV
    impact: 4
    confidence: 0.95
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'corpus completo (22.662 comandos de 2.964 transcripts): 81 divergencias na 1a passada; classify.py reanalisa cada uma com a "branch atual" fixada em feat — as que somem sao artefato de ESTADO; as que persistem eram 2 bugs (heredoc dentro de $( dentro de aspas; regra de substituicao de processo disparando com qualquer $(…)); depois das curas: 0 persistem, 31 artefatos de estado, 4 FP antigos curados'
    label: 'LICAO DE MEDICAO, a 2a desta forja: a reexecucao dos comandos reais julga cada comando contra o DISCO DE HOJE. Uma regra que depende de estado (a branch atual, para resolver push sem refspec) da veto em comando que, quando rodou, estava numa branch de feature — e hoje, sentado na main, o veto estaria CERTO. Separar estado de bug exigiu reanalisar com a branch neutra. Foi assim que dois bugs reais apareceram escondidos entre 77 artefatos: o heredoc de TODO gh pr create desta casa (--body "$(cat <<EOF …") nao era reconhecido, e o corpo do PR virava comando.'

  - id: E_ELENXO_2A_PASSADA_O_DIRETORIO_ERRADO
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'Elenxo opus, 2a passada, em worktree isolada: a1-a4.py, wt.py, wt2.py e mrun.py contra sandboxes sb3 (raiz na feat), sbm (raiz na main, worktree fix/x), sbf (raiz na feat, main noutra worktree) e other_proj; 14.958 comandos do corpus reexecutados; latencia em 50 comandos reais (mediana 90 ms nova x 98 ms antiga)'
    trace: '.claude/hooks/lib/invocation-lines.sh'
    label: 'A 2a PASSADA DO ELENXO REPROVOU DE NOVO, e o achado central nao era de vocabulario: era de DIRETORIO. A lib julgava a partir da raiz (CLAUDE_PROJECT_DIR), mas o comando roda no cwd do JSON do hook — numa worktree de agente, outra branch. Dai um falso positivo novo (git push -u origin HEAD de agente vetado com a raiz na main) e um escape (force-push nu de um checkout sentado na main com a raiz na feat). E a isencao de outro projeto decidia pelo origin do DIRETORIO, nao pelo DESTINO do push: cd <adotante> && git push -f <url-nossa> main passava, como GH_REPO=<nosso> e gh api repos/<nosso>/…. O resto: pflag colado (-XPUT, -fbase=main), ${B:-main} lido como refspec, heredoc lido por shell com -s/--//dev/stdin, apostrofo no corpo expansivel, delimitador com simbolo (E@F), refspec vindo de config (-c remote.*.push/mirror, push.default=upstream, git config && push), send-pack, subtree push, gh repo sync, merge-upstream, contents PUT, runuser, pipe para shell fechando sempre, e o caso de 140 KB da bancada que era VAZIO (argv). Todos curados; os que ficam estao no TETO 1. E o B2 se reproduziu AO VIVO no mesmo dia: o veto de producao (lib antiga) barrou o push de checkpoint DESTA branch, feito por cd para a worktree + git push nu, como "push nu sentado em MAIN" — porque a raiz da sessao estava na main.'

  - id: E_ELENXO_3A_PASSADA_A_ISENCAO_E_A_FALHA_ABERTA
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'Elenxo opus, 3a passada, worktree isolada, sandboxes R/R2/O/RB/N/NH/bare (e3/t1-t10.py, h.py), push REAL confirmando insteadOf/pushInsteadOf e remoto com barra; 15.031 comandos do corpus reexecutados em duas configuracoes (raiz na feat; worktree com raiz na main); latencia e contagem de chamadas git medidas'
    trace: '.claude/hooks/lib/invocation-lines.sh'
    label: 'A 3a PASSADA REPROVOU, e TODOS os bloqueadores moravam no mesmo lugar: a ISENCAO de outro projeto — o unico ramo que faz um veto deixar de vetar. gh pr merge <URL nossa> a partir de outro diretorio (a URL escolhe o repo), remoto com / no nome lido como caminho local e caminho local que nao existe tido como estrangeiro, url.insteadOf reescrevendo o destino, projeto cujo origin e um bare em disco, e cd que o analisador nao segue caindo no cwd do JSON (que, sendo outro projeto, isentava). A licao estrutural: isencao exige PROVA de estrangeiro, nunca ausencia de prova de nosso. A cura inverteu o onus — so URL de rede com slug fora de TODOS os remotos da raiz isenta; caminho local nunca; insteadOf ou remoto por -c cancelam; diretorio nao seguido vira DESCONHECIDO; gh so isenta fora do nosso diretorio, e qualquer gh que nomeie o nosso repo (set-default, checkout <URL>) cancela as isencoes seguintes. E a cura da cura: isentar slug estrangeiro a partir do NOSSO diretorio foi tentado e desfeito no mesmo laco, porque o GitHub redireciona nome antigo de repo renomeado (onion-claude ≡ onion-evolve nesta casa). Maiores tambem curados: cd relativo resolvido pela raiz, shell entre aspas ou em comentario na linha do heredoc, marca de branch padrao GLOBAL contaminando todo destino dinamico (virou marca por variavel), config de push tainting refspec explicito, rota casada em texto de campo do gh api (agora o gate julga so o endpoint), git com cache de chamadas.'

