    label: 'TETO 2: shlex tokeniza, nao faz parse de bash. Nao modela: ANSI-C $''…'' (cai como nome dinamico, logo fechado), aritmetica $((…)), [[ ]], IFS alterado, case, process substitution como nome de comando, zsh. Onde ele erra para o lado do inanalisavel, o hook fecha; onde ele erraria para o lado do analisavel-errado, e a fronteira que a reexecucao dos comandos reais mede. Um parser de verdade (bashlex, tree-sitter) e o caminho se o gatilho disparar — GATILHO: um escape novo medido que o shlex nao consiga ver, ou a dependencia passar a existir no CI.'

