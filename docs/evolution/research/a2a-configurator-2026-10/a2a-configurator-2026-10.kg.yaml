    label: "as escolhas da sessão nas bifurcações do SAC-150: reverificar pelo gate, janela no recebimento, --trust-repo no hub, --invites opcional declarado, tetos de corpo e taxa no /a2a, medição do relógio acima do atestado"
    narrative: "Bifurcações e escolha: (1) N1 reverificar o envelope (escolhida) ou o bridge assinar o registro com chave pinada no hub (descartada: chave nova a custodiar e o hub teria de confiar no bridge); (2) a janela no instante do recebimento, porque o envelope de 600 s quase sempre já venceu quando o maestro aceita; o receivedAt não é assinado, e o resíduo é ressuscitar um envelope legítimo nunca aceito, que o jti no inbox deduplica; (3) o hub reverifica contra o registro do core (--trust-repo), que tem as chaves dos filhos; (4) o convite revogado só se mede com o arquivo do bridge, 0600 da conta do serviço, então --invites é opcional e sem ele o doc diz nao-medido; (5) corpo acima do teto é recusado, não truncado; (6) o signal.id segue no nome do arquivo da FILA do bridge (prefixo cosmético antes do taskId aleatório, sem colisão possível) e sai do nome do doc do inbox, onde decidia; (7) a poda do jti virou Q_ESTADO_DE_JTI_SO_CRESCE, com gatilho; (8) o refutador do core achou a ressurreição de envelope genuíno pelo receivedAt não assinado: curada em parte (idade máxima de 7 dias pelo iat assinado e razão de aceites por jti); a testemunha do recebimento fora do UID do serviço depende de D_N2_SEPARAR_A_ESCRITA_DO_CHAT_DA_CONFIANCA_DO_A2A."
