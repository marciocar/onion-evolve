  - id: D_R1_VEREDITO_ESTRITO_NOS_DOIS_LADOS
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 3
    confidence: 0.8
    verified_at: "2026-10-15"
    verified_against: "decisões da sessão da R1 pela opção recomendada (autorização do maestro de 2026-10-15), declaradas no resíduo dos dois PRs"
    label: "a R1 cura nos DOIS lados (gate saneia na saída e julga a forma na entrada; bridge exige exit 0 e veredito canônico), porque um lado só deixaria o outro voltar a mentir"
    narrative: "Bifurcações e escolha: (1) sanear no veto() (defesa em profundidade, vale para todo chamador) E julgar alg/kid pela forma antes do uso, com reason fixo para alg e bad-kid para kid fora da forma (o unknown-kid:<kid> segue ecoando o kid, que agora só tem [A-Za-z0-9._-]); (2) a forma do kid é julgada dentro do jq por explode, como os outros campos do remetente, porque `$(jq -r)` come o \\n final; (3) o header do JWS também tem de ser UM objeto e entra na checagem de chave duplicada; (4) no bridge, a duplicata é detectada pelo round-trip canônico (JSON.stringify(JSON.parse(t)) === t), que vale porque o gate só emite JSON compacto, em vez de um parser JSON próprio; (5) o motivo do veto do gate só é ecoado ao remetente quando o veredito passou no parse estrito; (6) o a2a-doctor monta o header sintético por jq."
