  - id: C_MUTANTE_QUE_NAO_MORDE_TEM_QUATRO_CAUSAS
    node_type: claim
    plane: DEV
    impact: 5
    confidence: 0.95
    status: confirmed
    verified_at: '2026-10-04'
    label: 'EXTENSAO DE DOUTRINA, e vale mais que a guarda. A casa conhecia DUAS causas para "o mutante nao mordeu": caso DECORATIVO, ou mutante que NAO MUDA o que o caso afirma. Esta forja produziu as outras duas, cada uma medida: (3) MUTANTE INERTE — a mutacao nao alterou o arquivo (meu `python -c` com escape aninhado nao casou nada), e o resultado e indistinguivel de caso decorativo; (4) MUTANTE FRACO — o arquivo MUDOU e o comportamento NAO: troquei a extracao por `printf "%s"` SEM `\n`, e `while read` sobre fluxo sem delimitador final nunca executa o corpo. Mais a 5a, que e de harness e nao de mutante: o HARNESS OLHOU A STRING ERRADA (grepei `VACUIDADE` em maiuscula quando o rotulo da falha e `(f) vacuidade`; e antes, o rotulo de `record_pass` dentro da linha de `record_fail`). CURA ESTRUTURAL, nao disciplina: o harness PROVA QUE MUTOU antes de interpretar — compara o arquivo com o original e aborta como `⊘ INERTE` se forem iguais. E o unico jeito de separar "o caso e enfeite" de "meu mutante nao existiu" sem adivinhar. CONTAGEM DA SESSAO: harness de mutante me enganou 5 VEZES.'
    trace: '.claude/commands/common/prompts/guard-doctrine.md'
    verified_against: '⚠️ CORRIGIDO 2026-10-04 apos reprovacao: a 1a redacao dizia "6 mutantes (M1-M6) ... 3 passadas ate os 6 morderem" e isso DESCREVIA ALGO QUE NAO ACONTECEU — o Elenxo provou que eram 5/6, porque o M4 era NO-OP SEMANTICO (equivalencia medida em 17 casos + varredura do repo inteiro, rc e saida byte-a-byte identicos). A ironia e fechada: o M4 era instancia da QUARTA CAUSA que ESTE PROPRIO NO nomeia (mutante fraco), e eu diagnostiquei a causa errada, atribuindo-a ao bug de vacuidade. HOJE: 10 mutantes, 10 mordendo, com o harness provando a mutacao e o M4 atacando o MECANISMO (os dois filtros redundantes) em vez de um ponto'
    provenance:
