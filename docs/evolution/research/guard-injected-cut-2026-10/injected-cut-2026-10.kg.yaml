  - id: E_O_ELENXO_REPROVOU_A_GUARDA_E_O_PIOR_ERA_FATAL
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 0.95
    status: confirmed
    verified_at: '2026-10-04'
    source_tier: 10
    label: 'O ELENXO REPROVOU A GUARDA: 7 classes de FALSO POSITIVO (9 casos), 11 formas de truncar nao declaradas, 4 cortes destrutivos liberados pela isencao, e 5 achados de 1a classe — dois deles FATAIS. (1) FP-1, o fatal: a guarda PROIBIA DOCUMENTAR A PROPRIA REGRA 96. Ele acrescentou ao `/meta:forge-guard` a secao que qualquer autor de doutrina escreveria e o lint REAL foi a `HARD: 1 / FALHOU`; a unica saida era `--no-verify`. E a clausula 4 (falso positivo treina a sessao a ignorar o veto) realizada contra o proprio artefato. (2) ACHADO A, tambem fatal: o dispatcher invoca `… --tsv 2>/dev/null || true`, logo meu `exit 2` de fail-loud NUNCA chegava ao lint — eu escrevi o fail-loud, provei no CLI, mutei contra ele, e o CONSUMIDOR o anulava; em producao a guarda JA ERA fail-open nesse caminho. (3) FN-B: o predicado exigia `|` LITERAL, entao `head -40 arquivo` era invisivel, e `sed -n 1,40p arquivo` — a redacao USUAL — passava, o que tornava falsa a cobertura declarada da 6a forma. (4) FN-A: a isencao `N<=2` e SINTATICA e o teto afirmava "por proposito, nunca por sintaxe" — no MESMO cortador do dano, `| head -1` apaga 297 de 298 e passa calado enquanto `| head -3` reprova. (5) Minhas afirmacoes 2, 3 e 5 caem; a 1 se sustenta. TODOS CURADOS no mesmo laco, e a cura do FP-1 exigiu distinguir diretiva VIVA de diretiva CITADA (cerca, crase dupla, comentario, padrao entre aspas) — mais um marcador `# top-N` explicito para o corte que E a pergunta, porque adivinhar pelo pipeline isentaria o dano original.'
    trace: 'docs/evolution/review/fix-medidores-que-cortam-em-silencio.md'
    verified_against: 'refutador opus/high em worktree isolada, mandato CACAR FALSO POSITIVO; 164k tokens, 60 chamadas, ~16 min; harness proprio com shim de git, 43 sondas; FP-1 reproduzido por mim ponta-a-ponta antes de aceitar, e re-verificado curado (guarda cala E lint 0 HARD com a documentacao presente); pos-cura: 18 casos, 10 mutantes mordendo, producao rc=0'
