    label: 'A PECA 1 DA DOUTRINA — o defeito medido e datado, sem o qual nao se forja. 2026-10-03, TRES sitios, e um deles foi pago em AFIRMACAO FALSA SELADA: (1) `.claude/commands/meta/forge.md` injetava uma projecao que cortava 12 de 59 candidatos EM SILENCIO; uma sessao leu a projecao, nao viu o `/meta:evolve` nela, e selou numa migalha que ele tinha "0 de 7 pecas, ausente do censo inteiro" — o `--tsv` dizia 2/7, empatado com 12 outros, com 37 ABAIXO dele. (2) `.claude/skills/onion-research/SKILL.md` injetava `kg-corpus-grep … | head -40` sobre 298 achados: 259 caiam sem uma palavra. (3) `.claude/commands/meta/kg.md` prometia "FILA COMPLETA / CORPUS INTEIRO" antes de `head -20` sobre ~312 itens abertos. A CAUSA COMUM: na superficie INJETADA a sessao le a projecao como se fosse o conjunto — nao ha rolagem, nao ha "ver mais", nao ha pergunta a fazer. Logo ausencia-por-CORTE e indistinguivel de ausencia-por-ZERO, e o leitor conclui zero.'
