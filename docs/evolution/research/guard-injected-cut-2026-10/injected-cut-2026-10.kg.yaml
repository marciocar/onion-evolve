  - id: E_O_DOGFOOD_ACHOU_TRES_DEFEITOS_QUE_LEITURA_NAO_ACHA
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: '2026-10-04'
    source_tier: 10
    label: 'A FORJA SE PAGOU NA PRIMEIRA EXECUCAO, e os tres defeitos sao invisiveis a leitura. (1) O MAIS GRAVE: a guarda de VACUIDADE era INALCANCAVEL exatamente na situacao para a qual existe — `xargs grep -l` devolve 123 sem casamento e, sob `set -euo pipefail`, isso MATAVA o script antes de a guarda falar (rc=123, saida vazia). Pior: isso deixava o caso (c) VERDE PELO MOTIVO ERRADO — o script morria, nada era achado, e o caso lia o silencio como "calou corretamente". Cura: `xargs -r` + `|| true`. (2) O caso (c) nascera com sandbox SEM diretiva nenhuma, logo a vacuidade disparava antes do varredor e o caso era INCAPAZ de reprovar o que afirmava reprovar; cura: o sandbox carrega uma diretiva legitima de proposito. (3) O regex do `sed -n 1,Np` nao capturava a aspa de fechamento, e a mensagem do veto mostraria um comando que nao existe. NENHUM dos tres aparece em revisao de codigo: todos exigiram RODAR.'
    trace: '.claude/validation/injected-cut-check.sh'
    verified_against: '--selftest 14/14 verde apos as curas (era 12/13 na 1a execucao, com o 13o reprovando pelo lado da ASSERCAO); producao rc=0 lendo 5 arquivos com diretiva'
