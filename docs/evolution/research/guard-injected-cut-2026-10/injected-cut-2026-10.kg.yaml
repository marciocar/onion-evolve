      locator: "⚠️ CORRIGIDO 2026-10-04 apos reprovacao: a 1a redacao dizia \"6 mutantes (M1-M6) ... 3 passadas ate os 6 morderem\" e isso DESCREVIA ALGO QUE NAO ACONTECEU — o Elenxo provou que eram 5/6, porque o M4 era NO-OP SEMANTICO (equivalencia medida em 17 casos + varredura do repo inteiro, rc e saida byte-a-byte identicos). A ironia e fechada: o M4 era instancia da QUARTA CAUSA que ESTE PROPRIO NO nomeia (mutante fraco), e eu diagnostiquei a causa errada, atribuindo-a ao bug de vacuidade. HOJE: 10 mutantes, 10 mordendo, com o harness provando a mutacao e o M4 atacando o MECANISMO (os dois filtros redundantes) em vez de um ponto"
