  - id: D_ONION_DISTRIBUTION_CHANNELS_2026_11
    node_type: decision
    layer: audit
    impact: 5
    confidence: 0.55
    label: "Distribuição do Onion: A status quo · B portas + diretório oficial, pacotes em parque · C npm instalador · D npm conteúdo · E PyPI · F MCP próprio · G MCPB · H imagem. Elenxo recomenda B, confiança média; o maestro sela."
    trace: "workflow onion-research em modo decision, run wf_615a4f2b-024, 2026-11-05; pergunta em Q_ONION_DISTRIBUTION_PACKAGES_1105"
    status: done
    plane: DEV
    verified_at: "2026-11-05"
    verified_against: "decisão do maestro em 2026-11-05, por pergunta com opções (/meta:decide): escolhida «Diretório e parque»"
    narrative: |-
      RECOMENDAÇÃO DO ELENXO (INTEIRA):

      Recomendo a opção B: nenhum pacote agora. Manter as quatro portas e o marketplace, e candidatar onion-plugins ao diretório oficial. A confiança é média, porque a demanda real segue sem medida.

      Por que não vale publicar agora:
      - O canal não explica a adoção. Dados de 2026-11-05 (npm: semana de 10-29 a 11-04):
        - OpenSpec: 74.012 estrelas, 1.240.857 npm.
        - BMAD: 55.023 estrelas, 23.215 npm.
        - Spec-kit: 147.665 estrelas, sem npm próprio, 41.925 PyPI.
        - Superpowers: 312.760 estrelas, rota por /plugin, listado no oficial.
        - SuperClaude: 23.928 estrelas, 61 npm, 2.463 PyPI.
      - Download não mede adoção. O kg-ssot tem 0 estrelas e 4 visitantes únicos em 14 dias, e mesmo assim 1.834 npm e 3.116 PyPI por semana. O task-master segue com 12.484 por semana após 7 meses sem publicar.
      - A analogia com o kg-ssot não transfere. Ele publica de fato (o corpus mediu o repo errado, onion-kg-ssot, e não marciocar/kg-ssot), mas é biblioteca que age por import. O veto do Onion age no harness.
      - Não há demanda medida. As portas têm 100 a 105 clones únicos em 14 dias, com séries quase iguais entre si, o que aponta automação, e de 1 a 8 visitantes únicos.
      - Em marketplace próprio, o uso é invisível: 'you have no usage signal'.

      Decisão por forma:
      - **npm com conteúdo: não.** Nenhuma das 315 entradas oficiais usa npm. Soma um pipeline, e um pacote comprometido executa por hook mesmo sem script de install.
      - **npm instalador fino: parque.** Só copia o que git clone e /meta:adopt já entregam. Gatilho: 2 adotantes frios nomeados que não consigam usar /plugin marketplace add nem git clone, com o bloqueio relatado.
      - **PyPI: não.** Nenhuma fonte de plugin é PyPI. O kg-ssot já cobre o uso em Python.
      - **MCP próprio: não por ora.** O veredito sobre grafos já existe em io.github.marciocar/kg-ssot. O Registry está em preview, não é consumido diretamente pelos hosts e tem 'minimal-to-no moderation'. Radar: Caution para MCP por padrão. Gatilho: um cliente fora do Claude Code pedir por escrito o catálogo do framework; ops/mcp-onion-framework é ponto de partida, mas hoje é HTTP com token, voltado ao LibreChat.
      - **MCPB: parque, junto com o MCP.** O plugin já aceita .mcpb dentro de mcpServers.
      - **Imagem: parque.** A doc oferece CLAUDE_CODE_PLUGIN_SEED_DIR para contêiner e CI (não testado aqui). Gatilho: frota de adotante sem saída para git, se a semente falhar.

      Restrições para qualquer publicação futura:
      1. Reusar o molde do release.yml do kg-ssot: OIDC por job, escopo preso a workflow em branch protegida, environment com aprovação humana, sem cache compartilhado, sem pull_request_target com código de fork, ações fixadas por SHA.
      2. Sem scripts de lifecycle.
      3. Provenance conta só como controle necessário, não como prova de código limpo.
      4. Passar pela REGRA 36 (Superfície VENDORIZADA sem nome comercial de cliente) e confirmar o nome antes. npm 'onion' e 'onion-core' já existem (dono não conferido); 'onion-evolve', 'create-onion' e 'onion-framework' estão livres em npm e PyPI.
      5. Gatilho nunca por downloads, clones ou estrelas; só por pedido nomeado ou por sinal de uso do diretório.
      6. Antes de tratar repo e plugin como a opção segura, fazer um spike abrindo repo com hook em pasta não confiada: o vetor do OX está em .claude/settings.json, a mesma forma que as portas usam.

      O que invalidaria a recomendação:
      - O diretório oficial recusar o Onion ou mostrar uso desprezível depois de listado.
      - O Claude Code implementar marketplace do tipo npm.
      - Surgirem 2 adotantes frios bloqueados, como no gatilho acima.
      - Dados de instalação por canal mostrarem que kits de harness único crescem mais por npm do que por plugin.
      - O Onion passar a ter uma peça que age por import.
      - O spike mostrar que o repo clonado executa hook sem confiança.

      O que não ficou fechado:
      - Instalações de plugin não têm número público de fonte primária.
      - Os downloads não foram decompostos entre humano e automação.
      - Quem paga e o que investidores premiam nessa categoria segue sem evidência (pergunta 5).
      - Contraponto autoral não encontrado, só comportamento observado.
      - Os dois PDFs do Radar deram 503.
      - Os critérios de aceite do diretório oficial e o painel de uso não foram lidos.
      - Várias citações vêm de leitura por WebFetch resumido, então confira o trecho antes de selar no grafo.

      NOTA DO ESCRITOR DO GRAFO (não é parte da recomendação): o item 'os dois PDFs do Radar deram 503' valeu para o Elenxo e não se sustenta na hora de escrever. Os dois PDFs responderam 200 em 2026-11-05 e foram lidos com pdftotext; ver E_RADAR_V35_AGENT_PLUGIN_MARKETPLACE_TRIAL_1105, que nomeia um canal de mercado ausente das 8 opções (Agent Plugins e Agent Package Manager).

      verified_against anterior: «recomendação do Elenxo no run wf_615a4f2b-024; o maestro não selou; 40 objeções sobreviventes modeladas como CONSTRAINS»
      Selado por /meta:decide em 2026-11-05: escolhida «Diretório e parque»; descartadas: «Só medir e parquear» · «npm como fonte agora» · «Servidor MCP agora».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-05: «Nenhum canal de pacote tem base medida hoje: o que fazer agora com a distribuição do Onion?»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-05"
      locality: "pessoa"
