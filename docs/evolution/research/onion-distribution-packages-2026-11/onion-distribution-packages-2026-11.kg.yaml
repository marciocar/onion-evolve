nodes:
  - id: Q_ONION_DISTRIBUTION_PACKAGES_1105
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.55
    verified_at: "2026-11-05"
    verified_against: "run wf_615a4f2b-024 de /onion-research em modo decision, 2026-11-05: 19 claims confirmadas, 6 refutadas, 53 objeções julgadas, 40 sobreviventes"
    label: "Distribuir o Onion também como pacote npm, pacote Python e servidor MCP, como o kg-ssot, ou manter só as quatro portas e o marketplace de plugins do Claude Code?"
    narrative: "O Onion deve ser distribuído também como pacote npm, pacote Python e servidor MCP, tal como o kg-ssot faz com seus artefatos, ou manter só as portas públicas (onion-core, onion-standalone, onion-plugins, onion-mini) e o marketplace de plugins do Claude Code? Resposta curta por pergunta. (1) Canal: nenhum concentra adoção medida; as métricas de canais diferentes não se comparam e instalação de plugin não é pública (E_OBJECAO_ACHADO8, E_OBJECAO_ACHADO7). (2) Entrega: plugin dá hook, comando, skill e agente; só a cópia em .claude dá CLAUDE.md, rules e settings; managed settings dão a trava; pacote como instalador só copia (E_OBJECAO_ACHADO6). (3) Cadeia de suprimentos: recorrente, com provenance válida em versão maliciosa, e o escopo do OIDC como controle que manda (E_MINI_SHAI_HULUD, E_PROVENANCE, E_OBJECAO_SRC_VENTUREBEAT). (4) Registry: primária lida, preview, moderação mínima, prova de propriedade e não consumido direto por hosts (E_OBJECAO_ACHADO19, E_OBJECAO_CUT_MCPNAME). (5) Quem paga e o que se premia: sem evidência direta (E_MERCADO, E_LACUNAS). (6) Postura: o pin por sha e o marketplace em git não pedem registro de terceiro (E_OBJECAO_CUT_SHA_PIN). Fica open: o selo é do maestro."
    trace: "pedido do maestro 'abre a pesquisa em modo decision'; pergunta computada pelo workflow em 2026-11-05"
