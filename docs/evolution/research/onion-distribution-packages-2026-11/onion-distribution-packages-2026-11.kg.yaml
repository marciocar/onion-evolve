    label: "LACUNAS: 6 refutadas, 0 não verificadas, 37 fontes e 38 claims cortadas por orçamento; 40 objeções sobreviventes de 53, 40 modeladas; 0 recusas do motor; 32 superações. Demanda real, instalações e quem paga seguem sem medida."
    narrative: "REFUTADAS NA VOTAÇÃO (6): (1) Radar 'MCP by default' em Caution, tier 8, reprovada por 'só compensa' pesar a mão: superação C_SUPERACAO_20261105_REFUTED_RADAR_MCP_BY_DEFAULT_CORRECTED. (2) 170+ npm e 2 PyPI, JFrog, tier 6, desatualizada: superação C_SUPERACAO_20261105_REFUTED_MAY_CAMPAIGN_COUNTS_CORRECTED. (3) cache envenenado e OIDC como vetor de propagação, JFrog, tier 6: superação C_SUPERACAO_20261105_REFUTED_OIDC_TANSTACK_POSTMORTEM_CORRECTED. (4) Trusted Publishing confiando em qualquer workflow, Phoenix, tier 5: superação C_SUPERACAO_20261105_REFUTED_SAP_CAP_ENVIRONMENT_CORRECTED. (5) 'único vetor é preinstall e ignore-scripts bloqueia a cadeia', Phoenix, tier 5: refutação mantida pelo Elenxo, com gatilho import-time no PyPI, optionalDependencies e persistência em .claude/settings.json. (6) 'valor na camada de agente, não no canal', TNW, tier 5: refutação mantida; 'não o canal de pacote' não está no artigo. NÃO VERIFICADAS: 0. CORTADAS POR ORÇAMENTO: 37 fontes e 38 claims; 14 claims cortadas voltaram pelas objeções E_OBJECAO_CUT_* e 9 fontes não lidas, pelas E_OBJECAO_SRC_*. OBJEÇÕES: 53 julgadas, 40 sobreviventes, 40 modeladas, 0 não modeladas; 13 NÃO SOBREVIVERAM: Achado 1 (marketplace é repo git); Achado 3 (mesmo fato do 1); Achado 4 (mesmo fato do 2); Achado 10 (Mini Shai-Hulud); Achado 11 (provenance insuficiente); Achado 12 (keyv e cacheable); Achado 14 (provenance não prova runtime); Achado 15 (versões SAP); Achado 17 (440+ pacotes); descarte 'único vetor é preinstall' (refutação mantida); descarte 'valor na camada de agente, não no canal' (refutação mantida); corte 'MCPB não vai ao registry' (claim falsa, contradiz package-types); fonte não lida dev.to akaranjkar08 (descarte aceitável). RECUSADAS PELO MOTOR: 0, nenhum alvo fica não-julgado por recusa. O QUE NÃO FICOU FECHADO: instalações de plugin não têm número público de fonte primária; downloads não foram decompostos entre humano e automação; quem paga e o que investidores premiam segue sem evidência (pergunta 5); contraponto autoral não encontrado, só comportamento; critérios de aceite do diretório oficial e painel de uso não lidos; várias citações vêm de WebFetch resumido, confira o trecho antes de selar; KICS e LiteLLM sem confirmação; regras atuais de token do npm sem primária; repo com hook em pasta não confiada sem spike; semente CLAUDE_CODE_PLUGIN_SEED_DIR não testada; Agent Plugins e Agent Package Manager fora das opções e não medidos. NOTAS DO ESCRITOR: (a) a recomendação diz 'os dois PDFs do Radar deram 503', mas o motor de superação já os havia lido e o escritor os baixou com 200 em 2026-11-05: o 503 foi momentâneo. (b) O texto da superação SAP chegou cortado em 600 caracteres na tarefa; o integral foi recuperado do diário do run, não da memória do escritor. (c) Nada foi cortado nas 40 objeções: 40 sobreviventes, 40 modeladas, nenhum alvo não modelado."
