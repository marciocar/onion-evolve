    label: 'System One Model e uma CLASSE de modelo (nome vindo do System 1 de Kahneman: rapido e intuitivo), nao um modelo. Jev e o primeiro e unico exemplar. Ele entende linguagem natural como um LLM, mas NAO escreve texto, NAO produz codigo e NAO explica o proprio raciocinio: avalia um `state` e devolve respostas TIPADAS com distribuicao de probabilidade. O espaco de respostas e definido por quem chama, nao pelo modelo.'
    trace: 'https://docs.typesafe.ai/concepts/system-one'

  - id: E_RLCD_TERCEIRA_VIA_DE_POS_TREINO
    node_type: evidence
    plane: DEV
