    source_tier: 10
    source_kind: primary
    label: 'RLCD (Reinforcement Learning for Calibrated Decisions) e apresentado como a TERCEIRA via de pos-treino, ao lado de RLHF (que fez chatbots) e RLVR (que fez modelos de raciocinio). O contrato de saida do RLCD: nao gerar texto, devolver decisoes + probabilidades, e probabilidade maior deve corresponder a chance maior de acerto. A critica ao RLHF e especifica: sicofancia, alucinacao com tom confiante, e MODE DROPPING (a preferencia estreita a distribuicao). O argumento tem peso incomum de proveniencia: Diogo Almeida CO-INVENTOU o RLHF que ele agora aponta como inadequado para automacao.'
    trace: 'https://docs.typesafe.ai/introduction/machine-learning-primer'

