    label: 'A superficie inteira sao TRES primitivas de pergunta, avaliadas em PARALELO contra um mesmo `state`, num unico POST /v1/systemone: (1) NOUL — sim/nao, devolve so um float 0..1, SEM confidence; (2) CHOICE — uma opcao de um conjunto (ate 255), devolve a escolhida + probabilidade de CADA opcao + confidence; (3) SCORE — nota contra niveis ordenados (2 a 10), devolve valor ponderado por probabilidade (pode cair ENTRE niveis, ex. 1.05) + legend + probabilidades + confidence. Cada pergunta e independente: o resultado de uma nao vira contexto oculto de outra.'
    trace: 'https://docs.typesafe.ai/api'

