      locator: "família selftest_family_merge, caso (c)"
      method: "medição: rebase de fixture com merge=union"
      locality: "repo"

  - id: E_PATCH_ID_MUDA_PELO_CONTEXTO
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 2
    confidence: 0.9
    label: "Resolvido pelo driver, o hash de código do resíduo (patch-id --stable sobre diff -U3) MUDA, porque o contexto do bloco do PR passa a ser o bloco vizinho; as linhas acrescentadas (-U0) são idênticas antes e depois."
    narrative: "Medido na prova: patch-id 8e3555321907 antes e 141e5db2dee0 depois do rebase; o sha das linhas +/- com -U0 é 3c75d1f29eb0 nos dois. A re-revisão continua pelo caminho de sempre (reviewed_diff_sha256: pendente), e o pr-finalize declara a resolução numa linha PR-FINALIZE antes de parar no carimbo."
    verified_at: "2026-10-15"
    verified_against: "git diff <commit>~1 <commit> | git patch-id --stable, antes e depois do rebase da branch de fixture"
