meta:
  id: selftest-family-merge-2026-10
  schema_version: "1"
  layer: audit
  baseline: "2026-10-15"
  review_after: "2026-11-15"
  note: "SAC-146: PRs em paralelo que acrescentam família nova na bancada colidem na mesma âncora do lint-selftest.sh. Medição, opções pesadas e a cura (driver de merge das famílias)."

nodes:
  - id: E_FAMILIAS_NA_MESMA_ANCORA_2026_10_15
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.9
    label: "Os PRs #1133, #1134 e #1135 acrescentaram cada um uma família depois da MESMA linha da bancada; o #1134 e o #1135 foram resolvidos à mão (os dois blocos mantidos) e re-revisados. Já tinha ocorrido em 2026-10-07 (#951)."
    narrative: "O registro de família é posicional: a função `run_<x>_selftests` e a invocação `_family run_<x>_selftests` entram no ponto em que o autor escolhe, em geral logo depois da família mais nova. `--list`, `--map` e o seletor derivam do próprio arquivo; a única outra lista é SELFTEST_CORE_ONLY_FAMILIES, no motor, editada por 9 commits desde 2026-09-01 contra 119 que mexem em `_family run_` (medição do refutador). A âncora é, portanto, o fim da família mais recente, e todo PR que nasce da mesma main a escolhe. Dois PRs que acrescentam família core-only colidem também naquela linha, e aí o driver (tudo-ou-nada) devolve o conflito inteiro, como deve."
    verified_at: "2026-10-15"
    verified_against: "git show -U0 de97d324, f1724eaf e 56e2e001 -- .claude/validation/lint-selftest.sh (hunks depois de residue_schema, merge_hooks_prune e sync_main_worktree); commits b1b65025 e dc32597b (re-revisão da resolução do conflito); 17c32516 (2026-10-07)"
    provenance:
      source: "git log do core e gh pr view 1133/1134/1135"
      locator: "commits de97d324, f1724eaf, 56e2e001, b1b65025, dc32597b, 17c32516"
      method: "medição: hunks e mensagens de commit no histórico"
      locality: "repo"

  - id: E_REPLAY_HISTORICO_COM_O_DRIVER
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.85
    label: "Reaplicando os três blocos REAIS (#1133, #1134, #1135) sobre a mesma base: sem o driver os dois rebases conflitam; com o driver os dois saem limpos e o arquivo final é o da main pós-#1135 a menos de uma linha em branco trocada de lugar."
    narrative: "Replay num repositório de rascunho: base = de97d324^, cada bloco extraído do seu commit e inserido na âncora original. A diferença única (32533a32534 / 32633d32633) é a linha em branco entre blocos, que a mão pôs de outro jeito. A prova com duas branches de fixture sobre o lint-selftest.sh atual também saiu limpa, com a bancada verde nas famílias acrescentadas."
    verified_at: "2026-10-15"
    verified_against: "replay em scratchpad (rebase prB e prC sobre main, com e sem -c merge.onion-selftest-families.driver) e diff contra git show 56e2e001:.claude/validation/lint-selftest.sh"
    provenance:
      source: "replay local do histórico"
      locator: "base de97d324^; blocos de de97d324, f1724eaf, 56e2e001"
      method: "medição: rebase reproduzido"
      locality: "repo"

  - id: E_UNION_APAGA_EDICAO_DA_MESMA_LINHA
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.95
    label: "Com `merge=union` no lint-selftest.sh, duas edições da mesma linha (a lista SELFTEST_CORE_ONLY_FAMILIES) saem num rebase LIMPO e com duas atribuições: a segunda vence e a família da primeira some da lista sem conflito."
    narrative: "O union vale para o arquivo inteiro, não por trecho; num arquivo de 36 mil linhas de código, todo conflito real viraria concatenação. É o caso (c) da família selftest_family_merge, que o reproduz a cada rodada da bancada."
    verified_at: "2026-10-15"
    verified_against: "lint-selftest.sh --families selftest_family_merge, caso (c)"
    trace: ".claude/validation/lint-selftest.sh"
    provenance:
