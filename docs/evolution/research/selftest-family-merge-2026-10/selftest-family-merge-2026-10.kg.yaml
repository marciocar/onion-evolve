      method: "medição: patch-id e sha das linhas -U0, antes e depois do rebase"
      locality: "repo"

  - id: D_DRIVER_DE_MERGE_DAS_FAMILIAS
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 3
    confidence: 0.8
    label: "A bancada ganha um merge driver próprio, ligado pelo .gitattributes e passado pelo pr-finalize --rebase, que resolve SÓ o conflito de famílias inteiras acrescentadas lado a lado; em qualquer outro caso, o merge de texto padrão."
    narrative: "Opções pesadas: (union) descartada pela perda silenciosa medida; (família por arquivo, descoberta por glob) adiada: elimina o conflito e o contexto do patch-id, mas pelo menos cinco leitores estáticos do arquivo (harness-inventory, lint-artifacts, preflight-families/run/shadow) e o seletor interno teriam de aprender o diretório, num PR grande; (convenção: no fim, ou em ordem alfabética) não é mecanismo e o fim é justamente a âncora comum; (nada) custa uma volta à mão por colisão. O driver é tudo-ou-nada: base vazia, região de famílias, ponto no topo depois de uma invocação, cada lado bloco inteiro (termina em _family e passa no bash -n sozinho), nenhum nome de topo repetido, resultado no bash -n. Sem a config, o git cai no merge de texto. Decisão tomada pelo agente sob a autorização do maestro de 2026-10-15 (opção recomendada), não por pergunta."
    verified_at: "2026-10-15"
    verified_against: "lint-selftest.sh --families selftest_family_merge (12 casos verdes) e 11 mutantes por ops/mutate-and-restore.sh, todos mordendo (um deles achado pelo refutador, que antes passava)"
    trace: "ops/merge-drivers/selftest-families.py"
    provenance:
      source: "agente de execução do SAC-146, autorização delegada do maestro (2026-10-15)"
      locator: "SAC-146; PR deste grafo"
      method: "derivado: opção recomendada pelo agente sob autorização delegada, declarada no resíduo"
      locality: "repo"

  - id: Q_REREVISAO_SO_PELO_CONTEXTO
    node_type: question
    plane: DEV
    status: open
    impact: 2
    confidence: 0.5
    label: "Vale dispensar a re-revisão quando o hash de código mudou SÓ pelo contexto (as linhas +/- com -U0 iguais às revisadas e a resolução declarada pelo driver)? Hoje o resíduo não guarda o hash -U0, então não há como provar."
    narrative: "Gatilho: a próxima colisão resolvida pelo driver em que a re-revisão custar uma volta de CI. Pré-condição: o resíduo ganha um segundo hash (-U0) carimbado pelo pr-finalize, e a dispensa passa pelo Elenxo, porque mexe na REGRA 56."
    trace: "ops/pr-finalize.sh"

  - id: Q_FAMILIA_POR_ARQUIVO
    node_type: question
    plane: DEV
    status: open
    impact: 2
    confidence: 0.4
    label: "Família nova num arquivo próprio, descoberto por glob, se paga? Elimina o conflito e mantém o patch-id estável no rebase, ao preço de ensinar o diretório a todos os leitores estáticos da bancada."
    narrative: "Gatilho: colisão que o driver devolve como conflito (fora do caso que ele resolve) mais de duas vezes num mês, ou a re-revisão pelo contexto (Q_REREVISAO_SO_PELO_CONTEXTO) virar o custo dominante."
    trace: ".claude/validation/lint-selftest.sh"

