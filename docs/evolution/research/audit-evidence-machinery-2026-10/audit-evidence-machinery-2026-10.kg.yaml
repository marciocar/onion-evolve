nodes:
  - id: Q_AUDIT_EVIDENCE_MACHINERY_2026_10
    node_type: question
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    label: "Quais afirmações de mercado da pesquisa do adotante, verificadas em primária em outubro de 2026, servem de base para o vocabulário de evidência (item 1) e para o radar de vencimento (item 2), e o que fica com o contrato kg-ssot versus com o core?"
    narrative: |-
      Pergunta da rodada (2026-10-21), originada pela decisão D_AUDITORIA_CONTINUA_PESQUISA_ANTES_DE_1_2 (em docs/onion/graph/sinais-de-campo-2026-09.kg.yaml desde o PR #1244) e pelo sinal do hub regulado, redigido em docs/evolution/inbox/_processed/2026-10-20-audit-evidence-machinery.md. Campos propostos pelo sinal para o item 1: evidence_type, oscal_method (EXAMINE/INTERVIEW/TEST), acceptance, frequency, owner_role, location como ponteiro, retention, source_norm, claim_class. Item 2: radar que lê vencimento por verified_at + frequency.
      RECOMENDAÇÃO DO ELENXO (íntegra; afirmação de UM agente, sem votação): O QUE A RODADA SUSTENTA. (1) Desenho de estado: as três ferramentas de mercado medidas guardam o estado no banco do próprio produto: CISO Assistant em SQLite/Postgres, Probo em Postgres, Comp AI em Postgres+Redis. O Lula v2 saiu do OSCAL como armazenamento para YAML em Git e mantém o OSCAL só na importação. Isso apoia 'grafo YAML em git é o armazenamento, OSCAL é formato de borda (importação/exportação)'. O apoio vem de um único fornecedor, sinal fraco e não convergência de mercado. (2) OCSF 1.9.0, Compliance Finding 2003, é alvo de EXPORTAÇÃO de achado, não base de vocabulário. (3) A licença do SCF (CC BY-ND, derivado só com licença comercial, IA inclusa) VETA montar o vocabulário de evidência a partir do ERL e distribuí-lo nas portas públicas. (4) O trestle (Apache-2.0) é CANDIDATO a validador de exportação, nada mais. O QUE ELA NÃO SUSTENTA. (a) O campo oscal_method (EXAMINE/INTERVIEW/TEST) e 'location como ponteiro' não têm âncora. A versão do OSCAL, v1.2.3 de 2026-08-07, foi medida pela API, mas o texto dos métodos precisa de reancoragem verbatim do reference v1.2.3. 'acceptance' não existe no OSCAL e seria cunhagem do Onion, a declarar como tal. (b) O radar de vencimento (verified_at + frequency) NÃO pode se apoiar no FedRAMP 20x nesta rodada: as seis claims caíram, e a evidência do verificador contraria os '7 dias' como cadência recorrente (FRC-APP-FCP é o pacote inicial; a recorrente é CPO-CSX-CPM, por classe). (c) O trestle não está provado validando AR/POA&M, e declara OSCAL 1.2.1 contra a 1.2.3 vigente. (d) CycloneDX/VEX, formatos do CCM/CAIQ e capital/mercado continuam abertos. O eixo de mercado é invariante da doutrina, então não fecha por comodismo. DIVISÃO kg-ssot contra core. É inferência de desenho, NÃO evidência desta rodada, e vai ao maestro como pergunta. Ao contrato kg-ssot cabem só os campos neutros de domínio que estendem o que ele já tem: frequency/cadência por nó ao lado de verified_at; location como especialização de provenance.locator, que já existe; retention; owner_role. Ao core e ao hub regulado ficam os campos de domínio de auditoria: evidence_type, oscal_method, acceptance, source_norm e claim_class, e o leitor de vencimento no kg-radar.sh, que já tem STALE-OLD por cadência. A exportação OSCAL também fica com eles. Corpus hoje: kg-corpus-grep.sh devolve 0 nós para oscal_method, evidence_type, source_norm, claim_class, owner_role e OSCAL; a lacuna é real e deve virar nó. PARA O /meta:decide (pedido do usuário: 'traga no decide'). Cinco perguntas ao maestro: (i) selar 'grafo = armazenamento, OSCAL = borda' sobre o sinal Lula + três bancos relacionais; (ii) autorizar uma rodada de reancoragem do OSCAL v1.2.3 (methods, relevant-evidence) e do FedRAMP CPO-CSX-CPM antes de escrever os itens 1 e 2; (iii) declarar o SCF/ERL fora da base por licença e escolher a norma de origem alternativa, cuja licença também falta medir (usnistgov/OSCAL dá NOASSERTION); (iv) aprovar a divisão de campos contrato/core acima ou rejeitá-la; (v) aceitar o trestle como candidato de validação condicionado a um dogfood real de trestle validate sobre um AR exportado.
      NOTA DO ESCRITOR (medida no core, 2026-10-21): duas premissas da recomendação estão erradas e foram corrigidas por evidência interna. (1) O kg-radar.sh NÃO tem STALE-OLD por cadência: ele compara verified_at com meta.baseline (E_CORE_RADAR_STALE_OLD_IS_BASELINE_NOT_CADENCE); o item 2 é construção nova, não extensão de um leitor de cadência. (2) O contrato kg-ssot v4 fecha as chaves do nó num enum de 22 (MUST) e já tem owner; campo novo sem x_ reprova (E_CORE_CONTRACT_NODE_KEYS_CLOSED). Isso não muda a divisão proposta, mas muda o caminho: no core, antes de o contrato mudar, os campos só existem como x_.
