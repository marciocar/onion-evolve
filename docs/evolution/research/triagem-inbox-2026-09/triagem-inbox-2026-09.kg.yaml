    verified_against: "RESPONDIDA E CONSTRUIDA em 2026-09-26, por escolha do maestro num formulario com as opcoes nomeadas: `ops/door-seal-pin.sh <membro>` (irmao novo em ops/, pelo MESMO motivo que poe o audit-adopters-registry.sh la — precisa do clone da porta e do remoto, e nenhum dos dois existe no CI). Ele VERIFICA e carimba: le o pin do stamp da porta, prova que e commit deste core, prova que esta em origin/<integracao>, prova o PUSH pelo remoto via forge (clone == remoto) e so entao carimba `onion_version` cirurgicamente. Fail-closed nas seis portas de saida, todas presas na bancada (run_door_seal_pin_selftests, 9 casos). Invocado pelo maestro APOS o push — a fronteira I3 fica intacta, e o materialize-door.sh passou a imprimir o comando do carimbo como segundo passo. Dogfood no estado vivo: rc=0, `registro ja em dia`. FICA MANUAL por decisao do maestro: as duas linhas de dado do door-staleness-baseline.txt. == REGISTRO ANTERIOR, preservado: Medido no mesmo dia, DUAS vezes: (1) a porta foi publicada em 07c81b974880 e o `onion_version` do registro seguiu em d425501b14bc; avancei a mao e escrevi no proprio members.yaml que numero mantido a mao apodrece. (2) Duas horas depois, publicada em 5063e81b2d8d, o campo ficou atras OUTRA VEZ, e a REGRA 85 seguiu acusando 3 commits de defasagem porque ela le o REGISTRO, nao a porta. Tambem medido: `pin-integrity-check.sh . <clone local de onion-core>` devolve `pin-untrusted unknown` — nenhuma guarda confere este campo contra o publicado."
    label: "QUEM CARIMBA O PIN DA PORTA DEPOIS DO PUSH? Hoje: ninguem — e o numero e mantido A MAO num campo que a REGRA 85 (Porta publica espelha o core, com catraca) LE para decidir defasagem. Logo a guarda pode acusar defasagem que nao existe (foi o que fez duas vezes hoje) ou, pior, calar sobre uma que existe. O gatilho de mecanizacao DISPAROU DUAS VEZES NUM DIA, que e o criterio desta casa para parar de aconselhar e construir. DESENHO CANDIDATO, com a costura ja pronta: o `ops/materialize-door.sh` PARA antes do push por desenho (I3 — publicar e ato do maestro), entao o carimbo nao cabe nele; cabe num irmao pos-push, algo como `ops/door-seal-pin.sh <membro>`, que (a) le o remoto pelo forge (`gh api repos/<owner>/<repo>/commits/<branch>`) — o MESMO comando que o ciclo ja roda a mao para verificar, (b) so carimba se o remoto de fato bater com o pin materializado, fail-closed se nao conseguir ler, e (c) atualiza o `onion_version` E as duas linhas de dado do `door-staleness-baseline.txt`. ⚠️ RESTRICAO MEDIDA que qualquer automacao tem de respeitar: o `--emit-baseline` devolve SO as duas linhas de dado, e redirecionar a saida dele por cima do arquivo apagaria ~170 linhas de historico — saida destrutiva PLAUSIVEL, porque o gerador sai 0 e o arquivo fica nao-vazio. A atualizacao tem de ser cirurgica. ESTE NO MORA AQUI, e nao no fios-abertos, porque o teto daquele arquivo e catraca que so ENCOLHE e porque o fato mora onde nasceu — a decisao de cobrar a defasagem pos-merge (`D_ONDE_COBRAR_A_DEFASAGEM_DA_PORTA`) e deste grafo. GATED na decisao do maestro sobre construir; o diagnostico esta fechado."
