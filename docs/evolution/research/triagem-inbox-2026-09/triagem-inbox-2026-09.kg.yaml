    node_type: decision
    plane: PROD
    impact: 4
    confidence: 0.9
    status: open
    verified_at: '2026-09-22'
    verified_against: 'grep -c SUPERSEDES no grafo da rodada 5 = 0; versoes citadas no corpus claude-code-2.1-onion-2026-08 = 2.1.211 a 2.1.233; cc_version da baseline E3 = 2.1.278; kg-radar --freshness nos dois grafos com revisita vencida = 0 nos STALE'
    label: 'DIVIDA DE AUFHEBUNG MEDIDA (2026-09-22): o comando /meta:radar declara como invariante "write(KG) por rodada: grafo proprio com SUPERSEDES sobre os nos da baseline anterior que a rodada derrubar (Aufhebung)". O grafo da rodada 5, selado em 2026-09-21, tem ZERO arestas SUPERSEDES. A consequencia e visivel no lint: o corpus claude-code-2.1-onion-2026-08 cobre 2.1.211 a 2.1.233 e a baseline E3 hoje e 2.1.278 — 45 versoes a frente —, e a REGRA 67 (Grafo de pesquisa com REVISITA carimbada) acusa revisita vencida que vai VENCER DE NOVO faca-se o que se fizer, porque nenhuma rodada jamais reconciliou o corpus que superou. Os 35 nos daquele grafo tem 0 STALE pelo --freshness: o que venceu foi a DATA do review_after, nao a verdade medida dos nos — o que torna a reconciliacao um ato de MODELAGEM (quais nos a rodada nova derruba), nao de re-medicao. DECISAO DO MAESTRO: reconciliar os 35 nos agora, ou mecanizar o SUPERSEDES na propria rodada do radar para a divida parar de crescer, ou as duas.'

  - id: E_BANCADA_EM_FAIXA_NAO_REPLICA_A_FALHA
    node_type: evidence
    plane: PROD
    impact: 3
    confidence: 1.0
    status: open
    verified_at: '2026-09-22'
    verified_against: 'rodada de 2026-09-22 com --affected-staged --jobs auto (183 familias / 8 workers em 1117s): 1409 passaram, 1 falhou, e a busca no arquivo de saida devolveu a linha do NOME e nada mais; a mesma familia rodada isolada deu 3 passes'
    label: 'MEDIDO AO VIVO: a bancada em faixa paralela (--jobs auto) imprime, no rodape, apenas o NOME do caso que falhou — sem a saida que o record_fail capturou. O flaky `kg-reverify-schema: selftest` caiu numa rodada de 1409 casos e a unica informacao foi a string do nome. Isto contradiz a licao ja registrada na casa de que "a falha agora carrega a saida": a cura de diagnosticabilidade existe, mas NAO alcanca o caminho da faixa paralela — que e justamente o caminho que o CI e o pre-commit usam. Flaky sem saida capturada e flaky para sempre.'

