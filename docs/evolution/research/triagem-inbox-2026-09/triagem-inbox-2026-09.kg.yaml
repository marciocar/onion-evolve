    label: 'ITEM 1 DO SINAL DE 2026-09-07 — o unico dos seis ainda aberto (3, 5 e 6 ja estavam curados quando triei; 2 e 4 foram curados no mesmo dia). O README do design-sink declara "adapter reutilizavel pendente" e agora ha DOIS casos reais: o css duplo do portal e o tokens-to-theme.mjs do app Expo. O adotante forjou a versao completa em Node puro: resolve {alias} dentro de composites, separa foundation de papel por literal-vs-alias, exige paridade claro/escuro e emite `const dark: typeof light` (paridade NO TIPO), com modo --check no lint. POR QUE NAO AGORA: N=2 e o limiar minimo, mas os dois sinks tem alvos diferentes (css-vars vs objeto TS) e generalizar antes do terceiro e catedral — pull-not-push aplicado a minha propria recomendacao. GATILHO NOMEADO: um TERCEIRO sink real, ou o maestro mandar.'
