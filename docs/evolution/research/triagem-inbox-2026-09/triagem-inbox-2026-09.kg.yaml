  - id: E_REGRA_85_E_INSATISFAZIVEL_ANTES_DO_MERGE
    node_type: evidence
    plane: PROD
    impact: 4
    confidence: 1.0
    status: confirmed
    verified_at: '2026-09-23'
    verified_against: 'artefato `lint-evidence-35929817914` BAIXADO do run do PR #869 e renderizado por ops/testing/lint-summary.sh: 3 HARD, e DOIS deles sao as linhas da REGRA 85 (onion-core 4>0, onion-standalone 412>408). Isto REFUTA a leitura que eu havia escrito horas antes a partir do run 35903248855 (0 HARD, zero ocorrencia de REGRA 85): aquele run e de 18:33 e PRECEDE o merge do #868, ou seja a porta ainda nao estava defasada quando ele rodou — eu li ausencia-de-defeito como ausencia-de-guarda'
    label: 'A REGRA 85 (Porta publica espelha o core, com catraca) DISPARA no CI — e o problema real e outro, mais duro: ela e ESTRUTURALMENTE INSATISFAZIVEL antes do merge. A cura que ela cobra (re-materializar a porta) so existe depois de o trabalho estar em `main`, porque materializar do HEAD da branch publicaria trabalho nao-mergeado numa porta PUBLICA. Consequencia medida neste PR: o CI fica VERMELHO por 2 HARD que nenhuma acao no PR pode limpar. O proprio `door-staleness-check.sh` ja escreve a frase que fecha o argumento: "uma guarda que so pode ser satisfeita depois do merge nao e gate de pre-merge" — e ela esta escrita ALI para justificar medir contra o merge-base, sem que ninguem tenha tirado a conclusao seguinte, que e sobre o MOMENTO da cobranca, nao sobre a ponta da medicao.
      ⚠️ REGISTRO DO MEU ERRO, porque a classe importa mais que o achado: eu tinha escrito neste mesmo grafo um no afirmando que a guarda "emite zero no CI", derivado de UM run, num UNICO instante, tratado como propriedade estrutural. Uma amostra nao distingue "a guarda nao dispara" de "nao havia o que acusar quando ela rodou". Corrigido no rascunho, antes do merge, em vez de Aufhebung — o no nasceu e caiu no mesmo PR.'

  - id: D_ONDE_COBRAR_A_DEFASAGEM_DA_PORTA
    node_type: decision
    plane: PROD
    impact: 4
    confidence: 0.8
    status: open
    verified_at: '2026-09-23'
    verified_against: 'derivado de E_REGRA_85_E_INSATISFAZIVEL_ANTES_DO_MERGE, medido no PR #869'
    label: 'DECISAO DO MAESTRO: em que MOMENTO cobrar a defasagem da porta. Hoje a cobranca e no lint de PR, e a cura so existe depois do merge — entao todo PR nasce com 2 HARD que ele nao pode limpar, e o registro do `door-staleness-baseline.txt` mostra que isto ja se repetiu ao menos quatro vezes ("O gate fica VERMELHO ate o push"). Tres opcoes. (1) MANTER e tratar o vermelho como espera legitima — honesto, mas normaliza merge com gate vermelho, que e o unico habito capaz de corroer todos os outros gates. (2) MOVER A COBRANCA PARA DEPOIS DO MERGE: um passo no push para `main` que abre issue/avisa, casando o gatilho com o unico momento em que a cura E possivel. (3) TOLERAR UMA JANELA EXPLICITA no baseline (ex.: teto 0 vira "0 desde o ultimo push verificado"), o que exige a guarda saber ler o remoto. RECOMENDO A (2): nao pede catedral, so muda o momento, e passa no teste do gatilho — a dor ja ocorreu 4+ vezes e esta registrada no proprio baseline.'

