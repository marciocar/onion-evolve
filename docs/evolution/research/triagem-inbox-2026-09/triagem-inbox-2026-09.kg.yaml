    verified_at: '2026-09-22'
    verified_against: 'medicao no kg-radar.sh em 2026-09-22: pagerank/amortecimento = 0 ocorrencias; ciclo|cycle = 0; condicao composta done+PROD = 0; SUPPORTS = 1 (so a string do enum); migalha aparece so em ⚠; validFrom/sourceTier = 11 (CURADO pelo #865); review_after = 12 (lido pela secao VALIDADE); corpus vivo: 4.021 status, 0 fora do enum, 0 drifted'
    label: 'SINAL DE 2026-09-10 (jogo-da-vida): um adotante foi LER a doutrina do KG para construir um produto em cima dela e conferiu, com arquivo:linha dos dois lados, se ela e verdade no codigo. Nao e, em onze pontos. Re-medido hoje, TRES ja cairam: #6 (bi-temporal) curado pelo PR #865 — o motor le valid_from/source_tier e mede 110 de 110 nos; #7 (review_after) e lido pela secao VALIDADE; e #8 era o INVERSO (a doutrina afirmava que status fora do enum passava sem gate, "11 circulando hoje"; o codigo REPROVA e o corpus tem 4.021 status com ZERO fora) — curado nesta triagem, riscando a linha em vez de apaga-la. RESTAM OITO, e o placar que doi e este: knowledge-graph-sdaal.md:195-196 promete CINCO reprovacoes de integridade e o motor implementa UMA (nos orfaos) — tres ausentes (#2 ciclo DEPENDS_ON, #3 decision done fora de PROD, #4 refuted recebendo SUPPORTS) e uma rebaixada a aviso (#5 migalha pendente). Mais #1 (a atencao e impact x conf x sf x (1+grau) nao-direcionado, nao PageRank ponderado) e #10 (a perna de LEITURA e conselho, nao mecanismo). DECISAO DO MAESTRO, e e de PRODUTO: implementar as quatro reprovacoes que faltam, ou corrigir a KB para dizer o que o motor faz — a lista correta ja esta no cabecalho do proprio motor, kg-radar.sh:27-29.'
    trace: 'docs/evolution/inbox/_processed/2026-09-10-doutrina-versus-codigo-no-motor-do-kg.md'

  - id: D_LACO_DE_RECONCILIACAO_CONSTRUIDO_E_PARADO
    node_type: decision
    plane: PROD
    impact: 4
    confidence: 1.0
    status: open
    verified_at: '2026-09-22'
    verified_against: 'varredura do corpus em 2026-09-22: 0 ocorrencias de `status: drifted` em 4.021 campos status de 100 grafos (eram 0 em 3.715 quando o sinal chegou — o corpus cresceu 306 nos e o contador nao saiu do lugar)'
    label: 'O ACHADO #9 DO SINAL DE 2026-09-10, separado porque nao e bug e sim DESENHO parado: `drifted` e o unico fator de status que SOBE a atencao (1.3 em lib/status-factor.awk) e existe desde 2026-08-06 como saida do /meta:kg-freshness — e o corpus tem ZERO nos com ele. Sem `drifted`, selar um drift so da para RECUSAR (exit 1) ou MENTIR de `refuted`, que zera a atencao justamente do no que acabou de provar que a realidade andou. A auto-avaliacao do proprio core confirma o buraco por outro angulo (company-brain-market-2026-07.kg.yaml, C_three_verbs_selfcheck): /meta:kg-freshness com 0 runs em 34 dias. DECISAO DO MAESTRO: o laco esta parado por falta de GATILHO (ninguem roda o freshness), por falta de CAMINHO (o comando nao se encaixa no fluxo), ou porque `drifted` nao serve e o desenho deve mudar? As tres tem cura diferente, e medir mais nao distingue entre elas — e chamada de produto.'

