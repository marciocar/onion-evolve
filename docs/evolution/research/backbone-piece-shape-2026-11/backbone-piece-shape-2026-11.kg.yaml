  - id: Q_BACKBONE_PIECE_SHAPE_2026_11
    node_type: question
    layer: audit
    impact: 5
    confidence: 0.5
    label: "Que forma deve ter a peça do backbone de comunicação do Onion (fila, gate A2A, conectores Slack e e-mail, sobre A2A 1.0, CloudEvents e MCP): repo próprio com vendor carimbado (A), núcleo no monorepo com staging (B) ou pacote publicado (C)? E onde fica a fronteira open-core?"
    trace: "docs/evolution/research/backbone-piece-shape-2026-11/SYNTHESIS.md; pergunta do run /onion-research em modo primaries de 2026-11-12, computada pelo workflow"
    status: done
    plane: DEV
    verified_at: "2026-11-12"
    verified_against: "decisão do maestro em 2026-11-12, por pergunta com opções (/meta:decide): escolhida «A, medindo C depois: repo e sessão próprios, semver, e o consumidor recebe só o cliente e o gate por vendorização carimbada (tag, commit e sha256 por arquivo), no molde do kg-ssot; a medida do pacote publicado (Q_MEASURE_OPTION_C_PACKAGE_VS_STAMPED_VENDOR) roda antes do empacotamento open-core e, se ganhar, substitui a entrega»"
    narrative: |-
      Pergunta computada pelo workflow /onion-research em modo primaries (2026-11-12), com quatro lacunas nomeadas: G1 onde mora o núcleo; G2 como o consumidor recebe; G3 fronteira open-core e licença, para que a governança seja a parte paga sem trair a camada aberta; G4 governança de especificação contra implementação. Corpus prévio que pesa (declarado pela tarefa, não medido por este escritor): os selos D_COMMS_BACKBONE_COMPOSED_1112 e D_COMMS_BACKBONE_VALUE_TABLE_1112; onion-messaging já é repo próprio registrado como membro; onion-bridge em produção sem sessão dona; o gate A2A vive em duas cópias sem carimbo; precedente interno kg-ssot (repo e sessão próprios, semver, vendor/kg-ssot/ com carimbo por arquivo). O que a rodada sustenta: G2 por vendorização com manifesto verificável, G4 por conformidade mecânica mais tabela de suporte, G3 por licença OSI permissiva, corte pelo comprador provável e promessa pública. O que NÃO sustenta: a escolha entre A e B (os dois precedentes existem), o descarte de C (sem medida) e a posição do gate A2A na fronteira. Fica open: o selo é do maestro.

      Selado por /meta:decide em 2026-11-12: escolhida «A, medindo C depois: repo e sessão próprios, semver, e o consumidor recebe só o cliente e o gate por vendorização carimbada (tag, commit e sha256 por arquivo), no molde do kg-ssot; a medida do pacote publicado (Q_MEASURE_OPTION_C_PACKAGE_VS_STAMPED_VENDOR) roda antes do empacotamento open-core e, se ganhar, substitui a entrega»; descartadas: «Medir C antes de selar» · «B: núcleo no monorepo do core com repos publicados por staging».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-12: «Que forma tem a peça do backbone de comunicação?»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-12"
      locality: "pessoa"
