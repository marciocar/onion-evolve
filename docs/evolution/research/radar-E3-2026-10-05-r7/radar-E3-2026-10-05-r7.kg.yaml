    verified_at: '2026-10-05'
    source_tier: 10
    verified_against: '.claude/settings.json: permissions tem so allow (13), ZERO deny/ask; seis formas (gh pr merge e git push origin main, nuas e com TZ="$HOME", X=1, env FOO=1, GIT_TRACE=1) contra o pretooluse-merge-gate.sh: rc=2 nas seis'
    trace: '.claude/hooks/pretooluse-merge-gate.sh'
    label: 'A 2.1.289 corrige SEIS furos em regras deny/ask: comando atras de prefixo de variavel com valor expandido (o exemplo oficial e TZ="$HOME" rm -rf build) e atribuicao nua antes do comando, ambos sob sandbox auto-allow; parte aninhada de comando composto sobre aprovacao de mod; Read deny via symlink. NAO toca a casa, medido: o core nao usa deny/ask (so 13 allow) — o veto dele e HOOK com exit 2, e o pretooluse-merge-gate barrou as seis formas de prefixo. A classe que o harness acabou de curar nao existe no veto proprio. Fica registrado porque um adotante que use deny rule para isso estava exposto ate a 2.1.288.'

