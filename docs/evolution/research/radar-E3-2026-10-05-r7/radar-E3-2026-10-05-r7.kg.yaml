    label: 'A 2.1.289 corrige o claude plugin validate PULANDO o plugin quando a pasta tambem tinha um manifesto de marketplace — ou seja, ate a 2.1.288 um "validacao passou" ali podia ser validacao que nao rodou. Medido: nenhuma pasta de plugin desta casa tem os dois manifestos juntos (o marketplace.json mora so na raiz), logo os "Validation passed" anteriores eram validacao de verdade.'

