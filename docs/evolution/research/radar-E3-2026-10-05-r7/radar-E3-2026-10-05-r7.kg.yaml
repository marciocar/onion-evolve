    label: 'A 2.1.289 adiciona agent.spawn para teammates, um id de agente unico atraves dos eventos de hook de plugin, e estados idle/waiting em $.agent.list(). Isso cruza com a doutrina do CLAUDE.md, que mediu SendMessage em ZERO na maquinaria ("acoplamento declarado e nao usado e a pior categoria"). Nao medido aqui: se algum fluxo da casa (orquestracao, Elenxo, drive) ganharia com o id unico entre hooks — e o primeiro lugar onde ele pagaria e na correlacao de hook com subagente. GATILHO: a proxima forja que precise correlacionar evento de hook com o agente que o disparou.'

