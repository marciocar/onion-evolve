  - id: E_VIBE_SUBAGENT_MEDIDO_NOS_SPIKES_1104
    node_type: evidence
    layer: audit
    plane: DEV
    status: done
    impact: 5
    confidence: 0.8
    verified_at: "2026-11-04"
    verified_against: "as 7 células de veto do subagente no Vibe 3.0.4 (evidence-r2veto.tar.gz) e as 3 do controle sem veto (evidence-r2.tar.gz), abertas e recontadas nesta conferência: hook.log, store_extract.json, a árvore do store, chunks, stdout e pedidos ao modelo"
    valid_from: "2026-11-04"
    source_tier: 9
    source_kind: primary
    label: "Medido na 3.0.4 (modelo stub): store e hooks herdados confirmados, e 3 correções: o filho não tem meta.json; o efeito vetado não traz toolCallId; toolName tool e input null valem só no vetado. Os hooks medidos eram do usuário, não do projeto."
    narrative: "O run terminou às 13:00Z e as células de veto rodaram a partir das 18:55Z; a pesquisa não as viu, e este nó as confere sem reescrever os nós dela. CONFIRMA, em 7 de 7: pai e filho ficam lado a lado em logs/session/unified/, o filho em child-<id>, com CURRENT, chunks, generations e journal; o hook roda dentro do filho, com session_id child-<id>, parent_session_id igual ao id do pai (null nos hooks do pai) e transcript_path apontando o store do filho; o stdin do pre_tool traz exatamente cwd, hook_event_name, parent_session_id, session_id, tool_call_id, tool_input, tool_name e transcript_path; o motivo do veto chega ao modelo do filho como mensagem role tool, name bash, com o tool_call_id da chamada; _meta['mistral.vibe.subagent'] traz agentName, agentType, childSessionId, generation e spawnCallId, com spawnCallId igual ao tool_call_id do hook do agents.spawn e childSessionId igual ao diretório do filho. CORRIGE: (a) C_SUPERACAO_20261104_CHILD_SESSIONS_EMPTY_BY_STRUCTURE põe o parent_session_id no meta do filho, e o diretório do filho não tem meta.json em nenhuma das 7; a chave está em generations/*/runtime-state.json, com o id do pai. O vazio de child_sessions no meta.json do pai se confirma em 7 de 7, sempre com um único spawn. (b) Item 2 da pergunta, que o nó dava como sem resposta: o efeito vetado não traz toolCallId; o id da chamada está na mensagem de ferramenta e no aviso hook_completed, com level error e o texto Denied tool 'bash'. A junção real é o par action_id e call_id, em journal e generations (PRE-REGISTRO-R2.md, seção 13). (c) Item 4 da pergunta: a premissa kind tool, toolName grupo.ferramenta e input null no estado assentado não vale como forma única. O efeito vetado tem toolName tool, input null, status skipped e o veto em settledMessage. Os efeitos concluídos mantêm o input e o nome qualificado: file_system.bash no filho do controle (3 de 3), e read_file, agents.spawn e self.wait no pai (7 de 7). (d) Lacuna d de E_LACUNAS_VIBE_SUBAGENT_1104: o hook dispara em chamada de dentro do run_typescript; o agents.spawn chega com tool_call_id typescript:5:call_…:0:tool:0, em 7 de 7. (e) Pergunta aberta do retorno sobre childSessionId null: o null aparece nos chunks do pai na forma running, em 7 de 7, e a forma completed traz o id; N filhos concorrentes não foram medidos. (f) A recomendação do retorno de depender do campo documentado tem um limite medido: no stdout JSON do pai aparece childSessionId, não documentado, e não aparece parent_session_id, o documentado, que só chega por hook. NÃO MEDE: hooks de projeto nem pasta confiável (o hooks.toml das células fica em VIBE_HOME, escopo do usuário); post_tool e post_agent (só pre_tool configurado); modelo real; a 3.1.0; o formato interno do journal."
    trace: "docs/evolution/research/vibe-subagent-2026-11/SYNTHESIS.md"
    provenance:
      source: "docs/evolution/research/port-spikes-qwen-vibe-2026-11/harness/evidence-archive/evidence-r2veto.tar.gz e evidence-r2.tar.gz, e docs/evolution/research/port-spikes-qwen-vibe-2026-11/PRE-REGISTRO-R2.md"
      locator: "células R2b-S1-V-r1 a r4 e R2b-M-V-r1 a r3 (veto), R2b-S0-V-r1 a r3 (controle); seção 13 do pré-registro"
      method: "measurement: contagem por script sobre a evidência arquivada das células rodadas por harness/run_cell.sh; nenhuma célula nova"
      locality: "repo"
