nodes:
  - id: Q_EIXO_D_SYNTHETIC_IDENTITY_BUDGET_2026_10
    node_type: question
    plane: DEV
    status: open
    impact: 5
    confidence: 0.6
    verified_at: 2026-10-05
    verified_against: 'rodada /onion-research modo primaries de 2026-10-05: 7 fontes lidas, 21 claims ancoradas por verificador independente, 12 rejeitadas na ancoragem; Elenxo completo recuperado do transcript (21 objecoes, 11 gapsOpen)'
    label: 'EIXO D do estudo Nanochat x Onion — qual o orcamento de dados sinteticos e de identidade para (D) treinar/ajustar modelo com o corpus PUBLICO do Onion e (a) destilar a doutrina em pesos? Cinco sub-perguntas: (1) custo e qualidade do sintetico de corpus pequeno; (2) esquecimento catastrofico com dado de dominio/identidade dominando a mistura e mitigacoes (mistura, replay, LoRA); (3) quanto dado de alinhamento/identidade basta; (4) corpus AGENTICO como fonte; (5) identidade x utilidade e perda de auditabilidade (S7_claim_analogy_breaks). RESPOSTA DA RODADA: so uma ORDEM DE GRANDEZA de dado (~10^3 exemplos, em regimes que nao sao o do Onion), nenhum orcamento em dolares ou GPU-hora; (2) respondido so para LoRA em Llama-2-7B; (4) a fonte nomeada e rota SEM pesos; (5) sem fonte, so argumento estrutural. Eixo LIDO, nao FECHADO.'
    trace: 'docs/evolution/research/nanochat-onion-2026-10/nanochat-onion-2026-10.kg.yaml'

