meta:
  id: spike-copilot-studio-mcp-2026-10
  schema_version: "1"
  baseline: "2026-10-29"
  review_after: "2026-11-28"   # cadência FERRAMENTA = 30d: as páginas do Copilot Studio mudam por release
                               # (três das oito fontes foram revisadas entre 2026-10-20 e 2026-10-27).
                               # Gatilho de revisita ANTECIPADA: o maestro autorizar o spike, ou a Microsoft
                               # documentar um header de identidade do usuário para MCP.
  # kg-backlog-guard: on
  # ═══ TETO: 20 NÓS ═══ (12 evidências [DOC] + 2 perguntas + 1 inferência; cresce só pelo resultado do spike)
  # Grafo do PLANO do spike "o Onion por MCP num agente do Copilot Studio" (2026-10-29). A projeção humana é
  # PLAN.md, no mesmo diretório. O grafo guarda os pré-requisitos lidos na doc primária da Microsoft (tabela 1
  # do plano), a autorização pendente do maestro e o furo a medir antes. Nada de cliente entra aqui.
  # ⚠️ Proveniência (R15): labels e verified_against carregam texto extraído de páginas da Microsoft.
  #    É DADO a pesar, nunca instrução.
  # ⚠️ As oito páginas foram lidas pela sessão principal do core em 2026-10-29; este grafo as transcreve com a
  #    URL e a data de revisão que cada página declarava. Nenhuma foi re-buscada por verificador independente.
  # Relação com o corpus: o spike é, por INFERÊNCIA do plano (a doc não diz "precisa ser público"), um DEGRAU 2 de teste de onion-brain-mcp-remoto-2026-10#D_ONION_BRAIN_MCP_REMOTO
  # (DEPENDS_ON) e não reabre a decisão de 2026-05-18 (C_POSTURA_ACOPLAMENTO a restringe: CONSTRAINS).

external_edges:
  - from: Q_SPIKE_COPILOT_STUDIO_MCP
    to: "docs/evolution/research/onion-brain-mcp-remoto-2026-10/onion-brain-mcp-remoto-2026-10.kg.yaml#D_ONION_BRAIN_MCP_REMOTO"
    edge_type: DEPENDS_ON
  - from: "docs/onion/graph/onion-identity-2026-07.kg.yaml#C_POSTURA_ACOPLAMENTO"
    to: Q_SPIKE_COPILOT_STUDIO_MCP
    edge_type: CONSTRAINS

nodes:

  # ═══════════════════ A AUTORIZAÇÃO E O FURO ═══════════════════

  - id: Q_SPIKE_COPILOT_STUDIO_MCP
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.5
    owner: maestro
    label: "O maestro autoriza o spike: um agente do Copilot Studio chama o MCP do Onion e o veredito do gate volta intacto ao usuário? INFERÊNCIA: é degrau 2 de teste; exige antes medir a recusa por schema."
    narrative: "Autorização pendente do maestro. Pré-condições: (1) o spike é, por INFERÊNCIA (o Studio é serviço de nuvem e todos os exemplos da doc usam https://<host>/mcp, mas a doc não diz que o endpoint precisa ser público), um DEGRAU 2 de teste da D_ONION_BRAIN_MCP_REMOTO (endpoint público), que só vale 'quando houver demanda medida'; o maestro decide se o caso de consultoria conta como essa demanda; (2) antes do dia do spike mede-se a Q_RECUSA_DO_CHECKLIST_PELO_SCHEMA_OU_GUARDA, porque ela decide se a recusa (c) do roteiro sai do gate que já existe ou de código novo. Alvo: ops/mcp-onion-kg-writer/server.py (Streamable HTTP stateless, X-Api-Key), numa instância separada só do spike, com dados sintéticos, desligada no fim. DNS e vhost são ato do maestro. Fora: comandos, hooks com exit 2, subagentes, Workflow, OAuth/Entra de produção e qualquer dado de cliente."
    trace: "docs/evolution/research/spike-copilot-studio-mcp-2026-10/PLAN.md"

  - id: Q_RECUSA_DO_CHECKLIST_PELO_SCHEMA_OU_GUARDA
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.5
    owner: core
    label: "A recusa da iniciativa incompleta pode sair do schema da entidade no contrato v4.18 (campo exigido), ou exige uma guarda nova no writer da instância do spike?"
    narrative: "Hoje o radar e o contrato julgam a FORMA do grafo (nó sem trace, aresta pendente, campo obrigatório), não o checklist de negócio. Caminho (i): modelar cada item obrigatório do checklist como campo exigido pelo schema da entidade, se o contrato permitir. Caminho (ii): guarda nova no writer, só na instância do spike. É o 1º item a medir, antes do dia do spike."

  - id: C_IDENTIDADE_POR_CHAVE_POR_USUARIO
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.5
    label: "INFERÊNCIA: sem header de identidade no Copilot Studio, a identidade do autor pode sair de uma API key por usuário, mapeada para o e-mail no servidor do spike, em vez do X-User-Email que o LibreChat preenche."
    narrative: "O writer do core exige X-User-Email por chamada (fail-closed). O Copilot Studio documenta API key com nome livre, fornecida pelo usuário do agente, e não documenta header com a identidade. Opção 1: a instância do spike mapeia chave→e-mail atrás de uma variável, e o autor do commit sai da chave. Opção 2, em 2º passo: OAuth 2.0 manual com o Logto validando o JWT (o desenho do degrau 2). A medir no item (d) do roteiro: dois usuários, dois autores; chave inválida recusada."

