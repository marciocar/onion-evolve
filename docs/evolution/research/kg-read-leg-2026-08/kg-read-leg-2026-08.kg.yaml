    verified_against: _processed/2026-07-16-ssot-como-runtime-para-adr.md
    label: "O QUE REFUTA O TIMING: os casos C4-C6 aconteceram MINUTOS depois de o proprio agente AUTORAR o grafo, na mesma sessao, com arquivo e ids no contexto imediato. Distancia temporal ~0, salienciamaxima — e falhou 3x. SE DISTANCIA 0 FALHOU TRES VEZES, nao ha evidencia de que distancia 1 (additionalContext no mesmo prompt) funcione. PRESENCA != CONSULTA. O timing e verdadeiro como observacao de escopo e irrelevante para 6 dos 7 casos de leitura"
