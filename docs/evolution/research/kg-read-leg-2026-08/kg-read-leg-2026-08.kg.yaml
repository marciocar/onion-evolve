meta:
  id: kg-read-leg-2026-08
  schema_version: "1"
  layer: audit
  baseline: 2026-08-02
  date: 2026-08-02
  note: >
    Elenxo sobre a PERNA DA LEITURA do KG-SSOT: por que read(KG) nao dispara na hora da decisao.
    Gatilho: o agente respondeu 3 perguntas decisivas sem abrir o grafo e contradisse uma decisao
    selada. Metodo: 4 lentes de diagnostico + 3 curas em steelman + refutacao adversarial e REPLAY
    contra corpus de 9 falhas reais. VEREDITO: as 3 curas somam 1/9, 1/9 e 0/9 e o unico caso que
    qualquer uma pega e O MESMO (C7) — a uniao NAO cobre mais que a melhor isolada. A hipotese-mae
    (timing) foi REFUTADA pelo corpus. O unico acionavel e um DEFEITO MEDIDO no mecanismo vigente.
    Projecao: SYNTHESIS.md.

nodes:
  - id: Q_read_leg
    node_type: question
    plane: DEV
    status: done
    impact: 5
    confidence: 1.0
    label: "A PERGUNTA: a doutrina KG-SSOT-first e densamente declarada (KB de 637 linhas, 4 ADRs, 3 comandos, 4 skills) e a perna da ESCRITA esta mecanizada (REGRA 26/29/43/47). Por que a perna da LEITURA nao dispara no momento da decisao — e o que a faria disparar?"

  - id: E_recurrence_is_the_data
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-02
    verified_against: repo-HEAD-5c6e2cf
    label: "NAO E FALHA NOVA — e a 8a+ ocorrencia de modo de falha ja diagnosticado, medido e nomeado. O autor da doutrina ignorou o KG 3x na MESMA sessao minutos apos monta-lo, e >=4x DEPOIS de escrever a doutrina. A KB ja cravou o veredito: 'A reincidencia E o dado. Nao e falha de disciplina do consumidor — e falha de DESIGN DO LOOP'. Numero do gargalo registrado: recall passivo quase perfeito 'despenca para 40-60% no uso ativo em decisao'"
    trace: "docs/knowledge-base/concepts/knowledge-graph-sdaal.md:431"
    provenance:
      source: "docs/knowledge-base/concepts/knowledge-graph-sdaal.md:431"
      locator: "repo-HEAD-5c6e2cf"
      method: "derivado: provenance derivada na migração ao contrato v4 (trace do nó; rota A2 da triagem); não reverificado"

  - id: E_write_leg_only
