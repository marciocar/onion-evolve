    plane: PROD
    status: confirmed
    impact: 4
    confidence: 1.0
    verified_at: 2026-08-02
    verified_against: medicao-direta-VPS
    label: "CUSTO NAO E O OBSTACULO (medido): kg-radar.sh em 1 grafo = 16ms; grep cross-grafo nos 43 arquivos = 11ms. Ler e praticamente de graca. Logo o problema NAO e custo nem capacidade — e DISPARO. Isto elimina de antemao toda classe de cura do tipo 'torne a leitura mais barata'"
    trace: "docs/evolution/research/kg-read-leg-2026-08/SYNTHESIS.md"
