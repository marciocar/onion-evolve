  - id: C_timing_hypothesis
    node_type: claim
    plane: DEV
    status: refuted
    impact: 4
    confidence: 0.9
    label: "HIPOTESE-MAE (do agente, portanto suspeita): os 3 comandos cabeados sao nivel 4 e FUNCIONARAM — a sessao rodou /warm-up. Mas disparam UMA VEZ, na abertura; as decisoes acontecem continuamente, horas depois. A trava cobriria o inicio da sessao, nao o momento da decisao"

