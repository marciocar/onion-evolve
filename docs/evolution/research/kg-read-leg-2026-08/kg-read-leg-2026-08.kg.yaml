    plane: PROD
    status: confirmed
    impact: 5
    confidence: 1.0
    verified_at: 2026-08-02
    verified_against: lint-artifacts.sh-HEAD
    label: "ASSIMETRIA ESTRUTURAL MEDIDA: as ~11 regras de lint que tocam KG (26, 29, 31, 32, 41, 42, 43, 47) verificam ARTEFATO — nasceu arquivo / e citado / ponteiro e sao. read(KG) NAO TEM MECANISMO NENHUM. Nenhum hook toca KG (.claude/hooks/ tem 5 scripts, zero mencionam kg). CLAUDE.md — o unico texto sempre carregado — tem ZERO mencao a KG/grafo. Os niveis 2 e 3 da hierarquia de forcing-function da propria doutrina nunca foram instalados"
    trace: "docs/evolution/research/kg-read-leg-2026-08/SYNTHESIS.md"

  - id: E_cost_is_not_the_barrier
