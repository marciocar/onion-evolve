    verified_at: "2026-11-09"
    source_tier: 10
    label: "Sob bwrap real, a regra Read do hosts.yml do gh quebra gh auth status e o credential helper do git, e a exceção allowRead no mesmo caminho os traz de volta com a regra ainda no deny."
    narrative: "gh falso que lê o hosts.yml e git real com o helper. Sem deny: tudo anda. Com as 74 regras: gh rc 1 e credential helper rc 128. Com as 74 mais allowRead: gh e helper rc 0. As pastas .ssh, .aws e .gnupg somem; .netrc e .credentials.json dão Permission denied. O glob do .env não mostrou efeito: cat .env e source .env andam nas três rodadas."
    trace: "docs/evolution/research/permissions-deny-minimal-2026-11/data/cases.tsv"
    verified_against: "fases sandbox-control, sandbox-deny e sandbox-allowread de data/cases.tsv; a curadoria mediu o mesmo em uso real (E_SANDBOX_SETTINGS_UPDATE_MEASURED_1109, no repo dela)"
