meta:
  id: permissions-deny-minimal-2026-11
  schema_version: "1"
  baseline: "2026-11-08"
  review_after: "2027-02-08"
  x_supersedes_none: >
    Forja nova. O core tinha 0 regras em permissions.deny e nenhum sandbox. Não há nó anterior a reconciliar: a
    curadoria tem o deny dela (E_DENY_LAYER_PROBE_1105, no repo dela), com outra função (barrar repo alheio e main).
  x_unverified: >
    O refutador independente leu o head 4f6429476; as curas dele foram medidas pelo autor, sem nova passada independente.
    Medido só em 2.1.319; o /meta:cc-update reabre quando o motor de permissão mudar. Não medido com sandbox ligado no
    core real, nem com login real (a API é simulada e a chave é fictícia). Nos flows, F04, F05 e F09 pararam em
    recusa própria do script no fixture (membro inexistente, core que não relaya, resíduo ausente): provam que o deny
    não barra a chamada, não que o fluxo foi até o fim.
