    narrative: "Portas e adoção nova copiam o settings, e o --update soma pelo merge-onion-hooks. Merge e push na main ficam fora de propósito: o hook já veta, e num repo sem o script verificado ele avisa, saída que um deny tiraria. A regra Read do .env também barra Write e Edit, inclusive arquivo novo: custo aceito pelo core em nome do maestro em 2026-11-08, revogável, porque criar ou editar .env com segredo não é trabalho de agente; .env.example segue livre. Rollback: reverter os commits do PR."
