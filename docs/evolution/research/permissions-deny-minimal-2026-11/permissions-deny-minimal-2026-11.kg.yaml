      locator: "docs/onion/graph/maestro-decisions-1108.kg.yaml, nós D_MD_DENY_MINIMUM_PORTABLE_1108 e D_MD_DENY_KEEP_AND_WARN_SANDBOX_1109"
      method: "testimony: decisões do maestro de 2026-11-08 e 2026-11-09, relatadas pela sessão do core"
    label: "Deny mínimo portátil, decidido pelo maestro em 2026-11-08 e relatado no brief da sessão do core: 74 regras no settings, sem caminho de máquina nem nome de cliente, mergeadas no PR #1552."
    narrative: "Portas e adoção nova copiam o settings, e o --update soma pelo merge-onion-hooks, cujo --diff nomeia as regras novas e os allow do alvo que elas anulam; alvo com deny fora da forma de lista recebe os hooks e não soma. Merge e push na main ficam fora de propósito: o hook já veta, e num repo sem o script verificado ele avisa, saída que um deny tiraria. A regra Read do .env também barra Write e Edit, inclusive arquivo novo: custo aceito pelo core em nome do maestro em 2026-11-08, revogável, porque criar ou editar .env com segredo não é trabalho de agente; .env.example segue livre. Rollback: reverter os commits do PR."
    trace: ".claude/settings.json"
    verified_against: "família update-base-deny, casos d6 a d13, p1, j-MUT, g-MUT, n-MUT e p-MUT"
