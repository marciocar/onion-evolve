    narrative: "As 318 linhas cobrem controle sem deny, deny com o allow real em default e em bypassPermissions, e sandbox. Na 1ª rodada, os mutantes acharam 11 regras decorativas: 10 ganharam caso e 1 saiu, porque o motor já barra rm -rf com $HOME entre aspas pela regra sem aspas. O refutador independente do PR reprovou a 1ª lista: git clean -*x* atravessava espaços e barrava -e e caminho com x, e deixava passar -fdX; as regras Read barravam Write. A cura trocou por grupos explícitos de flags, e a bancada passou a reprovar quando não há resultado medido (com um claude falso, rc 1)."
