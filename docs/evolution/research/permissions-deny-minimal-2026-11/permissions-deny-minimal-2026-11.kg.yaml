meta:
  id: permissions-deny-minimal-2026-11
  schema_version: "1"
  baseline: "2026-11-08"
  review_after: "2027-02-08"
  x_supersedes_none: >
    Forja nova. O core tinha 0 regras em permissions.deny e nenhum sandbox. Não há nó anterior a reconciliar: a
    curadoria tem o deny dela (E_DENY_LAYER_PROBE_1105, no repo dela), com outra função (barrar repo alheio e main).
  x_unverified: >
    O refutador independente reprovou o head 4f6429476 e aprovou o e49e884f4; o que veio depois (complementos dele e token
    exato do clean) foi medido pelo autor, sem passada independente sobre isso.
    Medido só em 2.1.319; o /meta:cc-update reabre quando o motor de permissão mudar. Não medido com sandbox ligado no
    core real, nem com login real (a API é simulada e a chave é fictícia). Os 10 flows provam só que o deny não barra a
    chamada: a regra vê a linha de cima, não o que o script faz, e o F01 só imprime o uso. Em adotante com sandbox, não
    foram medidos push por ssh de ponta a ponta nem o efeito isolado do deny sobre a assinatura gpg, que já falha sem ele.
nodes:
