    label: "O fluxo real usa reset --hard, branch -D, worktree remove --force, --force-with-lease e rm -r de pasta de trabalho; force nu, --mirror, filter-branch e rm na raiz, no home ou no .git quase não aparecem."
    narrative: "Em 75.223 chamadas Bash dos transcripts do core: git reset --hard 36, git branch -D 354, git worktree remove --force 192, --force-with-lease 16, rm -r 886. Force nu ou -f: 3, em teste. --mirror, filter-branch, filter-repo e rm -r na raiz, no home ou no .git: zero. Por isso a lista barra o segundo grupo e deixa o primeiro."
