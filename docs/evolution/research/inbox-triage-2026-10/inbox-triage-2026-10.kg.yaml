    verified_against: 'sinal lido integralmente em 2026-10-02; medido no core: zero tratamento de knowledge-base/index.md em .claude/utils/adopt/ e adopt.md'

  - id: I_ADOPT_DOCS_ONLY_CONVERGENCIA_GATILHO_DISPAROU
    node_type: decision
    plane: DEV
    impact: 3
    confidence: 0.85
    status: open
    label: 'O GATILHO DESTE ITEM GATED JA DISPAROU E NINGUEM REAVALIOU. O `adopt.md:685` diz, literalmente, "implementacao gated ate o 1o caso real" para a convergencia docs-only -> modelo duravel. O caso real chegou em 2026-10-01 (brain-granaai, adendo 1): o adotante estava na forma docs-only, o update anterior saiu como `chore/onion-update-<pin>` por COPY-OVER SILENCIOSO porque a vendor estava em base cruzada e o `.claude/` nao era versionado, e a convergencia foi feita A MAO por decisao do maestro. Pedido do adotante: o `--update` DETECTAR docs-only e OFERECER a convergencia (scope-gitignore + versionar + re-semear vendor) em vez de cair no copy-over calado. Por que isto e registro e nao implementacao imediata: a decisao de abrir o gate e do maestro, nao minha — mas um item gated cujo gatilho disparou e que ninguem reavaliou nao e gated, e ORFAO. GATILHO (agora explicito): a decisao do maestro, ou um SEGUNDO adotante em forma docs-only.'
    trace: '.claude/commands/meta/adopt.md'
    verified_against: 'medido em 2026-10-02: adopt.md:681-685 declara a forma docs-only e o gate; o sinal de 2026-10-01 descreve o 1o caso real com copy-over silencioso'

  - id: Q_ADOPT_BASELINE_EXPLICITO_NO_STAMP
    node_type: question
    plane: DEV
    impact: 3
    confidence: 0.8
    status: open
    label: 'O `_clean_baseline` NUNCA acha base num adotante cujo `docs/knowledge-base` mistura KBs locais com as do core — relato de brain-granaai (2026-10-01, adendo 2), onde a base correta era o commit do copy-over, ANTES das customizacoes. Sugestao dele: registrar esse commit como baseline EXPLICITO no stamp `.onion-version`. Sem resposta e sem teto declarado ate 2026-10-02. Medido: `vendor-branch.sh` tem `_clean_baseline` e nao tem caminho de baseline declarado no stamp. A classe e a de sempre nesta casa: heuristica que procura por FORMA (arvore limpa) onde o dado deveria ser DECLARADO. GATILHO: o proximo adotante cuja vendor-branch nao resolva base — ou o fechamento do Q_ADOPT_INDEX_KB_LOCAL_SOBRESCRITO, que toca o mesmo diretorio.'
