  - id: Q_ADOPT_INDEX_KB_LOCAL_SOBRESCRITO
    node_type: question
    plane: PROD
    impact: 4
    confidence: 0.9
    status: open
    verified_at: '2026-10-02'
    label: 'O `/meta:adopt --update` SOBRESCREVEU o `docs/knowledge-base/index.md` do adotante com a versao do core — ele perdeu frontmatter e entradas locais, e o `docs:check` dele passou a REPROVAR. Sinal de campo de brain-granaai (2026-10-01, pedido 3 de 3). Pedidos 1 e 2 do mesmo sinal foram curados no PR #902; ESTE ficou sem resposta e sem teto declarado, e so apareceu porque um refutador leu o sinal INTEIRO em vez do pedido principal. MEDIDO em 2026-10-02: `grep` por `knowledge-base/index` em `.claude/utils/adopt/` e em `adopt.md` devolve ZERO — nao existe tratamento desse arquivo como local do adotante. A classe e pior que um arquivo: `docs/knowledge-base/` e path VENDORIZADO no update, e um indice e exatamente o tipo de arquivo que o adotante PRECISA customizar (ele lista as KBs dele). Pergunta: o indice e projecao gerada (e entao o adotante deveria regenerar) ou arquivo de autoria mista (e entao precisa de never-clobber/merge)? GATILHO: antes do proximo `--update` em QUALQUER adotante com KB propria — ou o dano repete em silencio.'
    trace: 'docs/evolution/inbox/_processed/2026-10-01-pre-commit-pipefail-silent-exit.md'
    verified_against: 'sinal lido integralmente em 2026-10-02; medido no core: zero tratamento de knowledge-base/index.md em .claude/utils/adopt/ e adopt.md'
    provenance:
      source: "docs/evolution/inbox/_processed/2026-10-01-pre-commit-pipefail-silent-exit.md"
      locator: "sinal lido integralmente em 2026-10-02; medido no core: zero tratamento de knowledge-base/index.md em .claude/utils/adopt/ e adopt.md"
      method: "medição: provenance derivada na migração ao contrato v4 (trace do nó; rota A2 da triagem); não reverificado"

  - id: I_ADOPT_DOCS_ONLY_CONVERGENCIA_GATILHO_DISPAROU
    node_type: decision
    plane: DEV
    impact: 3
    confidence: 0.85
    status: open
    label: 'O GATILHO DESTE ITEM GATED JA DISPAROU E NINGUEM REAVALIOU. O `adopt.md:685` diz, literalmente, "implementacao gated ate o 1o caso real" para a convergencia docs-only -> modelo duravel. O caso real chegou em 2026-10-01 (brain-granaai, adendo 1): o adotante estava na forma docs-only, o update anterior saiu como `chore/onion-update-<pin>` por COPY-OVER SILENCIOSO porque a vendor estava em base cruzada e o `.claude/` nao era versionado, e a convergencia foi feita A MAO por decisao do maestro. Pedido do adotante: o `--update` DETECTAR docs-only e OFERECER a convergencia (scope-gitignore + versionar + re-semear vendor) em vez de cair no copy-over calado. Por que isto e registro e nao implementacao imediata: a decisao de abrir o gate e do maestro, nao minha — mas um item gated cujo gatilho disparou e que ninguem reavaliou nao e gated, e ORFAO. GATILHO (agora explicito): a decisao do maestro, ou um SEGUNDO adotante em forma docs-only.'
    trace: '.claude/commands/meta/adopt.md'
    verified_against: 'medido em 2026-10-02: adopt.md:681-685 declara a forma docs-only e o gate; o sinal de 2026-10-01 descreve o 1o caso real com copy-over silencioso'

  - id: Q_ADOPT_BASELINE_EXPLICITO_NO_STAMP
    node_type: question
    plane: DEV
    impact: 3
    confidence: 0.8
    status: open
    label: 'O `_clean_baseline` NUNCA acha base num adotante cujo `docs/knowledge-base` mistura KBs locais com as do core — relato de brain-granaai (2026-10-01, adendo 2), onde a base correta era o commit do copy-over, ANTES das customizacoes. Sugestao dele: registrar esse commit como baseline EXPLICITO no stamp `.onion-version`. Sem resposta e sem teto declarado ate 2026-10-02. Medido: `vendor-branch.sh` tem `_clean_baseline` e nao tem caminho de baseline declarado no stamp. A classe e a de sempre nesta casa: heuristica que procura por FORMA (arvore limpa) onde o dado deveria ser DECLARADO. GATILHO: o proximo adotante cuja vendor-branch nao resolva base — ou o fechamento do Q_ADOPT_INDEX_KB_LOCAL_SOBRESCRITO, que toca o mesmo diretorio.'
    trace: 'docs/evolution/inbox/_processed/2026-10-01-pre-commit-pipefail-silent-exit.md'
    verified_against: 'sinal lido integralmente em 2026-10-02; `_clean_baseline` existe em .claude/utils/adopt/vendor-branch.sh e nao le baseline do stamp'

  - id: Q_GMILL_FALSOS_POSITIVOS_SEM_TRIAGEM
    node_type: question
    plane: DEV
    impact: 2
    confidence: 0.75
    status: open
    label: 'TRES relatos de FALSO POSITIVO de gate, do hub gmill (sinal de 2026-09-30), arquivados sem triagem registrada — o commit de arquivamento afirmou apenas que as 3 KBs do sinal estao em main, o que e verdade e NAO cobre esta secao. Os tres: (1) vendor-scrub FORMA acusando `contains&criteria` — provavelmente POR DESENHO (forma gera candidato, o baseline so encolhe), falta so DECLARAR isso ao remetente; (2) `bash-empty-result-guard` disparando em `$?` apos redirecionamento ou `git commit -F - <<EOF` — o guard tem tratamento de redirect, e o caso do heredoc NAO foi provado (o refutador nao conseguiu executar a sonda na worktree); ⚠️ eu mesmo tropecei numa variante disso em 2026-10-02, travando um `git commit -F -` por 31 minutos a espera de stdin, o que sugere que o caso do heredoc merece medicao e nao descarte; (3) REGRA 45 com ~40 BASELINE-OBSOLETA pos-update — o `--stub-baselines` provavelmente cobre, nao verificado. GATILHO: os tres sao BARATOS de medir e a divida e de COMUNICACAO (o remetente nao sabe o veredito) — fecha na proxima leva que tocar vendor-scrub, o guard de shell, ou o adopt.'
