  # O QUE A TRIAGEM DO INBOX DE 2026-10 MEDIU — e por que isto NÃO mora no fios-abertos.
  #
  # Eu nasci por violação de fronteira: os 5 nós abaixo foram escritos PRIMEIRO dentro de
  # `fios-abertos.kg.yaml`, e o `meta:` daquele arquivo diz, em letra grande, "NENHUM FATO NASCE
  # AQUI — nó só entra para ser ponta de aresta cross-grafo; achado mora onde nasceu, aqui mora o
  # COMPROMISSO". Estes são FATOS (medições sobre o que o adopt faz e sobre o que a triagem
  # declarou), logo duplicavam SSOT. O sintoma que me revelou foi a REGRA 58 (O backlog cumpre as
  # promessas do próprio `meta:`) acusando TETO (24 nós contra 19 declarados) — mas o teto era o
  # sintoma, não a doença: a doença era pôr fato no lugar do compromisso.
  #
  # FRONTEIRA DESTE ARQUIVO: medições da triagem de 2026-10 e os pedidos de adotante que ficaram
  # abertos nela. Quando um deles for curado, a cura mora no grafo de quem a executou; aqui fica
  # o SUPERSEDES datado (Aufhebung, nunca apagar).
  # TETO 6 -> 7 (2026-10-05): entrou a evidencia do caminho 3-way que RESTRINGE o
  # Q_ADOPT_INDEX_KB_LOCAL_SOBRESCRITO — ela so tem alvo honesto aqui, e uma aresta para outro
  # grafo nao existe (o motor e intra-arquivo).
