    label: 'MEDIDO POR REFUTADOR ADVERSARIAL (2026-10-02, PR #903): eu arquivei os 6 sinais do inbox declarando "todos endereçados, com prova em origin/main" — e a prova que eu levantei cobria o PEDIDO PRINCIPAL de cada sinal, nao os pedidos INTERNOS. QUATRO pedidos ficaram abertos, sem resposta e sem teto declarado: o `index.md` da KB sobrescrito pelo update (pedido 3 de 3 do sinal do pre-commit), os dois itens do adendo do mesmo sinal (convergencia docs-only com gatilho JA disparado em adopt.md:685, e baseline explicito no stamp) e os tres falsos-positivos de gate relatados pelo hub gmill. A CLASSE: "endereçado" medido pelo titulo e pelo pedido de cabeça de lista, quando o sinal tem secoes com pedidos proprios — e exatamente a licao `read-full-content-before-triage` reincidindo, agora na direcao do ARQUIVAMENTO e nao da leitura. O gate mecanico saiu 0 HARD em todas as passadas: nenhuma guarda sabe ler o que um sinal PEDE. O refutador, lendo os sinais inteiros, achou os quatro em 23 minutos. CURA APLICADA: os quatro viraram nos com gatilho nomeado, e o arquivamento passou a declarar explicitamente o que ficou aberto em vez de dizer "endereçado".'
