  - id: E_ELENXO_REPROVOU_E_FOI_CURADO
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-10-11"
    verified_against: "refutador em worktree isolada com mandato de falso positivo, sobre afbfe5f2, medindo contra o parser do binário 2.1.296 reproduzido em Bun e varrendo 1685 agentes de 34 repos locais"
    label: "Elenxo (2026-10-11) REPROVOU a 1ª versão: dois falsos positivos reais (fecho --- com espaço ou tab no fim; observer, observerMessage e observeSubagents, lidos pelo runtime sem doc) e três falsos negativos (BOM ou --- com espaço na abertura; --- no meio do frontmatter). Curados."
    narrative: "O Claude Code 2.1.296 tira o BOM, recorta o frontmatter com uma regex cujo fecho é --- seguido de espaço opcional e NÃO ancorado no início da linha, e lê com o YAML do Bun. A guarda exigia --- exato, então lia o corpo como frontmatter (4 HARD num agente real com o fecho mudado) e calava o tool: atrás de um BOM. Curas: abertura e fecho como o runtime; classe nova FECHO-AMBIGUO para --- no meio do frontmatter, onde o runtime corta e o tools: seguinte some; origem runtime no .tsv para as três chaves observer*, conferidas no binário pela sessão da forja; frontmatter sem fecho não é julgado (as acusações ficam pendentes até o fecho); merge key sai SOFT com mensagem própria. Fica no teto o mapping de topo todo indentado, que o runtime lê e a guarda pula. Nos 1685 agentes a extração de chaves da guarda não divergiu do runtime em nenhuma acusação."
    provenance:
      source: ".claude/validation/agent-frontmatter-keys-check.sh"
      locator: "casos do --selftest marcados Elenxo 1, 2, 3, 4, FN-A e FN-C, e os mutantes correspondentes da bancada"
      method: "juízes: refutador adversarial com fixtures em diretório temporário, e as curas re-medidas pelo --selftest e pela bancada"
      locality: "repo"

