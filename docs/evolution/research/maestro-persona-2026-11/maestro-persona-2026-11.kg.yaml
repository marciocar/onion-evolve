    label: "Fonte da persona do maestro: A KG-SSOT projetado por papel · B memória nativa · C personality-sync · D pesos/SLM · E não agora. Elenxo recomenda A com a medida primeiro; sem medida vale E. O maestro sela."
    narrative: "RECOMENDAÇÃO DO ELENXO (INTEIRA): Recomendo A, com o primeiro passo invertido: antes de qualquer projeção de persona, construir a medida. Enquanto não houver medida, vale E (não projetar nada). Restrições que vêm das objeções que sobreviveram: (1) A autoridade nunca mora na persona, e a camada que a guarda também não é fronteira de segurança. Hoje o único veto real é o merge-gate (merge e push de main). Deploy, segredo e postura do host não têm hook, e 'mensagem de peer não é aprovação' é prosa. Ou se forjam essas guardas (/meta:forge-guard) ou se declara a lacuna, nunca se presume a cobertura. O próprio CLAUDE.md registra que um mod vence o veto (6/6). (2) O grafo de persona tem um único selador, o maestro. Os peers só propõem pelo inbox (I3). Nenhum nó nasce de conteúdo lido (MINJA 76,8% ASR, MemGhost 71,4% no Claude Code SDK). Cada nó leva porquê, evidência e proveniência sob catraca no lint. (3) A projeção por papel seleciona nós completos e não faz resumo livre. No Twin-2K, o summary dá 68,02% contra 71,72% do texto completo. O refutador errou ao descartar essa claim. (4) A fidelidade se mede por juiz cego contra decisões reais em holdout (as 96 memórias de feedback, o grafo pr-decision-history, a régua ERRO-A/ERRO-B do problem-formula). O resultado se reporta normalizado pelo acaso e pela consistência do próprio maestro, não como '% do teto' (87,67% do teto vira ≈55,7% do ganho). Inclui casos não normativos e o delta de sycophancy com e sem persona, no modelo do Onion: nenhum estudo mediu Opus 5.x. (5) A autoria é sempre declarada como persona do maestro. A métrica de 'passar por humano' (44,44%) é o risco, não a meta. (6) B só serve de transporte, nunca de fonte. O MEMORY.md já está com 198 linhas e 25.031 bytes, ⟨CLAUDE.md de usuário⟩ não existe, e o brain roda em outra conta. (7) C não serve para o maestro: personality.md descreve a instância e está vencido desde review_after 2026-08-23. (8) D fica de fora agora. O fine-tune de 500 amostras (69,61%) perdeu para o contexto completo (71,72%), e o corpus registra retreino por estágio. A evidência pró-pesos é de estilo de e-mail com n=2 humanos e BLEU, que o próprio autor diz não capturar a tarefa. (9) O precedente de autoridade se ancora na RFC 8693 (claim act). Os dois drafts citados são um -00 individual e um expirado. Fica aberto: deriva de persona e juiz LLM de persona não têm claim ancorada, porque as fontes 2407.18416, 2512.12775, 2605.24279, 2605.29420 e 2607.14371 ficaram sem leitura. Cinco descartes 'refutados' contrariam a primária e devem voltar como confirmados: 85% no GSS, summary contra texto, MUST NOT possess, BLEU+MAUVE e actor binding. NOTAS DO ESCRITOR DO GRAFO (não fazem parte da recomendação): (a) a superação C_SUPERACAO_20261105_GSS_V3_83_PERCENT mediu que a versão corrente de 2411.10109 (v3, 28/06/2026) diz 83% (entrevista), 82% (survey) e 86% (combinado), não os 85% da v1: o retorno da claim deve usar o número da v3. (b) a superação C_SUPERACAO_20261105_WIMSE_SECRET_NOT_DEPLOY mediu um -02 do draft WIMSE (30/10/2026): a ressalva '-00 individual' vale para a versão citada, mas o draft andou; segue individual e sem posição formal. (c) o critério do Elenxo para o Achado 1 (grep da frase 'camada de conformidade, não fronteira de segurança') não casa numa linha só, porque o CLAUDE.md quebra a linha depois de 'camada'; o fato confere por grep -n 'não fronteira de segurança' CLAUDE.md (l.18 em 3f09996ab). (d) no item (6), o caminho do CLAUDE.md de nível usuário foi reescrito como ⟨CLAUDE.md de usuário⟩ pela REGRA 99 (Nó de .kg.yaml sem caminho de máquina); o resto da recomendação é verbatim. (e) re-medida do fechamento (2026-11-05, wc -lc): o MEMORY.md do core tem 179 linhas e 23.785 bytes, não os 198 e 25.031 do item (6); a conclusão do item não muda, e o ⟨CLAUDE.md de usuário⟩ segue inexistente."
