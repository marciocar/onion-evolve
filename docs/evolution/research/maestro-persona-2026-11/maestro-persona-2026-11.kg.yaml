  - id: C_SUPERACAO_20261105_RFC8693_ACT_CLAIM
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 3
    confidence: 0.6
    label: "RFC 8693 (OAuth 2.0 Token Exchange, Standards Track, jan/2020), seções 1.1 e 4.1: o claim act separa o ator do titular e distingue delegação de impersonação; é o precedente padronizado de que quem age não é o titular e só tem a autoridade delegada."
    narrative: "Medida: WebFetch https://www.rfc-editor.org/rfc/rfc8693.html devolveu verbatim: 'The act (actor) claim provides a means within a JWT to express that delegation has occurred ... and identify the acting party to whom authority has been delegated' e 'Delegation semantics are different than impersonation semantics ... when A is impersonating B, A is B within the context of the rights authorized by the token.' O draft on-behalf-of, por sua vez, se qualifica como individual expirado e sem standing, o que descarta a leitura 'precedente de mercado'. Critério: V2_CONTRADITA. Alvo reprovado na votação: O servidor de autorização verifica que o ator do token coincide com o consentido, e o código fica vinculado a usuário, cliente e ator: precedente de mercado para 'persona copia voz, não autoridade' (tier 6). Registro da reprovação: E_LACUNAS_MAESTRO_PERSONA_1105. Afirmação de UM juiz (motor de superação)."
    trace: "WebFetch https://datatracker.ietf.org/doc/html/draft-oauth-ai-agents-on-behalf-of-user-02 and grep -F 'no formal standing' / 'Expired' / 'will expire on 27 February 2026' in the header: the document's own page qualifies it as an expired individual draft without standing, which rules out the reading 'market precedent'"
