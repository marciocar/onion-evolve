    narrative: "Medida: WebFetch do -00 e do -02: as frases 'An Agent MUST NOT possess or have access to the underlying credentials stored in the Credential Vault' e 'Raw credentials never cross the boundary to the agent host' aparecem no -02; 'Agents receive and exercise delegated authority' aparece na Seção 1.3; 'deploy'/'persona' estão ausentes. Status medido no Datatracker: individual, sem stream. Para deploy fora da persona, o escopo de deploy não pode ser delegado; essa metade fica sem superação nesta fonte. Critério: V1_QUOTE_NAO_SUSTENTA. Alvo reprovado na votação: O draft exige que o agente nunca possua as credenciais; elas ficam num cofre, de modo que segredos e deploy não passam à persona (tier 7). Registro da reprovação: E_LACUNAS_MAESTRO_PERSONA_1105. Afirmação de UM juiz (motor de superação)."
    trace: "WebFetch https://www.ietf.org/archive/id/draft-sweeney-wimse-credential-delegation-02.html e grep -F 'deploy' / grep -F 'persona' no texto devolvido: 0 ocorrências. Na mesma página, grep -F 'Agents receive and exercise delegated authority through the Delegation Server' devolve 1 ocorrência, o que contradiz 'deploy não passa à persona'"
