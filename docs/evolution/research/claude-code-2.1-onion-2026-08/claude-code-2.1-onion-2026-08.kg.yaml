    verified_at: 2026-08-16
    verified_against: changelog-2.1.219-a-2.1.233-fonte-primaria
    label: "A plataforma passou a fazer sozinha coisas que um framework faria: plugin source `archive` (zip por HTTPS com pin SHA-256 — distribuição sem git/npm), `claude self-hosted-runner` (rodar sessões na própria infra), marketplaces com allowlist/blocklist e wildcard, sandbox com CREDENTIAL MASKING ciente de JWT e re-assinatura AWS SigV4, isolamento de worktree corrigido (sessões isoladas conseguiam rodar git destrutivo no checkout principal — fix de segurança), `--max-budget-usd` cortando subagente de background, nesting de subagentes 1→3 e cap de concorrência 20. Consequência para o Onion: a régua da postura de acoplamento (2026-05-18: 'acople só quando a capacidade não existe fora') tem itens novos para reavaliar — parte do que o Onion carrega em `adopt/vendor` pode virar `archive` com pin, e parte do que ele guarda com disciplina pode virar sandbox nativo."
    provenance:
      source: "CHANGELOG oficial do Claude Code (github.com/anthropics/claude-code/blob/main/CHANGELOG.md)"
      locator: "## 2.1.224 (archive com SHA-256, self-hosted-runner, credential masking jwt/sigv4) · ## 2.1.222 (worktree isolation destructive git) · ## 2.1.219 (nesting depth 3) · ## 2.1.217 (cap 20 concorrentes, --max-budget-usd em background)"
      method: "leitura: CHANGELOG 2.1.217–2.1.224"
      locality: "web"

  - id: E_ASSIMETRIA_DE_PERMISSAO_DIR
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 3
    confidence: 0.8
    verified_at: 2026-08-16
    verified_against: changelog-2.1.211-e-2.1.214-mais-varredura-do-settings-do-core
    label: "Padrão mudou sob config existente (2.1.211/214): `dir/**` de segmento único em permissão e em `if:` de hook vale só `<cwd>/dir`, mas deny/ask mantêm qualquer profundidade. O core passou ileso por acidente (regras absolutas multi-segmento); adotante com Edit(src/**) é afetado."
    narrative: "label anterior: Semântica de padrão mudou por baixo de configuração existente: `dir/**` de segmento único em REGRA DE PERMISSÃO e em `if:` de HOOK deixou de auto-aprovar em qualquer profundidade e passou a valer só `<cwd>/dir` (2.1.211/2.1.214) — mas as regras `deny`/`ask` MANTIVERAM o casamento em qualquer profundidade. Assimetria viva: o mesmo padrão significa coisas diferentes conforme o lado. Varredura no core: o `settings.local.json` usa caminhos ABSOLUTOS multi-segmento (⟨uma regra Read sobre o caminho absoluto do home do maestro, com /**⟩), que não caem na mudança — o core passou ileso POR ACIDENTE de estilo, não por desenho. Registrado porque adotante com `Edit(src/**)` relativo teve o efeito da regra alterado sem tocar em nada."
    provenance:
      source: "CHANGELOG oficial do Claude Code (github.com/anthropics/claude-code/blob/main/CHANGELOG.md)"
      locator: "## 2.1.214: 'Fixed single-segment dir/** allow rules like Edit(src/**)… only <cwd>/dir' e 'Changed single-segment dir/** hook if: conditions… deny/ask permission rules keep their any-depth match' (cópia local l.3604 e l.3647)"
      method: "leitura: CHANGELOG 2.1.214"
      locality: "web"

  - id: E_ELENXO_DERRUBOU_METADE_DA_TESE
    node_type: evidence
