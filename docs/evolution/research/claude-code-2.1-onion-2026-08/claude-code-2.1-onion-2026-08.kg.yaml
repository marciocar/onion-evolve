    verified_against: "R0 /meta:kg-freshness 2026-09-09 (run wf_5b2f274e-83d) — comando executado, INTEIRO: grep -n -A 25 \"id: E_O_GATE_DO_ADOTANTE_NASCE_REPROVADO_POR_PASSIVO_ALHEIO\" docs/evolution/research/claude-code-2.1-onion-2026-08/claude-code-2.1-onion-2026-08.kg.yaml grep -rn \"baseline\" .claude/commands/meta/adopt.md ls -la .claude/utils/adopt/regen-baselines.sh sed -n '1,60p' .claude/utils/adopt/regen-baselines.sh grep -n \"regen-baselines\" .claude/validation/lint-selftest.sh"
    label: "O IRMÃO do gate inerte, e é pior porque o gate está VIVO: numa adoção greenfield real (2026-08-17) o lint do adotante nasceu com 47 violações HARD, todas [kg-verificacao/REMOVIDO], cobrando nós de grafos que só existem no core (docs/discussions, onion-pessoal-marcio, bridge-produto-2026-08). CAUSA: o manifesto copia `.claude/validation/` INTEIRO, então os CINCO baselines de catraca viajam com o passivo do core, e o passo (9) do adopt regenerava UM — e o comentário desse mesmo passo já descrevia o modo-de-falha da omissão ('o gate nasceria reprovando o repo do adotante no dia 1 e seria desligado'). AGRAVANTE: a catraca resolve a referência caminhando até o PRIMEIRO commit que tenha o baseline, então o passivo entra na história antes de tudo e regenerar depois não basta — no alvo a história foi reescrita para o commit raiz já trazer os baselines dele. Simetria que fecha o diagnóstico: os MESMOS 47 são, no core, `PASSIVO` tolerado. Gate vivo que reprova por dívida alheia é gate que o adotante desliga — e aí perde-se a guarda inteira, não só o baseline."
    provenance:
