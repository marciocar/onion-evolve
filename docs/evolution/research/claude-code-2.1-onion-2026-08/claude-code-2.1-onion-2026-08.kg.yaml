    label: "O DEFEITO ACIONÁVEL que a investigação encontrou, e ele é NOSSO: o gate determinístico do adotante está INERTE em 4 de 6 medidos — e em nenhum caso isso é visível sem medir. granaai e gustavo-pulga: `core.hooksPath=.githooks` + hook presente = VIVO. metagamify: hook PRESENTE mas `core.hooksPath=.husky` — o husky ganha e o hook do Onion nunca roda (guarda INALCANÇÁVEL: 'a ausência se vê no code review, a inalcançabilidade dá impressão de cobertura', registrado no core em 2026-08-02). onion-pedro e onion-arthur: `core.hooksPath=.githooks` CONFIGURADO apontando para diretório SEM hook — gate declarado e inexistente. onion-dist: nada. Some-se CI rodando a maquinaria em 1 de 7. Os 13–40 scripts vendorizados são INVENTÁRIO, não capacidade, na maioria. ⚠️ NOTA DE MÉTODO: minha primeira medição olhou `.git/hooks` e teria reportado '6 de 6 ausentes' — errado, porque o adopt usa `core.hooksPath`. Medir o lugar errado é não ter medido; só não virou número publicado porque desconfiei da uniformidade."
    provenance:
      source: "sessão do core 2026-08-16 (agente a pedido do maestro) — corpo do commit 49f12f42 §2 + nota de método; corroboração parcial em docs/evolution/federation/CHANGELOG.md l.255-257"
      locator: "corpo de 49f12f42 (2026-08-16 20:52) §2 e NOTA DE MÉTODO; federation/CHANGELOG.md l.257 (metagamify: gate INERTE sob husky, 2026-08-31)"
      method: "testemunho: medição da sessão 2026-08-16 (core.hooksPath/.githooks repo a repo), comando não registrado"

  - id: D_CURAR_O_GATE_INERTE_DO_ADOTANTE
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.8
    verified_at: 2026-08-16
    verified_against: derivada-do-defeito-medido-aguarda-decisao-do-maestro
    label: "CURA PROPOSTA (decisão do maestro): o problema não é o adotante não usar — é o gate estar inerte sem ninguém saber. A cura que esta casa exige é COMPORTAMENTAL: um verificador que PROVA que o gate roda no adotante (ex.: etapa do adopt que faz um commit-sonda com violação plantada e confirma que foi BARRADO), em vez de conferir que o arquivo existe. Casos que ele tem de pegar, todos medidos hoje: hooksPath apontando para outro gestor (husky), hooksPath apontando para diretório vazio, ausência total. Segunda perna, mais barata: embarcar o workflow de CI no bundle (o core tem `onion-validate.yml`; o adopt não leva nenhum), porque githook local é pulável com `--no-verify` — como EU fiz três vezes nesta sessão. Métrica de re-teste direta: quantos adotantes têm gate PROVADO vivo — hoje 2 de 6."

  - id: D_CI_GATE_SEPARADO_DA_BANCADA
    node_type: decision
    plane: PROD
    status: done
    impact: 4
    confidence: 0.9
    verified_at: 2026-08-16
    verified_against: medicao-8-prs-do-dia-6-tocaram-zero-maquinaria-mais-686s-de-729s
    label: "SUPERAÇÃO da questão 'CI longo' — a pergunta era errada. Eu tinha proposto shardar a bancada em matriz (mesmo trabalho, em paralelo, mais minutos de runner). A medição reformulou: a bancada era **686s de 729s = 94% do CI** e rodava em TODO PR, mas dos 8 PRs daquele dia **6 tocaram ZERO arquivo de maquinaria** — esperaram 12 min por uma suíte que não podia lhes dizer nada, porque ela prova as GUARDAS e as guardas não estavam no diff. A distinção que dissolve o problema: `onion-validate` é GATE SOBRE A MUDANÇA (lê o diff, reprova o artefato, ~44s); a bancada é TESTE DE REGRESSÃO DA MAQUINARIA. Gatilhos diferentes, workflows diferentes. Resultado: PR de docs cai de ~12 min para ~1 min, e o custo em minutos de runner DIMINUI (em vez de aumentar, como no sharding). ⚠️ E o filtro de path NÃO repete os três pontos cegos históricos (#241 plugins, #254 docs, #509 ops): o defeito comum daqueles não foi filtrar, foi filtrar e não ter mais nada — path fora da lista nunca era coberto. Aqui há REDE DEBAIXO: `schedule` noturno roda a bancada inteira na main, independente de path, então a cobertura deixa de depender de alguém tocar o arquivo certo."
    provenance:
      source: ".github/workflows/onion-selftest.yml@61a950ee"
      locator: "linhas 3-34 (cabeçalho + on: pull_request.paths + schedule cron '17 4 * * *')"
      method: "leitura: workflow criado no commit 61a950ee (2026-08-17)"
      locality: "repo"

  - id: E_MEDICAO_DOS_REMOTOS_PERDEU_VALOR_DE_DECISAO
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 3
    confidence: 0.85
    verified_at: 2026-08-16
    verified_against: origem-de-cada-conclusao-rastreada-mais-o-update-verificado-no-adopt
    label: "SUPERAÇÃO da segunda questão pendente ('medir os remotos dos adotantes'): ela perdeu valor de decisão, e a checagem mostra por quê. Rastreando a ORIGEM de cada conclusão: 'o corpus centraliza' veio dos CRÉDITOS medidos DENTRO DO CORE (13 no CHANGELOG de co-evolução, 7 no lint) — independe do disco de ninguém; já 'gate inerte em 4 de 6' veio do disco local, e essa é justamente a parte que a cura mecânica resolve sem eu auditar mais nada. Ou seja: medir os remotos hoje seria vigiar repo alheio para confirmar um defeito que já tem cura automática, com dado que envelhece no instante em que a medição termina. A SUPERAÇÃO é inverter o fluxo — em vez de EU auditar, o veredito do gate CHEGA pelo canal que já funciona (co-evolução upstream), porque o `--update` re-aplica o procedimento de configuração pós-cópia, onde o instalador agora PROVA o gate e falha alto. VERIFICADO ao escrever este nó, e vale a nota: eu havia AFIRMADO duas vezes ao maestro que 'os 4 serão pegos no próximo --update' SEM ter checado se o --update passa por lá. Passa (adopt.md §'Atualizar um repo adotado' → 'Re-aplicar a configuração install-only'). A afirmação estava certa por sorte, não por verificação — e é a classe que esta rodada inteira existe para curar."
    provenance:
