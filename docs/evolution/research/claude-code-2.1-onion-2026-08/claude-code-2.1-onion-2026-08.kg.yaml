  note: >
    KG-SSOT da pergunta do maestro (2026-08-16): atualizamos o Claude Code (nativo
    2.1.232 → 2.1.233) — o que mudou nas versões até aqui, o que isso altera no que o
    Onion usa, o que ajustar, vantagens, cuidados, o que copiar/evitar, padrões
    emergentes, alinhamento com os caminhos da IA, e o que a comunidade diz. E a
    pergunta que governa todas: qual é a SUPERAÇÃO do Onion diante disto.
    Nasce como grafo por doutrina (investigação nasce .kg.yaml, não prosa) e porque a
    própria pergunta pede validação pela maquinaria: KG-SSOT-first, SDAAL, Elenxo,
    regras, artefatos, ADR. Duas frentes de pesquisa alimentam os `evidence`:
    changelog/docs (fonte primária Anthropic) e comunidade (HN + GitHub API; Reddit
    ficou INACESSÍVEL e está declarado como lacuna, não preenchido com prior).

