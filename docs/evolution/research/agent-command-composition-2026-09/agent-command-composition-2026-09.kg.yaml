eres por remoção de script/style + strip de tags + colapso de espaço em Python; outro extrator dá número próximo mas diferente — 12.936 na re-medição independente, e por isso o método vai declarado) NÃO contém a frase que a rodada registrou como confirmada pelo verificador — `only routes` 0x, `cannot block` 0x, `routes between` 0x, `veto` 0x, `block individual` 0x, `blocking` 0x, `deny` 0x, `reject` 0x, `guardrail` 0x. No docs/workflow-syntax.md, `veto` 0x, e as 31 ocorrências de `block*` são bloco YAML, bloco de código ou bloqueio de path traversal — nenhuma sobre barrar ação de agente. A LIÇÃO vale mais que a pendência: a claim foi rejeitada na ancoragem por LOCATOR errado, e o CONTEÚDO seguiu registrado como confirmado pelo verificador — e ele NÃO REPRODUZ. Quote atribuída a um grep que não se reproduz é fonte fabricada uma camada ACIMA da que o juiz pega: ele barrou o endereço e deixou passar a citação. Nenhuma decisão do core pode citar que a arte externa não veta como fundamento: não há fonte.'
