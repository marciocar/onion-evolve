  - id: Q_AGENT_COMMAND_COMPOSITION_0928
    node_type: question
    plane: DEV
    status: done
    verified_at: 2026-09-28
    verified_against: 'NAO e medicao do mundo, e declarado como tal: o carimbo afere a DECISAO do maestro de 2026-09-28 que tornou a pergunta sem valor de decisao (construir o /meta:forge), nao uma resposta ao que se perguntava. O nome do composto continua nao-provado em nenhuma direcao.'
    impact: 5
    confidence: 0.55
    label: 'Como o mercado padroniza, em setembro de 2026, compor um comando de agente a partir de (a) DOUTRINA declarada como fragmento reutilizavel, (b) CONTEXTO MEDIDO injetado antes do raciocinio do modelo e (c) ORQUESTRACAO DETERMINISTICA em script (fases, schemas, budget, coordenacao a custo zero de token), com destino obrigatorio num grafo de conhecimento — e que NOME esse movimento tem. FECHADO 2026-09-28 (`done`) por decisão do maestro, NÃO por resposta — detalhe no fim. Texto original preservado: VEREDITO: segue `open`, respondida PELA METADE. O QUE FICOU ESTABELECIDO: existe especificacao aberta para a camada (a) — Agent Skills, nomeada por analista tier 7 (Thoughtworks Radar vol. 34) como padrao aberto de modularizacao de contexto, com spec em agentskills.io e adocao declarada em 26+ plataformas incluindo concorrentes diretos; existe precedente de governanca neutra no ecossistema (o MCP saiu da Anthropic para a Agentic AI Foundation sob a Linux Foundation); e a camada (c) tem DUAS implementacoes independentes que convergem na mesma tese — topologia DECLARADA em arquivo (nao descoberta em runtime) com orquestrador a custo ZERO de token (Microsoft Conductor em YAML+Jinja2; Claude Code Workflows em .js com schemas JSON e budget medido em tempo real). O QUE NAO FICOU ESTABELECIDO: o NOME do composto. Sete claims de sete fontes distintas afirmando "nao existe termo consolidado" foram TODAS refutadas na votacao adversarial, e as duas que afirmavam "o termo e Agent Skills" tambem. Logo esta rodada nao provou nem a existencia nem a ausencia de um nome para o composto — provou apenas que ha nome para a camada (a). Tambem NAO ficou estabelecida a camada (b) isolada: as tres claims sobre injecao de contexto medido pre-raciocinio (progressive disclosure de 30-50 tokens, modos accumulate/last_only/explicit, sintaxe de comando dinamico) foram refutadas, todas por fonte de tier 3-6. E o eixo mais importante para uma decisao — evidencia PRIMARIA de o que funcionou e o que fracassou — voltou VAZIO: a unica fonte tier 7 de fracasso (arXiv:2605.14102, orquestracao mais agressiva NAO melhorou desempenho) foi refutada. A pergunta e decidivel, mas nao com esta base. SELADO 2026-09-28, por decisao do maestro, e o motivo importa: esta pergunta existia para informar SE valia padronizar a composicao, e essa decisao foi TOMADA por outro caminho (o no de decisao do /meta:forge, no grafo forge-comando-framework-2026-09). Com a decisao tomada, o valor de decisao desta pergunta caiu a zero, e mante-la open custaria rodada de pesquisa para informar algo que nao esta mais em aberto. O QUE NAO SE PERDE: os fatos estabelecidos vivem nos nos de evidencia confirmados deste mesmo grafo (Radar tier 7, spec aberta com 26+ adotantes, duas implementacoes independentes de topologia declarada) — fechar a pergunta nao os apaga. O QUE FICA DECLARADO E NAO RESOLVIDO: o NOME do composto segue NAO-PROVADO EM NENHUMA DIRECAO, nem existencia nem ausencia. Quem citar esta rodada para afirmar que o movimento nao tem nome estara citando mal.'
