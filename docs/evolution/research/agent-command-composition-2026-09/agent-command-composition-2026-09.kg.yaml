    label: 'SELADO 2026-09-28 (`confirmed`) — o que segue foi escrito como PROPOSTA e a decisão do maestro o selou; leia-o já selado. Texto original preservado: PROPOSTA DE VEREDITO — esta rodada NÃO sela, propõe. A sub-pergunta (4) do maestro ("o paper Context Kubernetes é, ou não é, a arte externa do DESTINO OBRIGATÓRIO do conhecimento num grafo declarativo?") tem agora resposta ancorada em leitura integral da fonte primária: NÃO É. Ele é a arte externa da ENTREGA GOVERNADA — manifesto YAML declarativo + reconciliation loop + permissão como subconjunto estrito da autoridade humana, tudo na direção conhecimento-existente → agente. As quatro medições que sustentam o veredito: (i) o abstract declara governar entrega/permissão, não destino do produzido; (ii) "write(" ocorre UMA vez no documento inteiro, como assinatura de adapter, sem critério de aceitação; (iii) o único gate determinístico está no REGISTRO do perfil de agente, e mesmo esse é "design invariant", não "verified property", por falta de model-check; (iv) o R7 (Context Operators, pattern extraction, learning loops) — o único componente que tocaria conhecimento produzido por agentes — é design NÃO implementado. E FICA A PERGUNTA DERIVADA, que é a que decide a posição do Onion e esta rodada NÃO pode responder: se a arte externa cobre ENTREGA e não cobre DESTINO obrigatório do produzido, o destino em grafo com gate determinístico é DIFERENCIAL real do Onion ou LACUNA do campo inteiro (ninguém faz porque não vale a pena)? Responder exige as duas coisas que este grafo não tem — evidência primária de fracasso (lacuna 3) e o eixo de capital (lacuna 1). GATILHOS NOMEADOS para reabrir: (a) aparecer paper ou produto com write path governado e critério de aceitação NO DESTINO; (b) o R7 do Context Kubernetes sair de "Design" para implementado numa v4 do preprint; (c) rodada/M&A que mostre dinheiro em orquestração-com-destino em vez de contexto-para-entrega. SELADO 2026-09-28: o VEREDITO está confirmado — o paper é a arte externa da ENTREGA GOVERNADA, não do DESTINO do que se produz — ancorado nas quatro medições acima, feitas na leitura integral da fonte primária. A PERGUNTA DERIVADA (destino-em-grafo é diferencial real do Onion ou lacuna do campo inteiro?) NÃO foi selada e MUDOU DE CASA: ela decide o valor da peça 5 da forja, então vive agora em `docs/onion/graph/forge-comando-framework-2026-09.kg.yaml` como nó `open`, com os três gatilhos acima preservados. Separar foi deliberado: este grafo está no teto declarado (27 nós após esta leva) e a derivada não é nenhuma das quatro cláusulas que o autorizam a crescer.'
