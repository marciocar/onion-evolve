    verified_at: "2026-10-08"
    verified_against: "2.1.295: 'Added onFailure: block for command and HTTP hooks: a hook that can't start, times out, or exits with an unexpected code blocks the action instead of letting it through'; no core, .claude/settings.json tem 20 hooks command e NENHUM com onFailure (medido por leitura do JSON)"
    label: "o harness ganhou onFailure: block (2.1.295) e nenhum dos 20 hooks do Onion o usa: nos PreToolUse, hook que não inicia, estoura o timeout ou sai com código fora de 0/2 deixa a ação passar (doc de hooks); o PreModelSwitch já bloqueia por timeout"
    narrative: "Os vetos do Onion se apoiam no exit 2 (a capacidade que justifica o acoplamento, no CLAUDE.md). O modo de falha que eles não cobriam por construção é o hook que nem roda: python ausente, timeout, crash antes do exit 2. Esses casos eram tratados um a um dentro de cada script (fail-closed escrito à mão). O harness agora oferece fail-closed declarativo para o hook inteiro."
    provenance:
      source: "CHANGELOG 2.1.295 e .claude/settings.json@d56f685c"
      locator: "2.1.295, 1º item 'Added onFailure'; settings.json, chave hooks"
      method: "medição: leitura e medição"
