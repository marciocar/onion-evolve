    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.7
    verified_against: "proposta da rodada r8; ainda não medida ao vivo (falta provar que o harness 2.1.295 bloqueia um hook que crasha)"
    label: "adotar onFailure: block nos PreToolUse (env-guard, protect-main, merge-gate e avaliar o kg-read-leg) e provar ao vivo, com um hook que crasha, que a ação fica bloqueada"
    narrative: "Não nos hooks de aviso (SessionStart, UserPromptSubmit, Stop), onde bloquear por falha do próprio hook travaria a sessão. Três cuidados do juiz: a doc oficial de hooks não tem nenhuma ocorrência de onFailure, então a única fonte é o CHANGELOG e a medição ao vivo é obrigatória; adotantes pinados abaixo de 2.1.295 recebem uma chave que o harness deles não conhece (medir o efeito antes de vendorizar); os PreToolUse não declaram timeout, logo vale o padrão de 600 s."
