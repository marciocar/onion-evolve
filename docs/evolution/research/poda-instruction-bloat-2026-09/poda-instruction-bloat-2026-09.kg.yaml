    source_tier: 10
    source_kind: internal-audit
    label: 'OBJECAO SOBREVIVENTE — a triagem e incoerente e por isso o achado externo nao pode carregar a decisao. Ou o preprint vale, e as tres irmas voltam (inclusive a que refuta a opcao B), ou nao vale, e a manchete cai junto: nao existe base para aceitar o resultado e refutar o mecanismo que o explica. Substantivamente o numero e inutilizavel como criterio: um hazard POPULACIONAL nao diz QUAL linha cortar. E a direcao se corrobora com evidencia tier 10 do proprio repo (adds=323/dels=77, maior remocao unica = 5 linhas), o que torna a citacao externa SUPERFLUA e o resto do preprint um passivo. Limite imposto: a decisao nao deve citar o -0.032 como criterio, e a opcao B nao pode ser tratada como refutada por uma irma que a rodada descartou.'
    trace: 'https://www.alphaxiv.org/abs/2608.11095'

