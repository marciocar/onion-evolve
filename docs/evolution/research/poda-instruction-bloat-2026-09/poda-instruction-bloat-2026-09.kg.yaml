    source_kind: analyst
    label: 'OBJECAO SOBREVIVENTE (era descarte por comodismo, e reabre) — era o UNICO mecanismo causal ligando tamanho a comportamento, e e exatamente o que o corpus observou ao vivo. Sem esse mecanismo a recomendacao fica sem teoria e a poda vira contagem de linhas. Faltou olhar o proprio grafo kg-read-leg-2026-08, que corrobora a literatura com controle empirico. Limite imposto em duas direcoes: contra a opcao D, porque existe dano observado que NAO depende de esgotar a janela (0,5% de 1M nao esgota nada, e o caso C1 falhou assim mesmo); e sobre a decisao inteira, porque fixa a metrica certa — a poda se justifica por ATENCAO e comportamento, nunca por bytes.'
