  # ── A DECISÃO (open — quem sela é o maestro) ─────────────────────────────────────────────
  - id: D_PODA_INSTRUCTION_BLOAT_CLAUDE_MD_E_SKILLS
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.7
    label: 'DECISAO ABERTA (o maestro sela): o que podar do CLAUDE.md e das skills do core, entre (A) mover doutrina para skills/rules por path deixando o CLAUDE.md so com identidade + roteamento, (B) manter o CLAUDE.md e comprimir, (C) medir primeiro com InstructionsLoaded e podar so o que nunca carrega / nunca muda comportamento, (D) nao podar. RECOMENDACAO DO ELENXO: **C, mas RE-ESPECIFICADA — e a re-especificacao E a decisao**: medir COMPORTAMENTO, nao carga. Tres razoes, todas com objecao sobrevivente por tras. (1) A premissa da pergunta esta errada e o problema encolhe ~5x: no Claude Code 2.1.259 so a `description` da skill entra sempre, o corpo carrega sob demanda, e duas skills do core ja declaram `paths:` — logo a metade "carga" de A ja e default da plataforma e nao se decide, se herda. (2) O constrangimento vivo nao e janela (0,5% de 1M) e sim atencao: lost in the middle e o unico mecanismo causal que liga instrucao enterrada a comportamento errado, e o corpus ja o observou ao vivo (kg-read-leg-2026-08/E_claude_md_has_control: a secao entrou no CLAUDE.md e o caso falhou seis semanas depois SOB ELA CARREGADA). Poda que nao mede comportamento e contagem de linha. (3) A poda tem de ser calibrada no modelo que EXECUTA, nao so no que decide: o efeito de densidade nao e uniforme e o Onion roda opus no maestro e modelos menores em subagentes. Forma concreta recomendada: replay de N casos por instrucao candidata, com e sem ela, no tier do subagente E no do maestro; instrucao que nao muda veredito em nenhum dos dois sai; toda instrucao que fica ganha um comentario de POR QUE existe, para que a proxima delecao seja decidivel em vez de exponencial. Pre-requisito declarado, hoje aberto: a spec do payload do hook InstructionsLoaded (existe no binario, 21 ocorrencias; nao sabemos se distingue carregou de influenciou) — por isso esta decisao nasce com dependencia, nao com data. Fio-mae: meta-research-lens-2026-09/D_PODA_INSTRUCTION_BLOAT_MEDIDA, que segue open la.'
    trace: 'docs/evolution/research/poda-instruction-bloat-2026-09/poda-instruction-bloat-2026-09.kg.yaml'

  # ── OBJEÇÕES SOBREVIVENTES DO ELENXO (dissent que LIMITA = CONSTRAINS) ───────────────────
