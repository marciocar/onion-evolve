    label: 'A CLASSE, e ela ja estava escrita no proprio forge-census: *"zero NAO e resultado"*. Dois medidores a violavam no mesmo dia. (1) `forge-census --markdown` tinha `head -12` LITERAL e imprimia 12 de 59 candidatos SEM DIZER — o cabecalho ate imprimia "59 candidato(s)", mas comparar 12 com 59 e trabalho do LEITOR, e leitor nao e mecanismo. (2) `kg-corpus-grep "frase entre aspas"` casava a frase INTEIRA como UM termo e devolvia `0 no(s)` sobre 120 grafos. O DANO E O MESMO nos dois: AUSENCIA-POR-CORTE e AUSENCIA-POR-INVOCACAO sao indistinguiveis de AUSENCIA-POR-ZERO, e quem le conclui "o corpus nao sabe disto" / "o artefato nao tem nada". Foi exatamente o que produziu E_O_EVOLVE_E_2_DE_7_NAO_ZERO.'
    trace: '.claude/validation/forge-census.sh'
    verified_against: 'head -12 literal lido no forge-census.sh; invocacao do kg-corpus-grep com frase quotada devolvendo 0 sobre 120 grafos, e 294 nos com os mesmos termos separados'

  - id: E_AS_DUAS_CURAS_COM_CONTRAPROVA
