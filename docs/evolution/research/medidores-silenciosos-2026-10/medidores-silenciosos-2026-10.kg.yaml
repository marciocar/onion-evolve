    label: 'SUB-CASO DA MESMA CLASSE, no MESMO conserto: ao corrigir o harness, meu `replace(old, new, 1)` acertou a PRIMEIRA ocorrencia da string — que era dentro do COMENTARIO que eu acabara de inserir (ele cita os dois rotulos como exemplo) — e deixou a chamada real do M1 intacta. Resultado: 3 mutantes passaram a morder e o M1 seguiu "nao mordendo", por um motivo inteiramente diferente do original. LICAO: comentario que CITA a string que se vai substituir e um alvo de substituicao; `replace(...,1)` nao sabe distinguir documentacao de codigo. Casar o FORMATO ou a chamada completa, nunca o fragmento que a prosa tambem contem — e a mesma familia de `guarda-por-lista-falha-pelo-vocabulario`.'
    trace: '.claude/validation/lint-selftest.sh'
    verified_against: 'o diff do proprio harness mostrou o comentario corrompido (l.18) com a chamada do M1 inalterada; corrigidas as duas pontas, 4/4 morderam'

  - id: C_O_EVOLVE_NAO_E_FRACO_E_SEM_GATILHO
    node_type: claim
