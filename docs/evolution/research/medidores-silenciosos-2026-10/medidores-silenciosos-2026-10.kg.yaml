  - id: C_TERCEIRA_CAUSA_DE_MUTANTE_QUE_NAO_MORDE
    node_type: claim
    plane: DEV
    impact: 5
    confidence: 0.95
    status: confirmed
    verified_at: '2026-10-03'
    label: 'A LICAO DE METODO DESTA LEVA, e ela ESTENDE uma doutrina existente. A casa conhecia DUAS causas para "o mutante nao mordeu": o caso e DECORATIVO, ou o mutante NAO MUDA o que o caso afirma. Hoje apareceu a TERCEIRA: o HARNESS OLHOU A STRING ERRADA. Os 4 mutantes morderam de verdade — o runner imprimia `✗` em todos — e o harness declarou "NAO MORDEU" nos quatro, porque eu grepei o rotulo de `record_pass` dentro da linha de `record_fail`, e os dois rotulos sao DIFERENTES por desenho ("(a) corte calado" vs "(a) projecao cortada DECLARA"). A cura e ancorar no PREFIXO do caso (`silent-measurer: (a)`), que e estavel nas duas saidas. CONSEQUENCIA: `bancada-espelha-o-runner` vale para o HARNESS DO MUTANTE tambem, nao so para o caso — e um harness que mente sobre o mutante e pior que nenhum, porque convida a "consertar" um caso que esta certo.'
    trace: '.claude/validation/lint-selftest.sh'
    verified_against: 'primeira rodada: 4x "NAO MORDEU" com os 4 ✗ visiveis na propria saida do diagnostico; apos ancorar no prefixo: 4x MORDEU'

