    verified_at: '2026-10-04'   # re-medido no dia do selo; a medicao original e de 2026-10-03
    label: 'RESPONDIDA E FORJADA EM 2026-10-04: o maestro selou ("forja o gatilho do evolve") e a guarda e a REGRA 97 (A auto-auditoria do framework tem GATILHO), artefato `.claude/validation/evolve-staleness-check.sh`. DOS QUATRO CANDIDATOS, os dois primeiros viraram MECANISMO e os dois ultimos ficaram nomeados: (a) IDADE virou a perna 1, derivada da DATA do relatorio que o evolve PRODUZ — nao de um `last_run:` digitado, porque carimbo sem medicao e modo-de-falha conhecido desta casa; (b) DELTA POPULACIONAL virou a perna 2, medida no GIT, e e a que a idade sozinha nao da (relatorio de ontem com 30 artefatos novos esta vencido na SUBSTANCIA); (c) gatilho por SINAL segue fora, sem defeito datado proprio; (d) RELOGIO/CRON nao foi vedado — a guarda AVISA e a escolha entre avisar e agendar e do maestro, agora com o aviso na mao em vez do silencio. DISPAROU NO DIA EM QUE NASCEU: 66d e 289 artefatos tocados. Conhecimento da forja em `docs/evolution/research/guard-evolve-staleness-2026-10/`.\n--- redacao anterior (PERGUNTA ABERTA), preservada: A PERGUNTA QUE O RE-FORJAR TEM DE RESPONDER ANTES DE ESCREVER SUPERFICIE: qual e o GATILHO do /meta:evolve? O radar tem a REGRA 65 (Radar de mundo com baseline DATADA por eixo, SOFT no lint); o dissect tem censo de nivel vencido; o kg tem a REGRA 67 (Grafo de pesquisa com REVISITA carimbada). O evolve nao tem NENHUM — e e por isso que ficou 65 DIAS sem rodar, nao por ser caro (medido 2026-10-03 contra `docs/analysis/onion-evolution-2026-07-30.md`, o ultimo relatorio; a 1a redacao deste no dizia "32 dias", que era o numero de 2026-08-31 carimbado como se fosse de hoje — `verify-external-for-current` cometido dentro de casa, reprovado pelo Elenxo do PR #909). Candidatos a MEDIR, nao a supor: (a) idade da ultima auditoria por DIMENSAO (o analogo da REGRA 65, barato e ja tem molde); (b) delta populacional (comando/agente/skill novo desde a ultima passada — o inventory ja mede); (c) gatilho por SINAL (achado de adotante, versao de plataforma, guarda nova sem bancada); (d) RELOGIO/cron sobre o evolve read-only. ⚠️⚠️ A 1a redacao deste no EXCLUIA o (d) assim: "o que NAO pode ser: relogio/cron — isso e MOAT W7, maestro-invocado por doutrina". ISSO ERA FALSO, e falso de um modo especialmente ruim: re-afirmava como doutrina o NAO-SEQUITUR que o Elenxo de 2026-08-31 — citado como autoridade pelo no VIZINHO deste — ja havia derrubado POR MEDICAO, e usava a invencao para proibir justamente o candidato que aquela refutacao chamou de "resposta proporcional". Re-medido em 2026-10-03: `grep -ciE cron|schedule|/loop|agend` em `.claude/commands/meta/evolve.md` devolve ZERO, e `automation-ladder-registry.txt` tem DUAS entradas MOAT (`site-vps-deploy`, `bridge-deploy`) — nenhuma e "agendar por relogio". O W7 escopa o DRIVER (`/meta:drive`, que EXECUTA); o evolve PROPOE e nao muta. Logo o (d) esta na mesa como os outros tres, e quem decide e o maestro. GATILHO desta pergunta: a propria leva do re-forjar.'
    trace: '.claude/commands/meta/evolve.md'
    verified_against: 'REGRA 65 lida no lint-artifacts; o evolve.md nao cita census, rules/ nem familia de bancada (medido: 0 ocorrencias de cada). ADICIONADO em 2026-10-03 apos reprovacao: 65 dias calculados contra o mtime/nome do ultimo relatorio em docs/analysis/ (onion-evolution-2026-07-30.md); ZERO ocorrencias de cron|schedule|/loop|agend em evolve.md; DUAS entradas MOAT no automation-ladder-registry.txt, ambas de deploy'

  - id: E_O_ELENXO_REPROVOU_O_PR_QUE_DENUNCIAVA_CORTE
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 0.95
    status: confirmed
    verified_at: '2026-10-03'
    source_tier: 10
    label: 'O ELENXO REPROVOU 4 DOS 7 ITENS DESTE PR, com 14 achados (5 de 1a classe, 2 fora da minha lista), e a ironia e estrutural: um PR cujo TEMA e "medidor que corta em silencio produz afirmacao falsa" entregava (i) um aviso que DECLARAVA UM CORTE FALSO, (ii) um no que afirmava uma PROIBICAO FALSA, e (iii) o corte silencioso INTACTO exatamente onde o dano acontece. Os cinco piores: R1 — o `forge-census` tem DOIS cortes (head, e rastreado-ausente-do-disco); curei um e fiz o aviso novo mentir sobre o outro, inclusive mandando usar `--tsv`, que sofre o mesmo pulo (provado movendo um candidato do disco com TOP=100000: "CORTADA: 58 de 59" sem corte algum). R2 — o no `open` de maior atencao proibia cron citando MOAT W7, re-afirmando o nao-sequitur que o Elenxo citado no no vizinho derrubou por medicao. R3 — "32 dias" eram 65. R4+R5 — a licao foi para a migalha e NAO para `forge.md:28` (12 de 59) nem `onion-research/SKILL.md:23` (40 de 298), e neste a minha cura PIOROU a leitura: um zero falso e BARULHENTO virou um quarenta quieto e igualmente falso. R6 — a busca-frase morreu sem escotilha (`o maestro`: 396 nos precisos viraram 4114). LICAO QUE FICA: o gate mecanico estava VERDE (0 HARD) nas duas rodadas, e nenhum dos cinco e detectavel por lint — HARD 0 com afirmacao falsa no `label` e precisamente o caso que este PR se propunha a tratar.'
    trace: 'docs/evolution/review/fix-medidores-que-cortam-em-silencio.md'
    verified_against: 'refutador opus/high em worktree isolada, mandato REFUTAR, default REPROVADO; 184k tokens, 88 chamadas, ~17 min; rodou os artefatos, refez os 4 mutantes com harness PROPRIO (confirmando que mordem) e acrescentou 2 mutantes que eu nao tinha; os achados R2/R3/R8 foram RE-VERIFICADOS por mim na fonte antes de aceitar'

  - id: D_GUARDA_DA_CLASSE_CORTE_NAO_DECLARADO
    node_type: decision
    plane: PROD
    impact: 4
    confidence: 0.9
    status: done
    owner: maestro
    verified_at: '2026-10-04'
    label: 'SELADO PELO MAESTRO EM 2026-10-04 ("selo fechado se ok") e FORJADO no mesmo dia pela superficie `/meta:forge-guard` — a guarda e a REGRA 96 (Diretiva de contexto INJETADO nao corta listagem em silencio), artefato `.claude/validation/injected-cut-check.sh`, 14 casos no `--selftest` proprio + familia `run_injected_cut_selftests` (4 casos, cobrindo o modo `--tsv` que a producao consome), 6 mutantes mordendo, registrada no dispatcher do lint. O conhecimento da forja vive em `docs/evolution/research/guard-injected-cut-2026-10/`. ⚠️ E a forja corrigiu a FORMA na entrada: eu estava escrevendo o predicado como funcao embutida no `lint-artifacts.sh`, que NAO e o molde desta casa, e o maestro interrompeu com "dogfood use a forja" — invocar devolveu a forma certa (script proprio com `--selftest`, molde `consumed-mode-check.sh`, o mais exercitado no censo) em uma leitura. Imitar o procedimento produzira um artefato com a forma errada.\n--- redacao anterior (CANDIDATO, aguardando selo), preservada: QUARTO CANDIDATO A GUARDA, com defeito DATADO (a clausula 1 da guard-doctrine exige isso) e com o numero medido. DEFEITO: 2026-10-03, tres sitios vivos cortando listagem em silencio — `forge.md:28` servia 12 de 59 ao /meta:forge, `onion-research/SKILL.md:23` injetava 40 de 298 achados do corpus, e `kg.md:325` prometia "FILA COMPLETA / CORPUS INTEIRO" antes de um `head -20` sobre ~312 abertos. Os tres curados nesta leva; a CLASSE segue sem guarda, e o Elenxo cobrou isso como achado proprio: tratar classe por instancia contraria `erro-recorrente-vira-registro-com-cura`. ⚠️ O QUE MUDA O CALCULO, e e a razao de registrar agora: medido DEPOIS das curas, o passivo na superficie de DIRETIVA INJETADA e ZERO — `grep` por `!`...| head -N`` com N>=5 em `.claude/commands/**` e `.claude/skills/**` devolve nada, sobrando dois `head -1` de extracao de valor unico, que NAO sao a classe. Guarda que nasce em ZERO nao precisa de baseline de catraca nem tolera passivo: e o melhor momento possivel para forja-la, e o pior para adia-la, porque o proximo `head -N` ja entra reprovando em vez de entrar no baseline. PREDICADO PROPOSTO (a medir, nao a supor): diretiva de injecao cujo pipeline termina em `head -N` com N>=5 sem uma linha que declare o total. VOCABULARIO E O RISCO conhecido desta casa — `tail`, `sed -n 1,Np`, `head -n N` e `| head` sem numero sao as formas que um predicado ingenuo perde. NAO SELO: candidato a guarda e selado pelo maestro (os tres de 2026-10-02 foram), e eu nao cunho REGRA numerada sozinho. GATILHO: o selo dele.'
    trace: '.claude/commands/common/prompts/guard-doctrine.md'
    verified_against: 'os tres sitios lidos e curados nesta leva; passivo re-medido apos as curas: zero diretivas injetadas com head -N (N>=5), dois head -1 legitimos'

