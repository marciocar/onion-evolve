    label: 'A MIGALHA DE ONTEM AFIRMAVA FALSO, e o erro era meu. Ela declarava que o /meta:evolve tinha "0 de 7 pecas — ausente do censo inteiro" e que era "o MENOS estruturado dos 59 candidatos". MEDIDO no `--tsv`: ele e 2/7 (TEM a peca 5, destino: cita `kg-radar` na l.193), esta EMPATADO com 12 outros candidatos, e 37 dos 59 estao ABAIXO dele em 1/7. Distribuicao conferida e somando 59: 37 em 1/7, 13 em 2/7, 3 em 3/7, 3 em 4/7, 1 em 6/7, 2 em 7/7. Logo as duas metades da afirmacao eram falsas: nem zero, nem o menor.'
