    label: "o defeito, datado: com o deny fora (bypassPermissions, E_DENY_NAO_SEGURA_EM_BYPASS_1125), nenhum hook barrava reescrever a história (filter-branch/filter-repo), apagar raiz, home ou .git com rm recursivo, apagar o repo, nem o force-push e o clean -fdx chegados por eval literal"
    narrative: "A forma do incidente (crase em heredoc sem aspas com force-push) já caía no protect-main de origin/main desde 2026-11-24 (força dura em qualquer branch); o que segue aberto e só o deny cobria são as formas acima. O eval escapava porque a lib só marcava inanalisável o eval que citava push ou merge, e o protect-main só fechava o inanalisável com alvo main."
    provenance:
      source: ".claude/settings.json; .claude/hooks/pretooluse-*.sh"
      locator: "sonda probeall.py no rascunho da forja (todos os hooks Bash do settings.json, JSON com cwd)"
