  - id: D_ESPELHO_DO_DENY_POR_HOOK_E_EVAL_NA_LIB_1125
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 5
    confidence: 0.85
    verified_at: "2026-11-25"
    verified_against: "guard-census.sh (classe nova no léxico; molde de hook com lib: protect-main); tempo medido do protect-main ≈ 180 ms por chamada; lib/invocation-lines.sh já seguia heredoc, crase, $( ), bash -c e env"
    label: "três curas, cada uma no seu dono: (1) hook novo pretooluse-deny-mirror.sh para os atos que nenhum hook tinha dono; (2) a lib analisa o eval LITERAL como sh -c, uma vez para todos os vetos; (3) o protect-main fecha o inanalisável com força dura em qualquer alvo"
    narrative: "Estender o protect-main com rm, filter e gh deixaria um hook de nome «protect-main» dono de atos que não tocam a main; o merge-gate e o moat-gate já têm dono (merge e alvo servido). O custo do hook novo é uma passada a mais da lib por comando Bash (≈ 180 ms medido no protect-main). A lib ganhou a variável ONION_DENY_MIRROR, que só acrescenta as linhas rm: as outras guardas veem a mesma saída sem ela. Força dura e clean -x seguem com o protect-main (um dono por ato). Fora de propósito, pela guard-doctrine «A camada nativa»: reset --hard, --force-with-lease de branch de trabalho, rm -rf de pasta de trabalho, apagar branch remota de trabalho (o merge verificado manda fazê-lo)."
    provenance:
      source: ".claude/commands/common/prompts/guard-doctrine.md"
      locator: "seção «A camada nativa: o permissions.deny portátil» (o que fica fora de propósito)"
      method: "measurement: censo de guardas e tempo do hook medidos na forja"
      locality: "repo"
