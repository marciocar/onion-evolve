nodes:
  - id: Q_PERSONA_RUNTIME_2026_11
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.6
    label: "Qual runtime deve servir a persona de serviço do Company Brain de um adotante: A bot próprio no Agent SDK (bridge + kg_mcp), B o assistente nativo do chat (Claude Tag no Slack) ou C um bot de mercado de terceiro?"
    narrative: "Requisitos já decididos (D_MA_ARCH e D_MA_RUNTIME_PESQUISAR_ANTES_1104, no grafo company-brain-multiaudiencia-2026-10): identidade de serviço própria que age em nome da empresa e nunca como o maestro (on-behalf-of, claim act do RFC 8693); atendimento por menção no chat corporativo; triagem dos canais conectados (e-mail, chat, task manager) em card, resposta ou pergunta ao maestro; piloto em modo rascunho aprovado pelo maestro; escada de autonomia por tipo de ato; sem dependência de serviço externo além de ponte opcional com alternativa local nomeada; vetos determinísticos (hooks com exit 2) valendo no runtime; custo e operação numa VPS compartilhada. Critérios de comparação: vetos e escada, identidade e auditoria, leitura do KG, custo, lock-in, operação, segurança (isolamento e segredos) e maturidade. Fica open: o selo é do maestro."
    trace: "docs/evolution/research/persona-runtime-2026-11/SYNTHESIS.md"
  - id: D_PERSONA_RUNTIME_2026_11
    node_type: decision
    layer: audit
    impact: 5
    confidence: 0.55
    label: "Runtime da persona de serviço: A bot próprio no Agent SDK/bridge · B-hospedado Claude Tag · B-self-hosted · C bot de mercado · A+ponte B. O Elenxo recomenda A como núcleo, com B só como ponte nomeada (A+ponte B), sob 7 condições. O maestro sela."
    trace: "workflow onion-research em modo decision, 2026-11-06; origem: D_MA_RUNTIME_PESQUISAR_ANTES_1104"
    status: done
    plane: DEV
    verified_at: "2026-11-06"
    verified_against: "decisão do maestro em 2026-11-06, por pergunta com opções (/meta:decide): escolhida «A + ponte B»"
    narrative: |-
      RECOMENDAÇÃO DO ELENXO (INTEIRA; afirmação de UM agente, sem votação): Recomendo a opção A: bot próprio no Agent SDK, hospedado no onion-bridge, com o kg_mcp como ferramenta fora da fronteira do agente. É a única opção em que o veto do adotante roda no runtime. A primária de hooks do SDK diz que os hooks de shell do .claude/settings.json carregam pelo settingSources padrão e que o PreToolUse pode devolver deny, ask ou defer. B não documenta hook do adotante. Em B, a variante self-hosted perde os conectores ('Claude can't use the connectors an admin adds'), então não cumpre ao mesmo tempo 'núcleo local' e 'triagem dos canais conectados'. B também é incompatível com ZDR, CMEK e HIPAA e guarda transcrições sem retenção automática. C sai pela classe Drift: o vendor concentra tokens de muitos clientes, e um bot fora do Marketplace fica limitado a 1 req/min e 15 objetos. A recomendação vale só sob estas condições, tiradas das objeções que sobreviveram: 1. **Veto que não falha aberto (bloqueia).** Subir o SDK do bridge de 0.3.303 para 0.3.317 ou mais e armar os vetos com onFailure:'block'. Antes de declarar o veto, provar com um mutante: um callback que lança precisa bloquear a ferramenta. Sem isso, 'A PreToolUse guard that crashes then lets the tool call reach the normal permission flow'. 2. **Exit 2 não é fronteira de segurança.** Vale D_EXIT2_COUPLING_WORDING_2026_11, e a exfiltração pelo texto da resposta não passa por tool call. O post no Slack deve ser uma ferramenta própria atrás de deny/ask, e o modo rascunho com aprovação do maestro é o controle real do piloto. 3. **Um app Slack interno por adotante, nunca um app distribuído pelo core.** Só o app interno escapa do Tier 1 em conversations.history e conversations.replies. 4. **Isolamento pelo degrau 2 já em produção.** Usar o runner com DynamicUser, ProtectHome e IPAddressDeny. Não usar bwrap nem Docker nesta VPS: o bwrap falha por apparmor_restrict_unprivileged_userns, e o Docker fura o ufw. 5. **Credenciais fora da fronteira.** Slack, e-mail e task manager entram por ferramenta ou broker fora da fronteira (opção 5 do grafo chat-agent-isolation), porque o bridge já teve um .env lido por um convidado. 6. **Identidade.** O bot token do Slack é a identidade de serviço. Declarar como lacuna aberta que o claim act do RFC 8693 só existe se o operador rodar um emissor de token exchange, sobre a raiz de confiança A2A do bridge. Nenhuma das três opções o entrega hoje. 7. **Corrigir a matriz antes de levar ao maestro.** B TEM identidade de serviço em canais (a refutação estava errada e foi reinstalada pela primária). A auditoria de B é parcial porque não registra quem pediu cada ato e deixa de fora o tráfego git e MCP. O 'só desconexão e remoção de escopo' do achado 8 está errado. A escada de B é parcialmente expressável por host, caminho e método no Agent Proxy. B fica como ponte opcional nomeada, só para um adotante não regulado e com A como alternativa local, configurada assim: - DMs desligadas, porque no DM o Claude Tag roda na conta de quem enviou; - 'Respond automatically' desligado; - 'Restrict to your organization' ligado; - busca limitada aos canais em que o Claude está; - credenciais só em canais privados. ESTADO: open. Duas condições têm triagem 'bloqueia' (E_OBJECAO_SDK_HOOKS_FAIL_OPEN_BELOW_0_3_317 e E_OBJECAO_REINSTATE_TAG_SERVICE_ACCOUNTS): a 1ª é condição futura não medida no bridge; a 2ª corrige a matriz. A versão 0.3.303 do SDK do bridge vem do relato da tarefa #3 desta sessão, não remedida por este escritor.

      Selado por /meta:decide em 2026-11-06: escolhida «A + ponte B»; descartadas: «Só A» · «B-hospedado (Claude Tag)» · «Pesquisar mais antes».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-06: «Runtime da persona de serviço: qual o maestro sela, com a recomendação de A como núcleo (bot próprio no Agent SDK no bridge, kg_mcp local, app Slack interno) e o Claude Tag só como ponte, sob 7 condições?»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-06"
      locality: "pessoa"
