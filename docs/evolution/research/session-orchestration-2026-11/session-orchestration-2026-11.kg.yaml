    trace: "docs/evolution/research/session-orchestration-2026-11/data/psi-vs-load.py"
    narrative: "Alvo: intervalo seguinte com 40% ou mais do tempo com tarefa esperando CPU (15 de 877). Pegam: load 15 → 6 (7 alarmes falsos); load 12 → 13 (19); psi 30 → 13 (22); load 15 OU psi 30 → 13 (22); load 12 OU psi 30 → 14 (27). Com o alvo de 30% (34 casos): load 12 → 22 (10), psi 30 → 25 (10), load 15 OU psi 30 → 25 (10). O dogfood do lease confirmou o atraso do load: com 6 giradores encerrados, o PSI caiu de 64% para 19% no mesmo instante em que o load ainda estava em 11,25. Memória não é o limite hoje: 25 GB disponíveis de 32, PSI de memória 0 (free e ⟨pressão de memória do kernel⟩, 2026-11-06 03:00 UTC). Teto do instrumento: amostra de 10 em 10 min, o pico curto entre duas amostras não aparece."
    provenance:
