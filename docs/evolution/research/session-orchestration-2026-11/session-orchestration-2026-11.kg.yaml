      proveniência anterior: source «docs/evolution/research/session-orchestration-2026-11/data/psi-vs-load.py» · locator «saída do script sobre psi-vs-load-2026-11-06.tsv» · method «derivado: proposta do core a partir de E_SO_PSI_CONTRA_LOAD_1106, 2026-11-06» · locality «repo»
