    label: "Mercado (2026-11-10): ociosidade é heartbeat com prazo julgado pelo supervisor; pergunta ao humano é chave do produtor com no máximo uma aberta e ack com prazo que escala; carga entre sessões é flock mais teto do SO e admissão por carga, sem limite pronto entre sessões."
    narrative: "Ociosidade: Temporal (heartbeat timeout), SQS e Celery (visibility timeout), Airflow (task heartbeat), k8s (liveness), systemd (WatchdogSec). No Claude Code, o Notification/idle_prompt não dispara com agente de fundo vivo; o Stop traz background_tasks, e há SubagentStop e TeammateIdle. Pergunta: dedup_key do PagerDuty, alias do Opsgenie, Workflow Id do Temporal; escalation policy com timeout de ack de 30 min por padrão; ack não é resolução. Carga: flock(1) do kernel, solto na morte do processo; parallel --load; slots do Temporal; cgroup v2 e systemd (CPUQuota, MemoryHigh); trava de eficiência dispensa fencing token (Kleppmann). Lacunas declaradas na colheita: orquestradores de agente de terceiros, timeout de interrupt no LangGraph, o contraponto de antirez e o fim de suporte do Opsgenie."
