    verified_against: "bancada: load_lease (o, p, q, r: N vagas e donos; s: psi; t: modo sem execução; l, m, n: porta), maestro_ask (a a g) e batuta_census (a a f), cada caso reprovando contra o mutante; dogfood no repo real (censo com 78 linhas, reserva alheia virando outro-dono numa linha seal real, mutante direto sob a vaga e com a vaga alheia rc 4)"
    label: "A batuta v1 é mecanismo: o passo pesado chamado direto passa por uma das N vagas da máquina, com N derivado da carga, o censo do /meta:decide diz PARADO por idade e lista sinal sem ack, e cada pergunta ao maestro tem uma sessão dona por chave."
    narrative: "Três peças. (1) A porta de admissão load_lease_reexec em ops/load-lease.sh: a bancada e ops/mutate-and-restore.sh chamados direto se re-executam sob run, e o pr-finalize pega uma vaga sempre. As vagas são N, com N = piso((RESUME − load1) / 2) entre 1 e 4, medido a cada tentativa, e N limita os DONOS (contados sob a trava de admissão); na régua (load ≥ 15 ou psi ≥ 30) nenhum novo entra, e psi ilegível é não medido. O modo sem execução da bancada não espera vaga. A revisão independente de 2026-11-10 (REJECTED no a19e127) pegou o N limitando o índice e a bancada --list esperando vaga; os dois viraram casos com mutante. A 1ª versão tinha vaga única, e a medida das 13:35 UTC de 2026-11-10 (4 na fila com load 3,5 em 8 CPUs) a derrubou. (2) .claude/validation/decide-census.sh: idade da última atividade em thread e merge, PARADO a partir de --idle-hours (4 h), mais as linhas signal (campainha sem ack) e ask (reservas). (3) .claude/utils/orchestration/maestro-ask.sh: chave <repo>#<ID>, uma dona identificada pelo id da SESSÃO (não pelo nome), prazo de 24 h, o vencido assumido só com --takeover e registrado. Doutrina em .claude/commands/common/prompts/baton-doctrine.md. Fora da v1, por postura: cgroup e timer do systemd (decisão do maestro), despacho entre sessões (degrau 3) e painel. Refutação: uma semana em que as N vagas deixem a carga passar da régua por admissão (load ≥ 15 em mais de 1 de cada 10 entradas, medido pelo holder) sobe ONION_LOAD_SLOT_CPUS; uma em que a fila passe de 10 min com load abaixo de 8 o baixa."
