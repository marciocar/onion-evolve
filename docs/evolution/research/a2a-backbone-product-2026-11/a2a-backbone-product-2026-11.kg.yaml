    narrative: |-
      Opções: C_OPCAO_BUILD_PRODUCT_SERVICE, C_OPCAO_INTERNAL_ONLY, C_OPCAO_ADOPT_STITCH,
      C_OPCAO_DO_NOTHING.

      RECOMENDAÇÃO DO ELENXO (afirmação de UM agente, sem votação; íntegra, sem corte): REPROVO a opção
      "construir o backbone como produto+serviço definitivo, agora". Recomendo ao maestro a opção
      combinada ADOTAR/COSTURAR + SÓ USO INTERNO: adotar A2A 1.0 (LF), MCP, CloudEvents+NATS, OTel,
      W3C PROV e OAuth2.1/OIDC+Agent Card JWS como protocolo e identidade (não reinventar nenhum deles),
      e construir SOMENTE a camada estreita de GOVERNANÇA DE GRAFO como peça INTERNA primeiro (dogfood),
      parqueando a decisão produto+serviço até que as objeções que bloqueiam sejam fechadas. Isto segue
      o que o próprio corpus já selou (backbone-piece-shape-2026-11: forma A, repo próprio vendorizado,
      open-core indeciso, 2 objeções que bloqueiam em aberto) e a doutrina no-external-service-dependency.

      CONSTRAINS (objeções que BLOQUEIAM e precisam ser fechadas ANTES de qualquer passo de produto+serviço):
      1. Fosso falso na entrada (achados 8/9): Archestra já entrega self-host+MCP/A2A+governança em
         open-core, financiado (US$13,5M) e deployado (3 Fortune-50); o corpus tem 0 nós sobre ele.
         Fechar: medir Onion x Archestra lado a lado e ancorar no grafo.
      2. Posicionamento já tem dono financiado (achados 15/16): BAND é agente-neutro servindo Claude
         Code e Codex, e a premissa "BAND é SaaS fechado" (o wedge aberto-vs-fechado) é NÃO PROVADA.
         Fechar: medir o modelo de negócio real da BAND antes de vender "aberto" como diferencial.
      3. Neutralidade não é diferencial (achados 3/4/5/6/10): o protocolo neutro já é commons da LF com
         150+ orgs; o moat só pode ser governança-de-grafo + self-host soberano, que é ESTRUTURAL e
         NÃO-VERIFICADO até a fase 1 estar no ar.
      4. Demanda paga não provada e imatura (achado 7): 13% entendem IA soberana; as 4 primárias de
         demanda paga (arthur.ai, mintmcp, cio, kiteworks) ficaram NÃO LIDAS. Fechar: ler e ancorar
         antes de assumir receita.
      5. Modo SERVIÇO tem cold-start e custo de conformidade não medidos (SOC2 Type 2 e synadia/jepsen-NATS
         cortados por orçamento): nenhum serviço vendável a regulado antes de 3-12 meses de observação, e
         o risco de consistência do NATS (transporte) não foi lido. O modo PRODUTO self-host deixa o SOC2
         com o adotante, por isso é o caminho mais barato e menos arriscado para começar.
      6. Substrato expande coordenação nativa (achados 1/2 + CC 2.1.323): a fatia intra-Claude é cada vez
         mais gratis; o valor restante do backbone é só a fatia cross-vendor, ainda não dimensionada.

      Em suma: NÃO assumir como produto+serviço definitivo agora; adotar o padrão, construir só a
      governança-de-grafo como peça interna em dogfood, e reabrir a decisão de produto+serviço quando
      (1) o diferencial for medido entregando valor, (2) Archestra/BAND estiverem ancorados no corpus, e
      (3) a demanda paga for lida nas primárias. Este escritor NÃO sela: o maestro sela pelo /meta:decide.
