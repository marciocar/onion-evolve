    narrative: "Executa a decisão D_CANAL_UPSTREAM_POR_VENDOR (selada em 2026-10-20). A prova pedida era por URL do remote, e a medição a derrubou duas vezes: o kg_vendor.py grava tag, commit e os sha256, nenhuma URL; e a release vendorizada vem do espelho público, cujo commit (172c62a) não existe no repo do dono, onde a tag kg-ssot-v4.12.0 resolve para 2a69199 e o origin é marciocar/onion-kg-ssot. URL ou commit recusariam o dono real. Os 444 sha256 do carimbo batem com a árvore da tag do dono, 444 de 444, e um par que só vendoriza o mesmo produto não tem a tag. O destino precisa ter docs/evolution/inbox/, e o sinal entregue leva rodapé determinístico com o remetente, o carimbo e a tag. Entrega real só numa cópia descartável do onion-kg-ssot (untracked, re-entrega no-op)."
