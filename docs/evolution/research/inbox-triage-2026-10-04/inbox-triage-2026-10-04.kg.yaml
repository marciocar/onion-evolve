    verified_at: '2026-10-05'
    verified_against: 'familias durable_commit (g, g2, g3, h) e vendor_branch (e2, e3) verdes sob LC_ALL=C; mutantes mordem (sem a lista, sem -f, sem a pos-condicao, baselines na lista, os tres return 12 como no-op, sem literal-pathspecs, sem quotePath=false); o Elenxo rodou a cura em clones dos 21 adotantes com onion/vendor: zero rc=12, e num clone do onion-adopt-granaa-ai o main perdia 59 arquivos que a cura entrega'
    trace: '.claude/utils/adopt/vendor-branch.sh'
    label: 'A CURA: o vendor-branch update monta a lista EXATA do que transportou (o proprio git archive | tar -t, que ja respeita os :(exclude)), menos os baselines de catraca que ele remove de proposito, e a passa ao durable-commit por ONION_REQUIRED_LIST. O durable-commit staja SO essa lista com -f e confere depois; faltou algum, exit 3 nomeando. O vendor-branch confere de novo na arvore COMMITADA e, faltando, devolve rc=12 SEM mergear. O -f nao vai no .claude inteiro porque ali ha o que e ignorado de proposito (sessions, worktrees, settings.local.json). A semeadura com o .gitignore convergido (3o pedido do hub) deixou de importar: a cura vale para qualquer .gitignore. O ELENXO REPROVOU A 1a VERSAO: a lista saia do tar -t, que escapa nome acentuado sob LC_ALL=C — o 1o arquivo acentuado do core derrubaria o update de TODO adotante com rc=12 falso — e o rc=12 nao tinha caso. Curado: a lista sai de um indice temporario do mesmo sha (ls-files -z, que aplica o :(exclude)), staging por NUL com --literal-pathspecs, ausente nomeado antes do add; e um caso que faz o commit duravel falhar de verdade (filtro obrigatorio quebrado) e exige rc=12 com a integracao intacta. A mesma classe estava LATENTE na checagem de base cruzada (diff --name-only com quotePath) e foi curada junto.'

