    narrative: "FONTES: lidas (11): a2a-spec, mcp-spec, cloudevents-standard-webhooks, claude-code-channels-hooks, slsa, openssf-scorecard, nist-ai-rmf, dora, aaif-projects, w3c-prov-shacl, okf-spec. Inalcançáveis (1): iso-42001. CLAIMS: 46 ancoradas e viraram nó; 18 REJEITADAS na ancoragem, que nunca viram nó (15 EXAGERADA, 2 AFIRMADA-SEM-CITACAO, 1 NAO-ENCONTRADA). ELENXO: 46 objeções, uma por claim; 32 sobreviventes modeladas como E_OBJECAO (13 bloqueiam, 19 limitam); 14 não sobreviveram e a evidência delas está na narrativa do alvo. Objeções RECUSADAS pelo motor (sobreviveram sem critério pré-registrado ou sem superação): 0, nenhum alvo não-julgado por recusa. SUPERAÇÕES: 19 nós C_SUPERACAO_20261108 (16 das rejeitadas, com TRACES_TO para este nó; 3 das objeções 15, 18 e 38, para o E_OBJECAO respectivo). As duas rejeitadas da AAIF não têm superação. LACUNAS FECHADAS (4): cloudevents-standard-webhooks: claims 9-12 fecham a norma; o vigia só verifica, e está em PR aberto (#8) · mcp-spec: claims 6 e 8 fecham autorização e o Q de prompts/list; resources não se aplicam, pois os dois servidores declaram só tools · claude-code-channels-hooks: exit 2, onFailure, permissões e channels (claim 15 precisa da exceção de onFailure) · w3c-prov-shacl: norma fechada, com a correção de que o exportador PROV-O já existe. LACUNAS QUE CONTINUAM ABERTAS (9): a2a-spec: nenhuma claim sobre o envelope; push foi rejeitado; o card da casa é 0.3.0 e declara oauth2 cujos endpoints dão 404 · claude-code-channels-hooks (parte sandbox): claim rejeitada; a casa tem sandbox None e 0 deny · slsa: sem claim de nível por artefato nem da trilha Source; medido fora das claims: kg-ssot atestado, portas sem atestação, vendor sem verificar · openssf-scorecard: SAST rejeitado e scorecard não rodado; medido fora das claims: sem bloqueio de force push, 12 ações sem pin, sem CodeQL · nist-ai-rmf: só o texto do padrão, zero comparação com as peças da casa · iso-42001: inalcançável; iso.org devolve 403 com des