ó sobre deploy que falha e exige intervenção imediata (Failed deployment recovery time, que substitui o MTTR genérico). VEREDITO EXAGERADA: A citação existe verbatim e sustenta a primeira metade (recuperação de deploy que falha e exige intervenção imediata). Mas 'substitui o MTTR genérico' não está no texto: a página só diz 'changes like the move from MTTR to Failed Deployment Recovery Time' e remete a um artigo de histórico; não afirma 'substitui' nem classifica o MTTR como 'genérico' (A2_CLAIM_ESTICA). (14) [aaif-projects] A AAIF hospeda 10 projetos em aaif.io/projects; sobrepõem-se ao Onion: MCP, A2A, Agent Skills, AGENTS.md, Goose, agentgateway, OpenSandbox. VEREDITO AFIRMADA-SEM-CITACAO: REBAIXADA pelo motor: veredito ANCORADA sem quote/locator — declaração não é citação. A frase de abertura aparece em aaif.io/projects/. A página lista exatamente 10 projetos: Agent Router, Agent Skills, A2A, AGENTS.md, agentgateway, Goose, MCP, Open Responses, OpenEnv e OpenSandbox. Os 7 citados estão na lista. A sobreposição com o Onion é a leitura do leitor, e o texto não a contradiz. (15) [aaif-projects] AGENTS.md é formato aberto de guia para agentes de código; ponto de comparação com o CLAUDE.md do core. VEREDITO AFIRMADA-SEM-CITACAO: REBAIXADA pelo motor: veredito ANCORADA sem quote/locator — declaração não é citação. A página traz 'AGENTS.md is a simple, open format for guiding coding agents.' com repo github.com/agentsmd/agents.md. A menção ao CLAUDE.md é contexto do leitor, não atribuída ao texto. (16) [okf-spec] Os tipos são livres e não há registro central, então nomes de tipo e ids do OKF não são governados. VEREDITO EXAGERADA: A quote existe (SPEC.md l.182) e sustenta só os valores de `type`: produtores SHOULD escolher valores descritivos, consumidores MUST tolerar tipos desconhecidos. A extensão a 'ids do OKF' não é sustentada: o Concept ID é o caminho do arquivo no bundle (l.79) e `sources[].id` é chave estável por entrada, usada pelas notas de rodapé (l.309, 351