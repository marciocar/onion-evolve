  - id: Q_OUTSIDE_IN_PRIMARIES_1108
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.9
    label: "Comparadas às primárias, onde as escolhas do core, do kg-ssot e do onion-messaging estão ALINHADAS, DIVERGEM por decisão ou estão ATRÁS? Leitura interna; o dissect de fora virá depois, sem ler este grafo."
    narrative: "Comparadas às fontes primárias, onde as escolhas dos três produtos do ecossistema Onion (o core: hooks determinísticos, permissões, procedência e governança; o kg-ssot: contrato de grafo .kg.yaml, procedência e nomes; o onion-messaging: fila assinada A2A, campainha e vigia de webhooks) estão ALINHADAS ao padrão, DIVERGEM por decisão, ou estão ATRÁS? Cada claim ancorada deve permitir um veredito por escolha, e cada 'atrás' deve poder virar item com dono. Esta rodada é a leitura interna: o dissect de fora da curadoria virá depois, sem ler este grafo."
    trace: "pergunta original do run /onion-research em modo primárias, 2026-11-08"
  - id: E_A2A_AGENT_CARD_IS_SERVER_MANIFEST
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-11-08"
    verified_against: "'A JSON metadata document published by an A2A Server, describing its identity' · A2A v1.0.0 §2.2 Core Concepts (definição de Agent Card, spec l.139 no tag v1.0.0); ordenação em §8.3.1/§8.3.2 (l.1965 e ss.); objeto em §4.4.1 · ancorada por verificador independente"
    valid_from: "2026-03-12"
    source_tier: 9
    source_kind: primary
    label: "O Agent Card do A2A é o manifesto JSON publicado pelo servidor A2A que descreve a identidade do agente, com lista ordenada de interfaces."
    narrative: "Claim 1 como ancorada [a2a-spec]: O Agent Card é o manifesto publicado pelo servidor que descreve a identidade do agente, com lista ordenada de interfaces; a identidade é do agente/servidor, não de um membro com kid. Elenxo (alvo 1): a objeção sobreviveu, triagem bloqueia; ver E_OBJECAO_A2A_CARD_STILL_0_3_0. Correção do escritor pela objeção: 'não de um membro com kid' sai do rótulo, porque a citação não diz isso (leitura do leitor). O leitor não declarou tier nesta claim; 9 é o tier que ele declarou para outra claim do mesmo documento."
    trace: "https://raw.githubusercontent.com/a2aproject/A2A/v1.0.0/docs/specification.md"
    provenance:
      source: "https://raw.githubusercontent.com/a2aproject/A2A/v1.0.0/docs/specification.md"
      locator: "A2A v1.0.0 §2.2 Core Concepts (definição de Agent Card, spec l.139 no tag v1.0.0); ordenação em §8.3.1/§8.3.2 (l.1965 e ss.); objeto em §4.4.1"
      method: "reading: citação verbatim conferida na fonte, ancorada por verificador independente"
