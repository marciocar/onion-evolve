 é o agente (o chamador do webhook), não uma imposição ao protocolo. 'Manda' lê como MUST. Autenticação por AuthenticationInfo e não por JWKS local por membro: sustentado, [texto do motor cortado aqui; não completado de memória] (3) [mcp-spec] A revisão 2026-07-28 removeu sessões de protocolo e o stream GET do Streamable HTTP; notificações de mudança de lista passam a vir só por subscriptions/listen. Servidor que empurra sinal por canal próprio (campainha/doorbell) fica fora do padrão de transporte, e deve ser julgado como divergência por decisão ou atraso. VEREDITO EXAGERADA: A citação existe (com quebra de linha no meio). A primeira metade do claim é sustentada: a lista traz 'Removal of the GET stream endpoint' e 'Removal of protocol-level sessions', e 'Earlier Streamable HTTP Revisions' diz que sessão, GET e Last-Event-ID 'are not part of this revision'. As mudanças de lista e de recurso vêm numa requisição subscriptions/listen. A segunda metade não vem do texto. A página trata só do binding Streamable HTTP. Não diz nada sobre sinal por canal próprio, e a campainha não aparece. A página irmã basic/transports diz que clientes e servidores 'MAY implement additional [texto do motor cortado aqui; não completado de memória] (4) [mcp-spec] Servidores HTTP devem validar Origin (DNS rebinding), ligar só a localhost quando locais e autenticar todas as conexões. VEREDITO EXAGERADA: A citação está verbatim e cobre só o item 1, que é MUST (com 403 quando o Origin presente é inválido). O claim junta os itens 1-3 num mesmo 'devem'. O item 2 é 'SHOULD bind only to localhost (127.0.0.1) rather than all network interfaces (0.0.0.0)'. O item 3 é 'SHOULD implement proper authentication for all connections'. Isso importa para o julgamento por escolha: faltar o Origin é descumprir um MUST, e faltar bind em localhost ou autenticação é desvio de SHOULD. O claim apaga essa diferença. (5) [cloudevents-standard-webhooks] webhook-id deve servir de chave de idempotência no consumidor; o produtor reenvia até sucesso, com backoff exponencial por vários dias. VEREDITO EXAGERADA: A citação existe (sw.md l.234) e sustenta só a metade da idempotência. A metade do reenvio estica o texto (A2_CLAIM_ESTICA). Em 'Deliverability and reliability' (l.252) o produtor reenvia 'until a successful attempt or until it's determined that delivery may not be possible', não incondicionalmente até sucesso. A l.254 diz 'It's recommended to retry ... spanning multiple days, with an exponential backoff', ou seja, é recomendação, não exigência. A l.256 ainda recomenda desativar o endpoint depois de falha prolongada. (6) [cloudevents-standard-webhooks] No CloudEvents, source deve ser URI-reference não vazia e time, se presente, segue RFC 3339; envelope próprio sem esses campos não é CloudEvents. VEREDITO EXAGERADA: A citação existe (ce.md l.284) e vale para source, e time segue RFC 3339 'If present' (l.428). O fecho estica o texto (A2_CLAIM_ESTICA): time é OPTIONAL (ce.md l.427), então a falta de time não tira a conformidade. O que o texto sustenta é que faltar atributo REQUIRED (id, source, specversion, type) não é CloudEvent válido. (7) [claude-code-channels-hooks] The sandbox is the only OS-enforced boundary and covers shell commands only; hooks, MCP servers and file tools run outside it with full access; the escape hatch is closed only by managed settings. VEREDITO EXAGERADA: A citação existe verbatim, mas o claim estica em três pontos. (1) 'the only OS-enforced boundary': a página nunca diz 'only' e aponta contêiner/VM/sandbox runtime como outras fronteiras. (2) 'file tools ... with full access': a página diz 'full access' só para hooks e MCP locais; para as ferramentas de arquivo diz 'follow permission rules instead'. (3) 'closed only by managed settings': allowUnsandboxedCommands:false é configurável em sandbox settings em geral; managed settings é o caminho para exigir para todos, não o único. Também omite que o prompt '!' do usuário roda fora do sandbox. (8) [slsa] nível 2 exige autenticidade verificável da procedência (assinatura por chave só da plataforma), gerada pelo plano de controle e não pelo tenant; selo escrito pelo próprio script de publicação não cumpre. VEREDITO EXAGERADA: A citação existe, mas é um SHOULD, e o claim a apresenta como exigência entre parênteses. O que é MUST: 'Consumers MUST be able to validate the authenticity of the provenance attestation', 'The provenance MUST be generated by the control plane', 'The data in the provenance MUST be obtained from the build platform' e 'The build platform MUST have some security control to prevent tenants from tampering with the provenance'. A assinatura por chave exclusiva da plataforma é a via recomendada, não obrigatória. A conclusão sobre o selo do script de publicação é inferência do leitor: o texto não a ci [texto do motor cortado aqui; não completado de memória] (9) [slsa] O produtor deve distribuir a procedência aos consumidores, direto ou via ecossistema de pacotes. O vendor do kg-ssot e as portas precisam publicar a procedência junto do artefato. VEREDITO EXAGERADA: A primeira frase do claim está sustentada: a citação é literal e é seguida de 'MAY delegate this responsibility to the package ecosystem'. A segunda frase vai além. O texto exige distribuição da procedência aos consumidores, não publicação 'junto do artefato'. O enquadramento do vendor do kg-ssot e das portas como produtores sujeitos à regra é aplicação do leitor, não texto da spec. (10) [openssf-scorecard] SAST é detectado pela presença de apps conhecidos como CodeQL ou SonarCloud; sem eles o check não pontua, independentemente dos gates próprios do Onion (lint/selftest). VEREDITO EXAGERADA: A citação existe (quebrada em duas linhas, 1 ocorrência normalizada) e sustenta a primeira metade. O trecho completo diz que o check procura os apps 'in the recent (~30) merged PRs, or the use of \"github/codeql-action\" in a GitHub workflow', então há uma segunda via de detecção, o uso da action em workflow. A