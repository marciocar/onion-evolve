  - id: E_A2A_CARD_SIGNATURE_OPTIONAL_JWS
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.9
    verified_at: "2026-11-08"
    verified_against: "'Agent Cards MAY be digitally signed using JSON Web Signature (JWS) as defined in RFC 7515' · A2A v1.0.0 §8.4 (l.1979), §8.4.2 (jku, kid), §8.4.3 Security Considerations; AgentCardSignature em §4.4.7 · ancorada por verificador independente"
    valid_from: "2026-03-12"
    source_tier: 9
    source_kind: primary
    label: "A assinatura do Agent Card é opcional (MAY) via JWS (RFC 7515), com JWKS apontado por URL; o cliente deveria (SHOULD) verificar ao menos uma; chaves expiradas ou revogadas não podem verificar."
    narrative: "Claim 2 como ancorada [a2a-spec]: A assinatura do Agent Card é opcional (MAY) via JWS (RFC 7515), com JWKS apontado por URL; o cliente deveria (SHOULD) verificar ao menos uma; chaves expiradas/revogadas não podem verificar; análogo de kid+JWKS aplicado ao card, não a cada mensagem. Elenxo (alvo 2): a objeção NÃO sobreviveu. Sustenta o veredito 'diverge por decisão' quando somada ao que já existe: o card não tem signatures (MAY, então não descumpre) e a assinatura por mensagem é perfil Onion, declarada em D_MESSAGING_STACK_2026_11 ('o A2A 1.0 só assina o Agent Card') e em E_OBJECAO_F7_MESSAGE_SIGNATURE_IS_ONION_PROFILE. Os kid pinados são arquivos locais (.claude/utils/federation-transport/jwks/README.md), não jku."
    trace: "https://raw.githubusercontent.com/a2aproject/A2A/v1.0.0/docs/specification.md"
    provenance:
      source: "https://raw.githubusercontent.com/a2aproject/A2A/v1.0.0/docs/specification.md"
      locator: "A2A v1.0.0 §8.4 (l.1979), §8.4.2 (jku, kid), §8.4.3 Security Considerations; AgentCardSignature em §4.4.7"
      method: "reading: citação verbatim conferida na fonte, ancorada por verificador independente"
      locality: "web"
