# kg-backlog-guard: on
# Grafo da rodada de primárias outside-in (/onion-research, leitura interna, 2026-11-08).
# Compara as escolhas do core, do kg-ssot e do onion-messaging às fontes primárias. Este grafo nunca sela;
# as ligações com o corpus vão em external_edges (contrato v4.3), sem editar os grafos antigos.
meta:
  id: outside-in-primaries-2026-11
  schema_version: "1"
  baseline: "2026-11-08"
  review_after: "2026-12-08"   # 30d: o tipo DOMINANTE é FERRAMENTA. O que move os vereditos são a doc do Claude Code,
                               # a revisão do MCP, a release do A2A, o PR #8 do vigia e o pin do kg-ssot. As normas
                               # estáveis (NIST, W3C, SLSA) valeriam 12 meses, mas não movem a revisita.
  # ═══ TETO: 108 NÓS ═══
  # Justificativa do teto: rodada de primárias executada em 2026-11-08, grafo novo. 101 nós: 46 evidências ancoradas
  # (1 por claim), 32 objeções sobreviventes do Elenxo (1 por alvo), 19 superações achadas (16 das rejeitadas na
  # ancoragem e 3 do Elenxo), 1 contabilidade (E_LACUNAS_OUTSIDE_IN_1108), 1 pergunta raiz, 1 pergunta de revisão de
  # escopo (Q_SANDBOX_DENY_LAYER_DECISION_1108) e 1 claim com a recomendação íntegra do Elenxo. As 18 claims rejeitadas
  # não viram nó: entram na contabilidade.
  # +7 no fechamento da rodada (2026-11-08): um nó question por item ATRÁS que continuou real depois de remedido, com
  # dono, prazo e critério de pronto. Teto subiu de 101 para 108 só por esses 7.
  purpose: "Permitir um veredito por escolha (alinhado, diverge por decisão, atrás) para os três produtos do ecossistema Onion contra as fontes primárias, com cada atrás podendo virar item com dono. É a leitura interna; o dissect de fora da curadoria virá depois, sem ler este grafo."
