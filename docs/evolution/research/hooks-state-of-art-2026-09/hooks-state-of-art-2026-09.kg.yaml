    label: 'MERCADO (secao obrigatoria da doutrina de pesquisa). O ecossistema de hooks em 2026 se organiza em DUAS camadas, e nenhuma e a do Onion. (1) ENCANAMENTO: SDKs para escrever hook em linguagem tipada em vez de shell cru — cchooks Python (~123 estrelas), cchooks Go, cc-hooks-ts e claude-hook TypeScript, claude-hooks-sdk PHP (~62). (2) COLECOES pequenas e utilitarias — karanb192/claude-code-hooks (~298 estrelas, 10 hooks: cost-tracker, rate-limiter, branch-guard) distribuida COMO MARKETPLACE INSTALAVEL; disler/claude-code-hooks-mastery; awesome-claude-code-hooks. LEITURA PARA O ONION: ninguem publica METODO com hooks como braco de execucao — as 87 REGRAs do Onion sao outra categoria. Mas o concorrente de 10 hooks JA DISTRIBUI pelo canal que o Onion subaproveita (E_MOAT_NAO_VIAJA_PELO_CANAL_DE_INSTALACAO). Ha tambem sinal ACADEMICO de que a fronteira pode descer do harness para o SO (arXiv ActPlane, policy enforcement em nivel de SO para harnesses de agente) — nao lido nesta rodada, LACUNA.'
    trace: 'https://github.com/karanb192/claude-code-hooks'

  - id: E_FAIL_OPEN_E_O_MODO_DE_FALHA_DOMINANTE
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.8
    verified_at: 2026-09-21
    verified_against: 'busca web 2026-09-21, multiplos relatos independentes (DEV Community e issues de terceiros) convergindo no mesmo mecanismo; o contrato de exit code foi cruzado com o catalogo verbatim do ELF 2.1.278'
    valid_from: '2026'
    source_tier: 5
    source_kind: community
    label: 'O MODO DE FALHA DOMINANTE dos hooks no campo e FAIL-OPEN, e ele e SILENCIOSO: hook que estoura por bug ou entrada ruim nao imprime nada e sai 0, o que o Claude Code le como "sem objecao" e deixa a acao passar. E exit 1 NAO bloqueia — e tratado como erro nao-bloqueante e a acao prossegue; so exit 2 barra. Relatos convergentes acrescentam: PermissionRequest NAO dispara em modo nao-interativo (-p headless); no Windows um PreToolUse pode nunca ser spawnado e o Claude Code reporta como erro nao-bloqueante que quase ninguem nota. Corrobora, de fora, o que o corpus ja tinha por dentro (E_FRAGILIDADE_HERDADA_DA_PLATAFORMA, issue 87145).'

  - id: E_O_VETO_DA_CASA_FALHA_ABERTO_SE_O_PYTHON_SUMIR
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: 2026-09-21
    verified_against: '.claude/hooks/pretooluse-protect-main.sh linhas 6 e 9, lidas apos o achado externo; e varredura dos 6 hooks com exit 2 — nenhum tem trap de erro, todos tem entre 4 e 5 portas de exit 0'
    label: 'O DEFEITO ACIONAVEL desta rodada, achado so pelo CRUZAMENTO externo->interno. pretooluse-protect-main.sh e o unico veto incondicional da casa (nega force-push para main, E_VETO_UNICO_ANTES_DA_RODADA). Ele extrai o comando via python3 na linha 6; se o python3 sumir, ou se o formato do JSON de entrada mudar, cmd vem VAZIO e a linha 9 ([ -z "$cmd" ] && exit 0) deixa o force-push PASSAR. Nenhum dos 6 hooks com exit 2 tem trap de erro, e cada um tem de 4 a 5 portas de exit 0 — portanto nao ha como distinguir "deliberadamente nao se aplica" de "a guarda quebrou". Isto NAO diz que exit 0 esta errado (a maioria das portas e legitima); diz que falta a guarda-da-guarda. CURA CANDIDATA: trap ERR que emite systemMessage e sai 2 nos hooks de VETO, e uma sonda de auto-teste que quebre o python de proposito e exija o bloqueio.'
    trace: '.claude/hooks/pretooluse-protect-main.sh'

  - id: E_EXTERNO_CONFIRMA_O_EXIT2_SOB_BYPASS
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 4
    confidence: 0.75
    verified_at: 2026-09-21
    verified_against: 'busca web 2026-09-21; afirmacao de terceiro (nao da Anthropic) — NAO exercitada nesta maquina'
    valid_from: '2026'
    source_tier: 5
    source_kind: community
    label: 'CORROBORACAO EXTERNA da tese do CLAUDE.md: hooks PreToolUse disparam ANTES de qualquer checagem de modo de permissao, de modo que um hook devolvendo permissionDecision deny barra a ferramenta inclusive em bypassPermissions e sob --dangerously-skip-permissions. E a capacidade que o CLAUDE.md nomeia como compradora do acoplamento, agora vista de fora e nao so declarada por dentro. CONTRAPESO da mesma fonte, que a casa deve absorver em vez de descartar: a recomendacao de campo e que hooks sejam automacao LOCAL rapida, com CI, protecao de branch e controles de infraestrutura permanecendo a camada AUTORITATIVA de enforcement — o que apoia a leitura de que o fosso do Onion e o shell agnostico (que roda em CI), nao o gatilho.'

  - id: E_CUSTO_DE_LATENCIA_DE_HOOK
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 3
    confidence: 0.6
    verified_at: 2026-09-21
    verified_against: 'busca web 2026-09-21, relato unico de terceiro em issue de projeto alheio — numero NAO reproduzido aqui, tratar como ordem de grandeza e nao como medida'
    valid_from: '2026'
    source_tier: 4
    source_kind: community
    label: 'CUSTO A MEDIR, nao a assumir: um relato de campo mede 18,2s por interacao com hooks ligados contra 4,8s sem, e outro registra timeouts duros de 30s. O core do Onion dispara 4 hooks em SessionStart e 4 em UserPromptSubmit, todos com timeout 5. NUNCA foi cronometrado o custo agregado por turno — e a casa ja tem precedente de declaracao de tempo errada por ordem de grandeza (onion-refinaria-2026-08/E_gate_declara_1min_e_leva_15: o pre-commit declarava ~1min e levou 921s). GATILHO: cronometrar a soma dos hooks por turno antes de adicionar qualquer evento novo.'

  - id: E_ERREI_RESUMO_EMBUTIDO_POR_CONTRATO
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-09-21
    verified_against: 'confronto do que eu li em ~525k do strings dump contra a referencia publica baixada por uma perna independente; a regiao lida tem cabecalho "## Hooks Configuration" e uma tabela "### Hook Events" com apenas 10 eventos'
    label: 'LICAO DE METODO desta rodada, registrada porque o erro e reincidivel. O binario carrega DUAS coisas diferentes e eu as tratei como uma so: (a) uma DOC DE AJUDA RESUMIDA (secao "Hooks Configuration", tabela com 10 eventos, exemplos simplificados) e (b) o eventCatalog interno (~557k), com descricao e semantica de exit code evento a evento para os 33. Li (a) e carimbei tier 10 primary — dai sairam as duas afirmacoes ERRADAS desta rodada: prompt e agent restritos a 3 eventos, e updatedInput so em PreToolUse. O catalogo (b) resistiu ao confronto: a lista de quem bloqueia no exit 2 bateu com a doc publica quase item a item. REGRA PRATICA: resumo embutido no binario e UI, nao contrato; so o eventCatalog e a referencia publica servem de fonte de contrato. E o corolario que mais importa: fonte primaria LOCAL nao vence fonte primaria PUBLICA por ser local — vence por ser a fonte CERTA.'

  - id: E_HOOKS_E_O_FEATURE_MENOS_ADOTADO
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.7
    verified_at: 2026-09-21
    verified_against: 'State of Claude Code 2026 (buildthisnow.com), amostra de 2.500 repos publicos sorteados de 8.298 com config Claude Code via GitHub code search API, snapshot de junho/2026; e ClaudePluginHub 2026-06-08 para o lado marketplace — terceiros com metodologia declarada, paginas NAO reabertas por mim'
    valid_from: '2026-06'
    source_tier: 6
    source_kind: community
    label: 'O NUMERO DE MERCADO QUE MAIS IMPORTA, e ele corta contra o entusiasmo: hooks e o feature MENOS adotado do Claude Code. Em 2.500 repos publicos — CLAUDE.md 84,9 por cento; diretorio .claude/ 62,1; qualquer power feature 53,9; Skills 28,1; slash commands 25,6; subagentes 24,6; .mcp.json 17,0; HOOKS 13,3 (sobe a cerca de 21 entre repos com .claude/ estruturado). No marketplace, 358.699 componentes indexados: skills 222.015 contra hooks 7.776 — hooks sao 2,2 por cento dos componentes e skills os superam cerca de 28 para 1 (caveat forte: conta ENTRADAS de hook, nao plugins-que-embarcam-hook). LEITURA DUPLA, e as duas pontas valem: (a) o Onion aposta no eixo mais RARO, o que e fosso de verdade se a aposta estiver certa, porque quase ninguem concorre ali; (b) e tambem o eixo de menor DEMANDA comprovada, entao vender hooks como diferencial para quem nao adota hooks e vender contra a corrente. Quem usa, usa muito (colecoes de 10, 26, 30, 95 hooks): publico pequeno e concentrado.'
    trace: 'https://www.buildthisnow.com/blog/real-examples/state-of-claude-code-2026'

  - id: E_FAIL_OPEN_CONFIRMADO_PELA_DOC_OFICIAL
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: 2026-09-21
    verified_against: 'referencia publica de hooks baixada em 2026-09-21 por perna independente; converge com os relatos de campo de E_FAIL_OPEN_E_O_MODO_DE_FALHA_DOMINANTE'
    valid_from: '2026-09'
    source_tier: 10
    source_kind: primary
    label: 'O fail-open deixa de ser folclore de comunidade e vira CONTRATO DECLARADO: script inexistente ou sem bit de execucao produz exit 127, que e erro NAO bloqueante, e a acao prossegue — um path errado no settings.json deixa o gate silenciosamente desligado. Timeout em PreToolUse tambem e fail-open (saida descartada, a call segue pelo fluxo normal de permissao): hook travado NAO e gate. JSON no nivel errado (permissionDecision ou additionalContext no topo, em vez de dentro de hookSpecificOutput) parseia, e IGNORADO e nao gera erro visivel — so aparece com --debug. E exit 1 NAO bloqueia. O UNICO ponto fail-CLOSED por default e subagente em background nao-interativo, onde a call e NEGADA se nenhum hook devolver decisao (mais PreModelSwitch e os eventos de worktree, que falham fechado em timeout). Isso CONFIRMA, de fonte primaria, o defeito medido em E_O_VETO_DA_CASA_FALHA_ABERTO_SE_O_PYTHON_SUMIR.'

  - id: E_REINJECAO_POS_COMPACTACAO_E_SESSIONSTART
    node_type: evidence
    plane: PROD
    status: confirmed
    impact: 3
    confidence: 0.8
    verified_at: 2026-09-21
    verified_against: 'referencia publica de hooks baixada em 2026-09-21 por perna independente'
    valid_from: '2026-09'
    source_tier: 10
    source_kind: primary
    label: 'CORRIGE PARCIALMENTE D_PRECOMPACT_DIRIGE_O_QUE_SOBREVIVE. A sobrevivencia de additionalContext a compactacao NAO e documentada, e o padrao OFICIAL de re-injecao e SessionStart com matcher `compact` (que dispara DEPOIS da compactacao) — nao PreCompact nem PostCompact, que nao injetam contexto. O que SOBREVIVE da oportunidade: PreCompact com exit 0 anexa o stdout como INSTRUCAO DE COMPACTACAO, o que dirige o que o resumo preserva, e isso e coisa diferente de injetar contexto depois. Desenho certo para o Onion, entao, sao as DUAS pernas: PreCompact emite a instrucao (o que preservar) e SessionStart com matcher compact re-injeta (o que recolocar). O core hoje nao faz nenhuma das duas — o worklog-precompact-breadcrumb.sh so grava migalha.'

