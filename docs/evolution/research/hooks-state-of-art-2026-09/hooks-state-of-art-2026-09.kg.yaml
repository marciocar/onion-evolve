    label: 'CORRIGIDO por confronto com a doc publica — a medicao inicial estava ERRADA. Existem CINCO tipos de handler, nao quatro: command, http, mcp_tool, prompt e agent; so `agent` e declarado experimental. Os handlers prompt e agent sao suportados em 13 eventos (PreToolUse, PostToolUse, PostToolUseFailure, PostToolBatch, PermissionRequest, PermissionDenied, Stop, SubagentStop, TaskCreated, TaskCompleted, TeammateIdle, UserPromptSubmit, UserPromptExpansion) e os exemplos canonicos da doc sao Stop com type prompt e Stop com type agent. A restricao a 3 eventos que eu media veio da DOC DE AJUDA RESUMIDA embutida no binario, nao do contrato — ver E_ERREI_RESUMO_EMBUTIDO_POR_CONTRATO. O que SOBREVIVE da medicao: prompt e agent NAO retornam additionalContext (schema so ok, reason, impossible), logo sao decisores puros — e a doc confirma. E o handler http existe com guarda de destino, verbatim do ELF: "HTTP hook blocked: (private/link-local address). Loopback (127.0.0.1, ::1) is allowed for local dev" — CONSISTENTE com o exemplo oficial de allowedHttpHookUrls que inclui http://localhost:*, nao contraditorio com ele.'
    trace: 'docs/evolution/research/hooks-state-of-art-2026-09/data/event-catalog-2.1.278.verbatim.txt'

