    valid_from: '2026-09'
    source_tier: 10
    source_kind: primary
    label: 'A capacidade e REAL e mais ampla do que eu media: reescrita de conteudo existe em PreToolUse (hookSpecificOutput.updatedInput), em PermissionRequest (dentro de decision.updatedInput — nivel diferente, por isso escapou do grep literal) e em PostToolUse (updatedToolOutput). Ha validacao de schema e fallback para o input original quando falha ("returned updatedInput that failed schema validation", "updatedInput is missing or empty, falling back to original tool input"). E uma classe que o Onion NAO exerce: os 6 hooks com exit 2 do core so sabem dizer NAO. Caso concreto medido nesta sessao: o bash-empty-result-guard.sh barrou um 2>/dev/null DEPOIS do comando rodar (PostToolUse); em PreToolUse poderia remover o silenciamento ANTES. DOIS RISCOS A DECLARAR: (1) reescrever comando em silencio e o oposto da doutrina da casa — so com systemMessage casado; (2) a doc avisa que hooks rodam em PARALELO e nao-deterministicamente, e com dois hooks mexendo no mesmo input o ULTIMO A TERMINAR VENCE.'

  - id: E_EXIT2_TEM_SEMANTICA_DIFERENTE_POR_EVENTO
    node_type: evidence
