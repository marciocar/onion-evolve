    valid_from: '2026-09'
    source_tier: 10
    source_kind: primary
    label: 'DISPUTADO — a afirmacao inicial (teto real de 8.000 refutando os 10.000 do corpus) NAO se sustenta e fica RETIRADA. A doc publica afirma 10.000 caracteres para additionalContext, systemMessage, initialUserMessage e stdout puro, medidos campo a campo, com o excedente gravado em arquivo na pasta da sessao e substituido por path mais preview de 2.000 chars, sem setting para levantar. O ELF 2.1.278 carrega, separadamente, uma tabela de constantes por campo (vdr: additionalContext 8000, systemMessage 4000, reason e stopReason e permissionDecisionReason 2000; Tdr: 200 linhas para additionalContext, 20 para o resto) consumida por kB() via u3n(), que em truncamento faz e.report.truncated.push(n) — o destino `report` sugere ESTAGIO DIFERENTE (relatorio ou telemetria) do da ENTREGA ao modelo. As duas leituras podem coexistir e EU NAO DETERMINEI qual governa o contexto que chega. Cai junto o corolario de que a forma de 8.092 bytes de E_plataforma_desqualifica estaria 92 bytes acima do teto. EXPERIMENTO QUE DECIDE, e e barato: hook descartavel emitindo additionalContext de 8.001 e de 10.001 chars, observando o que chega.'
    trace: 'docs/evolution/research/hooks-state-of-art-2026-09/data/output-caps-2.1.278.verbatim.txt'

