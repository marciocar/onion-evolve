  - id: Q_POLITICA_DE_ORG_PODE_DESLIGAR_O_GATE
    node_type: question
    plane: PROD
    status: open
    impact: 5
    confidence: 0.6
    verified_at: 2026-09-21
    verified_against: 'strings do ELF 2.1.278: allowManagedHooksOnly (26 ocorrencias), disabledByPolicy, managedOnly, pluginOnly, policyHookCount, managedHooksStillApply, allDisabled — presentes, mas o CONTRATO nao foi lido'
    label: 'RESPONDIDA, e a resposta e SIM — o risco e real e esta documentado. Duas chaves publicas de settings: disableAllHooks, que em escopo MANAGED desliga TUDO inclusive os proprios hooks managed (preservando so os do Agent SDK) e, fora de managed, desliga user, project, local e plugin; e allowManagedHooksOnly, escopo Managed, que deixa rodar so hooks managed mais Agent SDK mais plugins force-enabled por enabledPlugins, bloqueando user, project, local, demais plugins e hooks de frontmatter de agente. Ha ainda allowedHttpHookUrls, httpHookAllowedEnvVars e o --safe-mode que estreita para managed. CONSEQUENCIA PARA O ONION: o gate deterministico PODE ser desligado por politica de organizacao no adotante enterprise, e o Onion nao tem como perceber isso de dentro. NAO se deve vender o exit 2 como garantia em contexto corporativo sem checar a politica do cliente. NOTA DE METODO: os identificadores que eu achei no binario (disabledByPolicy, policyHookCount, managedHooksStillApply) NAO sao chaves publicas de configuracao — sao internos, e nao se constroi config sobre eles.'

