    valid_from: '2026-09'
    source_tier: 10
    source_kind: primary
    label: 'exit 2 NAO significa a mesma coisa em todo evento, e tratar como se significasse e modo de falha. PreToolUse: bloqueia a chamada e mostra stderr ao modelo. PostToolBatch: PARA O LOOP AGENTICO. UserPromptSubmit: bloqueia E APAGA o prompt original. ConfigChange: bloqueia a mudanca de config na sessao. TaskCreated e TaskCompleted: impede criar ou concluir a task. TeammateIdle: impede o idle. PreCompact: bloqueia a compactacao. Stop: mostra stderr ao modelo e CONTINUA a conversa. SubagentStop: mostra ao subagente e o mantem rodando. SessionStart, SessionEnd e Setup: exit 2 so mostra stderr ao usuario, NAO bloqueia nada.'
    trace: 'docs/evolution/research/hooks-state-of-art-2026-09/data/event-catalog-2.1.278.verbatim.txt'

