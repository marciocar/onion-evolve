    narrative: "A 1ª redação derivava o nome nu só do members.yaml e via 2 das 84 ocorrências do repo mais citado. Acusar todo palavra@sha traria ruído medido (grafo@, core@, develop@, número@), o que a cláusula 4 da doutrina recusa. Ficou: o registro, as URLs de dono julgado no corpus e 13 nomes medidos (privados ou que não resolvem), gravados como nome#<hash>. O hash curto se enumera e não esconde o nome; só evita gravá-lo em claro num arquivo público."
