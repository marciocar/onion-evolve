    verified_at: "2026-11-10"
    verified_against: "cabeçalho de private-repo-cite-check.sh"
    trace: ".claude/validation/private-repo-cite-check.sh"
    label: "teto: repo de terceiro que fechou, nome nu fora do registro, gist, GitLab, 'commit abc1234' em prosa, sha sem nome, grafo fora do diff, commit e corpo de PR; grafo renomeado tem as entradas contadas como novas"
    narrative: "A troca da ponta da origin/main pelo merge-base na catraca não tem mutante próprio: os cenários da bancada não distinguem as duas. E a lista pública só é tão certa quanto a última medida: o --verify-allowlist reconfere com rede e não roda no CI. Gatilho para reabrir: um repo da lista virar privado, ou uma citação nova numa dessas formas aparecer no corpus."
  - id: C_CLASSE_NAO_CONFERIVEL_SEM_LEITOR
    node_type: claim
    layer: audit
