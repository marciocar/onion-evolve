# kg-backlog-guard: on
# Forja de guarda (/meta:forge-guard): a REGRA 121 avisa quando um grafo novo ou tocado do core público cita repositório
# privado ou inalcançável, por URL ou por repo@sha. Este grafo guarda o defeito medido, o substrato, a decisão do
# vocabulário e os tetos. Nenhum nome de repositório privado aparece aqui: só contagens.
meta:
  id: guard-private-repo-cite-2026-11
  schema_version: "1"
  baseline: "2026-11-10"
  review_after: "2026-12-10"   # 30d: defeito de guarda
  # ═══ TETO: 10 NÓS ═══ (de 8 para 10 em 2026-11-12: o porte do --private-repos da kg-ssot 4.51.0 traz uma decisão e a evidência dela)
nodes:
  - id: Q_CORE_PUBLICO_SEM_CITACAO_NAO_CONFERIVEL_NOVA
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.8
    verified_at: "2026-11-10"
    verified_against: "família private_repo_cite da bancada e private-repo-cite-check.sh --all no corpus da branch"
    label: "no core público, grafo novo ou tocado que cita repo privado ou inalcançável por URL ou repo@sha sai com aviso no lint, e o passivo contado só cai"
    narrative: "Aberta até o merge humano. É a decisão do maestro de 2026-11-10, «Guarda + omitir no futuro»: guarda que avisa, citação futura sem URL nem hash com a classe «não conferível por terceiro», histórico como está."
  - id: E_KGSSOT_MEDIU_43_NOS_DO_CORE_CITANDO_PRIVADO
    node_type: evidence
    layer: audit
    plane: PROD
    status: confirmed
    impact: 5
    confidence: 0.85
    verified_at: "2026-11-10"
    verified_against: "leitura do nó E_CORE_PUBLIC_CITES_PRIVATE_REPOS_1110 na main do kg-ssot (merge 653597d8) e private-repo-cite-check.sh --all --show-names na HEAD ccd34171d do core"
    label: "medido pelo kg-ssot e reconferido aqui: o core, público desde 2026-10-13, tem 43 nós com provenance.source em URL de repo privado ou inalcançável (47 com trace e narrative); a guarda conta os mesmos 47 pares nó/repo por URL"
    narrative: "O kg-ssot contou por git grep e gh repo view. A guarda, com a lista pública medida no mesmo dia, achou 47 pares nó/repo por URL em 17 arquivos (o kg-ssot diz 15 arquivos para o provenance.source; a guarda varre todos os campos e o texto fora de campo). Somada a forma repo@sha sem URL, que o kg-ssot deixou fora da conta, o passivo era 209; a passada adversarial de 2026-11-10 achou mais formas (dono/repo nu e com #N, nome depois de caminho, nome @ sha) e o baseline foi a 255 pares nó/repo: 47 por URL, 172 por hash e 36 por referência."
    provenance:
      source: "https://github.com/marciocar/kg-ssot/blob/main/docs/evolution/research/private-cite-salt-url-2026-11/private-cite-salt-url-2026-11.kg.yaml"
      locator: "nós E_CORE_PUBLIC_CITES_PRIVATE_REPOS_1110 e E_SALT_KEY_OMIT_LOCAL_PROOF_1110"
      method: "measurement: leitura do nó e reexecução pela guarda sobre o corpus do core"
      locality: "web"
  - id: D_CHECK_DE_LINT_COM_CATRACA_E_LISTA_OFFLINE
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 5
    confidence: 0.85
    verified_at: "2026-11-10"
    verified_against: "guard-census.sh (nenhuma guarda da classe; molde de catraca mais próximo: kg-machine-path-check.sh, REGRA 99); família private_repo_cite"
    trace: ".claude/validation/private-repo-cite-check.sh"
    label: "substrato: check de lint (REGRA 121, aplica-se só à fonte), molde da catraca da REGRA 99; julga só os .kg.yaml que o diff contra o merge-base com origin/main toca; aviso SOFT, catraca HARD"
    narrative: "Lint e não hook porque o pre-commit e o CI já rodam o lint. Visibilidade pela lista versionada public-repos.tsv: o CI não consulta a rede, e o --verify-allowlist reconfere com gh fora dele. Donos julgados: os owner da lista mais os donos das URLs do members.yaml. A citação nova é aviso por decisão do maestro. A catraca é HARD porque re-emitir o baseline é o jeito de calar o aviso, e o maestro mandou que o número só caia; quando a lista perde um repo no mesmo diff (virou privado), o crescimento sai SOFT. Baseline e saída tsv levam o repo por hash: a saída do CI de um repo público é pública."
  - id: D_VOCABULARIO_DO_NOME_NU_POR_TRES_FONTES
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 4
    confidence: 0.8
    verified_at: "2026-11-10"
    verified_against: "contagem de <nome>@<sha> no corpus e gh repo view de cada nome, em 2026-11-10"
    trace: "docs/evolution/federation/public-repos.tsv"
    label: "repo@sha sem dono é a forma dominante (um repo privado aparece 84 vezes assim) e o members.yaml não o registra; o nome nu vem do registro, das URLs de dono julgado no corpus e de uma lista medida guardada por hash"
    narrative: "A 1ª redação derivava o nome nu só do members.yaml e via 2 das 84 ocorrências do repo mais citado. Acusar todo palavra@sha traria ruído medido (grafo@, core@, develop@, número@), o que a cláusula 4 da doutrina recusa. Ficou: o registro, as URLs de dono julgado no corpus e 13 nomes medidos (privados ou que não resolvem), gravados como nome#<hash>. O hash curto se enumera e não esconde o nome; só evita gravá-lo em claro num arquivo público."
  - id: E_MUTANTES_DO_VOCABULARIO_MORDEM
