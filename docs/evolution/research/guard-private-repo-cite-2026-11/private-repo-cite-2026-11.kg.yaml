    narrative: "Mutantes: fronteira do host (quem cai sem o ponto é gist.github.com; docs.github.com/en/... já cala por ter dono de terceiro), git@github.com:, raw, api/repos, codeload, caixa do dono e do repo, ponto final, .git, lista pública, dono de terceiro, dono do registro, nomes do corpus e da lista por hash, dono/repo@sha, nome nu depois de barra, lookahead do sha, texto fora de campo, id do nó e YAML inválido. O lookbehind saiu, e o caso ~/<nome>@sha entrou com mutante que o recoloca."
