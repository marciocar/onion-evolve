    narrative: "Lint e não hook porque o pre-commit e o CI já rodam o lint. Visibilidade pela lista versionada public-repos.tsv: o CI não consulta a rede, e o --verify-allowlist reconfere com gh fora dele. Donos julgados: os owner da lista mais os donos das URLs do members.yaml. A citação nova é aviso por decisão do maestro. A catraca é HARD porque re-emitir o baseline é o jeito de calar o aviso, e o maestro mandou que o número só caia; quando a lista perde um repo no mesmo diff (virou privado), o crescimento sai SOFT. Baseline e saída tsv levam o repo por hash: a saída do CI de um repo público é pública."
