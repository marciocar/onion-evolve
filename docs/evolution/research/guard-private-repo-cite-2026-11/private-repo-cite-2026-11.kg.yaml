    trace: ".claude/rules/kg-grammar.md"
    label: "a classe «não conferível por terceiro» hoje é texto no provenance.source; nenhum leitor do kg-ssot a imprime nem a conta, e o contrato segue exigindo source, locator e method"
    narrative: "O kg-ssot mediu que, omitida a URL, somem a conferência de versão e a de locator. Que o leitor imprima a classe é trabalho do kg-ssot, não deste PR. Gatilho: o kg-ssot ganhar campo ou leitor para a classe, e aí a gramática e esta guarda migram para ele."
