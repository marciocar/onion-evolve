    trace: ".claude/validation/lint-selftest.sh"
    label: "medido: 30 mutantes de vocabulário reprovam o caso nomeado do --selftest, e 7 de produção (escopo, catraca, porta) reprovam o caso de produção; a revisão independente rejeitou a 1ª versão"
    narrative: "Mutantes: fronteira do host (quem cai sem o ponto é gist.github.com; docs.github.com/en/... já cala por ter dono de terceiro), git@github.com:, raw, api/repos, codeload, caixa do dono e do repo, ponto final, .git, lista pública, dono de terceiro, dono do registro, nomes do corpus e da lista por hash, dono/repo@sha, nome nu depois de barra, lookahead do sha, texto fora de campo, id do nó e YAML inválido. O lookbehind saiu, e o caso o caminho do clone no home seguido de <nome>@sha entrou com mutante que o recoloca."
    provenance:
      source: "família run_private_repo_cite_selftests na branch feat/private-repo-cite-guard"
      locator: "caso (m) da família"
      method: "measurement: bancada com a cura revertida na cópia da guarda"
      locality: "repo"
  - id: E_REVISAO_INDEPENDENTE_REJEITOU_E_FOI_CURADA
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.85
    verified_at: "2026-11-10"
    verified_against: "veredito REJECTED da revisão independente do PR #1576, reproduzido numa cópia da onion-core com a validação da branch, e a família private_repo_cite (46 de 46)"
    trace: ".claude/validation/private-repo-cite-check.sh"
    label: "a revisão independente rejeitou o #1576 por dois bloqueios, a porta onion-core e 34 citações caladas pelo vocabulário, e por uma catraca que contava em vez de comparar; os três foram curados com caso e mutante"
    narrative: "Porta: medido numa cópia da onion-core, o lint da branch já dava NÃO SE APLICA à REGRA 121 (papel source-door), mas o helper chamado direto saía rc 2 e a família de bancada ficava vermelha na porta, onde a lista core-only não protege (SELFTEST_ROLE é source). Cura: o helper reconhece kind: door sem a lista e diz NÃO SE APLICA; o caso (b) pula visível; o caso (i) prova helper e lint na porta, com mutante em cada um. Vocabulário: dono/repo nu, com #N e no -R; nome do registro depois de caminho; nome @ sha e nome (HEAD sha). Catraca: compara o conjunto de entradas com o do merge-base; só rebaixa a SOFT a entrada cuja citação já estava no grafo na base. Os 13 nomes por hash aparecem todos em claro na árvore (no mínimo 9 vezes): nenhum é segredo que o hash exporia a dicionário."
    provenance:
      source: "revisão independente do PR #1576 na branch feat/private-repo-cite-guard"
      locator: "veredito REJECTED com dois bloqueios e cinco pontos não bloqueantes, em 2026-11-10"
      method: "measurement: reprodução na cópia da porta e bancada com mutantes"
      locality: "repo"
  - id: C_TETO_TERCEIRO_E_FORMAS_FORA_DA_LISTA
