    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.95
    verified_at: "2026-10-11"
    verified_against: "grep -n bulk em CLAUDE.md e em .claude/utils/task-manager/ no origin/main 46df6ad6"
    label: "O DEFEITO (1), DATADO: o CLAUDE.md prescreve lote pelo /issue/bulk do Jira e por endpoints de bulk do ClickUp, e nenhum adapter implementa lote; o jira.md diz que o bulk não é usado ali. A doutrina declara uma capacidade que a abstração não tem."
    narrative: "O consumidor fala com taskManager.* (REGRA 10), então a prescrição de lote no CLAUDE.md não tem caminho: ou o comando chama o provedor direto (o que a REGRA 10 proíbe), ou faz N chamadas. É a classe 'declara capacidade que não exerce', que o corpus já nomeou como a pior (zoho-glpi-adapters-2026-09, C_OPCAO_B_GLPI_DENTRO_TASK_MANAGER). Nenhuma guarda via, porque a interface não tinha onde dizer o que cada adapter implementa."
    provenance:
      source: "CLAUDE.md@46df6ad6"
      locator: "l.233 (Bulk: usar POST /rest/api/3/issue/bulk) e l.284 (Bulk-first); .claude/utils/task-manager/adapters/jira.md l.782 (não usado aqui); nenhuma ocorrência de bulkCreate nos adapters"
      method: "medição: grep -n de bulk no CLAUDE.md e nos adapters do task-manager"
      locality: "repo"

