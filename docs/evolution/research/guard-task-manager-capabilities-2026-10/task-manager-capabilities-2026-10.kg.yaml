    label: "O censo de 2026-10-11 não achou guarda da classe: 19 moldes de check de lint e 2 de hook, 236 famílias de bancada, nenhum julgando declaração de capacidade de adapter. O mais exercitado dos checks era o ops-citation-travel-check.sh, com 17 casos."
    provenance:
