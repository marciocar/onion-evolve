  - id: D_SUBSTRATO_CHECK_DE_LINT_QUE_VIAJA
    node_type: decision
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    trace: ".claude/validation/task-manager-capabilities-check.sh"
    label: "Substrato: check de lint (REGRA 103), HARD, que roda também no repo derivado, porque os adapters viajam. Molde: ops-citation-travel-check.sh, o check mais exercitado do censo (17 casos): saída TSV, dispatcher que acusa 'não rodou' e bancada com mutante por caso."
    narrative: "A pergunta é de corpus (os arquivos declaram o que deveriam?), não de comando: hook PreToolUse foi descartado. Ao contrário do molde, que pula no derivado (IS_DERIVED: lá não há ops/), esta guarda roda no adotante e nas portas que levam o lint, porque o task-manager viaja inteiro (o vendor-manifest leva .claude/utils e .claude/validation). Na porta onion-mini o task-manager viaja e o lint não: a guarda não roda lá, por desenho da allowlist didática."

  - id: D_FORMATO_TSV_IRMAO_DO_ADAPTER
    node_type: decision
    plane: DEV
    status: open
    impact: 3
    confidence: 0.8
    trace: ".claude/utils/task-manager/interface.md"
    label: "Formato: TSV irmão do adapter (adapters/<p>.capabilities.tsv), com o vocabulário num bloco TSV marcado na interface. Nem YAML nem bloco dentro da prosa."
    narrative: "TSV se lê com awk, sem depender de PyYAML (cuja falta já produziu falhas fantasmas no gate desta casa), e cada linha é uma afirmação que se cita, se diffa e se conta. Arquivo irmão viaja junto com o adapter e não mistura a declaração com 800 linhas de prosa TypeScript. A fonte é uma ref curta (kg:<id-do-grafo>#<NÓ>), não um caminho: a pesquisa do core não viaja, e um caminho para docs/evolution numa superfície vendorizada seria ponteiro morto."

  - id: E_DOGFOOD_E_MUTANTES
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-10-11"
    verified_against: "--selftest com LC_ALL=C (18/18), família run_task_manager_capabilities_selftests (22/22), 20 mutantes pelo mutate-and-restore.sh sobre a guarda real e o dispatcher, com o hash da guarda conferido igual depois"
    label: "Dezoito casos no --selftest, cada um com mutante que morde (rc 1 e o caso nomeado em vermelho); o mutante do registro (dispatcher sem a chamada) derruba o caso c da bancada. O corpus real sai limpo; uma cópia com três defeitos plantados sai com as quatro HARD esperadas."
    narrative: "O dogfood pegou dois defeitos meus. (1) Antes da 1ª execução, na leitura: a saída do awk era lida com IFS de TAB, e o read colapsa campos vazios consecutivos, o que deslocaria a coluna seguinte; curado com o separador US (0x1f). (2) Na 1ª rodada do mutate-and-restore.sh, três mutantes não morderam: o marcador ONION_MUTANTE no fim da linha comentava os argumentos do _emit e o ;; do case, e o mutante quebrava a sintaxe em vez de reverter a cura (rc 2). Refeito com o marcador como 1ª expressão; 20 de 20 mordem."
    provenance:
      source: ".claude/validation/lint-selftest.sh"
      locator: "run_task_manager_capabilities_selftests, casos a, b, c e m"
      method: "medição: mutate-and-restore.sh com restauração por hash, e a família rodada com LC_ALL=C"
      locality: "repo"

