    verified_at: "2026-10-11"
    verified_against: "leitura de .claude/utils/task-manager/interface.md no origin/main 46df6ad6, tabela de prioridade"
    label: "O DEFEITO (2), DATADO: a interface publicava o mapa de prioridade do Zoho 'da UI, não medido contra a API' no mesmo formato das colunas medidas, e o Asana como '-', sem dizer qual célula tinha fonte."
    narrative: "No mesmo dia a Onda 1 achou uma afirmação sem fonte (o /search do Jira 'removido em maio/2025') em 5 superfícies do core, vista só por uma rodada de pesquisa (task-manager-vocabulario-2026-10, Q_JIRA_SEARCH_REMOVAL_RECONCILE). A prosa de adapter não tem campo para 'ninguém mediu isto'; a cura é o campo estruturado (status unverified, coluna source) e a guarda que o cobra."
    provenance:
      source: ".claude/utils/task-manager/interface.md@46df6ad6"
      locator: "seção Mapeamento por Provedor, tabela Prioridade e a nota de que o mapa do Zoho vem da UI"
      method: "leitura: a interface antes da Onda 2"
