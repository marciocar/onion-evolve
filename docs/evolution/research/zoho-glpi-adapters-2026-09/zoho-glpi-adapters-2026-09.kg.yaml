  - id: D_ZOHO_GLPI_ADAPTERS_0923
    node_type: decision
    plane: DEV
    status: done
    verified_at: '2026-09-25'
    verified_against: 'SELADO PELO MAESTRO em 2026-09-25, por escolha explicita num formulario de decisao que apresentou as opcoes NOMEADAS e a recomendacao de cada uma; o texto da escolha esta no `label` deste no. A verificacao aqui e o ATO DE DECIDIR, nao uma medicao contra o vivo: decisao nao se mede, se toma — e o que se registra e QUEM decidiu, QUANDO, e com quais opcoes na mesa.'
    impact: 5
    confidence: 0.5
    label: 'DECISAO ABERTA (o maestro sela — nenhuma sessao sela por ele). Duas perguntas acopladas: DESENHO (onde o GLPI entra) e ORDEM DE HOSPEDAGEM (online agora ou VPS primeiro). OPCOES DE DESENHO — A: GLPI FORA do task-manager, nasce familia SDAAL irma read-only `.claude/utils/activity-source/` com 4-6 metodos (listActivities(period,filters), getActivity, listActors, getPeriodSummary) + GLPI como 1o adapter, e Zoho Projects entra como 6o adapter do task-manager (14 metodos); B: GLPI DENTRO do task-manager, com ~10 metodos stub (createTask/deleteTask/createSubtask/updateStatus/...); C: sem adapter algum — ingestao periodica GLPI->KG (plugin Advanced Dashboard + CSV / SQL direto) e a apuracao le do grafo. OPCOES DE HOSPEDAGEM — D1 (proposta do maestro): usar o GLPI online agora e trazer para a VPS depois; D2: self-hosted na VPS PRIMEIRO (Docker, prefixo onion-vps-), online nunca ou so como espelho de leitura; D3: online como PILOTO de leitura com corte datado e gatilho nomeado, condicionado a sonda de cobertura de dados passar. RECOMENDACAO DO ELENXO: **A para o desenho; D2 ou D3 (NAO D1 como esta posto) para a hospedagem; e NENHUM adapter escrito antes da sonda** (C_SONDA_ANTES_DE_QUALQUER_ADAPTER). O NUCLEO da recomendacao, que corrige a propria casa: a hipotese ("Zoho cabe nos 14 metodos, GLPI nao") sobrevive, mas NAO e a forma read-only da GraphQL que tira o GLPI do task-manager — essa e propriedade de conveniencia, e ainda por cima falsa como garantia (a legacy API com escrita continua disponivel). O motivo CERTO e outro: a propria coisa que o maestro extrai — atividade por tarefa, com tempo, para apuracao — e a LACUNA CONHECIDA da API do GLPI (E_OBJECAO_1, fonte primaria de forum que esta rodada tinha em maos e nao leu). Isso reforca A e ao mesmo tempo AMEACA A: se o dado nao sai pela API, o 1o adapter do activity-source nao tem o que ler, e C (ingestao CSV/SQL->KG) sobe de terceira opcao para caminho possivelmente UNICO. Sobre a ordem: D1 nao esta reprovada, esta INVERTIDA pela unica rota de export DOCUMENTADA — ela pressupoe CLI/DB no servidor, o que so existe DEPOIS que voce ja self-hospeda (E_OBJECAO_4), e a isso somam-se residencia de dado/LGPD e direito de saida contratual num SaaS europeu (E_OBJECAO_3c). CONDICOES DE SELAGEM NOMEADAS (nao data): (i) a sonda devolver hospedagem + versao + se existe campo de atividade por tarefa exportavel; (ii) a primaria projects.zoho.com/api-docs ser lida e confirmar se `updateStatus` mapeia para v3 (PATCH) e se `custom_status` aceita nome ou exige id numerico; (iii) para D1/D3, uma rota de saida cloud->self-hosted CONFIRMADA por contrato ou suporte, nao por simetria declarada. ══ SELADO pelo maestro 2026-09-25 — DESENHO A + HOSPEDAGEM D3, e NENHUM adapter escrito antes da sonda (C_SONDA_ANTES_DE_QUALQUER_ADAPTER intacto). DESENHO A: o GLPI fica FORA do task-manager, nasce a família SDAAL irmã read-only `.claude/utils/activity-source/` (listActivities/getActivity/listActors/getPeriodSummary) com o GLPI como 1º adapter, e o Zoho Projects entra como 6º adapter do task-manager. ⚠️ O MOTIVO CERTO, e não o que a rodada escreveu: NÃO é a GraphQL ser read-only — isso é propriedade de conveniência e é FALSO como garantia, porque a legacy API com escrita continua disponível. O motivo é que a coisa extraída (atividade por tarefa, com tempo, para apuração) é OUTRA PERGUNTA, e ela é a lacuna conhecida da API do GLPI. Isso reforça A e ao mesmo tempo o AMEAÇA: se o dado não sai pela API, o 1º adapter não tem o que ler e (C) ingestão CSV/SQL→KG sobe de terceira opção para caminho possivelmente ÚNICO. HOSPEDAGEM D3: online como PILOTO DE LEITURA, com corte datado e gatilho nomeado, condicionado à sonda de cobertura passar — é o único caminho que entrega MEDIÇÃO antes do compromisso, e medição é o que falta nesta decisão inteira. D1 (online agora, VPS depois) não está reprovada: está INVERTIDA pela única rota de export DOCUMENTADA, que pressupõe CLI/DB no servidor — o que só existe DEPOIS de self-hospedar.'
