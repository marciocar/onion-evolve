** O selo registra a opção OSCAL-em-git (modelo trestle) como considerada e rejeitada, com a evidência do Lula v1→v2 e do custo de mais de 70.000 linhas do 800-53. 5. **Assinatura YAML (achado 19).** A assinatura do trestle é só para JSON e não cobre o grafo YAML. 6. **Lacunas abertas, declaradas no selo como não verificadas (sem fingir cobertura):** - RegScale "OSCAL-native" (achado 11) é o contraexemplo mais forte e não foi resolvido. - Consumo pelo auditor: zero claims ancoradas. - Fornecedores sem classificação: Hyperproof, Secureframe, Thoropass, Anecdotes, Paramify e Chef InSpec. - Eixo de capital: sem aquisições, e os números da Vanta são de um agregador com inconsistência interna. **Quando escolher C em vez de B.** Se o maestro exigir que a metade "git como trilha" seja selada já, a resposta honesta é C: falta exatamente a evidência de imutabilidade e de consumo pelo auditor. **As opções que não recomendo:** - **D:** o único sinal de mercado medido vai contra ela (o Lula saiu dela). - **E:** conflita com o KG-SSOT do core sem ganho. O argumento de volume se resolve com a divisão de B.»
