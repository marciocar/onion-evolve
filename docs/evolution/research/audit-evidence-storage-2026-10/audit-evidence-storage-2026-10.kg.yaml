    narrative: |-
      Pergunta do run /onion-research em modo decisão de 2026-10-21, pedida pelo maestro ao selar D_AUDIT_GRAPH_IS_STORAGE_OSCAL_IS_EDGE_1021 (grafo audit-evidence-machinery-2026-10) como «pesquisar mais fornecedores antes de selar». Pediu-se ampliar além do Lula v2 (único git-nativo medido): Vanta, Drata, Secureframe, Sprinto, Thoropass, Hyperproof, RegScale, Paramify, Anecdotes, Chef InSpec/Progress, OpenSSF/Gemara, CNCF/OSCAL Compass (trestle, c2p, agent), Kyverno/OPA policy reports e GRC-as-code em geral. Para cada um: onde o estado mora, se OSCAL é armazenamento ou borda, se há trilha auditável por versionamento (git/WORM) e como o auditor consome. Eixo invariante: mercado e capital.
