nodes:
  - id: E_MASTER_PASSAVA_RC0_REPRODUZIDO
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: "2026-10-12"
    source_tier: 10
    label: "O DEFEITO, reproduzido antes da cura: num repo cuja produção é master, o protect-main deixava passar git push origin +master e git push -f origin master com rc=0, e barrava só +main. O merge-gate tinha a mesma suposição no push não-force."
    narrative: "Medido pela 1ª vez em 2026-10-05 pelo agente de update no brain-granaai (pin ab08cde). Reproduzido nesta forja num repo de bancada criado com git init -b master: +master rc=0, -f origin master rc=0, +main rc=2, force de feature rc=0. A configuração REAL do brain-granaai, lida sem escrever nada lá: origin/HEAD aponta develop e gitflow.branch.master = master. Esse dado mudou o desenho (ver a decisão): somar a branch padrão do remoto teria passado a vetar o force-push da develop."
    trace: ".claude/hooks/pretooluse-protect-main.sh"
    verified_against: "hook alimentado com payload PreToolUse num repo de bancada de produção master, antes da cura: +master rc=0, -f origin master rc=0, +main rc=2; config do brain-granaai lida em modo leitura: refs/remotes/origin/HEAD = develop, gitflow.branch.master = master"
    provenance:
      source: ".claude/hooks/pretooluse-protect-main.sh"
      locator: "push_lines e o regex de alvo main (antes da cura); .git/config e refs/remotes/origin/HEAD do brain-granaai"
      method: "medição: hook alimentado com payload JSON num repo de bancada de produção master, antes e depois da cura"
      locality: "repo"

  - id: D_RAMO_DE_PRODUCAO_RESOLVIDO_NA_LIB
    node_type: decision
    plane: PROD
    impact: 5
    confidence: 0.85
    status: done
    verified_at: "2026-10-12"
    label: "A resolução mora na lib partilhada: protected_branches = main sempre, mais gitflow.branch.master OU, sem ele, a branch padrão de cada remoto, ou master sem fonte nenhuma. O destino resolvido vira o token main que os dois hooks já julgam."
    narrative: "Substrato: não é guarda nova, é cura de classe dos dois vetos PreToolUse que o censo já lista. A lib invocation-lines.sh é o lugar porque ela já canoniza o destino do push para os dois hooks: a paridade protect-main ↔ merge-gate sai de graça, sem segundo regex. O gitflow tem PRECEDÊNCIA sobre o origin/HEAD porque num GitFlow a branch padrão do host costuma ser a develop (é o caso medido no brain-granaai); somar as duas fontes vetaria o force-push da integração. Comparação sem caixa, como já era com main. O fallback de push nu nos hooks passa a usar onion_on_protected_branch, espelho bash da mesma resolução; a bancada cobra a paridade. Rotas de API do merge-gate (git/refs/heads/main, contents branch=, gh repo sync) seguem só com main: ele só se arma no core, cuja produção é main."
    trace: ".claude/hooks/lib/invocation-lines.sh"
    verified_against: "censo da forja (moldes por substrato; classe coberta pelos dois vetos PreToolUse); bancada pretooluse_veto 236/236 com LC_ALL=C; dogfood contra a config real do brain-granaai: +master rc=2, -f master rc=2, +main rc=2, -f develop rc=0, -f onion/develop rc=0; no core: +main rc=2, -f master rc=0"
    provenance:
      source: ".claude/hooks/lib/invocation-lines.sh"
      locator: "def protected_branches; a passada final de canonical_git; touches_main; onion_protected_branches e onion_on_protected_branch"
      method: "medição: bancada e dogfood do hook com payload contra a config real do adotante, sem escrever no repo dele"
      locality: "repo"

  - id: E_VINTE_E_SEIS_CASOS_SEIS_MUTANTES_MORDEM
    node_type: evidence
    plane: DEV
    impact: 4
    confidence: 1.0
    status: confirmed
    verified_at: "2026-10-12"
    label: "Bancada: 26 casos novos (prod e pr-bash) em run_pretooluse_veto_selftests, em seis repos de bancada, um por fonte de resolução, com as duas polaridades. Seis mutantes por ops/mutate-and-restore.sh, todos mordendo com LC_ALL=C."
    narrative: "Repos: sem remoto (fallback main+master), origin/HEAD→master, origin/HEAD→main (master NÃO é produção: tem de passar), origin/HEAD→trunk, gitflow.branch.master=trunk, e a forma do brain-granaai (origin/HEAD→develop + gitflow master). Mutantes: (M1) sem a passada final de normalização: 9 casos de VETO reprovam; (M2) sem o fallback master no tokenizador: 6; (M3) sem ler refs/remotes/*/HEAD: 4 (o trunk e as três polaridades honestas do origin/HEAD→main); (M4) sem ler o gitflow: 2; (M5) sem o fallback no espelho bash: 1 (pr-bash bm); (M6) sem a precedência do gitflow: 1 (pr-gfd-dev, o force-push da develop). Família inteira 236/236 com a cura."
    trace: ".claude/validation/lint-selftest.sh"
    verified_against: "LC_ALL=C bash .claude/validation/lint-selftest.sh --families pretooluse_veto = 236 passaram, 0 falharam; cada mutante via ops/mutate-and-restore.sh reprovando os casos nomeados; zero marcador de mutante na árvore depois"
    provenance:
