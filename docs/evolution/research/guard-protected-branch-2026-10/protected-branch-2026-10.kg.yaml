      locator: "run_pretooluse_veto_selftests, bloco RAMO DE PRODUÇÃO RESOLVIDO (_prmk, _prcase, pr-bash)"
      method: "medição: bancada e seis mutantes rodados nesta sessão"
      locality: "repo"

  - id: C_TETO_RESOLUCAO_LOCAL_E_FONTES
    node_type: claim
    plane: DEV
    impact: 4
    confidence: 0.9
    status: confirmed
    verified_at: "2026-10-12"
    label: "TETO da resolução: ela lê o que está no clone, não o host. origin/HEAD defasado, produção com outro nome sem gitflow nem origin/HEAD, e o padrão de um repo empurrado por URL não são vistos."
    narrative: "O refs/remotes/origin/HEAD é gravado no clone e não se atualiza sozinho quando o host troca a branch padrão (git remote set-head origin -a atualiza). Um repo criado com git init + remote add, sem set-head e sem gitflow, cai no fallback main+master: produção chamada trunk ou production fica desprotegida, e uma branch de trabalho chamada master passa a ser vetada no force-push (fechado por desenho, raro). Push para URL literal usa a resolução do diretório local. GATILHO: o primeiro adotante com produção fora de main/master sem gitflow nem origin/HEAD."
    trace: ".claude/hooks/lib/invocation-lines.sh"
    verified_against: "cabeçalho da lib (bloco RAMO DE PRODUÇÃO na FRONTEIRA DECLARADA) e os casos da bancada que fixam cada fonte"
    provenance:
      source: ".claude/hooks/lib/invocation-lines.sh"
      locator: "cabeçalho, FRONTEIRA DECLARADA, bloco RAMO DE PRODUÇÃO"
      method: "leitura: o código da resolução escrito nesta forja, conferido contra os casos da bancada"
      locality: "repo"

  - id: C_TETO_PUSH_DIRETO_NO_ADOTANTE_SEGUE_SEM_VETO
    node_type: claim
    plane: DEV
    impact: 4
    confidence: 0.9
    status: confirmed
    verified_at: "2026-10-12"
    label: "TETO: no adotante o push NÃO-force direto na produção e a deleção (:master, --delete) seguem passando. Quem os barra é o merge-gate, que se desarma sem ops/pr-merge-verified.sh — por desenho. Vale igual para main."
    narrative: "A cura dá ao merge-gate a mesma resolução (no repo de bancada armado ele barra git push origin master e o push nu sentado em master), mas no adotante ele não se arma: o desarme é a fronteira declarada no cabeçalho dele (não se veta o único caminho de merge de uma casa que não tem o verificado). O protect-main só olha force-push; deleção de ramo sem force não é dele, medido também para main (git push origin :main rc=0 antes e depois). GATILHO: um adotante pedir veto de push direto ou de deleção na produção, ou o primeiro incidente medido dessa forma."
    trace: ".claude/hooks/pretooluse-merge-gate.sh"
    verified_against: "repo de bancada de produção master: protect-main deixa passar git push origin :master e --delete origin master (rc=0), igual a :main; merge-gate armado barra os dois (rc=2); cabeçalho do merge-gate (desarme sem o caminho verificado)"
    provenance:
      source: ".claude/hooks/pretooluse-merge-gate.sh"
      locator: "teste de presença de ops/pr-merge-verified.sh e o bloco (c) git push não-force"
      method: "medição: hooks alimentados com payload num repo de bancada de produção master"
      locality: "repo"

