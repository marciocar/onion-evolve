    label: "Parte B do perfil de interconexão: qual cifra do corpo, qual raiz de confiança e registro assinado (medindo TUF e sigstore contra o desenho manual), qual transporte entre máquinas e qual pareamento pela RFC 10027 o Onion adota?"
    narrative: "Estudo próprio antes de qualquer código. Itens: cifra do corpo (JWE ECDH-ES ou HPKE no JWE); raiz de confiança e registro assinado com versão monotônica, validade contra rollback e freeze, limiar, raiz offline e rotação, medindo TUF e sigstore/gitsign; transporte de saída com proxy e CA corporativa, private_key_jwt mais DPoP; pareamento pela RFC 10027, escolhido pela sessão (code com PKCE e loopback havendo navegador, device flow sem ele); duas chaves por máquina com rotação de 90 dias e recusa de rebaixamento. A Parte B revisa D_MESSAGING_DEVICE_FLOW_LOGTO_JA_1106 (aresta externa TRACES_TO). Condução: curadoria. Decisão de arquitetura: core. Selo: maestro."
    trace: "PROFILE.md, seção Parte B"
