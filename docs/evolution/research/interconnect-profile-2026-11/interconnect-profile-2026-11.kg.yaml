    verified_against: "PROFILE.md, seção A4; campo não assinado de hoje conferido contra a2a-verify.sh:80 do core"
    label: "A4 Classe: onionclass (public, internal, confidential, unclassified) vira extensão dentro do evento assinado; legado vale unclassified; confidential só circula no mesmo host pela fila até a Parte B, nunca entre máquinas nem por git."
    narrative: "A classe é obrigatória a partir da v1 e uma catraca conta os unclassified, número que só pode cair. Para confidential: o gate veta no binding git sem a exceção por repo privado, uma guarda de lint recusa commit com a classe, o aceite grava só um ponteiro num razão local fora do repo, e o corpo é apagado da fila no ack mais 8 dias, ficando o recibo."
    trace: "PROFILE.md, seção A4"
