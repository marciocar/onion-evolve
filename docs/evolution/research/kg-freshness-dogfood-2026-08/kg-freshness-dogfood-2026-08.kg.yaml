    label: 'O BLOQUEADOR DOMINANTE NÃO É ACESSO — É A CLÁUSULA READ-ONLY DO PRÓPRIO COMANDO. DOIS dos quatro nós parciais travaram em "precisa de POST": cunhar um JWT M2M via `client_credentials` (E_pull_endpoint_works) e mandar payload ao `/a2a` (E_p9_complete). ⚠️ CORREÇÃO DA REVISÃO: a 1ª versão dizia TRÊS e somava E_p1p3_provisioned — mas re-rodar logto-provision.sh É mutação de verdade, não confusão POST-vs-mutação; e o quarto (E_p7_flip_live) travou por login OIDC interativo, segredos e journal rotacionado. Um worker escreveu verbatim: "Não é falta de acesso: é limite do protocolo de medição". A cláusula CONFUNDE POST com MUTAÇÃO — pedir um token por client_credentials é leitura semântica, não escrita. Consequência, declarada no tamanho da amostra (2 de 4 — não "a maioria"): num grafo de auth/identidade a cláusula bloqueia uma fatia grande das evidências, e o comando produz UNVERIFIABLE em série sem que nada esteja errado com o grafo. A cláusula precisa distinguir "muda estado durável" de "usa verbo POST".'
