    label: 'MEDIDO: `TypeError: parallel() expects an array of functions, not promises. Wrap each call: () => agent(...)`. Os exemplos copy-paste da skill onion-orchestration ensinam `files.map((f) => agent(...))` — que passa PROMISES e falha no runtime. A doc da própria ferramenta Workflow traz a forma certa (`f => () => agent(...)`). São DOIS exemplos afetados (fan-out-and-synthesize, linha 121; mutação por partição, linha 142). ⚠️ CORREÇÃO DA REVISÃO: a 1ª versão contava TRÊS, somando o template de write(KG) — que não chama `parallel()` e está quebrado pelo OUTRO defeito. Contar o mesmo bloco duas vezes é a MESMA manobra de denominador que este grafo acusa nos workers. E O RAIO É MAIOR QUE O TRACE: o defeito está em TRÊS arquivos versionados — `.claude/` mais as duas cópias de plugin (md5 42df7c85 idêntico), que são o CANAL DE INSTALAÇÃO. Curar só `.claude/` deixa duas cópias quebradas na porta por onde os adotantes recebem a skill. Quem seguir a skill ao pé da letra não roda; quem já rodou consertou inline e nunca curou a fonte — o padrão que [[fix-must-become-mechanism]] nomeia.'
