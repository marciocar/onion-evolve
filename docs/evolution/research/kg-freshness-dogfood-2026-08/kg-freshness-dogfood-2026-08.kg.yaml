    node_type: question
    plane: PROD
    status: open
    impact: 4
    confidence: 0.6
    verified_at: 2026-08-29
    verified_against: "campo coverage, primeira execução da história"
    label: 'O TAMANHO DO NÓ PREVÊ SE ELE É VERIFICÁVEL? ⚠️ REBAIXADO DE CLAIM CONFIRMADA A QUESTION PELA REVISÃO, e a razão é humilhante: os números da 1ª versão (média 3,5 × 9,0 = "2,6×"; "70% de cobertura real, número que nunca existiu antes") são calculados sobre os `claims_total` DECLARADOS PELOS WORKERS — exatamente os denominadores que o nó vizinho C_WORKERS_ENCOLHEM_O_DENOMINADOR declara subcontados em ~48% e julgados desonestos em 3 de 4. O grafo publicou como real justamente o número que a própria passada provou inflado. Recontando com os juízes onde eles existem (só nos 4 nós TOTAL): o denominador vai a ≥63, a cobertura cai de 70% para ~56%, a média do lado TOTAL sobe de 3,5 para 6,75 e a razão desaba de 2,6× para ~1,33×. E o universal "todo nó com ≥8 afirmações voltou parcial" é FALSIFICADO pelo próprio corpus: C_console_not_the_path tem 9 pela contagem do juiz e voltou TOTAL. O que sobrevive é a DIREÇÃO, não a magnitude — e ainda assim sobre n=8 com viés declarado. Correção factual junto: a tipologia dos 8 é 3 decision + QUATRO evidence + 1 claim (a 1ª versão disse 3+3, deixando 2 nós fora da conta sem avisar); os 4 evidence voltaram todos PARCIAL, o que é mais forte que o afirmado, mas o `claim` alcançou TOTAL, e é justamente ele que quebra o "o TIPO prevê". GATILHO PARA VIRAR CLAIM: recontagem por juiz nos 8, não nos 4.'
    trace: "run wf_86d657c4-3d9"
