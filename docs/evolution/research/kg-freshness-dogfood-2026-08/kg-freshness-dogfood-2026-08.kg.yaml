    label: 'O NÚMERO DESTA PASSADA: dos 8 nós de maior atenção do grafo M2, ZERO sobrevive com um CONFIRMED válido. Vereditos brutos dos workers: 3 CONFIRMED · 3 DRIFTED · 2 UNVERIFIABLE. As guardas do fan-in rebaixaram 2 DRIFTED a UNVERIFIABLE (cobertura parcial). E o juiz adversarial opus/high, disparado pela regra dos >30% de DRIFTED, REPROVOU 4 de 4 — inclusive os três CONFIRMED. Todos os 8 carregavam `status: confirmed`. ⚠️ CORRECAO DA REVISAO: a 1a versao dizia "nenhum tinha medicao que o sustentasse" — FALSO. QUATRO dos 8 trazem `reverify_note` de 2026-08-23 com re-verificacao ao vivo. O que o numero diz honestamente e mais estreito e ainda assim serio: sob o protocolo desta passada, nenhum dos 8 alcancou um CONFIRMED que sobrevivesse ao juiz. Tres foram julgados falsos; os outros cinco nao sobreviveram por INVERIFICABILIDADE, que e coisa diferente de estar errado. É a tese fundadora do comando, provada contra o próprio corpus que ele deveria proteger.'
