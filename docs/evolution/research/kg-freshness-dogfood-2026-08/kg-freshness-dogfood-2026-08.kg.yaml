  # O 3o USO de /meta:kg-freshness — e ele reprovou a si mesmo, e depois a revisao me reprovou.
  #
  # O comando nasceu em 2026-07-27 e ganhou as guardas de schema em 2026-08-12. ⚠️ NAO e o
  # primeiro dogfood: ele ja rodara ponta a ponta em 2026-08-12 com 16 workers (wf_7804d86f-3a7),
  # e o commit de nascimento ja narra um dogfood com achado real. Esta e a 3a passada — a
  # correcao veio da revisao adversarial deste proprio PR, que derrubou a frase original.
  # Em 2026-08-29 ele rodou sobre os 8 nos de MAIOR ATENCAO do grafo M2 (bridge+Logto).
  # TRES tentativas falharam antes da boa, uma por defeito de substrato — e em duas delas os
  # workers NASCERAM e morreram no primeiro turno de API, o que e diferente de nao nascer.
  #
  # ⚠️ NADA foi carimbado no grafo M2. É a regra do comando: o worker mede, o maestro sela.
  # Nenhum `verified_at` novo saiu desta passada — que é o desfecho CORRETO, não uma falha.
  #
  # Escopo declarado: 71 nós na fila de frescor (64 OK · 7 STALE-MISSING); corte no top-8 por
  # atenção; 63 nós FORA desta passada. Os 8 escolhidos estavam todos `OK` no radar — a régua é
  # o CUSTO DO ERRO, não a ausência de carimbo.
  #
  # Custo: fan-out 548.677 tokens / 111 tool-uses / 4m52s (8 workers sonnet-medium);
  #        juiz    283.808 tokens /  53 tool-uses / 3m42s (4 juízes opus-high).
  # Runs: wf_5261e050-96d (falhou: bash indefinido) · wf_3790d38b-6a8 (falhou: parallel/promises)
  #       wf_6aa135ec-1e2 (falhou: 400 allOf, 8x) · wf_86d657c4-3d9 (medicao, 8 workers)
  #       wf_cac2ae81-4a2 (juizo adversarial) · wf_56959265-e4e (revisao REGRA 56, 3 lentes)
  #       wf_742e3a39-e7f (sonda: a API aceita a cura?)
  #
  # ⚠️ A REVISAO ADVERSARIAL DESTE PR ACHOU 36 DEFEITOS REAIS NELE, dois de severidade ALTA que
  # REFUTAM nos centrais. Estao reconciliados abaixo por arestas REFUTES/SUPERSEDES — a posicao
  # derrubada FICA, que e o desenho.

