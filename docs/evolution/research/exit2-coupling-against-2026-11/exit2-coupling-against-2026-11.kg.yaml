nodes:
  - id: Q_EXIT2_COUPLING_AGAINST_2026_11
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.6
    label: "O que derruba a tese do CLAUDE.md de que o exit 2 de hook, que barra sob bypassPermissions, não existe fora do Claude Code, nenhum CI replica e compra o acoplamento? Exclusividade, força e alternativa."
    narrative: "Pesquisa CONTRA a tese, pedida pelo maestro em 2026-11-04 antes de decidir a redação da doutrina. Medição dada na pergunta: 2.1.318, login Max, hooks reais do Onion; mod que aprova em tool.check venceu o veto em 6 de 6; sem mod o veto barrou 6 de 6; guarda embutida 'not seated'. Estado da resposta no fechamento, 2026-11-04: a metade EXCLUSIVIDADE tem contraexemplo medido (Codex 0.164.0 sob bypass; Qwen no caminho feliz); a metade FORÇA tem primária, laboratório e as duas medidas de hoje (E_MAESTRO_MOD_BEATS_VETO_LOGIN_MAX_1104, E_MODS_MANAGED_CONTAINER_STUB_1104); a metade ALTERNATIVA segue sem resposta medida (nenhuma capacidade substituta comparada com concorrentes), por isso a pergunta fica open mesmo com a redação selada: o selo declara o vazio, não o preenche. O estudo da AAIF, aaif-projects-onion-2026-11, mediu o Goose 1.57.0 (E_MEDIDA_VETO_GOOSE_E_CC_1104, aresta no topo): em modo auto o exit 2 barra 3 de 3, a falha libera e block barra, com API simulada, só shell, sem subagente. Isso não dispara o gatilho, que exige os 5 vetos reais na mesma bancada; Q_DOCTRINE_EXIT2_REVIEW_2026_11, naquele grafo, fecha neste selo."
    trace: "docs/evolution/research/exit2-coupling-against-2026-11/SYNTHESIS.md"
  - id: D_EXIT2_COUPLING_WORDING_2026_11
    node_type: decision
    layer: audit
    impact: 5
    confidence: 0.6
    label: "Redação da doutrina do exit 2: A manter com a condição do mod · B nomear outra capacidade · C retirar a exclusividade, veto é conformidade e não fronteira · D rever a postura com gatilho. Elenxo recomenda C agora com o gatilho da D; o maestro sela."
    trace: "workflow onion-research em modo decision, 2026-11-04; tese em CLAUDE.md, seção de identidade canônica"
    status: done
    plane: DEV
    verified_at: "2026-11-04"
    verified_against: "decisão do maestro em 2026-11-04, por pergunta com opções (/meta:decide): escolhida «C com o gatilho da D»"
    narrative: |-
      RECOMENDAÇÃO DO ELENXO (INTEIRA): Recomendo C agora, com o gatilho da D na mesma redação. A cai: a exclusividade é falsa por rodagem, no Codex 0.164.0 sob --dangerously-bypass-approvals-and-sandbox, e o processo do mod roda mesmo com guarda («guarda sentada com mod de processo»). B ainda não: nenhuma capacidade substituta foi medida; Workflow e PreModelSwitch são só candidatas. Restrições para a redação: 1. Separar por grau de prova. Medido: Codex e Qwen barram no caminho feliz, e no Vibe o exit 2 só barra com strict. Só por doc: Copilot, Gemini CLI e Cursor. Só por leitura: Goose. Não medido em nenhum: Copilot, Gemini e Cursor em modo autônomo; Antigravity sem primária. 2. 'Conformidade, não fronteira' sai como conclusão do Onion, não como fala da Anthropic. A OpenAI diz isso de hook; a Anthropic diz de Bash rule e diz que bypass 'offers no protection against prompt injection'. 3. Dizer as condições de força: sem configuração gerenciada não vazia ou login Team/Enterprise, um mod vence o veto, e o próprio agente pode instalá-lo sob bypass (ponta a ponta, depois do aceite de confiança). Hook comum falha aberto sem onFailure block. O caso desta máquina, Max sem guarda, é o caso fraco. 4. Estreitar 'nenhum CI replica' para o momento antes da execução na sessão. A main já tem ruleset com checks exigidos. 5. Declarar o vazio: a postura pede capacidade que não exista fora e hoje nenhuma está medida. Isso evita a contradição interna da C sozinha. 6. Remedir as massas antes de citá-las; as de 2026-08-16 estão defasadas. Gatilho proposto para a D: reabrir a postura quando um harness sem ser o Claude Code passar, na mesma bancada, nos 5 vetos reais do core, em caminho feliz, falha e modo autônomo; ou quando /meta:cc-update mudar a regra da guarda. Copilot é o primeiro candidato a medir, porque a doc diz que comando falha fechado, mas é só doc. Ação fora da redação: nenhum veto do core barra Edit ou Write em .claude/, e não há sandbox configurado. É leitura estática, sem escrita de teste; a medida barata é uma célula de laboratório. Thoughtworks e a própria Anthropic apontam isolamento como camada de força, e a cura candidata seria o sandbox, não mais um hook. Limites desta refutação: as citações de Copilot, Gemini, Cursor e Codex vieram por WebFetch mediado por modelo; os comandos grep dados podem falhar em página renderizada por JS. permissions.md, admin.md e security.md vieram como texto cru. Não reexecutei células. O laboratório usa stub e chave fictícia. O eixo de mercado é fraco, com uma busca e valores secundários.

      Selado por /meta:decide em 2026-11-04: escolhida «C com o gatilho da D»; descartadas: «A (só a condição do mod)» · «B (nomear outra capacidade)» · «D (rever a postura agora)».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-04: «Como fica a redação? (sobre a tese de que o exit 2 não existe fora do Claude Code)»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-04"
      locality: "pessoa"
