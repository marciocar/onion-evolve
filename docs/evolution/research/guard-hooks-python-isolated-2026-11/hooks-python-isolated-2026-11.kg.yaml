  - id: E_O_QUE_I_QUEBRA
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.85
    verified_at: "2026-11-05"
    verified_against: "nenhum arquivo do alcance importa yaml; lib carregada por importlib com caminho explícito; nenhum hook define PYTHON*; import yaml rc 0 com -I nos dois interpretadores"
    trace: ".claude/hooks/rule-title-in-prose.sh"
    label: "no alcance dos hooks o -I não quebrou nada; o que ele tira é pacote no site do usuário, a pasta do script no caminho e variável PYTHON* definida por fora"
    narrative: "Um venv segue visível sob -I. A pasta do script sair do caminho quebraria import irmão, e o alcance não tem nenhum: as duas libs entram por importlib.spec_from_file_location. PYTHONIOENCODING vindo de fora passa a ser ignorado (medido: sem -I iso8859-1, com -I utf-8), e nenhum hook depende dele. O gate do git importa yaml: quem o curar precisa olhar o pacote instalado com pip --user."
    provenance:
      source: "docs/evolution/research/guard-hooks-python-isolated-2026-11/hooks-python-isolated-2026-11.kg.yaml"
      locator: "busca por import yaml e PYTHON no alcance; matriz de interpretadores"
