    verified_at: "2026-11-05"
    verified_against: "família: python3 quebrado e JSON truncado barram o comando perigoso e deixam passar o honesto em cada veto; mutantes da forma; corpus de 12.173 comandos dos 10 transcripts mais recentes do core"
    trace: ".claude/hooks/pretooluse-env-guard.sh"
    label: "JSON ilegível deixa de virar {} nos vetos, e a guarda de segredo com a análise morta fecha 20,6% dos comandos reais em vez de 100%"
    narrative: "A leitura do JSON tinha `except Exception: d={}`: comando vazio, exit 0, a falha virando permissão, em 5 vetos. Agora a exceção sobe e cai no modo degradado que merge-gate, protect-main e moat-gate já tinham: fecha pela forma do objeto. A guarda de segredo fechava tudo quando a análise morria, o que também travava o Read do arquivo que diagnosticaria o python; ela herdou a mesma lógica, e isto SUPERA o nó C_ENV_GUARD_FECHA_TUDO_SEM_PYTHON do grafo vetos-fail-closed-2026-10. Medida do corte: 343 comandos citam o nome do arquivo de segredo, 0 fora do corte; numa amostra de 1.500 dos 9.666 fora do corte, o veto inteiro barra 3 (0,2%), todos glob sem ponto (`dir/*`)."
  - id: C_API_DIRETA_SEM_PYTHON_CALA
    node_type: claim
    layer: audit
    plane: DEV
    status: open
