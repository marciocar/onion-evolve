    verified_at: "2026-11-05"
    verified_against: "caso 'api: python3 ausente cala (decisão declarada)' da família, e o bloco de teto do pretooluse-direct-provider-api.sh"
    trace: ".claude/hooks/pretooluse-direct-provider-api.sh"
    label: "sem python3 NENHUM o veto da API direta segue calado, por decisão anterior; com python3 quebrado ou JSON ilegível ele agora fecha se o texto cita URL do provider ativo"
    narrative: "A razão anterior vale: sem python o adapter também não roda, e barrar o curl tiraria a única via. A forma do modo degradado é o nome do provedor numa URL, porque os padrões do provider-hosts.tsv são regex de Python. Gatilho para revisitar: uso real de sessão sem python3 num projeto com provider ativo."
  - id: C_TETO_EXECUTAVEL_NAO_FIXADO
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    verified_at: "2026-11-05"
    verified_against: "leitura dos hooks: `python3`, `jq`, `node` e `bash` resolvidos por PATH; a família prova o caso com um python3 falso à frente do PATH só para o modo degradado"
    trace: ".claude/validation/python-isolated-check.sh"
    label: "TETO: -I isola os imports do interpretador, não fixa QUAL executável roda, e não cobre a sobrescrita do próprio script de hook"
    narrative: "Fora desta cura, sem ampliar o escopo: `python3` e as outras ferramentas por PATH, e o arquivo do hook, que quem escreve no repo pode trocar. Fixar caminho absoluto quebraria o venv de cada adotante; proteger o arquivo é outra guarda. Gatilho: uma medida de PATH ou de escrita em .claude/hooks alcançada dentro de sessão. O desenho candidato é um mod ou veto de escrita naquela pasta, a decidir pelo maestro."
  - id: C_TETO_GATE_DO_GIT
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 3
    confidence: 0.75
    verified_at: "2026-11-05"
    verified_against: "ONION_PYISO_ROOTS=all python-isolated-check.sh --census: 149 invocações sem -I em 38 arquivos, 79 delas na própria bancada e 12 no lint"
    trace: ".githooks/pre-commit"
    label: "TETO: os scripts que o pre-commit e o pre-push executam não entraram: 149 invocações sem -I em 38 arquivos, fora dos hooks da sessão"
    narrative: "Os .githooks em si têm zero invocação. Tirar o -I do escopo aqui foi corte de risco: esses scripts importam yaml, e fazê-lo às cegas exige a bancada inteira, que esta leva não roda. O efeito do módulo sombra no lint fica NÃO MEDIDO: a rodada de controle, no clone limpo, estourou o teto de 280 s sob carga. O comando para retomar o censo está na guarda: ONION_PYISO_ROOTS=all --census."
  - id: C_TETO_LEXICO
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 2
    confidence: 0.8
    verified_at: "2026-11-05"
    verified_against: "cabeçalho de python-isolated-check.sh e casos a1 a a14, c1 a c10 do --selftest"
    trace: ".claude/validation/python-isolated-check.sh"
    label: "TETO: o scanner é léxico; não vê python em variável de nome livre, em bash -c entre aspas simples, em uv run, nem por caminho montado em execução"
    narrative: "Gatilho para revisitar: uma dessas formas aparecer num hook do core. O corte do modo degradado da guarda de segredo tem teto próprio: nome montado por programa ou variável de fora passa, como no veto inteiro."
