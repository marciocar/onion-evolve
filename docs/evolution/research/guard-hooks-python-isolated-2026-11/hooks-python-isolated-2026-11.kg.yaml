  - id: E_CENSO_ANTES_E_DEPOIS
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-11-05"
    verified_against: "python-isolated-check.sh --census na main 940a1d1ff e no head da branch: alcance dos hooks 32 arquivos, 33 invocações, 25 sem -I em 10 arquivos antes e 0 depois"
    trace: ".claude/validation/python-isolated-check.sh"
    label: "censo por token de shell: 25 invocações sem -I no alcance dos hooks, não 43; as outras linhas do grep eram comentário, mensagem, selftest em string e command -v"
    narrative: "O grep literal contava 43 linhas em 13 arquivos porque não filtra comentário. Antes da cura: 8 com -I (a API direta e o censo de versões) e 25 sem, em house-code-gloss, instructions-loaded-log, kg-read-leg, a lib invocation-lines, premodelswitch-guard, env-guard, merge-gate, moat-gate, protect-main, rule-title-in-prose e session-degraded-notice. Os .githooks não invocam python direto: zero. A guarda de segredo NÃO usava -I em parte: a única invocação dela não tinha, e o -I que o texto do arquivo cita é o que ela JULGA no comando alheio."
    provenance:
      source: "docs/evolution/research/guard-hooks-python-isolated-2026-11/hooks-python-isolated-2026-11.kg.yaml"
      locator: "python-isolated-check.sh --census, antes e depois"
