    narrative: "O repo é público e os adotantes herdam os hooks: a cura só protege quem atualizar, e a forma de avisar é decisão do maestro. Fica aberto até a leva sair: o anúncio aos adotantes, a publicação das portas e o que fazer com a evidência fora da árvore."
