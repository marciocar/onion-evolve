    trace: ".claude/hooks/pretooluse-env-guard.sh"
    label: "medido: hook que roda python sem -I importa do diretório de trabalho, e o resultado dele dependia do conteúdo dessa pasta"
    narrative: "Python com -c, - ou -m põe o diretório de trabalho no caminho de importação; com um script, a pasta do script. A causa e a reprodução ficam fora da árvore, por decisão do maestro, enquanto os adotantes não têm a cura. O que importa para quem lê: é classe de ambiente, não de um hook, e a cura é o modo isolado."
