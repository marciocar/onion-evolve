  - id: D_GUARDA_POR_ALVO_DERIVADO
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 4
    confidence: 0.85
    verified_at: "2026-11-05"
    verified_against: "guard-census.sh sem guarda da classe; molde veto-onfailure-check.sh (check de lint com alvo vindo do settings.json); REGRA 115 HARD no core e SOFT no derivado, casos d1 a d3 da família"
    trace: ".claude/validation/lint-artifacts.sh"
    label: "substrato: check de lint, REGRA 115 (Hooks rodam python em modo isolado), com alvo derivado do settings.json e não lista de arquivos"
    narrative: "Hook não serve: o defeito é do texto do script, e o gate é onde o texto se julga. O alvo segue o que os hooks EXECUTAM, pelos tokens do shell. A 1ª redação seguia menção em texto e arrastava 212 arquivos, o gate inteiro, por causa de um caminho citado em mensagem. SOFT no derivado: um hook próprio do adotante cai no alcance, e a atualização do core não deve deixar o gate dele vermelho (cláusula 5 da guard-doctrine). O número pulou o 114, que a branch feat/guard-plugin-write já ocupa."
  - id: E_MODO_ISOLADO_MEDIDO
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-11-04"
    verified_against: "matriz com e sem -I, no 3.15.2 do venv e no 3.12.3 do SO: diretório de trabalho, PYTHONPATH, PYTHONHOME, site do usuário, PYTHONSTARTUP, import yaml, codificação"
    trace: ".claude/hooks/lib/invocation-lines.sh"
    label: "-I cobre diretório de trabalho, PYTHONPATH, PYTHONHOME e site do usuário; PYTHONSTARTUP não age em nenhum dos dois casos fora do modo interativo"
    narrative: "O site do usuário só age no python do SO: num venv ele já está desligado. PYTHONSTARTUP com -c não rodou com nem sem -I, também com PYTHONINSPECT: o caso prende o fato e não tem mutante, porque tirar o -I não muda o resultado. O tokenizador roda por /dev/fd/4: o diretório de trabalho não entra no caminho dele, o PYTHONPATH entra, e é por ali que o mutante dele morre."
    provenance:
      source: "docs/evolution/research/guard-hooks-python-isolated-2026-11/hooks-python-isolated-2026-11.kg.yaml"
      locator: "casos da família hooks_python_isolated"
