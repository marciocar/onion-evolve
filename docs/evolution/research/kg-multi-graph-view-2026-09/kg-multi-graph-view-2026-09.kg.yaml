  - id: Q_KG_MULTI_GRAPH_VIEW_0904
    node_type: question
    plane: DEV
    status: open
    impact: 5
    confidence: 0.7
    label: 'Qual e o mecanismo certo para "N grafos .kg.yaml PEER, 1 visao" no Knowledge Graph SDAAL do Onion, quando um adotante tem 4 verticais soberanas no mesmo repo/dominio (trabalho, saude, relacoes, aprendizado) e as ligacoes cross-vertical hoje sao TEXTO na label, nao arestas? Quatro sub-perguntas: (1) kg-radar.sh ganha --corpus <glob> ou permanece de arquivo unico; (2) referencia cross-arquivo vira aresta de 1a classe, ponteiro tipado com resolver, import de nivel 0, ou nada; (3) kg-backlog-project.sh ja generaliza por marcador ou falta parametrizar a raiz canonica hardcoded; (4) kg-console/kg-view aceitam N arquivos. Segue `open`: a rodada estabeleceu os MECANISMOS e as objecoes medidas, mas quem sela e o maestro — e uma das quatro (a comparabilidade da atencao) revelou um defeito JA VIVO em producao que precisa de decisao propria.'
