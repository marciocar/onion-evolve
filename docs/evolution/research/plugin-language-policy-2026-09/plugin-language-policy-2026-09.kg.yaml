    narrative: "label anterior: DECISAO ABERTA (o maestro sela): qual politica de idioma adotar no canal publico de plugins do Onion, entre (i) superficies geradas em EN + corpos pt-BR, (ii) bilingue por campos (description + description_en; README EN em cima, pt-BR abaixo), (iii) EN integral nas superficies e corpos traduzidos progressivamente, e (i-linha) EN em toda superficie que os geradores EMITEM, definida mecanicamente, com pt-BR abaixo do frontmatter e um README pt-BR separado tambem gerado. RECOMENDACAO DO ELENXO: **REPROVO (i), (ii) e (iii) COMO FORMULADAS e recomendo (i-linha)** — a re-especificacao E a decisao. Tres razoes, cada uma com objecao sobrevivente por tras. (1) A PREMISSA COMUM AS TRES E FALSA, e isso foi MEDIDO agora, nao inferido: \"superficie e gerada, corpo e escrito\" nao descreve este repo — as 8 descriptions de plugin.json sao escritas A MAO (generate-marketplace.sh so copia) e os READMEs gerados imprimem tabelas montadas a partir do `description:` de frontmatter de 134 artefatos embarcados (176 na fonte) mais os argument-hint; o gerador ainda carrega 24 blocos de prosa pt-BR. Logo a fronteira so e implementavel se for definida pelo que o GERADOR EMITE. (2) A METADE PERMISSIVA DA DECISAO E DECLARADA, NAO VERIFICADA: os tres achados que \"liberam\" pt-BR sao TRES RECORTES DA MESMA PAGINA, e silencio de politica corta para os dois lados — a mesma ausencia que nao PROIBE tambem nao prova que nao PENALIZA sob revisao automatica a cada push + selo Verified. Alem disso o unico achado tier 10 de runtime diz que o modo confiavel de fixar idioma e INSTRUCAO EXPLICITA, o que derruba o conforto de (i) e (iii) de que \"o corpo nao importa\". (3) O ARTEFATO QUE A POLITICA EXIGE NAO EXISTE: medi hoje `grep -rc \"Exemplo\" plugins/*/README.md` = 0 nos oito READMEs, contra o requisito de >= 3 exemplos de prompt. Nenhuma das opcoes nomeadas menciona os exemplos, e eles sao a UNICA superficie copiada-e-executada — inclusive pelo revisor que testa se a des