    verified_against: "medido em 2026-10-16 na branch fix/cc-census-measures-bridge-sdk: o cc-delta-census.sh, rodado na VPS sem override, imprime a linha '| SDK `bridge` (CLI embutido, binário --version) | 2.1.301 (SDK 0.3.301) |' ao lado de disco 2.1.302 e processo 2.1.301, e o aviso 'o CLI do SDK bridge (2.1.301, SDK 0.3.301) está 1 versão(ões) publicada(s) atrás do host (2.1.302)'; a fonte é o --version do binário do SDK como a conta onion (sudo -n, em /, ambiente limpo, teto 30 s), cruzado com o claudeCodeVersion do package.json lido como arquivo; os alvos vêm de ops/cc-sdk-targets.tsv (core-only) ou de CC_DELTA_SDK_TARGETS, e sem nenhum dos dois a linha diz 'nenhum alvo declarado'; modo de falha medido ao vivo: conta inexistente e leitura sem a conta saem NÃO MEDIDO com rc e motivo, censo rc 0; bancada run_cc_delta_census_selftests 24/24 com LC_ALL=C, casos (j) a (v) novos; 37 mutantes por ops/mutate-and-restore.sh rodados contra o código final, 32 reprovados e 5 sobreviventes declarados: a recusa por nome root e a por uid 0, cada uma sozinha (uma cobre a outra; as duas juntas reprovam o caso o), o timeout 30 do binário (exigiria um binário que trava), executar o caminho resolvido em vez do declarado (só pesa na janela entre checagem e execução) e a checagem textual de /../ (equivalente: o caminho real é conferido depois); não exercidos pela bancada: o ramo sudo -n -u (medido só no dogfood) e o motivo de teto do pacote; o 1º dogfood achou que o regex de override (CC_DELTA_[A-Z]+) não declarava CC_DELTA_SDK_TARGETS, curado e coberto pelo (n); a passada 1 do refutador (opus) achou que a forma aberta do alvo executava qualquer binário como root (medido lendo o arquivo de senhas do sistema como uid 0), meias-falhas mudas, CRLF e tabs seguidos deslocando colunas, rótulo cru quebrando o YAML do esqueleto e leitura do pacote sem teto; a passada 2 achou que a conta '-' sob root ainda rodava como uid 0 e que só o NOME do caminho era fechado (um claude em qualquer node_modules rodava, e com sudo escalava); curados: sob root a perna do SDK é recusada inteira, os caminhos são resolvidos como a conta, o binário real tem de ficar na mesma árvore node_modules real, ser da conta declarada e não ser gravável por outros, e executa-se o caminho resolvido; fronteira de confiança declarada no cabeçalho: o arquivo de alvos é CÓDIGO, e o binário roda com o poder da conta declarada (a onion não tem sudo, medido por sudo -l -U) ou, com a conta '-', de quem roda o censo; medido também: o medidor e o /meta:cc-update VIAJAM (vendor-manifest.sh --list dá cc-delta-census.sh em adopted, hub, standalone, plugins e source; o mini não), apesar de o comando se declarar Core-only, por isso o caminho da VPS não está no código; suposição declarada: há dois binários-irmãos do SDK (-linux-x64 e -linux-x64-musl, ambos 0.3.301) e o alvo é o glibc, que o SDK prefere num host glibc sem pathToClaudeCodeExecutable fixado"
    narrative: "O delta do E3 passa a dizer a quem chega: a defasagem de 57 versões da r12 teria saído na tabela de versões. A primeira medição já mostrou o host à frente do SDK por uma versão (2.1.302 no disco, publicada depois da r12)."
