  schema_version: "1"
  baseline: "2026-11-12"
  review_after: "2027-02-10"
  purpose: "Medir se o mercado tem nome e campos para um agente ou sessão persistente dona de repo ou componente, coordenada por orquestrador, e o que disso serve ao padrão do Onion de sessão dona por peça (members.yaml kind piece com owner_session, aviso PIECE_UNOWNED no pulso da batuta, card de arranque)."
  # ═══ TETO: 20 NÓS ═══
nodes:
  - id: Q_AGENT_REPO_OWNERSHIP_1112
    node_type: question
    layer: audit
    plane: DEV
    status: done
    impact: 4
    confidence: 0.7
    verified_at: "2026-11-12"
    verified_against: "rodada /onion-research de 2026-11-12: 43 fontes, 16 claims, 12 confirmadas"
    label: "existe em novembro de 2026 um padrão de mercado consolidado, com nome, para agente ou sessão persistente dona de repo ou componente, coordenada por orquestrador?"
    narrative: "Resposta: NÃO há nome de mercado consolidado; a ausência é declarada. O mercado declara dono por spec.owner do Backstage (grupo ou usuário do catálogo, resolvido por manifesto, CODEOWNERS, catalog-info.yaml e organização do GitHub) e, na identidade de agentes, pelos papéis Owner, Sponsor e Manager do Entra Agent ID, sempre com o agente como OBJETO governado e humano ou grupo como dono. AGENTS.md é escopo de instrução sem campo owner; agent teams do Claude Code são experimentais, efêmeros e partição de arquivos por sessão. O que serve ao Onion: espelhar o campo spec.owner (owner_session aponta entidade resolvível), a ordem de resolução com parada na primeira correspondência, e manter um humano Sponsor por peça ao lado da sessão dona; o PIECE_UNOWNED e o card de arranque persistente são cunhagem do Onion sem par de mercado. Origem: pergunta do maestro de 2026-11-12, após D_BACKBONE_OWNER_1112 (onion-messaging dono do backbone com sessão própria)."
    trace: "docs/evolution/research/agent-repo-ownership-2026-11/SYNTHESIS.md"

