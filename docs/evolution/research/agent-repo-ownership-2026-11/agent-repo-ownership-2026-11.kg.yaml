# kg-backlog-guard: on
# Estudo: existe padrão de mercado, com nome, para um agente ou sessão persistente DONO de repositório ou componente?
# Cadência (review_after = baseline + 90d): o tipo dominante é MERCADO (existência de padrão consolidado e
# direção de catálogo e identidade de agentes); as fontes de ferramenta (agent teams experimentais) mudam mais
# rápido, mas a pergunta é se o mercado consolidou um nome, e isso se mede em trimestre.
meta:
