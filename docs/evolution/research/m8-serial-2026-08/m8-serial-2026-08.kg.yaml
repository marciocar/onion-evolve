  - id: C_SERIAL_ACUMULA_CONTEXTO
    node_type: claim
    layer: audit
    plane: DEV
    impact: 4
    confidence: 0.4
    status: open
    label: "APOSTA REBAIXADA PELA REVISAO ADVERSARIAL (2026-08-06), e o rebaixamento e o registro: a versao original afirmava como EVIDENCIA CONFIRMADA que 'o serial acumula contexto e o paralelo e cego', usando o delta 15->4 como prova. NAO E PROVA — os dois itens sao nos DIFERENTES EM ESPECIE DE TAREFA: ENT_whatsapp exige PROVA NEGATIVA (demonstrar que algo nao existe em lugar nenhum do host, caro por natureza), ENT_logto e health-check de container que responde. E a nota repassada economiza UMA OU DUAS chamadas de permissao, nao onze. VARIAVEL CONFUNDIDA, n=1. O QUE A EVIDENCIA SUSTENTA: repassar a nota eliminou a redescoberta do fato sudo/docker; o restante do delta NAO e atribuivel. Direcao plausivel, MAGNITUDE DESCONHECIDA. O QUE FALTA para sustentar: A/B no MESMO no (ENT_whatsapp com e sem nota), ou notas alternadas nos 9 itens (n~4/5), ou — o mais barato — contar quantas das 15 chamadas do item 2 foram probes de permissao: se forem duas, a tese morre. CONSEQUENCIA SE VERDADEIRA: 'serial vs paralelo' teria um terceiro eixo (contexto compartilhado) que o M8 nao mediu"

  - id: E_CUSTO_ERRADO_POR_2X
    node_type: evidence
    layer: audit
    plane: DEV
    impact: 4
    confidence: 1.0
    status: confirmed
    verified_at: 2026-08-06
    verified_against: "697710-tokens-medidos-contra-300k-estimados"
    label: "A ESTIMATIVA DO W3 ERRAVA POR 2,3x, e no sentido que importa. O menu dizia 'Alto: ~300k tokens, meia sessao (vs ~1,4M da corrida cheia)' para o M8 INTEIRO. Medido: so o LADO SERIAL consumiu 697.710 tokens — ja 2,3x a estimativa do item completo. Com o lado paralelo, a corrida projeta ~1,4M, que e exatamente o patamar da corrida cheia que o M8 foi reescopado para EVITAR. O item foi aprovado com um numero que nao se sustentou, e so a execucao disse isso — e essa e a justificativa concreta do contrato de custo do M6: sem carimbo por run, a proxima estimativa erraria igual, sem ninguem notar"

  - id: C_DRIFT_44_PCT_NA_VPS
    node_type: claim
    layer: audit
