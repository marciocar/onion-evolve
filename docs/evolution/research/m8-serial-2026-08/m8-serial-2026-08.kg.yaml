    impact: 5
    confidence: 0.95
    status: confirmed
    verified_at: 2026-08-06
    verified_against: "4-DRIFTED-em-9-medidos-contra-o-host-vivo"
    label: "44% DE DRIFT nas afirmacoes do grafo da VPS (4 DRIFTED em 9), medido contra o host vivo e nao contra doc. Bem acima do limiar de 30% que o proprio /meta:kg-freshness define para acionar juiz adversarial. Os quatro: (1) ENT_substrate — bridge.onionevolve.com esta no label e resolve por DNS, mas NAO tem vhost no Caddy (curl retorna 000); o onion-bridge serve sob app., nao sob bridge. (2) ENT_whatsapp — o nó afirma whatsapp-sender VIVO; busca full-filesystem com sudo nao encontra processo, container, unit systemd nem diretorio, apesar do parecer de 2026-07-05 registrar reinstalacao em ~onion/whatsapp-sender. WAHA, esse sim, confirmado vivo. (3) D_whatsapp_dual_waha_default — o desenho 'dual adapter' tem so UM lado material hoje. (4) D_structured_plan_and_doctrine — a doutrina do catalogo FOI promovida a KB, mas por BYPASS do F0 direto, apos a fase F2 ser formalmente REPROVADA (stack-harmonia-2026-08, sintese com premissas fabricadas); A_analysis_structure segue `open`"

  - id: C_CONTRATO_M6_NAO_COBRE_SERIAL
    node_type: claim
    layer: audit
    plane: DEV
    impact: 3
    confidence: 0.9
    status: open
    label: "O CONTRATO DO M6 ENCONTROU SEU PRIMEIRO LIMITE NO PRIMEIRO USO, e o achado e barato demais para nao registrar: os quatro campos (run_id, tokens, agents, duration_min) pressupoem um run de WORKFLOW — `run_id` e um `wf_xxxxxxxx-xxx`. Esta corrida nao teve Workflow: foram 9 invocacoes seriais da ferramenta Agent, e NAO EXISTE wf_ para carimbar. Preenchi `run_id: serial-2026-08-06-m8` e declarei a natureza no frontmatter, em vez de inventar um id falso ou deixar o campo vazio. QUESTAO ABERTA para o maestro: o contrato deve (a) aceitar um id sintetico com prefixo declarado para modo serial, (b) trocar `run_id` por `run_ref` agnostico ao substrato, ou (c) declarar que so vale para Workflow — e ai o modo serial fica fora da serie historica, que e justamente o modo que o M8 existe para avaliar. A opcao (c) e a unica que se refuta sozinha"

  - id: C_GATILHO_M6_DISPAROU_VERDE
    node_type: claim
    layer: audit
    plane: DEV
    impact: 3
    confidence: 0.5
    status: open
    verified_at: 2026-08-06
    verified_against: "frontmatter-desta-sintese"
    label: "O GATILHO DO M6 PASSOU POR FORMA, NAO POR SUBSTANCIA — e a revisao adversarial mostrou que o nó original (status confirmed, confidence 1.0) tratava isso como aprovacao limpa. NASCEU com os 4 campos: verdade literal. MAS DOIS DELES CARREGAVAM A GRANDEZA ERRADA: `duration_min` recebeu TEMPO-DE-AGENTE (12 min, soma dos 9 usage) quando o contrato define `elapsedMin`, tempo de RELOGIO (37 min) — fator 3 de diferenca, e runs Workflow futuros carimbarao wall-clock e serao comparados com este sem marcador; e `tokens` somou so os SUBAGENTES, quando o contrato pede `budget.spent()` (o run inteiro, incluindo o orquestrador). Pior: a sintese pos 12 no frontmatter e '37 min de relogio' no CORPO — o EXATO modo de falha que o contrato do M6 nomeia ('so a co-locacao no frontmatter responde'), cometido pela primeira sintese a cumpri-lo. CORRIGIDO: duration_min=37, agent_time_min=12 como campo proprio. O registro original abaixo fica porque o erro e o achado.\n\nTEXTO ORIGINAL: O GATILHO DO M6 FOI TESTADO NA PRIMEIRA OPORTUNIDADE E PASSOU. O contrato declarou: 'se a proxima sintese nascer SEM os quatro campos, ai — e so ai — mecanize a emissao automatica'. Esta e a proxima sintese, e ela NASCEU COM os quatro campos. Logo a emissao automatica segue GATED, com razao medida e nao com fe: o contrato escrito bastou. RESSALVA HONESTA, porque sem ela o teste vale pouco: quem escreveu o contrato e quem escreveu esta sintese sao o mesmo agente na mesma sessao — o teste real e a PROXIMA sintese, de outra sessao, que nao viu o contrato nascer. Este resultado e necessario, nao suficiente"

  - id: C_TESTE_FORCADO_NAO_PROVA_O_GATILHO
    node_type: claim
    layer: audit
    plane: DEV
    impact: 4
    confidence: 0.95
    status: open
    label: "O QUE ESTA CORRIDA NAO PROVOU, dito antes que alguem leia demais no resultado: o Passo 0 do fragmento e uma DETECCAO ('SE Workflow indisponivel → acionar fallback'), e eu acionei o caminho serial A MAO, com o Workflow disponivel. Provei o CAMINHO DE CODIGO (os 4 passos executam, o schema se mantem, o fan-in consolida); NAO provei o GATILHO (que a deteccao dispare sozinha quando o substrato cair de verdade). Sao coisas diferentes, e confundi-las seria o mesmo erro de categoria que esta casa ja mede em outro lugar: declarado != verificado. Fechar isso exige um ambiente SEM Workflow — um adotante em outra IDE, ou uma execucao com a ferramenta desabilitada — e segue GATED"
