    narrative: "O QUE A RODADA SUSTENTA, com âncora:\n(1) O modelo certo é DELEGAÇÃO, não impersonation (RFC 8693 §1.1). O agente mantém identidade própria e age representando o solicitante. Isso se expressa com sub=solicitante e act=agente (§4.1) e com may_act como pré-autorização (§4.4). O rascunho WG vivo (wimse-aims-01) usa client_id=agente.\n(2) O bot de credencial única é o confused deputy (Hardy 1988; AWS) e o antipadrão nomeado pela OWASP: LLM06 'privileged account' e ASI03 'Identity Sharing'.\n(3) A OWASP manda: executar no contexto do usuário, impor a autorização a jusante e não no LLM, aprovação humana para ações de alto impacto ou irreversíveis, e logs à prova de adulteração com linhagem POR ATO (ASI08 e T8).\n(4) O NIST AI RMF dá a base de governança do kit: papéis documentados (GOVERN 2.1), papéis humano-IA diferenciados (GOVERN 3.2), mecanismo de desligamento e revogação com responsável (MANAGE 2.4) e política de uso aceitável para chatbots (GV-3.2-003).\n(5) No Slack, o user token é o acesso do usuário. Usá-lo é impersonation e apaga o agente na trilha. O bot não age em nome de ninguém sem user scope.\n\nO QUE A RODADA NÃO SUSTENTA:\n(a) 'Menor entre agente e solicitante' como NORMA. Nenhuma fonte ISO, NIST ou OWASP ancorada enuncia a regra, e a claim que a atribuía à OWASP foi rejeitada. Ela se sustenta como PADRÃO DE MERCADO pela Microsoft Learn ('Both the client and the user must be authorized separately' / 'isn't able to access anything the signed in user couldn't access', medido nesta passada) e como regra de rebaixamento em rascunho WG (wimse-aims §10.6, não ancorada). Deve ser apresentada como composição Onion apoiada em mercado, nunca como 'exigência normativa'.\n(b) 'Aprovação por PAPEL': as fontes pedem aprovação HUMANA. O 'por papel' é escolha de desenho do Onion.\n(c) O KIT DE AUDITORIA como 'o que o auditor pede': sem texto normativo ISO 27001 (5.15, 5.16, 5.18, 8.2, 8.15) nem ISO 42001. Os campos de log e o inventário de contas privilegiadas vêm de guia de vendedor, com risco concreto de atribuição errada (a lista de campos de 8.15 é orientação da 27002, não requisito do Anexo A).\n(d) O token como 'trilha por ato'. O token registra a delegação; a trilha por ato exige log por chamada (ASI08).\n(e) Identidade pelo evento autenticado do Slack, is_ext_shared e Slack AI agindo com permissão do usuário: sem âncora.\n(f) O estado IETF de novembro de 2026: precisa ancorar draft-ietf-wimse-aims-01.\n\nPRÓXIMA RODADA, na ordem do valor:\n1. Ancorar draft-ietf-wimse-aims-01 §4, §10.3, §10.5.1 e §10.6 e a página Microsoft permissions-consent-overview, para fechar o lado mercado e IETF do menor-entre.\n2. Fonte primária, ou ao menos texto oficial da ISO, para 27001 A.5.15, A.5.16, A.5.18, A.8.2 e A.8.15, para 27002 §8.15 e para o Anexo A da ISO/IEC 42001. Se forem inalcançáveis por serem pagas, declarar o kit como 'mapeamento Onion para controles', não como 'exigência da norma'.\n3. Slack: conversation object (is_ext_shared), segurança da Events API (assinatura do request e o campo user do evento) e documentação de agentes e Slack AI.\n\nNenhum descarte por orçamento: as lacunas acima ficam abertas como objeções sobreviventes."
