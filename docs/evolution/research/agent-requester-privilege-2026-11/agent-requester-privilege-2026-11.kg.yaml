  - id: E_RFC8693_ACT_NO_EXP_AUD
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.9
    verified_at: "2026-11-13"
    verified_against: "'non- identity claims (e.g., \"exp\", \"nbf\", and \"aud\") are not meaningful when used within an \"act\" claim and are therefore not used.' · RFC 8693 §4.1 · ancorada por verificador independente"
