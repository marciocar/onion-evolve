# kg-backlog-guard: on
# Grafo da rodada de primárias agent-requester-privilege (/onion-research, modo primárias, 2026-11-13).
# Pergunta: como um agente que atende várias pessoas age com o privilégio de quem pediu (delegação, menor-entre,
# identidade pelo evento, on_behalf_of, aprovação, trilha por ato), e o que uma auditoria pede. Este grafo nunca sela;
# as ligações com o corpus vão em external_edges (contrato v4.3), sem editar os grafos antigos.
meta:
  id: agent-requester-privilege-2026-11
  schema_version: "1"
  baseline: "2026-11-13"
  review_after: "2027-02-11"   # 90d: o tipo DOMINANTE é PADRÃO DE MERCADO. O que move os vereditos é o rascunho WG
                               # draft-ietf-wimse-aims (ciclo de ~6 meses), a doc de plataforma (Microsoft, Slack) e a
                               # versão anual da OWASP. RFC 8693, Hardy e NIST valeriam 12 meses, mas não movem a revisita;
                               # 30d (ferramenta) giraria sem mudança nas fontes que decidem.
  # ═══ TETO: 73 NÓS ═══
  #   +5 (2026-11-13, no PR): T_OWASP_LLM06, T_OWASP_ASI03, T_OWASP_ASI08, T_OWASP_AGENTIC_THREAT_T8 e T9,
  #   um termo x_term por código OWASP que o lint de nomes do pr-finalize reprovou sem termo.
  # Justificativa do teto: rodada de primárias executada em 2026-11-13, grafo novo. 68 nós: 35 evidências ancoradas
  # (1 por claim), 15 objeções sobreviventes do Elenxo (1 por alvo), 13 superações achadas (9 das rejeitadas na
  # ancoragem e 4 do Elenxo), 1 contabilidade (E_LACUNAS_AGENT_REQUESTER_PRIVILEGE_1113), 1 pergunta raiz, 2 claims-hipótese da
  # pergunta (menor-entre e base normativa do kit) e 1 claim com a recomendação íntegra do Elenxo. As 10 claims
  # rejeitadas não viram nó: entram na contabilidade.
  purpose: "Responder, com âncora verbatim, qual o padrão de mercado e normativo de 2026-11 para o agente multiusuário agir com o privilégio de quem pediu, e separar o que é norma, o que é prática de mercado e o que é composição Onion no kit de auditoria."
