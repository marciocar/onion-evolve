  - id: E_AWS_CONFUSED_DEPUTY_DEFINITION
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-11-13"
    verified_against: "'The confused deputy problem is a security issue where an entity that doesn't have permission to perform an action can coerce a more-privileged entity to perform the action.' · AWS IAM User Guide, 'The confused deputy problem', parágrafo de abertura · ancorada por verificador independente"
