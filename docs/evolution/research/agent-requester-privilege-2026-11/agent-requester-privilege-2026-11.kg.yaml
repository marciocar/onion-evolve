    edge_type: TRACES_TO
nodes:
  - id: Q_AGENT_REQUESTER_PRIVILEGE_1113
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.9
    label: "Como um agente que atende várias pessoas (ex.: bot de Slack) age com o privilégio de quem pediu, e não com um privilégio próprio único? Qual o padrão de mercado e normativo em 2026-11, e o que uma auditoria pede?"
    narrative: "Pergunta original: Como um agente de IA que atende várias pessoas de uma organização (ex.: bot de Slack) deve agir com o privilégio de quem pediu, em vez de um privilégio próprio único: privilégio efetivo = menor entre agente e solicitante, identidade pelo evento autenticado, on_behalf_of real, aprovação por papel e trilha de auditoria por ato. Qual o padrão de mercado e normativo em novembro de 2026, e que documentos e registros uma auditoria pede (kit de auditoria para a família Onion)? Corpus prévio: o estudo de camadas de liberação (ENT_AUTH_LAYERS), C_FATIGUE_IS_SECURITY e REF_3_EXTERNAL_IS_IRREVERSIBLE; nada sobre delegação OAuth, confused deputy, OWASP LLM06, ISO 27001, ISO 42001 ou NIST AI RMF aplicados a agente que age em nome de usuário."
    trace: "pergunta original do run /onion-research em modo primárias, 2026-11-13"
  - id: E_RFC8693_IMPERSONATION_INDISTINGUISHABLE
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: "2026-11-13"
    verified_against: "'When principal A impersonates principal B, A is given all the rights that B has within some defined rights context and is indistinguishable from B in that context.' · RFC 8693 §1.1 · ancorada por verificador independente"
    valid_from: "2020"
    source_tier: 10
    source_kind: primary
    label: "Na RFC 8693, impersonation dá ao agente todos os direitos do solicitante e o torna indistinguível dele: um bot que usa o token de quem pediu apaga a própria identidade na trilha."
    narrative: "Claim 1 [rfc8693]. Citação verbatim: \"When principal A impersonates principal B, A is given all the rights that B has within some defined rights context and is indistinguishable from B in that context.\". Elenxo (alvo 1): a objeção não sobreviveu. A extensão 'apaga a identidade do agente na trilha' é inferência, apoiada pela frase do Slack 'Write actions with user tokens are performed as if by the user themselves.' (ver C_SUPERACAO_20261113_SLACK_USER_WRITE_AS_USER)."
    trace: "https://www.rfc-editor.org/rfc/rfc8693"
    provenance:
      source: "https://www.rfc-editor.org/rfc/rfc8693"
      locator: "RFC 8693 §1.1"
      method: "reading: citação verbatim conferida na fonte, ancorada por verificador independente"
      locality: "web"
  - id: E_RFC8693_DELEGATION_SEPARATE_IDENTITY
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: "2026-11-13"
    verified_against: "'With delegation semantics, principal A still has its own identity separate from B, and it is explicitly understood that while B may have delegated some of its rights to A, any actions taken are being taken by A representing B.' · RFC 8693 §1.1 · ancorada por verificador independente"
    valid_from: "2020"
    source_tier: 10
    source_kind: primary
    label: "Na delegação (RFC 8693), o agente mantém identidade própria, separada da do solicitante; os atos são do agente representando o solicitante. É o modelo on_behalf_of."
    narrative: "Claim 2 [rfc8693]. Citação verbatim: \"With delegation semantics, principal A still has its own identity separate from B, and it is explicitly understood that while B may have delegated some of its rights to A, any actions taken are being taken by A representing B.\". Elenxo (alvo 2): a objeção não sobreviveu; a citação prova a separação de identidades que o modelo on_behalf_of precisa. Tier: o leitor não declarou tier nesta claim; 10 é o tier que ele declarou para o mesmo documento."
    trace: "https://www.rfc-editor.org/rfc/rfc8693"
    provenance:
      source: "https://www.rfc-editor.org/rfc/rfc8693"
      locator: "RFC 8693 §1.1"
      method: "reading: citação verbatim conferida na fonte, ancorada por verificador independente"
      locality: "web"
  - id: E_RFC8693_ACT_CLAIM_IDENTIFIES_ACTOR
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: "2026-11-13"
    verified_against: "'The \"act\" (actor) claim provides a means within a JWT to express that delegation has occurred and identify the acting party to whom authority has been delegated.' · RFC 8693 §4.1 · ancorada por verificador independente"
    valid_from: "2020"
    source_tier: 10
    source_kind: primary
    label: "A claim act (RFC 8693) expressa no JWT que houve delegação e identifica o ator; o sujeito do token continua sendo o solicitante e o agente aparece como ator."
    narrative: "Claim 3 [rfc8693]. Citação verbatim: \"The \"act\" (actor) claim provides a means within a JWT to express that delegation has occurred and identify the acting party to whom authority has been delegated.\". Elenxo (alvo 3): a objeção não sobreviveu; que sub continua sendo o sujeito é a estrutura do próprio exemplo de §4.1."
    trace: "https://www.rfc-editor.org/rfc/rfc8693"
    provenance:
      source: "https://www.rfc-editor.org/rfc/rfc8693"
      locator: "RFC 8693 §4.1"
      method: "reading: citação verbatim conferida na fonte, ancorada por verificador independente"
      locality: "web"
  - id: E_RFC8693_NESTED_ACTORS_INFORMATIONAL
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-11-13"
    verified_against: "'Prior actors identified by any nested \"act\" claims are informational only and are not to be considered in access control decisions.' · RFC 8693 §4.1 · ancorada por verificador independente"
    valid_from: "2020"
    source_tier: 10
    source_kind: primary
    label: "Na RFC 8693 só as claims de topo e o ator corrente entram na decisão de acesso; atores anteriores, na cadeia act aninhada, são só informativos."
    narrative: "Claim 4 [rfc8693]. Citação verbatim: \"Prior actors identified by any nested \"act\" claims are informational only and are not to be considered in access control decisions.\". Elenxo (alvo 4): a objeção não sobreviveu. Consequência para o kit: na cadeia agente→subagente só o ator corrente decide, e a cadeia inteira tem de ir para o log de auditoria, porque o token não a torna vinculante."
    trace: "https://www.rfc-editor.org/rfc/rfc8693"
    provenance:
      source: "https://www.rfc-editor.org/rfc/rfc8693"
      locator: "RFC 8693 §4.1"
      method: "reading: citação verbatim conferida na fonte, ancorada por verificador independente"
      locality: "web"
