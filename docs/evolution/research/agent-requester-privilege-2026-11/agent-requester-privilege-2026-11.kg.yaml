    label: "Na RFC 8693, as claims dentro de act só identificam o ator: exp, nbf e aud não valem ali, então validade e audiência ficam no token externo."
    narrative: "Claim 6 [rfc8693]. Citação verbatim: \"non- identity claims (e.g., \"exp\", \"nbf\", and \"aud\") are not meaningful when used within an \"act\" claim and are therefore not used.\". Elenxo (alvo 6): a objeção não sobreviveu; consequência de desenho: validade e audiência ficam no token externo. Tier: o leitor não declarou tier nesta claim; 10 é o tier que ele declarou para o mesmo documento."
    trace: "https://www.rfc-editor.org/rfc/rfc8693"
    provenance:
