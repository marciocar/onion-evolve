    status: confirmed
    impact: 4
    confidence: 0.85
    verified_at: "2026-11-13"
    verified_against: "'The \"may_act\" claim makes a statement that one party is authorized to become the actor and act on behalf of another party.' · RFC 8693 §4.4 · ancorada por verificador independente"
    valid_from: "2020"
    source_tier: 10
    source_kind: primary
    label: "A claim may_act (RFC 8693) declara quem está autorizado a virar ator em nome de outro: pré-autorização que o servidor de autorização confere na troca de token."
    narrative: "Claim 5 [rfc8693]. Citação verbatim: \"The \"may_act\" claim makes a statement that one party is authorized to become the actor and act on behalf of another party.\". Elenxo (alvo 5): a objeção sobreviveu, triagem limite; ver E_OBJECAO_MAY_ACT_NOT_LESSER_OF. may_act diz QUEM pode agir, não o escopo do token emitido, que a RFC deixa à política do servidor."
    trace: "https://www.rfc-editor.org/rfc/rfc8693"
    provenance:
      source: "https://www.rfc-editor.org/rfc/rfc8693"
      locator: "RFC 8693 §4.4"
