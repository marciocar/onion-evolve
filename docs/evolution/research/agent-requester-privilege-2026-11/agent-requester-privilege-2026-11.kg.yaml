    narrative: "FONTES: lidas (8): rfc8693, oauth-ai-agents, confused-deputy, owasp-llm06, owasp-agentic, iso27001-controls, iso42001-nist-rmf, slack-platform. Inalcançáveis: 0. CLAIMS: 35 ancoradas, cada uma virou nó evidence; 10 REJEITADAS na ancoragem (10 EXAGERADA), que nunca viram nó. ELENXO: 38 objeções (35 claims + 3 globais); 15 sobreviventes modeladas como E_OBJECAO (5 bloqueiam: alvos 9, 10, 27 e as globais do menor-entre e do kit; 10 limitam: alvos 5, 8, 13, 15, 18, 24, 25, 28, 35 e a global de atualidade); 23 não sobreviveram, e a evidência delas está na narrativa do alvo. Objeções RECUSADAS pelo motor (sobreviveram sem critério pré-registrado ou sem superação): 0; nenhum alvo fica não-julgado por recusa. SUPERAÇÕES: 13 nós C_SUPERACAO_20261113 (9 das rejeitadas na ancoragem, com TRACES_TO para este nó; 4 do Elenxo, para o E_OBJECAO respectivo: alvos 5, 9, 15 e a global do menor-entre). LACUNAS FECHADAS (3): rfc8693 — claims 1-6: impersonation x delegation (§1.1), act (§4.1), atores aninhados só informativos, may_act (§4.4), exp/nbf/aud fora de act · owasp-llm06 — claims 16-21: excessive permissions e autonomy, executar no contexto do usuário (citação possivelmente truncada, limite), human-in-the-loop, complete mediation, antipadrão da conta privilegiada · owasp-agentic — claims 22-26: ASI03 (lacuna de atribuição, Identity Sharing, token amarrado à intenção) e T8/ASI08 (repúdio, logs à prova de adulteração com linhagem por ato); identity spoofing (T9) só pelo locator da claim 26. LACUNAS QUE CONTINUAM ABERTAS (5): oauth-ai-agents — PARCIAL: só rascunhos individuais expirados ou substituídos (on-behalf-of-user-02, klrc-00); o sucessor vivo draft-ietf-wimse-aims-01 (WG Document do wimse, 02/11/2026, sub=usuário, client_id=agente, §10.6 'can never exceed') foi achado por WebFetch, mas não ancorado por um segundo agente · confused-deputy — PARCIAL: definição fechada (Hardy e AWS), mas a mitigação canônica por capability de Hardy foi REJEITADA na ancoragem; a única mitigação ancorada (AWS SourceArn) é por recurso ou conta, não pela pessoa solicitante · iso27001-controls — ABERTA: 5.15, 5.16 e 5.18 sem nenhuma claim ancorada (as de 5.15 foram rejeitadas); 8.2 e 8.15 só por interpretação de guia de vendedor, sem texto normativo; 'o que o auditor pede' sem fonte primária · iso42001-nist-rmf — PARCIAL: NIST AI 100-1 e 600-1 ancorados (GOVERN 2.1/3.2, MANAGE 2.4, GV-3.2-003); ISO/IEC 42001 com zero claims · slack-platform — PARCIAL: user token, user scope do bot e is_ultra_restricted ancorados; is_ext_shared ausente; is_restricted e is_stranger só parafraseados; Slack AI/agentes com permissão do usuário ausente; identidade pelo evento autenticado (app_mention.user/authorizations) REJEITADA. REJEITADAS NA ANCORAGEM, com o motivo do verificador: (1) [confused-deputy] Hardy descarta remendos baseados em listas de acesso: regras de abertura de arquivo chegaram a 14 operadores booleanos e cada cláusula nova quebrava programas seguros ou legítimos; é argumento contra checagem de nome ou lista. VEREDITO EXAGERADA: a citação aparece literal e os 14 operadores são exatos, mas o claim troca as causas (cláusula permissiva gera problema de segurança em programa seguro; restrição quebra programa legítimo) e 'listas de acesso' só aparece como arquitetura e como exercício ao leitor. [motivo do verificador truncado pelo motor; não completado de memória] (2) [confused-deputy] Mitigação canônica de Hardy: a capability une designação e autorização; cada ato usa a capability entregue pelo solicitante e o deputado só age com o que foi explicitamente designado. VEREDITO EXAGERADA: a ideia de unir designação e autorização é fiel, mas no mesmo parágrafo o compilador recebe capability PRÓPRIA para o arquivo de estatísticas; só a depuração usa a do invocador. A exigência é designar explicitamente qual autoridade se usa. [motivo truncado pelo motor; não completado de memória] (3) [owasp-agentic] ASI03 prevê autorização por ação via motor de política central, o que sustenta checar o menor privilégio entre agente e solicitante a cada ato. VEREDITO EXAGERADA: a citação existe (item 3, p.17), mas só pede reverificar cada passo privilegiado num motor central; grep por intersection, requester, requesting user, lesser of e on-behalf-of dá 0 ocorrências. O menor-entre é inferência do leitor. (4) [iso27001-controls] INTERPRETAÇÃO DO GUIA: o 5.15 pede política de controle de acesso desenvolvida, documentada e revisada periodicamente; é o documento-base que uma auditoria pede primeiro. VEREDITO EXAGERADA: a quote é prosa do artigo; 'documento-base que uma auditoria pede primeiro' não está no trecho. (5) [iso27001-controls] INTERPRETAÇÃO DO GUIA: o acesso privilegiado, que vai além do usuário comum, deve ser monitorado e auditado. Isso vale para um agente que opera com privilégio próprio. VEREDITO EXAGERADA: o bullet trata de 'users'; a aplicação a agentes é inferência do leitor (a página não menciona agentes de IA, contas de serviço ou bots). (6) [iso27001-controls] INTERPRETAÇÃO DO GUIA: a autorização deve ser formal, documentada e dada por pessoal competente. Isso corresponde à aprovação por papel. VEREDITO EXAGERADA: o texto diz 'appropriate personnel'; 'corresponde à aprovação por papel' é mapeamento do leitor, não há papéis nem matriz de papéis. (7) [iso42001-nist-rmf] O Perfil GenAI exige procedimento de escalonamento quando os critérios de desativação são atingidos e revisão desses critérios contra a tolerância a risco; juntos dão trilha de auditoria e registro de incidente do agente. VEREDITO EXAGERADA: MG-2.4-002 existe, mas são 'Suggested Actions'; a revisão contra tolerância está em MG-2.4-004, fora do locator; 'trilha de auditoria' e 'registro de incidente' não saem desses textos. [motivo truncado pelo motor; não completado de memória] (8) [slack-platform] Bot token pertence ao app, não a uma pessoa: privilégio próprio único, sem identidade do solicitante. VEREDITO EXAGERADA: a citação sustenta 'pertence ao app'; 'privilégio próprio único' e 'sem identidade do solicitante' são inferência. (9) [slack-platform] Ações com user token são executadas como se fossem do próprio usuário, ou seja, atribuídas a ele. VEREDITO EXAGERADA: a citação só diz 'on behalf of users'; 'as if by the user' está em outra frase da seção, e 'atribuídas' é acréscimo do leitor. (10) [slack-platform] O evento app_mention identifica o solicitante pelo campo user e traz authorizations com team_id; a página mostra isso só em exemplos, sem definir semântica. VEREDITO EXAGERADA: a frase citada é requisito de instalação do bot e não sustenta nada sobre user, authorizations ou team_id; o claim se apoia no exemplo de payload, e 'user identifica o solicitante' é leitura do exemplo."
