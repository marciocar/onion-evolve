    verified_against: 'Lacuna declarada pelo worker do eixo HOOKS, verbatim: "Nao encontrei nenhuma entrada no delta 2.1.263->2.1.278 que mude o contrato de exit code de hooks (0/2/outro)". Os 8 achados aprovados do eixo tocam tipo `prompt` de Stop hook, timeout de SessionEnd, PermissionRequest em --print e matcher de SubagentStop — nenhum toca o veto por exit 2.'
    trace: 'docs/onion/graph/onion-identity-2026-07.kg.yaml'
    label: 'AUSENCIA MEDIDA E RESULTADO, NAO SILENCIO. A doutrina de identidade deste repo diz que o `exit 2` deterministico de hook — que barra a acao inclusive sob `bypassPermissions` — e A CAPACIDADE QUE COMPRA o acoplamento ao Claude Code. Em 15 versoes, NADA no delta toca esse contrato. Vale dizer o que isto cobre e o que nao: cobre a JANELA medida, por leitura de changelog; nao e prova de estabilidade futura nem substitui observar o veto ao vivo (que esta sessao nao re-mediu — o ultimo veto observado foi em 2026-09-02).'
