    verified_against: 'Rodada 5 executada em 2026-09-21 com o processo da sessao em 2.1.278 (medido: `claude --version`). Delta de 15 versoes (2.1.263..2.1.278, 799 linhas) extraido do changelog local; 6 eixos em fan-out + juiz adversarial por achado; 39 aprovados / 2 reprovados / 27 lacunas declaradas. Dados em data/f1-scan-juizo.json.'
    trace: 'docs/onion/radar-baselines.yaml · projeção: docs/evolution/research/radar-E3-2026-09-21-r5/SYNTHESIS.md'
    label: 'O QUE MUDOU NO CLAUDE CODE ENTRE 2.1.261 E 2.1.278 QUE ALTERA A ADEQUACAO DA ESTRATEGIA DO ONION. RESPOSTA CURTA: dos 39 achados aprovados, 24 sao NADA MUDA e 15 mexem em alguma coisa — mas o de maior consequencia nao veio do changelog lido, e sim de OBSERVAR o binario, que e exatamente o que a rodada anterior nao pode fazer. O eixo que mais rendeu foi PERMISSOES (9), seguido de HOOKS (8) e PLUGINS (7). O `exit 2` deterministico — a capacidade que a doutrina desta casa diz COMPRAR o acoplamento ao Claude Code — segue INALTERADO nesta janela: nenhuma entrada do delta toca o contrato de exit code de hook. Isso e um resultado, nao um nao-achado: a tese do acoplamento continua de pe por medicao, nao por fe.'

  - id: E_TASK_TOOLS_A_FORMA_DO_GATE_MUDOU_O_DESLIGAMENTO_NAO
    node_type: evidence
    plane: PROD
    impact: 2
    confidence: 1.0
    status: confirmed
    source_tier: 8
    source_kind: changelog-local+corpus
    verified_at: '2026-09-21'
    verified_against: 'Duas linhas do MESMO changelog local, e a segunda e a que importa: l.646 (2.1.268) "Changed the task-tracking tools ... to be offered only on Claude 3.x, Opus 4.0-4.7, Sonnet 4.0-4.6, Haiku 4.5" e l.1645 (2.1.233) "Todo/task-tracking tools ... are no longer available on Opus 4.8, Sonnet 5, Fable 5, Mythos 5, and newer models; set CLAUDE_CODE_ENABLE_TODO_TOOLS=1". Contagem REAL no repo, excluindo `.claude/worktrees/` (copias transitorias de outros agentes) e com palavra inteira: TodoWrite 83 ocorrencias em 56 arquivos; TaskCreate, TaskUpdate e TaskList ZERO. Medicao de comportamento pelo refutador, em worktree isolada: com `CLAUDE_CODE_ENABLE_TODO_TOOLS=0` e `--model opus`, `TodoWrite` some da lista, e um agente que o declara em `tools:` (`@mermaid-specialist`) RODA SEM ERRO (36.654 tokens, 8,9s).'
    trace: '.claude/settings.json'
    label: 'O DELTA AQUI E A FORMA DO GATE, NAO O DESLIGAMENTO — e a versao anterior deste no afirmava o contrário, com numeros inventados. O desligamento das task tools para o lineup desta casa e de 2.1.233, TRINTA E CINCO versoes antes desta janela, e o corpus ja o media por DOGFOOD em 2026-08-16 (`claude-code-2.1-onion-2026-08`, sessao headless com opus-5 respondendo `TASK_TOOLS_AUSENTES`). A 2.1.268 so trocou "off acima de 4.8" por uma allowlist fechada por faixa. CONSEQUENCIA REAL: pequena. O framework nao depende dessas ferramentas — `TaskCreate`/`TaskUpdate`/`TaskList` dao ZERO em `.claude/`, e `TodoWrite` aparece em 83 ocorrencias que sao sobretudo campo `tools:` de agente. Com a variavel desligada a ferramenta some e o artefato NAO quebra: medido. O que fica, e nao e nada: o escape vive no `~/.claude/settings.json` PESSOAL do maestro, entao o comportamento desta maquina difere do de um adotante — diferenca real, consequencia pequena.'
    provenance:
      source: "CHANGELOG oficial do Claude Code (github.com/anthropics/claude-code/blob/main/CHANGELOG.md)"
      locator: "## 2.1.268 'Changed the task-tracking tools… offered only on Claude 3.x, Opus 4.0–4.7…' · ## 2.1.233 'no longer available on Opus 4.8, Sonnet 5…'"
      method: "leitura: CHANGELOG 2.1.268 e 2.1.233"
      locality: "web"

