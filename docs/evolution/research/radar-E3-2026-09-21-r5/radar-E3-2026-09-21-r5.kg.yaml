    verified_against: '`claude respawn --help` no binario 2.1.278, verbatim: "Restart a background session (or all of them) so it picks up the current Claude binary." Aceita `<id>` ou `--all` e NENHUMA opcao. PROVENIENCIA medida no changelog: introduzido em 2.1.251 (l.1106), corrigido em 2.1.145 (l.3344) — FORA desta janela. Teto confirmado por refutador: nem o `--help`, nem `claude --help` l.285, nem o changelog abrem caminho para sessao em PRIMEIRO PLANO.'
    trace: 'docs/onion/radar-baselines.yaml'
    label: "JÁ EXISTIA: `claude respawn` entrou no `claude --help` na 2.1.251 e tinha correção desde a 2.1.144, disponível na sessão de 09-20 que tratou a deriva 2.1.276→2.1.278 como sem saída. Achado de USO, não de delta. Teto: reinicia sessão de BACKGROUND; o 1º plano não foi medido."
    narrative: "label anterior: O COMANDO JA EXISTIA — O QUE ERA NOVO ERA A MINHA IGNORANCIA, e isso muda o que este no vale. `respawn` entrou no `claude --help` na 2.1.251 (changelog l.1106) e ja tinha correcao em 2.1.145 (l.3344): estava disponivel DURANTE a rodada 4 e DURANTE a sessao de 2026-09-20 que tratou a deriva de versao como se nao tivesse saida. No delta de 799 linhas a palavra aparece UMA vez, sobre outro assunto. Registro como achado de USO, nao de delta: a casa gastou uma decisao do maestro (quando encerrar a sessao) num problema que tinha comando. A REGRA 65 acusou a sessao inteira que o processo rodava 2.1.276 com 2.1.278 no disco, e a unica saida conhecida era encerrar e reabrir — o que custou contexto e obrigou o maestro a decidir QUANDO fechar. `claude respawn` reinicia sessao de BACKGROUND para pegar o binario atual. TETO DECLARADO, e ele e o que impede isto de virar promessa: o texto fala em sessao de background; NAO medi se alcanca a sessao interativa em primeiro plano, que era o caso real. Gatilho para fechar a lacuna: a proxima deriva de versao — tentar `respawn` antes de propor `/exit`."
