meta:
  id: radar-E3-2026-09-21-r5
  schema_version: "1"
  baseline: 2026-09-21
  review_after: 2026-11-05   # radar de mundo: cadencia 45d (REGRA 65/67)

  x_supersedes_none: >
    Esta rodada nao derrubou no nenhum da BASELINE ANTERIOR do eixo E3, que e a
    `radar-E3-2026-09-04-r4` — e nomear o grafo certo importa, porque a 1a versao desta
    declaracao mirava o `claude-code-2.1-onion-2026-08`, que NUNCA foi baseline do E3 (o
    ponteiro do eixo passou por maestro-vivo -> 09-02 -> 09-03 -> 09-04 -> r4 -> r5). Contra a
    r4 a r5 CORRIGE uma atribuicao sem derrubar a claim: a r4 atribuiu a ausencia de sinal de
    mercado a "o fan-out nao teve worker de mercado"; a r5 rodou worker de mercado e ainda achou
    sinal fraco, deslocando a causa para o roster de fontes. Isso e refinamento de CAUSA, nao
    Aufhebung de conclusao — nenhum no da r4 fica falso.
    Sobre o corpus `claude-code-2.1-onion-2026-08` (2.1.211-233), que nao e baseline mas e o que
    a REGRA 67 acusa como vencido: a r5 tampouco o derruba. Ela CONCORDA com ele onde toca — o no
    E_TASK_TOOLS_A_FORMA_DO_GATE_MUDOU_O_DESLIGAMENTO_NAO re-mede no repo o que aquele corpus
    afirmara (Task* = ZERO) e o cita como autoridade. A 1a versao desta declaracao dizia que o
    corpus "NAO foi re-medido aqui", e isso era exagero: um no o re-mede em parte. O correto e
    mais estreito: a r5 nao re-mediu o corpus INTEIRO e nao contradisse nada dele.
    CONSEQUENCIA QUE FICA NOMEADA: por isso a REGRA 67 acusa revisita vencida naquele corpus e
    vai acusar de novo — o que falta ali nao e a ARESTA, e a MEDICAO. A cura e revisitar
    (`/onion-research --revisit`), nao carimbar. Registrado em 2026-09-23 conduzindo o
    /meta:drive; corrigido no mesmo dia depois que a passada adversarial mostrou os dois furos.

