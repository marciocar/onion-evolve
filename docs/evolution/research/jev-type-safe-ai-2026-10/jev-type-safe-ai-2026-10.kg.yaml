  # (E_SOURCE_TIER_INFLATED). Isto e CORRECAO, nao desconfianca: duas das claims mais load-bearing da rodada
  # (preco e "0 hallucinations") sao do REVENDEDOR e CONTRADIZEM o fabricante.
  #
  # Corpus previo (clausula 0): 109 grafos, 3.793 nos, NENHUM mencionando JEV nem type-safe AI. O corpus
  # devolveu interface-state-of-art e classification-por-vertical por COLISAO de termos genericos
  # (arquitetura, estado da arte, concorrentes, futuro), nao por relacao. Tratado como AUSENCIA de corpus:
  # nada a transferir, tudo a descobrir — por isso nao ha SUPERSEDES/REFUTES cross-grafo nesta rodada
  # (ausencia MEDIDA, nao esquecimento). O radar so enxerga arestas DENTRO de um arquivo: os vizinhos que
  # PODEM se relacionar na rodada de decisao vao por trace: em Q_ONION_COULD_BECOME_THIS
  # (C_INTERFACE_IS_LINE, C_COLLAPSE_CREATES, E_AUTOMODE_GATE).
  #
  # ESTA RODADA NAO SELA NADA. Estado da arte, concorrentes e a decisao sobre o Onion ficam para a rodada
  # seguinte, e o que esta rodada aprendeu sobre elas esta nos nos Q_ (proposta), nunca em decision.
