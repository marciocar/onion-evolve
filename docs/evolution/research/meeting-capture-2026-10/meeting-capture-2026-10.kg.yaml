    label: "Falta o grafo de CONSOLIDAÇÃO entre reuniões (o papel do @meeting-consolidator em arestas) e o gate de reunião fora do comando: hoje o meeting-graph-check.sh só roda quando o extract o chama, não no lint do repo que guarda as reuniões."
    x_gatilho: "entra em plano quando houver 2 ou mais grafos de reunião reais num repo (o consolidado precisa de matéria) ou quando um grafo de reunião editado à mão escapar do gate."
    trace: ".claude/commands/product/consolidate-meetings.md"

