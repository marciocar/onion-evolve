    node_type: decision
    impact: 4
    confidence: 0.7
    label: "ABSORVER POR REESCRITA o modelo aviso ≠ consentimento do anarlog, em pt-BR, como campos do grafo de cada reunião: tentativa de aviso registrada, resposta por participante, parar na recusa, nunca declarar consentimento legal."
    trace: ".claude/validation/meeting-graph-check.sh"
    status: done
    plane: DEV
    verified_at: "2026-10-16"
    verified_against: "decisão do maestro em 2026-10-16, por pergunta com opções (/meta:decide): escolhida «Absorver por reescrita (Recomendado)»"
    narrative: |-
      Proposto pela curadoria (P_CONSENT_EVIDENCE_REWRITE no grafo da dissecação do anarlog, fonte: meeting-consent.ts e a migration session_consent_evidence do anarlog no pin e8a9dec). Independe do app: serve a qualquer modo de entrada (bot, extensão, captura local, arquivo, API nativa). A reescrita vive no esquema do grafo de reunião do /product:extract-meeting e é cobrada pelo meeting-graph-check.sh: SEM-TENTATIVA-DE-AVISO, PARTICIPANTE-SEM-RESPOSTA, RECUSA-SEM-PARADA, CAPTURA-APOS-RECUSA e CONSENTIMENTO-LEGAL-DECLARADO. Nenhuma linha do anarlog foi copiada: os nomes e o enum de respostas (ciente, recusou, sem_resposta, autora_do_aviso) são do Onion.

      Selado por /meta:decide em 2026-10-16: escolhida «Absorver por reescrita (Recomendado)»; descartadas: «Só um campo livre de consentimento».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-10-16: «Modelo aviso ≠ consentimento do anarlog (P_CONSENT_EVIDENCE_REWRITE): absorver por reescrita como campos do grafo de cada reunião? [texto da pergunta reconstruído do tema pela triagem; o literal não chegou ao agente que selou]»"
