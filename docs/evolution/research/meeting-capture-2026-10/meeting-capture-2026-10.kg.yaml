  - id: Q_CAPTURA_WINDOWS_CLIENTE_VPS_SERVIDOR_1016
    node_type: question
    plane: DEV
    status: open
    impact: 5
    confidence: 0.4
    label: "Máquina de captura: o maestro usa Windows como cliente e quer a VPS como servidor principal (extensão de navegador ou plugin), com o processamento local ou na VPS. Qual caminho de captura e STT funciona assim? Pesquisa da curadoria na SAC-164."
    x_gatilho: "fecha quando a curadoria devolver a SAC-164 (filha da SAC-157) com o caminho medido para Windows cliente + VPS servidor: qual captura (extensão da Vexa, outra extensão, app local) roda no Windows, onde o STT roda (local ou VPS) e como o áudio chega à VPS. Reabre D_ANARLOG_2610 se o anarlog não tiver caminho no Windows."
    trace: "docs/evolution/inbox/_processed/2026-10-16-proposal-meeting-capture-to-graph.md"
    narrative: |-
      Resposta livre do maestro em 2026-10-16, à pergunta sobre a máquina de captura (registrada verbatim, NÃO é decisão selada): "O servidor principal vai ser como a VPS aqui, quem sabe extensão de navegador ou plugin? Minha Máquina é windows, mas isso não pode ser um problema. Se precisar passe para o Curation pesquisar o que fazer. O processamento pode ser local ou passar pela VPS."

      Fecha a lacuna E_N2_CAPTURE_MACHINE do grafo do anarlog na curadoria pelo lado do FATO (é Windows), e abre a do caminho: o motor STT embutido do anarlog só existe em macOS Apple Silicon e o aviso dele recusa no Windows (E_AVISO_WINDOWS_RECUSA em anarlog-2026-10); a extensão da Vexa captura a aba do navegador, o que é independente do sistema, mas o host desktop dela no Windows não foi medido. O motor medido pela curadoria (Parakeet em CPU de 8 vCPU) é o perfil da VPS.

