  - id: D_MC_STT_PARAKEET_ADAPTADOR_CORE_1017
    node_type: decision
    layer: audit
    plane: DEV
    status: done
    impact: 4
    confidence: 0.9
    verified_at: "2026-10-17"
    verified_against: "decisão do maestro em 2026-10-17, por pergunta com opções (/meta:decide): escolhida «Parakeet pelo adaptador do core (Recomendado)»"
    label: "O Parakeet é servido pelo adaptador do core: o core absorve por reescrita o adaptador de STT da curadoria (OpenAI /v1/audio/transcriptions, Deepgram WS e POST /v1/listen) e o opera na VPS. O desenho de operação vem do sinal, não do selo (ver narrative)."
    narrative: |-
      Selado por /meta:decide em 2026-10-17: escolhida «Parakeet pelo adaptador do core (Recomendado)»; descartadas: «Stack oficial da NVIDIA (NeMo/Riva)» · «API hospedada da NVIDIA».

      Duas falas encadeadas. A 1ª pergunta foi: "O adaptador de STT (um servidor Python sobre o onnx-asr, com rotas OpenAI, Deepgram ao vivo e Deepgram em lote; construído pela curadoria porque não havia um aberto) mora onde?", com as opções «Serviço da VPS, operado pelo core (Recomendado)», «Fica na curadoria, só como referência» e «Usar um serviço pago (Deepgram)». O maestro respondeu LIVRE, fora das opções (registrada verbatim): "quero usar o modelo da nvidia". A pergunta de esclarecimento (a do selo, no provenance) mostrou que o motor medido já é da NVIDIA (Parakeet TDT 0.6b v3) e que a escolha era COMO servi-lo.

      O que a escolha quer dizer: o adaptador hoje em data/vps-stt/ no repo da curadoria NÃO é copiado; o core o reescreve com bancada e o opera como serviço da VPS (localhost atrás do proxy com TLS, auth por token), com deploy só pelo wrapper de ops/ (MOAT). Esse desenho de operação (wrapper, TLS, token, proxy, bancada, MOAT) vem do sinal (§1 "Faltam" e §6.2) e da instrução da sessão principal, não das opções do selo. Nada disso está construído ainda: a decisão é de direção, a execução é trabalho seguinte.
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-10-17: «Sobre 'quero usar o modelo da NVIDIA': o motor já é da NVIDIA (o Parakeet TDT 0.6b v3 é modelo da NVIDIA, vencedor da medição). O que muda é COMO ele é servido. Qual?»"
      method: "testemunho: decisão do maestro por pergunta com opções, 2026-10-17"
      locality: "pessoa"
