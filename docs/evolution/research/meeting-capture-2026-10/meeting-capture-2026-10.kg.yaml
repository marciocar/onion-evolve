    verified_against: "decisão do maestro em 2026-10-17, por pergunta com opções (/meta:decide): escolhida «Captura no Windows, lote na VPS (Recomendado)»"
    narrative: |-
      Resposta livre do maestro em 2026-10-16, à pergunta sobre a máquina de captura (registrada verbatim, NÃO é decisão selada): "O servidor principal vai ser como a VPS aqui, quem sabe extensão de navegador ou plugin? Minha Máquina é windows, mas isso não pode ser um problema. Se precisar passe para o Curation pesquisar o que fazer. O processamento pode ser local ou passar pela VPS."

      Fecha a lacuna E_N2_CAPTURE_MACHINE do grafo do anarlog na curadoria pelo lado do FATO (é Windows), e abre a do caminho: o motor STT embutido do anarlog só existe em macOS Apple Silicon e o aviso dele recusa no Windows (E_AVISO_WINDOWS_RECUSA em anarlog-2026-10); a extensão da Vexa captura a aba do navegador, o que é independente do sistema, mas o host desktop dela no Windows não foi medido. O motor medido pela curadoria (Parakeet em CPU de 8 vCPU) é o perfil da VPS.

      Selado por /meta:decide em 2026-10-17: escolhida «Captura no Windows, lote na VPS (Recomendado)»; descartadas: «Lote na VPS, só por arquivo» · «Esperar o ao vivo».

      Fechada pelo gatilho do x_gatilho: a curadoria devolveu a SAC-164 (filha da SAC-157) com a proposta docs/evolution/inbox/_processed/2026-10-17-proposal-windows-client-vps-server.md, e a pergunta é respondida pela decisão D_MC_CAPTURA_WINDOWS_LOTE_VPS_1017 (aresta TRACES_TO dela para cá). Pela leitura de código no pin (NÃO executado no Windows; o braço W e os clientes reais estão na lista de não medidos do sinal), o anarlog tem caminho de CAPTURA no Windows: instalador v1.4.30, WASAPI loopback, provedor custom apontando para a VPS. O STT, porém, vai para a VPS, e isso colide com o x_gatilho de Q_ANARLOG_PORTAO_EXPORT (anarlog-2026-10), que pede a transcrição "sem sair da máquina de captura" e diz que, sem STT local no Windows, o portão reprova e D_ANARLOG_2610 reabre. Este PR de registro NÃO julga essa colisão: emendar o portão para "STT na VPS pelo provedor custom" ou reabrir o veredito é decisão do maestro, pendente.
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-10-17: «Caminho da captura de reuniões (Windows como cliente, VPS como servidor). Medido na VPS: o Parakeet v3 int8 transcreve 1 h de reunião em ~7 min (WER 6,19 %), mas ao vivo a VPS sem GPU não aguenta nem 1 reunião pela regra. Selamos qual caminho?»"
