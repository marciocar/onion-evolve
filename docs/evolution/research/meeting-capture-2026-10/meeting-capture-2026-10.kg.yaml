  - id: E_MC_STT_SERVICO_CORE_MEDIDO_1017
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.8
    verified_at: "2026-10-17"
    verified_against: "o servidor REESCRITO (ops/stt/server.py) na VPS de 8 vCPU, fora de unit, com o venv do lock e o modelo da revisão fixada; o arquivo de 61,5 min montado como na Emenda 2 da curadoria (30 falas FLEURS pt_br × 7 voltas, Random(164), PCM_16), por POST /v1/listen, um processo novo por braço; e a bancada stt_service (87 verdes com o venv do serviço; sem ele, 77 e o ⊘ declarado do server.py real) e moat_gate (237 verdes, com os casos s1–s6)"
    label: "STT em lote reescrito no core (ops/stt/, core-only). Com vad_batch=1, 61,5 min dão RSS 2,31e9 B (6,92e9 com lote de 8) e WER 5,92 % (6,19 %); teto MemoryMax=6G. Instalado na VPS: ainda não."
    trace: "ops/stt-service.sh"
    narrative: |-
      Onde mora e por quê: o serviço é código de OPERAÇÃO desta VPS, não framework: vive em ops/stt/ (servidor, núcleo puro, prova do verify, lock com hash e fixture) e o wrapper em ops/stt-service.sh, no molde do bridge-hardening e do chat-runner. ops/ não viaja para adotante; o MOAT ganhou as linhas da unit onion-vps-stt, da área de instalação do serviço, do diretório do token e do backup da unit, e o juiz fecha o modo de teste do wrapper e a cópia dele fora do projeto.

      O que foi reescrito: a fonte é o adaptador da Emenda 2 (onion-curation @ 8d08d726c117, data/vps-stt/emenda2/server.py, sha256 199e1f82b52f…). Ficaram as duas rotas de LOTE (POST /v1/audio/transcriptions e POST /v1/listen) e o /health; o WS ao vivo NÃO foi reescrito (a regra deu N = 0 nesta VPS). Mudou: auth por token fail-closed e teto de corpo como ASGI por fora das rotas, VAD fixo (o cliente não o ajusta), ffmpeg só com lista fechada de formatos e protocolo `file`, reamostragem pelo ffmpeg. A fidelidade da reescrita está no número: com vad_batch=8 ela reproduz o WER da curadoria ao centésimo (6,188 %, S/D/I 282/21/89).

      A medição (2 braços, 1 repetição cada, carga ambiente alta: load average 7,8 e 9,2, outras sessões rodando): vad_batch=1 → 244,4 s, RTF 0,0662, VmHWM 2,313e9 B, WER 5,919 % (S/D/I 274/24/77); vad_batch=8 → 411,6 s, RTF 0,1115, VmHWM 6,915e9 B, WER 6,188 %. O lote de 8 trechos preenchidos explicava a RSS (a hipótese da curadoria) e também parte do WER: o preenchimento mudava as hipóteses. O RTF não é comparável entre os braços (a carga variou); a memória e o WER são. Com 1 repetição, o WER de 5,92 % é um ponto, não um intervalo.

      O teto: MemoryMax=6G sem swap. Medido: 2,31e9 B no arquivo de 1 h mono. Estimado, NÃO medido: o pior caso com 2 pedidos em memória (QUEUE_MAX=2) e corpos de até 384 MB (≈ 1 h 40 de WAV float32 mono). Estourou, o kernel mata o processo e o systemd o reinicia; o pedido em curso cai.

      A 1ª passada do refutador achou a bomba de descompressão (4,1 MB de FLAC de silêncio = 6 h, +2,7 GB e 134 s presos): curada com o teto da DURAÇÃO decodificada (--max-audio-s 10800, lido do cabeçalho antes de decodificar, e -t no ffmpeg). Re-medido com o mesmo arquivo: 413 em 0,035 s; um m4a de 4 h pelo ffmpeg: 413 em 26 s com pico de 1,18e9 B. A 2ª passada achou a mesma bomba por CANAIS (o ffmpeg escrevia o arquivo inteiro antes da recusa): curada com -fs, -ac 1 e PCM de 16 bits.

      Não medido aqui: a unit de verdade com o sandbox (o --apply prova isso numa unit transitória ANTES de trocar a de produção, e o verify depois); multicanal com áudio real; os clientes reais (Vexa, anarlog); o timeout de 30 s do cliente Vexa contra os ~4 min de 1 h de reunião (o cliente precisa de requestTimeoutMs maior: é configuração do lado de lá); o TLS e o domínio no proxy, que esperam decisão do maestro.
    provenance:
      source: "ops/stt/server.py e ops/stt-service.sh nesta VPS"
      locator: "medição de 2026-10-17 11:39–11:50 (UTC-3), script membench no scratchpad da sessão; bancada: lint-selftest.sh --families stt_service e moat_gate"
      method: "medição: servidor real por HTTP com WER por jiwer na normalização da curadoria, VmHWM do processo (status do kernel), e bancada com mutantes"
      locality: "repo"

