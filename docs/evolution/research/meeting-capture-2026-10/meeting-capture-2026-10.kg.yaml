  review_after: "2026-11-15"   # 30d: o MESMO prazo do grafo de pesquisa da curadoria (ferramentas e preços mudam rápido)
  purpose: |
    Triagem do core da pesquisa de captura de reunião → grafo (SAC-157). A pesquisa canônica (13 nós: maquinaria
    do Onion, landscape de bot, captura local, arquivo e STT medido) mora no repo de curadoria, no MESMO caminho
    relativo deste arquivo. Aqui ficam só o que o core decide e o que o core executa: o modelo aviso ≠
    consentimento absorvido por reescrita, o passo zero (diretório único e o grafo por reunião a partir de
    texto) e a pergunta aberta da máquina de captura. Os vereditos das ferramentas moram nos grafos de
    dissecação do core: docs/evolution/dissect/vexa-2026-10/ e docs/evolution/dissect/anarlog-2026-10/.
  # kg-backlog-guard: on
  # ═══ TETO: 5 NÓS. Cresce quando a curadoria devolver a pesquisa da máquina de captura (SAC-164) ou o grafo de consolidação entrar em plano. ═══
  # Proposta triada: docs/evolution/inbox/_processed/2026-10-16-proposal-meeting-capture-to-graph.md

