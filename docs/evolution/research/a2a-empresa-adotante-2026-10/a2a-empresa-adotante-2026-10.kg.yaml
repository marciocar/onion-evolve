    status: done
    plane: DEV
    verified_at: "2026-10-27"
    verified_against: "decisão do maestro em 2026-10-27, por pergunta com opções (/meta:decide): escolhida «Sim: selar como direção com as condições»"
    narrative: |-
      Veredito do Elenxo desta rodada (afirmação de UM agente, sem votação): as duas pernas centrais têm âncora suficiente para virar direção: receptor A2A 1.0 em self-host entre pessoas com perfil Onion endurecido, e canal nativo com isolatePeerMachines para a mesma pessoa. O selo deve carregar: (a) Channels FORA como canal entre pessoas: allowlist de IDs por plugin, relay de permissão que faz do colega aprovador de ferramenta, desligado por padrão em Team/Enterprise, entrega em sessão ociosa sem âncora; (b) nuvem e Managed Agents FORA para adotante regulado (ZDR, HIPAA, CMEK; Managed Agents sem ZDR nem BAA) e AINDA NÃO AVALIADOS para não regulado; (c) o perfil Onion endurece para MUST a assinatura (MAY na spec) e a verificação (SHOULD) do card, declarado como delta; (d) consequência operacional: com isolatePeerMachines, sessão sem operador para de mandar a outra máquina até alguém aprovar, e mensagem a máquina offline vai para fila (2.1.261); (e) os seis itens de E_LACUNAS_A2A_EMPRESA_RODADA_PRIMARIAS_1027 como nós abertos com dono. Este escritor NÃO sela; quem sela é o maestro pelo /meta:decide.

      Selado por /meta:decide em 2026-10-27: escolhida «Sim: selar como direção com as condições»; descartadas: «Não».
