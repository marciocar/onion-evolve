  - id: Q_A2A_EMPRESA_RODADA_PRIMARIAS_1027
    node_type: question
    plane: DEV
    status: open
    impact: 4
    confidence: 0.5
    label: "Rodada complementar em modo primaries: ler as fontes que o orçamento cortou e o Elenxo marcou como load-bearing (Channels, Managed Agents, envenenamento de Agent Card, controles isolatePeerMachines e crossSessionInbound, CHANGELOG inteiro) antes de selar a topologia."
    narrative: "Aberta no pós-run de 2026-10-27. O run em modo decision cortou 34 fontes e 40 claims por orçamento (maxFetch 15, maxVerify 25) e leu cerca de 9% do CHANGELOG do Claude Code. As lacunas já têm nome, então a régua da skill manda o modo primaries, não outra varredura. Fontes nomeadas: (1) code.claude.com/docs/en/channels.md, a costura nativa que traz eventos externos para a sessão, de que depende a entrega viva na sessão ociosa do colega (E_OBJECAO_29_CHANNELS_UNREAD); (2) o handbook de Claude Managed Agents e a página de sessões na nuvem, que a opção D nomeia e ninguém avaliou (E_OBJECAO_30_MANAGED_AGENTS_UNEVALUATED); (3) as fontes de envenenamento de Agent Card e agent-in-the-middle da Keysight e da LevelBlue (E_OBJECAO_31_AGENT_CARD_ATTACKS_UNREAD); (4) isolatePeerMachines e crossSessionInbound como controles determinísticos (E_OBJECAO_16_ISOLATE_PEER_MACHINES_LOAD_BEARING): aqui a fonte FOI lida, e o que o orçamento cortou foram as claims. A conferência do pós-run (WebFetch da página de cross-session em 2026-10-27) achou o texto dos dois controles na página; falta ancorá-los e ler a referência de settings; (5) o CHANGELOG inteiro, para a maturidade da D e os controles Enterprise (E_OBJECAO_25_CHANGELOG_READ_9_PERCENT, E_OBJECAO_24_NATIVE_ENTERPRISE_CONTROLS_CUT). Quem decide se a rodada roda antes do selo é o maestro."
    trace: "docs/evolution/research/a2a-empresa-adotante-2026-10/SYNTHESIS.md (seção NÃO-VERIFICADOS e ações candidatas)"

