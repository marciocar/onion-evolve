  - id: D_A2A_EMPRESA_ADOTANTE_TOPOLOGIA_1027
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    label: "DECISÃO ABERTA: topologia A2A da empresa adotante. A bridge hospedado (piloto) · B receptor self-host · C A2A aberto 1.0 + MCP Streamable HTTP · D nativo Anthropic (mesma pessoa) · combinação. Elenxo recomenda B falando C entre pessoas + D com isolatePeerMachines; A piloto."
    narrative: "Opções: C_OPCAO_A_BRIDGE_HOSTED_PILOT_ONLY, C_OPCAO_B_SELF_HOSTED_RECEIVER, C_OPCAO_C_OPEN_A2A_MCP_STREAMABLE_WIRE, C_OPCAO_D_NATIVE_SAME_PERSON_ONLY, C_OPCAO_COMBINACAO_B_SPEAKS_C_PLUS_D. RECOMENDAÇÃO DO ELENXO (afirmação de UM agente, sem votação; íntegra recebida do motor, sem corte): «Recomendação: uma combinação em duas camadas, não uma opção única. (1) Entre colegas e máquinas de donos diferentes, o canal é um receptor A2A que a própria empresa hospeda (opção B, numa VPS ou serverless com armazenamento durável). Ele fala o protocolo A2A aberto 1.0 (C) como formato de fio. O 'A2A do Onion' deixa de ser protocolo próprio e vira um PERFIL do A2A aberto: chave pinada no members.yaml, cards assinados obrigatórios, corpo assinado e tratado como dado, MCP local cuja tool de envio só grava rascunho. A trajetória sustenta isso: o A2A entrou na AAIF em 17/08/2026, junto ao MCP (aaif.io). O onion-bridge hospedado (A) fica só como onboarding e piloto, não como topologia de produção, porque concentra o dado de terceiros e já teve defeitos de gate. (2) Para a mesma pessoa em várias máquinas, o canal nativo (D: cross-session via Remote Control) com isolatePeerMachines=true no .claude/settings.json do adotado: é o gate determinístico de saída, que vale até sob bypass e o projeto liga mas não desliga. CONDIÇÕES (as objeções que sobreviveram): (a) a D não serve entre pessoas: o escopo é 'your sessions', exige login claude.ai, o dado passa pela Anthropic, fica vetada em org ZDR, e a proteção de configuração no receptor é INSTRUÇÃO ao modelo, não gate. (b) O card assinado autentica o agente, não a mensagem: o Onion precisa assinar o CORPO (emenda pendente da RFC-0004) e exigir assinatura, que a spec deixa opcional. (c) A identidade estável vem da chave pinada no members.yaml, nunca do nome de sessão ou do socket/PID. (d) Atrás de NAT, a volta é polling por tasks/get ou SSE. A entrega viva na sessão ociosa depende de Channels, que não foi lido e é research preview. (e) Na B serverless, a fila, a deduplicação de jti e o estado de Task são projeto da empresa. O McpAgent em Durable Object está deprecado, só Streamable HTTP tem OAuth, e o custo de operação NÃO foi medido. (f) A tool de rascunho tem de ser idempotente, porque o retry do cliente MCP repete chamada. (g) Lacunas abertas antes de selar: adoção real de A2A em produção (só contagem de apoiadores), Managed Agents/Agent SDK não avaliados, ataques a Agent Card não lidos, dois membros da mesma org Team não testados, e a linha de base viva VPS↔notebook (Q_COMPOSICAO_IDA_E_VOLTA_VIVA_1025) ainda não medida.» Este escritor NÃO sela: o maestro sela pelo /meta:decide."
    trace: "run /onion-research modo decision de 2026-10-27; pergunta Q_A2A_EMPRESA_ADOTANTE_2026_10; corpus Q_COMPOSICAO_IDA_E_VOLTA_VIVA_1025 (docs/onion/graph/sinais-de-campo-2026-09.kg.yaml)"

