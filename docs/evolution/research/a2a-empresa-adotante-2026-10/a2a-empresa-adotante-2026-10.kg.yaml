    confidence: 0.5
    label: "Proposta ao maestro (não é selo): selar D_A2A_EMPRESA_ADOTANTE_TOPOLOGIA_1027 como DIREÇÃO, não 'avaliada por completo', com Channels FORA, nuvem e Managed Agents FORA para regulado, assinatura e verificação de card MUST no perfil Onion e as seis lacunas como nós com dono?"
