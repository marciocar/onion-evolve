nodes:
  - id: Q_A2A_EMPRESA_ADOTANTE_2026_10
    node_type: question
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    label: "Como uma empresa adotante do Onion deve conectar sessões de agentes de pessoas e máquinas diferentes, com ida e volta viva, identidade estável do remetente, mensagem de colega como informação (nunca aprovação) e nada de envio automático para fora?"
    narrative: "Pergunta do run /onion-research modo decision de 2026-10-27, relayada da sessão do maestro ('traga em decide, uma empresa adotante do onion poderia ter duas possibilidades, usar o nosso A2A (ex. via bridge ou instalado em uma VPS ou lambda) ou outra sugestão mais moderna e costurável'). Candidatas: A) A2A do Onion hospedado pelo onion-bridge (HTTP A2A do bridge + MCP local cuja tool de envio só grava rascunho); B) o mesmo receptor em self-host pela empresa (VPS ou serverless); C) A2A aberto (Agent2Agent, AAIF/LF) + MCP remoto por Streamable HTTP; D) canais nativos da Anthropic (Remote Control, sessões na nuvem, Managed Agents, Agent SDK). Critérios: ida e volta viva; identidade estável; dono do dado e onde ele passa; custo e esforço de operação; maturidade e trajetória (adoção, quem financia, quem implementa); segurança (autenticação, autorização, injeção vinda de outro agente); costura com o Claude Code atual. Segue open: a decisão D_A2A_EMPRESA_ADOTANTE_TOPOLOGIA_1027 espera o selo do maestro."
    trace: "docs/evolution/research/a2a-empresa-adotante-2026-10/a2a-empresa-adotante-2026-10.kg.yaml (run /onion-research modo decision de 2026-10-27)"

