    status: open
    impact: 4
    confidence: 0.5
    label: "Como desenhar a classe 'live' da federation-transport (adapter por adotante: cc-peer|slack|teams|a2a) para comunicação DIRETA entre sessões Claude Code em máquinas e CONTAS diferentes, restrita a membros autorizados, com humano no circuito e o corpo da mensagem como DADO? Segue open: o Claude Code documenta transporte entre máquinas só dentro da MESMA conta; entre contas o doc é silente; Slack/Teams/A2A têm âncora de mecanismo, mas members.yaml não carrega identidade de plataforma."
