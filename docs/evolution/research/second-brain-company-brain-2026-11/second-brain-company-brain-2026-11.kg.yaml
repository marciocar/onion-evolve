  - id: Q_SECOND_BRAIN_COMPANY_BRAIN_2026_11
    node_type: question
    layer: audit
    plane: DEV
    status: open
    impact: 5
    confidence: 0.5
    label: "Second Brain pessoal × Company Brain interconectáveis como vertical do Onion: o que o mercado faz em nov/2026, que mercados isso abre (b2b a c2c) e qual opção o Onion toma (ADR-003, vertical irmã federada, central de decisão ou rodada complementar)?"
    narrative: "Pergunta do run em modo decisão (2026-11-25), em três partes: (1) estado de mercado e comunidade em segundo cérebro pessoal com IA, memória pessoal de agente, PKM com grafo e a ponte com o company brain (valor mútuo, consentimento, fronteira indivíduo×organização); (2) mercados de vender, alugar ou bilhetar habilidade, conhecimento, estratégia, agentes e contatos (b2b, b2c, b2b2c, c2c, c2b, agente-para-consumidor), quem tenta, capital e onde falha; (3) opções do Onion com recomendação e riscos (privacidade, vigilância do empregador, propriedade do conhecimento do colaborador). A decisão é do maestro (D_SECOND_BRAIN_VERTICAL_2026_11, OPEN)."
    trace: "run /onion-research modo decision de 2026-11-25; pergunta computada pelo workflow; corpus prévio: compartilhamento-individuo-organizacao-2026-09, company-brain-market-2026-07, bridge-produto-2026-08, ADR-003 do Onion Pessoal · projeção: docs/evolution/research/second-brain-company-brain-2026-11/SYNTHESIS.md"
  - id: D_SECOND_BRAIN_VERTICAL_2026_11
    node_type: decision
    layer: audit
    impact: 5
    confidence: 0.5
    label: "DECISÃO ABERTA: Second Brain × Company Brain como vertical do Onion. Opções: A retomar ADR-003 · B vertical irmã federada · C começar pela central de decisão do company-brain · D rodada complementar. Elenxo recomenda C com limites (A só reescrita, B parqueada)."
    trace: "run /onion-research modo decision de 2026-11-25; pergunta Q_SECOND_BRAIN_COMPANY_BRAIN_2026_11; segue D_INDIVIDUAL_ORGANIZATION_SHARING_CRITERION e D_FRONTEIRA_NAO_EMITIR_ATE_FECHAR (compartilhamento-individuo-organizacao-2026-09)"
    status: done
    plane: DEV
    x_destination: design
    verified_at: "2026-11-25"
    verified_against: "decisão do maestro em 2026-11-25, por pergunta com opções (/meta:decide): escolhida «C (central de decisão do company-brain) primeiro, depois B (vertical irmã federada) usando o aprendizado de A (ADR-003)»"
    narrative: |-
      Opções: C_OPCAO_A_RESUME_ADR003_ONDEVICE, C_OPCAO_B_SISTER_VERTICAL_FEDERATED,
      C_OPCAO_C_DECISION_CENTER_FIRST, C_OPCAO_D_COMPLEMENTARY_ROUND.

      RECOMENDAÇÃO DO ELENXO (afirmação de UM agente, sem votação; íntegra, sem corte):
      Recomendo a opção C, e só com estes limites. Começar pela central de decisão que já existe no
      company-brain (PR #29, SAC-554), com o colaborador como USUÁRIO que puxa (pull) do company brain o que
      lhe cabe, sem nenhum fluxo do pessoal para a empresa, salvo publicação autoral explícita (semântica da
      opção B de set/2026 dentro da opção C selada em D_INDIVIDUAL_ORGANIZATION_SHARING_CRITERION com as 4
      emendas). Na dúvida, não sai (D_FRONTEIRA_NAO_EMITIR_ATE_FECHAR). Condições que seguram a decisão:
      (1) NÃO retomar a opção A com a promessa de 'só de-identificado à nuvem'. O código do app pessoal manda
      mídia crua por exceção declarada, e o de-id de texto é frágil por desenho. Para retomar, é preciso reescrever a INVARIANTE 0
      com a exceção dita na cara, ou desligar a flag de mídia.
      (2) A opção B, a interconexão federada, fica PARQUEADA até existir mecanismo contra vazamento por
      agregação. ACL na recuperação não basta (times de 3 a 5 reconstroem o indivíduo por diferença), e o
      ledger com épsilon não foi desenhado.
      (3) Nenhum desenho pode se apoiar nos escopos do Claude Code (CLAUDE.local.md, auto-memória) como
      fronteira. A managed policy da TI tem precedência e é o vetor de vigilância numa máquina gerida.
      (4) A titularidade do conhecimento do colaborador segue a lei BR, não o 'work product' do common law.
      Lei 9.609 art. 4º §2º: o que foi criado fora do contrato e sem recurso do empregador é do empregado. O
      consentimento do empregado não serve de salvaguarda (EDPB/ANPD no corpus).
      (5) O item (2), mercados de bilhetar skills, agentes e contatos, NÃO tem evidência confirmada de falha
      nem de sucesso para c2b/c2c. Todas as claims contrárias foram cortadas ou não lidas (GPT Store,
      Bloomberg, snyk ToxicSkills). Nenhuma promessa de mercado sai desta rodada sem a opção D.
      (6) Os sinais de mercado do item (1) são de mortalidade (Mem encerra em 15/01/2027, Ollie encerrou),
      com causa não declarada. Eles não sustentam nem 'privacidade vende' nem 'não vende'.
      Risco residual declarado: memória escrita pelo agente é envenenável (MemGhost, 71,4% no Claude Code
      SDK), e isso vale para qualquer das três opções.

      NOTA DO ESCRITOR (medida nesta escrita, 2026-11-25): (a) o §2º do art. 4º da Lei 9.609 foi conferido
      verbatim por WebFetch no planalto.gov.br; a lei cobre PROGRAMA DE COMPUTADOR, e notas/conhecimento
      caem na Lei 9.610 e invenção na Lei 9.279 art. 88, que ninguém leu na rodada. (b) O nó
      E_AGREGADO_COM_OPTIN_VAZA_POR_DIFERENCA, citado pelo Elenxo, NÃO existe como id no corpus: é citado
      dentro do label de E_REFUTACAO_DA_PROPOSTA_DE_RAIO (mesmo grafo de set/2026), para onde aponta a aresta
      externa. (c) O último commit do app pessoal é de 2026-10-08 (o Elenxo disse 2026-10-09).

      Este escritor NÃO sela: o maestro sela pelo /meta:decide.

      Selado por /meta:decide em 2026-11-25: escolhida «C (central de decisão do company-brain) primeiro, depois B (vertical irmã federada) usando o aprendizado de A (ADR-003)»; descartadas: «A como caminho principal agora» · «D antes de decidir». Destino: desenho (fica como texto, sem guarda a cobrar).
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-25: «Opção C e depois B com o aprendizado do que aconteceu em A; fazer um Delphi com os envolvidos e trazer em decide para avançar; validar e certificar as jornadas fim a fim de forma ordenada e progressiva»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-25"
