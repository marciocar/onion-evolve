    impact: 5
    confidence: 0.85
    status: done
    verified_at: '2026-10-17'
    verified_against: 'família house_code_gloss da bancada (19 casos) e 19 mutantes plantados, 19 mordem; dogfood no ponto real do caso literal (lembrete injetado no turno seguinte com a glosa de r13; política estrita barra rc 2)'
    trace: '.claude/hooks/house-code-gloss.sh'
    label: 'Substrato e política: molde do hook Stop de título de REGRA. Normal: o UserPromptSubmit injeta a glosa das siglas que o turno anterior usou sem glosa e grava as de opacidade alta lembradas. Rede: o Stop barra só a lembrada NESTE turno que voltou sem glosa.'
    narrative: "A sigla do caso literal saiu num bloco intermediário, que o maestro lê quando chega; a glosa veio depois. Molde: o hook de título de REGRA, o mais exercitado no censo (8 casos). Escolhida pela medida E_MEDIDA_TAXA_DE_BLOQUEIO_EM_1568_TURNOS entre as três opções que o reforço do maestro listou: avisar sem bloquear (0%, mas sem rede), bloquear só a reincidência (0,2%) e bloquear só as de opacidade alta (1,9%). O lembrete é ESTADO OBSERVADO, não recomputado: o prompt grava o que lembrou, o Stop lê e consome; só há estado em turno aberto pelo maestro (o UserPromptSubmit não dispara em aviso de tarefa de fundo), e a sigla que o maestro escreveu no pedido não barra. Reincidência vale pelo mesmo token, ou pela mesma linha estática do glossário (lembrada r12, a r13 também barra). A política fica em ONION_HOUSE_CODE_STOP (reincidence padrão, alta estrita, off só lembrete; valor desconhecido vale off), para o maestro trocar sem forja nova. Consequência declarada: o caso literal de 2026-10-17 (r13 na 1ª vez) NÃO barra na política padrão; recebe o lembrete no turno seguinte, e barra se reincidir ou na política estrita (casos i e n da bancada). Decisão tomada pelo agente da forja sob a autorização do maestro, sem pergunta: ela é dele para trocar."
    provenance:
      source: ".claude/hooks/house-code-gloss.sh"
      locator: "cabeçalho do hook (POR QUÊ e COMO) + bash .claude/hooks/house-code-gloss.sh --selftest"
      method: "medição: bancada, mutantes e varredura de transcripts reais"
      locality: "repo"

