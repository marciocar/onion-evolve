    narrative: "A sigla do caso literal saiu num bloco intermediário, que o maestro lê quando chega; a glosa veio depois. Molde: o hook de título de REGRA, o mais exercitado no censo (8 casos). Escolhida pela medida E_MEDIDA_TAXA_DE_BLOQUEIO_EM_1568_TURNOS entre as três opções que o reforço do maestro listou: avisar sem bloquear (0%, mas sem rede), bloquear só a reincidência (0,9%) e bloquear só as de opacidade alta (3,2%). A política fica em ONION_HOUSE_CODE_STOP (reincidence padrão, alta estrita, off só lembrete), para o maestro trocar sem forja nova. Consequência declarada: o caso literal de 2026-10-17 (r13 na 1ª vez) NÃO barra na política padrão. Ele recebe o lembrete no turno seguinte, e barra se reincidir ou na política estrita (casos i e n da bancada). Cada bloco de texto é julgado na ordem em que o maestro o lê: a glosa de um bloco anterior do mesmo turno cobre os seguintes, mas a de um bloco posterior chega tarde. Decisão tomada pelo agente da forja sob a autorização do maestro, sem pergunta: ela é dele para trocar."
