    label: "merge por rebase reescreve o SHA que a provenance caminho@commit cita, e nenhum gate acusa; cura selada: o pr-merge-verified exige --merge-commit quando o diff cita commit da própria branch (SAC-80)"
    narrative: "É a mesma classe que o --assert-ancestor curou para o vendor. A prevenção vem antes da detecção (checar que todo @sha é ancestral da base). Precisa estar pronta antes da onda O1, que escreve milhares de source."
  - id: E_MERGE_EXIGE_MERGE_COMMIT_QUANDO_GRAFO_CITA_A_BRANCH
