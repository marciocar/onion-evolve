    narrative: "Nenhum veredito MUST mudou: 138 grafos, 19 na dívida herdada, antes e depois. A troca de granularidade foi comparada na da base (por grafo), sem piora, e a base passou a guardar granularity node; o CI não passa --granularity, lê da base. Dívida SHOULD, grafos → ocorrências: provenance.method 6 → 39, label 111 → 2224, verified_against 16 → 141, verified_at 6 → 17, testimony-in-prod 36 → 121, untraced-decision 14 → 36, yaml.unquoted-date 129 → 129 (código de arquivo inteiro, 1 por grafo). O testimony-in-prod é o caso que pediu a granularidade: por grafo, as ondas 2 e 3 da O3 apareciam como piora (34 → 36 grafos); por nó, no corpus inteiro do gate, foi ganho de 4 (125 nós na adoção do v4.1 em 05194c07, 121 hoje). Os 107 → 103 do lote anterior são o mesmo −4 contado só nos 91 grafos tocados. Locality: a regra vive em kg-migrate-v3.py (locality_of) e erra para o lado de calar: segmento do source julgado pelo 1º token; sha só vale repo se o git deste repo o conhece; fonte mista vale a menos reverificável (repo < web < host < pessoa); sem certeza, sem chave. Corpus: 233 provenances ficaram sem locality (citação bibliográfica, CHANGELOG descrito em prosa, outro repo como gustavo-pulga@sha, sha que o git não conhece). Diff de 3517 linhas, só a chave nova, provado por releitura YAML grafo a grafo; é regenerável por --locality, o que resolve conflito com PR paralelo. Geradores: kg-migrate-v3 (os 3 modos que escrevem provenance + --locality), census-seal (repo), seed-adoption-graph (repo; o gate provado e o adiado são host, porque a execução e o core.hooksPath só existem na máquina), cc-delta-census (web) e o write(KG) do onion-research.js (ensina as 4 classes e omitir na dúvida). A convenção 'label anterior: …' já era a do --apply-judged desde a O3."
