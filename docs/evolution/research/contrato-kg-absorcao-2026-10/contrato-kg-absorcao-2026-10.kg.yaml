    verified_against: "bancada pr_merge_verified com LC_ALL=C: 36 casos, 0 falhas, e os 9 casos novos (kg-a..kg-g) reprovados por mutantes que tiram a parte da cura que cada um protege; sandbox git de verdade com o SUT e o mutante sem a cura lado a lado"
    label: "o pr-merge-verified recusa o rebase quando o .kg.yaml do PR cita, em provenance.source, commit da própria branch, e com --merge-commit confere depois do merge que cada sha é ancestral da base"
    narrative: "A guarda lê só as linhas que o PR adiciona em *.kg.yaml, e só o valor de uma chave source:. Um @sha em label, narrative ou locator é prosa e não dispara. O sha é classificado pelo git: se não resolve neste repo, fica fora do escopo e é contado; se é ancestral da base, nada muda; se não é, é commit da branch. Sem --merge-commit a recusa vem antes de qualquer efeito, nomeando sha e arquivo. Com --merge-commit, a ancestralidade é conferida depois do merge provado, e a falha sai com rc 3, como no --assert-ancestor. O auto-rebase também é barrado nesse caso, porque reescreveria o commit citado. PR sem .kg.yaml não faz leitura de git."
    provenance:
