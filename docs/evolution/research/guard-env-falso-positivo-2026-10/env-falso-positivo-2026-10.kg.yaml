    verified_against: "na main de 2026-10-20, com o JSON do PreToolUse: `echo \"$(cat .env)\"` rc 0, `x=\"$(cat .env)\"` rc 0, `echo \"`head .env`\"` rc 0, `find . -name .env | xargs cat` rc 0; na cura, rc 2 nos quatro; e `$(cat <<'E')` com o corpo nas linhas seguintes EXECUTA o corpo em bash 5 (medido)"
    trace: ".claude/hooks/pretooluse-env-guard.sh"
    label: "dois escapes ANTERIORES à cura, achados na passada do U4: a substituição entre aspas duplas não era julgada (`echo \"$(cat .env)\"` lia o segredo) e `find … | xargs cat` passava"
    narrative: "O shlex entrega `\"$(cat .env)\"` como um token só, e o veto julgava tokens: toda substituição fora de aspas simples passa a ser julgada (substitutions). O xargs recebe o nome pela entrada: numa linha que cita um .env, ele só passa se o comando dele for de metadado. E a relaxação do prefixo do heredoc mediu antes de afrouxar: `$(cat <<'E')` fechado na mesma linha ainda captura o corpo, então o `<<` dentro de substituição segue recusado, por dois caminhos (o texto antes do operador e o parêntese aberto)."
    provenance:
      source: ".claude/hooks/pretooluse-env-guard.sh da main 3831c4ac e da cura"
      locator: "casos dq-subst, xargs, subst-heredoc e subsh-pipe do caso (u); mutantes M7, M8 e M9"
      method: "medição: hook com o JSON do PreToolUse e bash 5 executando o heredoc dentro de $()"
