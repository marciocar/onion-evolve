    narrative: "O que muda do selo D_GREP_E_HEREDOC_SEGUEM_VETADOS: grep -o com padrão provado de nome (ancorado, classes só de nome, `=` como último caractere ou palavra literal de 4+) passa; heredoc que grava em .md/.txt/.json/.yaml/.csv/.tsv/.log/.html/.xml com destino resolvido passa mesmo citando .env, e o fecho do \"pode virar script\" vai para o outro lado: `bash x.md`/`source x.txt` passam a ser barrados. O que NÃO muda: grep -c/-q/-l e grep sem -o no .env seguem barrados; heredoc citando .env para arquivo sem extensão de dados (script) segue barrado, com a ferramenta Write como caminho."
