  - id: E_GLOB_JULGADO_PELO_DISCO
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.85
    verified_at: "2026-10-08"
    verified_against: "família env_exposure 14 de 14 (casos l e m novos) com LC_ALL=C; famílias afetadas 39 de 39; 6 mutantes, todos reprovando o caso deles"
    trace: ".claude/hooks/pretooluse-env-guard.sh"
    label: "o veto passa a julgar glob pela regra do bash e pelo disco: 5 falsos positivos medidos somem e os 8 escapes testados seguem barrados"
    narrative: "Três regras, nesta ordem: glob que termina em / só expande para diretório e nunca é um .env; glob cuja última parte começa com ponto alcança um .env oculto e fecha como antes; glob sem ponto só alcançaria um x.env sem ponto, e isso se confere no disco, na pasta onde o comando roda (o cwd do JSON, seguindo cd literal). Fecha como antes quando a pasta não é conhecida (cd com variável, subshell com cd, pushd), quando a linha cita um .env literal (cp .env x.env && cat * criaria o alvo depois do veto) e quando o glob nomeia env (grep -r --include=*.env desce às subpastas: escape que a 1ª redação abria, pego pelo caso h2 da bancada). E o env-check ganha --lint, que acusa por NOME o \\r no fim, aspas sem fechar e chave repetida sem imprimir valor; o leitor dele passou a tirar o \\r final."
    provenance:
      source: "bancada run_env_exposure_selftests (casos l e m) e o harness de mutantes do SAC-68"
      locator: "lint-selftest.sh, família env_exposure; mutantes M1 a M6"
      method: "medição: bancada com LC_ALL=C e mutante por cura"
  - id: D_GREP_E_HEREDOC_SEGUEM_VETADOS
    node_type: decision
    layer: audit
    plane: DEV
    status: open
    impact: 3
    confidence: 0.7
    verified_against: "cura do SAC-68 em 2026-10-08, proposta ao maestro"
    label: "proposta: grep no .env (mesmo só contando) e heredoc que grava em arquivo texto citando .env seguem vetados, porque o caminho sancionado existe e é seguro"
    narrative: "O grep é a forma mais perigosa de ler o .env: abri-lo para contar abriria para imprimir. O caminho é env-check --lint, que responde a pergunta real (há \\r? aspas sem fechar?) por nome de chave. O heredoc que grava em arquivo um texto citando .env pode virar script depois, e a ferramenta Write grava o mesmo texto sem passar pelo shell — foi o que se usou na leva."
  - id: C_TETO_GREP_RECURSIVO_SEM_INCLUDE
    node_type: claim
    layer: audit
    plane: DEV
    status: open
    impact: 3
    confidence: 0.7
    verified_against: "passada adversarial do SAC-68 em 2026-10-08: o veto da main já deixava passar grep -r sem --include sobre uma pasta (o argumento é uma pasta, não um arquivo .env); não é escape aberto pela cura"
    label: "teto: grep -r ou rg sobre uma pasta lê o .env que estiver dentro dela, e o veto julga o argumento (a pasta), não o que a recursão alcança"
