    label: "O evento ConfigChange não dispara em plugin.json nem em hooks.json sob .claude/skills, e dispara em SKILL.md na mesma pasta: o controle positivo prova que a pasta é vigiada e os arquivos de plugin não. Daí a varredura pelo resultado, e não um hook de configuração."
    provenance:
