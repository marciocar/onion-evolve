  - id: E_CENSO_CLASSE_NOVA_E_PASSIVO_ZERO
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.85
    verified_at: "2026-11-04"
    verified_against: "GUARD_CENSUS_QUERY=<termo> bash .claude/validation/guard-census.sh . --markdown, por termo; git ls-files; find -L nas pastas de skills"
    label: "O censo de 2026-11-04 não achou guarda da classe: as menções a .claude-plugin e hooks.json são das guardas do bundle de plugin, que julgam outra coisa. O passivo é zero."
    narrative: "Nenhum arquivo na forma no git do core, na pasta de skills do usuário, nem nos adotantes clonados nesta máquina. Armadilha de medidor: o GUARD_CENSUS_QUERY é uma frase, e não uma lista de termos. A 1ª rodada com vários termos respondeu que nada mencionava o assunto; termo a termo, apareceram as guardas de bundle. O nome do termo muda a resposta, e zero aqui era zero por vocabulário."
    provenance:
      source: ".claude/validation/guard-census.sh"
      locator: "seções 'moldes por SUBSTRATO', 'já existe guarda' e 'passivo' da saída de 2026-11-04"
      method: "measurement: censo na carga da forja e varredura no disco"
      locality: "repo"

  - id: D_VETO_ESTREITO_MAIS_VARREDURA
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.85
    trace: ".claude/hooks/pretooluse-plugin-write-guard.sh"
    label: "Decisão do maestro de 2026-11-04: veto estreito mais varredura no disco. Um hook PreToolUse em Write, Edit, NotebookEdit e Bash com exit 2 e onFailure block, e um check que olha o RESULTADO no disco, na partida da sessão e no lint, sem depender de como o arquivo foi escrito."
    narrative: "O hook é a metade rápida, que barra antes de escrever e fala com quem errou. A varredura é a metade que não falha pelo vocabulário: tudo o que o hook não vê cai nela, desde que o arquivo fique no disco."

  - id: D_MOLDE_COMPOE_O_JUIZ_DO_MOAT
    node_type: decision
    plane: DEV
    status: open
    impact: 4
    confidence: 0.8
    trace: ".claude/hooks/lib/plugin-write-judge.py"
    label: "Molde pelo censo: pretooluse-direct-provider-api.sh é o único PreToolUse com --selftest próprio, e é a forma de hook mais check de lint. A lógica de alvo vem do pretooluse-moat-gate.sh."
    narrative: "O juiz novo carrega o moat-judge.py inteiro e troca só alvo, relevância e classes, em vez de copiar a tabela verbo-destino. A hipótese do pedido era que o tokenizador segue cd, variável literal e script. Provada contra os contornos: cd antes de > (K5), mv da pasta temporária (K1) e variável literal passaram no juiz sem nada novo. Não bastou em três: a variável cujo valor é montado de pedaços literais (K2, o lib a esquece, e o juiz faz a conta), a remoção (o MOAT conta rm como escrita, e aqui remover é a cura) e a origem de um mv. E o heredoc lido por interpretador é inerte para o tokenizador: o juiz o lê à parte. O preço é acoplar aos nomes internos do moat-judge; a família da bancada reprova se um deles mudar."

  - id: D_JULGA_A_FORMA_EM_QUALQUER_RAIZ
    node_type: decision
    plane: DEV
    status: open
    impact: 3
    confidence: 0.75
    trace: ".claude/hooks/pretooluse-plugin-write-guard.sh"
    label: "O veto julga a FORMA do caminho, como escrito e resolvido, em qualquer raiz, sem isenção da pasta temporária nem do scratchpad. A isenção foi pesada e descartada pela medida: nenhum dos 3.929 caminhos de Write e Edit dos transcripts tem a forma."
    narrative: "E o 1º componente depois de skills/ é o NOME da skill: uma skill chamada hooks cala, o que diverge do glob literal do pedido, de propósito."

  - id: D_HARD_NO_CORE_SOFT_NO_DERIVADO
    node_type: decision
    plane: DEV
    status: open
    impact: 3
    confidence: 0.75
    trace: ".claude/validation/lint-artifacts.sh"
    label: "REGRA 114 (Plugin não mora em .claude/skills no disco): HARD no core, SOFT no derivado, e só o repo, sem a pasta de casa. O adotante pode instalar um plugin ali por escolha dele, e o gate não pode depender da pasta de casa de quem roda."
    narrative: "A pasta de casa é com o SessionStart, que só avisa. Passada a cláusula 5 da doutrina: quem controla a entrada do check é o próprio repo, então um terceiro não deixa o gate vermelho à distância."

  - id: E_REPLAY_ACHOU_UM_FALSO_POSITIVO
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.85
    verified_at: "2026-11-04"
    verified_against: "data/replay-2026-11-04.txt: reexecução do hook sobre os transcripts do core"
    label: "O replay sobre 60.418 comandos Bash únicos dos transcripts reprovou a 1ª redação com a bancada verde: um python3 com str.replace que citava .claude-plugin/marketplace.json, o da raiz do repo. Curado e virado caso com mutante. Depois da cura, 0 vetos em 371 candidatos."
    narrative: "Só 0,61% dos comandos chega ao juiz. Duas causas: o código embutido aceitava o .claude-plugin sem .claude/skills, e confundia str.replace com os.replace. O replay cobre só as rotas de sinal e de cópia; a de script solto e a de symlink dependem do disco de hoje e não entraram na conta. Zero vetos também quer dizer que o corpus não tem nenhum positivo: ele mede falso positivo, nunca cobertura. O caminho quente, um Write sem python, mediu 64 ms sob carga 12; o veto do MOAT, no mesmo instante, cerca de 440 ms."
    provenance:
      source: "docs/evolution/research/guard-plugin-write-2026-11/data/replay-2026-11-04.txt"
      locator: "as duas rodadas, antes e depois da cura"
      method: "measurement: subprocess do hook real, com o JSON como o runner entrega, sob nice"
      locality: "repo"

  - id: E_BANCADA_CASOS_E_MUTANTES
    node_type: evidence
    plane: DEV
    status: open
    impact: 4
    confidence: 0.8
    trace: ".claude/validation/lint-selftest.sh"
    label: "Família plugin_write_guard: a cópia limpa provada verde no mesmo arranjo antes de contar morto, com LC_ALL=C; 33 mutantes, cada um revertendo uma cura e exigindo que um caso NOMEADO reprove."
    narrative: "A 1ª rodada achou dois casos decorativos, e um defeito de âncora no próprio mutante, curados. Os dois casos que passavam verdes com a cura revertida: 'sem --home' não fixava o HOME, então o mutante lia a pasta real, que está limpa; e o caso da raiz estava mascarado pela outra cura. Sem o mutante, os dois davam licença. A polaridade de cala e o teto também são medidos: o --selftest imprime 7 linhas TETO, e um teto que passar a barrar reprova o caso e obriga a mudar o cabeçalho."

