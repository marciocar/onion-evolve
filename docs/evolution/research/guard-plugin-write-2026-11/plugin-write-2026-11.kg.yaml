meta:
  id: plugin-write-2026-11
  schema_version: "1"
  layer: audit
  baseline: "2026-11-04"
  review_after: "2026-12-20"
  note: "Forja (/meta:forge-guard) do veto à escrita de plugin em .claude/skills e da varredura do disco, a REGRA 114 (Plugin não mora em .claude/skills no disco). Decisão do maestro de 2026-11-04: veto estreito mais varredura no disco. É contenção de acidente e de injeção ingênua, NÃO fronteira. O Elenxo (a passada adversarial) ficou pendente: quem a roda é a sessão principal do core."
nodes:
  - id: E_DEFEITO_PLUGIN_EM_SKILLS_VENCE_O_VETO
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    valid_from: "2026-11-04"
    verified_at: "2026-11-04"
    verified_against: "data/lab-mods-cells.txt (células W1, W4, S1 a S7) e data/lab-sandbox-summary.txt, derivados dos laboratórios da sessão de 2026-11-04"
    label: "O DEFEITO, MEDIDO EM LABORATÓRIO, NÃO EM DANO DE PRODUÇÃO: em 2026-11-04, um plugin gravado em .claude/skills/x sob bypass carregou na sessão seguinte e venceu o veto do .env nas 3 repetições. Nenhum adotante sofreu isto."
    narrative: "Em 2026-11-04, com Claude Code 2.1.318, um plugin gravado em .claude/skills/x sob bypassPermissions carregou na sessão seguinte, e o tool.check dele venceu o veto do .env nas 3 repetições, gravado por Write (W1) e por Bash (W4). Nenhum adotante sofreu isto. O modelo era um roteiro contra um stub da Messages API, com chave fictícia: mede-se a decisão local do Claude Code sobre a chamada, não se um modelo real a tentaria. W2 (a sessão de escrita em acceptEdits) não gravou e o veto segurou. W3 (gravar e tentar na mesma sessão) gravou e o veto segurou: o efeito vem na sessão seguinte. S1 repete o efeito com o plugin já no lugar. S2 mostra que, sem aceite de confiança no projeto, o plugin de .claude/skills não carrega. S5 mostra o oposto na pasta de skills do usuário: sem aceite, carrega e vence. S3 (aninhado em a/b) e S7 (sub/.claude/skills com a sessão na raiz) não carregaram. S6 (a skill é link para fora do projeto) carregou e venceu."
    provenance:
      source: "docs/evolution/research/guard-plugin-write-2026-11/data/lab-mods-cells.txt"
      locator: "seções W1, W2, W3, W4, S1 a S7; hashes das fontes em data/SOURCE.txt"
      method: "measurement: sessões de roteiro fixo em contêiner, 3 repetições por célula, desfecho calculado do stream-json e do disco"
      locality: "repo"

  - id: E_NENHUM_VETO_BARRA_ESCRITA_EM_CLAUDE
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    valid_from: "2026-11-04"
    verified_at: "2026-11-04"
    verified_against: "data/lab-sandbox-matrix.tsv e data/lab-sandbox-summary.txt"
    label: "Das 129 tentativas de escrita em .claude/ e na pasta de skills do usuário, NENHUMA foi barrada por veto do core: 126 gravaram, e 3 foram recusadas pela validação de schema do próprio Edit, porque a carga do laboratório tinha um campo inválido. Com carga válida, as 3 gravaram."
    narrative: "Só nos alvos de plugin: 69 de 69. Matriz de 6 alvos por 6 métodos (Write, Edit, cat, tee, cp, python3 -c) mais 5 contornos, 3 repetições. O braço rodou no host (a emenda 1 do pré-registro diz por quê), com HOME falso. A leitura rápida de 0 barradas em 129 é verdadeira quanto a veto, e a ressalva das 3 fica escrita aqui para ninguém refutar o número pela metade."
    provenance:
      source: "docs/evolution/research/guard-plugin-write-2026-11/data/lab-sandbox-summary.txt"
      locator: "as 5 primeiras linhas; sessão a sessão em lab-sandbox-matrix.tsv"
      method: "measurement: reconta do results.jsonl do laboratório, pelo disco e não pela fala do modelo"
      locality: "repo"

  - id: E_CONFIGCHANGE_NAO_VE_PLUGIN
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 3
    confidence: 0.85
