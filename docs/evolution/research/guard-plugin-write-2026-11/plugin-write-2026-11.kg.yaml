    label: "TETO (peça 7): esta guarda é contenção de acidente e de injeção ingênua, NÃO fronteira. Quem quer contornar consegue, e o custo de contornar é baixo. Ela reduz o acaso, não o adversário; quem precisa de fronteira precisa de outra coisa, como configuração gerenciada ou sandbox."

  - id: C_TETO_BASH_FALHA_PELO_VOCABULARIO
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    trace: ".claude/hooks/pretooluse-plugin-write-guard.sh"
    label: "TETO: em Bash a lista falha pelo vocabulário. Sem veto, medidos como caso TETO: script versionado, python3 x.py, python3 -c com o caminho em variável, base64 -d com sh, git apply, tar -x na pasta de skills e nome calculado em runtime."
    narrative: "Sem caso próprio: unzip e cp -r cuja origem ainda não existe, script em dois tempos que monta o nome, e cp chamado por dentro de um programa. O pedido listava também python3 -c, script em dois tempos, curl -o, dd, install, rsync e nome em variável. Medido: com o caminho literal, o juiz alcança todos, e são casos de acusa. Fica de fora a forma em que o caminho não aparece, e a varredura pega o resultado se ele ficar no disco. Mudar de nome é contornar: um arquivo escrito em .claude/skills/x/.claude-plugin por qualquer dessas rotas só cai na varredura."

  - id: C_TETO_MOD_E_MCP_FORA_DO_PRETOOLUSE
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    label: "TETO: o processo de um mod e um MCP de escrita ficam fora do PreToolUse: a escrita deles não é uma chamada de Write nem de Bash desta sessão. Só a varredura os alcança, e só depois."

  - id: C_TETO_CAI_JUNTO_COM_O_SETTINGS
    node_type: claim
    plane: DEV
    status: open
    impact: 4
    confidence: 0.85
    label: "TETO: o hook é de projeto e cai junto com o .claude/settings.json e com o próprio script, que o veto não protege. A medição gravou settings e hook sem barreira (alvos T1 e T2), e EH mostrou disableAllHooks derrubando o veto na mesma sessão."
    narrative: "Proteger estes dois arquivos travaria a edição do core, com 74 commits em hooks em 30 dias: fica como declarado, sem veto."

  - id: C_TETO_PARTIDA_E_DETECCAO
    node_type: claim
    plane: DEV
    status: open
    impact: 3
    confidence: 0.85
    trace: ".claude/hooks/session-plugin-write-scan.sh"
    label: "TETO: no SessionStart o plugin presente JÁ CARREGOU: o aviso é detecção, não prevenção, e um plugin plantado pode mudar o que a sessão faz a partir daí."
    narrative: "A varredura não vê sub/.claude/skills, CLAUDE_CONFIG_DIR fora da pasta de casa, --plugin-dir nem node_modules, e na partida usa timeout de 4 s."

  - id: C_FALSO_POSITIVO_E_O_DEFEITO_DOMINANTE
    node_type: claim
    plane: DEV
    status: open
    impact: 3
    confidence: 0.75
    label: "A vizinha ensina: a guarda do .env deu dois falsos positivos hoje, relatados pelo maestro, e mais dois nesta forja (um grep em .claude/utils/*/* e um python3 com heredoc cujo texto citava o arquivo de segredos)."
    narrative: "A guarda nova casa só caminho de escrita, nunca o texto; e a cada rodada o replay é quem decide."

  - id: C_CONSEQUENCIA_A_SESSAO_NAO_FORJA_MOD
    node_type: claim
    plane: DEV
    status: open
    impact: 3
    confidence: 0.7
    label: "Consequência declarada: nesta árvore a sessão não forja mod em .claude/skills nem na pasta de skills do usuário, e a skill embutida plugin-authoring grava ali. Quem instala é o maestro, fora da sessão. Não há variável de bypass, por desenho."
    narrative: "Não medido: uma sessão real com a plugin-authoring contra este veto. O laboratório só mostrou que o caminho é o mesmo (mod carregado como x@skills-dir)."

  - id: Q_ELENXO_PENDENTE
