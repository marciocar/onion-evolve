  # ═══════════════════ A PERGUNTA ═══════════════════

  - id: Q_ONION_CORE_PORTS_MULTI_MODEL_2026_11
    node_type: question
    owner: core
    x_due: "2026-11-13"
    x_linear_issue: "SAC-354"
    impact: 5
    confidence: 0.5
    label: "Como o Onion deve fazer portas do onion-core para outros harnesses e modelos (onion-codex vivo; candidatas onion-mistral, onion-gemma, onion-qwen), com onion-core + Claude Code + Claude como base e uma camada de aderência e transformação gerada?"
    trace: "/meta:decide de 2026-11-02 · pergunta sobre portas do onion-core para outros harnesses e modelos · docs/evolution/research/onion-core-ports-multi-model-2026-11/SYNTHESIS.md"
    status: done
    plane: DEV
    verified_at: "2026-11-09"
    verified_against: "decisão do maestro em 2026-11-09, por pergunta com opções (/meta:decide): escolhida «Manter e Vibe antes»"
    narrative: |-
      Quatro sub-perguntas: (1) o padrão de mercado em out/2026 para framework de agente portável (AGENTS.md, Agent Skills, MCP, hooks, A2A, AAIF) e quais harnesses abertos rodam modelos abertos (Mistral Vibe, Qwen Code, Gemini CLI, opencode, goose, Codex com modelo aberto); (2) que peças do core cada candidata sustenta (veto por exit 2, skills, subagentes, MCP, headless para CI, sandbox), por primárias; (3) a forma da camada de transformação (gerador por porta como ops/materialize-door.sh vs ponte em runtime) sem voltar ao agnosticismo abandonado em 2026-05-18; (4) qual porta primeiro e com qual gatilho de demanda. Origem: decisão do maestro de 2026-11-02 no /meta:decide, que rejeitou o Esperanto como dependência do núcleo mas quer portas do onion-core para outras plataformas, com o Onion Evolve como fonte. PERMANECE ABERTA até o maestro selar o D_. Duas lacunas trazidas pela curadoria em 2026-11-08 entram nesta pergunta: o A2A neutro de agente não tem adapter para o Codex (a confirmação proposta é um adapter que passe no a2a-verify), e as ferramentas MCP do Onion estão declaradas em código, sem prompts/list, quando em arquivo os outros harnesses as pegariam sem cópia (o ganho é inferência da curadoria).

      verified_against anterior: «rodada /onion-research de 2026-11-02 (modo decisão, /meta:decide): 17 claims confirmadas, 8 refutadas, 38 fontes e 37 claims cortadas; 28 objeções sobreviventes do Elenxo»
      Selado por /meta:decide em 2026-11-09: escolhida «Manter e Vibe antes»; descartadas: «Manter com Qwen primeiro» · «Abrir já um gerador».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-11-09: «Como o Onion deve fazer as portas do onion-core para outros harnesses e modelos?»"
      method: "testimony: decisão do maestro por pergunta com opções, 2026-11-09"
      locality: "pessoa"

