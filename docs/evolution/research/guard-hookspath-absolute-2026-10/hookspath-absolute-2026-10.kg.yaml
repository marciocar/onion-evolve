    node_type: evidence
    plane: DEV
    impact: 3
    confidence: 0.85
    status: confirmed
    verified_at: '2026-10-26'
    verified_against: "git config --show-origin --get core.hooksPath no core, de dentro da worktree da forja: file:<core>/.git/config <core>/.githooks (absoluto), poucas horas depois de o maestro o ter devolvido a relativo; o hook estendido, rodado com o JSON de sessão do runner, avisou no 1º prompt e calou no 2º, rc 0 nos dois"
    trace: '.claude/hooks/session-currency-check.sh'
    label: 'DOGFOOD: no mesmo dia em que o maestro devolveu o core a relativo, a config já estava ABSOLUTA de novo quando a forja rodou (com worktrees de agente sendo criadas). O lembrete estendido avisou no 1º prompt e calou no 2º.'
    narrative: 'DOGFOOD: no mesmo dia em que o maestro devolveu o core a `.githooks` relativo, a forja leu a config de dentro da própria worktree de agente e a achou ABSOLUTA de novo. A atribuição exata do regravador não foi provada nesta medição (o .git/config também é tocado por outras escritas de git), mas o fato é o que o lembrete existe para dizer: voltou, e ninguém foi avisado. O hook estendido avisou no 1º prompt, calou no 2º da mesma sessão, rc 0 nos dois. A forja não mexeu na config (ordem do maestro).'
    provenance:
      source: "<core>/.git/config"
      locator: "git config --show-origin --get core.hooksPath; echo '{\"session_id\":\"dogfood-hp\"}' | bash .claude/hooks/session-currency-check.sh (2 vezes)"
      method: "medição: leitura de config e invocação do hook como o runner o chama"
