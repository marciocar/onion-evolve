  - id: D_SUBSTRATO_LEMBRETE_NO_HOOK_DE_BASE_ATUAL
    node_type: decision
    plane: DEV
    impact: 4
    confidence: 0.85
    status: done
    verified_at: '2026-10-26'
    verified_against: "guard-census 2026-10-26 com GUARD_CENSUS_QUERY='hooksPath ': nenhuma guarda menciona o termo; SessionStart registrados (task-manager, worklog, inbox, farol) não tratam de gate; session-degraded-notice é da escada de modelos; session-currency-check é UserPromptSubmit com estado por sessão e trata de base atual"
    trace: '.claude/hooks/session-currency-check.sh'
    label: 'O SUBSTRATO: o lembrete estende o session-currency-check (UserPromptSubmit), não um SessionStart: a regravação acontece NO MEIO da sessão, ao criar worktree de agente, e só um hook de prompt a vê nascer.'
    narrative: 'O SUBSTRATO: estender o session-currency-check.sh, sem hook novo nem registro novo. Três razões medidas: (1) a regravação acontece no meio da sessão, quando uma worktree de agente nasce, e um SessionStart (o do inbox, o candidato natural) só a veria na sessão seguinte; (2) o hook já tem o estado por sessão em diretório da conta, então o aviso sai 1× por (sessão, valor) e re-avisa se for consertado e voltar; (3) o assunto é o dele, "base atual": o gate que roda tem de ser o da branch. O bloco roda ANTES do censo e não depende dele (sem rede, sem registro). LEMBRETE, exit 0 sempre (decisão do maestro): o caminho absoluto não quebra o commit, só o deixa sem prova. Erra para o lado de calar: só fala quando o valor é absoluto, termina em `.githooks` e a árvore tem .githooks/.'
    provenance:
      source: ".claude/validation/guard-census.sh"
      locator: "GUARD_CENSUS_QUERY='hooksPath ' bash .claude/validation/guard-census.sh . --markdown; .claude/settings.json hooks.SessionStart e hooks.UserPromptSubmit"
      method: "medição: censo de guardas e leitura do registro antes da forja"
      locality: "repo"

