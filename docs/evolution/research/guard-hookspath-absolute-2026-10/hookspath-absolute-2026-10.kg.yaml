    narrative: 'A 1a PASSADA ACHOU FALSO POSITIVO: o 1º corte decidia por STRING (absoluto terminado em .githooks), a mesma classe que o verificador de gate de adoção já pagou em 2026-09-15. Avisava num .githooks compartilhado noutro lugar e no .githooks global na home da conta, onde o conserto trocaria quais hooks rodam, e avisava numa worktree cujo valor efetivo já era relativo. A cura: valor efetivo (git config --get), o til expandido, e comparação por identidade (`-ef`) com o .githooks/ da árvore atual ou do checkout principal. Os 4 mutantes sobreviventes ganharam caso; a família foi de 10 para 16 casos.'
