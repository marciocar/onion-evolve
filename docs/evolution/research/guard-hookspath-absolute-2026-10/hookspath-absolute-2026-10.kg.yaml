    trace: '.claude/validation/lint-selftest.sh'
    label: 'BANCADA: família hookspath_reminder, 16 casos invocando o hook como o runner. Absoluto deste repo avisa; relativo, unset, fora de git, .githooks alheio, global e efetivo relativo calam; 7 mutantes mordem.'
    narrative: 'BANCADA: família run_hookspath_reminder_selftests, com HOME, gitconfig global e de sistema isolados. Avisa: (a) absoluto com o conserto e rc 0, (a3) numa worktree ligada, (a4) sem o censo, (b2) consertado e voltando ao MESMO valor, (b3) com barra final, (f) por o til que resolve no .githooks do repo. Cala: (a2) 2ª vez na sessão, (b) relativo, (c) unset, (d) fora de git, (e) outro diretório, (e2) outro .githooks compartilhado, (e3) .githooks global na home da conta, (g) efetivo relativo por config da worktree, (h) .githooks/ ausente. Mutante (m) dentro da família; mais 6 mutantes externos, cada um reprovando o caso nomeado.'
    provenance:
      source: ".claude/validation/lint-selftest.sh"
      locator: "run_hookspath_reminder_selftests, casos (a) a (h) e (m)"
      method: "medição: bancada executada com LC_ALL=C"
      locality: "repo"

  - id: C_TETO_CONSERTO_NO_LOCAL
    node_type: claim
    plane: DEV
    impact: 2
    confidence: 0.8
    status: confirmed
    verified_at: '2026-10-26'
    verified_against: "o bloco lê o valor efetivo (git config --get) e compara por -ef com <toplevel>/.githooks e <pai do git-common-dir>/.githooks; o texto do conserto é sempre git config core.hooksPath .githooks"
    trace: '.claude/hooks/session-currency-check.sh'
    label: 'TETO 1: o conserto do texto escreve no --local. Se o absoluto vier de config por worktree (extensions.worktreeConfig), o lugar certo é --worktree, e o texto não distingue. Só o .githooks deste repo dispara; outro gestor cala.'
    narrative: 'TETO 1: o lembrete lê o valor EFETIVO e só fala quando ele é, por identidade de diretório, o .githooks/ desta árvore ou do checkout principal. Um gestor de hooks compartilhado ou global cala de propósito: o conserto `.githooks` trocaria quais hooks rodam (cláusula 4). O texto do conserto escreve no `--local`; se o absoluto vier de config por worktree, o lugar certo é `--worktree`, e o texto não distingue.'
    provenance:
      source: ".claude/hooks/session-currency-check.sh"
      locator: "função hookspath_reminder"
      method: "leitura: o código do lembrete"
      locality: "repo"

  - id: C_TETO_SUBAGENTE_E_SESSAO_PRINCIPAL
    node_type: claim
    plane: DEV
    impact: 2
    confidence: 0.8
    status: confirmed
    verified_at: '2026-10-26'
    verified_against: "o hook é UserPromptSubmit no settings.json do projeto; subagente não recebe prompt do usuário"
    trace: '.claude/settings.json'
    label: 'TETO 2: o lembrete chega à sessão principal (UserPromptSubmit), não ao subagente que acabou de criar a worktree; ele aparece no prompt seguinte do maestro. Não conserta nada: o conserto é um comando que a sessão roda com o maestro sabendo.'
    narrative: 'TETO 2: subagente não dispara UserPromptSubmit. O lembrete aparece na sessão principal no prompt seguinte à regravação, e só nela. Não conserta: o conserto (`git config core.hooksPath .githooks`) é mudança de config que a sessão roda com o maestro sabendo. A causa a montante (o Claude Code regravar o caminho) continua viva enquanto o produto fizer isso.'
    provenance:
      source: ".claude/settings.json"
      locator: "hooks.UserPromptSubmit (session-currency-check.sh)"
      method: "leitura: registro do hook no settings do projeto"
      locality: "repo"

