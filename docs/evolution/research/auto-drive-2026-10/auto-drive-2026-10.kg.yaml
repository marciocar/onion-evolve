    verified_against: "resposta da sessão do adotante dedicado ao KG-SSOT ao core em 2026-10-08 (mensagem entre sessões), opinião, não selo"
    label: "nó fechado pelo auto-drive exige provenance que o fechador não escreveu: locator com URL do PR mergeado, SHA do merge e id do run de CI; source sendo o estado lido (mergedAt, conclusão dos checks); method nomeando a máquina; nunca fecha decision nem faz flip de status de verdade; verified_against cita o que foi lido, nunca o que foi feito"
  - id: E_OPINIAO_RISCOS_QUE_FALTAVAM
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.7
    verified_at: 2026-10-08
    verified_against: "resposta da sessão do adotante dedicado ao KG-SSOT ao core em 2026-10-08 (mensagem entre sessões), opinião, não selo"
    label: "riscos que faltavam: CI verde pode ser vazio (filtro de paths, sem check obrigatório), então a parada exige check presente e verde; Elenxo do mesmo modelo é uma voz só, falta um agente separado que reabra os artefatos; cadeia parcial pede estado retomável por item e não fechar o épico com filho aberto; insumo vencido pede --freshness antes e parada em STALE de alto impacto; o status do Zoho de layout padrão mente por omissão; --merge deve ser false por padrão até a primeira cadeia provada, e true só para item que não é decision"
