    label: "proposta: forjar o degrau AUTOMATE do /meta:drive — 1..n raízes (issue ou id de nó; sem item drena a fila-pronta até o budget), expansão da cadeia (épico, task, subtask e DEPENDS_ON) em ordem topológica, cada item até o merge (--merge=true por padrão porque o maestro invoca; nunca cron), relatório por item no task manager e no grafo; paradas duras em decisão não-tomada, Elenxo reprovado, CI vermelho inesperado, path vendorizado ou repo alheio e budget; merge serial enquanto não houver merge driver. Depende de SAC-66 e SAC-67 (esteira) e da interface do SAC-63; muda o degrau selado 'merge 100% humano, em lote', logo passa pelo Elenxo"
