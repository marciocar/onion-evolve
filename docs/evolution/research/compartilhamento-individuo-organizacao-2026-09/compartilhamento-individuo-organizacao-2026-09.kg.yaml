  # ── A DECISÃO (open — quem sela é o maestro) ─────────────────────────────────────────────
  - id: D_INDIVIDUAL_ORGANIZATION_SHARING_CRITERION
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.55
    label: 'DECISAO ABERTA (o maestro sela): qual criterio separa compartilhamento legitimo e indissociavel da vigilancia no eixo pessoa x empregador do Company Brain, entre (A) compartilhamento indissociavel bidirecional respeitando a singularidade, (B) colaborador so como AUTOR de decisao, nunca como dado, (C) A restringida — fluxo por proposito com assimetria de padrao (organizacao->individuo aberto so para o dado da propria pessoa; individuo->organizacao so predicado) sob criterio Barbulescu + defesa matematica contra diferenca, (D) GATED — rodada complementar antes de selar. RECOMENDACAO DO ELENXO: C como DIRECAO e D como CONDICAO DE SELO — nao selar C antes da rodada complementar. A posicao A sobrevive como TESE; B nao e exigida por lei (e escolha de produto) e o no de identidade do Glean e compativel com ela (permissao, nao sujeito avaliado). A tese A pede um criterio operacional, porque indissociavel sem mecanismo e exatamente o que a restricao matematica do adotante derruba. A restricao do adotante NAO foi refutada; a propria Microsoft a confirma ao impor piso de grupo (padrao 10, reduzivel a 5) — e piso de grupo sozinho nao para o ataque tracker, por isso C exige defesa contra composicao de consultas. Articulacao: Second Brain = soberano do individuo (nada sai sem predicado); Company Brain = devolve a pessoa o que e dela e o que a afeta, e recebe individuo->organizacao so como predicado com proposito declarado; Onion = o mecanismo verificavel que aplica o criterio (corpus: PO_DISCLOSURE_VC, PO_BUDGET, PO_L3_FILTRO, fronteira-decision/D_FRONTEIRA segue open).'
