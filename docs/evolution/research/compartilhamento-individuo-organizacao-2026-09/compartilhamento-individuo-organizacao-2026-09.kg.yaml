    label: 'AS QUATRO EMENDAS A C, AGORA PARTE DELA. (E1) A FINALIDADE DECLARADA NAO E PROTECAO: C50 mede que finalidade comunicada quase nao move atitude, desempenho nem estresse, e o TJUE (C-34/21 §61/§71/§81) diz que regra que so reitera finalidade e necessidade nao tem conteudo normativo proprio — C carrega conteudo CONCRETO (limiar, budget de consultas, denylist de predicados, masking) ou e decorativa pelos dois padroes. (E2) A ALAVANCA QUE MEDE E O CONTROLE DO ALVO: C48 mostra que constraints/controle e a UNICA caracteristica com efeito positivo medido (mais justica e autonomia percebidas, menos invasao) — C ganha botao sobre COMO e QUANDO (escopo, janela, inspecao, veto), nao so finalidade e egresso por predicado. (E3) NOTIFICACAO PREVIA CAI DE PORTAO A SALVAGUARDA obrigatoria porem insuficiente (C7 da ANPD: politica previa nao cura o excesso; C20 Lopez Ribalda II: notificacao e um criterio entre outros) — o portao passa a ser NECESSIDADE + MINIMIZACAO. (E4) REGIME DE EXCECAO INVESTIGATIVA: a Grande Camara admite vigilancia OCULTA sob suspeita razoavel de falta grave (C21); C cria modo investigativo GATED, LOGADO e REVISAVEL ex post — mecanismo sem porta de excecao e contornado no primeiro incidente, com cobertura jurisprudencial. Vale junto o LIMITE DURO BR ja selado: o Exemplo 7 do guia da ANPD reprova rastreio de atividade/produtividade de empregado sob legitimo interesse, logo o canal individuo->organizacao nao carrega telemetria de atividade em NENHUM grau de agregacao — `so predicado provado` le-se como predicado sobre ARTEFATO DE TRABALHO E DECISAO.'
