    label: 'SELADA pelo maestro 2026-09-14: AS QUATRO EMENDAS FORAM ADOTADAS, e C passa a valer com elas. Razao do maestro para nao esperar: as quatro tem evidencia ancorada e NAO dependem das 7 lacunas legais que seguem abertas (TST por acordao, ANPD sancionadora, negociacao coletiva) — essas ele ve em paralelo e informa. Logo C ja tem desenho utilizavel. Texto original da proposta: QUATRO EMENDAS PROPOSTAS A C, com evidencia ancorada, mais um LIMITE DURO de jurisdicao BR — o maestro decide, nada aqui foi selado. (E1) a FINALIDADE declarada nao e protecao: C50 mede que finalidade comunicada quase nao move atitude, desempenho nem estresse, e o TJUE (C28/C29/C30, C-34/21 §61/§71/§81) diz que regra que so reitera finalidade e necessidade nao tem conteudo normativo proprio — C precisa carregar conteudo concreto (limiar, budget de consultas, denylist de predicados, masking) ou e decorativa pelos dois padroes. (E2) FALTA A ALAVANCA QUE MEDE: C48 mostra que controle/constraints do alvo e a UNICA caracteristica com efeito positivo medido (mais justica e autonomia percebidas, menos invasao) — C da finalidade e egresso por predicado e nenhum botao sobre COMO e QUANDO. (E3) NOTIFICACAO PREVIA cai de porta de entrada a salvaguarda obrigatoria porem insuficiente (C7 da ANPD: politica previa nao cura o excesso; C20 Lopez Ribalda II: notificacao e um criterio entre outros) — o portao passa a ser necessidade + minimizacao. (E4) FALTA REGIME DE EXCECAO INVESTIGATIVA: a Grande Camara admite vigilancia OCULTA sob suspeita razoavel de falta grave (C21); mecanismo sem porta de excecao e contornado no primeiro incidente — ou C cria modo investigativo gated, logado e revisavel ex post, ou declara que o recusa. LIMITE DURO BR: o Exemplo 7 do guia da ANPD (C6) reprova rastreio de atividade/produtividade de empregado sob legitimo interesse, com a vulnerabilidade do empregado retirando eficacia da legitima expectativa — logo o canal individuo->organizacao de C nao pode carregar telemetria de atividade em NENHUM grau de agregacao: `so predicado provado` tem de ser lido como predicado sobre ARTEFATO DE TRABALHO E DECISAO, nunca sobre atividade. Texto original da proposta: PROPOSTA DE REVISAO DO SELO (quem decide e o maestro; D_INDIVIDUAL_ORGANIZATION_SHARING_CRITERION NAO foi tocada). A rodada complementar CUMPRIU A CONDICAO DE FORMA DESIGUAL (eixos 3 e 5 fechados; eixo 1 BR so pelo guia da ANPD; eixo 4 por proxy; acordo coletivo BR sem fonte) — e, ao cumpri-la, encontrou tres pontos que atingem o DESENHO de C, nao a sua direcao: (1) NOTIFICACAO PREVIA nao pode ser CONDICAO DE ENTRADA do fluxo — no BR informar antes nao cura o excesso (E_R2_ANPD_POLITICA_PREVIA_NAO_CURA_EXCESSO) e no TEDH a notificacao nao e veto autonomo (E_R2_LOPEZ_RIBALDA_NOTIFICACAO_NAO_E_VETO): nem basta, nem e estritamente exigida; (2) FINALIDADE DECLARADA e condicao juridica necessaria mas NAO e salvaguarda efetiva — a meta-analise EPM mede que o proposito comunicado tem pouco ou nenhum efeito, enquanto o CONTROLE DO ALVO tem (E_R2_EPM_PROPOSITO_COMUNICADO_SEM_EFEITO, E_R2_EPM_CONTROLE_DO_ALVO_MELHORA_PERCEPCAO): se C se chama "fluxo por proposito", o nome nomeia a metade fraca do mecanismo; (3) o canal individuo->organizacao sob LEGITIMO INTERESSE esta REFUTADO para telemetria de atividade da pessoa pelo Exemplo 7 do guia da ANPD — o que restringe o canal a PREDICADO com base propria, e nao a "agregado com piso". Pergunta ao maestro: o selo de C se mantem trocando (a) notificacao previa por CONTROLE REAL DO ALVO como condicao de entrada, e (b) piso de grupo por LEDGER DE CONSULTAS (budget de composicao, com o numero de Dinur & Nissim) como defesa matematica? Esta rodada PARA AQUI, conforme a instrucao: propoe, nao sela.'
    trace: 'docs/evolution/research/compartilhamento-individuo-organizacao-2026-09/compartilhamento-individuo-organizacao-2026-09.kg.yaml'

