    verified_against: 'EUR-Lex CELEX 62023CJ0065 / curia docid=293835 (MK v K GmbH, 19/12/2024, reenvio do Bundesarbeitsgericht): transferencia de dados de empregados do SAP para servidor da controladora nos EUA com base em Betriebsvereinbarung — nao monitoramento'
    valid_from: '2024-12-19'
    source_tier: 9
    source_kind: court-decision
    label: 'OBJECAO SOBREVIVENTE — o achado C-65/23 foi citado de fonte tier 6 quando o primario existe, e extrapola o enquadramento: o caso e de TRANSFERENCIA, nao de monitoramento. O que o tribunal decidiu: o acordo coletivo nao afasta os arts. 5, 6(1) e 9 e o juiz nacional revisa a necessidade. Dizer que nao basta para legitimar vigilancia e extrapolacao. E e jurisdicao UE: nada sobre LGPD/CLT. Limite imposto: C nao pode citar C-65/23 como regra de vigilancia, so como piso (acordo coletivo nao substitui base legal nem necessidade).'
    trace: 'https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62023CJ0065'

