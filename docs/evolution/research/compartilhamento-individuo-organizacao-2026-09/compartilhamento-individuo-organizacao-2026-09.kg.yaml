    label: 'DEFEITO DE GATE MEDIDO NA PROPRIA RODADA, e CURADO NO MOTOR: 13 das 22 claims que a ancoragem devolveu como ANCORADA chegaram com `quote` VAZIA e `locator` `—`. O write(KG) as escreveu com ressalva no rotulo e tier rebaixado (5 a 7 em vez de 9-10), mas o pipeline as CONTOU como ancoradas — e o Elenxo cravou: `enquanto o gate aceitar campo vazio, contar claims ancoradas nao mede nada`. Cura no `.claude/workflows/onion-research.js` (nao no prompt): (a) o schema do leitor passa a exigir `quote` com pelo menos 30 caracteres e `locator` com pelo menos 2; (b) o ancorador devolve a citacao que ELE conferiu, com precedencia sobre a do leitor; (c) o casamento leitor-ancorador deixa de exigir texto identico (era ai que a citacao se perdia); (d) FAIL-CLOSED no motor: veredito ANCORADA sem citacao e REBAIXADO para AFIRMADA-SEM-CITACAO e vai para a coluna das rejeitadas. Bancada: casos (n) e (n2) da familia research_workflow, com mutante provado no arquivo vivo. ALEM DISSO, uma conclusao desta rodada foi REFUTADA por medicao direta nesta sessao: o alvo (d) concluiu `nao ha analogo do art. 88 porque a lista do art. 611-A e fechada`, e o caput diz `entre outros` — ver E_R3_CLT_611A_ENTRE_OUTROS_MEDIDO. CONTABILIDADE DA RODADA 3 (primarias nomeadas, 2026-09-13) — a rodada dirigida pelas lacunas ja nomeadas em E_R2_LACUNAS_RODADA_COMPLEMENTAR_0913; NADA aqui reabre o selo de D_INDIVIDUAL_ORGANIZATION_SHARING_CRITERION. ALVOS LIDOS (6): tst-acordaos, anpd-decisao-monitoramento, lgpd-texto-legal, deci-ryan-primario (com a meta-analise EPM de Ravid et al. 2023 no mesmo alvo), viva-bin-unitario-e-epsilon, acordo-coletivo-br. FONTES DECLARADAS INALCANCAVEIS PELO RUN: NENHUMA — mas a rodada REGISTRA 4 falhas de acesso ao INTEIRO TEOR dentro do alvo tst-acordaos, cada uma com causa distinta e reproduzida pelo verificador: jusbrasil.com.br devolveu HTTP 403 (bloqueio), o PDF da migalhas chegou como binario ilegivel, o backend de jurisprudencia do TST recusou conexao (ECONNREFUSED) e a busca por boletins do TRT12 nao localizou o caso citado nominalmente. ANCORADAS: 22 (viraram no). REJEITADAS NA ANCORAGEM: 8, TODAS COMO EXAGERADAS — (1) tst-acordaos: o alvo RR-21162-51.2015.5.04.0014 (cameras) nao foi lido em inteiro teor e a pagina https://www.tst.jus.br/en/-/... esta INTEGRALMENTE EM PORTUGUES apesar do sufixo /en/, logo a frase em ingles atribuida a ela nao existe (a parte de INACESSIBILIDADE do claim foi, essa sim, reproduzida e sobrevive — virou o registro de falhas acima); (2) anpd CLAIM 1: "nenhum processo sancionador concluido trata de monitoramento" — a lista oficial confere quase item a item, mas a pagina NAO descreve o assunto de cada processo, entao o "nenhum" e inferencia do verificador sobre nomes, nao leitura; (3) anpd CLAIM 3: o Guia Orientativo como unico documento que menciona monitoramento de funcionarios — o verificador LEU o PDF oficial (53 paginas) e CONFIRMOU a substancia (Exemplo 7, p. 24), mas a claim foi marcada exagerada pelo escopo "unico documento"; (4) e (5) deci-ryan: "definicao formal de necessidade basica" (p. 74, col. 2) e "falha de EMPREGADORES/organizacoes contribui para alienacao" (p. 74, col. 1) — AS DUAS QUOTES SAO VERBATIM E ESTAO ONDE INDICADO, e o texto de fato nomeia "employees" e "organizations"; o que caiu foi a CLAUSULA FINAL de cada uma ("base teorica para prever dano do monitoramento", "ponte primaria entre SDT e ambientes de trabalho monitorados"), que e inferencia do leitor — o artigo de 2000 nao menciona monitoramento em ponto algum; (6) a Tabela 6 da meta-analise EPM: os dois trechos conferem exatamente (Invasiveness->Stress/strain K=10, N=3260, rho=.20, IC95%[.10,.29], p.23; Transparency->Broad attitudes K=14, N=3696, rho=.25, IC95%[.11,.39], p.24), mas a PROSA fundiu "privacy invasion" e "CWBs" como se fossem a mesma linha rotulada rho=.22 — na tabela sao DUAS linhas distintas sob Invasiveness; (7) e (8) acordo-coletivo-br: as duas citacoes do acordao de cameras (RR-21162-51.2015.5.04.0014, PDF oficial de 34 paginas, LIDO INTEIRO pelo verificador) NAO sao verbatim — comprimem e reescrevem as frases reais (omissoes de "dos empregados", "pelo empregador", troca de "partes intimas" por "a intimidade", supressao de "nao configura ato ilicito,", e uniao por "desde que" de duas frases separadas por ponto final em fls.19); a SUBSTANCIA foi confirmada pelo verificador — o acordao funda a licitude SO no art. 2o da CLT e na ponderacao constitucional, SEM QUALQUER MENCAO a acordo/convencao coletiva como base legitimadora, o que e o achado negativo que o eixo (d) pedia. LACUNAS QUE CONTINUAM ABERTAS: (1) o TST segue SEM ACORDAO LOCALIZADO no eixo e-mail corporativo — as 4 claims ancoradas chegaram sem quote e sem locator, entao a lacuna (3) da rodada 2 NAO foi fechada, apenas deslocada; (2) NENHUMA fonte, em TRES rodadas, entrega um LIMIAR operacional que separe agregado-com-piso de agregado-sem-piso — e a rodada 3 mostrou por que a pergunta estava mal posta: no produto de referencia o piso nem se aplica ao bin (E_R3_VIVA_PISO_APLICA_AO_FILTRO_NAO_AO_BIN); (3) art. 5o, II da LGPD (rol taxativo de dado sensivel) e os paragrafos do art. 20 NAO foram lidos — a ponte histograma->dado sensivel e a controversia da revisao por pessoa natural seguem sem ancora; (4) a ponte SDT->monitoramento continua sendo INFERENCIA: o primario de Deci & Ryan foi finalmente lido e ancorado, e ele nao fala de monitoramento; (5) os COEFICIENTES da Tabela 6 do EPM seguem nao ancorados em prosa correta (os numeros existem e conferem; a claim que os descrevia, nao); (6) as quotes verbatim de Viva e CLT NAO chegaram ao dossie — a leitura foi ancorada, a citacao nao, MESMA familia da lacuna (4) da rodada 2; (7) Contextual Integrity (Nissenbaum), Second Brain/PKM e Notion seguem sem fonte lida, agora em TRES rodadas; (8) as 30 objecoes do Elenxo da rodada 1 (data/wf_88199ba9-b9a-return.json) seguem sem julgamento. NOTA DE RECONCILIACAO: E_R2_LACUNAS_RODADA_COMPLEMENTAR_0913 NAO foi superseded de proposito — ele e o registro FIEL da rodada 2 e continua correto sobre ela; o que mudou foi o estado das lacunas, e isso se le aqui.'
