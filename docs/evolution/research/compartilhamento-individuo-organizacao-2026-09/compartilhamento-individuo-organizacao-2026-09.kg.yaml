    label: 'TRES EMENDAS DE MECANISMO PROPOSTAS AO DESENHO DA OPCAO C, com evidencia ancorada nesta rodada — o maestro decide; D_INDIVIDUAL_ORGANIZATION_SHARING_CRITERION NAO foi tocada e NADA aqui reabre o selo. Somam-se as quatro emendas ja em Q_R2_REVISAO_DO_SELO_C, nao as substituem. (F1) PISO DE GRUPO SAI DO DESENHO COMO SALVAGUARDA. O produto de referencia do mercado documenta que o minimum group size protege o FILTER GROUP e nao o BIN, e que um bin PODE exibir um unico individuo (E_R3_VIVA_PISO_APLICA_AO_FILTRO_NAO_AO_BIN, E_R3_VIVA_BIN_UNITARIO_PERMITIDO). Isso confirma por primario de fornecedor o testemunho do adotante (E_ADOPTER_DIFFERENCE_ATTACK_SMALL_TEAMS) e torna a pergunta "piso 5 ou piso 10" irrelevante. Proposta: C substitui piso de grupo por LEDGER DE CONSULTAS com budget de composicao — a defesa que E_R2_TRACKER_* e E_R2_DINUR_NISSIM_* ja indicavam e que o corpus do Onion ja tem em classification-por-vertical/PO_BUDGET. (F2) "PRIVACIDADE DIFERENCIAL" SO SE INVOCA COM EPSILON DECLARADO. A pagina oficial da Microsoft nao publica epsilon, orcamento nem garantia formal, e a garantia que declara e qualitativa ("nenhuma atividade individual pode ser discernida COM CERTEZA") — E_R3_VIVA_SEM_EPSILON_DOCUMENTADO, E_R3_VIVA_GARANTIA_QUALITATIVA_NAO_FORMAL. Proposta: no Onion, o termo so entra no desenho acompanhado de parametro e ledger; caso contrario usa-se "ruido", que e o que de fato se entrega (behavior-over-declaration). (F3) O EIXO BR NAO DA PORTA NEGOCIAL — E ISSO E GANHO, NAO PERDA. A resposta a pergunta (d) e NAO: o art. 611-A da CLT tem rol FECHADO e monitoramento/dados do trabalhador nao esta nele (E_R3_CLT_611A_LISTA_FECHADA_SEM_MONITORAMENTO), logo nao existe analogo brasileiro do art. 88 do GDPR e acordo coletivo NAO legitima o que a lei sozinha nao legitima; o acordao de cameras lido inteiro funda a licitude SO no art. 2o da CLT e na ponderacao constitucional, sem mencionar convencao coletiva. Proposta: C declara explicitamente que sua assimetria NAO e negociavel para baixo por instrumento coletivo no BR. TENSAO QUE A RODADA DEIXA ABERTA AO MAESTRO (nao resolvida aqui): E_R3_TST_MONITORAR_FORMA_E_CONTEUDO_EMAIL_CORPORATIVO indica um piso judicial trabalhista MAIS PERMISSIVO que C, enquanto o Exemplo 7 do Guia da ANPD REPROVA rastreio de atividade sob legitimo interesse — a reconciliacao proposta e a fronteira ARTEFATO DE TRABALHO x ATIVIDADE DA PESSOA (acessar o artefato e licito; rastrear a pessoa nao), que ja aparece como LIMITE DURO BR em Q_R2_REVISAO_DO_SELO_C. E o achado que mais pesa contra o custo-beneficio de qualquer monitoramento: a meta-analise de K=94 e N=23.461 nao acha evidencia de ganho de desempenho e acha associacao com estresse INDEPENDENTE das caracteristicas do monitoramento (E_R3_EPM_RAVID_SEM_GANHO_DE_DESEMPENHO_COM_ESTRESSE) — o que torna o teste de NECESSIDADE do art. 10 par. 1o da LGPD mais dificil de passar, nao menos. Esta rodada PARA AQUI: propoe, nao sela.'
