  - id: E_LACUNAS_PLUGIN_DIRECTORY_0904
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: 2026-09-04
    verified_against: 'contabilidade da propria rodada: 26 fontes, 30 claims, 15 sobreviventes, 11 quedas, 0 nao-verificadas por falha de acesso'
    source_tier: 10
    source_kind: primary
    label: 'LACUNAS E QUEDAS. (a) REFUTADAS/derrubadas nos votos, 11: os DOIS marketplaces publicos com o fluxo `claude plugin validate` + CI auto-bumpando o pin (code.claude.com/docs/en/plugins); o diretorio oficial como marketplace embutido e nao lista curada externa (claude.com/docs/plugins/submit); a alegacao de que a politica NAO documenta granularidade/estrutura/namespacing/i18n e remeteria a "Software Directory Terms" separado (support.claude.com); os 13 plugins em 4 categorias do marketplace.json oficial (anthropics/claude-code); o schema json.schemastore.org/claude-code-marketplace.json exigindo name/description/source/category/version por plugin (mesma fonte); o diretorio publicar SO revisao automatizada sem criterios tecnicos (claude.com/plugins); o namespace ser SEMPRE obrigatorio mesmo com a doc dizendo opcional (issue 15882); wshobson/agents como marketplace multi-harness de maior tracao por trajetoria com 39.4k estrelas (GitHub search created:>2025-06-01 sort=stars); o mirror redirecionar submissoes a clau.de sem criterios publicos (mesma busca); a curadoria comunitaria exigir varredura automatizada MAIS aprovacao manual (claude-plugins-community); e o marketplace operar sem vetting central, sem assinatura de codigo e sem sandboxing em runtime (Red Hat, vendor-on-competitor tier 4). (b) NAO VERIFICADAS por falha de acesso: 0. (c) CORTADAS por orcamento: 26 fontes e 30 claims foram o teto da rodada. (d) EIXOS QUE FICAM ABERTOS por ausencia de fonte primaria publica, nao por descuido: frontmatter de commands (argument-hint, description), politica de idioma/i18n e campo de locale (nenhuma fonte diz se plugin nao-EN e aceito — critico, o Onion e todo pt-BR), tamanho/vendoring, licenca e versionamento. Achado meta: a queda simultanea das duas claims de ESTRUTURA de marketplace.json e das duas de PROCESSO de curadoria diz que a documentacao publica descreve o QUE se submete, quase nada do COMO se valida.'
