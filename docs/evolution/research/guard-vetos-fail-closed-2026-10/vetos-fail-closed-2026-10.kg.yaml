    verified_at: "2026-10-11"
    verified_against: "corpus dos 31.183 comandos Bash únicos dos transcripts do core em 2026-10-11: a forma da lib inteira fecharia 1.361 (4,36%, 853 deles gh api de leitura); a 1ª redação do recorte fechava 117 (0,38%) no protect-main e 858 (2,75%) no merge-gate, e a final, com as regras de aspas e de construção dinâmica da passada adversarial, fecha 660 (2,12%) e 1.779 (5,71%). Bancada: 19 casos sem python3 (np-*) e mutantes M1 a M6 e M10 a M12, todos mordendo"
    trace: ".claude/hooks/lib/invocation-lines.sh"
    label: "sem python3 os vetos fecham SÓ o que pode tocar o objeto: force-push no protect-main (2,12% dos comandos reais) e push, gh merge, gh api com rota e gh repo sync no merge-gate (5,71%), contando a construção dinâmica"
    narrative: "O JSON é lido sem python (onion_json_string_field: grep -oE de DFA e desescape de \\\\, \\\", \\n, \\t, \\r, \\/; 0,45 s a 1 MB) e, se o campo command nem aparecer, julga-se o JSON cru: o erro só pode fechar. O push do merge-gate não foi afinado por marca de main/HEAD/push nu: cobriria 445 dos 502 pushes e abriria espaço para fail-open. Custo declarado do modo degradado: push de feature, echo e heredoc que CITAM push/merge passam a ser barrados no merge-gate, e `rm -rf x && git push origin feat` no protect-main (o -rf parece marca de force). A mensagem diz que falta python3. PASSADA ADVERSARIAL (2026-10-11) reprovou a 1ª redação, que dizia 'errar aqui só pode fechar': `git pu''sh -f origin main`, `gh pr me\\rge 1`, a rota numa variável e o push vindo do xargs ABRIAM sem python3. Curado: aspas e barra saem antes de casar (o shell as junta), construção dinâmica ($, crase, xargs, eval, escape \\u00.. do JSON) com git/gh e uma palavra do objeto fecha, e a marca de force do protect-main passou a valer só no segmento do push. O leitor de JSON trocou o `${v//…}` do bash (41 s a 1 MB de aspas escapadas, quadrático) por um awk (0,93 s). Tetos declarados: escape \\uXXXX fora da faixa ASCII imprimível fica literal; com chave `command` repetida vale a 1ª (o Claude Code não gera nenhum dos dois)."
    provenance:
      source: "transcripts do core (sessões e subagentes) e a bancada run_pretooluse_veto_selftests"
      locator: "casos (np-pm-force) a (np-seg); mutantes M1 a M6 e M10 a M12 via ops/mutate-and-restore.sh"
      method: "medição: regex do recorte sobre o corpus e bancada com LC_ALL=C e mutante por cura"
