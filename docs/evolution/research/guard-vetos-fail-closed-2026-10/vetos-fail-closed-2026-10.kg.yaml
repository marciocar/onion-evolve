  - id: E_ENV_GUARD_LINEAR
    node_type: evidence
    layer: audit
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    verified_at: "2026-10-11"
    verified_against: "comando `echo <token único>` no env-guard: antes 21,6 s a 100 KB, 208 s a 300 KB e mais de 900 s a 1 MB (o medidor cortou); depois 0,14 s, 0,32 s e 0,89 s (2 MB: 1,73 s). Vereditos antes×depois em processo: 31.189 entradas reais e 24.834 sintéticas, zero divergência e zero exceção"
    trace: ".claude/hooks/pretooluse-env-guard.sh"
    label: "o env-guard ficou linear: um token único de 1 MB leva 0,89 s (antes passava de 900 s) e nenhum veredito mudou em 866 mil entradas"
    narrative: "Duas causas quadráticas, achadas por cProfile. (1) O regex `[\\w-]+\\.env\\b` de cites_env recomeçava de cada posição de uma palavra longa e voltava: 1,25 s de 1,30 s a 25 KB. Virou `(?<=[\\w-])\\.env\\b`, o mesmo booleano sem backtracking. (2) Curado o regex, o shlex da stdlib dominou (15 s a 1 MB): `self.token += nextchar` num atributo copia o token a cada caractere. O LinearShlex troca só o acumulador por uma propriedade que junta os pedaços no fim do token; a máquina de estados é a da stdlib. O corpus sintético estressou a fronteira de .env (prefixos de palavra, Unicode, hífen, ponto, aspas) e o acumulador (aspas vazias, coladas, escapes, aspas abertas, pontuação, comentário, heredoc, tokens de 1 a 20 mil caracteres). (3) A passada adversarial achou o terceiro, anterior a esta branch: `cat ` seguido de muitos `[` sem `]` (172 s a 80 KB), no fnmatch.translate da stdlib, que varre até o fim a cada `[` aberto. Um `[` depois do último `]` é literal e nenhum alvo testado contém `[`, então o resultado é False sem chamar o fnmatch: 1 MB de `[` em 1,05 s. Comparação final antes×depois: 866.219 entradas (o corpus real, dois sintéticos e nove corpora de fuzz do refutador), zero divergência e zero exceção."
    provenance:
      source: "env-guard da main 6a429e73 contra o da branch fix/vetos-fail-closed"
      locator: "cites_env, as duas chamadas de LinearShlex e _fnm; caso (q) e mutantes M7, M8 e M15"
      method: "medição: tempo de parede do hook por tamanho e comparação de vereditos em processo sobre o corpus real e um sintético"
      locality: "repo"
