    narrative: "glob_reaches_env fecha quando CTX['base'] é desconhecida, mas um glob absoluto não depende da pasta corrente. Não curado aqui (é outro defeito, anterior a esta branch, e mexer no glob muda veredito). Gatilho: o segundo veto desta forma em sessão real."
