    verified_against: "Claude Code 2.1.296, claude -p --setting-sources project,local --model haiku \"/model sonnet\" em 4 sandboxes, PostModelSwitch gravando um marcador: script ausente sem campo → rc 127 e a troca APLICADA; script ausente com block → barrada ('PreModelSwitch command hook failed; blocking (onFailure: \"block\")'), Post não rodou; exit 2 → barrada com a mensagem; exit 0 com block → aplicada. Log de debug: só hooks PreModelSwitch e PostModelSwitch, nenhum Stop"
    trace: ".claude/settings.json"
    label: "medido ao vivo: um PreModelSwitch quebrado deixa a troca de modelo passar, e com onFailure block passa a barrá-la; o caso honesto não muda"
    narrative: "A doc oficial de hooks não lista o PreModelSwitch entre os eventos em que o campo não tem efeito (Stop, SubagentStop, TaskCompleted, TeammateIdle e hooks async) e diz que, com block, a falha faz o que o exit 2 faz no evento: no PreModelSwitch, bloquear a troca. A sonda de caminho honesto do premodelswitch-guard (56 entradas: vazia, não-JSON, lista, null, campos ausentes, nomes com colchete e espaço, com e sem baseline, com e sem python3) não produziu nenhum código fora de 0/2. Adotado: o campo no PreModelSwitch do settings.json, e a REGRA 101 (Veto PreToolUse por exit 2 declara onFailure: block) passou a cobrar o evento, com o caso (xiv) e um mutante. O PostModelSwitch roda o mesmo script, mas não veta nada, e fica de fora."
    provenance:
