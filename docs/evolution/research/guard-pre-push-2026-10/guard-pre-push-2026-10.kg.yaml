  # Forja (/meta:forge-guard) do fechamento de PR do core: o MOTOR ops/pr-finalize.sh (a sequência certa)
  # e o GATILHO .githooks/pre-push (que a cobra sem depender de alguém lembrar). Pedido do maestro no
  # mesmo dia do defeito: "e ajustar para não errar mais", e depois "revise sua sugestão e, se for a
  # melhor opção, faça da maneira certa, com dogfood".
nodes:
  - id: E_TRES_PRS_AO_CI_COM_LINT_VERMELHO
    node_type: evidence
    plane: PROD
    impact: 4
    confidence: 1.0
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'CI dos PRs #923 (run 37335747234) e #925 (run 37337285721): REGRA 81 (Painel de estado é GERADO dos produtores, nunca redigido) — testing-state.md defasado; #924 enviado com "Violações HARD : 2" porque o encadeamento `lint | grep "Violações HARD" && push` lia a PRESENÇA da linha'
    trace: 'ops/pr-finalize.sh'
    label: 'O DEFEITO, DATADO: num só dia, fechando 5 PRs a mão, a mesma sequência errou tres vezes — regenerar backlog/indice ANTES de stagear o grafo novo (os geradores leem o indice do git), regenerar o painel ANTES de recarimbar o residuo (o painel le produtores que o residuo muda), e encadear o veredito do lint pela presenca da linha. Dois PRs foram ao CI vermelhos e um saiu com HARD. Os commits tinham ido com --no-verify (checkpoint declarado) e nada entre o commit e o CI conferia o que ia no push.'

  - id: D_MOTOR_EM_OPS_E_GATILHO_NO_PRE_PUSH_DO_GIT
    node_type: decision
    plane: DEV
    impact: 4
    confidence: 0.85
    status: done
    verified_at: '2026-10-05'
    verified_against: 'DEPOIS DA 1a PASSADA DO ELENXO (REPROVADO, curado): familia pre_push com os casos que ele pediu (worktree positiva, gh falhando, marcador, ponto de teste so com TEST=1, e o B1 em sandbox git real); a 1a redacao dizia 6 de 6 mutantes, e o Elenxo achou um 7o que sobrevivia — verdade so para os 6 escolhidos; dogfood de ponta a ponta nos PRs #924, #925 e #926'
    trace: '.githooks/pre-push'
    label: 'A FORMA, revisada antes de construir: o MOTOR (ops/pr-finalize.sh, shell, falha fechado) faz a sequencia — regenera as projecoes, carimba o residuo NO MESMO INDICE e faz um commit so, regenera ate estabilizar, exige "Violacoes HARD : 0" LIDO e residuo casando, e so entao empurra. O GATILHO e o pre-push do GIT, nao um hook do Claude Code: vale para qualquer sessao e para o humano, e a postura da casa e acoplar ao Claude Code so onde a capacidade nao existe fora. Ele julga so branch com PR ABERTO (WIP de checkpoint e fluxo legitimo), o COMMIT EMPURRADO numa worktree limpa (nunca a arvore de trabalho) e com as variaveis do CI — espelha o runner, e o residuo da REGRA 56 entra porque e HARD dentro do lint.'

  - id: E_O_DOGFOOD_ACHOU_DOIS_DEFEITOS_NO_PROPRIO_MOTOR
    node_type: evidence
    plane: DEV
    impact: 3
    confidence: 0.95
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'pf-924.log (1a versao: commit de projecoes recusado pela REGRA 56 depois do --rebase); 1o teste negativo recusou pelo motivo ERRADO (regex de isencao nao conhecia "fora de escopo"); a familia de bancada abortou a suite por o="$(...)"; rc=$? sob set -e'
    trace: 'ops/pr-finalize.sh'
    label: 'O DOGFOOD PAGOU: rodar o motor de verdade achou dois defeitos dele mesmo, nenhum visivel no papel. (1) ORDEM: a 1a versao commitava as projecoes e SO DEPOIS carimbava o residuo — apos um rebase o gate do commit reprovava pela REGRA 56 antes de o carimbo chegar; cura: carimbar no proprio indice (a guarda hasheia o indice quando a arvore esta suja e exclui o residuo) e fazer um commit so. (2) O teste negativo inicial passou pelo MOTIVO ERRADO (recusou por nao reconhecer o texto "fora de escopo", nao pelo lint) — um caso que recusa pela razao errada e o mesmo que nao testar. E a bancada abortou com set -e no padrao `o=$(...); rc=$?`, curado com `|| rc=$?`.'

  - id: C_TETO_O_QUE_O_PRE_PUSH_NAO_PEGA
    node_type: claim
    plane: DEV
    impact: 3
    confidence: 0.9
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'cabecalho de .githooks/pre-push (FRONTEIRA DECLARADA)'
    trace: '.githooks/pre-push'
    label: 'TETO: (1) sem `gh` o hook NAO SABE se ha PR — avisa e deixa passar; o CI e o gate final; (2) `git push --no-verify` pula o hook, como pula o pre-commit; (3) custa um lint por branch com PR aberto, por push — MEDIDO ~216 s sob carga (a 1a redacao dizia 15-30 s, numero de lint ocioso); o commit que o pr-finalize acabou de julgar nao e relintado; (4) so vale apos o merge e a sincronizacao do checkout principal, porque o core.hooksPath aponta para .githooks DO CHECKOUT PRINCIPAL — worktrees usam os hooks de la; (5) e core-only: o .githooks/pre-push nao entra no template que o --update instala nos adotantes, e o pr-finalize mora em ops/, que nao viaja. Gatilho para viajar: um adotante pedir, com REGRA 56 propria.'

  - id: E_ELENXO_REPROVOU_O_MOTOR_QUE_LAVAVA_RESIDUO
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'Elenxo opus em worktree isolada, sandbox git real sobre o commit 376e04c2 (scratchpad/elx-pf: t-gh.sh, t-lease.sh, t-rebase.sh, t-mutant.sh, clone/ com o commit 370ecab6 do resíduo lavado); B1 re-provado pela bancada nova: a versao defeituosa sai rc=0 com o codigo mudado, a curada recusa'
    trace: 'ops/pr-finalize.sh'
    label: 'A 1a FORMA DO MOTOR LAVAVA RESIDUO, e era o defeito mais grave possivel para uma guarda da REGRA 56: com o codigo mudado DEPOIS da revisao, o motor extraia o hash novo, recarimbava e declarava "residuo casando" — codigo nao revisado com carimbo de revisado, e o pre-push MANDAVA rodar o motor. Cura: o residuo guarda reviewed_code_sha256 (o diff sem as projecoes geradas) e o recarimbo so acontece se ele nao mudou; residuo novo (pendente) e a declaracao de quem revisou. Junto, o Elenxo derrubou mais seis: lint-rules.md (REGRA 39) regenerado e fora do commit, com veredito lido da arvore e nao do commit (laco sem saida com o hook); gh falhando lido como "sem PR"; --force-with-lease vazio depois do fetch (apagou commit de colega no teste; cura --force-if-includes); --rebase declarando sucesso sem rebasear; resíduo isento antes do PR existir; e o custo real ~10x o declarado (~216 s por lint sob carga), que virou marcador para o hook nao relintar o commit que o motor ja julgou.'

  - id: E_ELENXO_2_REABRIU_B1_PELA_FORMA_DO_HASH
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 1.0
    status: confirmed
    verified_at: '2026-10-05'
    verified_against: 'Elenxo 2 (opus, worktree isolada, sandboxes git reais sobre 4a357b01): hash entre aspas e com espaco no fim lavados com rc=0; 4 de 372 residuos do acervo usam aspas; 19 mutantes rodados, 11 sobreviventes; cura medida: familia pre_push 32/32 e 23 de 24 mutantes mordem (o 24o, rcode vazio, e redundante por construcao: o hash de codigo e validado em 64 hex)'
    trace: 'ops/pr-finalize.sh'
    label: 'A 2a PASSADA REABRIU O B1 PELA FORMA, NAO PELA LOGICA: o motor tratava qualquer reviewed_diff_sha256 nao-hex como "pendente" e recarimbava, e a guarda tira aspas — hash entre aspas virava revisao nova sobre codigo nao revisado. Cura: o motor le o campo como a guarda (so o frontmatter, sem aspas, sem espaco) e SO o literal pendente declara revisao nova; o resto nao-hex recusa. Junto: sobra de edicao commitada (linhas 157-165, invisivel ao bash -n), die dentro de $(...) que nao abortava, falso positivo no rebase limpo (hash cru -> git patch-id --stable), marcador conferido DEPOIS do gh (o caminho canonico terminava pedindo --no-verify), remote julgado pelo nome e nao pela URL, stdin do laco vazando para o lint. E a licao de bancada: stubs de caminho absoluto deixavam sobreviver "lint na arvore em vez do commit" — os stubs agora LEEM a arvore em que rodam, e o marcador compartilhado entre worktrees e neutralizado no inicio da familia (sem isso, 7 casos passavam pelo motivo errado).'

  - id: Q_BANCADA_FAIXAS_POR_TEMPO_MEDIDO
    node_type: question
    plane: DEV
    impact: 3
    confidence: 0.7
    status: open
    label: 'REVER (nota do maestro, 2026-10-05: "precisamos rever isso em algum momento"). Nasceu no CI DESTE PR: a faixa 4 da bancada estourou o teto de 25 min tres vezes; a 1a hipotese (5 faixas) foi refutada, e a evidencia da main mostrou a familia fixtures com 997 s + 936 s numa faixa so. A cura minima aplicada aqui reparte o manifest das fixtures entre todas as faixas (fixtures_lane i/n). A cura estrutural consagrada e outra: split por TEMPO MEDIDO (CircleCI test splitting, Knapsack Pro, pytest-split — bin packing com o tempo real), mais test impact analysis (ja temos --affected-staged) e fixtures cacheaveis (Bazel). O insumo ja existe: o --report TSV de cada faixa. GATILHO: a proxima faixa que encostar no teto, ou as fatias das fixtures desbalancearem mais de 2x entre faixas.'
    trace: 'ops/testing/selftest-shard-plan.sh'

  - id: Q_MERGE_VERIFICADO_EM_REPO_SEM_CI
    node_type: question
    plane: DEV
    impact: 3
    confidence: 0.9
    status: open
    verified_at: '2026-10-06'
    verified_against: 'onion-slm PR #1 (2026-10-06): o caminho verificado recusou "ZERO check-runs" e o escape --ci-inoperante recusou "não consegui LER os runs recentes" — a API de actions/runs devolve total_count 0 num repo que nunca teve CI'
    trace: 'ops/pr-merge-verified.sh'
    label: 'LACUNA DO CAMINHO VERIFICADO: ele fecha PR com CI vivo e, pelo escape --ci-inoperante, com CI MORTO (rajada de startup_failure). Repo SEM CI nenhum — o caso de todo adotante greenfield antes da oferta de CI — nao tem saida: o escape exige runs para provar morte, e zero runs nao e morte, e ausencia. Medido no 1o PR do onion-slm; resolvido ali instalando o CI (decisao do maestro, que paga os minutos). Cura possivel: um terceiro desfecho --sem-ci que prove AUSENCIA de workflow (nao morte) e rode o gate local; ou a adocao ofertar o CI ANTES do 1o PR. GATILHO: o proximo adotante que precise fechar PR sem CI.'

