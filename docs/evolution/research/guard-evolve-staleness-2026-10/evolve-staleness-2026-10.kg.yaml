    source_tier: 10
    label: 'O ELENXO REPROVOU: 5 falsos positivos (2 BLOQUEANTES), 7 falsos negativos, e CINCO das minhas SEIS afirmacoes caidas. O PIOR, e ele e de uma ironia exata: A GUARDA PUNIA QUEM OBEDECIA. Meu caso (f) e o caso (b) da bancada afirmavam sobre o REPO VIVO, entao bastava RODAR o /meta:evolve — o conselho que a propria guarda da — para a bancada FALHAR; e como o runner sai 1 com qualquer FAIL, o "SOFT por desenho" era FICCAO. Pior, ela nascia VERMELHA EM TODO ADOTANTE, refutando por execucao o item do meu teto que dizia "o adotante recebe a bancada, que sintetiza a fixture" — nao sintetizava. SEGUNDO FATAL: a TESE caiu. Eu afirmei que derivar era melhor que `last_run:` digitado porque "as duas pernas juntas sao mais dificeis de simular"; ele provou que as pernas NAO SAO PEER — `_population_delta "${_LAST}"` CONSOME a saida da perna 1 — e criou um arquivo de outro fluxo que calou AS DUAS ("auto-auditoria fresca, 0d"). Dois arquivos desse tipo JA EXISTIAM no repo, e sao triagem de inbox. Um `last_run:` digitado nao e forjavel assim. MAIS: a perna 2 disparava em 52 de 60 dias (limiar `>0`); `--since=<data nua>` e cego ao dia do relatorio e meu numero de manchete (289) estava errado (291); data FUTURA calava as duas pernas para sempre; o 3o fallback de data era CODIGO MORTO por aspa nao fechada, e a mensagem de degradacao MENTIA sobre a causa; o caso (d) da bancada era TAUTOLOGICO (interrogava uma constante fabricada, e o mutante SOFT->HARD sobrevivia); e o fail-open do dispatcher era clone byte-a-byte do defeito da guarda IRMA — copiei o defeito em vez de curar. TODOS CURADOS, e as curas vieram SEM CASO: 5 dos 10 mutantes sobreviviam a primeira passada pos-cura, o que gerou os casos (h) ao (k). As 3 provas que importam foram refeitas a mao: estado A (auditoria de hoje) bancada 5/5 e guarda calada; B (vencido) 5/5 e dispara; C (adotante sem docs/analysis) selftest 11/11 e guarda calada.'
