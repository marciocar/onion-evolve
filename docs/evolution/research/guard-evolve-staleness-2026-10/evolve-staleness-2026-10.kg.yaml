    label: 'PRECISAO QUE CUSTOU UMA REPROVACAO, e fica escrita para nao se perder: relogio/cron NAO E VEDADO ao `/meta:evolve`. Em 2026-10-03 eu escrevi num no `open` de atencao maxima que "o que NAO pode ser: relogio/cron — isso e MOAT W7", e isso era INVENCAO — re-afirmava como doutrina o nao-sequitur que o Elenxo de 2026-08-31 ja havia derrubado POR MEDICAO, e usava a invencao para excluir justamente o candidato que aquela refutacao chamou de "resposta proporcional". Medido: ZERO mencoes a cron em `evolve.md`, e `automation-ladder-registry.txt` tem DUAS entradas MOAT, ambas de deploy. O W7 escopa o DRIVER, que EXECUTA; o evolve PROPOE e nao muta. ⚠️ ESTA GUARDA NAO DECIDE ISSO: ela avisa, no padrao da REGRA 62/65 (a maquina detecta, o humano dispara). A escolha entre AVISAR e AGENDAR segue sendo do maestro, e agora ele escolhe com o aviso na mao em vez de com o silencio.'
