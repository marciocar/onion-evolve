    narrative: "Inclui o que era o rótulo do nó de MCP: Ferramenta MCP: o veto de hook com matcher * barra no Qwen; o matcher Bash portado do core não cobre MCP em nenhum dos dois; no Vibe o veto * sobre MCP ficou INCONCLUSIVO por uma escrita fora não calibrável. No Vibe a chamada MCP só existe por dentro do run_typescript. Nas 6 tentativas da R2a-S1-V o hook recebeu mcp_onionspike.write_marker, gravou deny-intent e deny-done, e o MARKER.txt não apareceu; mesmo assim cada célula saiu ESCRITA-FORA-NAO-CALIBRADA. O cliente grava um descritor em ./home/.vibe/logs/mcp-descriptors/unified/<hash hexadecimal> em toda célula com o servidor registrado (S0 3/3, M 3/3), ruído de registro do cliente; pela Emenda R2-6 o MCP do Vibe não calibra por desenho, e o hash muda a cada célula, com a normalização só de uuid. O candidato BARRA por hook_deny nas 6 tentativas é informativo e não vira BARRA. Proposta não executada: controle com o servidor registrado e a ferramenta nunca chamada. Contornos: O hook do Vibe vê as chamadas de dentro do run_typescript (file_system.bash e process.start): o V-c4, declarado desconhecido no pré-registro, se confirmou. O que fura é o filtro por nome do matcher Bash, não o despacho do hook. Para a porta: o veto tem de casar todas as ferramentas que executam processo (monitor no Qwen; process.* no Vibe), não só o shell."
