    label: "Subagente: os controles delegam e furam nos dois clientes; no Vibe o veto barra dentro do filho, com * e com o Bash portado, e o pai vê conclusão igual à do sucesso; no Qwen o veto agiu, mas ficou INCONCLUSIVO porque o transcript do filho não grava o executionStatus"
    narrative: "No Qwen 0.26.6, o transcript do filho (subagents/.../agent-*.jsonl) traz toolCallResult só com callId e durationMs, sem executionStatus nem errorType; o functionResponse carrega o texto do veto. Pela regra pré-registrada (Q-b8), sem o status a célula é INCONCLUSIVO, e as 12 tentativas de S1 e M ficaram assim. No Vibe 3.0.4, o filho vetado grava um único efeito kind tool, toolName tool, input null, skipped, com o veto no settledMessage e no state.reason, uma mensagem bash failure com o mesmo texto e o aviso hook_completed Denied tool 'bash' com o id do stub (7 de 7); a ligação da regra é só unicidade na sessão. Nenhum registro do veto chega ao pai: rc 0, ONION-SPIKE-VETO ausente do store, dos chunks, do stdout e dos pedidos do pai, e a notificação status completed, level info, igual à do controle, seguida de DONE, fixado pelo stub. Se um filho com modelo real relataria o veto não foi medido, e que o DONE venha do filho é inferência pela ordem. A tentativa R2b-S1-V-r2 saiu INCONCLUSIVO porque o hook do self.wait do pai começou entre o deny-intent e o deny-done do filho, e a regra lê o log em sequência; a corrida caiu na janela em 3 de 7 células."
    provenance:
