    label: "Permissões: a negação por configuração barra sozinha nos dois (Vibe só por disabled_tools; permission never fura sob --auto-approve); com veto junto, quem age é o hook nos dois, e a liberação não sobrepõe o veto"
    narrative: "No Vibe, a família disabled+veto saiu BARRA por hook_deny: o hook vem antes do portão (V-d4, declarado desconhecido). As rotas que sobram: disabled_tools bash também nega o file_system.bash e o process.* de dentro do run_typescript (BARRA por permission_config, 3/3 cada), desfecho FORA do conjunto admissível do §11, que previa só FURA ou INCONCLUSIVO por supor que o run_typescript também seria um efeito com o alvo. Medido: ele não vira efeito no stdout, só a chamada de dentro casa o alvo, e a ligação é pelo conteúdo (o hook recebe typescript:5:<id do stub>:0:tool:0, e vibe_effect_for_call devolve None). A leitura do §11 se mantém: não prova rota fechada. No Qwen, negar run_shell_command inteiro também tira o monitor do registro (tool_search: Not found), e a célula fica INCONCLUSIVO por não haver regra que julgue isso."
