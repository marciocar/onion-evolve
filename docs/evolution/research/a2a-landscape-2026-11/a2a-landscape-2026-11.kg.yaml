    label: "Panorama do A2A em novembro de 2026 com o Onion como lente: spec e governança, quem adota, caminhos consolidados e composição com MCP, autenticação entre agentes (OIDC self-hosted como o Logto), comparação com o perfil Onion A2A e mercado."
    narrative: "Respondida pelo run /onion-research de 2026-11-04 (gênero landscape). (1) SPEC E GOVERNANÇA: v1.0.0 em 12/03/2026 é a primeira estável (a2a.proto normativo, versão por interface, multi-tenancy, Signed Agent Cards em JWS+JCS); v1.0.1 em 28/05/2026; a tag v1.1.0-rc existe no repo; doada pela Google à Linux Foundation e hospedada pela AAIF desde 17/08/2026. (2) ADOÇÃO: mais de 150 organizações, presente em Google Cloud, Azure AI Foundry e AWS Bedrock AgentCore, produção declarada em Huawei HarmonyOS/Celia e Tencent WeChat; SDK Java/Quarkus com OIDC documentado. (3) CAMINHOS: três bindings (JSON-RPC/SSE, gRPC, REST), GetTask/ListTasks/CancelTask e push opcional; composição com MCP não teve claim confirmada nesta rodada (lacuna). (4) AUTH: o card declara securitySchemes OpenAPI (API key, HTTP bearer/basic, OAuth2 com PKCE/client credentials/device code, OIDC, mTLS); credencial obtida fora do protocolo; IdP OIDC self-hosted (Keycloak) emite client_credentials para servidor A2A; Logto não medido. (5) PERFIL ONION: bearer de convite + JWT RS256 com body_sha256 + jti são cunhagem acima do padrão (a spec não define assinatura de mensagem); o input_required do bridge já casa com o estado nativo; lacunas: tasks/get (conformidade) e push (capacidade opcional), AUTH_REQUIRED, Signed Agent Card e securitySchemes declarados. (6) MERCADO: nenhum sinal de capital direto; o dinheiro corre pelas plataformas."
