    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    verified_at: "2026-11-04"
    verified_against: "https://a2a-protocol.org/v1.0.1/spec/a2a.proto · votos 3-0"
    source_tier: 10
    source_kind: primary
    label: "A spec normativa A2A v1.0.1 (package lf.a2a.v1) define o RPC GetTask (GET /tasks/{id}): tasks/get existe no protocolo, e sua ausência no perfil Onion é lacuna frente à spec."
    narrative: "Lente Onion: o bridge não serve tasks/get (a2a-agent-card.sh registra) e por isso o remetente não consulta o desfecho do aceite humano. Ao contrário de push, GetTask não tem flag opcional em AgentCapabilities: é a lacuna de CONFORMIDADE candidata (ver C_SUPERACAO_20261104_PUSH_OPTIONAL_CAPABILITY)."
    trace: "https://a2a-protocol.org/v1.0.1/spec/a2a.proto"
    provenance:
