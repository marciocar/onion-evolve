    label: "SAC-70: o Onion deve oferecer um MCP remoto só leitura (kg_list, kg_radar, kg_node, docs_search) para o time não técnico de um hub (piloto brain-granaai) consultar o Company Brain fora do Claude Code — quem mantém, auth, escopo, frescor, transporte?"
    narrative: "Cinco sub-decisões: (1) core mantém o servidor ou a família hospeda; (2) auth por org (OAuth/OIDC com o IdP do hub, token por org, ou nenhum em rede privada); (3) escopo por raiz (multi-tenant ou uma instância por org); (4) frescor por commit (qual ref e como declarar o commit servido); (5) transporte e onde roda. PERMANECE ABERTA: a decisão é do maestro, e as premissas que decidem a (2) — o Logto emite token com resource indicator e claim de org, tem DCR/CIMD, publica code_challenge_methods_supported — não foram medidas nesta rodada."
    trace: "docs/evolution/research/fila-2026-10-06/fila-2026-10-06.kg.yaml (Q_ONION_BRAIN_MCP)"

