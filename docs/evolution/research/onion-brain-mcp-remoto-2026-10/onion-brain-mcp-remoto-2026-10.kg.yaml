ken estático em rede privada atrás do SSO do LibreChat, degrau 2 OAuth RS com o IdP do hub e claim de org; (3) uma instância por org, raiz fixada pela instância, nunca por argumento; (4) worktree destacado no SHA de origin/main do hub, fetch com deploy key read-only, commit declarado em toda resposta; (5) streamable-http stateless, sem SSE e sem stdio via proxy."
