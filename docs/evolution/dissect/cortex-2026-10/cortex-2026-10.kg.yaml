    narrative: "Selado por /meta:decide em 2026-10-27: escolhida «Selar como medido»; descartadas: «Selar, sem implementar agora» · «Depois». É o 2º round: no 1º, diante do sinal com as rejeições só lidas, o maestro escolheu «Medir as rejeições antes», e a curadoria mediu rodando os dois lados no mesmo caso, em laboratório isolado. Por peça: costurar só a peça no gate de plano (nota 6, esbarra no .gitignore das sessões e na ordem do plano em relação ao código), na âncora única da mutação (nota 6, implementada no mesmo PR deste selo) e no pptx e docx (nota 6 no sinal, em Python, com python-pptx e python-docx autorizados pelo maestro, sem navegador); parquear a frota, o registro de uso e o handoff no git (nota 5, cada um com o gatilho medido da curadoria); rejeitar distribuição, especificação como código e estudos (notas 4, 3 e 3, medidas do lado do Onion). Nenhuma peça é absorvida no núcleo: nenhuma tem uso medido em dois adotantes ou mais. Complemento do mesmo dia, depois da escolha: a prova do pptx e do docx entrou na main da curadoria (PR #137, 6dc082a) e rebaixou essa peça para nota 5, com régua NÃO pré-registrada (nasceu depois do resultado), e o veredito ficou costurar só a receita local; a captura real e o diagrama ficam parqueados até o maestro autorizar um navegador sem tela. O Onion só exporta pptx pelo Gamma, nunca a partir do git, e pela doutrina sem dependência de serviço externo o Gamma não conta como par."
    x_dissect_level: 3
    x_dissect_verdict: costurar
