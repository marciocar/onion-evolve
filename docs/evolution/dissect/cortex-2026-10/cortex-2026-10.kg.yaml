  # ═══ TETO: 16 NÓS. Triagem fechada: cresce quando um parque disparar ou uma costura aberta virar PR. ═══
  #
  # TRIAGEM DO CORE de uma dissecação feita FORA dele: o adotante de curadoria dissecou o Cortex (família
  # ferramenta), um framework para Claude Code que mora no repositório de um cliente, e avaliou nove peças contra
  # o Onion, com uma rodada de medida que rodou os dois lados no mesmo caso. O grafo canônico mora no repo de
  # curadoria, no MESMO caminho relativo deste arquivo, e cada nó de evidência aqui aponta o nó da peça de lá pelo
  # provenance.source com o commit fixado (a forma que o kg_query --chain segue). Este grafo NÃO re-mede o Cortex:
  # sela a decisão do maestro, guarda os gatilhos dos parques e os próximos passos das costuras, e existe para o
  # dissect-census.sh DO CORE responder "já dissecamos o Cortex?" sem o clone da curadoria.
  # CONFIDENCIALIDADE: o core é público. Nada do cliente entra aqui, só o que o sinal da curadoria já diz sobre o
  # framework; nenhum nome de pessoa, de repositório ou de banco do cliente.
  # Sinais triados: docs/evolution/inbox/_processed/2026-10-27-proposal-cortex-evaluation.md (1º round) e
  # docs/evolution/inbox/_processed/2026-10-27-proposal-cortex-measured.md (2º round, medido).

