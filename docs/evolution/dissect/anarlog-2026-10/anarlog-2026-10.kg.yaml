    source_tier: 8
    source_kind: primary-repo
    label: "A dissecação da curadoria sustenta o costurar: o export por CLI devolve as palavras com tempo, canal e falante só lendo o banco; o motor STT embutido só existe em macOS Apple Silicon, e no Linux o provedor custom aponta um servidor local, não medido."
    trace: "docs/evolution/inbox/_processed/2026-10-16-proposal-meeting-capture-to-graph.md"
    narrative: "Tudo do lado de lá é LEITURA de código no pin: nada foi compilado nem executado (E_N2_NOT_RUN, open). O aviso do anarlog é constante em inglês, vem desligado por padrão e é postado por acessibilidade da UI; no Windows a função recusa (E_N2_CONSENT_EVIDENCE_MODEL). Isso pesa na pergunta da máquina de captura, que o maestro respondeu ser Windows."
    provenance:
