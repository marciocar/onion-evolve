  # ═══ TETO: 4 NÓS. Triagem fechada: cresce quando o portão do export for medido na máquina de captura. ═══
  #
  # TRIAGEM DO CORE de uma dissecação feita FORA dele (SAC-161, fase 3b da SAC-157): o adotante de curadoria
  # dissecou o anarlog (ex-Hyprnote, captura local sem bot, MIT fora de enterprise/) contra a régua do Onion e
  # propôs COSTURAR pela CLI de export. O grafo canônico (13 nós, N0 a N3, com o Elenxo que corrigiu a costura
  # e a condição) mora no repo de curadoria, no MESMO caminho relativo deste arquivo. Este grafo NÃO re-mede o
  # anarlog: sela a decisão do maestro (o veredito E a escolha do aviso, que a curadoria deixou ao core),
  # guarda o portão e existe para o dissect-census.sh DO CORE responder sem o clone da curadoria.
  # Proposta triada: docs/evolution/inbox/_processed/2026-10-16-proposal-meeting-capture-to-graph.md

nodes:

  - id: D_ANARLOG_2610
    node_type: decision
    impact: 5
    confidence: 0.6
    x_dissect_level: 3
    x_dissect_verdict: costurar
    label: "COSTURAR o anarlog como captura local: o app grava e transcreve na máquina de captura, e um adaptador do Onion chama 'anarlog meetings export <id> --format json' e escreve o grafo da reunião, sem o Nango. O aviso aos participantes é PRÓPRIO, em pt-BR."
    trace: "docs/evolution/inbox/_processed/2026-10-16-proposal-meeting-capture-to-graph.md"
    status: done
    plane: DEV
    verified_at: "2026-10-16"
    verified_against: "decisão do maestro em 2026-10-16, por pergunta com opções (/meta:decide): escolhida «Costurar com aviso próprio pt-BR (Recomendado)»"
    narrative: |-
      Da escolha do aviso que a curadoria deixou ao core (i: aviso em inglês, como está; ii: desligar o envio automático e postar aviso próprio em pt-BR; iii: fork de duas constantes), o maestro escolheu a (ii). O custo declarado da (ii) é perder o registro da tentativa DENTRO do anarlog; ele é coberto por fora: a tentativa de aviso e as respostas vão ao grafo da reunião, no modelo aviso ≠ consentimento (P_CONSENT_EVIDENCE_REWRITE em meeting-capture-2026-10), e o meeting-graph-check.sh reprova a reunião sem tentativa de aviso registrada. Condição que segue aberta: haver STT local alcançável na máquina de captura (Q_ANARLOG_PORTAO_EXPORT, que depende de Q_CAPTURA_WINDOWS_CLIENTE_VPS_SERVIDOR_1016). A importação do Meet e do Teams do anarlog roda no servidor dele, via Nango, e fica fora da costura.

      Selado por /meta:decide em 2026-10-16: escolhida «Costurar com aviso próprio pt-BR (Recomendado)»; descartadas: «Costurar com aviso em inglês» · «Costurar com fork de 2 constantes» · «Parquear o anarlog».
    provenance:
      source: "maestro, na sessão do /meta:decide"
      locator: "pergunta com opções de 2026-10-16: «anarlog: costurar pela CLI meetings export --format json, com qual aviso aos participantes?»"
      method: "testemunho: decisão do maestro por pergunta com opções, 2026-10-16"
      locality: "pessoa"

