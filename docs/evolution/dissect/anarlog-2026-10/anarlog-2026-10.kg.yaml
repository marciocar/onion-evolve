    label: "Portão do anarlog: numa reunião de teste consentida, o export JSON traz palavras com start_ms, end_ms, channel e speaker, e a transcrição roda sem sair da máquina de captura?"
    x_gatilho: "fecha quando o teste consentido rodar na máquina de captura: o export traz os quatro campos por palavra e o adaptador grava um grafo que passa no meeting-graph-check.sh. Se a máquina for Windows sem caminho de STT local, o portão reprova e o veredito reabre (Q_CAPTURA_WINDOWS_CLIENTE_VPS_SERVIDOR_1016)."
