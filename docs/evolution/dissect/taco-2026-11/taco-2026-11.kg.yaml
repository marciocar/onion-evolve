  # ─── N2 mecanismo ───
  - id: E_N2_MECHANISM
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.85
    x_dissect_level: 2
    x_dissect_n2_evidence: artefato-aberto
    label: "N2: camada própria sobre o a2a-sdk 1.3.1: despacho por metadata.taskType, escopo por tipo, store por dono, push com SSRF; o 1º DataPart é a entrada; 660 testes verdes num venv isolado."
    narrative: >-
      Substrato: 8 dos 22 arquivos .py do pacote (7 dos 16 do topo, mais monitor/__init__.py) importam o
      a2a-sdk (Apache-2.0; autor Google LLC no metadata). O a2a-sdk dá o protocolo: AgentExecutor,
      TaskStore, InMemoryTaskStore, DatabaseTaskStore, push sender, TaskManager. O taco põe por cima uma
      camada PRÓPRIA e neutra quanto ao domínio: o executor _TacoAgentExecutor (server.py:241) roteia por
      metadata.taskType (task_type é str livre, types.py:135) para um dicionário de handlers; o handler
      recebe (task, input_data) e devolve um Artifact; o executor emite working antes do handler, depois
      artifact e completed, ou failed com texto. Cancelamento cooperativo (future + conjunto _canceled).
      Escopo por tipo de tarefa com 403. JsonFileTaskStore por dono (o sujeito do token), escrita atômica
      com mkstemp + os.replace, single-process declarado. Esquemas: modelos pydantic com teste de paridade
      estrutural e comportamental contra spec/schemas/*.json. Determinismo onde mora: na paridade
      modelo×esquema e na paridade de dialeto A2A 0.3×1.0 (tests/_wire.py), ambas na bancada. O que NÃO
      garante: que a entrada e a saída de uma tarefa obedeçam ao esquema declarado na skill.
    verified_at: "2026-11-19"
    verified_against: "venv isolado no scratchpad: pip install -e sdk[dev] (taco-agent 0.7.2.dev2, a2a-sdk 1.3.1); pytest -q em sdk/ → 660 passed; dir(a2a.server.tasks)"
