  # ─── N1 capacidade ───
  - id: E_N1_VERBS
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.85
    x_dissect_level: 1
    label: "N1: o taco serve o ciclo de vida da A2A Task (send, stream, get, list, cancel, push) com tipos de tarefa e esquemas tipados por skill; o Onion não serve tarefa A2A."
    narrative: >-
      Verbos da superfície executável: CLI `taco discover | inspect | send | health | list-tasks`
      (sdk/taco/cli.py:288-308); SDK `A2AServer.register_handler / register_streaming_handler`, admin de
      skills em runtime (add/remove/list), `TacoClient.discover / send_message / stream`, `AgentRegistry.
      register / find / refresh / remove`, `TacoAgent.send_to_peer` (descoberta do par pela skill),
      `JsonFileTaskStore`, push notifications com checagem de SSRF, `BearerAuthMiddleware` com escopos
      `taco:task:<tipo>` e `taco:project:<id>:<ação>`. Delta contra o Onion: o bridge A2A do core é
      signals-only e NÃO serve tasks/get nem SSE (marcador vazio em .claude/validation/a2a-agent-card.sh);
      o Onion não tem vocabulário de tipos de tarefa com esquema de entrada e saída. Toca dois dos três
      temas em decisão: (a) núcleo de tarefas — é a forma «construir o núcleo sobre o contrato A2A Task»
      (C_OPCAO_BUILD_OWN_CORE_CONTRACTS da curadoria); (c) orquestração de sessões — agentes que se
      descobrem por skill e se chamam por tipo de tarefa. NÃO toca o Company Brain (b): não há memória,
      grafo nem conhecimento; o /monitor é rastreio de payload. Consumidor nomeado do delta: a pergunta
      Q_ONION_TRACKER_CORE_GAP_2026_11 (curadoria) e a decisão D_A2A_BACKBONE_PRODUCT_2026_11 (core).
    verified_at: "2026-11-19"
    verified_against: "sdk/taco/cli.py add_parser; grep de def em server.py, client.py, registry.py, agent.py, auth.py, task_store.py, push.py"
