  # ─── N2 mecanismo ───
  - id: E_N2_MECHANISM
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.85
    x_dissect_level: 2
    x_dissect_n2_evidence: artefato-aberto
    label: "N2: camada fina sobre o a2a-sdk 1.3.1; despacho por metadata.taskType para um dicionário de handlers; o 1º DataPart é a entrada; 660 testes verdes num venv isolado."
    narrative: >-
      Substrato: 7 dos 15 módulos importam o a2a-sdk (Apache-2.0, Google/Linux Foundation); o servidor é o
      AgentExecutor do a2a-sdk com um executor próprio (_TacoAgentExecutor, server.py:241). Estrutura de
      dados: a Task do A2A (id, contextId, status, artifacts, history, metadata) com metadata.taskType como
      chave de roteamento; o handler recebe (task, input_data) e devolve um Artifact; o executor emite
      working antes do handler, depois artifact e completed, ou failed com texto. Cancelamento é
      cooperativo (future + conjunto _canceled). Persistência: JsonFileTaskStore por dono (o sujeito do
      token), escrita atômica com mkstemp + os.replace, single-process declarado. Esquemas: modelos
      pydantic com teste de paridade estrutural e comportamental contra spec/schemas/*.json (o JSON
      Schema é a fonte, ADR-0002). Determinismo onde mora: na paridade modelo×esquema e na paridade de
      dialeto A2A 0.3×1.0 (tests/_wire.py), ambas na bancada. O que NÃO garante: que a entrada e a saída
      de uma tarefa obedeçam ao esquema declarado na skill (E_N2_PROBE_SCHEMA_NOT_ENFORCED).
    verified_at: "2026-11-19"
    verified_against: "venv isolado no scratchpad: pip install -e sdk[dev] (taco-agent 0.7.2.dev2, a2a-sdk 1.3.1); pytest -q em sdk/ → 660 passed"
    source_tier: 9
    provenance:
