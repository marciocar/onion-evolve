    verified_at: 2026-10-02
    verified_against: 'E_N2_PILHA_DE_OPERACAO_MEDIDA (12 containers, OpenSearch, dois servidores de modelo) contra o hardware medido desta casa: VPS de 8 vCPU, 31 GB RAM (22 livres), SEM GPU, com a bancada determinística SATURANDO os 8 cores por ~17 min por passada'
    source_tier: 10
    source_kind: internal-audit
    label: 'A OPCAO QUE PARECIA BOA, FECHADA POR MEDICAO: "Onyx como receptor hospedado que a candidata (b) nao tem" e atraente no papel — open-source, auto-hospedavel, com conectores e governanca prontos. Mas 12 containers com OpenSearch e DOIS servidores de modelo nao coexistem com um gate que ja satura 8 vCPU por 17 minutos. Nao e questao de ajustar: o indice de busca e os model servers sao justamente os componentes que competem por CPU e RAM. Logo a opcao nao esta rejeitada por principio — esta bloqueada POR HARDWARE, e isso muda o gatilho: ela reabre em maquina que nao seja esta, nao em argumento.'
    trace: 'docs/evolution/dissect/onyx-2026-10/onyx-2026-10.kg.yaml'

  - id: E_CENSO_NAO_VE_O_QUE_A_PESQUISA_PAGOU
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 4
    confidence: 0.9
    dissect_level: 0
    verified_at: 2026-10-02
    verified_against: 'medido nesta sessao: o censo (dissect-census.sh) devolveu "151 grafos, 1 dissecacao declarada" e NAO listou a Onyx, enquanto grep no corpus achou TRES nos de Onyx com tier 9 e votos 3-0 no grafo company-brain-e-conducao-como-servico-2026-10'
    source_tier: 10
    source_kind: internal-audit
    label: 'O TETO DO CENSO MORDEU PELA SEGUNDA VEZ EM DUAS DISSECACOES — e dois em dois e padrao, nao acidente. Ontem, com o Cedar: o censo disse ZERO dissecacoes enquanto o corpus tinha quatro nos de Cedar com tier 7-8. Hoje, com a Onyx: disse UMA enquanto o corpus tinha tres nos de Onyx com tier 9. O medidor esta CORRETO pelo contrato que declara (le marcador dissect_*, nao conhecimento sobre ferramenta), mas o efeito pratico e que o corte de custo que ele existe para dar depende de alguem ter rodado /meta:dissect antes — e a pesquisa normal paga nivel sem marcar. CURA CANDIDATA, nao implementada aqui: o censo tambem varrer `trace:` e label por NOME DE FERRAMENTA nos grafos de pesquisa e reportar como "nivel pago SEM marcador", que e sinal diferente de "nao dissecado". GATILHO: a terceira dissecacao em que o censo nao enxergar nivel ja pago.'
    trace: 'docs/evolution/dissect/onyx-2026-10/onyx-2026-10.kg.yaml'

  - id: D_ONYX_1002
    node_type: decision
    plane: DEV
    status: open
    impact: 5
    confidence: 0.6
    dissect_level: 3
    dissect_verdict: parquear
    verified_at: 2026-10-02
    verified_against: 'NAO SELADA. O /meta:dissect nunca sela: status open, aguardando o maestro.'
    label: 'VEREDITO PROPOSTO — PARQUEAR, com dois gatilhos nomeados (o maestro sela). Por que nao os outros tres: NAO e `absorver` (nao ha tecnica a reescrever — e produto com receptor, conectores e 12 containers; e o unico pedaco citavel, o enum KGStage, e estado de pipeline de EXTRACAO, que nao existe num grafo curado a mao). NAO e `costurar` AGORA (a costura seria Onyx como receptor hospedado da candidata (b), e ela esta BLOQUEADA POR HARDWARE: 12 containers com OpenSearch e dois model servers contra 8 vCPU que a bancada ja satura — ver E_N3_RECEPTOR_BLOQUEADO_POR_HARDWARE). NAO e `rejeitar` (a opcao de receptor e tecnicamente boa e so esta bloqueada por maquina, e o achado de ausencia de schema e valioso e vivo). ═══ A PERGUNTA PARQUEADA ═══ "a Onyx, auto-hospedada, e o receptor que a candidata (b) do Company Brain nao tem — e o Onion entra como a CAMADA DE PROVENIENCIA que o schema dela nao tem?" Essa composicao e a leitura mais interessante que a dissecacao produziu: nao competir com a Onyx, e sim ser o que falta no grafo dela. ═══ OS GATILHOS, nomeados e verificaveis ═══ reabrir quando QUALQUER um ocorrer: (1) o maestro SELAR a decisao D_COMPANY_BRAIN_OU_CONDUCAO_COMO_SERVICO (hoje `open`) na direcao (b) ou (b+d) — sem isso, discutir receptor e discutir solucao de problema nao escolhido; (2) existir maquina que NAO seja esta VPS (ou o gate deixar de saturar 8 cores), porque hoje o bloqueio e de CPU e nao de desenho; (3) a Onyx acrescentar ao schema do grafo validade temporal por fato OU tier de fonte — o que derrubaria E_N3_CONFIRMA_O_DIFERENCIAL_POR_AUSENCIA e exigiria re-medir o diferencial inteiro. ═══ O QUE FAZER AGORA, e e barato ═══ nada de integracao; so registrar que o diferencial do Onion contra a lider open-source e "verdade com data e procedencia graduada", medido por ausencia de CAMPO no schema dela — e levar isso ao no do Company Brain, que esta aberto.'
    trace: 'docs/evolution/dissect/onyx-2026-10/onyx-2026-10.kg.yaml'

