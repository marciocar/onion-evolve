    label: 'A Onyx (ex-Danswer) — busca/RAG corporativo open-source que JA ENTREGA grafo de conhecimento — e algo que o Onion absorve, costura como receptor do Company Brain, parqueia ou rejeita? A pergunta tem peso porque ela e a unica concorrente MEDIDA que entrega grafo, e porque a candidata (b) do Onion (Company Brain como servico) precisa de um receptor hospedado que o template em .claude/ nao tem.'
