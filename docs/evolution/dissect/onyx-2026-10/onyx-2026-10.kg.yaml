    verified_against: 'cruzamento de duas primarias: o no de 2026-10-01 lista `vespa/` entre os subdiretorios de backend/onyx/kg, e o compose de hoje traz `opensearch` como indice — nao ha servico vespa'
    source_tier: 9
    source_kind: primary
    label: 'DRIFT PEQUENO MAS REAL, registrado para nao virar erro citado como fato: o no de ontem lista um subdiretorio `vespa/` dentro do modulo de grafo, e o compose de HOJE sobe `opensearch` como indice, sem servico Vespa. Leituras possiveis: migracao de indice com codigo legado ainda presente, ou suporte a dois backends. NAO MEDIDO qual — e por isso fica declarado em vez de resolvido. Importa porque "qual indice" muda o custo de operar, que e metade da pergunta do receptor.'
