  - id: E_N1_CAPACIDADE_PAGA
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.85
    dissect_level: 1
    verified_at: 2026-10-01
    verified_against: 'nivel PAGO pelo corpus (E_ONYX_ENTREGA_GRAFO_1001, tier 9, tres refutadores independentes): doc do fornecedor diz verbatim "contextual retrieval, advanced RAG, hybrid search, and AI-generated knowledge graphs", e o modulo backend/onyx/kg esta vivo no codigo'
    source_tier: 9
    source_kind: primary
    label: 'N1 CAPACIDADE — PASSA. Os VERBOS que a Onyx faz e o Onion nao: ingerir de 50+ conectores com permissao herdada da fonte; indexar em motor de busca hibrida; EXTRAIR grafo de conhecimento de documento automaticamente; servir chat com citacao permission-aware; hospedar e governar acesso. O delta e real e grande. Mas o CONSUMIDOR desse delta no Onion e a pergunta do N3 — e o corpus ja registrou o que isso derrubou: o diferencial do Onion NAO pode ser "temos grafo", porque a lider open-source entrega grafo dentro dos tiers pagos.'
    trace: 'https://docs.onyx.app/'

  - id: E_N2_MODELO_DE_DADOS_MEDIDO
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    dissect_level: 2
    verified_at: 2026-10-02
    verified_against: 'fetch da primaria hoje: https://raw.githubusercontent.com/onyx-dot-app/onyx/main/backend/onyx/kg/models.py — leitura do MODELO DE DADOS, nao da pagina de produto'
    source_tier: 9
    source_kind: primary
    label: 'N2 MECANISMO — E AQUI A DISSECACAO VIRA. O grafo da Onyx e extracao-como-verdade com JANELA DE INGESTAO. O que o modelo TEM: KGEntityTypeDefinition (description, grounding, grounded_source_name, active, attributes, entity_values), atributos de classificacao, KGAttributeImplicationProperty para relacao implicada, KG_COVERAGE_START / KG_COVERAGE_START_DATE / KG_MAX_COVERAGE_DAYS (janela de ingestao), grounded_source_name: DocumentSource (o documento de origem) e o enum KGStage com extracted / normalized / failed (estado de PIPELINE). O que esta AUSENTE, e sao exatamente os quatro campos que o Onion usa como diferencial: (1) valid_from / valid_to — NAO e bi-temporal; (2) verified_at — nao existe carimbo de re-verificacao; (3) confianca, trust ou TIER DE FONTE — nenhum; (4) distincao entre VERIFICADO e meramente EXTRAIDO — nenhuma. Nem indicador de metodo de extracao (LLM x regra).'
    trace: 'https://raw.githubusercontent.com/onyx-dot-app/onyx/main/backend/onyx/kg/models.py'

  - id: E_N2_PILHA_DE_OPERACAO_MEDIDA
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.9
    dissect_level: 2
    verified_at: 2026-10-02
    verified_against: 'fetch da primaria hoje: deployment/docker_compose/docker-compose.dev.yml do repo — contagem e nomes dos servicos, nao estimativa'
    source_tier: 9
    source_kind: primary
    label: 'N2 — A PILHA, e ela decide a pergunta do receptor: 12 containers ATIVOS (13 definidos, mcp_server comentado). Nominalmente: api_server, background, web_server, relational_db (Postgres), opensearch (indice de busca/vetor), inference_model_server E indexing_model_server (DOIS servidores de modelo, que baixam modelo do HuggingFace), nginx, cache (Redis), object-store, minio, code-interpreter. Limite de recurso declarado so no api_server, por variavel de ambiente; nos demais AUSENTE. O quickstart NAO declara minimo de CPU/RAM/disco nem se GPU e necessaria — a doc tem modos "Lite" e "Standard" mas nao publica requisito, o que e lacuna do fornecedor e nao do medidor.'
    trace: 'https://raw.githubusercontent.com/onyx-dot-app/onyx/main/deployment/docker_compose/docker-compose.dev.yml'

