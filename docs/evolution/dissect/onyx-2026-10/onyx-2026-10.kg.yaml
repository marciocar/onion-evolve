  - id: E_N3_CONFIRMA_O_DIFERENCIAL_POR_AUSENCIA
    node_type: evidence
    plane: DEV
    status: confirmed
    impact: 5
    confidence: 0.85
    dissect_level: 3
    verified_at: 2026-10-02
    verified_against: 'E_N2_MODELO_DE_DADOS_MEDIDO (schema lido na primaria) contra o diferencial declarado do Onion (grafo bi-temporal com source_tier 1-10, verified_at datado, verified_against, radar determinístico sem LLM)'
    source_tier: 10
    source_kind: internal-audit
    label: 'O ACHADO MAIS FORTE DA DISSECACAO, e ele e a favor do Onion — mas por AUSENCIA MEDIDA, nao por marketing. A rodada de 2026-10-01 concluiu que "o diferencial nao pode ser temos grafo; se existe, e a PROVENIENCIA VERIFICAVEL, e essa ninguem vende". Hoje o SCHEMA da lider open-source prova a segunda metade: o grafo dela NAO tem valid_from/valid_to, NAO tem verified_at, NAO tem tier de fonte e NAO distingue verificado de extraido. Isso e muito mais forte que ausencia em pagina de preco (que e ausencia de SALIENCIA): e ausencia de CAMPO — o dado nao existe para ser cobrado. Consequencia: o diferencial do Onion sobrevive, ESTREITADO e agora MEDIDO contra a lider, e o nome dele e "verdade com data e procedencia graduada", nao "grafo".'
    trace: 'docs/evolution/dissect/onyx-2026-10/onyx-2026-10.kg.yaml'

