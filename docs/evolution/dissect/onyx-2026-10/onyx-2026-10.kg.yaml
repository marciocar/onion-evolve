    source_kind: primary
    label: 'N0 IDENTIDADE — PASSA, e sem repagar: Onyx, ex-Danswer, open-source, repo onyx-dot-app/onyx, preco PUBLICADO (tier Business US$20 por usuario/mes no anual). Mantenedor corporativo com produto comercial em cima do open-source. E o agravante que o corpus ja registrou: o que ela cobra NAO e o conhecimento nem o motor — e o ASSENTO no receptor hospedado mais a governanca, o que fixa o TETO de preco do mercado para busca sobre documento da empresa em US$20 por assento COM O MOTOR GRATIS.'
