  review_after: "2026-11-20"   # 30d: FERRAMENTA é o tipo dominante (Apps SDK, MCP Apps, visuais do Claude, LibreChat mudam por release); a cadência de ferramenta da doutrina é 30 d
  # kg-backlog-guard: on
  # ═══ TETO: 33 NÓS ═══   (28 da rodada + 3 do veredito e do plano N4 + 2 selos do maestro em 2026-10-21: o piloto ui:// no /chat, medido pela leitura do bridge, e a tarefa do token do /chat)
  #
  # Justificativa do teto: rodada de PRIMÁRIAS NOMEADAS executada em 2026-10-21 (/meta:dissect, régua
  # onion, alvo N4) sobre a "Intelligent UI" do ChatGPT com GPT-6. 14 claims ancoradas viram 14 nós de
  # evidência; 1 nó de contabilidade (E_LACUNAS_PRIMARIES_1021); 1 superação achada (C_SUPERACAO_…);
  # 9 objeções SOBREVIVENTES do Elenxo, cada uma um nó E_OBJECAO_… com CONSTRAINS ao alvo; 3 nós de
  # pergunta/afirmação que as amarram (o objeto NÃO VERIFICADO, a proposta-hipótese para o /meta:decide
  # e a convergência de mercado). Cresce só quando: (a) a fonte primária da OpenAI for lida; (b) as
  # claims do Apps SDK rebaixadas forem reancoradas com quote; (c) o eixo de mercado/capital ganhar fonte.
  #
  # ⚠️ O OBJETO DA DISSECAÇÃO NÃO FOI LIDO: a fonte openai-gpt6-intelligent-ui ficou inalcançável e
  # ZERO claims a ancoram. Este grafo disseca o MECANISMO ABERTO equivalente e os análogos (MCP Apps,
  # visuais/artifacts do Claude, LibreChat), não a UI do GPT-6. Nada aqui é selado: esta sessão NUNCA sela.

nodes:

