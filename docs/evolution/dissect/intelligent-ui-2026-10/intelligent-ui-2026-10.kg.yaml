    label: "HIPÓTESE para o /meta:decide: abrir um piloto ÚNICO de MCP Apps num host que o Onion controla (o /chat do onion-bridge ou o brain em canary), com um recurso ui:// servido pelo onion-kg, e medir antes de generalizar."
