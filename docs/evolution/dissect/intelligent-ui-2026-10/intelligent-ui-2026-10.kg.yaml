    plane: DEV
    verified_at: "2026-10-26"
    verified_against: "decisão do maestro em 2026-10-26, por pergunta com opções (/meta:decide): escolhida «Registrar e fechar: o piloto foi decidido em D_UI_PILOTO_RENDER_ONLY_NO_CHAT_1021 e está servido no onion-bridge (PR #83 render-only atrás de flag, PR #86 a vista volta ao reabrir), na main servida 5819d8e; sandbox.onionevolve.com/sandbox.html responde 200; não medidos nesta passada: a flag ONION_UI_PILOT no .env servido e o selftest do piloto»"
    narrative: |-
      Proposta do Elenxo, rotulada como hipótese, não como decisão. Sustentada pelo mecanismo aberto ancorado (MIME text/html;profile=mcp-app, ui://, spec Stable 2026-01-26, sandbox de origem distinta com proxy, ponte JSON-RPC/postMessage bidirecional). Fora do piloto até a fonte primária da OpenAI ser lida: streaming antes do fim do raciocínio e paridade com o GPT-6. Caminhos plausíveis NÃO medidos para os cards do /meta:decide: o Artifact tool com capabilities (card persistente) ou o /chat do onion-bridge como host MCP Apps próprio, pagando uma segunda origem para o proxy de sandbox. A forja (/meta:forge) só começa depois que o maestro escolher no /meta:decide.

      Selado por /meta:decide em 2026-10-26: escolhida «Registrar e fechar: o piloto foi decidido em D_UI_PILOTO_RENDER_ONLY_NO_CHAT_1021 e está servido no onion-bridge (PR #83 render-only atrás de flag, PR #86 a vista volta ao reabrir), na main servida 5819d8e; sandbox.onionevolve.com/sandbox.html responde 200; não medidos nesta passada: a flag ONION_UI_PILOT no .env servido e o selftest do piloto»; descartadas: «Fechar e me dê o card da flag» · «Deixar aberto».
