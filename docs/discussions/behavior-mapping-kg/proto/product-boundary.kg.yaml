# Proto — a fronteira de produto como GRAFO DE DECISÃO (KG SDAAL, camada audit).
# Rode: bash .claude/validation/kg-radar.sh docs/discussions/behavior-mapping-kg/proto/product-boundary.kg.yaml
# Espera: RECONCILIAÇÃO/RADAR mostram a decisão CONFIRMED; INTEGRIDADE exit 0 (grafo puramente audit).
#
# Nota 05: FECHADO (2026-07-12) pelo maestro — D_SENSOR_AS_CAPABILITY = confirmed:
# sensor-como-capability do Onion pessoal; o produto-próprio (C_PRODUCT) fica DEFERIDO (open,
# revisável se surgir pull frio externo — herda Q_COLD_ADOPTER do north-star). Não é `done`:
# rumo estratégico não se verifica em PROD. Grafo epistêmico (audit), sem camada domain.
meta:
  id: product-boundary-behavior-sensor
  date: 2026-07-12

nodes:
  - id: Q_BOUNDARY
    node_type: question
    plane: DEV
    impact: 5
    confidence: 0.85
    status: confirmed
    label: "isto é feature do Onion pessoal ou produto próprio? — RESPONDIDA: capability (produto deferido)"
  - id: C_FEATURE
    node_type: claim
    plane: DEV
    impact: 5
    confidence: 0.85
    status: confirmed
    label: "é o SENSOR/capability que alimenta o Onion pessoal (o log é plataforma; o valor é o que se faz com ele)"
  - id: C_PRODUCT
    node_type: claim
    plane: DEV
    impact: 4
    confidence: 0.4
    status: open
    label: "produto próprio de process-mining consentido — DEFERIDO (open, gated: surgir pull frio externo; herda Q_COLD_ADOPTER)"
  - id: C_IDENTITY_CONFLICT
    node_type: claim
    plane: DEV
    impact: 5
    confidence: 0.85
    status: confirmed
    label: "produto standalone conflita com a identidade canônica (Onion = framework template, sem CLI/produto)"
  - id: E_IDENTITY
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 0.9
    status: confirmed
    label: "CLAUDE.md / onion-review-2026-05 — não é produto npm, não tem CLI standalone"
  - id: E_MARKET
    node_type: evidence
    plane: PROD
    impact: 4
    confidence: 0.85
    status: confirmed
    label: "landscape — sensor (ActivityWatch) vs. aplicação; process mining enterprise é categoria bilionária"
  - id: A_PESSOAL
    node_type: artifact
    plane: DEV
    impact: 5
    confidence: 0.8
    status: confirmed
    label: "discuss/onion-pessoal-marcio — o cérebro que o sensor alimentaria (a razão de ser feature)"
  - id: D_SENSOR_AS_CAPABILITY
    node_type: decision
    plane: DEV
    impact: 5
    confidence: 0.85
    status: confirmed
    label: "DECIDIDO (2026-07-12): sensor-como-capability do Onion pessoal; produto-próprio DEFERIDO, revisável se surgir pull frio externo"
  - id: E_NORTHSTAR
    node_type: evidence
    plane: PROD
    impact: 4
    confidence: 0.85
    status: confirmed
    label: "north-star 2026-07: zero adotante frio → demanda é do eixo, não do Onion (Q_COLD_ADOPTER aberto) — sustenta deferir o produto"

edges:
  # evidências sustentam as hipóteses
  - from: E_IDENTITY
    to: C_FEATURE
    edge_type: SUPPORTS
  - from: E_IDENTITY
    to: C_IDENTITY_CONFLICT
    edge_type: SUPPORTS
  - from: E_MARKET
    to: C_PRODUCT
    edge_type: SUPPORTS
  # o caminho-feature ancora no cérebro pessoal e se apoia no argumento de identidade
  - from: C_FEATURE
    to: A_PESSOAL
    edge_type: TRACES_TO
  - from: C_FEATURE
    to: C_IDENTITY_CONFLICT
    edge_type: DEPENDS_ON
  # a decisão pesa as três hipóteses e responde à pergunta — mas fica ABERTA
  - from: D_SENSOR_AS_CAPABILITY
    to: C_FEATURE
    edge_type: DEPENDS_ON
  - from: D_SENSOR_AS_CAPABILITY
    to: C_PRODUCT
    edge_type: DEPENDS_ON
  - from: D_SENSOR_AS_CAPABILITY
    to: C_IDENTITY_CONFLICT
    edge_type: DEPENDS_ON
  - from: D_SENSOR_AS_CAPABILITY
    to: Q_BOUNDARY
    edge_type: TRACES_TO
  # a evidência do north-star sustenta o fecho (deferir o produto enquanto não há pull frio)
  - from: E_NORTHSTAR
    to: D_SENSOR_AS_CAPABILITY
    edge_type: SUPPORTS
