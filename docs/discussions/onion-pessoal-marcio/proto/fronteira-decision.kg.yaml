    node_type: claim
    plane: DEV
    impact: 4
    confidence: 0.9
    status: confirmed
    label: "o Onion pessoal prova o MÉTODO (dogfood), não o MERCADO — é o centro da órbita (Q_COLD_ADOPTER intacto)"

  # ---- evidências (2 internas + 1 externa) que convergem ----
  - id: E_PRIVATE_INVIOLAVEL
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 0.95
    status: confirmed
    label: "trust adapter: 'private inviolável mesmo para o core' — privacidade NÃO exige sair da federação"
  - id: E_GRANAAI
    node_type: evidence
    plane: PROD
    impact: 4
    confidence: 0.9
