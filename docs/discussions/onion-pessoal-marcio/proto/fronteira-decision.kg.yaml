    plane: PROD
    impact: 4
    confidence: 0.85
    status: confirmed
    label: "arte externa 2026: híbrido local-first + 'share distilled, never raw' (federar store fracassou) — converge com a doutrina Onion"
  - id: E_ORBIT
    node_type: evidence
    plane: PROD
    impact: 5
    confidence: 0.95
    status: confirmed
    label: "caveat intra-órbita: adotantes = repos do Marcio; ZERO adotante frio (C_ORBIT_CAVEAT)"

