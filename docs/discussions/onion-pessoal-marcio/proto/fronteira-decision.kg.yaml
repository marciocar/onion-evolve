# Proto (sandbox) — a DECISÃO da P3 como grafo de AUDIT (epistêmico).
# PLAUSÍVEL/open — derivado de research/SYNTHESIS-P3.md. NÃO muta o members.yaml do core.
# Rode: bash .claude/validation/kg-radar.sh docs/discussions/onion-pessoal-marcio/proto/fronteira-decision.kg.yaml
# Espera: INTEGRIDADE exit 0; RECONCILIAÇÃO mostra os REFUTES (as 2 opções rejeitadas); camada domain ausente (é decisão pura).
#
# A tese da P3: "adotante × à parte" é FALSA DICOTOMIA — privacidade e federação são eixos independentes.
# A opção escolhida (membro pelo método, soberano no dado) tem 3 evidências (2 internas + 1 externa) que convergem.
meta:
  id: marcio-fronteira-core-p3
  date: 2026-07-12
nodes:
  - id: Q_FRONTEIRA
    node_type: question
    plane: DEV
    impact: 5
    confidence: 0.9
    status: open
    label: "o Onion pessoal é instância adotante na federação, ou algo à parte (privado)?"

  # ---- a resposta escolhida + as duas rejeitadas ----
  - id: C_MEMBRO_SOBERANO
    node_type: claim
    plane: DEV
    impact: 5
    confidence: 0.85
    status: confirmed
    label: "membro adotante PELO MÉTODO (standalone+regulated), soberano NO DADO (KG bruto private, só destilado sai)"
  - id: C_APARTE_INPLACE
    node_type: claim
    plane: DEV
    impact: 3
    confidence: 0.2
    status: refuted
    label: "ficar 'à parte' (--in-place, fora da federação) para ter privacidade"
  - id: C_BYPASS_CRIADOR
    node_type: claim
    plane: DEV
    impact: 3
    confidence: 0.15
    status: refuted
    label: "o criador-como-membro precisa de privilégio/bypass (role source ou trust irrestrito)"
