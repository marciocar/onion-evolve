# com projection_of apontando este arquivo. Editar à mão é permitido; o setup nunca o sobrescreve.
# GRAFO PILOTO do core (2026-10-27, dogfood da onda 1): o 1º contexto do Onion com grafo próprio. Gerado pelo
# setup sobre os tokens que já existiam e ajustado à mão em três pontos: o tema aponta docs/materials/theme.css
